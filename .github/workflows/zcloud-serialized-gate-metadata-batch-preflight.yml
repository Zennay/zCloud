name: zCloud serialized gate metadata batch preflight

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/zcloud_serialized_gate_metadata_batch_preflight.py"
      - "tests/test_zcloud_serialized_gate_metadata_batch_preflight.py"
      - ".github/workflows/zcloud-serialized-gate-metadata-batch-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: zcloud-serialized-gate-metadata-batch-preflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    if: >-
      github.event_name != 'pull_request' ||
      (github.actor == 'Zennay' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact candidate revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 1

      - name: Prove exact permanent zCloud runner
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(id -un)" = "ubuntu"
          test "$(hostname)" = "vps-bb300bba"
          python3 scripts/zcloud_vps_runner_guard.py --json

      - name: Run focused regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v tests.test_zcloud_serialized_gate_metadata_batch_preflight
          python3 -m py_compile scripts/zcloud_serialized_gate_metadata_batch_preflight.py

      - name: Build fresh bounded plan and live snapshot
        shell: bash
        env:
          REPO: ${{ github.repository }}
          PLAN: ${{ runner.temp }}/zcloud-serialized-gate-plan-current.json
          SNAPSHOT: ${{ runner.temp }}/zcloud-serialized-gate-batch-live.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          repo = os.environ["REPO"]
          plan_path = Path(os.environ["PLAN"])
          snapshot_path = Path(os.environ["SNAPSHOT"])
          markers = (
              "serialized",
              "keep unmerged",
              "integration window",
              "live writer",
              "production/control-plane window",
              "control-plane window",
          )

          def gh(path: str):
              proc = subprocess.run(
                  ["gh", "api", path],
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.DEVNULL,
                  text=True,
              )
              return json.loads(proc.stdout)

          current_main = str(gh(f"repos/{repo}/git/ref/heads/main")["object"]["sha"])
          retired = gh(f"repos/{repo}/pulls/576")
          successor = gh(f"repos/{repo}/pulls/1089")
          if str(retired["state"]) != "closed" or bool(retired.get("merged")):
              raise SystemExit("retired gate #576 no longer matches succession contract")
          successor_open = (
              str(successor["state"]) == "open"
              and not bool(successor.get("merged"))
          )
          if not successor_open:
              raise SystemExit("successor #1089 is no longer open")

          pulls = []
          complete = False
          for page in range(1, 7):
              batch = gh(
                  f"repos/{repo}/pulls?state=open&per_page=100&page={page}&sort=created&direction=asc"
              )
              if page == 6 and batch:
                  raise SystemExit("open PR inventory exceeds bounded limit of 500")
              pulls.extend(batch)
              if len(batch) < 100:
                  complete = True
                  break
          if not complete:
              raise SystemExit("open PR inventory completeness not proven")

          stale = []
          snapshot_pulls = []
          for item in pulls:
              number = int(item["number"])
              body = str(item.get("body") or "")
              lowered = body.lower()
              if number != 1089 and "#580" in lowered and any(m in lowered for m in markers):
                  if "#576" in lowered and "#1089" not in lowered:
                      stale.append(number)
              snapshot_pulls.append({
                  "number": number,
                  "state": str(item["state"]),
                  "draft": bool(item.get("draft")),
                  "head_sha": str(item["head"]["sha"]),
                  "body": body,
              })

          stale.sort()
          batches = []
          for offset in range(0, len(stale), 20):
              numbers = stale[offset:offset + 20]
              batches.append({
                  "batch_index": len(batches) + 1,
                  "count": len(numbers),
                  "pr_numbers": numbers,
              })

          plan = {
              "schema": "zcloud-serialized-gate-metadata-remediation-plan-v1",
              "repository": repo,
              "current_main_sha": current_main,
              "status": "remediation_needed" if stale else "clean",
              "primary_gate": 580,
              "retired_gate": 576,
              "successor_gate": 1089,
              "stale_reference_count": len(stale),
              "batch_size": 20,
              "batch_count": len(batches),
              "batches": batches,
              "requires_fresh_revalidation": True,
              "metadata_write_authorized": False,
              "merge_authorized": False,
              "deploy_authorized": False,
              "mutation_performed": False,
          }
          snapshot = {
              "schema": "zcloud-serialized-gate-metadata-batch-preflight-snapshot-v1",
              "repository": repo,
              "current_main_sha": current_main,
              "successor_gate": 1089,
              "successor_open": True,
              "pull_requests": snapshot_pulls,
          }
          plan_path.write_text(json.dumps(plan, sort_keys=True), encoding="utf-8")
          snapshot_path.write_text(json.dumps(snapshot, sort_keys=True), encoding="utf-8")
          print(
              "SERIALIZED_GATE_METADATA_BATCH_INPUT="
              f"main:{current_main}:open:{len(pulls)}:"
              f"stale:{len(stale)}:batches:{len(batches)}"
          )
          PY

      - name: Preflight first remediation batch read only
        shell: bash
        env:
          PLAN: ${{ runner.temp }}/zcloud-serialized-gate-plan-current.json
          SNAPSHOT: ${{ runner.temp }}/zcloud-serialized-gate-batch-live.json
          REPORT: ${{ runner.temp }}/zcloud-serialized-gate-metadata-batch-preflight.json
        run: |
          set -euo pipefail
          python3 scripts/zcloud_serialized_gate_metadata_batch_preflight.py             --plan "$PLAN"             --snapshot "$SNAPSHOT"             --batch-index 1             --require-ready             --json | tee "$REPORT"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path(os.environ["REPORT"]).read_text(encoding="utf-8"))
          assert payload["schema"] == "zcloud-serialized-gate-metadata-batch-preflight-v1"
          assert payload["status"] in {"ready_for_review", "clean"}
          assert payload["metadata_write_authorized"] is False
          assert payload["merge_authorized"] is False
          assert payload["deploy_authorized"] is False
          assert payload["mutation_performed"] is False
          assert payload["requires_fresh_revalidation"] is True
          assert payload["eligible_count"] <= 20
          print(
              "ZCLOUD_SERIALIZED_GATE_METADATA_BATCH_PREFLIGHT="
              f"status:{payload['status']}:"
              f"batch:{payload['batch_index']}:"
              f"eligible:{payload['eligible_count']}:"
              f"ineligible:{payload['ineligible_count']}:"
              "metadata_write_authorized:false"
          )
          PY

      - name: Upload sanitized batch preflight
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zcloud-serialized-gate-metadata-batch-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/zcloud-serialized-gate-metadata-batch-preflight.json
          if-no-files-found: error
          retention-days: 14
