name: zCloud self-project contract

on:
  pull_request:
    paths:
      - 'projects.json'
      - 'project-contracts.json'
      - 'resource-policy.json'
      - 'project-layout.json'
      - 'autonomy-policy.json'
      - 'scripts/zcloud_self_project_contract.py'
      - 'tests/test_self_project_contract.py'
      - 'tests/test_self_project_contract_workflow.py'
      - '.github/workflows/zcloud-self-project-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zcloud-self-project-contract-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Run self-project contract regressions
        run: python3 -m unittest -v tests.test_self_project_contract tests.test_self_project_contract_workflow
      - name: Audit repository contract
        run: python3 scripts/zcloud_self_project_contract.py
