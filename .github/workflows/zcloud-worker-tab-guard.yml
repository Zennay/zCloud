name: zCloud background-only worker tab guard
on:
  pull_request:
    paths:
      - firefox-extension/background.js
      - public/zcloud-worker.user.js
      - tests/test_worker_tab_spam_guard.js
      - tests/test_firefox_recovery_contract.js
      - tests/test_worker_tab_reuse.js
      - tests/test_worker_tab_identity_guard.js
      - tests/test_violentmonkey_send_tab_preservation.js
      - .github/workflows/zcloud-worker-tab-guard.yml
      - tests/test_worker_tab_guard_manual_install_20261014.py
  push:
    branches: [main, fix/worker-tab-spam-circuit-breaker-20261012]
    paths:
      - firefox-extension/background.js
      - public/zcloud-worker.user.js
      - tests/test_worker_tab_spam_guard.js
      - tests/test_firefox_recovery_contract.js
      - tests/test_worker_tab_reuse.js
      - tests/test_worker_tab_identity_guard.js
      - tests/test_violentmonkey_send_tab_preservation.js
      - .github/workflows/zcloud-worker-tab-guard.yml
      - tests/test_worker_tab_guard_manual_install_20261014.py
  workflow_dispatch:
    inputs:
      apply:
        description: "Owner-only install; false never changes the VPS"
        type: boolean
        required: true
        default: false
      confirm_sha:
        description: "Exact current main commit SHA"
        type: string
        required: true
permissions:
  contents: read

jobs:
  unit:
    name: Test bounded tab opening, focus and worker recovery
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true
      - name: JS syntax + existing recovery regression
        shell: bash
        run: |
          set -euo pipefail
          node --check firefox-extension/background.js
          node tests/test_worker_tab_spam_guard.js
          node tests/test_firefox_recovery_contract.js
          node tests/test_worker_tab_reuse.js
          node tests/test_worker_tab_identity_guard.js
          node tests/test_violentmonkey_send_tab_preservation.js
          python3 -m unittest -v tests.test_worker_tab_guard_manual_install_20261014
          echo "WORKER_TAB_SPAM_GUARD_GREEN=1"

  install:
    name: Install worker tab guard on VPS (do not kill live chats)
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'Zennay/zCloud' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'Zennay' &&
      github.triggering_actor == 'Zennay' &&
      github.run_attempt == 1 &&
      inputs.apply == true &&
      inputs.confirm_sha == github.sha
    needs: unit
    # Serialize live VPS writers with the canonical production release; do not cancel an active release.
    concurrency:
      group: zcloud-production-deploy
      cancel-in-progress: false
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          clean: true
      - name: Verify permanent zCloud runner before any live commands
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/zcloud_vps_runner_guard.py --json
      - name: Verify exact immutable main and authorized permanent runner
        env:
          APPLY: ${{ inputs.apply }}
          CONFIRM_SHA: ${{ inputs.confirm_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = Zennay/zCloud
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_ACTOR" = Zennay
          test "$GITHUB_TRIGGERING_ACTOR" = Zennay
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$APPLY" = true
          [[ "$CONFIRM_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$CONFIRM_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$CONFIRM_SHA"
          current_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          test -n "$current_main"
          test "$current_main" = "$CONFIRM_SHA"
          test "$(hostname -s)" = vps-bb300bba
          test "$(id -un)" = ubuntu
          python3 scripts/zcloud_vps_runner_guard.py --json
          echo "WORKER_TAB_OWNER_MANUAL_MAIN_VERIFIED=1"

      - name: Install verified worker browser background code
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          test "$(id -un)" = "ubuntu"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          # A queued VPS job may start long after the admission step: fail closed before any writes.
          current_main="$(timeout 15 git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          test -n "$current_main"
          test "$current_main" = "$GITHUB_SHA"
          test "$GITHUB_TRIGGERING_ACTOR" = Zennay
          test "$GITHUB_RUN_ATTEMPT" = 1
          runtime_root="/home/ubuntu/zennay-cloud"
          source="$runtime_root/firefox-extension"
          live="$HOME/snap/firefox/common/chatgpt-project-extension"
          # Never overwrite unreviewed local owner edits or redirect through
          # a symlink. An approved Actions SHA is not the runtime tree SHA.
          for guarded_path in "$runtime_root" "$source" "$source/background.js" "$live" "$live/background.js"; do
            if test -L "$guarded_path"; then
              echo "::error::Worker add-on path is a symlink; refusing live overwrite."
              exit 1
            fi
          done
          if test "$(GIT_OPTIONAL_LOCKS=0 git -C "$runtime_root" rev-parse --verify HEAD)" != "$GITHUB_SHA"; then
            echo "::error::Runtime checkout does not match approved main; leave owner files untouched."
            exit 1
          fi
          # Git inspection errors are UNKNOWN, never proof of a clean tree.
          if ! runtime_background_status="$(GIT_OPTIONAL_LOCKS=0 git -C "$runtime_root" status --porcelain=v1 --untracked-files=all -- firefox-extension/background.js)"; then
            echo "::error::Unable to inspect runtime worker background; refusing overwrite."
            exit 1
          fi
          if test -n "$runtime_background_status"; then
            echo "::error::Runtime worker background has uncommitted owner changes; refusing overwrite."
            exit 1
          fi
          if [ ! -f "$source/background.js" ] || [ ! -f "$live/background.js" ]; then
            echo "::error::Missing installed worker background; no blind creation."
            exit 1
          fi
          if [ ! -f "$source/manifest.json" ] || [ ! -f "$live/manifest.json" ]; then
            echo "Worker extension location differs from the verified VPS layout; refuse replacing unknown code."
            exit 1
          fi
          # Update the source and running extension profile independently,
          # without a service restart, cache eviction or tab reassignment.
          install -m 0644 firefox-extension/background.js "$source/background.js"
          install -m 0644 firefox-extension/background.js "$live/background.js"
          cmp firefox-extension/background.js "$source/background.js"
          cmp firefox-extension/background.js "$live/background.js"
          echo "WORKER_TAB_GUARD_INSTALLED=1"
          echo "Worker extension source installed; no active tabs touched during install."

      - name: Activate patch only when worker browser has a safe idle window
        shell: bash
        env:
          XDG_RUNTIME_DIR: /run/user/1000
          DBUS_SESSION_BUS_ADDRESS: unix:path=/run/user/1000/bus
        run: |
          set -euo pipefail
          # The active user session normally runs as standalone Violentmonkey
          # Firefox. systemd may be inactive even though a live Firefox with
          # the remote debugger is open. Detect the actual browser process
          # and hot-reload only the add-on, not the window or any tab.
          if ! ps -eo args= | grep -E '[f]irefox.*-start-debugger-server[[:space:]]+[0-9]+' >/dev/null; then
            echo "No running Firefox debugger: defer extension reload; never start a window."
            exit 0
          fi
          if ! python3 - <<'PY'
          import json
          import time
          import urllib.request

          def read():
              with urllib.request.urlopen("http://127.0.0.1:8765/api/runner-live",timeout=8) as response:
                  data=json.load(response)
              runners=data.get("chatgpt_runners")
              if not isinstance(runners,dict) or not runners:
                  raise ValueError("No reliable worker observations")
              workers=[w for p in runners.values() if isinstance(p,dict)
                       for w in (p.get("workers") or []) if isinstance(w,dict)]
              if not workers:
                  raise ValueError("No observed worker entries")
              identities=set()
              for worker in workers:
                  if not worker.get("active"):
                      continue
                  wid=str(worker.get("worker_id") or "")
                  if not wid or wid in identities:
                      raise ValueError("Worker identity incomplete/colliding")
                  identities.add(wid)
                  if worker.get("generating") or worker.get("sending") or worker.get("desired_state")=="draining":
                      raise ValueError("Worker is actively generating, sending or draining")
                  if ((worker.get("command") or {}).get("status")=="pending"):
                      raise ValueError("Command pending")
                  age=worker.get("age_seconds")
                  last=(worker.get("last_event") or {}).get("event")
                  if last in {"prompt-sent","generation-started"} and (age is None or age < 180):
                      raise ValueError("Recent generation not proven finished")
              return identities

          try:
              first=read()
              time.sleep(12)
              second=read()
              if first!=second:
                  raise ValueError("Worker allocation changed during idle window")
              print("SAFE_IDLE_WORKERS="+str(len(second)))
          except Exception as e:
              print("SKIP_WORKER_FIREFOX_RESTART="+str(e)[:200])
              raise SystemExit(1)
          PY
          then
            echo "Existing worker is busy/unknown: no forced browser restart. Patch will activate on next natural safe restart."
            exit 0
          fi
          # Reload only the extension, never terminate the visible Firefox
          # session. Defer activation if there is no debugger connection.
          # Revalidate current main immediately before in-place addon reload.
          test "$GITHUB_TRIGGERING_ACTOR" = Zennay
          test "$GITHUB_RUN_ATTEMPT" = 1
          current_main="$(timeout 15 git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          test -n "$current_main"
          test "$current_main" = "$GITHUB_SHA"
          if node scripts/zcloud_reload_extension.mjs; then
            echo "WORKER_TAB_GUARD_ACTIVATED_IN_PLACE=1"
          else
            echo "WORKER_TAB_GUARD_RELOAD_DEFERRED=1"
          fi
