name: Finalize FTMO Worker5 queue item

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-worker5-queue-finalize.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ftmo-worker5-queue-finalize
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: self-hosted
    timeout-minutes: 6
    steps:
      - name: Reverify merged package and live sealed runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          gh auth status >/dev/null 2>&1

          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          MERGE_SHA = "5c9a386a3c6a13ec8b6c576643874c50237667c9"
          EXACT_RUN = 36993099154
          DEPLOY_RUN = 36994271969

          def gh_json(path):
              raw = subprocess.check_output(
                  ["gh", "api", "-H", "X-GitHub-Api-Version: 2022-11-28", path],
                  text=True,
              )
              return json.loads(raw)

          exact = gh_json(f"repos/Zennay/zCloud/actions/runs/{EXACT_RUN}")
          deploy = gh_json(f"repos/Zennay/Ftmo/actions/runs/{DEPLOY_RUN}")
          if (exact.get("status"), exact.get("conclusion")) != ("completed", "success"):
              raise SystemExit(f"exact proof not green: {exact.get('status')}/{exact.get('conclusion')}")
          if (deploy.get("status"), deploy.get("conclusion")) != ("completed", "success"):
              raise SystemExit(f"deploy proof not green: {deploy.get('status')}/{deploy.get('conclusion')}")

          root = Path("/opt/ftmo-autonomous")
          status_path = root / ".scratch" / "autonomy" / "status.json"
          if not status_path.is_file() or status_path.is_symlink():
              raise SystemExit("live FTMO status missing or unsafe")
          status = json.loads(status_path.read_text(encoding="utf-8"))
          research = status.get("research") or {}
          controller = status.get("research_controller") or {}
          loop = controller.get("generation_loop") or {}
          outcome = controller.get("outcome_execution") or {}
          compute = controller.get("compute") or {}

          runtime_revision = str(status.get("runtime_revision") or "")
          if len(runtime_revision) != 40:
              raise SystemExit(f"invalid runtime revision: {runtime_revision!r}")
          ancestry = gh_json(f"repos/Zennay/Ftmo/compare/{MERGE_SHA}...{runtime_revision}")
          if ancestry.get("status") not in {"ahead", "identical"}:
              raise SystemExit(
                  f"live runtime does not contain Worker5 merge: {ancestry.get('status')}"
              )

          live_run_id = str(status.get("deployment_workflow_run_id") or "")
          if not live_run_id.isdigit():
              raise SystemExit(f"invalid live deployment run id: {live_run_id!r}")
          live_run = gh_json(f"repos/Zennay/Ftmo/actions/runs/{live_run_id}")
          if (live_run.get("status"), live_run.get("conclusion")) != ("completed", "success"):
              raise SystemExit("live deployment workflow is not green")

          required = {
              "research_cycle_ok": status.get("research_cycle_ok") is True,
              "generation_29": research.get("generation_number") == 29,
              "provider_foundation": research.get("next_stage") == "provider_foundation",
              "development_sealed": research.get("development_access_allowed") is False,
              "walk_forward_sealed": research.get("walk_forward_access_allowed") is False,
              "final_holdout_sealed": research.get("final_holdout_access_allowed") is False,
              "controller_retry": controller.get("action") == "provider_foundation_provider_unavailable_retry_later",
              "loop_retry": loop.get("action") == "provider_foundation_provider_unavailable_retry_later",
              "loop_stage": loop.get("stage") == "provider_foundation",
              "no_outcomes": loop.get("outcomes_executed") is False,
              "wf_not_accessed": loop.get("walk_forward_accessed") is False,
              "holdout_not_accessed": loop.get("final_holdout_accessed") is False,
              "live_false": status.get("live_trading_allowed") is False,
              "broker_false": status.get("broker_order_submission_allowed") is False,
              "controller_wf_false": outcome.get("walk_forward_accessed") is False,
              "controller_holdout_false": outcome.get("final_holdout_accessed") is False,
              "controller_broker_false": outcome.get("broker_order_submission_allowed") is False,
              "compute_ok": compute.get("ok") is True,
              "zero_cloud": str(status.get("autonomous_cloud_budget_usd")) == "0.00",
          }
          failed = [name for name, ok in required.items() if not ok]
          if failed:
              raise SystemExit("sealed runtime verification failed: " + ",".join(failed))

          state = subprocess.check_output(
              ["systemctl", "is-active", "ftmo-autonomous-marathon.service"], text=True
          ).strip()
          pid = subprocess.check_output(
              ["systemctl", "show", "ftmo-autonomous-marathon.service", "-p", "MainPID", "--value"],
              text=True,
          ).strip()
          if state != "active" or not pid.isdigit() or int(pid) <= 0:
              raise SystemExit(f"FTMO service unhealthy state={state!r} pid={pid!r}")

          print("FTMO_WORKER5_RUNTIME_GREEN=" + json.dumps({
              "merge_sha": MERGE_SHA,
              "exact_proof_run": EXACT_RUN,
              "exact_proof_conclusion": exact.get("conclusion"),
              "deploy_proof_run": DEPLOY_RUN,
              "deploy_proof_conclusion": deploy.get("conclusion"),
              "live_runtime_revision": runtime_revision,
              "live_deployment_run_id": live_run_id,
              "generation_number": research.get("generation_number"),
              "stage": research.get("next_stage"),
              "controller_action": controller.get("action"),
              "walk_forward_accessed": loop.get("walk_forward_accessed"),
              "final_holdout_accessed": loop.get("final_holdout_accessed"),
              "service_state": state,
              "service_pid": pid,
          }, sort_keys=True))
          PY

      - name: Finalize exact SQLite queue assignment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import importlib.util
          import json
          import sqlite3
          import sys
          from pathlib import Path

          queue_id = "ftmo-1c523ac7e47c9a6b"
          expected_project = "ftmo"
          live_root = Path("/home/ubuntu/zennay-cloud")
          server_path = live_root / "server.py"
          db_path = live_root / "history.db"
          if not server_path.is_file() or not db_path.is_file():
              raise SystemExit("live zCloud server/history.db missing")

          sys.path.insert(0, str(live_root))
          spec = importlib.util.spec_from_file_location("zcloud_live_server", server_path)
          if spec is None or spec.loader is None:
              raise SystemExit("cannot load live zCloud server module")
          server = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(server)
          server.DB = db_path

          with sqlite3.connect(db_path) as c:
              c.row_factory = sqlite3.Row
              row = c.execute(
                  "SELECT queue_id,project_id,title,status,eligible,worker_slot,evidence,updated_at "
                  "FROM portfolio_queue WHERE queue_id=?",
                  (queue_id,),
              ).fetchone()

          if row is None:
              raise SystemExit("queue item missing")
          item = dict(row)
          print("QUEUE_BEFORE=" + json.dumps(item, sort_keys=True))
          if item["project_id"] != expected_project:
              raise SystemExit(f"project mismatch: {item['project_id']}")

          evidence = (
              "Worker5 Gen29 provider-foundation package completed. PR #415 merged as "
              "5c9a386a3c6a13ec8b6c576643874c50237667c9 after exact-head VPS proof "
              "36993099154 SUCCESS (compile, targeted sealed-boundary tests, full memory-bounded suite). "
              "Branch-scoped stale CI cleanup 36994756932 SUCCESS cancelled 19 superseded runs while "
              "protecting canonical main runs. Canonical FTMO deploy/runtime verify 36994271969 SUCCESS "
              "deployed main descendant containing #415, restarted persistent marathon, observed fresh "
              "Generation 29 provider_foundation heartbeat, research_cycle_ok true, zero cloud budget, "
              "live/broker false, walk-forward/final-holdout unaccessed, and persisted controller receipt."
          )

          if item["status"] == "done":
              print("QUEUE_ALREADY_DONE=1")
          elif item["status"] in {"claimed", "running", "verifying", "in_progress"} and item["worker_slot"] is not None:
              result = server.portfolio_queue_finish(
                  int(item["worker_slot"]), queue_id, "DONE", evidence
              )
              print("QUEUE_FINISH_RESULT=" + json.dumps(result, sort_keys=True, default=str))
              if not result.get("updated"):
                  raise SystemExit("portfolio_queue_finish refused active assignment")
          else:
              raise SystemExit(
                  "refusing nonstandard queue mutation; "
                  f"status={item['status']} worker_slot={item['worker_slot']}"
              )

          with sqlite3.connect(db_path) as c:
              c.row_factory = sqlite3.Row
              after = c.execute(
                  "SELECT queue_id,project_id,status,eligible,worker_slot,evidence,updated_at "
                  "FROM portfolio_queue WHERE queue_id=?",
                  (queue_id,),
              ).fetchone()
          final = dict(after) if after else None
          print("QUEUE_AFTER=" + json.dumps(final, sort_keys=True))
          if not final or final["status"] != "done" or int(final["eligible"] or 0) != 0:
              raise SystemExit("queue final state is not done/eligible=0")
          print("ZCLOUD_SQLITE_QUEUE_FINALIZE_GREEN=1")
          PY
