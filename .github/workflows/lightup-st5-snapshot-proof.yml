name: LightUp ST5 snapshot proof

on:
  push:
    branches:
      - "ops/lightup-st5-snapshot-proof-20261006"
    paths:
      - ".github/workflows/lightup-st5-snapshot-proof.yml"

permissions:
  contents: read

concurrency:
  group: lightup-st5-snapshot-proof
  cancel-in-progress: true

jobs:
  verify:
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify permanent zCloud VPS runner
        run: python3 scripts/zcloud_vps_runner_guard.py --json

      - name: Verify exact LightUp snapshot candidates
        shell: bash
        env:
          LIGHTUP_REPO: /home/ubuntu/zennay-cloud/repos/lightup
        run: |
          set -euo pipefail
          test -d "${LIGHTUP_REPO}/.git"

          verify_candidate() {
            local branch="$1"
            local expected_sha="$2"
            local pattern="$3"
            local run_chain="$4"

            git -C "${LIGHTUP_REPO}" fetch --no-tags origin               "+refs/heads/${branch}:refs/remotes/origin/${branch}"
            local target_sha
            target_sha="$(git -C "${LIGHTUP_REPO}" rev-parse "refs/remotes/origin/${branch}^{commit}")"
            test "${target_sha}" = "${expected_sha}"

            local tmp_root snapshot
            tmp_root="$(mktemp -d)"
            snapshot="${tmp_root}/lightup"
            mkdir -p "${snapshot}"
            git -C "${LIGHTUP_REPO}" archive "${target_sha}" | tar -x -C "${snapshot}"

            (
              cd "${snapshot}"
              export PYTHONPATH=src:tests
              python3 -m compileall -q src tests
              python3 -m unittest discover -s tests -p "${pattern}" -v
              if [ "${run_chain}" = "yes" ]; then
                python3 -m unittest discover -s tests                   -p 'test_future_remediation_implementation_plan_review_chain_invariant.py' -v
                python3 -m unittest discover -s tests/integration -v
              fi
            )

            rm -rf "${tmp_root}"
            printf 'LIGHTUP_ST5_SNAPSHOT_PROOF branch=%s target_sha=%s host=%s\n'               "${branch}" "${target_sha}" "$(hostname)"
          }

          verify_candidate             "chatgpt/st5-implementation-plan-review-snapshot-isolation-20261006"             "afbbf3c6973553e46b7f74b668d2c2981939eda2"             "test_future_remediation_implementation_plan_review_snapshot_isolation.py"             "yes"

          verify_candidate             "chatgpt/st5-plan-review-request-snapshot-isolation-20261006"             "6f3219d623d6247168c41f87a34a89a832e4d189"             "test_future_remediation_implementation_plan_review_request_snapshot_isolation.py"             "no"
