name: LightUp ST5 snapshot proof

on:
  push:
    branches:
      - "ops/lightup-st5-snapshot-proof-20261006"
    paths:
      - ".github/workflows/lightup-st5-snapshot-proof.yml"

permissions:
  contents: read

concurrency:
  group: lightup-st5-snapshot-proof
  cancel-in-progress: true

jobs:
  verify:
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify permanent zCloud VPS runner
        run: python3 scripts/zcloud_vps_runner_guard.py --json

      - name: Verify exact LightUp snapshot candidate
        shell: bash
        env:
          LIGHTUP_REPO: /home/ubuntu/zennay-cloud/repos/lightup
          TARGET_BRANCH: chatgpt/st5-implementation-plan-review-snapshot-isolation-20261006
          EXPECTED_SHA: afbbf3c6973553e46b7f74b668d2c2981939eda2
        run: |
          set -euo pipefail
          test -d "${LIGHTUP_REPO}/.git"

          git -C "${LIGHTUP_REPO}" fetch --no-tags origin             "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          TARGET_SHA="$(git -C "${LIGHTUP_REPO}" rev-parse "refs/remotes/origin/${TARGET_BRANCH}^{commit}")"
          test "${TARGET_SHA}" = "${EXPECTED_SHA}"

          TMP_ROOT="$(mktemp -d)"
          trap 'rm -rf "${TMP_ROOT}"' EXIT
          SNAPSHOT="${TMP_ROOT}/lightup"
          mkdir -p "${SNAPSHOT}"
          git -C "${LIGHTUP_REPO}" archive "${TARGET_SHA}" | tar -x -C "${SNAPSHOT}"

          cd "${SNAPSHOT}"
          export PYTHONPATH=src:tests

          python3 -m compileall -q src tests
          python3 -m unittest discover -s tests             -p 'test_future_remediation_implementation_plan_review_snapshot_isolation.py' -v
          python3 -m unittest discover -s tests             -p 'test_future_remediation_implementation_plan_review_chain_invariant.py' -v
          python3 -m unittest discover -s tests/integration -v

          printf 'LIGHTUP_ST5_SNAPSHOT_PROOF target_sha=%s host=%s\n'             "${TARGET_SHA}" "$(hostname)"
