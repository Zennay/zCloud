name: zSSH VPS release runner
# dispatch-marker: aa50412

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/zssh-vps-release-runner.yml
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/zssh-vps-release-runner.yml
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zssh-vps-release-runner
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.actor == 'Zennay' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 15
    env:
      ZSSH_RELEASE_SHA: a7da44dc5442b2dd50147d43bf632305ec75ba68
      XDG_RUNTIME_DIR: /run/user/1000
      DBUS_SESSION_BUS_ADDRESS: unix:path=/run/user/1000/bus
    steps:
      - name: Check out zCloud control plane
        uses: actions/checkout@v4
        with:
          path: zcloud-control
          persist-credentials: false

      - name: Verify permanent VPS runner identity
        shell: bash
        run: |
          set -euo pipefail
          python3 zcloud-control/scripts/zcloud_vps_runner_guard.py --json
          test "$(hostname)" = "vps-bb300bba"

      - name: Check out exact green zSSH revision
        uses: actions/checkout@v4
        with:
          repository: Zennay/zSSH
          ref: ${{ env.ZSSH_RELEASE_SHA }}
          path: zssh-source
          persist-credentials: false

      - name: Verify release source and runner identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -un)" = ubuntu
          test "$(git -C zssh-source rev-parse HEAD)" = "$ZSSH_RELEASE_SHA"
          test -f zssh-source/oauth.mjs
          test -f zssh-source/pairing.mjs
          test -f zssh-source/submission/plugin.template.json
          echo "ZSSH_RELEASE_SOURCE_GREEN sha=$ZSSH_RELEASE_SHA runner=$RUNNER_NAME"

      - name: Run exact zSSH regression suite without deployment
        shell: bash
        run: |
          set -euo pipefail
          cd zssh-source
          test "$(git rev-parse HEAD)" = "$ZSSH_RELEASE_SHA"
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          echo "ZSSH_VPS_TEST_GREEN sha=$ZSSH_RELEASE_SHA runner=$RUNNER_NAME"
