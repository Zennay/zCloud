name: zSSH VPS release runner
# dispatch-marker: aa50412

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/zssh-vps-release-runner.yml
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/zssh-vps-release-runner.yml
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zssh-vps-release-runner
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push'
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 15
    env:
      ZSSH_RELEASE_SHA: aa50412cc057fb65744809de34942bf9603e0319
      XDG_RUNTIME_DIR: /run/user/1000
      DBUS_SESSION_BUS_ADDRESS: unix:path=/run/user/1000/bus
    steps:
      - name: Check out zCloud control plane
        uses: actions/checkout@v4
        with:
          path: zcloud-control
          persist-credentials: false

      - name: Verify permanent VPS runner identity
        shell: bash
        run: |
          set -euo pipefail
          python3 zcloud-control/scripts/zcloud_vps_runner_guard.py --json
          test "$(hostname)" = "vps-bb300bba"

      - name: Check out exact green zSSH revision
        uses: actions/checkout@v4
        with:
          repository: Zennay/zSSH
          ref: ${{ env.ZSSH_RELEASE_SHA }}
          path: zssh-source
          persist-credentials: false

      - name: Verify release source and runner identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -un)" = ubuntu
          test "$(git -C zssh-source rev-parse HEAD)" = "$ZSSH_RELEASE_SHA"
          test -f zssh-source/oauth.mjs
          test -f zssh-source/pairing.mjs
          test -f zssh-source/submission/plugin.template.json
          echo "ZSSH_RELEASE_SOURCE_GREEN sha=$ZSSH_RELEASE_SHA runner=$RUNNER_NAME"

      - name: Deploy and verify under exclusive local lock
        shell: bash
        env:
          ZSSH_EXPECTED_SHA: ${{ env.ZSSH_RELEASE_SHA }}
        run: |
          set -euo pipefail
          lock_dir="$HOME/.local/state/zssh"
          lock_file="$lock_dir/deploy.lock"
          mkdir -p "$lock_dir"
          exec 9>"$lock_file"
          if ! flock -w 60 9; then
            echo "ZSSH_DEPLOY_LOCK_BUSY file=$lock_file" >&2
            exit 75
          fi
          echo "ZSSH_DEPLOY_LOCK_ACQUIRED file=$lock_file"

          bash zssh-source/deploy/install-live.sh "$GITHUB_WORKSPACE/zssh-source"

          current="$(readlink -f /home/ubuntu/.local/share/zssh/current)"
          expected="/home/ubuntu/.local/share/zssh/releases/$ZSSH_RELEASE_SHA"
          test "$current" = "$expected"
          systemctl --user is-active --quiet zssh.service
          curl --fail --silent --show-error http://127.0.0.1:8788/health
          test -f "$current/oauth.mjs"
          test -f "$current/pairing.mjs"
          test -f "$current/submission/plugin.template.json"
          echo "ZSSH_LIVE_PROVENANCE_GREEN sha=$ZSSH_RELEASE_SHA"

          set -a
          source /home/ubuntu/.config/zssh/gateway.env
          set +a
          test -n "$ZSSH_API_KEY"
          test -n "$ZSSH_MCP_CAPABILITY_TOKEN"

          ZSSH_MCP_URL="https://198.244.191.182/mcp" \
          ZSSH_MCP_API_KEY="$ZSSH_API_KEY" \
          ZSSH_MCP_CAPABILITY_TOKEN="" \
          node /home/ubuntu/.local/share/zssh/current/mcp-claude-canary.mjs

          ZSSH_MCP_URL="https://198.244.191.182/mcp" \
          ZSSH_MCP_API_KEY="" \
          ZSSH_MCP_CAPABILITY_TOKEN="$ZSSH_MCP_CAPABILITY_TOKEN" \
          node /home/ubuntu/.local/share/zssh/current/mcp-claude-canary.mjs

          echo "ZSSH_HOSTED_CLIENT_CANARIES_GREEN"
          echo "ZSSH_DEPLOY_GREEN sha=$ZSSH_RELEASE_SHA runner=$RUNNER_NAME"


  pr_proof:
    if: >-
      github.event_name == 'pull_request' &&
      github.actor == 'Zennay' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 15
    env:
      ZSSH_PROOF_SHA: be7a74fcce87d31706cfa1b8b45ade614cc7127d
    steps:
      - name: Check out zCloud control plane for proof
        uses: actions/checkout@v4
        with:
          path: zcloud-proof-control
          persist-credentials: false

      - name: Verify permanent VPS runner identity for proof
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 zcloud-proof-control/scripts/zcloud_vps_runner_guard.py --json
          test "$(hostname)" = "vps-bb300bba"

      - name: Check out exact zSSH proof revision
        uses: actions/checkout@v4
        with:
          repository: Zennay/zSSH
          ref: ${{ env.ZSSH_PROOF_SHA }}
          path: zssh-proof
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact zSSH proof source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C zssh-proof rev-parse HEAD)" = "$ZSSH_PROOF_SHA"
          echo "runner=$RUNNER_NAME"
          echo "hostname=$(hostname)"
          echo "sha=$ZSSH_PROOF_SHA"
          node --version
          npm --version

      - name: Install locked zSSH proof dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          cd zssh-proof
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Run zSSH proof tests
        shell: bash
        run: |
          set -Eeuo pipefail
          cd zssh-proof
          npm test
          node --test             test/release-provenance-verifier.test.mjs             test/install-live-stage-provenance.test.mjs             test/release-workflow-trigger.test.mjs
          bash -n deploy/install-live.sh
          bash -n deploy/install-public-gateway.sh
          bash -n deploy/install-target-agent.sh
          node --check scripts/verify-release-provenance.mjs
          echo "ZSSH_PR274_RELEASE_PROVENANCE_VPS_PROOF_GREEN"
