name: Recover duplicate zCloud Actions listener

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/zcloud-runner-temp-recovery-20261004.yml"

permissions:
  contents: read

concurrency:
  group: zcloud-runner-temp-recovery-20261004-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  schedule-recovery:
    if: github.actor == 'Zennay'
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 3
    steps:
      - name: Schedule guarded post-job duplicate-listener recovery
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = "vps-bb300bba"
          test "${RUNNER_NAME:-}" = "zcloud-vps-1"

          script="/tmp/zcloud-runner-listener-recovery-${GITHUB_RUN_ID}.sh"
          unit="zcloud-runner-listener-recovery-${GITHUB_RUN_ID}"

          cat >"$script" <<'RECOVERY'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          service="actions.runner.Zennay-zCloud.zcloud-vps-1.service"
          runner_root="/home/ubuntu/actions-runner-zcloud"
          temp_root="$runner_root/_work/_temp"

          proc_cmdline() {
            local pid="$1"
            tr '\0' ' ' < "/proc/$pid/cmdline" 2>/dev/null || true
          }

          proc_cgroup() {
            local pid="$1"
            cat "/proc/$pid/cgroup" 2>/dev/null || true
          }

          runner_worker_pids() {
            for proc in /proc/[0-9]*; do
              pid="${proc##*/}"
              cmd="$(proc_cmdline "$pid")"
              [[ "$cmd" == *"$runner_root/bin/Runner.Worker"* ]] && echo "$pid"
            done
          }

          listener_pids() {
            for proc in /proc/[0-9]*; do
              pid="${proc##*/}"
              cmd="$(proc_cmdline "$pid")"
              [[ "$cmd" == *"$runner_root/bin/Runner.Listener"* ]] && echo "$pid"
            done
          }

          supervisor_pids() {
            for proc in /proc/[0-9]*; do
              pid="${proc##*/}"
              cmd="$(proc_cmdline "$pid")"
              case "$cmd" in
                *"$runner_root/runsvc.sh"*|*"$runner_root/bin/RunnerService"*|*"$runner_root/run.sh"*)
                  echo "$pid"
                  ;;
              esac
            done
          }

          # Never interrupt an executing zCloud Actions job. The transient recovery
          # unit is independent of the runner service and starts only after the
          # scheduling job has exited.
          workers=""
          for _ in $(seq 1 120); do
            workers="$(runner_worker_pids | xargs echo -n || true)"
            [[ -z "$workers" ]] && break
            echo "ZCLOUD_RUNNER_RECOVERY_WAIT workers=$workers"
            sleep 2
          done
          if [[ -n "$workers" ]]; then
            echo "ZCLOUD_RUNNER_RECOVERY_ABORT active_workers=$workers" >&2
            exit 75
          fi

          echo "ZCLOUD_RUNNER_RECOVERY_PRE service_state=$(systemctl is-active "$service" || true) listeners=$(listener_pids | xargs echo -n || true) supervisors=$(supervisor_pids | xargs echo -n || true)"

          # Stop the canonical service first. With no Runner.Worker alive this is
          # safe and removes ambiguity about which listener lineage is canonical.
          systemctl stop "$service"
          for _ in $(seq 1 30); do
            state="$(systemctl is-active "$service" || true)"
            [[ "$state" != "active" && "$state" != "activating" && "$state" != "deactivating" ]] && break
            sleep 1
          done

          # Remove only processes whose own command line is rooted in this exact
          # runner installation. Other project runners and zCloud runtime/browser
          # processes are out of scope and untouched.
          mapfile -t leftovers < <({ listener_pids; supervisor_pids; } | sort -u)
          for pid in "${leftovers[@]}"; do
            cmd="$(proc_cmdline "$pid")"
            [[ "$cmd" == *"$runner_root/"* ]] || {
              echo "ZCLOUD_RUNNER_RECOVERY_ABORT unsafe_pid=$pid cmd=$cmd" >&2
              exit 76
            }
            echo "ZCLOUD_RUNNER_RECOVERY_TERM pid=$pid cmd=$cmd"
            kill -TERM "$pid" 2>/dev/null || true
          done

          for _ in $(seq 1 20); do
            mapfile -t leftovers < <({ listener_pids; supervisor_pids; } | sort -u)
            [[ "${#leftovers[@]}" -eq 0 ]] && break
            sleep 1
          done
          mapfile -t leftovers < <({ listener_pids; supervisor_pids; } | sort -u)
          if [[ "${#leftovers[@]}" -ne 0 ]]; then
            for pid in "${leftovers[@]}"; do
              cmd="$(proc_cmdline "$pid")"
              [[ "$cmd" == *"$runner_root/"* ]] || exit 77
              echo "ZCLOUD_RUNNER_RECOVERY_KILL pid=$pid cmd=$cmd"
              kill -KILL "$pid" 2>/dev/null || true
            done
            sleep 2
          fi

          mapfile -t leftovers < <({ listener_pids; supervisor_pids; } | sort -u)
          [[ "${#leftovers[@]}" -eq 0 ]] || {
            echo "ZCLOUD_RUNNER_RECOVERY_ABORT residual=${leftovers[*]}" >&2
            exit 78
          }
          [[ -z "$(runner_worker_pids | xargs echo -n || true)" ]] || exit 79

          # _work/_temp is runner-owned ephemeral state. Recreate it only while
          # every zCloud listener/worker is stopped, eliminating stale command
          # files without touching the repository workspace or live application.
          rm -rf -- "$temp_root"
          install -d -o ubuntu -g ubuntu -m 0755 "$temp_root"

          systemctl start "$service"
          service_cgroup=""
          listeners=()
          for _ in $(seq 1 30); do
            systemctl is-active --quiet "$service" || { sleep 1; continue; }
            service_cgroup="$(systemctl show "$service" -p ControlGroup --value)"
            mapfile -t listeners < <(listener_pids)
            if [[ "${#listeners[@]}" -eq 1 ]] && [[ -n "$service_cgroup" ]] && proc_cgroup "${listeners[0]}" | grep -Fq "$service_cgroup"; then
              break
            fi
            sleep 1
          done

          mapfile -t listeners < <(listener_pids)
          [[ "${#listeners[@]}" -eq 1 ]] || {
            echo "ZCLOUD_RUNNER_RECOVERY_ABORT final_listener_count=${#listeners[@]} listeners=${listeners[*]:-none}" >&2
            exit 80
          }
          service_cgroup="$(systemctl show "$service" -p ControlGroup --value)"
          [[ -n "$service_cgroup" && "$service_cgroup" != "/" ]]
          proc_cgroup "${listeners[0]}" | grep -Fq "$service_cgroup"
          systemctl is-active --quiet "$service"

          sentinel="$temp_root/.zcloud-listener-recovery-$(date -u +%s)"
          event_probe="$temp_root/.zcloud-event-probe-$(date -u +%s)"
          sudo -u ubuntu touch "$sentinel" "$event_probe"
          sleep 12
          test -f "$sentinel"
          test -f "$event_probe"
          rm -f "$sentinel" "$event_probe"

          echo "ZCLOUD_RUNNER_RECOVERY_GREEN listener=${listeners[0]} cgroup=$service_cgroup temp_owner=$(stat -c '%U:%G' "$temp_root")"
          RECOVERY

          chmod 0755 "$script"
          sudo -n systemd-run \
            --unit="$unit" \
            --on-active=8s \
            --property=Type=oneshot \
            /bin/bash "$script"

          systemctl status "$unit.timer" --no-pager || true
          echo "ZCLOUD_RUNNER_RECOVERY_SCHEDULED unit=$unit"
