name: Recover zCloud Actions runner temp state

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/zcloud-runner-temp-recovery-20261004.yml"

permissions:
  contents: read

concurrency:
  group: zcloud-runner-temp-recovery-20261004-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  schedule-recovery:
    if: github.actor == 'Zennay'
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 3
    steps:
      - name: Schedule guarded post-job runner temp recovery
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = "vps-bb300bba"
          test "${RUNNER_NAME:-}" = "zcloud-vps-1"

          service="actions.runner.Zennay-zCloud.zcloud-vps-1.service"
          runner_root="/home/ubuntu/actions-runner-zcloud"
          script="/tmp/zcloud-runner-temp-recovery-${GITHUB_RUN_ID}.sh"
          unit="zcloud-runner-temp-recovery-${GITHUB_RUN_ID}"

          cat >"$script" <<'RECOVERY'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          service="actions.runner.Zennay-zCloud.zcloud-vps-1.service"
          runner_root="/home/ubuntu/actions-runner-zcloud"
          temp_root="$runner_root/_work/_temp"
          recovery_root="/home/ubuntu/.local/state/zcloud/runner-temp-recovery"
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"

          for _ in $(seq 1 60); do
            cgroup="$(systemctl show "$service" -p ControlGroup --value || true)"
            worker_active=0
            for proc in /proc/[0-9]*; do
              test -r "$proc/cgroup" || continue
              test -r "$proc/cmdline" || continue
              if [[ -n "$cgroup" && "$cgroup" != "/" ]] && grep -Fq "$cgroup" "$proc/cgroup"; then
                cmdline="$(tr '\0' ' ' < "$proc/cmdline" 2>/dev/null || true)"
                if [[ "$cmdline" == *"Runner.Worker"* ]]; then
                  worker_active=1
                  break
                fi
              fi
            done
            [[ "$worker_active" -eq 0 ]] && break
            sleep 2
          done

          if [[ "$worker_active" -ne 0 ]]; then
            echo "ZCLOUD_RUNNER_RECOVERY_ABORT active_worker=1" >&2
            exit 75
          fi

          mkdir -p "$recovery_root"
          chown ubuntu:ubuntu "$recovery_root"
          if [[ -d "$temp_root" ]]; then
            backup="$recovery_root/temp.$stamp"
            mv "$temp_root" "$backup"
            echo "ZCLOUD_TEMP_BACKUP=$backup"
          fi
          install -d -o ubuntu -g ubuntu -m 0755 "$temp_root"

          systemctl reset-failed "$service" || true
          systemctl restart "$service"

          post_state=""
          post_pid=""
          for _ in $(seq 1 30); do
            post_state="$(systemctl is-active "$service" || true)"
            post_pid="$(systemctl show "$service" -p MainPID --value || true)"
            if [[ "$post_state" == "active" && "$post_pid" =~ ^[1-9][0-9]*$ ]] && test -r "/proc/$post_pid/cmdline"; then
              cmdline="$(tr '\0' ' ' < "/proc/$post_pid/cmdline")"
              if [[ "$cmdline" == *"Runner.Listener"* || "$cmdline" == *"runsvc.sh"* ]]; then
                break
              fi
            fi
            sleep 2
          done

          test "$post_state" = "active"
          [[ "$post_pid" =~ ^[1-9][0-9]*$ ]]
          test "$(stat -c '%U:%G' "$temp_root")" = "ubuntu:ubuntu"
          sentinel="$temp_root/.zcloud-recovery-sentinel-$stamp"
          sudo -u ubuntu touch "$sentinel"
          sleep 8
          test -f "$sentinel"
          rm -f "$sentinel"
          echo "ZCLOUD_RUNNER_RECOVERY_GREEN state=$post_state pid=$post_pid temp_owner=$(stat -c '%U:%G' "$temp_root")"
          RECOVERY

          chmod 0755 "$script"
          sudo -n systemd-run             --unit="$unit"             --on-active=8s             --property=Type=oneshot             /bin/bash "$script"

          systemctl status "$unit.timer" --no-pager || true
          echo "ZCLOUD_RUNNER_RECOVERY_SCHEDULED unit=$unit service=$service"
