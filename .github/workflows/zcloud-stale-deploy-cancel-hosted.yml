name: Cancel stale zCloud guarded deploys
on:
  workflow_run:
    workflows: ["zCloud regression smoke"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - ".github/workflows/zcloud-stale-deploy-cancel-hosted.yml"
      - "tests/test_zcloud_stale_deploy_cancel_hosted_workflow.py"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cancel-stale:
    if: >
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cancel only superseded guarded deploy runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          test -n "$current_main"
          echo "ZCLOUD_STALE_DEPLOY_CURRENT_MAIN=$current_main"

          mapfile -t deploy_runs < <(
            gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/zcloud-vps-deploy.yml/runs?per_page=100" \
              --paginate \
              --jq '.workflow_runs[] | [.id, .status, .head_sha] | @tsv'
          )

          current_guard_ids=()
          current_in_progress_ids=()
          current_waiting_ids=()
          keeper_current_waiting=""
          for row in "${deploy_runs[@]}"; do
            IFS=$'\t' read -r run_id status head_sha <<<"$row"
            [[ -n "$run_id" ]] || continue
            [[ "$head_sha" == "$current_main" ]] || continue
            case "$status" in
              in_progress)
                current_guard_ids+=("$run_id")
                current_in_progress_ids+=("$run_id")
                ;;
              queued|pending|waiting|requested)
                current_guard_ids+=("$run_id")
                current_waiting_ids+=("$run_id")
                if [[ -z "$keeper_current_waiting" || "$run_id" -gt "$keeper_current_waiting" ]]; then
                  keeper_current_waiting="$run_id"
                fi
                ;;
            esac
          done

          guardless_superseded_cleanup=false
          if [[ "${#current_guard_ids[@]}" -eq 0 ]]; then
            if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
              trigger_sha="$(jq -r '.workflow_run.head_sha // empty' "$GITHUB_EVENT_PATH")"
              trigger_branch="$(jq -r '.workflow_run.head_branch // empty' "$GITHUB_EVENT_PATH")"
              trigger_conclusion="$(jq -r '.workflow_run.conclusion // empty' "$GITHUB_EVENT_PATH")"
              if [[ "$trigger_sha" == "$current_main" && "$trigger_branch" == "main" && "$trigger_conclusion" == "success" ]]; then
                guardless_superseded_cleanup=true
                echo "ZCLOUD_STALE_DEPLOY_GREEN_TRIGGER_GUARDLESS sha=$current_main"
              else
                echo "ZCLOUD_STALE_DEPLOY_NO_CURRENT_GUARD sha=$current_main"
                exit 0
              fi
            else
              echo "ZCLOUD_STALE_DEPLOY_NO_CURRENT_GUARD sha=$current_main"
              exit 0
            fi
          fi

          # Never cancel a production transaction that already started. If one
          # exists, it is the authoritative guard and every waiting same-SHA
          # duplicate is stale. Otherwise keep only the newest waiting run.
          if [[ "${#current_guard_ids[@]}" -gt 0 ]]; then
            if [[ "${#current_in_progress_ids[@]}" -gt 0 ]]; then
              keeper_current_waiting=""
              echo "ZCLOUD_STALE_DEPLOY_CURRENT_IN_PROGRESS count=${#current_in_progress_ids[@]}"
            else
              test -n "$keeper_current_waiting"
              echo "ZCLOUD_STALE_DEPLOY_KEEP_CURRENT_NEWEST run_id=$keeper_current_waiting sha=$current_main"
            fi
          fi

          for row in "${deploy_runs[@]}"; do
            IFS=$'\t' read -r run_id status head_sha <<<"$row"
            [[ -n "$run_id" ]] || continue

            # Never interrupt an active production transaction. Cleanup is only
            # for stale waiting work; in-progress deploys keep their safe-idle /
            # promotion / receipt sequence intact even if main moves.
            case "$status" in
              queued|pending|waiting|requested)
                ;;
              in_progress)
                echo "ZCLOUD_STALE_DEPLOY_KEEP_IN_PROGRESS run_id=$run_id sha=$head_sha"
                continue
                ;;
              *)
                continue
                ;;
            esac

            if [[ "$head_sha" == "$current_main" && "$run_id" == "$keeper_current_waiting" ]]; then
              echo "ZCLOUD_STALE_DEPLOY_KEEP_CURRENT_NEWEST run_id=$run_id sha=$head_sha status=$status"
              continue
            fi
            if [[ "$head_sha" == "$current_main" ]]; then
              echo "ZCLOUD_STALE_DEPLOY_DUPLICATE_CURRENT_CANDIDATE run_id=$run_id sha=$head_sha status=$status"
            fi

            latest_main="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
            if [[ "$latest_main" != "$current_main" ]]; then
              echo "ZCLOUD_STALE_DEPLOY_MAIN_MOVED_ABORT expected=$current_main actual=$latest_main"
              exit 0
            fi

            authoritative_guard_active=false
            if [[ "$guardless_superseded_cleanup" == "true" ]]; then
              authoritative_guard_active=true
              echo "ZCLOUD_STALE_DEPLOY_GREEN_TRIGGER_AUTHORIZES_SUPERSEDED_CANCEL sha=$current_main"
            elif [[ -n "$keeper_current_waiting" ]]; then
              guard_status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$keeper_current_waiting" --jq .status)"
              case "$guard_status" in
                queued|in_progress|pending|waiting|requested)
                  authoritative_guard_active=true
                  ;;
              esac
            else
              for guard_id in "${current_in_progress_ids[@]}"; do
                guard_status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$guard_id" --jq .status)"
                if [[ "$guard_status" == "in_progress" ]]; then
                  authoritative_guard_active=true
                  break
                fi
              done
            fi
            if [[ "$authoritative_guard_active" != "true" ]]; then
              echo "ZCLOUD_STALE_DEPLOY_CURRENT_GUARD_GONE_ABORT sha=$current_main"
              exit 0
            fi

            fresh="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$run_id")"
            fresh_status="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])' <<<"$fresh")"
            fresh_sha="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["head_sha"])' <<<"$fresh")"

            case "$fresh_status" in
              queued|pending|waiting|requested)
                ;;
              in_progress)
                echo "ZCLOUD_STALE_DEPLOY_KEEP_IN_PROGRESS run_id=$run_id sha=$fresh_sha"
                continue
                ;;
              *)
                echo "ZCLOUD_STALE_DEPLOY_ALREADY_TERMINAL run_id=$run_id status=$fresh_status"
                continue
                ;;
            esac

            if [[ "$fresh_sha" == "$current_main" && "$run_id" == "$keeper_current_waiting" ]]; then
              echo "ZCLOUD_STALE_DEPLOY_KEEP_CURRENT_NEWEST run_id=$run_id sha=$fresh_sha status=$fresh_status"
              continue
            fi

            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/$run_id/cancel" >/dev/null
            if [[ "$fresh_sha" == "$current_main" ]]; then
              echo "ZCLOUD_STALE_DEPLOY_CANCEL_DUPLICATE_CURRENT run_id=$run_id sha=$fresh_sha status=$fresh_status"
            else
              echo "ZCLOUD_STALE_DEPLOY_CANCEL_REQUESTED run_id=$run_id sha=$fresh_sha status=$fresh_status"
            fi
          done
