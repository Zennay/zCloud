name: Supa PLUS rendered catalog-offers evidence

on:
  pull_request:
    paths:
      - ".github/workflows/supa-plus-rendered-listings.yml"

concurrency:
  group: supa-plus-rendered-listings-evidence
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  render-plus-listings:
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 10
    env:
      SUPA_SHA: 2378d34e36ed199505bd3a535458d7869a3a5b4e
      PLUS_CATALOG_URL: https://www.plus.nl/producten
      PLUS_OFFERS_URL: https://www.plus.nl/aanbiedingen
    steps:
      - name: Verify bounded browser route
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          test -x /usr/bin/firefox
          command -v geckodriver
          firefox --version
          geckodriver --version > /tmp/supa-geckodriver-version.txt
          sed -n '1p' /tmp/supa-geckodriver-version.txt
          echo "runner=$RUNNER_NAME"
          echo "supa_sha=$SUPA_SHA"
          echo "catalog=$PLUS_CATALOG_URL"
          echo "offers=$PLUS_OFFERS_URL"

      - name: Check out exact current Supa M1 stacked head
        uses: actions/checkout@v4
        with:
          repository: Zennay/Supa
          ref: 2378d34e36ed199505bd3a535458d7869a3a5b4e
          path: supa-exact
          persist-credentials: false

      - name: Verify exact Supa source identity
        shell: bash
        working-directory: supa-exact
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "expected=$SUPA_SHA"
          echo "actual=$actual"
          test "$actual" = "$SUPA_SHA"

      - name: Render bounded public PLUS listing pages
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/plus-rendered-listings"
          mkdir -p "$out"

          geckodriver --port 4444 --log debug >"$out/geckodriver.log" 2>&1 &
          driver_pid=$!
          cleanup() {
            kill "$driver_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4444/status >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4444/status >"$out/webdriver-status.json"

          cat >"$out/render.mjs" <<'NODE'
          import { createHash } from 'node:crypto'
          import { writeFile } from 'node:fs/promises'

          const base = 'http://127.0.0.1:4444'
          const out = process.env.RENDER_OUT
          const targets = [
            { id: 'catalog', kind: 'catalog', url: process.env.PLUS_CATALOG_URL },
            { id: 'offers', kind: 'offers', url: process.env.PLUS_OFFERS_URL },
          ]

          async function request(path, options = {}) {
            const response = await fetch(base + path, {
              ...options,
              headers: {
                'content-type': 'application/json',
                ...(options.headers || {}),
              },
            })
            const text = await response.text()
            let body
            try { body = JSON.parse(text) } catch { body = { raw: text } }
            if (!response.ok || body?.value?.error) {
              throw new Error('WebDriver ' + path + ' failed: ' + response.status + ' ' + text)
            }
            return body
          }

          function assertBoundedPublicPlusUrl(value) {
            const url = new URL(value)
            if (url.protocol !== 'https:' || url.hostname !== 'www.plus.nl') {
              throw new Error('Unexpected PLUS URL: ' + value)
            }
          }

          const created = await request('/session', {
            method: 'POST',
            body: JSON.stringify({
              capabilities: {
                alwaysMatch: {
                  browserName: 'firefox',
                  acceptInsecureCerts: false,
                  'moz:firefoxOptions': { args: ['-headless'] },
                },
              },
            }),
          })

          const sessionId = created.value?.sessionId
          if (!sessionId) throw new Error('No WebDriver session id')

          const results = []
          try {
            for (const target of targets) {
              assertBoundedPublicPlusUrl(target.url)

              await request('/session/' + sessionId + '/url', {
                method: 'POST',
                body: JSON.stringify({ url: target.url }),
              })

              const samples = []
              let lastLength = -1
              let stable = 0
              for (let i = 0; i < 20; i += 1) {
                await new Promise((resolve) => setTimeout(resolve, 1000))
                const state = await request('/session/' + sessionId + '/execute/sync', {
                  method: 'POST',
                  body: JSON.stringify({
                    script: [
                      'return {',
                      'readyState: document.readyState,',
                      'href: location.href,',
                      'title: document.title,',
                      'htmlLength: document.documentElement?.outerHTML?.length || 0,',
                      'textLength: document.body?.innerText?.length || 0,',
                      'textPreview: (document.body?.innerText || "").slice(0, 1200)',
                      '}',
                    ].join(' '),
                    args: [],
                  }),
                })
                samples.push({ second: i + 1, ...state.value })
                if (
                  state.value?.readyState === 'complete' &&
                  state.value?.htmlLength === lastLength
                ) {
                  stable += 1
                } else {
                  stable = 0
                }
                lastLength = state.value?.htmlLength ?? -1
                if (stable >= 2 && i >= 5) break
              }

              const current = await request('/session/' + sessionId + '/url')
              assertBoundedPublicPlusUrl(current.value)

              const sourceResponse = await request('/session/' + sessionId + '/source')
              const screenshotResponse = await request('/session/' + sessionId + '/screenshot')
              const html = sourceResponse.value
              const screenshot = Buffer.from(screenshotResponse.value, 'base64')
              const renderedHtmlSha256 = createHash('sha256')
                .update(html, 'utf8')
                .digest('hex')
              const capturedAt = new Date().toISOString()

              await writeFile(out + '/plus-' + target.id + '-rendered.html', html, 'utf8')
              await writeFile(out + '/plus-' + target.id + '-rendered.png', screenshot)

              const result = {
                schemaVersion: 1,
                evidenceType: 'browser-rendered-public-page',
                supermarket: 'plus',
                sourceKind: target.kind,
                requestedUrl: target.url,
                finalUrl: current.value,
                capturedAt,
                renderedHtmlSha256,
                renderedHtmlBytes: Buffer.byteLength(html, 'utf8'),
                screenshotBytes: screenshot.length,
                browser: 'Firefox 157.0',
                driver: 'geckodriver 0.37.1',
                supaSha: process.env.SUPA_SHA,
                safety: {
                  login: false,
                  credentials: false,
                  privateApiCalls: false,
                  networkInterception: false,
                  antiBotBypass: false,
                  recursiveCrawl: false,
                  targetCount: 2,
                },
                samples,
              }
              results.push(result)
              await writeFile(
                out + '/plus-' + target.id + '-metadata.json',
                JSON.stringify(result, null, 2) + '\n',
                'utf8',
              )
            }

            await writeFile(
              out + '/metadata.json',
              JSON.stringify(
                {
                  schemaVersion: 1,
                  milestone: 'M1 Data Feasibility',
                  supaSha: process.env.SUPA_SHA,
                  targetCount: results.length,
                  results,
                },
                null,
                2,
              ) + '\n',
              'utf8',
            )
          } finally {
            await request('/session/' + sessionId, { method: 'DELETE' }).catch(() => {})
          }
          NODE

          RENDER_OUT="$out" node "$out/render.mjs"

      - name: Inspect rendered structure without source-specific selectors
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/plus-rendered-listings"

          cat >"$out/inspect.mjs" <<'NODE'
          import { createHash } from 'node:crypto'
          import { readFile, writeFile } from 'node:fs/promises'

          const out = process.env.RENDER_OUT
          const targets = ['catalog', 'offers']

          function collectJsonLdTypes(value, counts) {
            if (Array.isArray(value)) {
              for (const item of value) collectJsonLdTypes(item, counts)
              return
            }
            if (!value || typeof value !== 'object') return
            const type = value['@type']
            if (typeof type === 'string') {
              counts[type] = (counts[type] || 0) + 1
            } else if (Array.isArray(type)) {
              for (const item of type) {
                if (typeof item === 'string') counts[item] = (counts[item] || 0) + 1
              }
            }
            for (const child of Object.values(value)) collectJsonLdTypes(child, counts)
          }

          function scriptBodies(html, type) {
            const escaped = type.replace(/[.*+?^$()|[\]\\]/g, '\\$&')
            const regex = new RegExp(
              '<script\\b[^>]*type=["\\\']' + escaped + '["\\\'][^>]*>([\\s\\S]*?)<\\/script>',
              'gi',
            )
            return [...html.matchAll(regex)].map((match) => match[1].trim())
          }

          const reports = []
          for (const id of targets) {
            const html = await readFile(out + '/plus-' + id + '-rendered.html', 'utf8')
            const text = html
              .replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi, ' ')
              .replace(/<style\b[^>]*>[\s\S]*?<\/style>/gi, ' ')
              .replace(/<[^>]+>/g, ' ')
              .replace(/&nbsp;/g, ' ')
              .replace(/&amp;/g, '&')
              .replace(/\s+/g, ' ')
              .trim()

            const jsonLdBodies = scriptBodies(html, 'application/ld+json')
            const jsonLdTypes = {}
            let jsonLdParseableCount = 0
            for (const body of jsonLdBodies) {
              try {
                const parsed = JSON.parse(body)
                jsonLdParseableCount += 1
                collectJsonLdTypes(parsed, jsonLdTypes)
              } catch {
                // Parsing failure is evidence; do not reinterpret it.
              }
            }

            const applicationJsonBodies = scriptBodies(html, 'application/json')
            const applicationJson = applicationJsonBodies.map((body) => ({
              bytes: Buffer.byteLength(body, 'utf8'),
              sha256: createHash('sha256').update(body, 'utf8').digest('hex'),
            }))

            reports.push({
              id,
              htmlBytes: Buffer.byteLength(html, 'utf8'),
              visibleTextLength: text.length,
              visibleTextPreview: text.slice(0, 4000),
              jsonLdScriptCount: jsonLdBodies.length,
              jsonLdParseableCount,
              jsonLdTypes,
              applicationJsonScriptCount: applicationJsonBodies.length,
              applicationJson,
              observedTextProbes: {
                Producten: text.includes('Producten'),
                Aanbiedingen: text.includes('Aanbiedingen'),
                Toevoegen: text.includes('Toevoegen'),
                'Kies jouw winkel': text.includes('Kies jouw winkel'),
              },
            })
          }

          const report = {
            schemaVersion: 1,
            milestone: 'M1 Data Feasibility',
            inspectionType: 'generic-rendered-structure',
            reports,
          }
          await writeFile(out + '/inspection.json', JSON.stringify(report, null, 2) + '\n', 'utf8')
          console.log(JSON.stringify(report, null, 2))
          NODE

          RENDER_OUT="$out" node "$out/inspect.mjs"

      - name: Upload rendered PLUS listing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supa-plus-rendered-catalog-offers-evidence
          path: plus-rendered-listings/
          if-no-files-found: error
          retention-days: 14
