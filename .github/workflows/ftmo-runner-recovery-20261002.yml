name: Recover FTMO research Actions runner

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-runner-recovery-20261002.yml"
  workflow_dispatch:

# verify72 queue: zssh-ftmo-verify72-runner-recovery-20261002
permissions:
  contents: write

concurrency:
  group: ftmo-research-runner-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: self-hosted
    timeout-minutes: 3
    steps:
      - name: Check out exact main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Recover dedicated FTMO research runner safely
        id: recovery
        shell: bash
        run: |
          set -euo pipefail
          service="actions.runner.Zennay-Ftmo.vps-bb300bba-ftmo.service"

          pre_state="$(systemctl is-active "$service" || true)"
          pre_pid="$(systemctl show "$service" -p MainPID --value || true)"
          action=none

          if [[ "${RUNNER_NAME:-}" == *ftmo* ]]; then
            action=self-runner-noop
            echo "FTMO_RUNNER_RECOVERY=self_runner_noop"
          elif ! systemctl is-active --quiet "$service"; then
            action=start-inactive-listener
            echo "FTMO_RUNNER_RECOVERY=starting_inactive_listener"
            sudo -n systemctl reset-failed "$service" || true
            if ! sudo -n systemctl start "$service"; then
              sudo -n systemctl enable --now "$service"
            fi
          elif pgrep -u ftmo-runner -f 'Runner\.Worker' >/dev/null; then
            action=preserve-active-worker
            echo "FTMO_RUNNER_RECOVERY=inflight_worker_preserved"
          else
            action=preserve-healthy-listener
            echo "FTMO_RUNNER_RECOVERY=listener_active_guarding"
            sleep 5
            if pgrep -u ftmo-runner -f 'Runner\.Worker' >/dev/null; then
              action=preserve-active-worker
              echo "FTMO_RUNNER_RECOVERY=worker_appeared_preserved"
            else
              action=restart-idle-listener
              echo "FTMO_RUNNER_RECOVERY=restarting_idle_stuck_listener"
              sudo -n systemctl restart "$service"
            fi
          fi

          for attempt in $(seq 1 20); do
            if systemctl is-active --quiet "$service"; then
              break
            fi
            sleep 2
          done
          post_state="$(systemctl is-active "$service" || true)"
          post_pid="$(systemctl show "$service" -p MainPID --value || true)"
          test "$post_state" = "active"
          systemctl show "$service" -p ActiveState -p SubState -p MainPID -p NRestarts --no-pager
          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "pre_state=$pre_state" >> "$GITHUB_OUTPUT"
          echo "pre_pid=$pre_pid" >> "$GITHUB_OUTPUT"
          echo "post_state=$post_state" >> "$GITHUB_OUTPUT"
          echo "post_pid=$post_pid" >> "$GITHUB_OUTPUT"
          echo "FTMO_RUNNER_RECOVERY=green"

      - name: Record fallback recovery receipt
        env:
          RECOVERY_ACTION: ${{ steps.recovery.outputs.action }}
          PRE_STATE: ${{ steps.recovery.outputs.pre_state }}
          PRE_PID: ${{ steps.recovery.outputs.pre_pid }}
          POST_STATE: ${{ steps.recovery.outputs.post_state }}
          POST_PID: ${{ steps.recovery.outputs.post_pid }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          service="actions.runner.Zennay-Ftmo.vps-bb300bba-ftmo.service"
          oom=subprocess.run(
              ["bash","-lc","(sudo -n journalctl -k --since '-60 min' --no-pager 2>/dev/null || journalctl -k --since '-60 min' --no-pager 2>/dev/null || true) | grep -Eai 'out of memory|oom|killed process|memory cgroup' | tail -60"],
              text=True,capture_output=True
          ).stdout.strip().splitlines()
          workers=subprocess.run(
              ["bash","-lc","ps -o pid=,lstart=,etime=,cmd= -u ftmo-runner | grep -E 'Runner\\.(Worker|Listener)|runsvc\\.sh' || true"],
              text=True,capture_output=True
          ).stdout.strip().splitlines()
          diag=subprocess.run(
              ["bash","-lc","latest=$(ls -1t /opt/ftmo-runner/_diag/Runner_*.log 2>/dev/null | head -1); "
               "if [ -n \"$latest\" ]; then echo DIAG_FILE=$latest; "
               "grep -Eai 'running job|job request|listening for jobs|assigned|shutdown|signal|session' \"$latest\" | tail -120; fi"],
              text=True,capture_output=True
          ).stdout.strip().splitlines()
          receipt={
              "schema_version":1,
              "queue_id":"zssh-ftmo-verify72-runner-recovery-20261002",
              "workflow_run_id":os.environ.get("GITHUB_RUN_ID"),
              "workflow_run_attempt":os.environ.get("GITHUB_RUN_ATTEMPT"),
              "workflow_sha":os.environ.get("GITHUB_SHA"),
              "runner_name":os.environ.get("RUNNER_NAME"),
              "service":service,
              "pre_state":os.environ.get("PRE_STATE"),
              "pre_pid":os.environ.get("PRE_PID"),
              "recovery_action":os.environ.get("RECOVERY_ACTION"),
              "post_state":os.environ.get("POST_STATE"),
              "post_pid":os.environ.get("POST_PID"),
              "runner_processes":workers,
              "runner_diag_tail":diag,
              "fresh_oom_evidence":oom,
          }
          target=Path("artifacts/ops/zssh-ftmo-verify72-fallback-recovery.json")
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_text(json.dumps(receipt,sort_keys=True,indent=2)+"\n",encoding="utf-8")
          print("FTMO_VERIFY72_FALLBACK_RECEIPT",json.dumps(receipt,sort_keys=True))
          PY
          git config user.name "zcloud-automation"
          git config user.email "zcloud-automation@users.noreply.github.com"
          git add artifacts/ops/zssh-ftmo-verify72-fallback-recovery.json
          if git diff --cached --quiet; then
            echo "FTMO_VERIFY72_FALLBACK_RECEIPT_UNCHANGED=1"
          else
            git commit -m "Record verify72 fallback FTMO runner recovery"
            git push origin HEAD:main
          fi
