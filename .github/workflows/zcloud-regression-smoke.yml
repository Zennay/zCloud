name: zCloud regression smoke

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'worker/**']

jobs:
  critical-runner-flows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run critical zCloud smoke suite
        run: python3 -m unittest discover -v
      - name: Verify 12h Birdseye shell scheduler isolation
        run: bash tests/test_birds_eye_review.sh
      - name: Verify zCloud self-improvement stop-gate browser isolation
        run: bash tests/test_improvement_stopgate_js.sh
      - name: Verify VPS-first browser autonomy contract
        run: bash tests/test_autonomy_runner_js.sh
      - name: Verify safe in-place Firefox addon reload helper
        run: node tests/test_reload_extension.mjs
      - name: Verify Firefox crash-recovery contract
        run: |
          node --check firefox-extension/recovery.js
          node --check firefox-extension/background.js
          node tests/test_firefox_recovery.js
          node tests/test_firefox_recovery_contract.js
      - name: Verify Violentmonkey dynamic worker syntax
        run: node --check public/zcloud-worker.user.js
      - name: Verify fail-closed pre-change guard
        run: python3 -m unittest -v tests.test_prechange_guard
      - name: Verify post-deploy canary checks
        run: python3 -m unittest -v tests.test_postdeploy_canary
      - name: Verify transactional promotion safety
        run: python3 -m unittest -v tests.test_transactional_promote
      - name: Verify control-plane health contract
        run: python3 -m unittest -v tests.test_zcloud_healthcheck
      - name: Verify config schema validator
        run: |
          python3 -m unittest -v tests.test_config_validation
          python3 scripts/zcloud_config_validate.py             --projects projects.json             --layout project-layout.json             --resource-policy resource-policy.json             --server server.py             --enhancements enhancements.py
