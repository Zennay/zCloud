name: zCloud regression smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'worker/**']

permissions:
  contents: read

# Do not cancel a completed source proof or a still-running main regression.
concurrency:
  group: zcloud-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  critical-runner-flows:
    # Run untrusted PR code only in hosted CI and only for this repository.
    # Explicit operator dispatch always targets exact current canonical main.
    if: >-
      github.repository == 'Zennay/zCloud' &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.base.repo.full_name == github.repository) ||
       (github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/worker/'))) ||
       (github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main' &&
        github.actor == 'Zennay' &&
        github.triggering_actor == 'Zennay' &&
        github.run_attempt == 1))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Verify exact immutable revision before executing repository code
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name || github.repository }}
        run: |
          set -euo pipefail
          test "$EXPECTED_REPOSITORY" = "Zennay/zCloud"
          test "$HEAD_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$BASE_REPOSITORY" = "$EXPECTED_REPOSITORY"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            main_sha="$(timeout 15 git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
            test -n "$main_sha"
            test "$main_sha" = "$EXPECTED_SHA"
          fi
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Test exact-head regression-workflow admission before executing project code
        run: python3 -m unittest -v tests.test_deployops_regression_smoke_hosted_trust_20261014_w5
      - name: Run critical zCloud smoke suite
        run: python3 -m unittest discover -v
      - name: Verify 12h Birdseye shell scheduler isolation
        run: bash tests/test_birds_eye_review.sh
      - name: Verify zCloud self-improvement stop-gate browser isolation
        run: bash tests/test_improvement_stopgate_js.sh
      - name: Verify VPS-first browser autonomy contract
        run: bash tests/test_autonomy_runner_js.sh
      - name: Verify safe in-place Firefox addon reload helper
        run: node tests/test_reload_extension.mjs
      - name: Verify Worker Cockpit rendering and mobile enhancement scripts
        run: |
          set -euo pipefail
          node --check public/enhancements.js
          node --check public/app.js
          node tests/test_worker_debug_panel.js
      - name: Verify Firefox crash-recovery contract
        run: |
          node --check firefox-extension/recovery.js
          node --check firefox-extension/background.js
          node tests/test_firefox_recovery.js
          node tests/test_firefox_recovery_contract.js
          node tests/test_worker_tab_reuse.js
          node tests/test_worker_tab_identity_guard.js
          node tests/test_violentmonkey_send_tab_preservation.js
      - name: Verify Violentmonkey dynamic worker syntax
        run: node --check public/zcloud-worker.user.js
      - name: Verify fail-closed pre-change guard
        run: python3 -m unittest -v tests.test_prechange_guard
      - name: Verify post-deploy canary checks
        run: python3 -m unittest -v tests.test_postdeploy_canary
      - name: Verify transactional promotion safety
        run: python3 -m unittest -v tests.test_transactional_promote
      - name: Verify control-plane health contract
        run: python3 -m unittest -v tests.test_zcloud_healthcheck
      - name: Verify config schema validator
        run: |
          python3 -m unittest -v tests.test_config_validation
          python3 scripts/zcloud_config_validate.py             --projects projects.json             --layout project-layout.json             --resource-policy resource-policy.json             --project-contracts project-contracts.json             --server server.py             --enhancements enhancements.py
