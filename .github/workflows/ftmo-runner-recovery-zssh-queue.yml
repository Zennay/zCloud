name: Enqueue FTMO runner recovery on zSSH

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ftmo-runner-recovery-zssh-queue.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enqueue:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Check out exact main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Enqueue FTMO runner recovery on live SQLite queue
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import urllib.request

          base = "http://127.0.0.1:8765"
          queue_id = "zssh-ftmo-pr439-runner-recovery-20261002"
          payload = {
              "action": "enqueue",
              "queue_id": queue_id,
              "project_id": "zssh",
              "title": "Recover FTMO self-hosted Actions runner",
              "priority": "P0",
              "completion_criteria": (
                  "On vps-bb300bba recover only the GitHub Actions runner used by Zennay/Ftmo, "
                  "observed as runner name vps-bb300bba-ftmo. Exact PR #439 head "
                  "683768c80816096057dd8bd52a77f96e44b1b9d5 has self-hosted runs "
                  "37002559195 (Dukascopy resume-cache integrity), 37002559068 (full Test suite), "
                  "and 37002559132 (provider publication integrity) stuck queued. Diagnose current "
                  "listener/service health, active Runner.Worker state, and fresh OOM evidence. "
                  "If inactive or unhealthy, restart only the FTMO Actions runner using the existing "
                  "service installation; if a valid worker is active, preserve it. Verify the runner "
                  "is online/listening and at least one protected PR #439 exact-head run starts "
                  "scheduling. Do not cancel or rerun the protected runs and do not modify the FTMO "
                  "application runtime, marathon service, strategy outcomes, provider evidence, "
                  "preregistration, development, walk-forward, final holdout, broker/live permissions, "
                  "paid-cloud boundary, or secrets. Return the service name, pre/post state, concrete "
                  "recovery action, and scheduling evidence."
              ),
              "source_url": "https://github.com/Zennay/Ftmo/pull/439",
          }

          def post(path, body):
              request = urllib.request.Request(
                  base + path,
                  data=json.dumps(body).encode(),
                  method="POST",
                  headers={"Content-Type": "application/json"},
              )
              with urllib.request.urlopen(request, timeout=10) as response:
                  result = json.load(response)
                  if response.status >= 300:
                      raise RuntimeError(f"{path} failed: HTTP {response.status}")
              return result

          enqueue = post("/api/portfolio-queue", payload)
          start = post("/api/runner-control", {"project_id": "zssh", "action": "start"})
          push = post("/api/runner-control", {"project_id": "zssh", "action": "push"})
          print("FTMO_RUNNER_RECOVERY_ENQUEUE", json.dumps(enqueue, sort_keys=True))
          print("ZSSH_START", json.dumps(start, sort_keys=True))
          print("ZSSH_PUSH", json.dumps(push, sort_keys=True))

          command_ids = {
              int(value)
              for value in (start.get("command_id"), push.get("command_id"))
              if value
          }
          if not command_ids:
              raise RuntimeError("zSSH recovery start/push did not return command ids")

          import time
          deadline = time.monotonic() + 75
          pending = set(command_ids)
          while pending and time.monotonic() < deadline:
              with urllib.request.urlopen(
                  base + "/api/runner-commands?limit=200", timeout=10
              ) as response:
                  live_commands = json.load(response).get("commands") or []
              pending = {
                  int(row.get("id"))
                  for row in live_commands
                  if row.get("id") is not None and int(row.get("id")) in command_ids
              }
              if pending:
                  time.sleep(5)
          if pending:
              raise RuntimeError(
                  "zSSH browser worker did not consume recovery commands: "
                  + ",".join(str(value) for value in sorted(pending))
              )
          print(
              "ZSSH_RECOVERY_COMMANDS_CONSUMED",
              json.dumps({"command_ids": sorted(command_ids)}, sort_keys=True),
          )
          PY

          git fetch origin main
          git reset --hard origin/main

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import urllib.request

          queue_id = "zssh-ftmo-pr439-runner-recovery-20261002"
          with urllib.request.urlopen(
              "http://127.0.0.1:8765/api/portfolio-queue?all=1", timeout=10
          ) as response:
              live = json.load(response)

          def find(value):
              if isinstance(value, dict):
                  if value.get("queue_id") == queue_id:
                      return value
                  for child in value.values():
                      found = find(child)
                      if found:
                          return found
              elif isinstance(value, list):
                  for child in value:
                      found = find(child)
                      if found:
                          return found
              return None

          item = find(live)
          if not item:
              raise SystemExit(f"{queue_id} not found in live SQLite queue")
          if str(item.get("project_id") or "").lower() != "zssh":
              raise SystemExit(f"{queue_id} attached to wrong project")
          if str(item.get("priority") or "").upper() != "P0":
              raise SystemExit(f"{queue_id} is not P0")

          receipt = {
              "schema_version": 1,
              "scope": "ftmo-runner-recovery-zssh-queue",
              "workflow_run_id": os.environ.get("GITHUB_RUN_ID"),
              "workflow_run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "workflow_source_sha": os.environ.get("GITHUB_SHA"),
              "receipt_base_sha": subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], text=True
              ).strip(),
              "queue": {
                  "queue_id": item.get("queue_id"),
                  "project_id": item.get("project_id"),
                  "priority": item.get("priority"),
                  "status": item.get("status"),
                  "eligible": item.get("eligible"),
                  "worker_slot": item.get("worker_slot"),
                  "updated_at": item.get("updated_at"),
              },
              "protected_ftmo_runs": [37003675752, 37003675884],
              "target_exact_head_sha": "683768c80816096057dd8bd52a77f96e44b1b9d5",
          }
          target = Path("artifacts/ops/ftmo-runner-recovery-zssh-queue.json")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(
              json.dumps(receipt, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          print("FTMO_RUNNER_RECOVERY_QUEUE_RECEIPT", json.dumps(receipt, sort_keys=True))
          PY

          git config user.name "zcloud-automation"
          git config user.email "zcloud-automation@users.noreply.github.com"
          git add artifacts/ops/ftmo-runner-recovery-zssh-queue.json
          if git diff --cached --quiet; then
            echo "Queue receipt unchanged"
          else
            git commit -m "Record FTMO runner recovery zSSH queue receipt"
            git push origin HEAD:main
          fi
