name: zCloud handoff completeness proof

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/zcloud_handoff_completeness.py
      - tests/test_handoff_completeness.py
      - tests/test_handoff_completeness_workflow.py
      - docs/handoff-completeness-contract.md
      - .github/workflows/zcloud-handoff-completeness-proof.yml
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zcloud-handoff-completeness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.actor == 'Zennay' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact candidate
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          fi
      - name: Run focused contract tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/zcloud_handoff_completeness.py tests/test_handoff_completeness.py tests/test_handoff_completeness_workflow.py
          python3 -m unittest -v tests.test_handoff_completeness tests.test_handoff_completeness_workflow

  permanent-vps-proof:
    needs: validate
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact candidate and permanent VPS runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          test "$(id -un)" = "ubuntu"
          python3 scripts/zcloud_vps_runner_guard.py --json
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          fi
      - name: Audit live handoff completeness read only
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/zcloud_handoff_completeness.py             --db /home/ubuntu/zennay-cloud/history.db             --projects /home/ubuntu/zennay-cloud/projects.json             > "$RUNNER_TEMP/handoff-completeness.json"
          python3 - "$RUNNER_TEMP/handoff-completeness.json" <<'PY'
          import json, sys
          from pathlib import Path
          payload=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert payload["schema_version"] == "handoff-completeness-v1", payload
          assert payload["privacy_contract"] == "reason-codes-only", payload
          assert payload["read_only"] is True, payload
          assert payload["project_count"] <= 100, payload
          allowed={"project_id","state","receipt_id","observed_at","missing"}
          for project in payload["projects"]:
              assert set(project) == allowed, project
          print("ZCLOUD_HANDOFF_COMPLETENESS_VPS_GREEN=1")
          print("ZCLOUD_HANDOFF_COMPLETENESS_READY=" + ("1" if payload["ready"] else "0"))
          print("ZCLOUD_HANDOFF_COMPLETENESS_COUNTS=" + json.dumps(payload["counts"], sort_keys=True, separators=(",",":")))
          project_summary=[
              {"project_id":p["project_id"],"state":p["state"],"missing":p["missing"]}
              for p in payload["projects"]
          ]
          print("ZCLOUD_HANDOFF_COMPLETENESS_PROJECTS=" + json.dumps(project_summary, sort_keys=True, separators=(",",":")))
          PY
