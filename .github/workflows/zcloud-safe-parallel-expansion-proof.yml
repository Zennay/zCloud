name: zCloud safe parallel expansion proof

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/zcloud_safe_parallel_expansion.py
      - tests/test_safe_parallel_expansion.py
      - tests/test_safe_parallel_expansion_workflow.py
      - docs/safe-parallel-expansion.md
      - .github/workflows/zcloud-safe-parallel-expansion-proof.yml
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zcloud-safe-parallel-expansion-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.actor == 'Zennay' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact candidate and permanent VPS runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          test "$(id -un)" = "ubuntu"
          python3 scripts/zcloud_vps_runner_guard.py --json
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          fi

      - name: Prove safe whole-job expansion within free CPU
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/zcloud_safe_parallel_expansion.py \
            tests/test_safe_parallel_expansion.py \
            tests/test_safe_parallel_expansion_workflow.py
          python3 -m unittest -v \
            tests.test_safe_parallel_expansion \
            tests.test_safe_parallel_expansion_workflow

          cat > "$RUNNER_TEMP/safe-parallel.json" <<'JSON'
          {
            "schema_version": 1,
            "host": {
              "idle_borrowable_cpu_cores": 4,
              "backpressure_required": false
            },
            "projects": [
              {
                "project_id": "ftmo",
                "scheduler_rank": 0,
                "runnable": true,
                "safety_admitted": true,
                "safe_parallel_jobs": 2,
                "current_parallel_jobs": 1,
                "project_parallel_cap": 4,
                "cpu_per_job_cores": 1.5
              },
              {
                "project_id": "haxlab",
                "scheduler_rank": 1,
                "runnable": true,
                "safety_admitted": true,
                "safe_parallel_jobs": 3,
                "current_parallel_jobs": 1,
                "project_parallel_cap": 4,
                "cpu_per_job_cores": 0.5
              }
            ]
          }
          JSON

          python3 scripts/zcloud_safe_parallel_expansion.py \
            --evidence "$RUNNER_TEMP/safe-parallel.json" \
            --json > "$RUNNER_TEMP/result.json"

          python3 - "$RUNNER_TEMP/result.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          result = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))["result"]
          assert [row["project_id"] for row in result["admissions"]] == ["ftmo", "haxlab"], result
          assert result["totals"]["admitted_jobs"] == 4, result
          assert result["totals"]["admitted_cpu_cores"] == 4.0, result
          assert result["host"]["remaining_idle_borrowable_cpu_cores"] == 0.0, result
          assert result["guardrails"]["project_cap_may_be_exceeded"] is False, result
          assert result["guardrails"]["idle_cpu_budget_may_be_exceeded"] is False, result
          assert result["guardrails"]["mutation_performed"] is False, result
          print("ZCLOUD_SAFE_PARALLEL_VPS_GREEN=1")
          PY
