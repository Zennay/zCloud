name: zCloud progress dimensions proof

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/zcloud_progress_dimensions.py
      - tests/test_progress_dimensions.py
      - tests/test_progress_dimensions_workflow.py
      - docs/progress-dimensions-contract.md
      - .github/workflows/zcloud-progress-dimensions-proof.yml
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zcloud-progress-dimensions-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.actor == 'Zennay' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact candidate and permanent VPS runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          test "$(id -un)" = "ubuntu"
          python3 scripts/zcloud_vps_runner_guard.py --json
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          fi

      - name: Prove evidence-only progress dimensions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/zcloud_progress_dimensions.py tests/test_progress_dimensions.py tests/test_progress_dimensions_workflow.py
          python3 -m unittest -v tests.test_progress_dimensions tests.test_progress_dimensions_workflow
          python3 scripts/zcloud_progress_dimensions.py --project ftmo --require-available --json > "$RUNNER_TEMP/ftmo-progress-dimensions.json"
          python3 scripts/zcloud_progress_dimensions.py --json > "$RUNNER_TEMP/all-progress-dimensions.json"
          python3 - "$RUNNER_TEMP/ftmo-progress-dimensions.json" "$RUNNER_TEMP/all-progress-dimensions.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          ftmo_report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))["report"]
          all_projects = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))["report"]
          assert ftmo_report["classification_version"] == "explicit-or-keyword-v1", ftmo_report
          ftmo = ftmo_report["project"]
          assert ftmo["classification_version"] == "explicit-or-keyword-v1", ftmo
          assert ftmo["source_revision"], ftmo
          assert ftmo["progress_basis"], ftmo
          assert set(ftmo["dimensions"]) == {"research", "build", "validation", "operations"}, ftmo
          assert ftmo["dimensions"]["research"]["progress"] == 100.0, ftmo
          assert ftmo["dimensions"]["build"]["progress"] == 100.0, ftmo
          assert ftmo["dimensions"]["validation"]["progress"] == 82.0, ftmo
          assert ftmo["dimensions"]["operations"]["progress"] == 67.5, ftmo
          assert all_projects["classification_version"] == "explicit-or-keyword-v1", all_projects
          assert all_projects["project_count"] >= 1, all_projects
          assert all_projects["available_count"] >= 1, all_projects
          serialized = json.dumps(all_projects, sort_keys=True)
          assert '"title"' not in serialized, serialized
          for project in all_projects["projects"]:
              assert project["source_revision"], project
              assert project["progress_basis"], project
              for value in project["dimensions"].values():
                  assert 0 <= value["progress"] <= 100, project
          print("ZCLOUD_PROGRESS_DIMENSIONS_VPS_GREEN=1")
          PY
