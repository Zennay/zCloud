name: zCloud runner route evidence hosted (2026-10-13 W1)

on:
  push:
    branches:
      - feat/deployops-runner-route-evidence-20261013-w1
    paths:
      - scripts/zcloud_runner_route_evidence_20261013_w1.py
      - tests/test_zcloud_runner_route_evidence_20261013_w1.py
      - scripts/zcloud_safe_idle_blocker_evidence_20261013_w1.py
      - tests/test_zcloud_safe_idle_blocker_evidence_20261013_w1.py
      - docs/deployops-runner-route-safe-idle-evidence-20261013-w1.md
      - .github/workflows/zcloud-runner-route-evidence-hosted-20261013-w1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  evidence:
    if: github.repository == 'Zennay/zCloud'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact read-only branch candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Strict unit validation and Python compile
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/zcloud_runner_route_evidence_20261013_w1.py scripts/zcloud_safe_idle_blocker_evidence_20261013_w1.py
          python3 -m unittest discover -s tests -p 'test_zcloud_runner_route_evidence_20261013_w1.py' -v
          python3 -m unittest discover -s tests -p 'test_zcloud_safe_idle_blocker_evidence_20261013_w1.py' -v
      - name: Run complete zCloud Python regression on GitHub-hosted VM
        run: |
          set -euo pipefail
          python3 -m unittest discover -v
      - name: Cross-language hosted smoke (shell, Node, Firefox contracts)
        run: |
          set -euo pipefail
          bash tests/test_birds_eye_review.sh
          bash tests/test_improvement_stopgate_js.sh
          bash tests/test_autonomy_runner_js.sh
          node tests/test_reload_extension.mjs
          node --check firefox-extension/recovery.js
          node --check firefox-extension/background.js
          node --check public/zcloud-worker.user.js
          node tests/test_firefox_recovery.js
          node tests/test_firefox_recovery_contract.js
          node tests/test_worker_tab_reuse.js
          node tests/test_worker_tab_identity_guard.js
          node tests/test_violentmonkey_send_tab_preservation.js
      - name: Validate synthetic completed-drain log receipt without touching workers
        run: |
          set -euo pipefail
          python3 - <<'PY' | python3 scripts/zcloud_safe_idle_blocker_evidence_20261013_w1.py > drain-receipt.json
          import json
          print("2026-10-13T21:48:06.0879606Z ZCLOUD_DEPLOY_SAFE_IDLE_BLOCKED: browser workers did not reach safe-idle before deployment timeout; " + json.dumps([
              {"worker_id":"cloud::w1", "desired_state":"draining",
               "drain_command_id":321, "drain_command_status":"completed",
               "generating":True, "sending":False, "last_event":"heartbeat",
               "last_event_age_seconds":6.4}
          ], separators=(",", ":")))
          PY
          python3 - <<'PY'
          import json
          data = json.load(open("drain-receipt.json", encoding="utf-8"))
          assert data["only_acknowledged_draining_generation"] is True
          assert data["authorizes_mutation"] is False
          assert data["proves_process_stuck"] is False
          assert data["production_deploy_verified"] is False
          print("Safe-idle drain classification: PASS (observational only)")
          PY
      - name: Read historical real runner-route receipts without changing jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/zcloud_runner_route_evidence_20261013_w1.py \
            --run-id 38417582567 --run-id 38417793892 --run-id 38417002886 > route-receipt.json
          python3 - <<'PY'
          import json
          data = json.load(open("route-receipt.json", encoding="utf-8"))
          assert data["authorizes_mutation"] is False
          assert len(data["runs"]) == 3
          by_id = {item["run_id"]: item for item in data["runs"]}
          # Past assigned jobs prove the canonical runner route worked at the
          # recorded timestamps, not that production deployment succeeded.
          assert by_id[38417582567]["lanes"]["zcloud_vps"]["assigned_count"] >= 1
          assert by_id[38417582567]["production_deploy_verified"] is False
          # The VPS was reachable, but runtime promotion AND self-heal failed.
          assert by_id[38417582567]["lanes"]["zcloud_vps"]["failure_phases"] == {
              "multiple_failure_phases": 1
          }
          assert by_id[38417793892]["lanes"]["zcloud_vps"]["assigned_count"] >= 1
          assert by_id[38417002886]["lanes"]["ftmo_research"]["job_count"] >= 1
          print("Historical runner route evidence: PASS; no release authority")
          PY
      - name: Sample the latest two canonical main deploy routes (non-authorizing)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/zcloud_runner_route_evidence_20261013_w1.py --recent-deploy > current-route-receipt.json
          python3 - <<'PY'
          import json
          data = json.load(open("current-route-receipt.json", encoding="utf-8"))
          assert data["authorizes_mutation"] is False
          assert len(data["runs"]) == 2
          assert all(item["production_deploy_verified"] is False for item in data["runs"])
          print("Current main deploy runner route: sampled (not production approval)")
          for item in data["runs"]:
              lane = item["lanes"]["zcloud_vps"]
              print("run=%d assigned=%d unassigned=%d failed=%d phases=%s" %
                    (item["run_id"], lane["assigned_count"],
                     lane["unassigned_count"], lane["failed_jobs"],
                     json.dumps(lane["failure_phases"], sort_keys=True)))
          assert all("production_deploy_verified" in item for item in data["runs"])
          PY
