name: zCloud runner route evidence hosted (2026-10-13 W1)

on:
  push:
    branches:
      - feat/deployops-runner-route-evidence-20261013-w1
    paths:
      - scripts/zcloud_runner_route_evidence_20261013_w1.py
      - tests/test_zcloud_runner_route_evidence_20261013_w1.py
      - scripts/zcloud_safe_idle_blocker_evidence_20261013_w1.py
      - tests/test_zcloud_safe_idle_blocker_evidence_20261013_w1.py
      - docs/deployops-runner-route-safe-idle-evidence-20261013-w1.md
      - .github/workflows/zcloud-runner-route-evidence-hosted-20261013-w1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  evidence:
    if: (github.repository == 'Zennay/zCloud') && ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || (github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'Zennay'))
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 5
    steps:
      - name: Check out exact read-only branch candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Strict unit validation and Python compile
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/zcloud_runner_route_evidence_20261013_w1.py scripts/zcloud_safe_idle_blocker_evidence_20261013_w1.py
          python3 -m unittest discover -s tests -p 'test_zcloud_runner_route_evidence_20261013_w1.py' -v
          python3 -m unittest discover -s tests -p 'test_zcloud_safe_idle_blocker_evidence_20261013_w1.py' -v
      - name: Run complete zCloud Python regression on GitHub-hosted VM
        run: |
          set -euo pipefail
          python3 -m unittest discover -v
      - name: Cross-language hosted smoke (shell, Node, Firefox contracts)
        run: |
          set -euo pipefail
          bash tests/test_birds_eye_review.sh
          bash tests/test_improvement_stopgate_js.sh
          bash tests/test_autonomy_runner_js.sh
          node tests/test_reload_extension.mjs
          node --check firefox-extension/recovery.js
          node --check firefox-extension/background.js
          node --check public/zcloud-worker.user.js
          node tests/test_firefox_recovery.js
          node tests/test_firefox_recovery_contract.js
          node tests/test_worker_tab_reuse.js
          node tests/test_worker_tab_identity_guard.js
          node tests/test_violentmonkey_send_tab_preservation.js
      - name: Validate synthetic completed-drain log receipt without touching workers
        run: |
          set -euo pipefail
          python3 - <<'PY' | python3 scripts/zcloud_safe_idle_blocker_evidence_20261013_w1.py > drain-receipt.json
          import json
          print("2026-10-13T21:48:06.0879606Z ZCLOUD_DEPLOY_SAFE_IDLE_BLOCKED: browser workers did not reach safe-idle before deployment timeout; " + json.dumps([
              {"worker_id":"cloud::w1", "desired_state":"draining",
               "drain_command_id":321, "drain_command_status":"completed",
               "generating":True, "sending":False, "last_event":"heartbeat",
               "last_event_age_seconds":6.4}
          ], separators=(",", ":")))
          PY
          python3 - <<'PY'
          import json
          data = json.load(open("drain-receipt.json", encoding="utf-8"))
          assert data["failure_category"] == "safe_idle_timeout_marker"
          assert data["only_acknowledged_draining_generation"] is True
          assert data["authorizes_mutation"] is False
          assert data["proves_process_stuck"] is False
          assert data["production_deploy_verified"] is False
          print("Safe-idle drain classification: PASS (observational only)")
          PY
      - name: Classify historical SQLite read-only error without opening the database
        run: |
          set -euo pipefail
          python3 - <<'PY' | python3 scripts/zcloud_safe_idle_blocker_evidence_20261013_w1.py > sqlite-receipt.json
          print("2026-10-13T18:10:48.9881315Z ZCLOUD_DEPLOY_SAFE_IDLE_BLOCKED: attempt to write a readonly database")
          PY
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("sqlite-receipt.json").read_text(encoding="utf-8"))
          assert result["failure_category"] == "sqlite_readonly_error_marker"
          assert result["blocker_count"] is None
          assert result["classes"] is None
          assert result["independent_live_worker_state_verified"] is False
          assert result["authorizes_mutation"] is False
          assert result["production_deploy_verified"] is False
          print("SQLite versus generation-timeout proof: PASS (historical log label only)")
          PY
      - name: Read historical real runner-route receipts without changing jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/zcloud_runner_route_evidence_20261013_w1.py \
            --run-id 38417582567 --run-id 38417793892 --run-id 38417002886 \
            --run-id 38473312856 --run-id 38444598342 > route-receipt.json
          python3 - <<'PY'
          import json
          data = json.load(open("route-receipt.json", encoding="utf-8"))
          assert data["authorizes_mutation"] is False
          assert len(data["runs"]) == 5
          by_id = {item["run_id"]: item for item in data["runs"]}
          # Past assigned jobs prove the canonical runner route worked at the
          # recorded timestamps, not that production deployment succeeded.
          assert by_id[38417582567]["lanes"]["zcloud_vps"]["assigned_count"] >= 1
          assert by_id[38417582567]["production_deploy_verified"] is False
          # The VPS was reachable, but runtime promotion AND self-heal failed.
          assert by_id[38417582567]["lanes"]["zcloud_vps"]["failure_phases"] == {
              "multiple_failure_phases": 1
          }
          assert by_id[38417793892]["lanes"]["zcloud_vps"]["assigned_count"] >= 1
          assert by_id[38417793892]["lanes"]["zcloud_vps"]["canonical_vps_assigned_count"] >= 1
          assert by_id[38417002886]["lanes"]["ftmo_research"]["job_count"] >= 1
          # A real GH skipped job with matching labels was NEVER dispatched.
          skipped = by_id[38473312856]["lanes"]["zcloud_vps"]
          assert skipped["job_count"] == 2
          assert skipped["not_dispatched_count"] == 2
          assert skipped["unassigned_count"] == 0
          assert skipped["canonical_vps_assigned_count"] == 0
          # This DIFFERENT safe-idle failure came from a SQLite read-only
          # exception, not the later active-generation timeout.
          readonly = by_id[38444598342]["lanes"]["zcloud_vps"]
          assert readonly["assigned_count"] >= 1
          assert readonly["failed_jobs"] >= 1
          print("Historical runner route evidence: PASS; no release authority")
          PY
      - name: Sample the latest two canonical main deploy routes (non-authorizing)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/zcloud_runner_route_evidence_20261013_w1.py --recent-deploy > current-route-receipt.json
          python3 - <<'PY'
          import json
          data = json.load(open("current-route-receipt.json", encoding="utf-8"))
          assert data["authorizes_mutation"] is False
          assert len(data["runs"]) == 2
          assert all(item["production_deploy_verified"] is False for item in data["runs"])
          print("Current main deploy runner route: sampled (not production approval)")
          for item in data["runs"]:
              lane = item["lanes"]["zcloud_vps"]
              print("run=%d assigned=%d unassigned=%d failed=%d phases=%s" %
                    (item["run_id"], lane["assigned_count"],
                     lane["unassigned_count"], lane["failed_jobs"],
                     json.dumps(lane["failure_phases"], sort_keys=True)))
          assert all("production_deploy_verified" in item for item in data["runs"])
          PY

      - name: Publish human-readable bounded deploy-ops evidence
        if: success()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          current = json.loads(Path("current-route-receipt.json").read_text(encoding="utf-8"))
          drain = json.loads(Path("drain-receipt.json").read_text(encoding="utf-8"))
          sqlite = json.loads(Path("sqlite-receipt.json").read_text(encoding="utf-8"))
          assert current["authorizes_mutation"] is False
          assert drain["authorizes_mutation"] is False
          assert sqlite["authorizes_mutation"] is False
          assert sqlite["failure_category"] == "sqlite_readonly_error_marker"
          assert drain["failure_category"] == "safe_idle_timeout_marker"
          assert all(r["production_deploy_verified"] is False for r in current["runs"])
          lines = [
              "## zCloud deploy-ops (observation, not release)",
              "",
              "No VPS workers, services or databases were changed by this check.",
              "",
              "| Main deployment | VPS runner assigned | Canonical zcloud-vps-1 | Unexpected target | Queued, no runner | Waiting / approval | Skipped | Unknown identity | Failed job | Any non-success terminal | Known failure class |",
              "| --- | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | --- |",
          ]
          allowed = {
              "browser_safe_idle", "runtime_promotion", "self_heal_rearm",
              "multiple_failure_phases", "step_evidence_missing",
              "step_evidence_inconsistent", "other_step",
              "runner_identity", "regression_provenance", "production_status",
          }
          for run in current["runs"]:
              lane = run["lanes"]["zcloud_vps"]
              phases = lane["failure_phases"]
              keys = sorted(k if k in allowed else "unclassified" for k in phases)
              fields = (
                  run["run_id"], lane["assigned_count"],
                  lane["canonical_vps_assigned_count"],
                  lane["unexpected_vps_assigned_count"],
                  lane["unassigned_count"],
                  lane["not_yet_scheduled_count"],
                  lane["not_dispatched_count"],
                  lane["unproven_runner_count"],
                  lane["failed_jobs"],
                  lane["non_successful_terminal_count"],
                  ", ".join(keys) or "none reported",
              )
              assert len(fields) == len(lines[4].strip("|").split("|"))
              lines.append("| " + " | ".join(str(value) for value in fields) + " |")
          lines.extend(["", "Safe-idle includes distinct SQLite permission and active-generation timeout failure markers.",
                        "A historic SQLite error does not prove current filesystem permissions.",
                        "Safety: source validated, production still unverified.",
                        "Browser heartbeats and synthetic log fixtures do not prove real text progress."])
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(lines) + "\n")
          PY
      - name: Retain only sanitized JSON receipts for short-lived review
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zcloud-deployops-readonly-evidence-${{ github.run_id }}
          path: |
            route-receipt.json
            current-route-receipt.json
            drain-receipt.json
            sqlite-receipt.json
          if-no-files-found: error
          retention-days: 3
