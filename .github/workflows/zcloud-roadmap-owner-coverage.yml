name: zCloud roadmap owner coverage

on:
  pull_request:
    paths:
      - "scripts/zcloud_roadmap_owner_coverage.py"
      - "tests/test_roadmap_owner_coverage.py"
      - ".github/workflows/zcloud-roadmap-owner-coverage.yml"
  push:
    branches: [main]
    paths:
      - "scripts/zcloud_roadmap_owner_coverage.py"
      - "tests/test_roadmap_owner_coverage.py"
      - ".github/workflows/zcloud-roadmap-owner-coverage.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zcloud-roadmap-owner-coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 1

      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Run focused ownership audit regressions
        run: |
          set -euo pipefail
          python3 -m unittest -v tests.test_roadmap_owner_coverage
          python3 -m py_compile scripts/zcloud_roadmap_owner_coverage.py
          echo "ZCLOUD_ROADMAP_OWNER_COVERAGE_GREEN=1"
