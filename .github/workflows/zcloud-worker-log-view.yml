name: zCloud worker log view proof

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/zcloud_worker_log_view.py
      - tests/test_worker_log_view.py
      - tests/test_worker_log_view_workflow.py
      - .github/workflows/zcloud-worker-log-view.yml
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zcloud-worker-log-view-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.actor == 'Zennay' &&
       github.triggering_actor == 'Zennay' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 8
    env:
      EXPECTED_ZCLOUD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.EXPECTED_ZCLOUD_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact candidate and permanent runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_ZCLOUD_SHA"
          test "$(id -un)" = ubuntu
          python3 scripts/zcloud_vps_runner_guard.py --json

      - name: Run focused worker-log regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v tests.test_worker_log_view tests.test_worker_log_view_workflow

      - name: Prove live history DB remains unchanged
        shell: bash
        run: |
          set -euo pipefail
          DB=/home/ubuntu/zennay-cloud/history.db
          BEFORE="$(python3 - "$DB" <<'PY'
          import sys
          from pathlib import Path
          p=Path(sys.argv[1])
          s=p.stat()
          print(f"{s.st_size}:{s.st_mtime_ns}")
          PY
          )"
          python3 scripts/zcloud_worker_log_view.py             --db "$DB"             --project cloud             --worker-slot 1             --hours 6             --limit 25             > "$RUNNER_TEMP/zcloud-worker-log-view.json"
          AFTER="$(python3 - "$DB" <<'PY'
          import sys
          from pathlib import Path
          p=Path(sys.argv[1])
          s=p.stat()
          print(f"{s.st_size}:{s.st_mtime_ns}")
          PY
          )"
          test "$BEFORE" = "$AFTER"
          python3 - "$RUNNER_TEMP/zcloud-worker-log-view.json" <<'PY'
          import json
          import sys
          payload=json.load(open(sys.argv[1],encoding="utf-8"))
          assert payload["project_id"] == "cloud"
          assert payload["worker_slot"] == 1
          assert payload["limit"] == 25
          serialized=json.dumps(payload,sort_keys=True)
          for forbidden in ('"target"', '"title"', '"reason"', '"error"', '"result"', '"conversation_id"'):
              assert forbidden not in serialized
          print("ZCLOUD_WORKER_LOG_VIEW_READONLY_GREEN")
          PY
