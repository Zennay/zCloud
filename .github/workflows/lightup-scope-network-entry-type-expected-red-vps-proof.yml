name: LightUp scope network-config acceptance expected-RED VPS proof

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/lightup-scope-network-entry-type-expected-red-vps-proof.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lightup-scope-network-entry-type-expected-red-vps-proof
  cancel-in-progress: true

env:
  LIGHTUP_REPO: /home/ubuntu/zennay-cloud/repos/lightup
  LIGHTUP_BRANCH: chatgpt/scope-authorization-network-config-acceptance-red-20261006
  LIGHTUP_EXPECTED_SHA: 8a25fa481c3ec049df165c87203ee2e8e2193ed6

jobs:
  prove-red:
    name: Exact #292 + #296 expected-RED contract on vps-bb300bba
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Guard permanent VPS runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          python3 scripts/zcloud_vps_runner_guard.py --json

      - name: Snapshot exact LightUp candidate
        shell: bash
        run: |
          set -euo pipefail
          test -d "${LIGHTUP_REPO}/.git"
          git -C "${LIGHTUP_REPO}" fetch --prune origin \
            "+refs/heads/${LIGHTUP_BRANCH}:refs/remotes/origin/lightup-scope-network-config-red"
          ACTUAL_SHA="$(git -C "${LIGHTUP_REPO}" rev-parse refs/remotes/origin/lightup-scope-network-config-red^{commit})"
          test "${ACTUAL_SHA}" = "${LIGHTUP_EXPECTED_SHA}"
          SNAPSHOT="${RUNNER_TEMP}/lightup-scope-network-config-${GITHUB_RUN_ID}"
          rm -rf "${SNAPSHOT}"
          mkdir -p "${SNAPSHOT}"
          git -C "${LIGHTUP_REPO}" archive "${ACTUAL_SHA}" | tar -x -C "${SNAPSHOT}"
          echo "LIGHTUP_SNAPSHOT=${SNAPSHOT}" >> "${GITHUB_ENV}"
          echo "LIGHTUP_ACTUAL_SHA=${ACTUAL_SHA}" >> "${GITHUB_ENV}"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python 3.11 scope smoke + expected RED
        shell: bash
        run: |
          set -euo pipefail
          cd "${LIGHTUP_SNAPSHOT}"
          PYTHONPATH=src:tests python -m compileall -q src tests
          PYTHONPATH=src:tests python -m unittest -v test_scope
          LOG="${RUNNER_TEMP}/lightup-scope-network-config-red-py311.log"
          set +e
          PYTHONPATH=src:tests python -m unittest -v \
            test_scope_explicit_network_entry_type_acceptance \
            test_scope_canonical_cidr_acceptance >"${LOG}" 2>&1
          RC=$?
          set -e
          cat "${LOG}"
          test "${RC}" -ne 0
          test "$(grep -c 'did not raise' "${LOG}" || true)" -eq 6
          grep -Fq 'FAILED (failures=6)' "${LOG}"
          ! grep -Fq 'errors=' "${LOG}"
          PYTHONPATH=src python scripts/check_safety_canaries.py

      - name: Setup Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Python 3.14 scope smoke + expected RED
        shell: bash
        run: |
          set -euo pipefail
          cd "${LIGHTUP_SNAPSHOT}"
          PYTHONPATH=src:tests python -m compileall -q src tests
          PYTHONPATH=src:tests python -m unittest -v test_scope
          LOG="${RUNNER_TEMP}/lightup-scope-network-config-red-py314.log"
          set +e
          PYTHONPATH=src:tests python -m unittest -v \
            test_scope_explicit_network_entry_type_acceptance \
            test_scope_canonical_cidr_acceptance >"${LOG}" 2>&1
          RC=$?
          set -e
          cat "${LOG}"
          test "${RC}" -ne 0
          test "$(grep -c 'did not raise' "${LOG}" || true)" -eq 6
          grep -Fq 'FAILED (failures=6)' "${LOG}"
          ! grep -Fq 'errors=' "${LOG}"
          PYTHONPATH=src python scripts/check_safety_canaries.py

      - name: Write exact-head expected-RED receipt
        shell: bash
        run: |
          set -euo pipefail
          RECEIPT_DIR="${RUNNER_TEMP}/lightup-scope-network-config-expected-red-receipt"
          mkdir -p "${RECEIPT_DIR}"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "project": "LightUp",
              "issues": [292, 296],
              "branch": os.environ["LIGHTUP_BRANCH"],
              "target_sha": os.environ["LIGHTUP_ACTUAL_SHA"],
              "expected_sha": os.environ["LIGHTUP_EXPECTED_SHA"],
              "host": os.uname().nodename,
              "github_run_id": os.environ["GITHUB_RUN_ID"],
              "python": ["3.11", "3.14"],
              "scope_smoke": "green",
              "acceptance_contract": "expected_red",
              "expected_failures_per_python": 6,
              "production_source_changes": 0,
              "safety_canaries": "green",
          }
          path = Path(os.environ["RUNNER_TEMP"]) / "lightup-scope-network-config-expected-red-receipt" / "receipt.json"
          path.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n")
          print(json.dumps(payload, sort_keys=True))
          PY

      - name: Upload exact-head expected-RED receipt
        uses: actions/upload-artifact@v4
        with:
          name: lightup-scope-network-config-expected-red-vps-proof
          path: ${{ runner.temp }}/lightup-scope-network-config-expected-red-receipt/receipt.json
          if-no-files-found: error

      - name: Cleanup snapshot
        if: always()
        shell: bash
        run: rm -rf "${LIGHTUP_SNAPSHOT:-}"
