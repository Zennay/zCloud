name: zCloud dependency change guard VPS proof

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/zcloud_dependency_change_guard.py
      - tests/test_dependency_change_guard.py
      - .github/workflows/zcloud-dependency-change-guard.yml
      - .github/workflows/zcloud-dependency-change-guard-vps-proof.yml
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: zcloud-dependency-change-guard-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    if: >-
      github.actor == 'Zennay' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 5
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify exact candidate and permanent VPS runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -un)" = ubuntu
          python3 scripts/zcloud_vps_runner_guard.py --json
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Prove dependency guard contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/zcloud_dependency_change_guard.py tests/test_dependency_change_guard.py
          python3 -m unittest -v tests.test_dependency_change_guard
          echo "ZCLOUD_DEPENDENCY_CHANGE_GUARD_VPS_GREEN=1"
