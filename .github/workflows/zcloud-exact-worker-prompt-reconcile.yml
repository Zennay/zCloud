name: Reconcile exact worker prompt now

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/zcloud-exact-worker-prompt-reconcile.yml"
      - "tests/test_exact_worker_prompt_reconcile_workflow.py"
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
    paths:
      - ".github/workflows/zcloud-exact-worker-prompt-reconcile.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zcloud-exact-worker-prompt-reconcile-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      EXPECTED_ZCLOUD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.EXPECTED_ZCLOUD_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate reconcile safety contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_ZCLOUD_SHA"
          python3 -m unittest -v tests.test_exact_worker_prompt_reconcile_workflow

  reconcile:
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 10
    env:
      EXPECTED_ZCLOUD_SHA: ${{ github.sha }}
    steps:
      - name: Check out exact reconcile source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.EXPECTED_ZCLOUD_SHA }}
          clean: true
          fetch-depth: 32
          persist-credentials: false

      - name: Verify exact candidate and permanent runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_ZCLOUD_SHA"
          test "$(id -un)" = ubuntu
          python3 scripts/zcloud_vps_runner_guard.py --json

      - name: Validate prompt sources
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile server.py
          node --check public/zcloud-worker.user.js
          node --check firefox-extension/background.js
          ! grep -Fq "Ga verder met hetzelfde vrije werkgebied" public/zcloud-worker.user.js
          ! grep -Fq "Werk verder aan het project en voer nu een concrete volgende stap uit" public/zcloud-worker.user.js
          ! grep -Fq "Ga verder met hetzelfde vrije werkgebied" firefox-extension/background.js
          ! grep -Fq "Werk verder aan het project en voer nu een concrete volgende stap uit" firefox-extension/background.js
          grep -Fq "Kijk in Notion in welke fase het project zit, bepaal wat er nog gedaan moet worden en werk dat concreet uit." server.py

      - name: Reconcile only worker prompt runtime files
        shell: bash
        run: |
          set -euo pipefail
          root="/home/ubuntu/zennay-cloud"
          backup="$root/.prompt-reconcile-backups/$GITHUB_RUN_ID"
          runtime_bg="$HOME/snap/firefox/common/chatgpt-project-extension/background.js"
          mkdir -p "$backup/public" "$backup/firefox-extension"
          cp -a "$root/server.py" "$backup/server.py"
          cp -a "$root/public/zcloud-worker.user.js" "$backup/public/zcloud-worker.user.js"
          cp -a "$root/firefox-extension/background.js" "$backup/firefox-extension/background.js"
          if [[ -f "$runtime_bg" ]]; then
            cp -a "$runtime_bg" "$backup/runtime-background.js"
          fi

          rollback_runtime() {
            rc=$?
            if [[ "$rc" -eq 0 ]]; then
              return
            fi
            trap - EXIT
            set +e
            install -m 0644 "$backup/server.py" "$root/server.py"
            install -m 0644 "$backup/public/zcloud-worker.user.js" "$root/public/zcloud-worker.user.js"
            install -m 0644 "$backup/firefox-extension/background.js" "$root/firefox-extension/background.js"
            if [[ -f "$backup/runtime-background.js" ]]; then
              install -m 0644 "$backup/runtime-background.js" "$runtime_bg"
            fi
            sudo -n systemctl reset-failed zennay-cloud.service || true
            sudo -n systemctl restart zennay-cloud.service || true
            echo "ZCLOUD_PROMPT_RUNTIME_ROLLBACK_ATTEMPTED=1"
            exit "$rc"
          }
          trap rollback_runtime EXIT

          install -m 0644 server.py "$root/server.py"
          install -m 0644 public/zcloud-worker.user.js "$root/public/zcloud-worker.user.js"
          install -m 0644 firefox-extension/background.js "$root/firefox-extension/background.js"
          if [[ -f "$runtime_bg" ]]; then
            install -m 0644 firefox-extension/background.js "$runtime_bg"
          fi

          sudo -n systemctl reset-failed zennay-cloud.service || true
          sudo -n systemctl restart zennay-cloud.service
          for _ in $(seq 1 30); do
            if systemctl is-active --quiet zennay-cloud.service && curl -fsS --max-time 4 http://127.0.0.1:8765/ >/dev/null; then
              echo "ZCLOUD_PROMPT_RUNTIME_RESTART_GREEN=1"
              exit 0
            fi
            sleep 1
          done
          systemctl --no-pager --full status zennay-cloud.service || true
          exit 1

      - name: Prove live prompt is exact
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import urllib.request
          import server as candidate_server

          with urllib.request.urlopen("http://127.0.0.1:8765/api/runner-targets", timeout=10) as response:
              payload = json.load(response)

          with open("/home/ubuntu/zennay-cloud/projects.json", encoding="utf-8") as fh:
              names = {str(item["id"]): str(item["name"]) for item in json.load(fh)}

          checked = 0
          evidence = []
          for key, cfg in (payload.get("projects") or {}).items():
              if cfg.get("reviewer_mode") or not cfg.get("active"):
                  continue
              base = str(cfg.get("base_project_id") or "")
              name = names.get(base)
              if not name:
                  raise SystemExit(f"unknown project name for {key}: {base}")
              slot = int(cfg.get("worker_slot") or 1)
              total = int(cfg.get("worker_count") or 1)
              expected = candidate_server.project_worker_prompt(
                  base, name, "", slot, total, cfg.get("queue_item")
              )
              actual = str(cfg.get("prompt") or "")
              actual_sha = hashlib.sha256(actual.encode("utf-8")).hexdigest()
              expected_sha = hashlib.sha256(expected.encode("utf-8")).hexdigest()
              if actual != expected:
                  raise SystemExit(
                      f"PROMPT_MISMATCH {key} actual_sha256={actual_sha} "
                      f"expected_sha256={expected_sha}"
                  )
              checked += 1
              evidence.append({
                  "worker": key,
                  "prompt_sha256": actual_sha,
                  "prompt_length": len(actual),
              })

          if checked < 1:
              raise SystemExit("no active normal workers available for exact-prompt proof")
          print("EXACT_WORKER_PROMPT_GREEN=1")
          print(json.dumps(evidence, ensure_ascii=False))
          PY
