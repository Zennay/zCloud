name: One-shot zCloud runner listener recovery\n\non:\n  push:\n    branches:\n      - ops/zcloud-listener-recovery-20261004\n    paths:\n      - .github/workflows/zcloud-listener-recovery-20261004.yml\n  workflow_dispatch:\n\npermissions:\n  contents: read\n\nconcurrency:\n  group: zcloud-listener-recovery-20261004\n  cancel-in-progress: false\n\njobs:\n  recover:\n    runs-on: self-hosted\n    timeout-minutes: 5\n    steps:\n      - name: Recover only idle zCloud Actions listener\n        shell: bash\n        run: |\n          set -euo pipefail\n          test "$(hostname)" = "vps-bb300bba"\n          service="actions.runner.Zennay-zCloud.zcloud-vps-1.service"\n\n          if ! systemctl cat "$service" >/dev/null 2>&1; then\n            echo "ZCLOUD_RUNNER_RECOVERY=service_missing service=$service" >&2\n            exit 1\n          fi\n\n          # Never restart the runner underneath this very recovery job.\n          if [[ "${RUNNER_NAME:-}" == "zcloud-vps-1" ]]; then\n            echo "ZCLOUD_RUNNER_RECOVERY=preserve_self runner=${RUNNER_NAME}"\n            exit 0\n          fi\n\n          group="$(systemctl show "$service" -p ControlGroup --value)"\n          state="$(systemctl is-active "$service" || true)"\n          pid="$(systemctl show "$service" -p MainPID --value || true)"\n          worker=0\n          if [[ -n "$group" && -r "/sys/fs/cgroup${group}/cgroup.procs" ]]; then\n            while read -r child; do\n              [[ "$child" =~ ^[1-9][0-9]*$ ]] || continue\n              [[ -r "/proc/$child/cmdline" ]] || continue\n              cmd="$(tr '\0' ' ' < "/proc/$child/cmdline" || true)"\n              if [[ "$cmd" == *"Runner.Worker"* ]]; then\n                worker=1\n                echo "ZCLOUD_RUNNER_ACTIVE_WORKER pid=$child"\n                break\n              fi\n            done < "/sys/fs/cgroup${group}/cgroup.procs"\n          fi\n\n          echo "ZCLOUD_RUNNER_PRE state=$state pid=$pid worker=$worker group=$group"\n          if [[ "$worker" -eq 1 ]]; then\n            echo "ZCLOUD_RUNNER_RECOVERY=preserve_active_worker"\n            exit 0\n          fi\n\n          sudo -n systemctl restart "$service"\n\n          for _ in $(seq 1 15); do\n            post="$(systemctl is-active "$service" || true)"\n            post_pid="$(systemctl show "$service" -p MainPID --value || true)"\n            if [[ "$post" == "active" && "$post_pid" =~ ^[1-9][0-9]*$ && -r "/proc/$post_pid/cmdline" ]]; then\n              cmd="$(tr '\0' ' ' < "/proc/$post_pid/cmdline" || true)"\n              if [[ "$cmd" == *"Runner.Listener"* || "$cmd" == *"runsvc.sh"* ]]; then\n                echo "ZCLOUD_RUNNER_RECOVERY=restart_idle_listener"\n                echo "ZCLOUD_RUNNER_POST state=$post pid=$post_pid"\n                exit 0\n              fi\n            fi\n            sleep 2\n          done\n\n          systemctl --no-pager --full status "$service" || true\n          echo "ZCLOUD_RUNNER_RECOVERY=restart_failed" >&2\n          exit 1\n