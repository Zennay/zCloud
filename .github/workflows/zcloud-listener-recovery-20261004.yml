name: One-shot zCloud runner listener recovery

on:
  push:
    branches:
      - ops/zcloud-listener-recovery-20261004
    paths:
      - .github/workflows/zcloud-listener-recovery-20261004.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zcloud-listener-recovery-20261004
  cancel-in-progress: false

jobs:
  recover:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Recover only idle zCloud Actions listener
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          service="actions.runner.Zennay-zCloud.zcloud-vps-1.service"

          if ! systemctl cat "$service" >/dev/null 2>&1; then
            echo "ZCLOUD_RUNNER_RECOVERY=service_missing service=$service" >&2
            exit 1
          fi

          # Never restart the runner underneath this very recovery job.
          if [[ "${RUNNER_NAME:-}" == "zcloud-vps-1" ]]; then
            echo "ZCLOUD_RUNNER_RECOVERY=preserve_self runner=${RUNNER_NAME}"
            exit 0
          fi

          group="$(systemctl show "$service" -p ControlGroup --value)"
          state="$(systemctl is-active "$service" || true)"
          pid="$(systemctl show "$service" -p MainPID --value || true)"
          worker=0
          if [[ -n "$group" && -r "/sys/fs/cgroup${group}/cgroup.procs" ]]; then
            while read -r child; do
              [[ "$child" =~ ^[1-9][0-9]*$ ]] || continue
              [[ -r "/proc/$child/cmdline" ]] || continue
              cmd="$(tr '\0' ' ' < "/proc/$child/cmdline" || true)"
              if [[ "$cmd" == *"Runner.Worker"* ]]; then
                worker=1
                echo "ZCLOUD_RUNNER_ACTIVE_WORKER pid=$child"
                break
              fi
            done < "/sys/fs/cgroup${group}/cgroup.procs"
          fi

          echo "ZCLOUD_RUNNER_PRE state=$state pid=$pid worker=$worker group=$group"
          if [[ "$worker" -eq 1 ]]; then
            echo "ZCLOUD_RUNNER_RECOVERY=preserve_active_worker"
            exit 0
          fi

          sudo -n systemctl restart "$service"

          for _ in $(seq 1 15); do
            post="$(systemctl is-active "$service" || true)"
            post_pid="$(systemctl show "$service" -p MainPID --value || true)"
            if [[ "$post" == "active" && "$post_pid" =~ ^[1-9][0-9]*$ && -r "/proc/$post_pid/cmdline" ]]; then
              cmd="$(tr '\0' ' ' < "/proc/$post_pid/cmdline" || true)"
              if [[ "$cmd" == *"Runner.Listener"* || "$cmd" == *"runsvc.sh"* ]]; then
                echo "ZCLOUD_RUNNER_RECOVERY=restart_idle_listener"
                echo "ZCLOUD_RUNNER_POST state=$post pid=$post_pid"
                exit 0
              fi
            fi
            sleep 2
          done

          systemctl --no-pager --full status "$service" || true
          echo "ZCLOUD_RUNNER_RECOVERY=restart_failed" >&2
          exit 1
