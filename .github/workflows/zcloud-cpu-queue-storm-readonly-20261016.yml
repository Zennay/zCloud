name: zCloud CPU queue storm offline verification (hosted-only)

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

jobs:
  readonly-regression:
    if: (github.repository == 'Zennay/zCloud' && github.event_name == 'pull_request') && ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || (github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'Zennay'))
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 5
    steps:
      - name: Deny foreign head before checkout
        shell: bash
        env:
          BASE_REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          test "$BASE_REPO" = 'Zennay/zCloud'
          test "$HEAD_REPO" = "$BASE_REPO"
      - name: Checkout immutable PR head without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          clean: true
      - name: Run bounded source-only queue auditor tests
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 -m py_compile scripts/zcloud_cpu_queue_storm_audit_20261016.py
          python3 -m unittest -v tests.test_zcloud_cpu_queue_storm_audit_20261016
