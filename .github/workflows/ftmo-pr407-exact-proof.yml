name: FTMO PR407 exact-head proof

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-pr407-exact-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ftmo-pr407-exact-proof
  cancel-in-progress: true

jobs:
  cancel-stale-worker1-proof:
    runs-on: self-hosted
    timeout-minutes: 3
    steps:
      - name: Cancel only obsolete Worker1 cross-proof
        shell: bash
        run: |
          set -euo pipefail
          gh auth status >/dev/null 2>&1
          python3 - <<'PY'
          import json
          import subprocess

          stale_sha = "dab3151a8484ed4e38ef8ab270cf819c42de2cfc"
          stale_run_id = 36981448936

          def gh_json(path):
              return json.loads(subprocess.check_output(
                  ["gh", "api", "-H", "X-GitHub-Api-Version: 2022-11-28", path],
                  text=True,
                  stderr=subprocess.DEVNULL,
              ))

          pr = gh_json("repos/Zennay/Ftmo/pulls/406")
          current_head = (pr.get("head") or {}).get("sha")
          run = gh_json(f"repos/Zennay/zCloud/actions/runs/{stale_run_id}")
          if current_head == stale_sha:
              print("WORKER1_PROOF_STILL_CURRENT=1")
              print(f"FTMO_PR406_CURRENT_HEAD={current_head}")
              raise SystemExit(0)
          if run.get("head_sha") != "be9cb7fa3af8d49b0bddce8ecfced3271b762522":
              raise SystemExit("Worker1 proof run identity changed")
          if run.get("status") != "completed":
              subprocess.check_call([
                  "gh", "api", "--method", "POST",
                  f"repos/Zennay/zCloud/actions/runs/{stale_run_id}/cancel",
              ])
              print(f"STALE_WORKER1_PROOF_CANCEL_REQUESTED={stale_run_id}")
          else:
              print(f"STALE_WORKER1_PROOF_ALREADY_TERMINAL={stale_run_id}")
          print(f"FTMO_PR406_CURRENT_HEAD={current_head}")
          PY

  prove:
    needs: cancel-stale-worker1-proof
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 12
    env:
      TARGET_SHA: 60fcbbc3562e77013f44830c4db26b69f0167ca1
    steps:
      - name: Fetch exact FTMO PR head
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr407-proof"
          rm -rf "$src"
          gh repo clone Zennay/Ftmo "$src" -- --filter=blob:none --no-checkout >/dev/null
          git -C "$src" checkout --detach "$TARGET_SHA" >/dev/null
          test "$(git -C "$src" rev-parse HEAD)" = "$TARGET_SHA"
          echo "FTMO_PR407_EXACT_SHA=$TARGET_SHA"

      - name: Install isolated test environment
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr407-proof"
          venv="$RUNNER_TEMP/ftmo-pr407-venv"
          rm -rf "$venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install -q -r "$src/requirements-ci.txt"
          "$venv/bin/python" -m pip install -q -e "$src"

      - name: Compile changed provenance module
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr407-proof"
          venv="$RUNNER_TEMP/ftmo-pr407-venv"
          cd "$src"
          "$venv/bin/python" -m compileall -q src/prop_trading_ai/data/market/dukascopy_tick_resume_cache.py
          echo "FTMO_PR407_COMPILE_GREEN=1"

      - name: Prove hourly provenance regressions
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr407-proof"
          venv="$RUNNER_TEMP/ftmo-pr407-venv"
          cd "$src"
          "$venv/bin/python" -m pytest -q tests/test_dukascopy_tick_resume_cache.py
          echo "FTMO_PR407_TARGETED_TESTS_GREEN=1"

      - name: Prove zero-cost boundary remains sealed
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr407-proof"
          venv="$RUNNER_TEMP/ftmo-pr407-venv"
          cd "$src"
          "$venv/bin/python" -m pytest -q tests/test_zero_cost_workflow_boundary.py
          echo "FTMO_PR407_ZERO_COST_BOUNDARY_GREEN=1"

      - name: Build exact FTMO full-suite plan
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr407-proof"
          venv="$RUNNER_TEMP/ftmo-pr407-venv"
          cd "$src"
          mkdir -p .scratch
          "$venv/bin/python" - <<'PY'
          from pathlib import Path
          import io
          import contextlib
          import pytest

          class Collector:
              paths = None
              count = None

              def pytest_collection_finish(self, session):
                  self.count = len(session.items)
                  self.paths = sorted(
                      {
                          Path(str(item.path)).resolve().relative_to(Path.cwd().resolve()).as_posix()
                          for item in session.items
                      }
                  )

          collector = Collector()
          captured = io.StringIO()
          with contextlib.redirect_stdout(captured), contextlib.redirect_stderr(captured):
              exit_code = pytest.main(["--collect-only", "-q"], plugins=[collector])
          if exit_code != pytest.ExitCode.OK or collector.paths is None or collector.count is None:
              raise SystemExit("pytest collection failed: " + captured.getvalue()[-2000:])
          if not collector.paths or collector.count <= 0:
              raise SystemExit("pytest collected no tests")
          Path(".scratch/ci-test-files-pr407.txt").write_text(
              "\n".join(collector.paths) + "\n", encoding="utf-8"
          )
          Path(".scratch/ci-test-count-pr407.txt").write_text(
              str(collector.count) + "\n", encoding="utf-8"
          )
          print(f"FTMO_PR407_COLLECTED_TESTS={collector.count}")
          print(f"FTMO_PR407_TEST_FILES={len(collector.paths)}")
          PY

      - name: Run exact FTMO full suite in memory-bounded batches
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr407-proof"
          venv="$RUNNER_TEMP/ftmo-pr407-venv"
          cd "$src"
          expected_count="$(cat .scratch/ci-test-count-pr407.txt)"
          executed_files=0
          while IFS= read -r test_file; do
            [[ -n "$test_file" ]] || continue
            echo "::group::$test_file"
            "$venv/bin/python" -m pytest -q "$test_file"
            echo "::endgroup::"
            executed_files=$((executed_files + 1))
          done < .scratch/ci-test-files-pr407.txt
          test "$executed_files" -gt 0
          echo "FTMO_PR407_FULL_SUITE_COLLECTED_TESTS=$expected_count"
          echo "FTMO_PR407_FULL_SUITE_EXECUTED_FILES=$executed_files"
          echo "FTMO_PR407_FULL_SUITE_GREEN=1"
