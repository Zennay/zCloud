name: zCloud self-hosted matrix capacity ratchet (hosted)

# Source-only audit: no production locks, VPS selection or write token.
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "scripts/zcloud_selfhosted_matrix_capacity_ratchet_20261016.py"
      - "tests/test_zcloud_selfhosted_matrix_capacity_ratchet_20261016.py"

permissions:
  contents: read

concurrency:
  group: zcloud-matrix-capacity-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  trust:
    name: Prove same-repository source event before checkout
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$EVENT" = "pull_request"
          test "$REPOSITORY" = "Zennay/zCloud"
          test "$HEAD_REPO" = "$REPOSITORY"
          test "$BASE_REPO" = "$REPOSITORY"
          test "$GITHUB_BASE_REF" = "main"

  source-only:
    name: Reject new self-hosted matrix capacity debt
    needs: [trust]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout immutable candidate without stored credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - name: Verify exact Git candidate and current main before source tests
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$HEAD" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BASE" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$HEAD"
          git cat-file -e "$BASE^{commit}"
          current="$(GIT_TERMINAL_PROMPT=0 timeout 20 git -c credential.helper= ls-remote https://github.com/Zennay/zCloud.git refs/heads/main | awk '{print $1}')"
          test "$current" = "$BASE"
      - name: Run isolated adversarial source tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --no-input --disable-pip-version-check 'PyYAML==6.0.3'
          python3 -m unittest -v tests.test_zcloud_selfhosted_matrix_capacity_ratchet_20261016
      - name: Deny newly introduced unbounded VPS matrix fan-out
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 scripts/zcloud_selfhosted_matrix_capacity_ratchet_20261016.py --base "$BASE" --head "$HEAD"
          current="$(GIT_TERMINAL_PROMPT=0 timeout 20 git -c credential.helper= ls-remote https://github.com/Zennay/zCloud.git refs/heads/main | awk '{print $1}')"
          test "$current" = "$BASE"
          echo "ZCLOUD_MATRIX_CAPACITY_SOURCE_ONLY_GREEN=1"
