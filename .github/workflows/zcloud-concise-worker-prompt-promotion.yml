name: Promote concise worker prompts
# retrigger: sync concise prompt validators to live runtime 2026-10-04

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/zcloud-concise-worker-prompt-promotion.yml"

permissions:
  contents: read

jobs:
  promote:
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 12
    steps:
      - name: Check out exact promotion revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 512

      - name: Verify concise prompt source and FTMO AI cap
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "Werk verder aan {name}" server.py
          grep -Fq "Kijk in Notion in welke fase het project zit" server.py
          ! grep -Fq "VPS_QUEUE_ASSIGNMENT id=" server.py
          grep -Fq "PROJECT_AI_WORKER_LIMITS = {'ftmo': 2}" server.py
          grep -Fq 'prompt.startsWith("Werk verder aan ")' public/zcloud-worker.user.js
          grep -Fq 'prompt.startsWith("Werk verder aan ")' firefox-extension/background.js
          echo "CONCISE_WORKER_PROMPT_SOURCE_GREEN=1"

      - name: Enforce VPS runner identity
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/zcloud_vps_runner_guard.py --json
          test "$(hostname)" = "vps-bb300bba"

      - name: Recover zCloud control plane if needed
        shell: bash
        run: |
          set -euo pipefail
          service="zennay-cloud.service"
          url="http://127.0.0.1:8765/"
          healthy() {
            systemctl is-active --quiet "$service" &&
              curl -fsS --max-time 4 "$url" >/dev/null
          }
          if ! healthy; then
            sudo -n systemctl reset-failed "$service" || true
            sudo -n systemctl restart "$service"
            for _ in $(seq 1 25); do
              healthy && break
              sleep 1
            done
          fi
          healthy
          echo "ZCLOUD_CONTROL_PLANE_GREEN=1"

      - name: Acquire deploylane coordination
        id: claim
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/zcloud_vps_deploylane_coordination.py acquire

      - name: Promote backend prompt contract
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/zcloud_transactional_promote.py \
            --candidate "$GITHUB_WORKSPACE" \
            --path projects.json \
            --path server.py \
            --preserve-prechange-drift public/zcloud-worker.user.js \
            --preserve-prechange-drift firefox-extension/background.js \
            --allow-recent-ancestor-prechange-drift \
            --actor "github-actions-concise-worker-prompt" \
            --json

      - name: Promote browser worker contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/zcloud_transactional_promote.py \
            --candidate "$GITHUB_WORKSPACE" \
            --path public/zcloud-worker.user.js \
            --path firefox-extension/background.js \
            --allow-recent-ancestor-prechange-drift \
            --actor "github-actions-concise-worker-prompt" \
            --json

      - name: Prove live concise prompts and parallel FTMO bound
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import urllib.request
          import server as candidate_server

          def get(path):
              with urllib.request.urlopen("http://127.0.0.1:8765" + path, timeout=8) as r:
                  return json.load(r)

          targets = get("/api/runner-targets")
          projects = targets.get("projects") or {}
          with open("projects.json", encoding="utf-8") as fh:
              project_names = {str(p["id"]): str(p["name"]) for p in json.load(fh)}
          active_ftmo = []
          checked = 0
          for key, cfg in projects.items():
              if cfg.get("reviewer_mode"):
                  continue
              if not cfg.get("active"):
                  continue
              prompt = str(cfg.get("prompt") or "")
              base_id = str(cfg.get("base_project_id") or "")
              project_name = project_names.get(base_id)
              if not project_name:
                  raise SystemExit(f"unknown base project for {key}: {base_id!r}")
              slot = int(cfg.get("worker_slot") or 1)
              total = int(cfg.get("worker_count") or 1)
              expected = candidate_server.project_worker_prompt(
                  base_id, project_name, "", slot, total, cfg.get("queue_item")
              )
              if prompt != expected:
                  raise SystemExit(f"worker prompt is not exact for {key}: {prompt!r} != {expected!r}")
              checked += 1
              if str(cfg.get("base_project_id") or "").lower() == "ftmo":
                  active_ftmo.append(key)

          if len(active_ftmo) > 2:
              raise SystemExit(f"FTMO AI worker cap violated: {active_ftmo}")
          if checked < 1:
              raise SystemExit("no active worker prompt available for live verification")

          print("LIVE_CONCISE_WORKER_PROMPTS_GREEN", checked)
          print("LIVE_FTMO_AI_WORKERS", len(active_ftmo), ",".join(active_ftmo))
          PY
          python3 scripts/zcloud_healthcheck.py --json

      - name: Verify deploylane coordination
        if: steps.claim.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/zcloud_vps_deploylane_coordination.py verify

      - name: Release deploylane coordination
        if: always() && steps.claim.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 scripts/zcloud_vps_deploylane_coordination.py release || true
