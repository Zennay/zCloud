name: Finalize zSSH FTMO safe-gate queue item

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/zssh-ftmo-safe-gate-queue-finalize.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finalize:
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 5
    steps:
      - name: Reverify exact proof and current safe runtime
        shell: bash
        run: |
          set -euo pipefail
          gh auth status >/dev/null 2>&1

          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          def gh_json(path):
              raw = subprocess.check_output(
                  ["gh", "api", "-H", "X-GitHub-Api-Version: 2022-11-28", path],
                  text=True,
                  stderr=subprocess.DEVNULL,
              )
              return json.loads(raw)

          exact = gh_json("repos/Zennay/zCloud/actions/runs/36974357519")
          current = gh_json("repos/Zennay/Ftmo/actions/runs/36974710326")

          if exact.get("status") != "completed" or exact.get("conclusion") != "success":
              raise SystemExit(f"exact safe-gate proof not green: {exact.get('status')}/{exact.get('conclusion')}")
          if current.get("status") != "completed" or current.get("conclusion") != "success":
              raise SystemExit(f"current FTMO deploy not green: {current.get('status')}/{current.get('conclusion')}")

          root = Path("/opt/ftmo-autonomous")
          status_path = root / ".scratch/autonomy/status.json"
          if not status_path.is_file() or status_path.is_symlink():
              raise SystemExit("live FTMO status missing or unsafe")
          status = json.loads(status_path.read_text(encoding="utf-8"))
          research = status.get("research") or {}
          controller = status.get("research_controller") or {}
          compute = controller.get("compute") or {}
          loop = controller.get("generation_loop") or {}
          outcome = controller.get("outcome_execution") or {}

          expected_current = "a6c6a1ab1860c691365e35dcca2b366cdd2c94b0"
          if status.get("runtime_revision") != expected_current:
              raise SystemExit(
                  f"live runtime is not final current-main proof: {status.get('runtime_revision')!r}"
              )
          if str(status.get("deployment_workflow_run_id")) != "36974710326":
              raise SystemExit(
                  f"live deployment run mismatch: {status.get('deployment_workflow_run_id')!r}"
              )
          if status.get("research_cycle_ok") is not True:
              raise SystemExit("live research cycle is not green")
          if compute.get("ok") is not True:
              raise SystemExit("controller compute is not healthy")
          if loop.get("enabled") is not True:
              raise SystemExit("generation loop is not enabled")
          if status.get("live_trading_allowed") is not False:
              raise SystemExit("live-trading boundary changed")
          if status.get("broker_order_submission_allowed") is not False:
              raise SystemExit("broker-order boundary changed")
          if outcome.get("walk_forward_accessed") is True and research.get("walk_forward_access_allowed") is not True:
              raise SystemExit("walk-forward accessed without deterministic gate")
          if outcome.get("final_holdout_accessed") is True and research.get("final_holdout_access_allowed") is not True:
              raise SystemExit("final holdout accessed without deterministic gate")

          print("FTMO_SAFE_GATE_FINAL_RUNTIME_GREEN", json.dumps({
              "exact_proof_run_id": exact.get("id"),
              "exact_proof_conclusion": exact.get("conclusion"),
              "current_deploy_run_id": current.get("id"),
              "current_deploy_conclusion": current.get("conclusion"),
              "runtime_revision": status.get("runtime_revision"),
              "research_cycle_ok": status.get("research_cycle_ok"),
              "generation_number": research.get("generation_number"),
              "generation_id": research.get("generation_id"),
              "controller_action": controller.get("action"),
              "compute_ok": compute.get("ok"),
              "generation_loop_enabled": loop.get("enabled"),
              "generation_loop_action": loop.get("action"),
              "live_trading_allowed": status.get("live_trading_allowed"),
              "broker_order_submission_allowed": status.get("broker_order_submission_allowed"),
              "walk_forward_accessed": outcome.get("walk_forward_accessed"),
              "final_holdout_accessed": outcome.get("final_holdout_accessed"),
          }, sort_keys=True))
          PY

          state="$(systemctl is-active ftmo-autonomous-marathon.service || true)"
          pid="$(systemctl show ftmo-autonomous-marathon.service -p MainPID --value || true)"
          test "$state" = "active"
          [[ "$pid" =~ ^[1-9][0-9]*$ ]]
          echo "FTMO_SAFE_GATE_FINAL_SERVICE_GREEN state=$state pid=$pid"

      - name: Finalize exact SQLite queue assignment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import importlib.util
          import json
          import sqlite3
          import sys
          from pathlib import Path

          queue_id = "zssh-ftmo-safe-gate-3b512f56"
          expected_project = "zssh"
          live_root = Path("/home/ubuntu/zennay-cloud")
          server_path = live_root / "server.py"
          db_path = live_root / "history.db"
          if not server_path.is_file() or not db_path.is_file():
              raise SystemExit("live zCloud server/history.db missing")

          sys.path.insert(0, str(live_root))
          spec = importlib.util.spec_from_file_location("zcloud_live_server", server_path)
          if spec is None or spec.loader is None:
              raise SystemExit("cannot load live zCloud server module")
          server = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(server)
          server.DB = db_path

          with sqlite3.connect(db_path) as c:
              c.row_factory = sqlite3.Row
              row = c.execute(
                  "SELECT queue_id,project_id,title,status,eligible,worker_slot,evidence,updated_at "
                  "FROM portfolio_queue WHERE queue_id=?",
                  (queue_id,),
              ).fetchone()

          if row is None:
              raise SystemExit("queue item missing")
          item = dict(row)
          print("QUEUE_BEFORE=" + json.dumps(item, sort_keys=True))
          if item["project_id"] != expected_project:
              raise SystemExit(f"project mismatch: {item['project_id']}")

          evidence = (
              "FTMO persistent safe progression fully proven and restored forward. "
              "Exact historical safe-gate workflow 36974357519 SUCCESS proved runtime_revision "
              "3b512f5631984a46072495727214bb7bf03a02ba with fresh research_cycle_ok, healthy controller "
              "compute, enabled generation loop, generation 29, live/broker false, and no unauthorized "
              "walk-forward/final-holdout access. Post-proof restore verifier 36974840683 SUCCESS. "
              "Final superseding FTMO deploy 36974710326 SUCCESS on "
              "a6c6a1ab1860c691365e35dcca2b366cdd2c94b0 with fresh autonomous heartbeat and installed-code "
              "verification green. No manual v1_autonomous_tick invocation."
          )

          if item["status"] == "done":
              print("QUEUE_ALREADY_DONE=1")
          elif item["status"] in {"claimed", "running", "verifying", "in_progress"} and item["worker_slot"] is not None:
              result = server.portfolio_queue_finish(
                  int(item["worker_slot"]),
                  queue_id,
                  "DONE",
                  evidence,
              )
              print("QUEUE_FINISH_RESULT=" + json.dumps(result, sort_keys=True, default=str))
              if not result.get("updated"):
                  raise SystemExit("portfolio_queue_finish refused active assignment")
          else:
              raise SystemExit(
                  "refusing nonstandard queue mutation; "
                  f"status={item['status']} worker_slot={item['worker_slot']}"
              )

          with sqlite3.connect(db_path) as c:
              c.row_factory = sqlite3.Row
              after = c.execute(
                  "SELECT queue_id,project_id,status,eligible,worker_slot,evidence,updated_at "
                  "FROM portfolio_queue WHERE queue_id=?",
                  (queue_id,),
              ).fetchone()
          final = dict(after) if after else None
          print("QUEUE_AFTER=" + json.dumps(final, sort_keys=True))
          if not final or final["status"] != "done" or int(final["eligible"] or 0) != 0:
              raise SystemExit("queue final state is not done/eligible=0")
          print("ZCLOUD_SQLITE_QUEUE_FINALIZE_GREEN=1")
          PY
