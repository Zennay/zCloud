name: Recover FTMO persistent runtime

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-persistent-runtime-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ftmo-persistent-runtime-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Install and start bounded FTMO marathon service
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/opt/ftmo-autonomous
          SERVICE=ftmo-autonomous-marathon.service
          RUNNER_SERVICE=actions.runner.Zennay-Ftmo.vps-bb300bba-ftmo.service
          FTMO_WORKTREE=/opt/ftmo-runner/_work/Ftmo/Ftmo
          PROVIDER_SKIP_REL=src/prop_trading_ai/research/autonomous_provider_skip.py
          PROVIDER_SKIP_BLOB=18aaa82648baaf5ced8a059f7d258a93482fecc7

          test -d "$ROOT"
          test -x "$ROOT/.venv/bin/python"
          test -f "$ROOT/configs/autonomous_runtime.json"
          test -f "$ROOT/scripts/run-autonomous-marathon.sh"
          grep -q 'safe provider gate blocked; keeping marathon alive' "$ROOT/scripts/run-autonomous-marathon.sh"
          id ftmo-runner >/dev/null
          sudo -n chmod 0755 "$ROOT/scripts/run-autonomous-marathon.sh"

          # Bootstrap the one runtime dependency that caused the current
          # crash-loop. Only copy from the dedicated FTMO checkout when the
          # file's Git blob exactly matches the audited repository blob.
          test -f "$FTMO_WORKTREE/$PROVIDER_SKIP_REL"
          test "$(git hash-object "$FTMO_WORKTREE/$PROVIDER_SKIP_REL")" = "$PROVIDER_SKIP_BLOB"
          sudo -n install -D -o ftmo-runner -g ftmo-runner -m 0644 \
            "$FTMO_WORKTREE/$PROVIDER_SKIP_REL" "$ROOT/$PROVIDER_SKIP_REL"
          test "$(git hash-object "$ROOT/$PROVIDER_SKIP_REL")" = "$PROVIDER_SKIP_BLOB"

          rendered="$(mktemp)"
          trap 'rm -f "$rendered"' EXIT
          cat >"$rendered" <<'UNIT'
          [Unit]
          Description=FTMO continuous autonomous research marathon
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=ftmo-runner
          WorkingDirectory=/opt/ftmo-autonomous
          Environment=PYTHONUNBUFFERED=1
          Environment=FTMO_PYTHON=/opt/ftmo-autonomous/.venv/bin/python
          Environment=FTMO_AUTONOMOUS_CLOUD_BUDGET_USD=0.00
          Environment=FTMO_ALLOW_PAID_AWS=
          Environment=FTMO_RESEARCH_MAX_WORKERS=5
          Environment=FTMO_RESEARCH_RESERVE_CPUS=1
          ExecStart=/bin/bash /opt/ftmo-autonomous/scripts/run-autonomous-marathon.sh /opt/ftmo-autonomous
          Restart=always
          RestartSec=3s
          Nice=0
          CPUWeight=10000
          CPUQuota=500%
          NoNewPrivileges=true
          PrivateTmp=true
          ProtectSystem=full

          [Install]
          WantedBy=multi-user.target
          UNIT

          if ! sudo -n cmp -s "$rendered" "/etc/systemd/system/$SERVICE" 2>/dev/null; then
            sudo -n install -m 0644 "$rendered" "/etc/systemd/system/$SERVICE"
          fi
          sudo -n systemctl daemon-reload
          sudo -n systemctl disable --now ftmo-autonomous.timer || true
          sudo -n systemctl disable --now "$SERVICE" || true
          sudo -n systemctl enable --now "$SERVICE"

          # FTMO is the portfolio's primary useful-compute consumer on this
          # six-vCPU host. Keep HaxLab bounded to one CPU so it cannot reclaim
          # four cores while FTMO research is runnable.
          sudo -n systemctl set-property haxlab-autonomy.service CPUQuota=100% CPUWeight=100
          systemctl show haxlab-autonomy.service -p ActiveState -p CPUWeight -p CPUQuotaPerSecUSec --no-pager

          # Recover the dedicated FTMO Actions runner only when it is down.
          # Restarting an active runner kills in-flight exact-head CI.
          if [[ "${RUNNER_NAME:-}" != *ftmo* ]] && ! systemctl is-active --quiet "$RUNNER_SERVICE"; then
            sudo -n systemctl reset-failed "$RUNNER_SERVICE" || true
            if ! sudo -n systemctl start "$RUNNER_SERVICE"; then
              sudo -n systemctl enable --now "$RUNNER_SERVICE"
            fi
          else
            echo "FTMO Actions runner already active or owns this recovery job; leaving it untouched"
          fi

          service_state=""
          for attempt in $(seq 1 30); do
            service_state="$(systemctl is-active "$SERVICE" || true)"
            if [[ "$service_state" == "active" ]]; then
              break
            fi
            sleep 2
          done
          systemctl is-enabled "$SERVICE"
          if [[ "$service_state" != "active" ]]; then
            systemctl status "$SERVICE" --no-pager --full || true
            journalctl -u "$SERVICE" -n 80 --no-pager || true
            exit 1
          fi
          systemctl show "$SERVICE" -p ActiveState -p SubState -p NRestarts -p MainPID -p User -p CPUWeight -p CPUQuotaPerSecUSec -p Environment --no-pager
          systemctl is-active "$RUNNER_SERVICE"
          systemctl show "$RUNNER_SERVICE" -p ActiveState -p SubState -p MainPID --no-pager

          "$ROOT/.venv/bin/python" -m prop_trading_ai.cli.v1_cpu_attribution \
            --sample-seconds 8 \
            --output "/tmp/ftmo-recovery-cpu-attribution.json"
          python3 - <<'PY'
          import json
          from pathlib import Path

          receipt = json.loads(Path("/tmp/ftmo-recovery-cpu-attribution.json").read_text(encoding="utf-8"))
          attr = receipt["attribution"]
          print("FTMO_CPU_ATTRIBUTION", json.dumps(attr, sort_keys=True))
          if not attr.get("ftmo_primary_attributed_compute"):
              print("FTMO_ATTRIBUTION_NOT_PRIMARY=1")
          PY
          if ! python3 - <<'PY'
          import json
          from pathlib import Path
          attr = json.loads(Path("/tmp/ftmo-recovery-cpu-attribution.json").read_text(encoding="utf-8"))["attribution"]
          raise SystemExit(0 if attr.get("ftmo_primary_attributed_compute") else 1)
          PY
          then
            systemctl status "$SERVICE" --no-pager --full || true
            journalctl -u "$SERVICE" -n 120 --no-pager || true
            if [[ -f "$ROOT/.scratch/autonomy/status.json" ]]; then
              python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("/opt/ftmo-autonomous")
          status=json.loads((root/".scratch/autonomy/status.json").read_text())
          print("FTMO_LAST_STATUS", json.dumps({
              "completed_at_utc": status.get("completed_at_utc"),
              "ok": status.get("ok"),
              "error": status.get("error"),
              "research": status.get("research"),
          }, sort_keys=True))
          machine=json.loads((root/"configs/research_machine.json").read_text())
          active=machine.get("active_generation") or {}
          pred=active.get("predecessor_closure")
          diag={
              "generation_number": active.get("generation_number"),
              "generation_id": active.get("generation_id"),
              "predecessor_generation_id": active.get("predecessor_generation_id"),
              "predecessor_closure": pred,
          }
          if pred:
              pred_path=root/pred
              diag["predecessor_exists"]=pred_path.is_file()
              if pred_path.is_file():
                  payload=json.loads(pred_path.read_text())
                  diag["predecessor_payload"]={
                      "schema_version": payload.get("schema_version"),
                      "scope": payload.get("scope"),
                      "status": payload.get("status"),
                      "generation_number": payload.get("generation_number"),
                      "generation_id": payload.get("generation_id"),
                      "next_generation_number": payload.get("next_generation_number"),
                      "strategy_outcomes_observed": payload.get("strategy_outcomes_observed"),
                  }
          print("FTMO_RESEARCH_MACHINE_DIAG", json.dumps(diag, sort_keys=True))
          PY
            fi
            exit 1
          fi
          systemctl show "$SERVICE" -p NRestarts -p MainPID -p ActiveState -p SubState --no-pager
          "$ROOT/.venv/bin/python" - <<'PY'
          import json
          from pathlib import Path

          path = Path("/opt/ftmo-autonomous/.scratch/autonomy/status.json")
          if not path.exists():
              print("FTMO_STATUS=not-yet-written")
              raise SystemExit(0)
          status = json.loads(path.read_text(encoding="utf-8"))
          assert status.get("live_trading_allowed") is False
          assert status.get("broker_order_submission_allowed") is False
          assert str(status.get("autonomous_cloud_budget_usd")) == "0.00"
          research = status.get("research") or {}
          print(json.dumps({
              "FTMO_PERSISTENT_RUNTIME": "active",
              "completed_at_utc": status.get("completed_at_utc"),
              "ok": status.get("ok"),
              "generation_number": research.get("generation_number"),
              "generation_id": research.get("generation_id"),
              "next_stage": research.get("next_stage"),
              "error": status.get("error"),
          }, sort_keys=True))
          PY
