name: Fuckball autonomous AI league on VPS (external storage only)
on:
  workflow_dispatch:
    inputs:
      confirm_sha:
        description: Confirm the exact zCloud main commit SHA before VPS changes
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: fuckball-ai-league-vps
  cancel-in-progress: false

jobs:
  provision:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'Zennay/zCloud' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'Zennay' &&
      github.triggering_actor == 'Zennay' &&
      github.run_attempt == 1
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 40
    steps:
      - name: Verify immutable workflow source, user intent and NEW VPS
        env:
          CONFIRMED_SHA: ${{ inputs.confirm_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRMED_SHA" = "$GITHUB_SHA"
          [[ "$CONFIRMED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git ls-remote https://github.com/Zennay/zCloud.git refs/heads/main | awk '{print $1}')" = "$GITHUB_SHA"
          test "$(hostname)" = 'VM-7eb5ee16-2c71-440d-b7fd-8095d204e930'
      - name: Start training only if an independent external block disk is mounted
        shell: bash
        run: |
          set -euo pipefail
          script="$(mktemp /dev/shm/fuckball-external-manual.XXXXXXXX)"
          trap 'rm -f "$script"' EXIT
          curl --fail --silent --show-error --location --max-time 30 \
            "https://raw.githubusercontent.com/Zennay/zCloud/$GITHUB_SHA/ops/start-fuckball-external-training-20261022.sh" \
            -o "$script"
          test "$(git hash-object "$script")" = '18b8eb90a48c973d688f00a73baef18a2165edff'
          bash "$script"
