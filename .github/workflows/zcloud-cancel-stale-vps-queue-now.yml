name: Cancel stale queued zCloud VPS runs for Firefox recovery

on:
  push:
    branches:
      - ops/firefox-generation-start-race-debug-20261007-w1
    paths:
      - .github/workflows/zcloud-cancel-stale-vps-queue-now.yml

permissions:
  actions: write
  contents: read

jobs:
  cancel-stale:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Cancel only stale queued old-main VPS runs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request
          from datetime import datetime, timezone

          repo=os.environ["REPO"]
          token=os.environ["GH_TOKEN"]
          api="https://api.github.com"
          allow={
              ".github/workflows/zcloud-self-hosted-queue-watchdog.yml",
              ".github/workflows/zcloud-vps-deploy.yml",
          }
          headers={
              "Authorization":f"Bearer {token}",
              "Accept":"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28",
              "User-Agent":"zcloud-stale-vps-queue-cleanup/1",
          }

          def req(method,path,allow_conflict=False):
              r=urllib.request.Request(api+path,headers=headers,method=method)
              try:
                  with urllib.request.urlopen(r,timeout=20) as response:
                      raw=response.read()
                      return int(response.status), (json.loads(raw) if raw else {})
              except urllib.error.HTTPError as exc:
                  if allow_conflict and exc.code in (404,409):
                      return int(exc.code), {}
                  raw=exc.read().decode("utf-8","replace")
                  raise SystemExit(f"GitHub API {method} {path} failed: HTTP {exc.code} {raw[:500]}")

          def get(path):
              status, body=req("GET",path)
              if status>=300:
                  raise SystemExit(f"unexpected GET status {status} for {path}")
              return body

          main=get(f"/repos/{repo}/branches/main")
          main_sha=str((main.get("commit") or {}).get("sha") or "")
          if len(main_sha)!=40:
              raise SystemExit("could not resolve canonical main SHA")

          queued=get(f"/repos/{repo}/actions/runs?status=queued&per_page=100").get("workflow_runs") or []
          now=datetime.now(timezone.utc)
          cancelled=[]
          kept=[]
          for run in queued:
              created=datetime.fromisoformat(str(run.get("created_at") or "").replace("Z","+00:00"))
              age=(now-created).total_seconds()
              path=str(run.get("path") or "")
              stale=(
                  str(run.get("head_branch") or "")=="main"
                  and str(run.get("head_sha") or "")!=main_sha
                  and path in allow
                  and age>=1800
              )
              if not stale:
                  kept.append({
                      "id":run.get("id"),"path":path,"head_sha":run.get("head_sha"),
                      "age_seconds":round(age),"reason":"not-exact-stale-allowlisted",
                  })
                  continue
              run_id=int(run["id"])
              status,_=req("POST",f"/repos/{repo}/actions/runs/{run_id}/cancel",allow_conflict=True)
              item={
                  "id":run_id,"path":path,"head_sha":run.get("head_sha"),
                  "age_seconds":round(age),"cancel_status":status,
              }
              if status in (202,204):
                  cancelled.append(item)
              else:
                  kept.append({**item,"reason":"status-raced-before-cancel"})

          print("CANONICAL_MAIN="+main_sha)
          print("CANCELLED="+json.dumps(cancelled,sort_keys=True))
          print("KEPT_COUNT="+str(len(kept)))
          if not cancelled:
              print("STALE_VPS_QUEUE_ALREADY_CLEAN=1")
          else:
              print("STALE_VPS_QUEUE_CANCELLED=1")
          PY
