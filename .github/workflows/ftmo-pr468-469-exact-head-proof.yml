name: FTMO PR468-469 exact-head proof

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-pr468-469-exact-head-proof.yml"

permissions:
  contents: write

concurrency:
  group: ftmo-pr468-469-exact-head-proof
  cancel-in-progress: true

jobs:
  proof:
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      PR468_SHA: 0ff8fd49547a141dc87d5c4a933be758a4a1d6c8
      PR469_SHA: 65eec5273ab1d7bad8892b20b2900c73759b8664
      FTMO_AUTONOMOUS_CLOUD_BUDGET_USD: "0.00"
      FTMO_ALLOW_PAID_AWS: ""
    steps:
      - name: Checkout receipt workspace
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Prove PR468 preserved-state sync fix
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          src="$RUNNER_TEMP/ftmo-pr468-proof"
          venv="$RUNNER_TEMP/ftmo-pr468-venv"
          rm -rf "$src" "$venv"
          git init -q "$src"
          git -C "$src" remote add origin https://github.com/Zennay/Ftmo.git
          git -C "$src" -c protocol.version=2 fetch -q --depth=1 origin "$PR468_SHA"
          git -C "$src" checkout -q --detach FETCH_HEAD
          test "$(git -C "$src" rev-parse HEAD)" = "$PR468_SHA"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install -q -r "$src/requirements-ci.txt"
          "$venv/bin/python" -m pip install -q -e "$src"
          cd "$src"
          "$venv/bin/python" -m compileall -q             src/prop_trading_ai/research/state_sync.py             src/prop_trading_ai/research/research_machine.py
          "$venv/bin/python" -m pytest -q             tests/test_autonomous_research_state_sync.py             tests/test_research_state_sync_guard.py
          "$venv/bin/python" -m pytest -q tests/test_zero_cost_workflow_boundary.py             -k "research_state_sync or every_repository_workflow_has_no_github_hosted_runner"
          echo "FTMO_PR468_EXACT_HEAD_GREEN=1"

      - name: Prove PR469 deploy-lockstep fix
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr469-proof"
          venv="$RUNNER_TEMP/ftmo-pr469-venv"
          rm -rf "$src" "$venv"
          git init -q "$src"
          git -C "$src" remote add origin https://github.com/Zennay/Ftmo.git
          git -C "$src" -c protocol.version=2 fetch -q --depth=1 origin "$PR469_SHA"
          git -C "$src" checkout -q --detach FETCH_HEAD
          test "$(git -C "$src" rev-parse HEAD)" = "$PR469_SHA"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install -q -r "$src/requirements-ci.txt"
          "$venv/bin/python" -m pip install -q -e "$src"
          cd "$src"
          "$venv/bin/python" -m compileall -q             src/prop_trading_ai/research/state_sync.py             src/prop_trading_ai/ops/autonomous_runtime.py
          "$venv/bin/python" -m pytest -q tests/test_autonomous_deploy_lockstep.py
          "$venv/bin/python" -m pytest -q tests/test_zero_cost_workflow_boundary.py             -k "every_repository_workflow_has_no_github_hosted_runner or diagnostic_zero_cost_workflows_are_self_hosted_and_secret_free"
          echo "FTMO_PR469_EXACT_HEAD_GREEN=1"

      - name: Persist sanitized proof receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-evidence
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          payload = {
              "schema_version": 1,
              "project": "ftmo",
              "host": "vps-bb300bba",
              "runner": os.environ.get("RUNNER_NAME", ""),
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "result": "success",
              "pr468_sha": os.environ["PR468_SHA"],
              "pr468_scope": [
                  "preserved-newer-stable-no-forced-provider-tick",
                  "post-sync-monotonic-verification",
                  "zero-cost-workflow-boundary",
              ],
              "pr469_sha": os.environ["PR469_SHA"],
              "pr469_scope": [
                  "state-sync-in-deploy-trigger",
                  "state-sync-in-atomic-runtime-set",
                  "state-sync-compile-and-byte-identity-lockstep",
                  "zero-cost-workflow-boundary",
              ],
              "paid_cloud_budget_usd": "0.00",
              "research_outcomes_accessed": False,
              "live_or_broker_access_opened": False,
          }
          Path("runtime-evidence/ftmo-pr468-469-exact-head-proof.json").write_text(
              json.dumps(payload, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime-evidence/ftmo-pr468-469-exact-head-proof.json
          git commit -m "Record FTMO PR468/469 exact-head proof"
          git push origin HEAD:main

      - name: Clean proof workspaces
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/ftmo-pr468-proof" "$RUNNER_TEMP/ftmo-pr468-venv"                  "$RUNNER_TEMP/ftmo-pr469-proof" "$RUNNER_TEMP/ftmo-pr469-venv"
