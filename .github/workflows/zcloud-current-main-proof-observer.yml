name: zCloud current-main proof observer

on:
  push:
    branches: [ops/current-main-proof-observer-20261004]
    paths:
      - .github/workflows/zcloud-current-main-proof-observer.yml
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/zcloud-current-main-proof-observer.yml

permissions:
  contents: read
  actions: write

jobs:
  close-receipt-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TARGET_SHA: 60fd17ccb6203f51ba9514da7f1ae1d08571d380
      DEPLOY_RUN: "37231857854"
      AUDIT_WORKFLOW: zcloud-state-receipt-coverage-audit.yml
    steps:
      - name: Wait for exact guarded deploy
        shell: bash
        run: |
          set -Eeuo pipefail
          for attempt in $(seq 1 60); do
            payload="$(gh api "repos/$REPO/actions/runs/$DEPLOY_RUN")"
            status="$(jq -r .status <<<"$payload")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$payload")"
            sha="$(jq -r .head_sha <<<"$payload")"
            printf 'ZCLOUD_DEPLOY_WATCH attempt=%s status=%s conclusion=%s sha=%s\n' "$attempt" "$status" "$conclusion" "$sha"
            test "$sha" = "$TARGET_SHA"
            if [[ "$status" == "completed" ]]; then
              test "$conclusion" = "success"
              echo "ZCLOUD_EXACT_DEPLOY_GREEN run=$DEPLOY_RUN sha=$sha"
              exit 0
            fi
            sleep 10
          done
          echo "exact deploy did not complete inside bounded observer window" >&2
          exit 1

      - name: Dispatch direct live receipt coverage audit
        id: dispatch
        shell: bash
        run: |
          set -Eeuo pipefail
          dispatched_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh api --method POST             -H "Accept: application/vnd.github+json"             "repos/$REPO/actions/workflows/$AUDIT_WORKFLOW/dispatches"             -f ref=main >/dev/null
          echo "dispatched_at=$dispatched_at" >> "$GITHUB_OUTPUT"
          echo "ZCLOUD_RECEIPT_AUDIT_DISPATCHED at=$dispatched_at"

      - name: Follow receipt coverage audit to terminal state
        shell: bash
        env:
          DISPATCHED_AT: ${{ steps.dispatch.outputs.dispatched_at }}
        run: |
          set -Eeuo pipefail
          audit_id=""
          for attempt in $(seq 1 30); do
            audit_id="$(
              gh api "repos/$REPO/actions/workflows/$AUDIT_WORKFLOW/runs?event=workflow_dispatch&branch=main&per_page=20"                 --jq '[.workflow_runs[] | select(.created_at >= env.DISPATCHED_AT)] | sort_by(.created_at) | last | .id // empty'
            )"
            if [[ -n "$audit_id" ]]; then
              echo "ZCLOUD_RECEIPT_AUDIT_FOUND run=$audit_id"
              break
            fi
            sleep 5
          done
          test -n "$audit_id"

          for attempt in $(seq 1 60); do
            payload="$(gh api "repos/$REPO/actions/runs/$audit_id")"
            status="$(jq -r .status <<<"$payload")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$payload")"
            printf 'ZCLOUD_RECEIPT_AUDIT_WATCH attempt=%s run=%s status=%s conclusion=%s\n' "$attempt" "$audit_id" "$status" "$conclusion"
            if [[ "$status" == "completed" ]]; then
              test "$conclusion" = "success"
              echo "ZCLOUD_RECEIPT_AUDIT_GREEN run=$audit_id"
              exit 0
            fi
            sleep 10
          done
          echo "receipt audit did not complete inside bounded observer window" >&2
          exit 1
