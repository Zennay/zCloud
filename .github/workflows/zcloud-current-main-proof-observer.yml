name: zCloud current-main proof observer

on:
  push:
    branches: [ops/current-main-proof-observer-20261004]
    paths:
      - .github/workflows/zcloud-current-main-proof-observer.yml
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/zcloud-current-main-proof-observer.yml

permissions:
  contents: read
  actions: write

jobs:
  prioritize-production:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TARGET_SHA: 60fd17ccb6203f51ba9514da7f1ae1d08571d380
      CANCEL_RUNS: "37231924254 37231924271 37231924230 37231924243"
      DEPLOY_RUN: "37231857854"
    steps:
      - name: Cancel superseded PR self-hosted validations
        shell: bash
        run: |
          set -Eeuo pipefail
          for id in $CANCEL_RUNS; do
            status="$(gh api "repos/$REPO/actions/runs/$id" --jq .status)"
            conclusion="$(gh api "repos/$REPO/actions/runs/$id" --jq '.conclusion // ""')"
            echo "PR_VALIDATION run=$id status=$status conclusion=$conclusion"
            case "$status" in
              queued|in_progress|pending|waiting)
                gh api --method POST "repos/$REPO/actions/runs/$id/cancel" >/dev/null
                echo "PR_VALIDATION_CANCEL_REQUESTED=$id"
                ;;
              *)
                echo "PR_VALIDATION_ALREADY_TERMINAL=$id"
                ;;
            esac
          done

      - name: Reconfirm exact current-main production lane
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api "repos/$REPO/actions/runs/$DEPLOY_RUN" > "$RUNNER_TEMP/deploy.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          run=json.loads(Path(os.environ["RUNNER_TEMP"]+"/deploy.json").read_text())
          expected=os.environ["TARGET_SHA"]
          result={
              "id":run.get("id"),
              "status":run.get("status"),
              "conclusion":run.get("conclusion"),
              "head_sha":run.get("head_sha"),
              "event":run.get("event"),
              "run_number":run.get("run_number"),
          }
          if result["head_sha"] != expected:
              raise SystemExit("deploy target moved: "+json.dumps(result,sort_keys=True))
          print("ZCLOUD_PRODUCTION_PRIORITY="+json.dumps(result,sort_keys=True))
          PY
