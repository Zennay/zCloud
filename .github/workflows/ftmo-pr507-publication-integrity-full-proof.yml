name: FTMO PR507 full exact-head publication integrity proof

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-pr507-publication-integrity-full-proof.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ftmo-pr507-publication-integrity-full-proof
  cancel-in-progress: true

jobs:
  proof:
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 35
    env:
      TARGET_SHA: 9e397dc2a667880774660db47ce14b84ce7e446b
      TARGET_PR: "507"
      EXPECTED_MAIN_SHA: ffac9e856abd6547913375be9206a7b86603a2d8
      FTMO_AUTONOMOUS_CLOUD_BUDGET_USD: "0.00"
      FTMO_ALLOW_PAID_AWS: ""
    steps:
      - name: Verify exact FTMO identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          test "$(gh api repos/Zennay/Ftmo/commits/main --jq .sha)" = "$EXPECTED_MAIN_SHA"
          test "$(gh api "repos/Zennay/Ftmo/pulls/$TARGET_PR" --jq .state)" = "open"
          test "$(gh api "repos/Zennay/Ftmo/pulls/$TARGET_PR" --jq .head.sha)" = "$TARGET_SHA"
          test "$(gh api "repos/Zennay/Ftmo/pulls/$TARGET_PR" --jq .base.sha)" = "$EXPECTED_MAIN_SHA"

      - name: Checkout exact FTMO PR507 head
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/ftmo-pr507-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          rm -rf "$work"
          git init -q "$work"
          git -C "$work" remote add origin https://github.com/Zennay/Ftmo.git
          git -C "$work" -c protocol.version=2 fetch -q --depth=1 origin "$TARGET_SHA"
          git -C "$work" checkout -q --detach FETCH_HEAD
          test "$(git -C "$work" rev-parse HEAD)" = "$TARGET_SHA"

      - name: Install exact-head test environment
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/ftmo-pr507-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          venv="$RUNNER_TEMP/ftmo-pr507-venv-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          rm -rf "$venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install -q -r "$work/requirements-ci.txt"
          "$venv/bin/python" -m pip install -q -e "$work"
          echo "FTMO_WORK=$work" >> "$GITHUB_ENV"
          echo "FTMO_VENV=$venv" >> "$GITHUB_ENV"

      - name: Prove publication-integrity regressions
        shell: bash
        run: |
          set -euo pipefail
          cd "$FTMO_WORK"
          "$FTMO_VENV/bin/python" -m pytest -q tests/test_research_state_sync_guard.py tests/test_deploy_publish_integrity.py tests/test_research_machine.py tests/test_research_state_sync_publication_integrity.py

      - name: Build exact memory-bounded full-suite plan
        shell: bash
        run: |
          set -euo pipefail
          cd "$FTMO_WORK"
          mkdir -p .scratch
          "$FTMO_VENV/bin/python" - <<'PY'
          from pathlib import Path
          import contextlib
          import io
          import pytest

          class Collector:
              paths = None
              count = None

              def pytest_collection_finish(self, session):
                  self.count = len(session.items)
                  self.paths = sorted(
                      {
                          Path(str(item.path)).resolve().relative_to(Path.cwd().resolve()).as_posix()
                          for item in session.items
                      }
                  )

          collector = Collector()
          captured = io.StringIO()
          with contextlib.redirect_stdout(captured), contextlib.redirect_stderr(captured):
              exit_code = pytest.main(["--collect-only", "-q"], plugins=[collector])
          if exit_code != pytest.ExitCode.OK or collector.paths is None or collector.count is None:
              raise SystemExit("pytest collection failed: " + captured.getvalue()[-2000:])
          if not collector.paths or collector.count <= 0:
              raise SystemExit("pytest collected no tests")
          Path(".scratch/ci-test-files.txt").write_text(
              "\n".join(collector.paths) + "\n", encoding="utf-8"
          )
          Path(".scratch/ci-test-count.txt").write_text(
              str(collector.count) + "\n", encoding="utf-8"
          )
          print(f"collected_tests={collector.count}")
          print(f"test_files={len(collector.paths)}")
          PY

      - name: Run full unit suite in memory-bounded file batches
        shell: bash
        run: |
          set -euo pipefail
          cd "$FTMO_WORK"
          expected_count="$(cat .scratch/ci-test-count.txt)"
          executed_files=0
          while IFS= read -r test_file; do
            [[ -n "$test_file" ]] || continue
            echo "::group::$test_file"
            "$FTMO_VENV/bin/python" -m pytest -q "$test_file"
            echo "::endgroup::"
            executed_files=$((executed_files + 1))
          done < .scratch/ci-test-files.txt
          test "$executed_files" -gt 0
          echo "planned_collected_tests=$expected_count"
          echo "executed_test_files=$executed_files"

      - name: Revalidate exact identities and sealed boundaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/Zennay/Ftmo/commits/main --jq .sha)" = "$EXPECTED_MAIN_SHA"
          test "$(gh api "repos/Zennay/Ftmo/pulls/$TARGET_PR" --jq .state)" = "open"
          test "$(gh api "repos/Zennay/Ftmo/pulls/$TARGET_PR" --jq .head.sha)" = "$TARGET_SHA"
          test "$(gh api "repos/Zennay/Ftmo/pulls/$TARGET_PR" --jq .base.sha)" = "$EXPECTED_MAIN_SHA"
          test "$FTMO_AUTONOMOUS_CLOUD_BUDGET_USD" = "0.00"
          test -z "${FTMO_ALLOW_PAID_AWS:-}"
          echo "FTMO_PR507_FULL_EXACT_HEAD_PROOF=success"

      - name: Persist durable exact-head proof receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-evidence
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          payload = {
              "schema_version": 1,
              "project": "ftmo",
              "pull_request": 507,
              "target_sha": os.environ["TARGET_SHA"],
              "expected_main_sha": os.environ["EXPECTED_MAIN_SHA"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "runner": os.environ.get("RUNNER_NAME", ""),
              "host": "vps-bb300bba",
              "result": "success",
              "proof": [
                  "exact-pr-head-and-main-identity",
                  "strict-research-state-json-regressions",
                  "publication-integrity-regressions",
                  "full-memory-bounded-unit-suite",
                  "zero-paid-cloud-boundary",
              ],
              "paid_cloud_budget_usd": "0.00",
              "provider_io_forced": False,
              "research_outcomes_accessed": False,
              "walk_forward_accessed": False,
              "final_holdout_accessed": False,
              "live_or_broker_access_opened": False,
          }
          Path("runtime-evidence/ftmo-pr507-strict-json-full-proof.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime-evidence/ftmo-pr507-strict-json-full-proof.json
          git commit -m "Record FTMO PR507 exact-head proof $GITHUB_RUN_ID"
          git push origin HEAD:main

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/ftmo-pr507-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
                 "$RUNNER_TEMP/ftmo-pr507-venv-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
