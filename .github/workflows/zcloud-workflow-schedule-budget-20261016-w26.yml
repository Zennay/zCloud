name: zCloud scheduled workflow frequency budget (hosted only)

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/**
      - scripts/zcloud_workflow_schedule_budget_ratchet_20261016_w26.py
      - tests/test_zcloud_workflow_schedule_budget_ratchet_20261016_w26.py

permissions:
  contents: read

concurrency:
  group: zcloud-schedule-budget-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  admission:
    name: Reject untrusted source before checkout
    if: ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || (github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'Zennay'))
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 3
    steps:
      - name: Prove same-repository PR and target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          TARGET: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = Zennay/zCloud
          test "$EVENT_NAME" = pull_request
          test "$BASE_REPO" = "$GITHUB_REPOSITORY"
          test "$HEAD_REPO" = "$GITHUB_REPOSITORY"
          test "$TARGET" = main

  audit:
    name: Budget proof without VPS or writes
    needs: admission
    if: ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || (github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'Zennay'))
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 1
      - name: Compare exact head to canonical remote main
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git fetch --no-tags --depth=1 origin '+refs/heads/main:refs/remotes/origin/main'
          base_sha="$(git rev-parse refs/remotes/origin/main)"
          [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$base_sha" = "$EVENT_BASE_SHA"
          echo "ZCLOUD_CRON_BASE_SHA=$base_sha"
      - name: Adversarial real-git and cron policy tests
        run: python3 -m unittest -v tests.test_zcloud_workflow_schedule_budget_ratchet_20261016_w26
      - name: Deny new high frequency scheduled jobs
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/zcloud-schedule-budget.json"
          python3 scripts/zcloud_workflow_schedule_budget_ratchet_20261016_w26.py \
            --repo-root . \
            --baseline-sha "$(git rev-parse refs/remotes/origin/main)" > "$report"
          REPORT="$report" python3 - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path(os.environ["REPORT"]).read_text())
          assert report["policy"] == "zcloud-scheduled-workflow-no-new-debt-v1"
          assert report["accepted"] is True
          assert report["new_high_frequency"] == []
          assert report["merge_authorized"] is False
          assert report["production_mutation_authorized"] is False
          assert report["mutation_performed"] is False
          print("ZCLOUD_SCHEDULE_BUDGET_DENY_ONLY_VALID=1")
          PY
