name: zSSH canonical reviewer trust and public-gateway preflight

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/zssh-public-gateway-preflight.yml"
      - "tests/test_zssh_public_gateway_preflight_workflow.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/zssh-public-gateway-preflight.yml"
      - "tests/test_zssh_public_gateway_preflight_workflow.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zssh-public-gateway-preflight-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'live' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPECTED_ZCLOUD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact zCloud candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.EXPECTED_ZCLOUD_SHA }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact zCloud candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_ZCLOUD_SHA"

      - name: Validate preflight workflow contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v tests.test_zssh_public_gateway_preflight_workflow

  prove:
    if: github.event_name != 'pull_request' && github.repository == 'Zennay/zCloud' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 12
    env:
      EXPECTED_ZCLOUD_SHA: ${{ github.sha }}
      EXPECTED_ZSSH_SHA: d2a0b2259deac4b6c7363258dc85e7b213ae507c
    steps:
      - name: Checkout exact zCloud revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.EXPECTED_ZCLOUD_SHA }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify permanent VPS runner and exact zCloud revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_ZCLOUD_SHA"
          test "$(hostname)" = "vps-bb300bba"
          test "$(id -un)" = "ubuntu"
          python3 scripts/zcloud_vps_runner_guard.py --json

      - name: Checkout canonical public gateway release
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: Zennay/zSSH
          ref: ${{ env.EXPECTED_ZSSH_SHA }}
          path: zssh
          persist-credentials: false
          fetch-depth: 1

      - name: Prove reviewer trust and gateway compatibility
        shell: bash
        run: |
          set -Eeuo pipefail
          cd zssh
          test "$(git rev-parse HEAD)" = "$EXPECTED_ZSSH_SHA"
          npm install --ignore-scripts --no-audit --no-fund >/dev/null

          output="$(npm run --silent review:target)"

          node --input-type=module - "$output" "$HOME/.config/zssh/reviewer-agent-public.json" <<'NODE'
          import { readFileSync } from "node:fs";
          import { agentPublicKeysFromEnv } from "./agent-transport.mjs";
          const [raw, publicFile] = process.argv.slice(2);
          const report = JSON.parse(raw);
          if (report.target_id !== "zt_NgZ8uUmNyTS--jC_") throw new Error("review target identity changed");
          if (report.public_key_sha256 !== "2d1c4fd95e3b145ac80c520c30643c3ba50e7e95d621988221076d6b1cbe859d") {
            throw new Error("review target fingerprint changed");
          }
          const config = JSON.parse(readFileSync(publicFile, "utf8"));
          if (config.version !== 1 || config.gateway_public_key_config !== undefined) {
            throw new Error("reviewer trust file is not normalized");
          }
          const trusted = agentPublicKeysFromEnv({ ZSSH_AGENT_PUBLIC_KEYS_FILE: publicFile });
          if (trusted.size !== 1 || !trusted.has(report.target_id)) {
            throw new Error("canonical gateway loader rejected live reviewer trust file");
          }
          console.log(JSON.stringify({
            ok: true,
            target_id: report.target_id,
            public_key_sha256: report.public_key_sha256,
            trusted_key_count: trusted.size,
          }));
          NODE

      - name: Validate canonical public gateway without runtime mutation
        shell: bash
        run: |
          set -Eeuo pipefail
          cd zssh
          test ! -e "$HOME/.config/zssh/public-gateway.env"
          test ! -e "$HOME/.local/share/zssh-public/current"

          ZSSH_PUBLIC_BASE_URL=https://mcp.review.example \
          ZSSH_OAUTH_ISSUER=https://auth.review.example \
          ZSSH_OAUTH_JWKS_URI=https://auth.review.example/.well-known/jwks.json \
          ZSSH_TARGET_ID=zt_NgZ8uUmNyTS--jC_ \
          ZSSH_AGENT_PUBLIC_KEYS_FILE="$HOME/.config/zssh/reviewer-agent-public.json" \
          ZSSH_PUBLIC_ALLOWED_ROOTS="$HOME/zssh-review" \
          ZSSH_PUBLIC_GATEWAY_VALIDATE_ONLY=1 \
          ZSSH_EXPECTED_SHA="$EXPECTED_ZSSH_SHA" \
          npm run --silent gateway:public:install

          test ! -e "$HOME/.config/zssh/public-gateway.env"
          test ! -e "$HOME/.local/share/zssh-public/current"
          echo "ZSSH_CANONICAL_PUBLIC_GATEWAY_PREFLIGHT_GREEN"
