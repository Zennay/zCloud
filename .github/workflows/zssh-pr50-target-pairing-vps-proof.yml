name: zSSH canonical target-pairing target-pairing zCloud VPS proof

on:
  push:
    branches:
      - proof/zssh-pr50-target-pairing-20261004

concurrency:
  group: zssh-target-pairing-canonical-proof
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  proof:
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 15
    steps:
      - name: Checkout exact zSSH PR head
        uses: actions/checkout@v4
        with:
          repository: Zennay/zSSH
          ref: 72a989898590d64f491a879ff0c9af5c184a7695
          path: zssh

      - name: Verify exact head and run full proof
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C zssh rev-parse HEAD)" = "72a989898590d64f491a879ff0c9af5c184a7695"
          cd zssh
          npm install --ignore-scripts --no-audit --no-fund
          npm test
          node agent-pairing-canary.mjs
          node --check server.mjs
          node --check agent-transport.mjs
          node --check agent-pairing-control.mjs
          node --check agent-runtime.mjs
          node --check agent.mjs
