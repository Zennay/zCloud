name: FTMO PR420 exact-head hourly cache directory proof

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-pr420-hourly-cache-dir-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ftmo-pr420-exact-head-hourly-cache-directory-proof
  cancel-in-progress: false

jobs:
  proof:
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 20
    env:
      TARGET_SHA: 6acea69c256a3f8ea3701c331c84d1c3f2d5c6f5
      FTMO_AUTONOMOUS_CLOUD_BUDGET_USD: '0.00'
      FTMO_ALLOW_PAID_AWS: ''
    steps:
      - name: Checkout zCloud proof workspace
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main

      - name: Fetch exact FTMO PR420 head
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          src="$RUNNER_TEMP/ftmo-pr420-proof"
          rm -rf "$src"
          gh repo clone Zennay/Ftmo "$src" -- --filter=blob:none --no-checkout >/dev/null
          git -C "$src" checkout --detach "$TARGET_SHA" >/dev/null
          test "$(git -C "$src" rev-parse HEAD)" = "$TARGET_SHA"
          echo "FTMO_PR420_EXACT_SHA=$TARGET_SHA"

      - name: Install isolated test environment
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr420-proof"
          venv="$RUNNER_TEMP/ftmo-pr420-proof-venv"
          rm -rf "$venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install -q -r "$src/requirements-ci.txt"
          "$venv/bin/python" -m pip install -q -e "$src"

      - name: Compile changed provider cache boundary
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr420-proof"
          venv="$RUNNER_TEMP/ftmo-pr420-proof-venv"
          cd "$src"
          "$venv/bin/python" -m compileall -q             src/prop_trading_ai/data/market/dukascopy_tick_resume_cache.py             src/prop_trading_ai/data/market/dukascopy_public_ingest.py
          echo "FTMO_PR420_COMPILE_GREEN=1"

      - name: Prove hourly cache directory integrity
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr420-proof"
          venv="$RUNNER_TEMP/ftmo-pr420-proof-venv"
          cd "$src"
          "$venv/bin/python" -m pytest -q tests/test_dukascopy_tick_resume_cache.py
          echo "FTMO_PR420_CACHE_TESTS_GREEN=1"

      - name: Prove adjacent sealed boundaries
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr420-proof"
          venv="$RUNNER_TEMP/ftmo-pr420-proof-venv"
          cd "$src"
          "$venv/bin/python" -m pytest -q             tests/test_dukascopy_jetta_m1.py             tests/test_autonomous_provider_retry.py             tests/test_zero_cost_workflow_boundary.py             tests/test_autonomous_deploy_lockstep.py
          echo "FTMO_PR420_BOUNDARY_TESTS_GREEN=1"

      - name: Verify full-suite collection
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr420-proof"
          venv="$RUNNER_TEMP/ftmo-pr420-proof-venv"
          cd "$src"
          "$venv/bin/python" -m pytest --collect-only -q >/tmp/ftmo-pr420-collect.txt
          tail -n 1 /tmp/ftmo-pr420-collect.txt
          echo "FTMO_PR420_COLLECTION_GREEN=1"

      - name: Record proof identity
        shell: bash
        run: |
          set -euo pipefail
          echo "FTMO_PR420_PROOF_RUN_ID=$GITHUB_RUN_ID"
          echo "FTMO_PR420_PROOF_RESULT=success"
          echo "FTMO_PR420_TARGET_SHA=$TARGET_SHA"
