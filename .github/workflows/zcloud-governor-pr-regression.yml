name: zCloud governor immutable PR regression

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# A source-only check: never start, register or replace a VPS runner.
# Cancellation affects only an older check for the same PR, never main.
concurrency:
  group: zcloud-governor-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  governor-regressions:
    name: Verify guarded resource leases on exact PR head
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Reject untrusted event before any repository code is checked out
        shell: bash
        env:
          EVENT_KIND: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          SOURCE_ACTOR: ${{ github.actor }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$EVENT_KIND" = pull_request
          test "$REPOSITORY" = Zennay/zCloud
          test "$HEAD_REPOSITORY" = "$REPOSITORY"
          test "$BASE_REPOSITORY" = "$REPOSITORY"
          test "$BASE_BRANCH" = main
          test "$SOURCE_ACTOR" = Zennay
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Checkout immutable PR source without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 1

      - name: Prove exact checkout, then execute isolated governor regressions
        shell: bash
        env:
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          python3 -m unittest discover -s tests -p 'test_zcloud_governed_exec.py' -v
