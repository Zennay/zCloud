name: Cancel stale contract proof carrier

on:
  push:
    branches:
      - "ops/cancel-stale-contract-proof-20261005"
    paths:
      - ".github/workflows/cancel-stale-contract-proof-20261005.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/cancel-stale-contract-proof-20261005.yml"

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Cancel only the superseded read-only proof run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: "37329152085"
          EXPECTED_SHA: "bf9503bfe0fd10d5f87978e045ab09007d785580"
          EXPECTED_NAME: "Prove project-contract cutover production a755"
        shell: bash
        run: |
          set -Eeuo pipefail
          payload="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}")"
          sha="$(jq -r '.head_sha' <<<"$payload")"
          name="$(jq -r '.name' <<<"$payload")"
          status="$(jq -r '.status' <<<"$payload")"
          event="$(jq -r '.event' <<<"$payload")"
          test "$sha" = "$EXPECTED_SHA"
          test "$name" = "$EXPECTED_NAME"
          test "$event" = "pull_request"
          case "$status" in
            queued|in_progress|waiting|pending)
              gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/cancel" || true
              echo "STALE_CONTRACT_PROOF_CANCEL_REQUESTED run_id=$RUN_ID status=$status"
              for _ in 1 2 3 4 5; do
                sleep 2
                status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq .status)"
                if [[ "$status" == "completed" ]]; then
                  echo "STALE_CONTRACT_PROOF_CANCELLED run_id=$RUN_ID"
                  exit 0
                fi
              done
              gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/force-cancel"
              echo "STALE_CONTRACT_PROOF_FORCE_CANCEL_REQUESTED run_id=$RUN_ID"
              ;;
            completed)
              echo "STALE_CONTRACT_PROOF_ALREADY_TERMINAL run_id=$RUN_ID"
              ;;
            *)
              echo "unexpected run status: $status" >&2
              exit 2
              ;;
          esac
