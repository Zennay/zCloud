# FTMO verify72 recovery: restart standalone Violentmonkey Firefox 2026-10-02T09:27Z
name: zCloud restart allocated workers

on:
  workflow_dispatch:
  schedule:
    # Forced hourly refresh for the seven ChatGPT workers. The workflow itself
    # prefers fresh chats and already recovers by recycling the Firefox consumer.
    - cron: "3 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/zcloud-restart-workers.yml"

permissions:
  contents: read

concurrency:
  group: zcloud-restart-allocated-workers
  cancel-in-progress: false

jobs:
  restart:
    runs-on: self-hosted
    timeout-minutes: 3
    steps:
      - name: Queue fresh-chat restart for allocated workers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import sqlite3
          import time
          import urllib.error
          import urllib.request
          import urllib.parse
          from datetime import datetime, timezone

          DB = "/home/ubuntu/zennay-cloud/history.db"
          ORDINARY_COMMAND_STALE_SECONDS = 120
          LONG_COMMAND_STALE_SECONDS = max(
              ORDINARY_COMMAND_STALE_SECONDS,
              int(os.environ.get("ZCLOUD_RUNNER_COMMAND_LONG_STALE_SECONDS", "900")),
          )

          def now():
              return datetime.now(timezone.utc).isoformat()

          def api_call(method, path, payload=None):
              data = None
              headers = {"User-Agent": "zcloud-restart-workers/2"}
              if payload is not None:
                  data = json.dumps(payload).encode("utf-8")
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(
                  "http://127.0.0.1:8765" + path,
                  data=data,
                  headers=headers,
                  method=method,
              )
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      return int(response.status), json.load(response)
              except urllib.error.HTTPError as exc:
                  raw = exc.read().decode("utf-8", "replace")
                  try:
                      parsed = json.loads(raw)
                  except Exception:
                      parsed = {"error": raw[:1000]}
                  return int(exc.code), parsed

          # The legacy web-ext systemd unit is intentionally disabled in
          # Violentmonkey-only mode. Recycle the standalone Firefox session
          # instead so the userscript reinitialises and resumes DB polling.
          import os
          import signal
          import subprocess
          from pathlib import Path

          legacy_disable = os.path.expanduser(
              "~/.config/systemd/user/chatgpt-firefox.service.d/10-legacy-disabled.conf"
          )
          legacy_vm_only = False
          try:
              text = open(legacy_disable, encoding="utf-8").read().lower()
              legacy_vm_only = (
                  "violentmonkey only" in text
                  and "execcondition=/bin/false" in text
              )
          except OSError:
              pass

          if legacy_vm_only:
              bootstrap_urls = []
              with sqlite3.connect(DB, timeout=5) as bootstrap_db:
                  bootstrap_db.row_factory = sqlite3.Row
                  bootstrap_rows = bootstrap_db.execute(
                      "SELECT s.project_id,s.worker_slot,COALESCE(w.provider,'chatgpt') provider "
                      "FROM ai_global_slots s "
                      "LEFT JOIN runner_workers w "
                      "ON w.project_id=s.project_id AND w.worker_slot=s.worker_slot "
                      "ORDER BY s.slot"
                  ).fetchall()
                  for row in bootstrap_rows:
                      worker = f"{row['project_id']}::w{int(row['worker_slot'] or 1)}"
                      marker = urllib.parse.quote(worker, safe="")
                      provider = str(row["provider"] or "chatgpt").lower()
                      base = "https://claude.ai/new" if provider == "claude" else "https://chatgpt.com/"
                      sep = "&" if "?" in base else "?"
                      bootstrap_urls.append(base + sep + "zcloud_worker=" + marker)

              proc = subprocess.run(
                  ["pgrep", "-u", str(os.getuid()), "-f",
                   r"/snap/firefox/.*/usr/lib/firefox/firefox"],
                  text=True, capture_output=True, check=False,
              )
              pids = [int(x) for x in proc.stdout.split() if x.isdigit()]
              primary = pids[0] if pids else None
              prior_env = {}
              if primary:
                  try:
                      env_raw = open(f"/proc/{primary}/environ", "rb").read().split(b"\0")
                  except OSError:
                      env_raw = []
                  for item in env_raw:
                      if b"=" not in item:
                          continue
                      key, value = item.split(b"=", 1)
                      key = key.decode("utf-8", "replace")
                      if key in {
                          "DISPLAY", "XAUTHORITY", "WAYLAND_DISPLAY",
                          "DBUS_SESSION_BUS_ADDRESS", "XDG_RUNTIME_DIR",
                          "HOME", "USER", "LOGNAME",
                      }:
                          prior_env[key] = value.decode("utf-8", "replace")

              # When Firefox is already gone, recover session variables from the
              # user systemd manager and the live X sockets instead of aborting.
              if not prior_env:
                  proc_env = subprocess.run(
                      ["systemctl", "--user", "show-environment"],
                      text=True, capture_output=True, check=False,
                  )
                  for line in proc_env.stdout.splitlines():
                      if "=" not in line:
                          continue
                      key, value = line.split("=", 1)
                      if key in {
                          "DISPLAY", "XAUTHORITY", "WAYLAND_DISPLAY",
                          "DBUS_SESSION_BUS_ADDRESS", "XDG_RUNTIME_DIR",
                          "HOME", "USER", "LOGNAME",
                      }:
                          prior_env[key] = value

              for pid in pids:
                  try:
                      os.kill(pid, signal.SIGTERM)
                  except ProcessLookupError:
                      pass

              deadline = time.time() + 15
              while time.time() < deadline:
                  alive = []
                  for pid in pids:
                      try:
                          os.kill(pid, 0)
                          alive.append(pid)
                      except ProcessLookupError:
                          pass
                  if not alive:
                      break
                  time.sleep(1)
              else:
                  for pid in alive:
                      try:
                          os.kill(pid, signal.SIGKILL)
                      except ProcessLookupError:
                          pass

              launch_env = os.environ.copy()
              launch_env.pop("RUNNER_TRACKING_ID", None)
              launch_env.update(prior_env)
              if not launch_env.get("DISPLAY"):
                  x_sockets = sorted(
                      Path("/tmp/.X11-unix").glob("X*"),
                      key=lambda p: (p.name != "X10", p.name),
                  ) if Path("/tmp/.X11-unix").exists() else []
                  launch_env["DISPLAY"] = (
                      ":" + x_sockets[0].name[1:] + ".0"
                      if x_sockets else ":10.0"
                  )
              launch_env.setdefault("XDG_RUNTIME_DIR", f"/run/user/{os.getuid()}")
              launch_env.setdefault(
                  "DBUS_SESSION_BUS_ADDRESS",
                  f"unix:path={launch_env['XDG_RUNTIME_DIR']}/bus",
              )
              log_path = "/tmp/zcloud-violentmonkey-firefox-restart.log"
              with open(log_path, "ab", buffering=0) as log:
                  subprocess.Popen(
                      ["/usr/bin/firefox", *bootstrap_urls],
                      stdin=subprocess.DEVNULL,
                      stdout=log,
                      stderr=log,
                      env=launch_env,
                      start_new_session=True,
                      close_fds=True,
                  )

              new_pid = None
              deadline = time.time() + 30
              while time.time() < deadline:
                  proc = subprocess.run(
                      ["pgrep", "-u", str(os.getuid()), "-f",
                       r"/snap/firefox/.*/usr/lib/firefox/firefox"],
                      text=True, capture_output=True, check=False,
                  )
                  candidates = [
                      int(x) for x in proc.stdout.split()
                      if x.isdigit() and int(x) not in pids
                  ]
                  if candidates:
                      new_pid = candidates[0]
                      break
                  time.sleep(1)
              if not new_pid:
                  raise SystemExit(
                      "Standalone Violentmonkey Firefox did not restart; "
                      f"see {log_path}"
                  )
              print(json.dumps({
                  "consumer_restart": "standalone-firefox",
                  "old_pid": primary,
                  "new_pid": new_pid,
                  "display": launch_env.get("DISPLAY"),
                  "bootstrap_urls": bootstrap_urls,
              }, ensure_ascii=False, sort_keys=True))
              time.sleep(12)
          else:
              firefox_status, firefox = api_call(
                  "POST",
                  "/api/runner-control",
                  {"project_id": "", "action": "restart_firefox"},
              )
              restart_initial = {
                  "status": firefox_status,
                  "response": firefox,
              }
              firefox_runtime = firefox.get("status") if firefox_status < 300 else None
              if firefox_status >= 300 or not firefox.get("ok"):
                  # The backend bounds systemctl restart to 12s. Firefox can
                  # legitimately become active just after that timeout, so
                  # verify the actual runtime before treating it as a failure.
                  deadline = time.time() + 35
                  firefox_runtime = None
                  while time.time() < deadline:
                      live_status, live = api_call("GET", "/api/runner-live")
                      candidate = (live.get("chatgpt_firefox") or {}) if live_status < 300 else {}
                      if candidate.get("active"):
                          firefox_runtime = candidate
                          break
                      time.sleep(2)
                  if not firefox_runtime:
                      raise SystemExit(
                          f"Firefox worker consumer restart failed: "
                          f"HTTP {firefox_status} {firefox}"
                      )
              print(json.dumps({
                  "consumer_restart": "systemd-firefox",
                  "firefox": firefox_runtime,
                  "initial_restart": restart_initial,
              }, ensure_ascii=False, sort_keys=True))
              time.sleep(4)

          # Reconcile the pool before selecting workers. ai_global_slots may
          # temporarily contain stale identities after a queue transition; the
          # canonical API allocation is rebuilt from runnable queue work.
          settings_status, settings_payload = api_call("GET", "/api/dynamic-workers")
          if settings_status >= 300:
              raise SystemExit(
                  f"Dynamic worker settings unavailable: HTTP {settings_status} {settings_payload}"
              )
          settings = settings_payload.get("dynamic_workers") or {}
          reconcile_payload = {
              key: settings[key]
              for key in (
                  "chatgpt_count",
                  "claude_count",
                  "chatgpt_cooldown_seconds",
                  "claude_cooldown_seconds",
                  "check_interval_ms",
                  "tick_interval_ms",
                  "heartbeat_interval_ms",
                  "generation_start_timeout_ms",
                  "scheduler_interval_seconds",
              )
              if key in settings
          }

          # Owner-requested overnight burst: keep seven ChatGPT workers desired
          # from 00:00 through 08:00 Europe/Amsterdam on 2026-10-05. The normal
          # memory/OOM allocator remains authoritative, so this never bypasses
          # resource safety. The first hourly run after 08:00 restores the
          # normal two-worker default, and later runs stop overriding the count.
          current_utc = datetime.now(timezone.utc)
          overnight_start = datetime(2026, 10, 4, 22, 0, tzinfo=timezone.utc)
          overnight_end = datetime(2026, 10, 5, 6, 0, tzinfo=timezone.utc)
          restore_end = datetime(2026, 10, 5, 7, 0, tzinfo=timezone.utc)
          if overnight_start <= current_utc < overnight_end:
              reconcile_payload["chatgpt_count"] = 7
              reconcile_payload["chatgpt_cooldown_seconds"] = min(
                  int(reconcile_payload.get("chatgpt_cooldown_seconds") or 120),
                  120,
              )
          elif overnight_end <= current_utc < restore_end:
              reconcile_payload["chatgpt_count"] = 2

          reconcile_status, reconciled = api_call(
              "POST", "/api/dynamic-workers", reconcile_payload
          )
          if reconcile_status >= 300 or not reconciled.get("ok"):
              raise SystemExit(
                  f"Dynamic worker reconcile failed: HTTP {reconcile_status} {reconciled}"
              )

          targets_status, targets = api_call("GET", "/api/runner-targets")
          if targets_status >= 300:
              raise SystemExit(
                  f"Runner targets unavailable: HTTP {targets_status} {targets}"
              )
          allocation = (targets.get("global_allocation") or {}).get("workers") or []
          if not allocation:
              print(json.dumps({
                  "ok": True,
                  "state": "no-allocated-workers",
                  "reconciled": reconciled.get("dynamic_workers"),
                  "queued": [],
              }, sort_keys=True))
              raise SystemExit(0)

          with sqlite3.connect(DB, timeout=10) as conn:
              conn.row_factory = sqlite3.Row
              conn.execute("PRAGMA busy_timeout=10000")
              conn.execute("BEGIN IMMEDIATE")

              queued = []
              ts = now()
              for row in allocation:
                  project = str(row.get("project_id") or "").strip()
                  worker_slot = int(row.get("worker_slot") or 1)
                  if not project:
                      raise SystemExit(f"Invalid allocated worker payload: {row}")
                  key = str(row.get("worker_key") or f"{project}::w{worker_slot}")
                  conn.execute(
                      "UPDATE runner_workers SET desired_state='running' WHERE project_id=? AND worker_slot=?",
                      (project, worker_slot),
                  )
                  pending_rows = conn.execute(
                      "SELECT id,action,created_at FROM runner_commands "
                      "WHERE project_id=? AND status='pending' ORDER BY id",
                      (key,),
                  ).fetchall()
                  stale_ids = []
                  current_time = time.time()
                  for pending in pending_rows:
                      action = str(pending["action"] or "").strip().lower()
                      stale_after = (
                          LONG_COMMAND_STALE_SECONDS
                          if action in {"new_chat", "drain"}
                          else ORDINARY_COMMAND_STALE_SECONDS
                      )
                      try:
                          created = datetime.fromisoformat(
                              str(pending["created_at"]).replace("Z", "+00:00")
                          ).timestamp()
                      except Exception:
                          created = 0
                      if created <= current_time - stale_after:
                          stale_ids.append(int(pending["id"]))
                  if stale_ids:
                      placeholders = ",".join("?" for _ in stale_ids)
                      conn.execute(
                          f"UPDATE runner_commands SET status='failed',updated_at=?,result=? "
                          f"WHERE id IN ({placeholders})",
                          (
                              ts,
                              "restart workflow superseded stale pending command",
                              *stale_ids,
                          ),
                      )

                  pending = conn.execute(
                      "SELECT id FROM runner_commands "
                      "WHERE project_id=? AND action='new_chat' AND status='pending' "
                      "ORDER BY id DESC LIMIT 1",
                      (key,),
                  ).fetchone()
                  if pending:
                      command_id = int(pending["id"])
                      deduplicated = True
                  else:
                      cur = conn.execute(
                          "INSERT INTO runner_commands(project_id,action,status,created_at,updated_at,result) "
                          "VALUES(?,?,?,?,?,NULL)",
                          (key, "new_chat", "pending", ts, ts),
                      )
                      command_id = int(cur.lastrowid)
                      deduplicated = False
                  global_slot = int(row.get("global_worker_slot") or 0)
                  if global_slot < 1:
                      raise SystemExit(f"Allocated worker missing global_worker_slot: {row}")
                  queued.append({
                      "slot": global_slot,
                      "worker": key,
                      "queue_id": str(row.get("queue_id") or ""),
                      "command_id": command_id,
                      "deduplicated": deduplicated,
                  })

          deadline = time.time() + 35
          final = {}
          while time.time() < deadline:
              with sqlite3.connect(DB, timeout=5) as conn:
                  conn.row_factory = sqlite3.Row
                  final = {}
                  for item in queued:
                      row = conn.execute(
                          "SELECT status,result,updated_at FROM runner_commands WHERE id=?",
                          (item["command_id"],),
                      ).fetchone()
                      final[item["worker"]] = {
                          "status": str(row["status"]) if row else "missing",
                          "result": (row["result"] if row else None),
                          "updated_at": (row["updated_at"] if row else None),
                      }
              if all(v["status"] in ("completed", "failed") for v in final.values()):
                  break
              time.sleep(5)

          current_status, current_targets = api_call("GET", "/api/runner-targets")
          if current_status >= 300:
              raise SystemExit(
                  f"Could not verify final worker allocation: HTTP {current_status} {current_targets}"
              )
          current_rows = (current_targets.get("global_allocation") or {}).get("workers") or []
          current_by_key = {
              str(row.get("worker_key") or f"{row.get('project_id')}::w{int(row.get('worker_slot') or 1)}"): row
              for row in current_rows
          }
          queued_by_key = {item["worker"]: item for item in queued}
          allocation_changed = set(current_by_key) != set(queued_by_key)

          superseded_workers = []
          for worker, value in final.items():
              if value["status"] in ("completed",):
                  continue
              current = current_by_key.get(worker)
              original = queued_by_key.get(worker) or {}
              if (
                  not current
                  or str(current.get("queue_id") or "") != str(original.get("queue_id") or "")
              ):
                  superseded_workers.append(worker)

          pending_workers = [
              worker for worker, value in final.items()
              if value["status"] not in ("completed", "failed")
              and worker not in superseded_workers
          ]
          failed_workers = [
              worker for worker, value in final.items()
              if value["status"] == "failed"
              and worker not in superseded_workers
          ]

          replacement_push = None
          if allocation_changed or superseded_workers:
              push_status, replacement_push = api_call(
                  "POST", "/api/dynamic-workers/force-push", {}
              )
              if push_status >= 300:
                  raise SystemExit(
                      f"Replacement allocation push failed: HTTP {push_status} {replacement_push}"
                  )

          print(json.dumps({
              "ok": not pending_workers and not failed_workers,
              "queued": queued,
              "final": final,
              "current_allocation": current_rows,
              "allocation_changed": allocation_changed,
              "superseded_workers": superseded_workers,
              "replacement_push": replacement_push,
              "pending_workers": pending_workers,
              "failed_workers": failed_workers,
          }, ensure_ascii=False, sort_keys=True))
          if pending_workers:
              raise SystemExit("restart commands remained pending: " + ", ".join(pending_workers))
          if failed_workers:
              raise SystemExit("restart commands failed: " + ", ".join(failed_workers))
          PY

# manual restore trigger 2026-10-06T05:58Z: recover allocated workers after zCloud API/SQLite repair
