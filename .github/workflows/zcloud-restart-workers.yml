name: zCloud restart allocated workers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/zcloud-restart-workers.yml"

permissions:
  contents: read

concurrency:
  group: zcloud-restart-allocated-workers
  cancel-in-progress: false

jobs:
  restart:
    runs-on: self-hosted
    timeout-minutes: 3
    steps:
      - name: Queue fresh-chat restart for allocated workers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import sqlite3
          import time
          from datetime import datetime, timezone

          DB = "/home/ubuntu/zennay-cloud/history.db"

          def now():
              return datetime.now(timezone.utc).isoformat()

          with sqlite3.connect(DB, timeout=10) as conn:
              conn.row_factory = sqlite3.Row
              conn.execute("PRAGMA busy_timeout=10000")
              conn.execute("BEGIN IMMEDIATE")
              slots = conn.execute(
                  "SELECT slot,project_id,worker_slot FROM ai_global_slots ORDER BY slot"
              ).fetchall()

              if not slots:
                  print(json.dumps({"ok": True, "state": "no-allocated-workers", "queued": []}, sort_keys=True))
                  raise SystemExit(0)

              queued = []
              ts = now()
              for row in slots:
                  project = str(row["project_id"])
                  worker_slot = int(row["worker_slot"] or 1)
                  key = f"{project}::w{worker_slot}"
                  conn.execute(
                      "UPDATE runner_workers SET desired_state='running' WHERE project_id=? AND worker_slot=?",
                      (project, worker_slot),
                  )
                  pending_rows = conn.execute(
                      "SELECT id,created_at FROM runner_commands "
                      "WHERE project_id=? AND status='pending' ORDER BY id",
                      (key,),
                  ).fetchall()
                  stale_ids = []
                  cutoff = time.time() - 120
                  for pending in pending_rows:
                      try:
                          created = datetime.fromisoformat(
                              str(pending["created_at"]).replace("Z", "+00:00")
                          ).timestamp()
                      except Exception:
                          created = 0
                      if created <= cutoff:
                          stale_ids.append(int(pending["id"]))
                  if stale_ids:
                      placeholders = ",".join("?" for _ in stale_ids)
                      conn.execute(
                          f"UPDATE runner_commands SET status='failed',updated_at=?,result=? "
                          f"WHERE id IN ({placeholders})",
                          (
                              ts,
                              "restart workflow superseded stale pending command",
                              *stale_ids,
                          ),
                      )

                  pending = conn.execute(
                      "SELECT id FROM runner_commands "
                      "WHERE project_id=? AND action='new_chat' AND status='pending' "
                      "ORDER BY id DESC LIMIT 1",
                      (key,),
                  ).fetchone()
                  if pending:
                      command_id = int(pending["id"])
                      deduplicated = True
                  else:
                      cur = conn.execute(
                          "INSERT INTO runner_commands(project_id,action,status,created_at,updated_at,result) "
                          "VALUES(?,?,?,?,?,NULL)",
                          (key, "new_chat", "pending", ts, ts),
                      )
                      command_id = int(cur.lastrowid)
                      deduplicated = False
                  queued.append({
                      "slot": int(row["slot"]),
                      "worker": key,
                      "command_id": command_id,
                      "deduplicated": deduplicated,
                  })

          deadline = time.time() + 35
          final = {}
          while time.time() < deadline:
              with sqlite3.connect(DB, timeout=5) as conn:
                  conn.row_factory = sqlite3.Row
                  final = {}
                  for item in queued:
                      row = conn.execute(
                          "SELECT status,result,updated_at FROM runner_commands WHERE id=?",
                          (item["command_id"],),
                      ).fetchone()
                      final[item["worker"]] = {
                          "status": str(row["status"]) if row else "missing",
                          "result": (row["result"] if row else None),
                          "updated_at": (row["updated_at"] if row else None),
                      }
              if all(v["status"] in ("completed", "failed") for v in final.values()):
                  break
              time.sleep(5)

          pending_workers = [
              worker for worker, value in final.items()
              if value["status"] not in ("completed", "failed")
          ]
          failed_workers = [
              worker for worker, value in final.items()
              if value["status"] == "failed"
          ]
          print(json.dumps({
              "ok": not pending_workers and not failed_workers,
              "queued": queued,
              "final": final,
              "pending_workers": pending_workers,
              "failed_workers": failed_workers,
          }, ensure_ascii=False, sort_keys=True))
          if pending_workers:
              raise SystemExit("restart commands remained pending: " + ", ".join(pending_workers))
          if failed_workers:
              raise SystemExit("restart commands failed: " + ", ".join(failed_workers))
          PY
