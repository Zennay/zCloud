name: zCloud optimistic UI audit

on:
  pull_request:
    branches: [main]
    paths:
      - "public/app.js"
      - "scripts/zcloud_optimistic_ui_audit.py"
      - "tests/test_zcloud_optimistic_ui_audit.py"
      - ".github/workflows/zcloud-optimistic-ui-audit.yml"
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: zcloud-optimistic-ui-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Run optimistic UI ratchet regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/zcloud_optimistic_ui_audit.py tests/test_zcloud_optimistic_ui_audit.py
          python3 -m unittest -v tests.test_zcloud_optimistic_ui_audit
          python3 scripts/zcloud_optimistic_ui_audit.py --json --require-ratchet
          echo "ZCLOUD_OPTIMISTIC_UI_AUDIT_HOSTED_GREEN=1"

  permanent-vps-proof:
    if: >-
      github.repository == 'Zennay/zCloud' &&
      github.actor == 'Zennay' &&
      github.triggering_actor == 'Zennay' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: validate
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 6
    env:
      EXPECTED_ZCLOUD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out exact trusted candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.EXPECTED_ZCLOUD_SHA }}
          persist-credentials: false
          clean: true
          fetch-depth: 1

      - name: Prove permanent runner and exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_ZCLOUD_SHA"
          test "$(hostname)" = "vps-bb300bba"
          test "$(id -un)" = "ubuntu"
          python3 scripts/zcloud_vps_runner_guard.py --json

      - name: Prove read-only optimistic UI ratchet
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v tests.test_zcloud_optimistic_ui_audit
          python3 scripts/zcloud_optimistic_ui_audit.py --json --require-ratchet
          echo "ZCLOUD_OPTIMISTIC_UI_AUDIT_VPS_GREEN=1"
