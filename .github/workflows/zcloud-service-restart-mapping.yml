name: zCloud service restart mapping

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zcloud-service-restart-mapping-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  process-restart-mapping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true

      - name: Prove mapping survives clean process restart
        run: python3 -m unittest -v tests.test_service_restart_mapping
