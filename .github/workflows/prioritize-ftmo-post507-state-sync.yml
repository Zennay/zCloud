name: Prioritize FTMO post507 state sync

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/prioritize-ftmo-post507-state-sync.yml"

permissions:
  contents: read

jobs:
  prioritize:
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 5
    env:
      STALE_TEST_RUN: "37171308840"
      STATE_SYNC_RUN: "37171444603"
      PINNED_SYNC_SHA: e5363979dd40097ede98234554ed49b262514fa1
      PR_NUMBER: "509"
      OLD_PR_HEAD: 278251fdfcbf778b3b159da71f5be1e921de9443
    steps:
      - name: Cancel obsolete old-base test and free FTMO runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          gh auth status >/dev/null 2>&1

          test "$(gh api repos/Zennay/Ftmo/pulls/$PR_NUMBER --jq .state)" = "open"
          test "$(gh api repos/Zennay/Ftmo/pulls/$PR_NUMBER --jq .head.sha)" = "$OLD_PR_HEAD"
          test "$(gh api repos/Zennay/Ftmo/actions/runs/$STATE_SYNC_RUN --jq .head_sha)" = "$PINNED_SYNC_SHA"
          test "$(gh api repos/Zennay/Ftmo/actions/runs/$STATE_SYNC_RUN --jq .status)" = "queued"

          current_main="$(gh api repos/Zennay/Ftmo/branches/main --jq .commit.sha)"
          test "$current_main" != "$PINNED_SYNC_SHA"

          stale_status="$(gh api repos/Zennay/Ftmo/actions/runs/$STALE_TEST_RUN --jq .status)"
          echo "STALE_TEST_PRE=$stale_status current_main=$current_main"
          if [[ "$stale_status" == "in_progress" || "$stale_status" == "queued" ]]; then
            gh api --method POST "repos/Zennay/Ftmo/actions/runs/$STALE_TEST_RUN/cancel" >/dev/null
          fi

          started=""
          for _ in $(seq 1 48); do
            stale_status="$(gh api repos/Zennay/Ftmo/actions/runs/$STALE_TEST_RUN --jq .status)"
            sync_status="$(gh api repos/Zennay/Ftmo/actions/runs/$STATE_SYNC_RUN --jq .status)"
            echo "FTMO_QUEUE stale_test=$stale_status state_sync=$sync_status"
            if [[ "$sync_status" == "in_progress" || "$sync_status" == "completed" ]]; then
              started=1
              break
            fi
            sleep 5
          done
          test -n "$started"
          echo "FTMO_POST507_STATE_SYNC_PRIORITIZED=1"
