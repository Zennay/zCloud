name: Dispatch FTMO post-PR521 receipt state sync

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ftmo-post514-state-sync-dispatch.yml

concurrency:
  group: ftmo-post521-receipt-state-sync
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 8
    env:
      RECEIPT_MAIN_SHA: d813fc3e9305ed61db360953ecb65d00668ecfb2
    steps:
      - name: Dispatch exact-current-main research-state sync
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          gh auth status >/dev/null 2>&1
          current="$(gh api repos/Zennay/Ftmo/branches/main --jq .commit.sha)"
          test "$current" = "$RECEIPT_MAIN_SHA"
          existing="$(gh api -X GET repos/Zennay/Ftmo/actions/workflows/sync-autonomous-research-state.yml/runs -f head_sha="$RECEIPT_MAIN_SHA" -f per_page=20 --jq '[.workflow_runs[] | select(.head_sha == env.RECEIPT_MAIN_SHA)] | length')"
          if [[ "$existing" == "0" ]]; then
            gh workflow run sync-autonomous-research-state.yml --repo Zennay/Ftmo --ref main
            echo "FTMO_POST521_RECEIPT_STATE_SYNC_ACTION=dispatched"
          else
            echo "FTMO_POST521_RECEIPT_STATE_SYNC_ACTION=existing-exact-main-run"
          fi
          sync_run=""
          for _ in $(seq 1 24); do
            sync_run="$(gh api -X GET repos/Zennay/Ftmo/actions/workflows/sync-autonomous-research-state.yml/runs -f head_sha="$RECEIPT_MAIN_SHA" -f per_page=20 --jq '[.workflow_runs[] | select(.head_sha == env.RECEIPT_MAIN_SHA)] | sort_by(.created_at) | last | .id // empty')"
            [[ -n "$sync_run" ]] && break
            sleep 5
          done
          test -n "$sync_run"
          echo "FTMO_POST521_RECEIPT_STATE_SYNC_RUN=$sync_run"
