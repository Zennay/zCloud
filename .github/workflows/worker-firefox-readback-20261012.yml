name: zCloud worker Firefox read-only current state
on:
  push:
    branches: [diag/worker-firefox-post-canary-20261012]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read live browser owners and dynamic worker state without mutation
        shell: bash
        env:
          XDG_RUNTIME_DIR: /run/user/1000
          DBUS_SESSION_BUS_ADDRESS: unix:path=/run/user/1000/bus
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          echo '=== SERVICE STATES ==='
          for svc in chatgpt-firefox.service office-relay-vps.service; do
            printf '%s=' "$svc"
            systemctl --user is-active "$svc" || true
          done
          echo '=== FIREFOX PARENT PROCESS PROFILE SUMMARY ==='
          python3 - <<'PY'
          import os
          from pathlib import Path
          for proc in Path('/proc').iterdir():
              if not proc.name.isdigit(): continue
              try:
                  raw=(proc/'cmdline').read_bytes().split(b'\0')
              except (OSError,PermissionError): continue
              args=[a.decode('utf-8','replace') for a in raw if a]
              if not args or not any('firefox' in a.lower() for a in args[:1]):continue
              if '-contentproc' in args: continue
              profile=''
              for i,v in enumerate(args):
                  if v in ('-profile','--profile') and i+1<len(args):
                      profile=args[i+1]
              print('Firefox parent pid='+proc.name+' profile='+profile[:110]+' argc='+str(len(args)))
          PY
          echo '=== WORKER READBACK ==='
          python3 - <<'PY'
          import json,urllib.request
          try:
              with urllib.request.urlopen('http://127.0.0.1:8765/api/runner-live',timeout=8) as response:
                  data=json.load(response)
              runners=data.get('chatgpt_runners') or {}
              for pid,item in runners.items():
                  for w in item.get('workers') or []:
                      print(str(w.get('worker_id'))[:85],
                            'state='+str(w.get('state')),
                            'active='+str(w.get('active')),
                            'generating='+str(w.get('generating')),
                            'sending='+str(w.get('sending')),
                            'age='+str(w.get('age_seconds')))
          except Exception as exc:
              print('worker-state-unavailable:'+type(exc).__name__)
          PY

          echo '=== TAB OPENING EVENTS (LAST 15 MINUTES) ==='
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path
          db=Path('/home/ubuntu/zennay-cloud/history.db')
          if not db.is_file():
              print('worker-event-db-unavailable')
          else:
              try:
                  with sqlite3.connect(f'file:{db}?mode=ro',uri=True,timeout=4) as con:
                      rows=con.execute("""
                          SELECT event,COUNT(*) FROM runner_events
                          WHERE ts>=datetime('now','-15 minutes')
                            AND event IN ('target-tab-opening','worker-handoff-opened',
                              'worker-tab-open-rate-limited','worker-tab-closed-cooldown',
                              'assignment-refresh-failed','target-tab-recovered')
                          GROUP BY event ORDER BY event
                      """).fetchall()
                      print('last-15min-event-counts='+str(dict(rows)))
                      recent=con.execute("""
                          SELECT ts,event,project_id FROM runner_events
                          WHERE event IN ('target-tab-opening','worker-handoff-opened',
                            'worker-tab-open-rate-limited','worker-tab-closed-cooldown')
                          ORDER BY id DESC LIMIT 20
                      """).fetchall()
                      for ts,event,project in recent:
                          print(str(ts)[:24],str(event)[:48],str(project or '')[:65])
              except sqlite3.Error as exc:
                  print('read-only-sqlite-unavailable:'+type(exc).__name__)
          PY
