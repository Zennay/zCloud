name: Recover zCloud and allocate HaxLab P1

# Historical P1 queue recovery is never automatic: it mutates the live VPS.
on:
  workflow_dispatch:
    inputs:
      confirm_sha:
        description: 'Paste the exact current 40-character main commit SHA'
        required: true
        type: string

permissions:
  contents: read

jobs:
  recover:
    # Owner-only, exact-main, first attempt; no push/PR/re-run can start live mutation.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'Zennay/zCloud' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'Zennay' &&
      github.triggering_actor == 'Zennay' &&
      github.run_attempt == 1 &&
      github.event.inputs.confirm_sha == github.sha
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 8
    steps:
      - name: Check out exact immutable main source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true

      - name: Refuse stale source or unexpected permanent runner before any live writes
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          CONFIRMED_SHA: ${{ inputs.confirm_sha }}
          EXPECTED_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$EXPECTED_REPO" = "Zennay/zCloud"
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$CONFIRMED_SHA" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_SHA"
          test "$(hostname)" = "vps-bb300bba"
          test "$(id -un)" = "ubuntu"
          python3 scripts/zcloud_vps_runner_guard.py --json

      - name: Recover control plane and reconcile queue
        shell: bash
        run: |
          set -euo pipefail

          echo "SERVICE_BEFORE=$(systemctl is-active zennay-cloud.service || true)"
          if ! systemctl is-active --quiet zennay-cloud.service; then
            sudo -n systemctl restart zennay-cloud.service
          fi

          python3 - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request

          base="http://127.0.0.1:8765"

          def get(path):
              with urllib.request.urlopen(base+path,timeout=8) as r:
                  return json.load(r)

          def post(path,payload):
              req=urllib.request.Request(
                  base+path,
                  data=json.dumps(payload).encode(),
                  method="POST",
                  headers={
                      "Content-Type":"application/json",
                      "X-ZCloud-Actor":"haxlab-allocation-recovery",
                  },
              )
              with urllib.request.urlopen(req,timeout=10) as r:
                  return json.load(r)

          last=None
          for _ in range(30):
              try:
                  status=get("/api/status")
                  if not status.get("errors"):
                      print("ZCLOUD_RECOVERED",json.dumps({
                          "time":status.get("time"),
                          "errors":status.get("errors"),
                      },sort_keys=True))
                      break
                  last=status
              except Exception as exc:
                  last=repr(exc)
              time.sleep(2)
          else:
              raise RuntimeError("zCloud API did not recover: "+str(last)[:1000])

          current=get("/api/dynamic-workers").get("dynamic_workers") or {}
          keys=(
              "chatgpt_count","claude_count",
              "chatgpt_cooldown_seconds","claude_cooldown_seconds",
              "check_interval_ms","tick_interval_ms",
              "heartbeat_interval_ms","generation_start_timeout_ms",
              "scheduler_interval_seconds",
          )
          same={k:current[k] for k in keys if current.get(k) is not None}
          reconcile=post("/api/dynamic-workers",same)
          print("POOL_RECONCILED",json.dumps(reconcile,sort_keys=True))

          queue=get("/api/portfolio-queue?all=1")
          item=next(
              (x for x in queue.get("items",[])
               if x.get("queue_id")=="haxlab-closed-loop-arena-v2-implementation"),
              None,
          )
          if not item:
              raise RuntimeError("HaxLab Arena v2 P1 item missing")
          # Do not emit task prompts, conversations or raw allocation snapshots.
          print("HAXLAB_P1_STATUS",json.dumps({
              "queue_id_match":item.get("queue_id")=="haxlab-closed-loop-arena-v2-implementation",
              "status":item.get("status") if item.get("status") in {"claimed","running","verifying"} else "not_ready",
          },sort_keys=True))
          if str(item.get("status") or "").lower() not in {"claimed","running","verifying"}:
              raise RuntimeError("HaxLab Arena v2 P1 not allocated after reconcile")
          PY

          echo "SERVICE_AFTER=$(systemctl is-active zennay-cloud.service || true)"
