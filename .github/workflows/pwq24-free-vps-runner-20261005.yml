name: PWQ-24 free VPS runner for corrective validation

on:
  push:
    branches:
      - ops/pwq24-post443-live-acceptance-20261005-0047
    paths:
      - .github/workflows/pwq24-free-vps-runner-20261005.yml

permissions:
  actions: write
  contents: read

jobs:
  free-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cancel only redundant fallback acceptance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN: b68562c2041ffd99f3ac15d7fbca220bef9d0549
          CANONICAL_ACCEPTANCE_RUN_ID: "37265454441"
          FALLBACK_RUN_ID: "37265851740"
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          test "$current_main" = "$EXPECTED_MAIN"

          canonical="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$CANONICAL_ACCEPTANCE_RUN_ID")"
          test "$(jq -r .name <<<"$canonical")" = "PWQ-24 post-461 live acceptance"
          test "$(jq -r .status <<<"$canonical")" = "completed"
          test "$(jq -r .conclusion <<<"$canonical")" = "failure"

          fallback="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$FALLBACK_RUN_ID")"
          test "$(jq -r .name <<<"$fallback")" = "PWQ-24 final live acceptance b68562c"
          status="$(jq -r .status <<<"$fallback")"
          case "$status" in
            queued|in_progress|pending|waiting|requested)
              gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/$FALLBACK_RUN_ID/cancel" >/dev/null
              echo "PWQ24_FALLBACK_CANCEL_REQUESTED run=$FALLBACK_RUN_ID status=$status"
              ;;
            *)
              echo "PWQ24_FALLBACK_ALREADY_TERMINAL run=$FALLBACK_RUN_ID status=$status"
              ;;
          esac
