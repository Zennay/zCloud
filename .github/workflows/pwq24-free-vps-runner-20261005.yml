name: PWQ-24 prioritize corrective VPS validation

on:
  push:
    branches:
      - ops/pwq24-post443-live-acceptance-20261005-0047
    paths:
      - .github/workflows/pwq24-free-vps-runner-20261005.yml

permissions:
  actions: write
  contents: read

jobs:
  prioritize:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Remove only redundant bounded proof ahead of PR 462 validation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN: b68562c2041ffd99f3ac15d7fbca220bef9d0549
          CORRECTIVE_SHA: 9c9eec916016f12465d0c2c5a75235406ae3b4f8
          REGRESSION_RUN_ID: "37266274063"
          REDUNDANT_PROOF_RUN_ID: "37266315707"
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)" = "$EXPECTED_MAIN"

          regression="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$REGRESSION_RUN_ID")"
          test "$(jq -r .head_sha <<<"$regression")" = "$CORRECTIVE_SHA"
          test "$(jq -r .name <<<"$regression")" = "zCloud regression smoke"
          test "$(jq -r .status <<<"$regression")" = "completed"
          test "$(jq -r .conclusion <<<"$regression")" = "success"

          queued_corrective="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=$CORRECTIVE_SHA&per_page=100" --jq '[.workflow_runs[] | select(.status=="queued") | select(.name=="zCloud VPS execution lane probe" or .name=="zCloud OOM guard VPS validation" or .name=="zCloud live dynamic worker debug")] | length')"
          test "$queued_corrective" -ge 1

          redundant="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$REDUNDANT_PROOF_RUN_ID")"
          test "$(jq -r .name <<<"$redundant")" = "PWQ-24 bounded Supa FTMO recovery proof"
          status="$(jq -r .status <<<"$redundant")"
          case "$status" in
            queued|pending|waiting|requested)
              gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/$REDUNDANT_PROOF_RUN_ID/cancel" >/dev/null
              echo "PWQ24_REDUNDANT_PROOF_CANCEL_REQUESTED=$REDUNDANT_PROOF_RUN_ID"
              ;;
            *)
              echo "PWQ24_REDUNDANT_PROOF_NOT_CANCELLED status=$status"
              ;;
          esac
