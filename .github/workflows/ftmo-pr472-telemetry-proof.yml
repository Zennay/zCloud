name: FTMO PR472 telemetry exact-head proof

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-pr472-telemetry-proof.yml"

permissions:
  contents: read

concurrency:
  group: ftmo-pr472-telemetry-proof
  cancel-in-progress: true

jobs:
  proof:
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 20
    env:
      TARGET_SHA: fc6ef3cc04ebc5324380316c33260765f36824e0
      FTMO_AUTONOMOUS_CLOUD_BUDGET_USD: "0.00"
      FTMO_ALLOW_PAID_AWS: ""
    steps:
      - name: Fetch exact FTMO PR472 head
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          src="$RUNNER_TEMP/ftmo-pr472-proof"
          rm -rf "$src"
          gh repo clone Zennay/Ftmo "$src" -- --filter=blob:none --no-checkout >/dev/null
          git -C "$src" checkout --detach "$TARGET_SHA" >/dev/null
          test "$(git -C "$src" rev-parse HEAD)" = "$TARGET_SHA"

      - name: Install isolated environment
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr472-proof"
          venv="$RUNNER_TEMP/ftmo-pr472-venv"
          rm -rf "$venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install -q -r "$src/requirements-ci.txt"
          "$venv/bin/python" -m pip install -q -e "$src"

      - name: Prove live-autonomous telemetry overlay
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr472-proof"
          venv="$RUNNER_TEMP/ftmo-pr472-venv"
          cd "$src"
          "$venv/bin/python" -m compileall -q src/prop_trading_ai/cli/v1_project_telemetry.py
          "$venv/bin/python" -m pytest -q             tests/test_project_telemetry.py             tests/test_project_telemetry_runtime_status.py
          "$venv/bin/python" -m pytest -q tests/test_zero_cost_workflow_boundary.py             -k "every_repository_workflow_has_no_github_hosted_runner or diagnostic_zero_cost_workflows_are_self_hosted_and_secret_free"
          echo "FTMO_PR472_TELEMETRY_GREEN=1"

      - name: Prove live status is read-only and sealed
        shell: bash
        run: |
          set -euo pipefail
          status="/opt/ftmo-autonomous/.scratch/autonomy/status.json"
          test -f "$status"
          before="$(sha256sum "$status" | awk '{print $1}')"
          src="$RUNNER_TEMP/ftmo-pr472-proof"
          venv="$RUNNER_TEMP/ftmo-pr472-venv"
          "$venv/bin/python" - "$status" "$TARGET_SHA" <<'PY'
          import sys
          from pathlib import Path
          from prop_trading_ai.cli.v1_project_telemetry import _autonomous_runtime_summary
          summary = _autonomous_runtime_summary(Path(sys.argv[1]), expected_revision=sys.argv[2])
          assert summary is not None
          assert summary["generation_number"] >= 30
          assert summary["stage"] == "provider_foundation"
          assert summary["development_access_allowed"] is False
          assert summary["walk_forward_access_allowed"] is False
          assert summary["final_holdout_access_allowed"] is False
          assert summary["live_trading_allowed"] is False
          assert summary["broker_order_submission_allowed"] is False
          print(summary)
          PY
          after="$(sha256sum "$status" | awk '{print $1}')"
          test "$before" = "$after"
          echo "FTMO_PR472_LIVE_STATUS_READ_ONLY=1"
