name: zCloud live state-receipt coverage audit

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/zcloud-state-receipt-coverage-audit.yml
      - tests/test_state_receipt_coverage_audit_workflow.py
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zcloud-state-receipt-coverage-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    if: >-
      github.actor == 'Zennay' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 6
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify permanent zCloud VPS runner and exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(id -un)" = ubuntu
          python3 scripts/zcloud_vps_runner_guard.py --json

      - name: Read receipt coverage directly from VPS source of truth
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import sqlite3
          from pathlib import Path

          import project_runtime

          runtime_root = Path("/home/ubuntu/zennay-cloud")
          projects_path = runtime_root / "projects.json"
          db_path = runtime_root / "history.db"

          if db_path.is_symlink() or not db_path.is_file():
              raise SystemExit("live history.db must be a regular non-symlink file")

          projects = json.loads(projects_path.read_text(encoding="utf-8"))
          if not isinstance(projects, list):
              raise SystemExit("runtime-owned projects.json must be a list")
          active = sorted(
              str(project.get("id") or "").strip()
              for project in projects
              if str(project.get("status") or "active").lower() != "archived"
              and str(project.get("id") or "").strip()
          )
          if not active:
              raise SystemExit("no active runtime projects found")

          before = db_path.stat()
          before_fingerprint = (before.st_size, before.st_mtime_ns)

          connection = sqlite3.connect(
              f"file:{db_path}?mode=ro",
              uri=True,
              timeout=15,
          )
          connection.row_factory = sqlite3.Row
          connection.execute("PRAGMA query_only=ON")
          connection.execute("PRAGMA busy_timeout=15000")
          try:
              coverage = project_runtime.receipt_coverage(
                  connection,
                  active,
                  max_age_seconds=7200,
              )
              latest = project_runtime.latest_receipts(connection)
          finally:
              connection.close()

          after = db_path.stat()
          after_fingerprint = (after.st_size, after.st_mtime_ns)
          if after_fingerprint != before_fingerprint:
              raise SystemExit(
                  "read-only receipt audit changed live history.db fingerprint"
              )

          receipts = {}
          for project_id in active:
              receipt = latest.get(project_id)
              if not isinstance(receipt, dict):
                  receipts[project_id] = None
                  continue
              receipts[project_id] = {
                  "id": receipt.get("id"),
                  "ci_status": receipt.get("ci_status"),
                  "source": receipt.get("source"),
                  "phase": receipt.get("phase"),
                  "next_gate": receipt.get("next_gate"),
                  "observed_at": receipt.get("observed_at"),
              }

          payload = {
              "coverage": coverage,
              "receipts": receipts,
          }
          print(
              "ZCLOUD_RECEIPT_COVERAGE_AUDIT="
              + json.dumps(payload, sort_keys=True, separators=(",", ":"))
          )
          print(
              "ZCLOUD_RECEIPT_COVERAGE_READY="
              + str(bool(coverage.get("ready"))).lower()
          )
          print("ZCLOUD_RECEIPT_COVERAGE_DB_IMMUTABLE=1")
          PY
