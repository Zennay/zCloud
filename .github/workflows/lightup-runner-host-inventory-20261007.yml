name: LightUp runner host inventory 20261007

on:
  push:
    branches:
      - "ops/lightup-runner-host-inventory-20261007"
    paths:
      - ".github/workflows/lightup-runner-host-inventory-20261007.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 5
    steps:
      - name: Guard canonical permanent VPS
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          test "$(id -un)" = "ubuntu"

      - name: Inventory runner service and installation paths
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib
          import subprocess

          def lines(cmd):
              result = subprocess.run(
                  cmd,
                  check=False,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
              )
              return {
                  "returncode": result.returncode,
                  "stdout": [line for line in result.stdout.splitlines() if line.strip()],
                  "stderr": [line for line in result.stderr.splitlines() if line.strip()][:20],
              }

          unit_dir = pathlib.Path("/etc/systemd/system")
          service_names = sorted(
              p.name
              for p in unit_dir.glob("actions.runner.Zennay-*.service")
              if p.is_file() or p.is_symlink()
          )
          lightup_services = [
              name for name in service_names if "lightup" in name.lower()
          ]

          runner_roots = []
          for base in (pathlib.Path("/opt"), pathlib.Path("/home/ubuntu")):
              if not base.exists():
                  continue
              for marker in base.glob("**/.runner"):
                  try:
                      relative_depth = len(marker.relative_to(base).parts)
                  except ValueError:
                      continue
                  if relative_depth > 4:
                      continue
                  parent = str(marker.parent)
                  runner_roots.append(parent)
          runner_roots = sorted(set(runner_roots))
          lightup_roots = [
              root for root in runner_roots if "lightup" in root.lower()
          ]

          evidence = {
              "hostname": lines(["hostname"])["stdout"],
              "runner_service_names": service_names,
              "lightup_service_names": lightup_services,
              "runner_roots": runner_roots,
              "lightup_runner_roots": lightup_roots,
              "lightup_service_count": len(lightup_services),
              "lightup_runner_root_count": len(lightup_roots),
          }
          print("LIGHTUP_RUNNER_HOST_INVENTORY=" + json.dumps(evidence, sort_keys=True))
          PY

      - name: Read exact existing LightUp recovery queue item
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import sqlite3
          from pathlib import Path

          db = Path("/home/ubuntu/zennay-cloud/history.db")
          queue_id = "zssh-lightup-evidence-runner-recovery-20261006"
          if not db.is_file() or db.is_symlink():
              raise SystemExit("canonical zCloud SQLite DB missing or unsafe")

          conn = sqlite3.connect(f"file:{db}?mode=ro", uri=True, timeout=5)
          conn.row_factory = sqlite3.Row
          conn.execute("PRAGMA query_only=ON")
          columns = {
              row["name"] for row in conn.execute("PRAGMA table_info(portfolio_queue)")
          }
          if not columns:
              raise SystemExit("portfolio_queue table missing")

          safe_fields = [
              name for name in (
                  "queue_id", "project_id", "title", "priority", "status",
                  "eligible", "worker_slot", "parent_queue_id", "updated_at",
                  "created_at", "blocker", "evidence"
              )
              if name in columns
          ]
          row = conn.execute(
              "SELECT " + ",".join(safe_fields)
              + " FROM portfolio_queue WHERE queue_id=? LIMIT 1",
              (queue_id,),
          ).fetchone()
          result = {"queue_id": queue_id, "present": row is not None}
          if row is not None:
              for key in safe_fields:
                  value = row[key]
                  if isinstance(value, str) and len(value) > 500:
                      value = value[:500] + "...[truncated]"
                  result[key] = value
          print("LIGHTUP_RECOVERY_QUEUE_ITEM=" + json.dumps(result, sort_keys=True))
          conn.close()
          PY

      - name: Read zSSH worker provider slots
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import sqlite3
          from pathlib import Path

          db = Path("/home/ubuntu/zennay-cloud/history.db")
          conn = sqlite3.connect(f"file:{db}?mode=ro", uri=True, timeout=5)
          conn.row_factory = sqlite3.Row
          conn.execute("PRAGMA query_only=ON")
          cols = {
              row["name"] for row in conn.execute("PRAGMA table_info(runner_workers)")
          }
          wanted = [
              c for c in ("project_id", "worker_slot", "provider", "desired_state")
              if c in cols
          ]
          if "project_id" not in wanted or "worker_slot" not in wanted:
              raise SystemExit("runner_workers identity columns missing")
          rows = conn.execute(
              "SELECT " + ",".join(wanted)
              + " FROM runner_workers WHERE project_id=? ORDER BY worker_slot",
              ("zssh",),
          ).fetchall()
          workers = [{key: row[key] for key in wanted} for row in rows]
          print("ZSSH_WORKER_PROVIDER_SLOTS=" + json.dumps(workers, sort_keys=True))
          conn.close()
          PY

      - name: Read live dynamic worker allocation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import urllib.request

          base = "http://127.0.0.1:8765"
          with urllib.request.urlopen(base + "/api/runner-targets", timeout=15) as response:
              targets = json.load(response)
          allocation = targets.get("global_allocation") or {}
          workers = allocation.get("workers") or []
          print("LIGHTUP_RECOVERY_LIVE_ALLOCATION=" + json.dumps({
              "max_workers": targets.get("max_workers"),
              "dynamic_workers": targets.get("dynamic_workers"),
              "workers": [
                  {
                      "worker_key": item.get("worker_key"),
                      "project_id": item.get("project_id"),
                      "worker_slot": item.get("worker_slot"),
                      "global_worker_slot": item.get("global_worker_slot"),
                      "provider": item.get("provider"),
                      "queue_id": item.get("queue_id"),
                      "priority": item.get("priority"),
                  }
                  for item in workers
              ],
              "candidates": [
                  {
                      "project_id": item.get("project_id"),
                      "queue_id": item.get("queue_id"),
                      "priority": item.get("priority"),
                      "desired_state": item.get("desired_state"),
                  }
                  for item in (allocation.get("candidates") or [])
                  if item.get("queue_id") == "zssh-lightup-evidence-runner-recovery-20261006"
              ],
          }, sort_keys=True))
          PY
