name: Diagnose Firefox runner ExecCondition

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/firefox-condition-debug.yml
      - tests/test_firefox_condition_debug_workflow.py
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
    paths:
      - .github/workflows/firefox-condition-debug.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firefox-condition-debug-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  inspect:
    if: >-
      github.event_name != 'pull_request' ||
      (github.actor == 'Zennay' &&
       github.triggering_actor == 'Zennay' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 5
    env:
      EXPECTED_ZCLOUD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact zCloud diagnostic revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 1

      - name: Verify exact zCloud checkout
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_ZCLOUD_SHA"
          printf 'ZCLOUD_EXACT_CHECKOUT_GREEN sha=%s\n' "$actual"

      - name: Verify permanent zCloud VPS runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -un)" = ubuntu
          python3 scripts/zcloud_vps_runner_guard.py --json

      - name: Inspect live Firefox unit and drop-ins
        shell: bash
        run: |
          set -euo pipefail
          export XDG_RUNTIME_DIR=/run/user/1000
          export DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1000/bus

          echo "=== UNIT CAT ==="
          systemctl --user cat chatgpt-firefox.service || true
          echo "=== UNIT SHOW ==="
          systemctl --user show chatgpt-firefox.service \
            -p LoadState -p ActiveState -p SubState -p Result \
            -p ExecCondition -p DropInPaths -p FragmentPath || true

          echo "=== PERSISTENT DROP-INS ==="
          if [ -d "$HOME/.config/systemd/user/chatgpt-firefox.service.d" ]; then
            find "$HOME/.config/systemd/user/chatgpt-firefox.service.d" -maxdepth 1 -type f -print -exec sh -c 'echo "--- $1"; cat "$1"' _ {} \;
          else
            echo "none"
          fi

          echo "=== RUNTIME CONTROL DROP-INS ==="
          runtime_dir="/run/user/1000/systemd/user.control/chatgpt-firefox.service.d"
          if [ -d "$runtime_dir" ]; then
            find "$runtime_dir" -maxdepth 1 -type f -print -exec sh -c 'echo "--- $1"; cat "$1"' _ {} \;
          else
            echo "none"
          fi

          echo "=== PRESTART / SENTINELS ==="
          if [ -f "$HOME/.local/bin/chatgpt-firefox-prestart.sh" ]; then
            sed -n '1,220p' "$HOME/.local/bin/chatgpt-firefox-prestart.sh"
          fi
          find "$HOME/.local/state/zcloud" -maxdepth 3 -type f \( -name '*firefox*' -o -name '*runner*' -o -name '*pause*' \) -print 2>/dev/null | head -n 80 || true

          echo "ZCLOUD_FIREFOX_CONDITION_DEBUG_GREEN=1"
