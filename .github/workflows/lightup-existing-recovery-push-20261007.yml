name: Reconcile existing LightUp runner recovery lane

on:
  push:
    branches:
      - "ops/lightup-runner-host-inventory-20261007"
    paths:
      - ".github/workflows/lightup-existing-recovery-push-20261007.yml"

permissions:
  contents: read

concurrency:
  group: lightup-existing-recovery-reconcile-20261007
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 6
    steps:
      - name: Guard canonical permanent VPS
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          test "$(id -un)" = "ubuntu"

      - name: Move exact recovery item to executable LightUp lane
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import urllib.error
          import urllib.request
          from pathlib import Path

          BASE = "http://127.0.0.1:8765"
          QUEUE_ID = "zssh-lightup-evidence-runner-recovery-20261006"
          CONTRACTS = Path("/home/ubuntu/zennay-cloud/project-contracts.json")

          contracts = json.loads(CONTRACTS.read_text(encoding="utf-8"))
          projects = contracts.get("projects") or {}
          zssh = projects.get("zssh") or {}
          lightup = projects.get("lightup") or {}
          if int(zssh.get("ai_worker_cap") or 0) != 0:
              raise SystemExit("zSSH contract changed; refusing stale recovery migration")
          if int(lightup.get("ai_worker_cap") or 0) < 1:
              raise SystemExit("LightUp has no AI worker capacity")
          autonomy = lightup.get("autonomy") or {}
          if autonomy.get("mode") != "ai_worker" or autonomy.get("auto_start") is not True:
              raise SystemExit("LightUp auto-worker contract is not enabled")

          def get(path):
              with urllib.request.urlopen(BASE + path, timeout=15) as response:
                  return json.load(response)

          def post(path, payload):
              req = urllib.request.Request(
                  BASE + path,
                  data=json.dumps(payload).encode(),
                  method="POST",
                  headers={"Content-Type": "application/json"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=15) as response:
                      body = json.load(response)
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode("utf-8", errors="replace")[:1200]
                  raise RuntimeError(f"{path} HTTP {exc.code}: {detail}") from exc
              if not body.get("ok"):
                  raise RuntimeError(f"{path} rejected request: {body}")
              return body

          queue = get("/api/portfolio-queue?all=1")
          matches = [x for x in queue.get("items", []) if x.get("queue_id") == QUEUE_ID]
          if len(matches) != 1:
              raise SystemExit(f"expected exactly one recovery queue item, found {len(matches)}")
          item = matches[0]
          if str(item.get("status") or "").lower() != "queued" or not item.get("eligible"):
              print("LIGHTUP_RECOVERY_RECONCILE_NOOP=" + json.dumps({
                  "reason": "item-no-longer-eligible-queued",
                  "queue_id": QUEUE_ID,
                  "status": item.get("status"),
                  "project_id": item.get("project_id"),
                  "worker_slot": item.get("worker_slot"),
              }, sort_keys=True))
              raise SystemExit(0)
          if item.get("project_id") not in ("zssh", "lightup"):
              raise SystemExit("recovery item ownership changed unexpectedly")

          criteria = str(item.get("completion_criteria") or "")
          clause = (
              " Shell/VPS execution rule for this recovery: use a Claude Dynamic Worker "
              "for concrete host commands. Preserve LightUp PLAN-LAB ONLY: runner "
              "infrastructure recovery only; no target interaction, assessment collection, "
              "remediation/retest execution, deployment, verdict, or attack-path mutation. "
              "Do not cancel or duplicate protected canonical run 37385689475. "
              "Completion requires a dedicated LightUp runner on vps-bb300bba with labels "
              "self-hosted,zcloud,vps, a single listener/service, secret-safe registration, "
              "and proof that the existing exact-head Python 3.11 job starts."
          )
          if "Shell/VPS execution rule for this recovery:" not in criteria:
              criteria = (criteria.rstrip() + clause).strip()

          migrated = post("/api/portfolio-queue", {
              "action": "enqueue",
              "queue_id": QUEUE_ID,
              "project_id": "lightup",
              "title": item.get("title") or "Restore missing LightUp canonical Actions runner",
              "priority": "P0",
              "completion_criteria": criteria,
              "source_url": item.get("source_url") or "",
              "parent_queue_id": item.get("parent_queue_id"),
          })
          print("LIGHTUP_RECOVERY_RECONCILED=" + json.dumps({
              "queue_id": QUEUE_ID,
              "from_project": item.get("project_id"),
              "to_project": "lightup",
              "result": migrated.get("item"),
          }, sort_keys=True))

          after = get("/api/portfolio-queue?all=1")
          matches = [x for x in after.get("items", []) if x.get("queue_id") == QUEUE_ID]
          if len(matches) != 1:
              raise SystemExit("queue reconciliation created duplicate or lost exact item")
          current = matches[0]
          if current.get("project_id") != "lightup":
              raise SystemExit("queue project migration did not persist")
          if str(current.get("status") or "").lower() != "queued" or not current.get("eligible"):
              raise SystemExit("queue item lost runnable queued state during migration")

          # Manual project Start is the canonical bounded admission override. It
          # asks the allocator to claim this P0 without fabricating a worker key.
          start = post("/api/runner-control", {
              "project_id": "lightup",
              "action": "start",
              "force": True,
          })
          print("LIGHTUP_RECOVERY_PROJECT_START=" + json.dumps(start, sort_keys=True))

          # Do not issue worker-level push unless runtime allocation proves the
          # exact queue item is bound to a Claude-backed worker. A ChatGPT-bound
          # allocation may remain claimed, but must not be manually pushed here.
          targets = get("/api/runner-targets")
          allocated = [
              w for w in ((targets.get("global_allocation") or {}).get("workers") or [])
              if w.get("queue_id") == QUEUE_ID
          ]
          projects_view = targets.get("projects") or {}
          receipt = []
          for row in allocated:
              key = str(row.get("worker_key") or "")
              cfg = projects_view.get(key) or {}
              receipt.append({
                  "worker_key": key,
                  "global_worker_slot": row.get("global_worker_slot"),
                  "provider": cfg.get("provider") or row.get("provider"),
                  "queue_id": row.get("queue_id"),
                  "assignment_ready": cfg.get("assignment_ready"),
              })
          print("LIGHTUP_RECOVERY_ALLOCATION_AFTER_START=" + json.dumps({
              "max_workers": targets.get("max_workers"),
              "dynamic_workers": targets.get("dynamic_workers"),
              "allocated": receipt,
          }, sort_keys=True))

          claude = [
              row for row in receipt
              if row.get("provider") == "claude" and row.get("worker_key")
          ]
          if not claude:
              print("LIGHTUP_RECOVERY_CLAUDE_PUSH_DEFERRED=" + json.dumps({
                  "reason": "exact recovery not currently Claude-backed",
                  "queue_id": QUEUE_ID,
                  "allocated": receipt,
              }, sort_keys=True))
              raise SystemExit(0)

          pushed = post("/api/runner-control", {
              "project_id": claude[0]["worker_key"],
              "action": "push",
          })
          print("LIGHTUP_RECOVERY_CLAUDE_PUSH=" + json.dumps({
              "queue_id": QUEUE_ID,
              "worker_key": claude[0]["worker_key"],
              "provider": "claude",
              "command_id": pushed.get("command_id"),
          }, sort_keys=True))
          PY
