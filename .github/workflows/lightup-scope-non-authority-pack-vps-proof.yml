name: LightUp scope non-authority pack exact-head VPS proof

on:
  push:
    branches: [ops/lightup-scope-non-authority-pack-vps-proof-20261006]
    paths:
      - .github/workflows/lightup-scope-non-authority-pack-vps-proof.yml
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/lightup-scope-non-authority-pack-vps-proof.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lightup-scope-non-authority-pack-exact-head-proof
  cancel-in-progress: true

env:
  LIGHTUP_EXPECTED_SHA: fda4bdf264f024e829b14c692fba599d7f7f53c2
  LIGHTUP_REPO: /home/ubuntu/zennay-cloud/repos/lightup

jobs:
  hosted:
    name: Hosted pack Python ${{ matrix.python }} (diagnostic)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - name: Checkout exact LightUp pack head
        uses: actions/checkout@v4
        with:
          repository: Zennay/Lightup
          ref: fda4bdf264f024e829b14c692fba599d7f7f53c2
          path: lightup
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Prove exact pack offline
        working-directory: lightup
        env:
          PYTHONPATH: src:tests
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${LIGHTUP_EXPECTED_SHA}"
          python -m compileall -q src tests
          python -m unittest \
            tests.test_scope_authorization_membership_non_authority \
            tests.test_scope_authorization_lab_classification_non_authority -v
          python -m unittest discover -s tests -v
          python -m unittest discover -s tests/integration -v
          python scripts/check_safety_canaries.py

  pr100-compat:
    name: PR #100 compatibility Python ${{ matrix.python }} (diagnostic)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - name: Checkout corrected non-authority pack
        uses: actions/checkout@v4
        with:
          repository: Zennay/Lightup
          ref: fda4bdf264f024e829b14c692fba599d7f7f53c2
          path: pack
          persist-credentials: false
      - name: Checkout active PR #100 exact head
        uses: actions/checkout@v4
        with:
          repository: Zennay/Lightup
          ref: ef553b6e0aa0c99855e9907f4b2dee9edc5aac0f
          path: pr100
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Overlay only owned contract tests and prove compatibility
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C pack rev-parse HEAD)" = "fda4bdf264f024e829b14c692fba599d7f7f53c2"
          test "$(git -C pr100 rev-parse HEAD)" = "ef553b6e0aa0c99855e9907f4b2dee9edc5aac0f"
          cp pack/tests/test_scope_authorization_membership_non_authority.py pr100/tests/
          cp pack/tests/test_scope_authorization_lab_classification_non_authority.py pr100/tests/
          cd pr100
          PYTHONPATH=src:tests python -m unittest \
            tests.test_scope_authorization_membership_non_authority \
            tests.test_scope_authorization_lab_classification_non_authority -v

  prove:
    if: github.event_name == 'pull_request'
    name: Exact pack on vps-bb300bba
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 25
    steps:
      - name: Checkout zCloud proof harness
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Guard permanent VPS runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          python3 scripts/zcloud_vps_runner_guard.py --json
      - name: Snapshot exact LightUp pack head
        shell: bash
        run: |
          set -euo pipefail
          test -d "${LIGHTUP_REPO}/.git"
          git -C "${LIGHTUP_REPO}" fetch --prune origin \
            refs/heads/chatgpt/scope-authorization-non-authority-pack-20261006:refs/remotes/origin/lightup-scope-non-authority-pack-proof
          ACTUAL_SHA="$(git -C "${LIGHTUP_REPO}" rev-parse refs/remotes/origin/lightup-scope-non-authority-pack-proof^{commit})"
          test "${ACTUAL_SHA}" = "${LIGHTUP_EXPECTED_SHA}"
          SNAPSHOT="${RUNNER_TEMP}/lightup-scope-non-authority-pack-${GITHUB_RUN_ID}"
          rm -rf "${SNAPSHOT}"
          mkdir -p "${SNAPSHOT}"
          git -C "${LIGHTUP_REPO}" archive "${ACTUAL_SHA}" | tar -x -C "${SNAPSHOT}"
          echo "LIGHTUP_SNAPSHOT=${SNAPSHOT}" >> "${GITHUB_ENV}"
          echo "LIGHTUP_ACTUAL_SHA=${ACTUAL_SHA}" >> "${GITHUB_ENV}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Prove pack Python 3.11
        shell: bash
        env:
          PYTHONPATH: src:tests
        run: |
          set -euo pipefail
          cd "${LIGHTUP_SNAPSHOT}"
          python -m compileall -q src tests
          python -m unittest \
            tests.test_scope_authorization_membership_non_authority \
            tests.test_scope_authorization_lab_classification_non_authority -v
          python -m unittest discover -s tests -v
          python -m unittest discover -s tests/integration -v
          python scripts/check_safety_canaries.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Prove pack Python 3.14
        shell: bash
        env:
          PYTHONPATH: src:tests
        run: |
          set -euo pipefail
          cd "${LIGHTUP_SNAPSHOT}"
          python -m compileall -q src tests
          python -m unittest \
            tests.test_scope_authorization_membership_non_authority \
            tests.test_scope_authorization_lab_classification_non_authority -v
          python -m unittest discover -s tests -v
          python -m unittest discover -s tests/integration -v
          python scripts/check_safety_canaries.py
      - name: Write exact-head receipt
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/lightup-scope-non-authority-pack-receipt"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          payload = {
              "project": "LightUp",
              "issues": [364, 365],
              "source_branch": "chatgpt/scope-authorization-non-authority-pack-20261006",
              "target_sha": os.environ["LIGHTUP_ACTUAL_SHA"],
              "expected_sha": os.environ["LIGHTUP_EXPECTED_SHA"],
              "host": os.uname().nodename,
              "python": ["3.11", "3.14"],
              "github_run_id": os.environ["GITHUB_RUN_ID"],
              "proof": "dedicated-pack+compile+unit+integration+safety-canaries",
          }
          path = Path(os.environ["RUNNER_TEMP"]) / "lightup-scope-non-authority-pack-receipt" / "receipt.json"
          path.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n")
          print(json.dumps(payload, sort_keys=True))
          PY
      - name: Upload exact-head receipt
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lightup-scope-non-authority-pack-vps-proof
          path: ${{ runner.temp }}/lightup-scope-non-authority-pack-receipt/receipt.json
          if-no-files-found: error
      - name: Cleanup snapshot
        if: always()
        shell: bash
        run: rm -rf "${LIGHTUP_SNAPSHOT:-}"
