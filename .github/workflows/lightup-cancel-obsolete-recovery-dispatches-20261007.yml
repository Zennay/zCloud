name: Cancel obsolete LightUp recovery dispatches

on:
  push:
    branches:
      - "ops/lightup-runner-host-inventory-20261007"
    paths:
      - ".github/workflows/lightup-cancel-obsolete-recovery-dispatches-20261007.yml"

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel only superseded queued recovery attempts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          repo = os.environ["REPO"]
          token = os.environ["GH_TOKEN"]
          target_ids = {37615149184, 37616443406}
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "lightup-recovery-cancel-obsolete/1",
          }

          def request(path, method="GET"):
              req = urllib.request.Request(
                  "https://api.github.com" + path,
                  method=method,
                  headers=headers,
              )
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      raw = response.read()
                      return response.status, (json.loads(raw) if raw else {})
              except urllib.error.HTTPError as exc:
                  raw = exc.read()
                  body = json.loads(raw) if raw else {}
                  return exc.code, body

          receipt = []
          for run_id in sorted(target_ids):
              status, run = request(f"/repos/{repo}/actions/runs/{run_id}")
              if status != 200:
                  raise SystemExit(f"cannot verify owned recovery run {run_id}: HTTP {status}")
              state = str(run.get("status") or "")
              name = str(run.get("name") or "")
              branch = str(run.get("head_branch") or "")
              if branch != "ops/lightup-runner-host-inventory-20261007":
                  raise SystemExit(f"refusing foreign branch run {run_id}: {branch}")
              if name not in {
                  "Push existing LightUp runner recovery to Claude",
                  "Reconcile existing LightUp runner recovery lane",
              }:
                  raise SystemExit(f"refusing unexpected workflow {run_id}: {name}")
              if state in {"queued", "in_progress", "waiting", "pending", "requested"}:
                  cancel_status, body = request(
                      f"/repos/{repo}/actions/runs/{run_id}/cancel",
                      method="POST",
                  )
                  if cancel_status not in (202, 409):
                      raise SystemExit(
                          f"cancel failed for {run_id}: HTTP {cancel_status} {body}"
                      )
                  receipt.append({
                      "run_id": run_id,
                      "name": name,
                      "before": state,
                      "cancel_http": cancel_status,
                  })
              else:
                  receipt.append({
                      "run_id": run_id,
                      "name": name,
                      "before": state,
                      "cancel_http": None,
                  })
          print("LIGHTUP_OBSOLETE_RECOVERY_CANCEL=" + json.dumps(receipt, sort_keys=True))
          PY
