name: Deploy Fuckball native release

# Explicit, immutable, manually confirmed release. Never reset the old /opt/fuckball checkout.
on:
  workflow_dispatch:
    inputs:
      confirm_sha:
        description: "Full 40-character SHA currently at Zennay/fuckball main"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fuckball-vps-deploy
  cancel-in-progress: false

jobs:
  verify-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.approved.outputs.sha }}
    steps:
      - name: Verify exact main SHA and existing merged-PR gates
        id: approved
        uses: actions/github-script@v7
        env:
          REQUESTED_SHA: ${{ inputs.confirm_sha }}
        with:
          script: |
            const owner = 'Zennay', repo = 'fuckball';
            const sha = process.env.REQUESTED_SHA.trim().toLowerCase();
            if (!/^[0-9a-f]{40}$/.test(sha)) throw Error('A full immutable commit SHA is required.');
            const {data: branch} = await github.rest.repos.getBranch({owner,repo,branch:'main'});
            if (branch.commit.sha !== sha) throw Error('SHA is not the current Fuckball main; never release an unapproved historical commit.');
            const {data: prs} = await github.rest.repos.listPullRequestsAssociatedWithCommit({owner,repo,commit_sha:sha});
            const pr = prs.find(p=>p.merged_at && p.merge_commit_sha===sha && p.base.ref==='main' && p.head.repo?.full_name==='Zennay/fuckball');
            if (!pr) throw Error('The exact main commit does not originate from a merged first-party PR.');
            const {data: runs} = await github.rest.checks.listForRef({owner,repo,ref:pr.head.sha,per_page:100});
            if (runs.total_count>100) throw Error('Cannot exhaustively verify the PR head checks.');
            const required = ['test','app-contracts','peer-hosting-chromium','account-room','protocol','room-lifecycle','input-integrity'];
            const names = new Set(runs.check_runs.map(x=>x.name));
            if(required.some(name=>!names.has(name))) throw Error('Required existing CI check missing from merged PR.');
            const incomplete = runs.check_runs.filter(x=>x.status!=='completed'||x.conclusion!=='success');
            if(incomplete.length) throw Error('Some existing checks are not green: '+incomplete.map(x=>x.name).join(', '));
            const {data: statuses} = await github.rest.repos.getCombinedStatusForRef({owner,repo,ref:pr.head.sha});
            if(statuses.total_count && statuses.state!=='success') throw Error('Required commit statuses are not successful.');
            core.info('Approved merged PR #'+pr.number+'; immutable main '+sha+'; original CI gates green.');
            core.setOutput('sha',sha);

  release:
    needs: verify-source
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 12
    steps:
      - name: Promote approved native release without touching physics worktrees
        shell: bash
        env:
          TARGET_SHA: ${{ needs.verify-source.outputs.sha }}
          RELEASE_RUN: ${{ github.run_id }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
        run: bash scripts/deploy-fuckball-native.sh
