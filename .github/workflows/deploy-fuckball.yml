name: Deploy Fuckball on VPS

on:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy-fuckball.yml']
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: read

concurrency:
  group: fuckball-vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 12
    steps:
      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sync, test and deploy Fuckball
        shell: bash
        env:
          APP_HOME: /opt/fuckball
          APP_PORT: '3417'
        run: |
          set -euo pipefail
          echo "Runner: $(hostname); user: $(id -un); node: $(node -v)"
          sudo mkdir -p "$APP_HOME"
          sudo chown "$(id -un):$(id -gn)" "$APP_HOME"
          if [ ! -d "$APP_HOME/.git" ]; then
            git clone --depth 1 https://github.com/Zennay/fuckball.git "$APP_HOME"
          fi
          cd "$APP_HOME"
          git remote set-url origin https://github.com/Zennay/fuckball.git
          git fetch --depth 1 origin main
          wanted_sha="$(git rev-parse FETCH_HEAD)"
          echo "Deploying source commit: $wanted_sha"
          if [ "$(git rev-parse HEAD)" = "$wanted_sha" ] && sudo systemctl is-active --quiet fuckball.service && curl -fsS --max-time 3 "http://127.0.0.1:${APP_PORT}/health" >/dev/null; then
            echo "Same source is running and healthy; skipping restart to preserve multiplayer rooms."
            exit 0
          fi
          git reset --hard "$wanted_sha"
          npm run build:solo
          npm test
          # Require the new natural-contact solver, explicit kicks and 0 ms visual default.
          grep -q 'function collidePlayerBall(g,p,ball)' shared/physics.js
          grep -q 'return collide(p,ball,g.rebound)' shared/physics.js
          grep -q "p.lastKick='full';" shared/physics.js
          grep -q 'const chaserId=humanPossession' shared/bot.js
          grep -q 'WALL_REBOUND_AT_DEFAULT=0.76' shared/physics.js
          grep -q 'const wallRebound=g=>' shared/physics.js
          grep -q 'const cautious=frames>2' shared/prediction.js
          grep -q 'const passOptions=' shared/bot.js
          grep -q 'collidePlayerBall(g,p,ball);' shared/physics.js
          # Fail closed unless this validated contact/modes release is complete.
          grep -q 'BALL_SPEED_MULTIPLIER=1.2' shared/physics.js
          grep -q 'function reconcileVisual' shared/prediction.js
          grep -q 'id="soloTeams"' public/index.html
          # New game UX and bot must ship together with the original stadium.
          grep -q 'let extrapMs=0,renderScale=1;' public/index.html
          grep -q 'id="optionsScreen"' public/index.html
          grep -q 'id="chatDock"' public/index.html
          grep -q 'function cameraTransform(state,dt)' public/index.html
          grep -q 'function reply(message,g,bot)' shared/bot.js
          node --check server.js
          node_binary="$(command -v node)"
          run_user="$(id -un)"
          run_group="$(id -gn)"
          printf '[Unit]\nDescription=Fuckball multiplayer football game\nAfter=network-online.target\nWants=network-online.target\n\n[Service]\nType=simple\nUser=%s\nGroup=%s\nWorkingDirectory=/opt/fuckball\nEnvironment=NODE_ENV=production\nEnvironment=PORT=%s\nExecStart=%s /opt/fuckball/server.js\nRestart=always\nRestartSec=3\nNoNewPrivileges=true\nPrivateTmp=true\nProtectSystem=strict\n\n[Install]\nWantedBy=multi-user.target\n' "$run_user" "$run_group" "$APP_PORT" "$node_binary" | sudo tee /etc/systemd/system/fuckball.service >/dev/null
          sudo systemctl daemon-reload
          sudo systemctl enable fuckball.service
          sudo systemctl restart fuckball.service
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 3 "http://127.0.0.1:${APP_PORT}/health"; then
              echo " Health check passed"
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              sudo journalctl -u fuckball.service --no-pager -n 70
              exit 1
            fi
            sleep 2
          done
          # Verify the newly deployed UI is served to browsers, not only a healthy process.
          curl -fsS --max-time 8 "http://127.0.0.1:${APP_PORT}/" -o /tmp/fuckball-deployed.html
          grep -q 'id="fullscreenBtn"' /tmp/fuckball-deployed.html
          grep -q 'id="renderQuality"' /tmp/fuckball-deployed.html
          grep -q 'id="roomSidebar"' /tmp/fuckball-deployed.html
          grep -q 'id="optionsScreen"' /tmp/fuckball-deployed.html
          grep -q 'id="chatDock"' /tmp/fuckball-deployed.html
          grep -q 'id="soloTeams"' /tmp/fuckball-deployed.html
          grep -q 'let extrapMs=0,renderScale=1;' /tmp/fuckball-deployed.html
          grep -q "pulseball.extrapolation.v3" /tmp/fuckball-deployed.html
          curl -fsS --max-time 8 "http://127.0.0.1:${APP_PORT}/shared/bot.js" -o /tmp/fuckball-bot-deployed.js
          grep -q 'function reply(message,g,bot)' /tmp/fuckball-bot-deployed.js
          curl -fsS --max-time 8 "http://127.0.0.1:${APP_PORT}/shared/physics.js" -o /tmp/fuckball-physics-deployed.js
          grep -q 'BALL_SPEED_MULTIPLIER=1.2' /tmp/fuckball-physics-deployed.js
          grep -q 'WALL_REBOUND_AT_DEFAULT=0.76' /tmp/fuckball-physics-deployed.js
          curl -fsS --max-time 8 "http://127.0.0.1:${APP_PORT}/shared/prediction.js" -o /tmp/fuckball-prediction-deployed.js
          grep -q 'const cautious=frames>2' /tmp/fuckball-prediction-deployed.js
          echo "Fullscreen/high-refresh 4v4 game and new ball pace verified on VPS"
          if command -v ufw >/dev/null 2>&1; then
            sudo ufw allow "${APP_PORT}/tcp" comment "Fuckball multiplayer" || true
          fi
          public_ip="$(curl -fsS --max-time 8 https://api.ipify.org || true)"
          echo "Public IPv4: ${public_ip:-unknown}"
          echo "Local health: http://127.0.0.1:${APP_PORT}/health"
          if [ -n "$public_ip" ]; then
            echo "Candidate public URL: http://${public_ip}:${APP_PORT}/"
            echo "## Fuckball" >> "$GITHUB_STEP_SUMMARY"
            echo "Deployed commit: \`$wanted_sha\`" >> "$GITHUB_STEP_SUMMARY"
            echo "Candidate game URL: http://${public_ip}:${APP_PORT}/" >> "$GITHUB_STEP_SUMMARY"
          fi
          sudo systemctl is-active --quiet fuckball.service
          sudo systemctl status fuckball.service --no-pager | head -16
