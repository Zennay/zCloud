# Emergency API recovery retrigger 2026-10-06T05:55Z: restore 127.0.0.1:8765 before worker restart.
name: zCloud dashboard access recovery

# Manual recovery retrigger 2026-10-05T08:48Z: recover the real /api/status dependency, not only static HTML.

on:
  push:
    paths:
      - '.github/workflows/zcloud-dashboard-access-recovery.yml'
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  recover:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Recover zCloud dashboard listener
        shell: bash
        run: |
          set -euo pipefail
          service='zennay-cloud.service'
          public_ip='198.244.191.182'
          port='8765'
          status_url="http://127.0.0.1:${port}/api/status"

          echo '=== before ==='
          sudo -n systemctl is-active "$service" || true
          sudo -n systemctl status "$service" --no-pager -n 60 || true
          ss -lntp | grep -E '(:8765[[:space:]])' || true
          curl -fsS --max-time 6 "http://127.0.0.1:${port}/" >/dev/null || true
          curl -fsS --max-time 12 "$status_url" >/dev/null || true

          echo '=== sqlite writeability repair ==='
          root='/home/ubuntu/zennay-cloud'
          db="$root/history.db"
          service_user="$(systemctl show "$service" -p User --value)"
          if [[ -z "$service_user" ]]; then service_user='root'; fi
          service_group="$(systemctl show "$service" -p Group --value)"
          if [[ -z "$service_group" ]]; then service_group="$(id -gn "$service_user")"; fi
          echo "service_identity=$service_user:$service_group"
          sudo -n systemctl stop "$service" || true
          stat -c 'before %U:%G %a %n' "$root" "$db" 2>/dev/null || true
          findmnt -no TARGET,SOURCE,FSTYPE,OPTIONS -T "$db" || true
          lsattr -d "$db" "$db-wal" "$db-shm" 2>/dev/null || true

          sudo -n chown "$service_user:$service_group" "$root" "$db"
          sudo -n chmod u+rwx "$root"
          sudo -n chmod u+rw "$db"
          for sidecar in "$db-wal" "$db-shm"; do
            if [[ -e "$sidecar" ]]; then
              sudo -n chown "$service_user:$service_group" "$sidecar"
              sudo -n chmod u+rw "$sidecar"
            fi
          done

          # Clear an accidental immutable bit only on the zCloud SQLite files.
          for candidate in "$db" "$db-wal" "$db-shm"; do
            [[ -e "$candidate" ]] || continue
            attrs="$(lsattr -d "$candidate" 2>/dev/null | awk '{print $1}' || true)"
            if [[ "$attrs" == *i* ]]; then
              echo "clearing_accidental_immutable=$candidate"
              sudo -n chattr -i "$candidate"
            fi
          done

          sudo -n -u "$service_user" python3 - <<'PY'
          import sqlite3
          db="/home/ubuntu/zennay-cloud/history.db"
          conn=sqlite3.connect(db, timeout=10)
          try:
              conn.execute("BEGIN IMMEDIATE")
              conn.rollback()
          finally:
              conn.close()
          print("ZCLOUD_SQLITE_WRITE_PROBE_GREEN")
          PY
          stat -c 'after %U:%G %a %n' "$root" "$db" 2>/dev/null || true

          sudo -n systemctl reset-failed "$service" || true
          sudo -n systemctl restart "$service"
          for _ in $(seq 1 30); do
            if sudo -n systemctl is-active --quiet "$service" &&
               curl -fsS --max-time 4 "http://127.0.0.1:${port}/" >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          sudo -n systemctl is-active "$service"
          curl -fsS --max-time 6 "http://127.0.0.1:${port}/" >/dev/null
          curl -fsS --max-time 30 "$status_url" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("time") and isinstance(d.get("projects"), list)'
          echo 'ZCLOUD_DASHBOARD_STATUS_GREEN'

          listener="$(ss -lntp | awk '$4 ~ /:8765$/ {print $4; exit}')"
          echo "listener_after_restart=${listener:-missing}"

          # Existing zCloud network exposure is intentional and canonical defaults to 0.0.0.0.
          # Only repair an accidental loopback-only bind; do not alter firewall/DNS.
          if [[ "${listener:-}" == 127.0.0.1:8765 || "${listener:-}" == localhost:8765 ]]; then
            tmp="$(mktemp)"
            cat > "$tmp" <<'DROPIN'
          [Service]
          Environment=ZENNAY_BIND=0.0.0.0
          Environment=ZENNAY_PORT=8765
          DROPIN
            sudo -n install -d -m 0755 /etc/systemd/system/zennay-cloud.service.d
            sudo -n install -m 0644 "$tmp" /etc/systemd/system/zennay-cloud.service.d/20-dashboard-public-bind.conf
            rm -f "$tmp"
            sudo -n systemctl daemon-reload
            sudo -n systemctl restart "$service"
            for _ in $(seq 1 30); do
              if curl -fsS --max-time 4 "http://127.0.0.1:${port}/" >/dev/null 2>&1; then
                break
              fi
              sleep 2
            done
          fi

          echo '=== after ==='
          sudo -n systemctl is-active "$service"
          ss -lntp | grep -E '(:8765[[:space:]])'
          curl -fsS --max-time 6 "http://127.0.0.1:${port}/" >/dev/null

          sudo -n ufw status 2>/dev/null || true
          sudo -n nft list ruleset 2>/dev/null | grep -C 2 -E '8765|reject|drop' || true

          if curl -fsS --max-time 30 "http://${public_ip}:${port}/api/status" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("time") and isinstance(d.get("projects"), list)' >/dev/null 2>&1; then
            echo 'ZCLOUD_DASHBOARD_PUBLIC_STATUS_GREEN'
          else
            echo 'ZCLOUD_DASHBOARD_LOCAL_GREEN_PUBLIC_SELFTEST_FAILED'
            exit 22
          fi


  external_verify:
    name: Verify dashboard from external runner
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe public zCloud dashboard
        shell: bash
        run: |
          set -euo pipefail
          url='http://198.244.191.182:8765/api/status'
          for attempt in $(seq 1 6); do
            if curl -fsS --max-time 30 "$url" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("time") and isinstance(d.get("projects"), list)' >/dev/null; then
              echo 'ZCLOUD_DASHBOARD_EXTERNAL_STATUS_GREEN'
              exit 0
            fi
            sleep 5
          done
          echo 'ZCLOUD_DASHBOARD_EXTERNAL_FAILED'
          exit 23
