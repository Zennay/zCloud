name: zCloud persistent checkout hygiene ratchet
# Hosted source check only. Never touches a permanent runner or production.
on:
  # No paths filter: GitHub can omit matches beyond the changed-file cap,
  # so a large PR must not silently skip the repository-wide policy.
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: zcloud-checkout-clean-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  trusted-event:
    name: Explicitly fail untrusted checkout hygiene PR events
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Deny fork, alternate base, actor or rerun before any checkout
        shell: bash
        env:
          EVENT_KIND: ${{ github.event_name }}
          SOURCE_REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
          BASE_REF: ${{ github.base_ref }}
          SOURCE_ACTOR: ${{ github.actor }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test "$EVENT_KIND" = pull_request
          test "$SOURCE_REPO" = Zennay/zCloud
          test "$HEAD_REPO" = "$SOURCE_REPO"
          test "$BASE_REPO" = "$SOURCE_REPO"
          test "$BASE_REF" = main
          test "$SOURCE_ACTOR" = Zennay
          test "$ATTEMPT" = 1
          echo "CHECKOUT_CLEAN_EVENT_ADMITTED=1"
  validate:
    needs: trusted-event
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout immutable PR source with no retained credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true
          submodules: false
      - name: Verify source identity and run bounded adversarial tests
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'Zennay/zCloud'
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(timeout 15 git ls-remote --exit-code origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          python3 -m unittest -v tests.test_zcloud_selfhosted_checkout_clean_ratchet_20261016_w1
          python3 scripts/zcloud_selfhosted_checkout_clean_ratchet_20261016_w1.py \
            --base "$BASE_SHA" --head "$HEAD_SHA"
