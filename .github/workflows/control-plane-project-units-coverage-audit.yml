name: Control-plane project units coverage audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/zcloud_project_units_coverage_audit.py"
      - "tests/test_control_plane_project_units_coverage_audit.py"
      - ".github/workflows/control-plane-project-units-coverage-audit.yml"
      - "projects.json"
      - "enhancements.py"

permissions:
  contents: read

jobs:
  audit:
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run dependency-free focused regression
        run: python3 -m unittest -q tests.test_control_plane_project_units_coverage_audit
      - name: Emit bounded read-only coverage evidence
        run: python3 scripts/zcloud_project_units_coverage_audit.py
