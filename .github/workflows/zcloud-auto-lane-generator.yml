name: zCloud automatic worker lane regression

on:
  push:
    branches: [main, 'worker/**']
    paths:
      - lane_generator.py
      - server.py
      - projects.json
      - tests/test_lane_generator.py
      - tests/test_portfolio_queue_backend.py
      - tests/test_task_claims.py
      - tests/test_zcloud_auto_lane_hosted_trust_20261014.py
      - .github/workflows/zcloud-auto-lane-generator.yml
  pull_request:
    branches: [main]
    paths:
      - lane_generator.py
      - server.py
      - projects.json
      - tests/test_lane_generator.py
      - tests/test_portfolio_queue_backend.py
      - tests/test_task_claims.py
      - tests/test_zcloud_auto_lane_hosted_trust_20261014.py
      - .github/workflows/zcloud-auto-lane-generator.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lane-regression:
    if: >-
      github.repository == 'Zennay/zCloud' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == 'Zennay/zCloud' &&
        github.event.pull_request.base.repo.full_name == 'Zennay/zCloud'))
      && ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || (github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'Zennay'))
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 8
    steps:
      - name: Check out exact immutable source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true
      - name: Refuse unexpected repository or source revision before executing source
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$EXPECTED_REPOSITORY" = "Zennay/zCloud"
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Compile lane control plane
        run: python3 -m py_compile lane_generator.py server.py
      - name: Prove deterministic non-overlapping lane allocation
        run: |
          python3 -m unittest -v tests.test_lane_generator
          python3 -m unittest -v tests.test_portfolio_queue_backend
          python3 -m unittest -v tests.test_task_claims
      - name: Enforce lane CI trust regression
        run: python3 -m unittest -v tests.test_zcloud_auto_lane_hosted_trust_20261014
