name: zCloud automatic worker lane regression

on:
  push:
    branches: [main, 'worker/**']
    paths:
      - lane_generator.py
      - server.py
      - projects.json
      - tests/test_lane_generator.py
      - tests/test_portfolio_queue_backend.py
      - tests/test_task_claims.py
      - tests/test_zcloud_auto_lane_generator_workflow.py
      - .github/workflows/zcloud-auto-lane-generator.yml
  pull_request:
    branches: [main]
    paths:
      - lane_generator.py
      - server.py
      - projects.json
      - tests/test_lane_generator.py
      - tests/test_portfolio_queue_backend.py
      - tests/test_task_claims.py
      - tests/test_zcloud_auto_lane_generator_workflow.py
      - .github/workflows/zcloud-auto-lane-generator.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      EXPECTED_ZCLOUD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact zCloud candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.EXPECTED_ZCLOUD_SHA }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact zCloud candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_ZCLOUD_SHA"

      - name: Compile lane control plane
        run: python3 -m py_compile lane_generator.py server.py

      - name: Prove deterministic non-overlapping lane allocation
        run: |
          python3 -m unittest -v tests.test_lane_generator
          python3 -m unittest -v tests.test_portfolio_queue_backend
          python3 -m unittest -v tests.test_task_claims
          python3 -m unittest -v tests.test_zcloud_auto_lane_generator_workflow

  lane-regression:
    if: github.event_name != 'pull_request' && github.repository == 'Zennay/zCloud'
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 8
    env:
      EXPECTED_ZCLOUD_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact zCloud revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.EXPECTED_ZCLOUD_SHA }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify permanent VPS runner and exact revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_ZCLOUD_SHA"
          test "$(id -un)" = "ubuntu"
          python3 scripts/zcloud_vps_runner_guard.py --json

      - name: Compile lane control plane
        run: python3 -m py_compile lane_generator.py server.py

      - name: Prove deterministic non-overlapping lane allocation
        run: |
          python3 -m unittest -v tests.test_lane_generator
          python3 -m unittest -v tests.test_portfolio_queue_backend
          python3 -m unittest -v tests.test_task_claims
          python3 -m unittest -v tests.test_zcloud_auto_lane_generator_workflow
          echo "ZCLOUD_AUTO_LANE_REGRESSION_GREEN=1"
