name: HaxLab runtime state backup VPS proof

on:
  push:
    branches:
      - ops/haxlab-runtime-state-backup-vps-proof-20261007
    paths:
      - ".github/workflows/haxlab-runtime-state-backup-vps-proof-20261007.yml"

permissions:
  contents: read

concurrency:
  group: haxlab-runtime-state-backup-vps-proof-20261007
  cancel-in-progress: true

jobs:
  proof:
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 10
    steps:
      - name: Prove permanent VPS identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          test "${RUNNER_NAME:-}" = "zcloud-vps-1"

      - name: Checkout exact HaxLab candidate
        uses: actions/checkout@v4
        with:
          repository: Zennay/Haxlab
          ref: afc38e124962269803e7be47dd871aa5adccedcd
          path: haxlab
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact immutable candidate
        shell: bash
        working-directory: haxlab
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "afc38e124962269803e7be47dd871aa5adccedcd"
          test "$(git status --porcelain)" = ""

      - name: Create isolated environment
        shell: bash
        working-directory: haxlab
        run: |
          set -euo pipefail
          python3 -m venv .venv-runtime-state-backup-proof
          .venv-runtime-state-backup-proof/bin/python -m pip install -q -e ".[dev]"

      - name: Compile and run focused regressions
        shell: bash
        working-directory: haxlab
        run: |
          set -euo pipefail
          .venv-runtime-state-backup-proof/bin/python -m py_compile src/haxlab/runtime/state_backup.py
          .venv-runtime-state-backup-proof/bin/python -m pytest -q tests/test_runtime_state_backup.py

      - name: Verify repository suite collection
        shell: bash
        working-directory: haxlab
        run: |
          set -euo pipefail
          .venv-runtime-state-backup-proof/bin/python -m pytest --collect-only -q >"$RUNNER_TEMP/haxlab-runtime-state-backup-collect-$GITHUB_RUN_ID.txt"
          test -s "$RUNNER_TEMP/haxlab-runtime-state-backup-collect-$GITHUB_RUN_ID.txt"
          echo "HAXLAB_RUNTIME_STATE_BACKUP_VPS_PREFLIGHT=success"
