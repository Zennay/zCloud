name: FTMO PR418 any-VPS exact-head proof

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-pr418-any-vps-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ftmo-pr418-any-vps-proof
  cancel-in-progress: true

jobs:
  proof:
    runs-on: self-hosted
    timeout-minutes: 18
    env:
      TARGET_SHA: 312a5d78e524dc93586c46bde927efc1cc507334
    steps:
      - name: Fetch exact FTMO head without workspace mutation
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          src="$RUNNER_TEMP/ftmo-pr418-any-vps-proof"
          rm -rf "$src"
          git clone --filter=blob:none --no-checkout https://github.com/Zennay/Ftmo.git "$src" >/dev/null 2>&1
          git -C "$src" checkout --detach "$TARGET_SHA" >/dev/null
          test "$(git -C "$src" rev-parse HEAD)" = "$TARGET_SHA"
          echo "FTMO_PR418_EXACT_SHA=$TARGET_SHA"

      - name: Install isolated test environment
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr418-any-vps-proof"
          venv="$RUNNER_TEMP/ftmo-pr418-any-vps-proof-venv"
          rm -rf "$venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install -q -r "$src/requirements-ci.txt"
          "$venv/bin/python" -m pip install -q -e "$src"

      - name: Compile final provider readiness boundary
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr418-any-vps-proof"
          venv="$RUNNER_TEMP/ftmo-pr418-any-vps-proof-venv"
          cd "$src"
          "$venv/bin/python" -m compileall -q src/prop_trading_ai/ops/autonomous_rollover.py

      - name: Prove final readiness and provider compatibility
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr418-any-vps-proof"
          venv="$RUNNER_TEMP/ftmo-pr418-any-vps-proof-venv"
          cd "$src"
          "$venv/bin/python" -m pytest -q \
            tests/test_provider_foundation_publication.py \
            tests/test_autonomous_provider_retry.py \
            tests/test_zero_cost_workflow_boundary.py \
            tests/test_autonomous_deploy_lockstep.py

      - name: Record proof identity
        shell: bash
        run: |
          set -euo pipefail
          echo "FTMO_PR418_PROOF_RUN_ID=$GITHUB_RUN_ID"
          echo "FTMO_PR418_PROOF_RESULT=success"
          echo "FTMO_PR418_TARGET_SHA=$TARGET_SHA"
