name: zCloud no-browser-churn guarded watchdog hotfix

# Never install a root-owned watchdog from a code push or pull request.
# Owner approval and exact current main SHA are mandatory for manual install.
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/zcloud-no-browser-churn-hotfix.yml
      - tests/test_zcloud_no_browser_churn_manual_gate.py
  workflow_dispatch:
    inputs:
      apply:
        description: "Explicitly authorize guarded watchdog installation"
        type: boolean
        required: true
        default: false
      confirm_sha:
        description: "Copy the exact current main commit SHA to authorize apply"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: zcloud-no-browser-churn-hotfix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify offline tab-preservation regressions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the exact approved source without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 1
      - name: Verify exact revision and offline no-browser-churn tests
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python3 -m py_compile scripts/zcloud_worker_watchdog.py server.py
          python3 -m unittest -v tests.test_worker_progress_watchdog tests.test_zcloud_no_browser_churn_manual_gate
          node tests/test_worker_tab_reuse.js
          node tests/test_worker_tab_identity_guard.js

  install:
    name: Apply watchdog patch only with exact-main owner authorization
    needs: verify
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'Zennay/zCloud' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'Zennay' &&
      github.triggering_actor == 'Zennay' &&
      github.run_attempt == 1 &&
      inputs.apply == true &&
      inputs.confirm_sha == github.sha
    # Serialize live VPS writers with the canonical production release; do not cancel an active release.
    concurrency:
      group: zcloud-production-deploy
      cancel-in-progress: false
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 5
    steps:
      - name: Checkout exact approved main SHA without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          clean: true
          fetch-depth: 1
      - name: Verify permanent zCloud runner before any live commands
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/zcloud_vps_runner_guard.py --json
      - name: Verify owner identity and immutable release intent before writes
        shell: bash
        env:
          CONFIRM_SHA: ${{ inputs.confirm_sha }}
          APPLY: ${{ inputs.apply }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REPOSITORY" = "Zennay/zCloud"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_ACTOR" = "Zennay"
          test "$GITHUB_TRIGGERING_ACTOR" = "Zennay"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$APPLY" = "true"
          [[ "$CONFIRM_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$CONFIRM_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$CONFIRM_SHA"
          current_main="$(timeout 15 git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          test -n "$current_main"
          test "$current_main" = "$CONFIRM_SHA"
          test "$(hostname)" = "vps-bb300bba"
          test "$(id -un)" = "ubuntu"
          python3 scripts/zcloud_vps_runner_guard.py --json
      - name: Install only the validated non-restarting watchdog
        shell: bash
        run: |
          set -euo pipefail
          # No Firefox signal, tab close, queue write, or service restart.
          root="/home/ubuntu/zennay-cloud"
          live="/usr/local/sbin/zcloud-worker-watchdog"
          python3 -m py_compile scripts/zcloud_worker_watchdog.py
          echo "WATCHDOG_RUNTIME_ROOT_PRESENT=$(test -d "$root/scripts" && echo yes || echo no)"
          echo "WATCHDOG_LIVE_PRESENT=$(test -f "$live" && echo yes || echo no)"
          # The earlier job preflight may be arbitrarily old while hosted CI
          # or a scarce VPS runner is queued. Repeat remote-main equality
          # immediately before the first runtime/backup filesystem write.
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          prewrite_main="$(timeout 15 git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          test -n "$prewrite_main"
          test "$prewrite_main" = "$GITHUB_SHA"
          if test -d "$root/scripts"; then
            # The shared runtime checkout may carry active owner changes or
            # untracked scripts. This manual job must never overwrite them.
            if test -L "$root" || test -L "$root/scripts" || test -L "$root/scripts/zcloud_worker_watchdog.py"; then
              echo "::error::Runtime watchdog path is symlinked; refusing promotion."
              exit 1
            fi
            if ! runtime_head="$(GIT_OPTIONAL_LOCKS=0 git -C "$root" rev-parse --verify HEAD)"; then
              echo "::error::Runtime checkout identity unavailable; refusing promotion."
              exit 1
            fi
            if test "$runtime_head" != "$GITHUB_SHA"; then
              echo "::error::Runtime checkout is not the approved main revision."
              exit 1
            fi
            if ! runtime_status="$(GIT_OPTIONAL_LOCKS=0 git -C "$root" status --porcelain=v1 --untracked-files=all -- scripts/zcloud_worker_watchdog.py)"; then
              echo "::error::Runtime watchdog ownership cannot be verified."
              exit 1
            fi
            if test -n "$runtime_status"; then
              echo "::error::Runtime watchdog has modified or untracked owner code; refusing promotion."
              exit 1
            fi
            if test -f "$root/scripts/zcloud_worker_watchdog.py" && ! cmp -s -- scripts/zcloud_worker_watchdog.py "$root/scripts/zcloud_worker_watchdog.py"; then
              echo "::error::Runtime watchdog differs from approved source; refusing promotion."
              exit 1
            fi
            echo "Shared runtime checkout preserved; only canonical standalone path is eligible."
          else
            echo "Runtime repository absent; only canonical standalone path is eligible."
          fi
          # Admission must precede all write-side effects, even the backup.
          # Refuse symlinked root targets or preexisting backup collisions.
          if test -L "$live" || test -L "${live%/*}"; then
            echo "::error::Standalone watchdog path is symlinked; refusing owner promotion."
            exit 1
          fi
          backup="$HOME/.local/state/zcloud/zcloud-worker-watchdog.pre-no-churn-$GITHUB_RUN_ID"
          if test -e "$backup" || test -L "$backup"; then
            echo "::error::Run-specific private watchdog backup already exists."
            exit 1
          fi
          umask 077
          mkdir -p -- "$(dirname "$backup")"
          if test -f "$live"; then
            install -m 0600 -- "$live" "$backup"
            echo "PRIVATE_WATCHDOG_BACKUP_CREATED=1"
          else
            echo "NO_PRIOR_STANDALONE_WATCHDOG=1"
          fi
          # A second bounded proof denies root-owned promotion after a
          # moving-main race during the optional runtime-source update.
          final_main="$(timeout 15 git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          test -n "$final_main"
          test "$final_main" = "$GITHUB_SHA"
          # Stage the approved executable on the target filesystem as root.
          # Direct `install "$live"` truncates an existing executable before
          # the write completes. An active watchdog could observe partial code.
          # The final rename is same-filesystem and therefore atomic.
          staged=""
          installed=0
          was_installed=0
          if test -f "$live"; then was_installed=1; fi
          cleanup_watchdog_install() {
            rc=$?
            if test "$rc" -ne 0 && test "$installed" -eq 1; then
              # Do not undo a concurrent owner's change to the installed file.
              if test ! -L "$live" && test ! -L "${live%/*}" \
                 && sudo -n cmp -s -- scripts/zcloud_worker_watchdog.py "$live"; then
                if test "$was_installed" -eq 1 && test -f "$backup"; then
                  restore=""
                  if restore="$(sudo -n mktemp /usr/local/sbin/.zcloud-watchdog.restore.XXXXXXXX)" &&
                     sudo -n install -m 0755 -- "$backup" "$restore" &&
                     sudo -n mv -f -- "$restore" "$live"; then
                    echo "::warning::Previous standalone watchdog restored after failed install."
                  else
                    echo "::error::Watchdog rollback failed; retain private backup for owner restoration."
                  fi
                  if test -n "$restore"; then sudo -n rm -f -- "$restore" || true; fi
                elif test "$was_installed" -eq 0; then
                  sudo -n rm -f -- "$live" || echo "::error::Cannot undo newly created watchdog."
                fi
              else
                echo "::error::Standalone watchdog changed since install; preserving owner work and backup."
              fi
            fi
            if test -n "$staged"; then sudo -n rm -f -- "$staged" || true; fi
          }
          trap cleanup_watchdog_install EXIT
          staged="$(sudo -n mktemp /usr/local/sbin/.zcloud-watchdog.new.XXXXXXXX)"
          sudo -n install -m 0755 -- scripts/zcloud_worker_watchdog.py "$staged"
          sudo -n cmp -- scripts/zcloud_worker_watchdog.py "$staged"
          # Source may advance while a queued live writer prepares a new file.
          final_main="$(timeout 15 git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          test -n "$final_main"
          test "$final_main" = "$GITHUB_SHA"
          # A concurrently changing owner path must not be overwritten.
          if test -L "$live" || test -L "${live%/*}"; then
            echo "::error::Standalone watchdog target became a symlink."
            exit 1
          fi
          if test "$was_installed" -eq 1; then
            if ! cmp -s -- "$backup" "$live"; then
              echo "::error::Standalone watchdog changed while staged; owner bytes preserved."
              exit 1
            fi
          elif test -e "$live" || test -L "$live"; then
            echo "::error::Standalone watchdog appeared while staged; owner bytes preserved."
            exit 1
          fi
          sudo -n mv -f -- "$staged" "$live"
          installed=1
          sudo -n cmp -- scripts/zcloud_worker_watchdog.py "$live"
          echo "LIVE_WATCHDOG_NO_BROWSER_RESTART=1"
          echo "EXISTING_TABS_AND_FIREFOX_PROCESSES_UNTOUCHED=1"
          echo "Manual install handled without a shared runtime source overwrite."
          python3 scripts/zsentinel_release_receipt.py --component watchdog --outcome disk-installed
