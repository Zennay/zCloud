name: FTMO PR510 permission hardening focused proof

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-pr510-permission-hardening-proof.yml"

permissions:
  contents: read

concurrency:
  group: ftmo-pr510-permission-hardening-focused-proof
  cancel-in-progress: true

jobs:
  proof:
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 12
    env:
      TARGET_SHA: 819dc14b045d7ff5d7a3cb3a08a9455cb08aaea7
      FTMO_AUTONOMOUS_CLOUD_BUDGET_USD: "0.00"
      FTMO_ALLOW_PAID_AWS: ""
    steps:
      - name: Verify VPS execution boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          test "$FTMO_AUTONOMOUS_CLOUD_BUDGET_USD" = "0.00"
          test -z "${FTMO_ALLOW_PAID_AWS:-}"

      - name: Checkout exact PR510 head
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/ftmo-pr510-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          rm -rf "$work"
          git init -q "$work"
          git -C "$work" remote add origin https://github.com/Zennay/Ftmo.git
          git -C "$work" -c protocol.version=2 fetch -q --depth=1 origin "$TARGET_SHA"
          git -C "$work" checkout -q --detach FETCH_HEAD
          test "$(git -C "$work" rev-parse HEAD)" = "$TARGET_SHA"
          echo "FTMO_WORK=$work" >> "$GITHUB_ENV"

      - name: Install exact-head environment
        shell: bash
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/ftmo-pr510-venv-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          rm -rf "$venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install -q -r "$FTMO_WORK/requirements-ci.txt"
          "$venv/bin/python" -m pip install -q -e "$FTMO_WORK"
          echo "FTMO_VENV=$venv" >> "$GITHUB_ENV"

      - name: Run focused PR510 proof
        shell: bash
        run: |
          set -euo pipefail
          cd "$FTMO_WORK"
          bash -n scripts/run-autonomous-marathon.sh
          "$FTMO_VENV/bin/python" -m py_compile tests/test_autonomous_deploy_lockstep.py
          "$FTMO_VENV/bin/python" -m pytest -q \
            tests/test_autonomous_deploy_lockstep.py \
            tests/test_deploy_publish_integrity.py \
            tests/test_research_state_sync_publication_integrity.py
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/ftmo-pr510-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
                 "$RUNNER_TEMP/ftmo-pr510-venv-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
