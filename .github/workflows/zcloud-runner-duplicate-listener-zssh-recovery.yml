name: Enqueue duplicate zCloud runner recovery on zSSH

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/zcloud-runner-duplicate-listener-zssh-recovery.yml"

permissions:
  contents: read

concurrency:
  group: zcloud-runner-duplicate-listener-zssh-recovery
  cancel-in-progress: false

jobs:
  enqueue:
    runs-on: [self-hosted, ftmo-research]
    timeout-minutes: 3
    steps:
      - name: Enqueue bounded duplicate-listener recovery
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = "vps-bb300bba-ftmo"
          test "$(hostname)" = "vps-bb300bba"
          python3 - <<'PY'
          import json, time, urllib.error, urllib.request

          base = "http://127.0.0.1:8765"
          queue_id = "zssh-zcloud-duplicate-listener-recovery-20261004"
          payload = {
              "action": "enqueue",
              "queue_id": queue_id,
              "project_id": "zssh",
              "title": "Recover duplicate zCloud Actions listener",
              "priority": "P0",
              "completion_criteria": (
                  "On vps-bb300bba repair only the zCloud Actions runner rooted at "
                  "/home/ubuntu/actions-runner-zcloud. Evidence from runs 37234936291 attempt 1/2 "
                  "proves two Runner.Listener processes (old PID lineage started Oct 1 and canonical "
                  "systemd lineage started 2026-10-04 21:09:22 UTC) are concurrently using the same "
                  "_work/_temp, with two Runner.Workers and GITHUB_EVENT_PATH plus sentinel files "
                  "disappearing within 8 seconds. Exact service is "
                  "actions.runner.Zennay-zCloud.zcloud-vps-1.service. Preserve every active "
                  "Runner.Worker: do not terminate/restart a listener while its worker is active. "
                  "Identify the canonical service cgroup, quarantine/remove only orphan listener/"
                  "supervisor processes outside that cgroup once their workers are idle, and prevent "
                  "them respawning. Verify exactly one zCloud Runner.Listener remains, the canonical "
                  "service is active/listening, and no duplicate worker can share the runner temp. "
                  "Canonical zCloud main is c193f700e67957ae5ee0038bbc4a0bb43128cc06; regression "
                  "run 37235351942 is green but deploy 37235430020 still failed in checkout because "
                  "the duplicate listener removed save_state/set_output files. After recovery, "
                  "dispatch a fresh zCloud regression smoke on exact current main and require a fresh "
                  "attempt-1 zCloud VPS deploy newer than 37235430020 to start scheduling. "
                  "Do not modify zCloud application/runtime data, browser workers, project queue "
                  "priorities other than this recovery item, secrets, or production code. Return "
                  "pre/post process trees, service/cgroup identity, the concrete recovery action, "
                  "and the fresh regression/deploy IDs."
              ),
              "source_url": "https://github.com/Zennay/zCloud/pull/401",
          }

          def request_json(path, body=None):
              data = None
              method = "GET"
              headers = {}
              if body is not None:
                  data = json.dumps(body).encode()
                  method = "POST"
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(base + path, data=data, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=10) as response:
                      return response.status, json.load(response)
              except urllib.error.HTTPError as exc:
                  raw = exc.read().decode("utf-8", "replace")
                  try:
                      payload = json.loads(raw)
                  except Exception:
                      payload = {"error": raw[:500]}
                  return exc.code, payload

          enqueue_status, enqueue = request_json("/api/portfolio-queue", payload)
          print("ZCLOUD_RUNNER_RECOVERY_ENQUEUE", enqueue_status, json.dumps(enqueue, sort_keys=True))
          if enqueue_status != 200:
              raise SystemExit(f"recovery enqueue failed: HTTP {enqueue_status} {enqueue}")

          start_status, start = request_json(
              "/api/runner-control", {"project_id": "zssh", "action": "start"}
          )
          print("ZSSH_START", start_status, json.dumps(start, sort_keys=True))
          if start_status not in (200, 429):
              raise SystemExit(f"zSSH start failed: HTTP {start_status} {start}")

          # Start changes desired state synchronously, but the browser worker can
          # take a few seconds to consume the command and become telemetry-active.
          # Do not race push admission against that transition.
          start_deadline = time.monotonic() + 75
          while time.monotonic() < start_deadline:
              _, live = request_json("/api/runner-commands?limit=200")
              pending_start = [
                  row for row in (live.get("commands") or [])
                  if row.get("project_id") == "zssh" and row.get("action") == "start"
              ]
              if not pending_start:
                  break
              time.sleep(3)
          else:
              raise SystemExit("zSSH start command was not consumed within 75s")

          push = None
          push_status = None
          push_deadline = time.monotonic() + 75
          while time.monotonic() < push_deadline:
              push_status, push = request_json(
                  "/api/runner-control", {"project_id": "zssh", "action": "push"}
              )
              print("ZSSH_PUSH_ATTEMPT", push_status, json.dumps(push, sort_keys=True))
              if push_status == 200:
                  break
              if push_status not in (409, 429):
                  raise SystemExit(f"zSSH push failed: HTTP {push_status} {push}")
              time.sleep(3)
          if push_status != 200:
              raise SystemExit(f"zSSH worker never became push-ready: {push}")

          command_ids = {
              int(v) for v in (start.get("command_id"), push.get("command_id")) if v
          }
          if not command_ids:
              raise SystemExit("zSSH recovery trigger returned no command ids")

          deadline = time.monotonic() + 90
          pending = set(command_ids)
          while pending and time.monotonic() < deadline:
              _, live = request_json("/api/runner-commands?limit=200")
              commands = live.get("commands") or []
              pending = {
                  int(row.get("id"))
                  for row in commands
                  if row.get("id") is not None and int(row.get("id")) in command_ids
              }
              if pending:
                  time.sleep(3)
          print("ZCLOUD_RUNNER_RECOVERY_COMMANDS_PENDING", sorted(pending))
          if pending:
              raise SystemExit("zSSH worker did not consume runner recovery commands")
          PY
