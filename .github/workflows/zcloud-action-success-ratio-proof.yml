name: zCloud action success ratio proof

on:
  pull_request:
    paths:
      - "scripts/zcloud_action_success_ratio.py"
      - "tests/test_action_success_ratio.py"
      - "tests/test_action_success_ratio_workflow.py"
      - ".github/workflows/zcloud-action-success-ratio-proof.yml"
  push:
    branches: [main]
    paths:
      - "scripts/zcloud_action_success_ratio.py"
      - "tests/test_action_success_ratio.py"
      - "tests/test_action_success_ratio_workflow.py"
      - ".github/workflows/zcloud-action-success-ratio-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zcloud-action-success-ratio-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 1
      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
      - name: Run action success ratio contract
        run: python3 -m unittest -v tests.test_action_success_ratio tests.test_action_success_ratio_workflow

  permanent-vps-proof:
    if: >-
      github.repository == 'Zennay/zCloud' &&
      github.actor == 'Zennay' &&
      github.triggering_actor == 'Zennay' &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.repo.owner.login == 'Zennay'))
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 1
      - name: Verify exact checkout and permanent runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          test "$(id -un)" = "ubuntu"
          python3 scripts/zcloud_vps_runner_guard.py --json
      - name: Prove live action ratios read-only
        shell: bash
        run: |
          set -euo pipefail
          db=/home/ubuntu/zennay-cloud/history.db
          test -f "$db"
          out="$RUNNER_TEMP/action-success-ratio.json"
          python3 scripts/zcloud_action_success_ratio.py --db "$db" --hours 168 --require-complete > "$out"
          python3 - "$out" <<'PY'
          import json
          import sys
          from pathlib import Path
          data = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert data["schema_version"] == "zcloud-action-success-ratio-v1"
          assert data["coverage_complete"] is True
          assert data["summary"]["attempts"] == sum(item["attempts"] for item in data["actions"])
          assert all(0 <= item["success_ratio"] <= 1 for item in data["actions"] if item["success_ratio"] is not None)
          forbidden = {"result", "conversation_id", "prompt", "reason", "error"}
          assert all(not (forbidden & set(item)) for item in data["actions"])
          print("ZCLOUD_ACTION_SUCCESS_RATIO_LIVE_READ_GREEN", f"actions={len(data['actions'])}", f"attempts={data['summary']['attempts']}")
          PY
