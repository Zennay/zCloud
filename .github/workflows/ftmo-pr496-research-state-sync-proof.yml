name: FTMO PR496 research-state sync exact-head proof

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-pr496-research-state-sync-proof.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ftmo-pr496-research-state-sync-proof
  cancel-in-progress: true

jobs:
  proof:
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 25
    env:
      TARGET_SHA: 9f2a986c8462b15a3353ddce44435417acc591e0
      TARGET_PR: "496"
      EXPECTED_MAIN_SHA: fa8ef63e79a1ed2281a15c7a2ebd2dfe4c39b067
      FTMO_AUTONOMOUS_CLOUD_BUDGET_USD: "0.00"
      FTMO_ALLOW_PAID_AWS: ""
    steps:
      - name: Checkout zCloud receipt workspace
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout exact FTMO PR496 head
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          src="$RUNNER_TEMP/ftmo-pr496-$GITHUB_RUN_ID"
          rm -rf "$src"
          git init -q "$src"
          git -C "$src" remote add origin https://github.com/Zennay/Ftmo.git
          git -C "$src" -c protocol.version=2 fetch -q --depth=1 origin "$TARGET_SHA"
          git -C "$src" checkout -q --detach FETCH_HEAD
          test "$(git -C "$src" rev-parse HEAD)" = "$TARGET_SHA"
          python3 - <<'PY'
          import json, os, subprocess
          pr = json.loads(subprocess.check_output(
              ["gh", "api", f"repos/Zennay/Ftmo/pulls/{os.environ['TARGET_PR']}"],
              text=True,
          ))
          assert pr["state"] == "open"
          assert pr["head"]["sha"] == os.environ["TARGET_SHA"]
          assert pr["base"]["sha"] == os.environ["EXPECTED_MAIN_SHA"]
          main = subprocess.check_output(
              ["gh", "api", "repos/Zennay/Ftmo/commits/main", "--jq", ".sha"],
              text=True,
          ).strip()
          assert main == os.environ["EXPECTED_MAIN_SHA"]
          print("FTMO_PR496_IDENTITY=verified")
          PY

      - name: Prove research-state sync integrity
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr496-$GITHUB_RUN_ID"
          venv="$RUNNER_TEMP/ftmo-pr496-venv-$GITHUB_RUN_ID"
          rm -rf "$venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install -q -r "$src/requirements-ci.txt"
          "$venv/bin/python" -m pip install -q -e "$src"
          cd "$src"
          "$venv/bin/python" -m py_compile             src/prop_trading_ai/ops/deploy_publish.py             src/prop_trading_ai/research/research_machine.py
          "$venv/bin/python" -m pytest -q             tests/test_deploy_publish_integrity.py             tests/test_research_state_sync_publication_integrity.py             tests/test_autonomous_research_state_sync.py             tests/test_research_state_sync_guard.py             tests/test_research_machine.py
          "$venv/bin/python" -m pytest -q             tests/test_zero_cost_workflow_boundary.py::test_every_repository_workflow_has_no_github_hosted_runner             tests/test_zero_cost_workflow_boundary.py::test_research_state_sync_is_fail_closed_and_never_writes_github             tests/test_zero_cost_workflow_boundary.py::test_runtime_verification_and_research_state_sync_have_separate_ownership
          test "$FTMO_AUTONOMOUS_CLOUD_BUDGET_USD" = "0.00"
          test -z "${FTMO_ALLOW_PAID_AWS:-}"
          echo "FTMO_PR496_RESEARCH_STATE_SYNC_PROOF=success"

      - name: Revalidate exact identities before receipt
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/Zennay/Ftmo/commits/main --jq .sha)" = "$EXPECTED_MAIN_SHA"
          test "$(gh api "repos/Zennay/Ftmo/pulls/$TARGET_PR" --jq .head.sha)" = "$TARGET_SHA"
          test "$(gh api "repos/Zennay/Ftmo/pulls/$TARGET_PR" --jq .base.sha)" = "$EXPECTED_MAIN_SHA"
          test "$(gh api "repos/Zennay/Ftmo/pulls/$TARGET_PR" --jq .state)" = "open"

      - name: Persist durable proof receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-evidence
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          payload = {
              "schema_version": 1,
              "project": "ftmo",
              "pull_request": 496,
              "target_sha": os.environ["TARGET_SHA"],
              "expected_main_sha": os.environ["EXPECTED_MAIN_SHA"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "runner": os.environ.get("RUNNER_NAME", ""),
              "host": "vps-bb300bba",
              "result": "success",
              "proof": [
                  "exact-pr-head-and-main-identity",
                  "descriptor-bound-published-state-read",
                  "descriptor-bound-mutable-publication",
                  "append-only-immutable-evidence-publication",
                  "stable-root-symlink-rejection",
                  "owner-permission-link-count-seal",
                  "verified-config-byte-parsing",
                  "monotonic-state-sync-regressions",
                  "workflow-lockstep-regressions",
                  "zero-cost-boundary"
              ],
              "paid_cloud_budget_usd": "0.00",
              "research_outcomes_accessed": False,
              "walk_forward_accessed": False,
              "final_holdout_accessed": False,
              "live_or_broker_access_opened": False,
          }
          Path("runtime-evidence/ftmo-pr496-research-state-sync-proof.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime-evidence/ftmo-pr496-research-state-sync-proof.json
          git commit -m "Record FTMO PR496 exact-head proof $GITHUB_RUN_ID"
          git push origin HEAD:main

      - name: Merge exact green FTMO PR496
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/Zennay/Ftmo/commits/main --jq .sha)" = "$EXPECTED_MAIN_SHA"
          test "$(gh api "repos/Zennay/Ftmo/pulls/$TARGET_PR" --jq .head.sha)" = "$TARGET_SHA"
          test "$(gh api "repos/Zennay/Ftmo/pulls/$TARGET_PR" --jq .base.sha)" = "$EXPECTED_MAIN_SHA"
          test "$(gh api "repos/Zennay/Ftmo/pulls/$TARGET_PR" --jq .state)" = "open"
          result="$(gh api --method PUT "repos/Zennay/Ftmo/pulls/$TARGET_PR/merge"             -f merge_method=squash             -f sha="$TARGET_SHA")"
          test "$(python3 -c 'import json,sys; print(str(json.load(sys.stdin).get("merged")).lower())' <<<"$result")" = "true"
          merge_sha="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("sha") or "")' <<<"$result")"
          test -n "$merge_sha"
          echo "FTMO_PR496_MERGE_SHA=$merge_sha"

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/ftmo-pr496-$GITHUB_RUN_ID" "$RUNNER_TEMP/ftmo-pr496-venv-$GITHUB_RUN_ID"
