name: Close HaxLab multisource suite v2 queue item

on:
  pull_request:
    paths:
      - .github/workflows/haxlab-multisource-queue-close.yml
      - tests/test_haxlab_multisource_queue_close_workflow.py
  push:
    branches: [main]
    paths:
      - .github/workflows/haxlab-multisource-queue-close.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: haxlab-multisource-queue-close-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'live' }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 1
      - name: Validate multisource queue-close trust contract
        shell: bash
        run: python3 -m unittest tests.test_haxlab_multisource_queue_close_workflow

  close:
    if: github.event_name != 'pull_request' && github.repository == 'Zennay/zCloud' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 1

      - name: Guard canonical permanent VPS before queue mutation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(id -un)" = "ubuntu"
          test "$(hostname)" = "vps-bb300bba"
          test "${RUNNER_NAME:-}" = "zcloud-vps-1"
          python3 scripts/zcloud_vps_runner_guard.py --json

      - name: Atomically record completed multisource implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sqlite3
          from datetime import datetime, timezone

          db="/home/ubuntu/zennay-cloud/history.db"
          qid="haxlab-multisource-evaluation-suite-v2"
          evidence=(
              "Implemented on HaxLab Arena-v2 branch through c51ae3a2dd44825b8616bdbd47ba998768ab44c0; "
              "workflow_run_id=36849443352 SUCCESS with 11 focused regressions green; "
              "generated artifact_id=11154484062 multisource-evaluation-suite-v2; "
              "suite_sha256=96ff84ca6a53f2d20fe437cda063ed1c576676c1f33740c13423160a556a14e4; "
              "3 disjoint replay sources, 48 frozen scenarios, 96 mirrored matches; "
              "source frozen manifest remained sha256=541b635e34492e9409c5d0fbe2ffd6303c75a2cd10348aebee9e5df49669a609."
          )
          ts=datetime.now(timezone.utc).isoformat()

          conn=sqlite3.connect(db,timeout=10)
          conn.row_factory=sqlite3.Row
          try:
              conn.execute("BEGIN IMMEDIATE")
              row=conn.execute(
                  "SELECT queue_id,project_id,priority,status,eligible,worker_slot,claim_expires "
                  "FROM portfolio_queue WHERE queue_id=?",
                  (qid,),
              ).fetchone()
              if row is None:
                  raise SystemExit("queue item missing")
              before=dict(row)
              print("MULTISOURCE_QUEUE_BEFORE",before)

              if row["status"]=="done" and not row["eligible"]:
                  conn.commit()
                  print("MULTISOURCE_QUEUE_ALREADY_DONE",before)
              else:
                  if row["project_id"]!="haxlab":
                      raise SystemExit("project mismatch")
                  if row["status"]!="queued" or row["worker_slot"] is not None:
                      raise SystemExit(
                          "refusing external completion while queue item is actively claimed: "
                          + str(before)
                      )
                  conn.execute(
                      """
                      UPDATE portfolio_queue
                      SET status='done',eligible=0,evidence=?,blocker='',
                          worker_slot=NULL,claimed_at=NULL,claim_expires=NULL,updated_at=?
                      WHERE queue_id=? AND status='queued' AND worker_slot IS NULL
                      """,
                      (evidence,ts,qid),
                  )
                  if conn.total_changes != 1:
                      raise SystemExit("atomic queue completion did not update exactly one row")
                  conn.commit()

              final=conn.execute(
                  "SELECT queue_id,project_id,priority,status,eligible,worker_slot,evidence "
                  "FROM portfolio_queue WHERE queue_id=?",
                  (qid,),
              ).fetchone()
              final=dict(final)
              print("MULTISOURCE_QUEUE_DONE",final)
              if final["status"]!="done" or final["eligible"] or final["worker_slot"] is not None:
                  raise SystemExit("DONE state did not persist")
          finally:
              conn.close()
          PY
