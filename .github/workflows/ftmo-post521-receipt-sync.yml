# Trigger after workflow exists on parent main.\nname: FTMO receipt state-sync dispatch

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ftmo-post521-receipt-sync.yml'

jobs:
  dispatch:
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 5
    steps:
      - name: Dispatch exact FTMO receipt-main sync
        shell: bash
        run: |
          set -euo pipefail
          expected="d813fc3e9305ed61db360953ecb65d00668ecfb2"
          test "$(hostname)" = "vps-bb300bba"
          gh auth status >/dev/null 2>&1
          current="$(gh api repos/Zennay/Ftmo/branches/main --jq .commit.sha)"
          test "$current" = "$expected"
          existing="$(gh api -X GET repos/Zennay/Ftmo/actions/workflows/sync-autonomous-research-state.yml/runs -f head_sha="$expected" -f per_page=20 --jq .total_count)"
          if [[ "$existing" == "0" ]]; then
            gh workflow run sync-autonomous-research-state.yml --repo Zennay/Ftmo --ref main
          fi
