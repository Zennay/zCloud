name: FTMO PR491 research-state sync publication proof

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-pr491-research-sync-proof.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ftmo-pr491-research-sync-proof
  cancel-in-progress: true

jobs:
  proof:
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 30
    env:
      TARGET_SHA: c937084f69cf7e6c5cce7c84ffacb7b4b272005b
      TARGET_PR: "491"
      EXPECTED_MAIN_SHA: 25c8af9980a9cfa85a050e68c4d9060fefa4ee17
      FTMO_AUTONOMOUS_CLOUD_BUDGET_USD: "0.00"
      FTMO_ALLOW_PAID_AWS: ""
    steps:
      - name: Checkout zCloud receipt workspace
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout exact FTMO PR491 head
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          test "$(gh api repos/Zennay/Ftmo/commits/main --jq .sha)" = "$EXPECTED_MAIN_SHA"
          test "$(gh api "repos/Zennay/Ftmo/pulls/$TARGET_PR" --jq .head.sha)" = "$TARGET_SHA"
          test "$(gh api "repos/Zennay/Ftmo/pulls/$TARGET_PR" --jq .state)" = "open"

          work="$RUNNER_TEMP/ftmo-pr491-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          rm -rf "$work"
          git init -q "$work"
          git -C "$work" remote add origin https://github.com/Zennay/Ftmo.git
          git -C "$work" -c protocol.version=2 fetch -q --depth=1 origin "$TARGET_SHA"
          git -C "$work" checkout -q --detach FETCH_HEAD
          test "$(git -C "$work" rev-parse HEAD)" = "$TARGET_SHA"

      - name: Prove descriptor-bound sync publication
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/ftmo-pr491-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          venv="$RUNNER_TEMP/ftmo-pr491-venv-$GITHUB_RUN_ID"
          rm -rf "$venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install -q -r "$work/requirements-ci.txt"
          "$venv/bin/python" -m pip install -q -e "$work"
          cd "$work"

          "$venv/bin/python" -m py_compile src/prop_trading_ai/ops/deploy_publish.py
          "$venv/bin/python" -m pytest -q             tests/test_deploy_publish_integrity.py             tests/test_research_state_sync_publication_integrity.py
          "$venv/bin/python" -m pytest -q tests/test_zero_cost_workflow_boundary.py             -k "research_state_sync or every_repository_workflow_has_no_github_hosted_runner"

          "$venv/bin/python" - <<'PY'
          import json
          from pathlib import Path
          from prop_trading_ai.ops.deploy_publish import read_existing_file_bytes

          payload = read_existing_file_bytes(
              root=Path("/opt/ftmo-autonomous"),
              relative="configs/research_machine.json",
          )
          assert payload is not None
          active = json.loads(payload)["active_generation"]
          assert active["generation_number"] == 30, active
          assert active["generation_id"] == "eurusd-fxcm-g30-chronological-2026-q4-v1-alpha-30", active
          print("FTMO_PR491_LIVE_STABLE_CONFIG_READ=verified")
          PY

          test "$FTMO_AUTONOMOUS_CLOUD_BUDGET_USD" = "0.00"
          test -z "${FTMO_ALLOW_PAID_AWS:-}"

      - name: Persist durable proof receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-evidence
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          payload = {
              "schema_version": 1,
              "project": "ftmo",
              "pull_request": 491,
              "target_sha": os.environ["TARGET_SHA"],
              "expected_main_sha": os.environ["EXPECTED_MAIN_SHA"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "runner": os.environ.get("RUNNER_NAME", ""),
              "host": "vps-bb300bba",
              "result": "success",
              "scope": [
                  "exact-pr-head-and-main",
                  "descriptor-bound-published-file-read",
                  "descriptor-bound-research-state-publication",
                  "stable-root-symlink-rejection",
                  "immutable-evidence-conflict-seal",
                  "live-generation30-config-read",
                  "zero-cost-workflow-boundary",
              ],
              "paid_cloud_budget_usd": "0.00",
              "research_outcomes_accessed": False,
              "walk_forward_accessed": False,
              "final_holdout_accessed": False,
              "live_or_broker_access_opened": False,
          }
          Path("runtime-evidence/ftmo-pr491-research-sync-proof.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime-evidence/ftmo-pr491-research-sync-proof.json
          git commit -m "Record FTMO PR491 research-state sync proof $GITHUB_RUN_ID"
          git push origin HEAD:main

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/ftmo-pr491-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"             "$RUNNER_TEMP/ftmo-pr491-venv-$GITHUB_RUN_ID"
