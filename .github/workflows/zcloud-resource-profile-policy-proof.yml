name: zCloud resource profile policy proof

on:
  pull_request:
    paths:
      - resource-profile-policy.v1.json
      - scripts/zcloud_resource_profile_policy.py
      - tests/test_resource_profile_policy.py
      - docs/resource-profile-policy.md
      - .github/workflows/zcloud-resource-profile-policy-proof.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zcloud-resource-profile-policy-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  permanent-vps-proof:
    if: ${{ github.event_name != 'pull_request' || (github.actor == 'Zennay' && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact head and permanent runner
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
          test "$(hostname)" = "vps-bb300bba"
          test "$(id -un)" = "ubuntu"
          python3 scripts/zcloud_vps_runner_guard.py --json

      - name: Run focused resource profile regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v tests.test_resource_profile_policy
          python3 scripts/zcloud_resource_profile_policy.py --require-compatible             | tee "$RUNNER_TEMP/zcloud-resource-profile-policy.json"
          grep -q '"status":"compatible"' "$RUNNER_TEMP/zcloud-resource-profile-policy.json"
          grep -q '"runtime_mutation":false' "$RUNNER_TEMP/zcloud-resource-profile-policy.json"
          echo ZCLOUD_RESOURCE_PROFILE_POLICY_VPS_GREEN=1
