name: zCloud Firefox worker tab recovery read-only probe
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/zcloud-firefox-worker-recovery-probe-20261013.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 4
    steps:
      - name: Inspect running Firefox, addon launcher, backend claims, tabs and active script evidence without mutation
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          python3 - <<'PY'
          import json,pathlib,subprocess,urllib.request,re,socket
          out=subprocess.check_output(["ps","-eo","pid=,ppid=,args="],text=True)
          rows=out.splitlines()
          main=[x for x in rows if "firefox" in x.lower() and "-start-debugger-server" in x and "contentproc" not in x]
          launcher=[x for x in rows if "web-ext" in x and "run" in x and "--source-dir" in x]
          print("FIREFOX_PROCESSES="+str(len(main)))
          print("FIREFOX_LAUNCHED_WITH_WEB_EXT="+str(bool(launcher)))
          print("FIREFOX_DEBUGGER_PORTS="+str([re.findall(r"-start-debugger-server\\s+(\\d+)",x) for x in main]))
          print("FIREFOX_PROFILE_ORIGINAL="+str(any("chatgpt-webext-profile" in x for x in main)))
          src=pathlib.Path("/home/ubuntu/snap/firefox/common/chatgpt-project-extension")
          script=src/"worker-controller-v2.js"
          manifest=src/"manifest.json"
          print("V2_ADDON_SOURCE_ON_DISK="+str(script.is_file()))
          if manifest.is_file():
            data=json.loads(manifest.read_text());print("EXTENSION_MANIFEST_VERSION="+str(data.get("version")))
          try:
            with urllib.request.urlopen("http://127.0.0.1:8765/api/runner-targets",timeout=8) as response:
              payload=json.load(response)
            rows=list((payload.get("projects") or {}).values())
            active=[r for r in rows if r.get("active")]
            ready=[r for r in rows if r.get("assignment_ready") and r.get("queue_item",{}).get("queue_id")]
            allocation=payload.get("global_allocation") or {}
            print("CONFIGURED_WORKER_COUNT="+str((payload.get("dynamic_workers") or {}).get("count")))
            print("ALLOCATION_COUNT="+str(len(allocation.get("workers") or [])))
            print("ACTIVE_WORKER_TARGET_COUNT="+str(len(active)))
            print("ASSIGNMENT_READY_COUNT="+str(len(ready)))
            print("ALLOCATED_WORKER_KEYS="+json.dumps([str(r.get("worker_key")) for r in allocation.get("workers",[])][:20]))
            print("RUNNER_TARGETS="+json.dumps([{"key":r.get("project_id"),"slot":r.get("global_worker_slot"),"ready":r.get("assignment_ready"),"active":r.get("active"),"provider":r.get("provider")} for r in rows if r.get("global_worker_slot") is not None][:20]))
          except Exception as e:print("RUNNER_TARGET_READ_ERROR="+type(e).__name__+":"+str(e)[:150])
          ports=[int(k) for row in main for k in re.findall(r"-start-debugger-server\\s+(\\d+)",row)]
          if len(ports)!=1:
            print("RDP_SKIPPED=port-not-unique")
          else:
            try:
              sock=socket.create_connection(("127.0.0.1",ports[0]),timeout=4)
              sock.settimeout(6)
              def recv():
                buf=b""
                while True:
                  c=sock.recv(1)
                  if c==b":":break
                  if not c or not c.isdigit():raise ValueError("frame")
                  buf+=c
                n=int(buf);data=b""
                while len(data)<n:data+=sock.recv(n-len(data))
                return json.loads(data)
              def send(data):
                b=json.dumps(data).encode();sock.sendall(str(len(b)).encode()+b":"+b)
              root=recv();send({"to":root.get("from","root"),"type":"listAddons"})
              ans=recv()
              addons=[{"id":a.get("id"),"name":a.get("name")} for a in ans.get("addons",[]) if "project-runner" in str(a.get("id",""))]
              print("LIVE_PROJECT_RUNNER_ADDONS="+json.dumps(addons))
              sock.close()
            except Exception as e:print("RDP_PROBE_ERROR="+type(e).__name__+":"+str(e)[:100])
          print("READ_ONLY_NO_PROCESS_OR_TAB_MUTATION=1")
          PY
