name: zCloud deploy-ops integration readiness

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "scripts/zcloud_deploy_ops_integration_readiness.py"
      - "tests/test_deploy_ops_integration_readiness.py"
      - "tests/test_deploy_ops_integration_readiness_workflow.py"
      - ".github/workflows/zcloud-deploy-ops-integration-readiness.yml"

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Run focused readiness regressions
        run: >-
          python3 -m unittest -v
          tests.test_deploy_ops_integration_readiness
          tests.test_deploy_ops_integration_readiness_workflow

      - name: Inventory open deploy-ops PR integration readiness
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/zcloud_deploy_ops_integration_readiness.py             --repo "${{ github.repository }}"             --base "${{ github.event.repository.default_branch }}"             --format markdown | tee /tmp/zcloud-deploy-ops-readiness.md
          cat /tmp/zcloud-deploy-ops-readiness.md >> "${GITHUB_STEP_SUMMARY}"
