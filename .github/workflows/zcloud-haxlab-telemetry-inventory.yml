name: HaxLab telemetry schema inventory

on:
  pull_request:
    paths:
      - '.github/workflows/zcloud-haxlab-telemetry-inventory.yml'
      - 'tests/test_haxlab_telemetry_inventory_workflow.py'

permissions:
  contents: read

concurrency:
  group: zcloud-haxlab-telemetry-inventory-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  hosted-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify inventory workflow trust contract
        run: python3 -m unittest -v tests.test_haxlab_telemetry_inventory_workflow

  permanent-vps-inventory:
    if: github.actor == 'Zennay' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, zcloud, vps]
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify exact candidate and permanent runner
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(id -un)" = "ubuntu"
          python3 scripts/zcloud_vps_runner_guard.py --json
      - name: Inventory HaxLab telemetry schemas read-only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import sqlite3
          from pathlib import Path

          JSON_PATHS = (
              Path("/var/lib/haxlab/state/autonomy-status.json"),
              Path("/var/lib/haxlab/derived/champions/elite-player/current.json"),
              Path("/var/lib/haxlab/derived/champions/elite-player/live.json"),
              Path("/var/lib/haxlab/derived/training/elite-player-champion-candidate/pipeline-summary.json"),
          )

          def shape(value, depth=0):
              if depth >= 2:
                  return type(value).__name__
              if isinstance(value, dict):
                  return {str(k): shape(v, depth + 1) for k, v in sorted(value.items())[:80]}
              if isinstance(value, list):
                  return {"type": "list", "length": len(value), "item": shape(value[0], depth + 1) if value else None}
              return type(value).__name__

          result = {"json": {}, "sqlite": {}}
          for path in JSON_PATHS:
              entry = {"exists": path.is_file()}
              if path.is_file():
                  entry["mtime_ns"] = path.stat().st_mtime_ns
                  try:
                      entry["shape"] = shape(json.loads(path.read_text(encoding="utf-8")))
                  except Exception as exc:
                      entry["error_type"] = type(exc).__name__
              result["json"][str(path)] = entry

          db = Path("/var/lib/haxlab/state/haxlab.sqlite3")
          result["sqlite"]["path"] = str(db)
          result["sqlite"]["exists"] = db.is_file()
          if db.is_file():
              uri = f"file:{db}?mode=ro"
              with sqlite3.connect(uri, uri=True, timeout=1) as conn:
                  conn.execute("PRAGMA query_only=ON")
                  tables = [
                      row[0]
                      for row in conn.execute(
                          "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name"
                      ).fetchall()
                  ]
                  result["sqlite"]["tables"] = tables[:80]
                  columns = {}
                  for table in ("replay_analysis", "replay_processing"):
                      if table in tables:
                          columns[table] = [
                              {"name": row[1], "type": row[2]}
                              for row in conn.execute(f"PRAGMA table_info({table})").fetchall()
                          ]
                  result["sqlite"]["columns"] = columns
                  result["sqlite"]["total_changes"] = conn.total_changes
          print("HAXLAB_TELEMETRY_SCHEMA=" + json.dumps(result, sort_keys=True))
          PY
