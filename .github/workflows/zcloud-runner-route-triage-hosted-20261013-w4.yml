name: zCloud deploy-ops runner-route triage (hosted only)

on:
  push:
    branches:
      - fix/deployops-runner-route-triage-20261013-w4
    paths:
      - scripts/zcloud_runner_route_triage_20261013.py
      - tests/test_zcloud_runner_route_triage_20261013.py
      - tests/test_zcloud_runner_route_hosted_workflow_20261013.py
      - tests/test_zcloud_runner_route_http_20261013.py
      - docs/deploy-ops-runner-route-triage-20261013-w4.md
      - .github/workflows/zcloud-runner-route-triage-hosted-20261013-w4.yml

permissions:
  contents: read

jobs:
  offline-regression:
    if: github.repository == 'Zennay/zCloud'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout exact tested head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate syntax and isolated deny-first tests
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/zcloud_runner_route_triage_20261013.py tests/test_zcloud_runner_route_triage_20261013.py tests/test_zcloud_runner_route_hosted_workflow_20261013.py
          python3 -m unittest discover -s tests -p 'test_zcloud_runner_route*_20261013.py' -v
