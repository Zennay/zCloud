name: FTMO PR453 exact-head deploy-lockstep proof

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-pr453-deploy-lockstep-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ftmo-pr453-deploy-lockstep-proof
  cancel-in-progress: true

jobs:
  proof:
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 18
    env:
      TARGET_SHA: cfd62e3eccbabd0da50a5b83308768571248e996
    steps:
      - name: Fetch exact FTMO PR453 head
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          src="$RUNNER_TEMP/ftmo-pr453-proof"
          rm -rf "$src"
          gh repo clone Zennay/Ftmo "$src" -- --filter=blob:none --no-checkout >/dev/null
          git -C "$src" checkout --detach "$TARGET_SHA" >/dev/null
          test "$(git -C "$src" rev-parse HEAD)" = "$TARGET_SHA"
          echo "FTMO_PR453_EXACT_SHA=$TARGET_SHA"

      - name: Install isolated test environment
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr453-proof"
          venv="$RUNNER_TEMP/ftmo-pr453-proof-venv"
          rm -rf "$venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install -q -r "$src/requirements-ci.txt"
          "$venv/bin/python" -m pip install -q -e "$src"

      - name: Prove autonomous deploy lockstep
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr453-proof"
          venv="$RUNNER_TEMP/ftmo-pr453-proof-venv"
          cd "$src"
          "$venv/bin/python" -m pytest -q tests/test_autonomous_deploy_lockstep.py
          echo "FTMO_PR453_DEPLOY_LOCKSTEP_GREEN=1"

      - name: Prove zero-cost workflow boundary
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr453-proof"
          venv="$RUNNER_TEMP/ftmo-pr453-proof-venv"
          cd "$src"
          "$venv/bin/python" -m pytest -q \
            tests/test_zero_cost_workflow_boundary.py::test_every_repository_workflow_has_no_github_hosted_runner \
            tests/test_zero_cost_workflow_boundary.py::test_diagnostic_zero_cost_workflows_are_self_hosted_and_secret_free
          echo "FTMO_PR453_ZERO_COST_BOUNDARY_GREEN=1"
