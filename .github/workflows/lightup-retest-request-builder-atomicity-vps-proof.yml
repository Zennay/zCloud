name: LightUp retest request integrity VPS proof

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/lightup-retest-request-builder-atomicity-vps-proof.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lightup-retest-request-builder-atomicity-vps-proof
  cancel-in-progress: true

env:
  LIGHTUP_REPO: /home/ubuntu/zennay-cloud/repos/lightup
  ATOMICITY_BRANCH: chatgpt/st5-retest-request-builder-input-atomicity-20261006
  ATOMICITY_SHA: ca4a35c25c2e2b2dcb6f688051ee9d1b26282d48
  SNAPSHOT_BRANCH: chatgpt/st5-retest-request-snapshot-isolation-20261006
  SNAPSHOT_SHA: 8b188cbd66bc11ae7d38ebd9dd3cdb35c1dd8a9f
  HANDOFF_BRANCH: chatgpt/st5-retest-request-handoff-20261006
  HANDOFF_SHA: 8a79b1675b7dd7f1f758749282810e7b788bb3dd
  PARSER_BRANCH: chatgpt/st5-retest-request-parser-input-purity-20261006
  PARSER_SHA: 83336f4b2d87dc95518ece5470d09dd7ca56f5ca
  PACK_BRANCH: chatgpt/st5-retest-request-integrity-pack-20261006
  PACK_SHA: f00e1fc17039f941c17444678846ada13dbe1fe1

jobs:
  hosted:
    name: Hosted preflight Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]

    steps:
      - name: Checkout atomicity exact head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Zennay/Lightup
          ref: ${{ env.ATOMICITY_BRANCH }}
          path: atomicity
          persist-credentials: false
          clean: true

      - name: Checkout snapshot exact head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Zennay/Lightup
          ref: ${{ env.SNAPSHOT_BRANCH }}
          path: snapshot
          persist-credentials: false
          clean: true

      - name: Checkout handoff exact head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Zennay/Lightup
          ref: ${{ env.HANDOFF_BRANCH }}
          path: handoff
          persist-credentials: false
          clean: true

      - name: Checkout parser exact head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Zennay/Lightup
          ref: ${{ env.PARSER_BRANCH }}
          path: parser
          persist-credentials: false
          clean: true

      - name: Checkout promotion pack exact head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Zennay/Lightup
          ref: ${{ env.PACK_BRANCH }}
          path: pack
          persist-credentials: false
          clean: true

      - name: Guard exact heads
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C atomicity rev-parse HEAD)" = "${ATOMICITY_SHA}"
          test "$(git -C snapshot rev-parse HEAD)" = "${SNAPSHOT_SHA}"
          test "$(git -C handoff rev-parse HEAD)" = "${HANDOFF_SHA}"
          test "$(git -C parser rev-parse HEAD)" = "${PARSER_SHA}"
          test "$(git -C pack rev-parse HEAD)" = "${PACK_SHA}"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Prove exact heads hosted
        shell: bash
        run: |
          set -euo pipefail

          prove_tree() {
            tree="$1"
            module="$2"
            (
              cd "${tree}"
              export PYTHONPATH=src:tests
              python -m compileall -q src tests
              python -m unittest -v "${module}" test_future_security_retest_request
              python -m unittest discover -s tests -v
              python -m unittest discover -s tests/integration -v
              PYTHONPATH=src python scripts/check_safety_canaries.py
            )
          }

          prove_tree atomicity test_future_security_retest_request_builder_input_atomicity
          prove_tree snapshot test_future_security_retest_request_snapshot_isolation
          prove_tree handoff test_future_security_retest_request_handoff
          prove_tree parser test_future_security_retest_request_parser_input_purity
          prove_tree pack test_future_security_retest_request_handoff

  prove:
    name: Retest request integrity exact-head proof
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == github.repository_owner)
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 50

    steps:
      - name: Checkout exact zCloud proof harness
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          clean: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Guard permanent VPS runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          python3 scripts/zcloud_vps_runner_guard.py --json

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prove exact heads on Python 3.11
        shell: bash
        run: |
          set -euo pipefail

          prove_head() {
            label="$1"
            branch="$2"
            expected="$3"
            module="$4"
            remote_ref="refs/remotes/origin/lightup-${label}-proof-${GITHUB_RUN_ID}"
            snapshot="${RUNNER_TEMP}/lightup-${label}-py311-${GITHUB_RUN_ID}"

            git -C "${LIGHTUP_REPO}" fetch --prune origin               "+refs/heads/${branch}:${remote_ref}"
            actual="$(git -C "${LIGHTUP_REPO}" rev-parse "${remote_ref}^{commit}")"
            test "${actual}" = "${expected}"

            rm -rf "${snapshot}"
            mkdir -p "${snapshot}"
            git -C "${LIGHTUP_REPO}" archive "${actual}" | tar -x -C "${snapshot}"

            (
              cd "${snapshot}"
              export PYTHONPATH=src:tests
              python -m compileall -q src tests
              python -m unittest -v "${module}" test_future_security_retest_request
              python -m unittest discover -s tests -v
              python -m unittest discover -s tests/integration -v
              PYTHONPATH=src python scripts/check_safety_canaries.py
            )
            rm -rf "${snapshot}"
          }

          prove_head atomicity "${ATOMICITY_BRANCH}" "${ATOMICITY_SHA}"             test_future_security_retest_request_builder_input_atomicity
          prove_head snapshot "${SNAPSHOT_BRANCH}" "${SNAPSHOT_SHA}"             test_future_security_retest_request_snapshot_isolation
          prove_head handoff "${HANDOFF_BRANCH}" "${HANDOFF_SHA}"             test_future_security_retest_request_handoff
          prove_head parser "${PARSER_BRANCH}" "${PARSER_SHA}"             test_future_security_retest_request_parser_input_purity
          prove_head pack "${PACK_BRANCH}" "${PACK_SHA}"             test_future_security_retest_request_handoff

      - name: Setup Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Prove exact heads on Python 3.14
        shell: bash
        run: |
          set -euo pipefail

          prove_head() {
            label="$1"
            branch="$2"
            expected="$3"
            module="$4"
            remote_ref="refs/remotes/origin/lightup-${label}-proof-${GITHUB_RUN_ID}"
            snapshot="${RUNNER_TEMP}/lightup-${label}-py314-${GITHUB_RUN_ID}"

            git -C "${LIGHTUP_REPO}" fetch --prune origin               "+refs/heads/${branch}:${remote_ref}"
            actual="$(git -C "${LIGHTUP_REPO}" rev-parse "${remote_ref}^{commit}")"
            test "${actual}" = "${expected}"

            rm -rf "${snapshot}"
            mkdir -p "${snapshot}"
            git -C "${LIGHTUP_REPO}" archive "${actual}" | tar -x -C "${snapshot}"

            (
              cd "${snapshot}"
              export PYTHONPATH=src:tests
              python -m compileall -q src tests
              python -m unittest -v "${module}" test_future_security_retest_request
              python -m unittest discover -s tests -v
              python -m unittest discover -s tests/integration -v
              PYTHONPATH=src python scripts/check_safety_canaries.py
            )
            rm -rf "${snapshot}"
          }

          prove_head atomicity "${ATOMICITY_BRANCH}" "${ATOMICITY_SHA}"             test_future_security_retest_request_builder_input_atomicity
          prove_head snapshot "${SNAPSHOT_BRANCH}" "${SNAPSHOT_SHA}"             test_future_security_retest_request_snapshot_isolation
          prove_head handoff "${HANDOFF_BRANCH}" "${HANDOFF_SHA}"             test_future_security_retest_request_handoff
          prove_head parser "${PARSER_BRANCH}" "${PARSER_SHA}"             test_future_security_retest_request_parser_input_purity
          prove_head pack "${PACK_BRANCH}" "${PACK_SHA}"             test_future_security_retest_request_handoff

      - name: Write exact-head receipt
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/lightup-retest-request-integrity-receipt"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "schema_version": 1,
              "project": "LightUp",
              "result": "success",
              "host": os.uname().nodename,
              "github_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "python": ["3.11", "3.14"],
              "heads": {
                  "builder_input_atomicity": {
                      "branch": os.environ["ATOMICITY_BRANCH"],
                      "sha": os.environ["ATOMICITY_SHA"],
                      "issue": 356,
                  },
                  "snapshot_isolation": {
                      "branch": os.environ["SNAPSHOT_BRANCH"],
                      "sha": os.environ["SNAPSHOT_SHA"],
                      "issue": 357,
                  },
                  "strict_persisted_handoff": {
                      "branch": os.environ["HANDOFF_BRANCH"],
                      "sha": os.environ["HANDOFF_SHA"],
                      "issue": 359,
                  },
                  "strict_parser_input_purity": {
                      "branch": os.environ["PARSER_BRANCH"],
                      "sha": os.environ["PARSER_SHA"],
                      "issue": 363,
                  },
                  "promotion_pack": {
                      "branch": os.environ["PACK_BRANCH"],
                      "sha": os.environ["PACK_SHA"],
                      "base": "e44abdc141ea21e3298894238bd14c62e0c1227f",
                  },
              },
              "proof": [
                  "exact-sha-binding",
                  "dedicated-regressions-py311-py314",
                  "parent-retest-request-regressions-py311-py314",
                  "compile-py311-py314",
                  "full-unit-suite-py311-py314",
                  "real-producer-integration-py311-py314",
                  "safety-canaries-py311-py314",
              ],
          }
          path = Path(os.environ["RUNNER_TEMP"]) / "lightup-retest-request-integrity-receipt" / "receipt.json"
          path.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n")
          print(json.dumps(payload, sort_keys=True))
          PY

      - name: Upload exact-head receipt
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lightup-retest-request-integrity-vps-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/lightup-retest-request-integrity-receipt/receipt.json
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup residual snapshots
        if: always()
        shell: bash
        run: rm -rf "${RUNNER_TEMP}"/lightup-{atomicity,snapshot,handoff,parser,pack}-py{311,314}-${GITHUB_RUN_ID}
