# manual all-worker recovery follow-up 2026-10-06 23:05 Europe/Amsterdam
name: Recover pending zCloud workers

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/recover-pending-workers.yml
      - tests/test_recover_pending_workers_workflow.py
  push:
    branches: [main]
    paths:
      - .github/workflows/recover-pending-workers.yml
      - tests/test_recover_pending_workers_workflow.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recover-pending-zcloud-workers-${{ github.event_name == 'pull_request' && github.ref || 'live' }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPECTED_ZCLOUD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact zCloud candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.EXPECTED_ZCLOUD_SHA }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact zCloud candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_ZCLOUD_SHA"

      - name: Validate recover-pending workflow trust contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v tests.test_recover_pending_workers_workflow

  recover:
    if: github.event_name != 'pull_request' && github.repository == 'Zennay/zCloud' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 6
    env:
      EXPECTED_ZCLOUD_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact zCloud revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.EXPECTED_ZCLOUD_SHA }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify permanent VPS runner and exact revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_ZCLOUD_SHA"
          test "$(id -un)" = "ubuntu"
          python3 scripts/zcloud_vps_runner_guard.py --json

      - name: Inspect allocation and recover inactive workers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,time,urllib.request
          BASE="http://127.0.0.1:8765"

          def call(method,path,payload=None,retries=8):
              last=None
              for attempt in range(retries):
                  try:
                      body=None
                      headers={"User-Agent":"zcloud-recover-pending-workers/1"}
                      if payload is not None:
                          body=json.dumps(payload).encode()
                          headers["Content-Type"]="application/json"
                      req=urllib.request.Request(BASE+path,data=body,headers=headers,method=method)
                      with urllib.request.urlopen(req,timeout=15) as r:
                          return json.load(r)
                  except Exception as exc:
                      last=exc
                      time.sleep(min(2+attempt,8))
              raise RuntimeError(f"{method} {path} unavailable: {last}")

          targets=call("GET","/api/runner-targets")
          allocation=(targets.get("global_allocation") or {}).get("workers") or []
          print("TARGETS_BEFORE",json.dumps({
              "dynamic_workers":targets.get("dynamic_workers"),
              "allocation":allocation,
              "projects":targets.get("projects"),
          },sort_keys=True))

          if not allocation:
              raise SystemExit("no allocated workers")

          recovered=[]
          for item in allocation:
              key=str(item.get("worker_key") or "").strip()
              if not key:
                  base=str(item.get("project_id") or "").strip()
                  key=f"{base}::w{int(item.get('worker_slot') or 1)}"
              project=(targets.get("projects") or {}).get(key) or {}
              if bool(project.get("active")):
                  continue
              start=call("POST","/api/runner-control",{"project_id":key,"action":"start"})
              time.sleep(2)
              fresh=call("GET","/api/runner-targets")
              project=(fresh.get("projects") or {}).get(key) or {}
              if not bool(project.get("active")):
                  newchat=call("POST","/api/runner-control",{"project_id":key,"action":"new_chat"})
                  recovered.append({"worker":key,"start":start,"new_chat":newchat})
              else:
                  recovered.append({"worker":key,"start":start,"new_chat":None})
          print("RECOVERY_COMMANDS",json.dumps(recovered,sort_keys=True))

          final=None
          for _ in range(18):
              time.sleep(5)
              final=call("GET","/api/runner-targets")
              projects=final.get("projects") or {}
              active=[]
              for item in allocation:
                  key=str(item.get("worker_key") or "").strip()
                  if not key:
                      base=str(item.get("project_id") or "").strip()
                      key=f"{base}::w{int(item.get('worker_slot') or 1)}"
                  if bool((projects.get(key) or {}).get("active")):
                      active.append(key)
              print("ACTIVE_CHECK",json.dumps({"active":active,"needed":len(allocation)},sort_keys=True))
              if len(active)==len(allocation):
                  print("WORKERS_ACTIVE",json.dumps({
                      "workers":active,
                      "allocation":final.get("global_allocation"),
                      "dynamic_workers":final.get("dynamic_workers"),
                  },sort_keys=True))
                  raise SystemExit(0)

          print("TARGETS_FINAL",json.dumps(final,sort_keys=True))
          raise SystemExit("not all allocated workers became active")
          PY
          echo "ZCLOUD_RECOVER_PENDING_WORKERS_GREEN=1"
