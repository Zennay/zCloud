name: zCloud external dashboard triage (manual, hosted, read-only)

# This observer is not a replacement for privileged recovery or deployment.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe:
    # Do not let a fork, non-owner actor or feature branch probe production.
    if: github.repository == 'Zennay/zCloud' && github.actor == 'Zennay' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout immutable canonical main commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, immutable
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Classify externally observed dashboard API health
        shell: bash
        env:
          # Ephemeral read-only Actions token: works for private repositories.
          # Never persist credentials in checkout or print the token.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Reject a manual main dispatch whose pinned SHA is no longer current.
          verify_main_head() {
            local observed
            [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || {
              echo "DASHBOARD_TRIAGE_INVALID_EVENT_SHA"
              return 2
            }
            # Read-only GitHub REST via the workflow's contents:read token.
            # Unlike anonymous ls-remote this also works in private repos.
            observed="$(GH_HOST=github.com GH_PROMPT_DISABLED=1 timeout -k 2s 12s gh api --method GET repos/Zennay/zCloud/git/ref/heads/main --jq '.object.sha' 2>/dev/null)" || {
              echo "DASHBOARD_TRIAGE_MAIN_UNVERIFIABLE"
              return 2
            }
            [[ "$observed" =~ ^[0-9a-f]{40}$ ]] || {
              echo "DASHBOARD_TRIAGE_MAIN_UNVERIFIABLE"
              return 2
            }
            [[ "$observed" == "$GITHUB_SHA" ]] || {
              echo "DASHBOARD_TRIAGE_MAIN_CHANGED"
              return 2
            }
          }
          verify_main_head
          summary_file="$(mktemp)"
          verified_file="$(mktemp)"
          trap 'rm -f "$summary_file" "$verified_file"' EXIT
          probe_rc=0
          # Socket read timeout only protects individual waits. Slow-drip HTTP
          # streams must also be bounded by one process-wide wall-clock budget.
          env -i PATH=/usr/local/bin:/usr/bin:/bin LANG=C.UTF-8 TZ=UTC timeout -k 2s 115s python3 scripts/zcloud_dashboard_external_probe_20261013_w1.py --attempts 6 --format markdown > "$summary_file" || probe_rc=$?
          # GNU timeout exit 124 is a strict wall-clock failure, never green.
          # Replace any partial output with a short, constant private-safe note.
          if (( probe_rc == 124 )); then
            printf '## zCloud · externe dashboardcontrole\n\n**Status:** API niet aantoonbaar bereikbaar\n**Reden:** totale tijdslimiet overschreden\n**Herstel of herstart wordt nooit automatisch uitgevoerd.**\n' > "$summary_file"
          fi
          # Verify freshness before releasing ANY summary, including failures.
          verify_main_head
          # Strict, bounded offline gate reconstructs the COMPLETE canonical
          # human report from allowed status categories/counts. No arbitrary
          # probe output reaches Actions summaries; malformed output stays private.
          if ! python3 scripts/zcloud_dashboard_summary_guard_20261014_w1.py --probe-rc "$probe_rc" < "$summary_file" > "$verified_file"; then
            echo "DASHBOARD_TRIAGE_SUMMARY_REJECTED"
            exit 3
          fi
          # A branch may move WHILE the sanitizer validates its input. Deny
          # publication unless canonical main remains pinned at the final
          # observable boundary immediately before writing the job summary.
          verify_main_head
          # Attach trusted immutable main identity AFTER canonical report
          # admission, so an operator can correlate a copied receipt with
          # the exact tested source. Never allow endpoint text to set the SHA.
          { cat "$verified_file"; printf '\n**Getoetste main-commit:** `%s`\n' "$GITHUB_SHA"; } | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$probe_rc"
