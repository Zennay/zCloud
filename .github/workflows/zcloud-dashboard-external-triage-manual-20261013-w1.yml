name: zCloud external dashboard triage (manual, hosted, read-only)

# This observer is not a replacement for privileged recovery or deployment.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe:
    # Do not let a fork, non-owner actor or feature branch probe production.
    if: github.repository == 'Zennay/zCloud' && github.actor == 'Zennay' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout immutable canonical main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Classify externally observed dashboard API health
        shell: bash
        run: |
          set -euo pipefail
          # Reject a manual main dispatch whose pinned SHA is no longer current.
          verify_main_head() {
            local observed ref
            [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || {
              echo "DASHBOARD_TRIAGE_INVALID_EVENT_SHA"
              return 2
            }
            ref="$(GIT_TERMINAL_PROMPT=0 timeout -k 2s 12s git ls-remote --exit-code https://github.com/Zennay/zCloud.git refs/heads/main)" || {
              echo "DASHBOARD_TRIAGE_MAIN_UNVERIFIABLE"
              return 2
            }
            [[ "$ref" =~ ^[0-9a-f]{40}[[:space:]]refs/heads/main$ ]] || {
              echo "DASHBOARD_TRIAGE_MAIN_UNVERIFIABLE"
              return 2
            }
            observed="$(printf '%s' "$ref" | cut -c1-40)"
            [[ "$observed" == "$GITHUB_SHA" ]] || {
              echo "DASHBOARD_TRIAGE_MAIN_CHANGED"
              return 2
            }
          }
          verify_main_head
          summary_file="$(mktemp)"
          trap 'rm -f "$summary_file"' EXIT
          probe_rc=0
          # Socket read timeout only protects individual waits. Slow-drip HTTP
          # streams must also be bounded by one process-wide wall-clock budget.
          timeout -k 2s 115s python3 scripts/zcloud_dashboard_external_probe_20261013_w1.py --attempts 6 --format markdown > "$summary_file" || probe_rc=$?
          # GNU timeout exit 124 is a strict wall-clock failure, never green.
          # Replace any partial output with a short, constant private-safe note.
          if (( probe_rc == 124 )); then
            printf '## zCloud · externe dashboardcontrole\n\n**Status:** API niet aantoonbaar bereikbaar\n**Reden:** totale tijdslimiet overschreden\n**Herstel of herstart wordt nooit automatisch uitgevoerd.**\n' > "$summary_file"
          fi
          # Verify freshness before releasing ANY summary, including failures.
          verify_main_head
          # A zero exit code with no recognized result must not be a green job.
          [[ -s "$summary_file" && $(wc -c < "$summary_file") -le 2048 ]] || {
            echo "DASHBOARD_TRIAGE_INVALID_SUMMARY"
            exit 3
          }
          grep -Fxq '## zCloud · externe dashboardcontrole' "$summary_file" || {
            echo "DASHBOARD_TRIAGE_INVALID_SUMMARY"
            exit 3
          }
          if (( probe_rc == 0 )); then
            grep -Fxq '**Status:** API bereikbaar' "$summary_file" || {
              echo "DASHBOARD_TRIAGE_INCONSISTENT_SUCCESS"
              exit 3
            }
          else
            grep -Fxq '**Status:** API niet aantoonbaar bereikbaar' "$summary_file" || {
              echo "DASHBOARD_TRIAGE_INVALID_FAILURE_SUMMARY"
              exit 3
            }
          fi
          cat "$summary_file" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$probe_rc"
