name: FTMO PR408 exact provider-boundary proof

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-pr408-exact-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ftmo-pr408-exact-provider-boundary
  cancel-in-progress: true

jobs:
  prove:
    runs-on: self-hosted
    timeout-minutes: 12
    env:
      TARGET_SHA: 3a262842a58366a77a8b8a6ccb88cd3ed7e94e9b
    steps:
      - name: Verify VPS and exact PR408 head
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          src="$RUNNER_TEMP/ftmo-pr408-proof"
          rm -rf "$src"
          gh repo clone Zennay/Ftmo "$src" -- --filter=blob:none --no-checkout >/dev/null
          git -C "$src" checkout --detach "$TARGET_SHA" >/dev/null
          test "$(git -C "$src" rev-parse HEAD)" = "$TARGET_SHA"
          echo "FTMO_PR408_EXACT_SHA=$TARGET_SHA"

      - name: Install isolated test environment
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr408-proof"
          venv="$RUNNER_TEMP/ftmo-pr408-venv"
          rm -rf "$venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install -q -r "$src/requirements-ci.txt"
          "$venv/bin/python" -m pip install -q -e "$src"

      - name: Compile provider-foundation boundary
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr408-proof"
          venv="$RUNNER_TEMP/ftmo-pr408-venv"
          cd "$src"
          "$venv/bin/python" -m compileall -q             src/prop_trading_ai/ops/autonomous_rollover.py
          echo "FTMO_PR408_COMPILE_GREEN=1"

      - name: Prove zero-paid-cloud provider subprocess boundary
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr408-proof"
          venv="$RUNNER_TEMP/ftmo-pr408-venv"
          cd "$src"
          "$venv/bin/python" -m pytest -q             tests/test_autonomous_provider_retry.py             tests/test_autonomous_deploy_lockstep.py             tests/test_zero_cost_workflow_boundary.py
          echo "FTMO_PR408_PROVIDER_BOUNDARY_GREEN=1"
