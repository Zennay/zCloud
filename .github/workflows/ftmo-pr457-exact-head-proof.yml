name: FTMO PR457 exact-head provider provenance proof

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-pr457-exact-head-proof.yml"

permissions:
  contents: read

jobs:
  proof:
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 18
    env:
      TARGET_SHA: 16d758c5dad6c2ada93e327c895ca2f57c1a186a
      FTMO_AUTONOMOUS_CLOUD_BUDGET_USD: "0.00"
      FTMO_ALLOW_PAID_AWS: ""
    steps:
      - name: Check out exact FTMO PR457 head
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          src="$RUNNER_TEMP/ftmo-pr457-zcloud-proof"
          rm -rf "$src"
          gh repo clone Zennay/Ftmo "$src" -- --filter=blob:none --no-checkout >/dev/null
          git -C "$src" checkout --detach "$TARGET_SHA" >/dev/null
          test "$(git -C "$src" rev-parse HEAD)" = "$TARGET_SHA"
          echo "FTMO_PR457_EXACT_SHA=$TARGET_SHA"
      - name: Build isolated test environment
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr457-zcloud-proof"
          venv="$RUNNER_TEMP/ftmo-pr457-zcloud-venv"
          rm -rf "$venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install -q -r "$src/requirements-ci.txt"
          "$venv/bin/python" -m pip install -q -e "$src"
      - name: Prove provider provenance package
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr457-zcloud-proof"
          venv="$RUNNER_TEMP/ftmo-pr457-zcloud-venv"
          cd "$src"
          "$venv/bin/python" -m compileall -q             src/prop_trading_ai/research/provider_validation.py             src/prop_trading_ai/research/provider_gate.py             src/prop_trading_ai/cli/v1_validate_secondary_feed.py
          "$venv/bin/python" -m pytest -q             tests/test_provider_validation.py             tests/test_provider_validation_json_integrity.py             tests/test_provider_gate_public_dukascopy.py             tests/test_secondary_feed_cli.py             tests/test_provider_foundation_publication.py             tests/test_autonomous_provider_retry.py             tests/test_autonomous_deploy_lockstep.py             tests/test_zero_cost_workflow_boundary.py
          echo "FTMO_PR457_ZCLOUD_PROOF_GREEN=1"
