name: zCloud deploy-ops secret-log exposure no-new-debt

on:
  pull_request:
    branches: [main]

# Advisory source-only check; never authorizes VPS/production/queue mutation.
permissions:
  contents: read

concurrency:
  group: zcloud-secret-log-ratchet-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  trusted-identity:
    name: Verify same-repository main-target source
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Reject untrusted pull-request provenance before source checkout
        shell: bash
        env:
          CURRENT_REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          test "$CURRENT_REPOSITORY" = Zennay/zCloud
          test "$HEAD_REPOSITORY" = "$CURRENT_REPOSITORY"
          test "$BASE_REPOSITORY" = "$CURRENT_REPOSITORY"
          test "$BASE_BRANCH" = main

  deny-new-exposure:
    name: No new secret or environment log exposure
    needs: trusted-identity
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check out exact immutable PR head without persisted token
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
          clean: true
      - name: Validate source identity and current main before execution
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$HEAD_SHA^{commit}"
          remote_main="$(timeout 15 git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          test "$remote_main" = "$BASE_SHA"
      - name: Test fail-closed log exposure ratchet
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/zcloud_secret_log_exposure_ratchet_20261015_w1.py tests/test_zcloud_secret_log_exposure_ratchet_20261015_w1.py
          python3 -m unittest -v tests.test_zcloud_secret_log_exposure_ratchet_20261015_w1
      - name: Deny new secret-log exposure on exact head and current main
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          python3 scripts/zcloud_secret_log_exposure_ratchet_20261015_w1.py --base "$BASE_SHA" --head "$HEAD_SHA"
          remote_main="$(timeout 15 git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          test "$remote_main" = "$BASE_SHA"
          echo "Production mutation authorized: false"
