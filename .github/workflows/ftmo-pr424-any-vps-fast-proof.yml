name: FTMO PR424 any-VPS fast proof

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-pr424-any-vps-fast-proof.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ftmo-pr424-any-vps-fast-proof
  cancel-in-progress: false

jobs:
  proof:
    runs-on: self-hosted
    timeout-minutes: 12
    env:
      TARGET_SHA: 442d904827e7516afa700373850aebcc8ce9ed98
      RECEIPT_PATH: runtime-evidence/ftmo-pr424-any-vps-fast-proof.json
    steps:
      - name: Checkout zCloud receipt workspace
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - name: Fetch exact FTMO PR424 head
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          src="$RUNNER_TEMP/ftmo-pr424-any-vps"
          rm -rf "$src"
          gh repo clone Zennay/Ftmo "$src" -- --filter=blob:none --no-checkout >/dev/null
          git -C "$src" checkout --detach "$TARGET_SHA" >/dev/null
          test "$(git -C "$src" rev-parse HEAD)" = "$TARGET_SHA"
      - name: Install isolated test environment
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr424-any-vps"
          venv="$RUNNER_TEMP/ftmo-pr424-any-vps-venv"
          rm -rf "$venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install -q -r "$src/requirements-ci.txt"
          "$venv/bin/python" -m pip install -q -e "$src"
      - name: Prove changed surface and safety boundaries
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr424-any-vps"
          venv="$RUNNER_TEMP/ftmo-pr424-any-vps-venv"
          cd "$src"
          "$venv/bin/python" -m compileall -q src/prop_trading_ai/data/market/providers/dukascopy_jetta.py
          "$venv/bin/python" -m pytest -q \
            tests/test_dukascopy_jetta.py \
            tests/test_autonomous_provider_retry.py \
            tests/test_zero_cost_workflow_boundary.py::test_every_repository_workflow_has_no_github_hosted_runner \
            tests/test_zero_cost_workflow_boundary.py::test_diagnostic_zero_cost_workflows_are_self_hosted_and_secret_free
      - name: Record fast-proof receipt
        if: always()
        shell: bash
        env:
          PROOF_STATUS: ${{ job.status }}
          PROOF_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          git pull --rebase origin main
          mkdir -p "$(dirname "$RECEIPT_PATH")"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          payload = {
              "project": "ftmo",
              "pull_request": 424,
              "target_sha": os.environ["TARGET_SHA"],
              "workflow_run_id": int(os.environ["PROOF_RUN_ID"]),
              "result": os.environ["PROOF_STATUS"],
              "runner_required": "vps-bb300bba",
              "proof_scope": "compile + Jetta tests + provider retry + zero-cost registry",
          }
          Path(os.environ["RECEIPT_PATH"]).write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
          git config user.name "zCloud FTMO proof"
          git config user.email "zcloud-ftmo-proof@users.noreply.github.com"
          git add "$RECEIPT_PATH"
          if ! git diff --cached --quiet; then
            git commit -m "Record FTMO PR424 any-VPS fast proof"
            git push origin HEAD:main
          fi
