name: zSentinel owner-confirmed VPS read-only audit

on:
  workflow_dispatch:
    inputs:
      confirm_sha:
        description: "Paste exact current main commit SHA before using the permanent VPS runner"
        required: true
        type: string
      inspect_external_archive:
        description: "Optional read-only cross-project cold-data archive hints; no transfer"
        required: false
        type: boolean
        default: false
      inspect_sqlite_space:
        description: "Optional metadata-only SQLite/WAL owner receipt, no SQL or cleanup"
        required: false
        type: boolean
        default: false
      window:
        description: "Read-only portfolio window (auto rotates)"
        required: false
        type: choice
        default: auto
        options:
          - auto
          - "0"
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"

# Explicit owner-only manual event; never execute pull request source on VPS.
permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read
  checks: read
  statuses: read

concurrency:
  group: zsentinel-readonly-vps
  cancel-in-progress: false

jobs:
  audit:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'Zennay/zCloud' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'Zennay' &&
      github.triggering_actor == 'Zennay' &&
      github.run_attempt == 1
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 8
    env:
      CONFIRMED_SHA: ${{ inputs.confirm_sha }}
      QUEUE_DB: /home/ubuntu/zennay-cloud/history.db
      WORKER_EVENTS_DB: /home/ubuntu/zennay-cloud/history.db
      SOURCE_WINDOW: ${{ inputs.window || 'auto' }}
    steps:
      - name: Checkout canonical event SHA without persistent credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          clean: true
          fetch-depth: 1

      - name: Enforce built-in VPS runner identity before other source code
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/zcloud_vps_runner_guard.py --json

      - name: Confirm exact owner-pinned current main before invoking zSentinel
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Zennay/zCloud"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_ACTOR" = "Zennay"
          test "$RUNNER_NAME" = "zcloud-vps-1"
          test "$(hostname -s)" = "vps-bb300bba"
          [[ "$CONFIRMED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$CONFIRMED_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_main="$(git ls-remote --exit-code https://github.com/Zennay/zCloud.git refs/heads/main | cut -f1)"
          test "$remote_main" = "$GITHUB_SHA"

      - name: Observe memory load and actual existing SQLite without writes
        id: capacity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os, pathlib, stat
          queue = pathlib.Path(os.environ["QUEUE_DB"])
          info = queue.lstat()
          if not stat.S_ISREG(info.st_mode) or info.st_size < 4096:
              raise SystemExit("DENY_NO_EXISTING_QUEUE_SQLITE")
          if os.environ.get("SOURCE_WINDOW") not in {"auto", "0", "1", "2", "3", "4", "5"}:
              raise SystemExit("DENY_INVALID_PORTFOLIO_WINDOW")
          available = 0
          for line in pathlib.Path("/proc/meminfo").read_text().splitlines():
              if line.startswith("MemAvailable:"):
                  available = int(line.split()[1]) * 1024
                  break
          load = os.getloadavg()[0]
          cores = os.cpu_count() or 1
          safe = available >= 1536 * 1024 ** 2 and load <= cores * 2.5
          print("run=" + str(safe).lower())
          print("capacity=" + ("admitted" if safe else "deferred_no_healthy_headroom"))
          PY

      - name: Report capacity deferral without changing any active worker
        if: steps.capacity.outputs.run != 'true'
        shell: bash
        run: |
          echo 'zSentinel source observation DEFERRED: high load or low available RAM.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No worker/queue claim, restart, retry, deploy or issue resolution occurred.' >> "$GITHUB_STEP_SUMMARY"

      - name: Produce private bounded queue and GitHub operator summary
        if: steps.capacity.outputs.run == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Runner context exists only after job scheduling, not in jobs.audit.env.
          REPORT_PATH: ${{ runner.temp }}/zsentinel-audit-${{ github.run_id }}-${{ github.run_attempt }}.json
        run: |
          set -euo pipefail
          # This exact new, runner-temp, per-run report is the only output file.
          trap 'rm -f -- "$REPORT_PATH"' EXIT
          python3 scripts/zsentinel_portfolio_overview.py \
            --database "$QUEUE_DB" \
            --worker-events-database "$WORKER_EVENTS_DB" \
            --window "$SOURCE_WINDOW" \
            --observe-local-runner \
            --observe-vps-capacity \
            --discover-open-prs \
            --inspect-referenced-prs \
            --format json \
            --output "$REPORT_PATH"
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          with open(os.environ["REPORT_PATH"], encoding="utf-8") as source:
              report = json.load(source)
          portfolio = report["portfolio"]
          board = report["blocker_first_handoff"]
          local_runner = report["local_runner_observation"]
          if local_runner is None or local_runner.get("source") != "local_proc_bounded_no_credentials":
              raise SystemExit("DENY_MISSING_LOCAL_RUNNER_SOURCE")
          print("## zSentinel on zcloud-vps-1 (read-only)")
          print("Exact source SHA: " + os.environ["GITHUB_SHA"][:12])
          print("Fresh observed incidents: " + str(board["live_incident_observations"]))
          print("Owner-only P0/P1 issues: " + str(board["owner_only_open_issue_observations"]))
          print("Worker progress observations: " + str(board["worker_event_gap_observations"]))
          print("Existing PR gates: " + str(board["existing_pr_gate_observations"]))
          print("Historical unreconciled items: " + str(board["historical_not_reconciled"]))
          print("Canonical project count: " + str(portfolio["canonical_projects"]))
          print("Live VPS listener processes seen: " + str(local_runner["listener_processes_observed"]))
          print("Live VPS worker processes seen: " + str(local_runner["worker_processes_observed"]))
          print("Local process coverage complete: " + str(local_runner["process_inventory_complete"]))
          print("Local process evidence does NOT prove runner job assignment, safe idle or recovery.")
          print("No claims/leases changed, runner restarted, workflows dispatched or production deployed.")
          print("Source selection is bounded and does not prove all workers healthy.")
          PY

      - name: Optional SQLite and WAL disk capacity receipt, no SQL or cleanup
        if: steps.capacity.outputs.run == 'true' && inputs.inspect_sqlite_space == true
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          from pathlib import Path
          from zsentinel_sqlite_footprint import observe_many
          result = observe_many(Path("/home/ubuntu/zennay-cloud"), ["history.db"])
          if (result.get("checkpoint_or_database_write") is not False
                  or result.get("reclaimable_bytes_verified") is not False
                  or result.get("cleanup_performed") is not False
                  or len(result.get("reports", [])) != 1):
              raise SystemExit("DENY_UNTRUSTED_SQLITE_SPACE_SOURCE")
          row = result["reports"][0]
          wal = row.get("wal_sidecar")
          if (row.get("cleanup_performed") is not False
                  or row.get("queue_claims_changed") is not False
                  or not isinstance(wal, dict)
                  or wal.get("coverage") == "unsafe_nonregular_or_other_mount"):
              raise SystemExit("DENY_UNTRUSTED_SQLITE_METADATA")
          def mib(n):
              return "unknown" if type(n) is not int or n < 0 else str(round(n / 1048576, 1))
          print("### zSentinel · SQLite disk footprint (metadata only)")
          print("Database allocated MiB: " + mib(row["database_allocated_bytes"]))
          print("WAL file size MiB: " + mib(wal["size_bytes"]))
          print("Checkpoint-header coverage: " + row["checkpoint_header_coverage"])
          print("Internal freelist MiB (NOT safely reclaimable proof): " +
                mib(row["checkpoint_freelist_bytes_not_reclaim_proof"]))
          print("No paths/records, SQL, DB write, checkpoint, reclaim, restart or claim mutation.")
          print("Verify writer leases, backup and storage headroom before owner-approved maintenance.")
          PY

      - name: Optional external archive cold-data receipt, no files transferred
        if: steps.capacity.outputs.run == 'true' && inputs.inspect_external_archive == true
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          from pathlib import Path
          from zsentinel_archive_portfolio import observe_many, public_summary_portfolio
          r = observe_many([
              Path("/home/ubuntu/zennay-cloud"), Path("/home/ubuntu/Haxlab")
          ], Path("/home/ubuntu/VPS-Archief"),
              min_age_days=7, max_entries=1500, max_depth=2, max_seconds=2)
          if (r.get("files_written_or_transferred") is not False
                  or r.get("safe_archive_copy_authorized") is not False
                  or r.get("runner_or_claim_modified") is not False):
              raise SystemExit("DENY_UNTRUSTED_ARCHIVE_SOURCE")
          p = public_summary_portfolio(r)
          if p.get("files_copied_or_deleted") is not False:
              raise SystemExit("DENY_ARCHIVE_MUTATION")
          print("### zSentinel · external archive (read-only observation)")
          print("Known candidate workspaces sampled: " + str(p["observed_workspaces"]))
          print("Unavailable candidate workspaces: " + str(p["unavailable_workspaces"]))
          print("Old cold-data filename hints in bounded samples (NOT approved): " +
                str(p["candidate_hints_not_approved"]))
          print("Incomplete samples, no private paths, no copy, delete, lease, worker or runner action.")
          print("Separate authorisation and source writer/rights/backup verification required.")
          PY
