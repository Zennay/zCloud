name: zCloud recovery retry offline reference validation

on:
  push:
    branches:
      - feat/deployops-retry-ledger-reference-20261013-w1
    paths:
      - '.github/workflows/zcloud-recovery-retry-reference-20261013.yml'
      - 'scripts/zcloud_recovery_retry_policy_20261013.py'
      - 'scripts/zcloud_recovery_github_evidence_20261013.py'
      - 'tests/test_zcloud_recovery_retry_policy_20261013.py'
      - 'tests/test_zcloud_recovery_github_evidence_20261013.py'
      - 'docs/deploy-ops-recovery-readonly-source-20261013.md'

permissions:
  contents: read
  actions: read
  statuses: read

jobs:
  reference-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p 'test_zcloud_recovery_retry_policy_20261013.py' -v
      - run: python3 -m unittest discover -s tests -p 'test_zcloud_recovery_github_evidence_20261013.py' -v
      - run: python3 -m py_compile scripts/zcloud_recovery_retry_policy_20261013.py scripts/zcloud_recovery_github_evidence_20261013.py

  github-observe-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Observe current production status via canonical GitHub GET only
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import sys
          sys.path.insert(0, "scripts")
          from zcloud_recovery_github_evidence_20261013 import observe
          result = observe()
          print(json.dumps(result, sort_keys=True))
          assert result["authorized"] is False
          assert result["mutations_performed"] is False
          if result["decision"] == "DENY":
              raise SystemExit(2)
          PY
