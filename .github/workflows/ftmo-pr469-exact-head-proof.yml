name: FTMO PR469 exact-head deploy lockstep proof

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-pr469-exact-head-proof.yml"

permissions:
  contents: read

jobs:
  proof:
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 20
    env:
      TARGET_SHA: 65eec5273ab1d7bad8892b20b2900c73759b8664
      TARGET_PR: "469"
      FTMO_AUTONOMOUS_CLOUD_BUDGET_USD: "0.00"
      FTMO_ALLOW_PAID_AWS: ""
    steps:
      - name: Check out exact FTMO PR469 head
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          gh auth status >/dev/null 2>&1
          src="$RUNNER_TEMP/ftmo-pr469-zcloud-proof"
          rm -rf "$src"
          gh repo clone Zennay/Ftmo "$src" -- --filter=blob:none --no-checkout >/dev/null
          git -C "$src" fetch --no-tags origin "$TARGET_SHA"
          git -C "$src" checkout --detach "$TARGET_SHA" >/dev/null
          test "$(git -C "$src" rev-parse HEAD)" = "$TARGET_SHA"
          python3 - <<'PY'
          import json, os, subprocess
          pr=json.loads(subprocess.check_output(
              ["gh","api",f"repos/Zennay/Ftmo/pulls/{os.environ['TARGET_PR']}"],
              text=True,
          ))
          if pr.get("head",{}).get("sha") != os.environ["TARGET_SHA"]:
              raise SystemExit("PR469 head moved")
          if pr.get("state") != "open":
              raise SystemExit("PR469 is not open")
          print("FTMO_PR469_EXACT_SHA="+os.environ["TARGET_SHA"])
          PY

      - name: Build isolated test environment
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr469-zcloud-proof"
          venv="$RUNNER_TEMP/ftmo-pr469-zcloud-venv"
          rm -rf "$venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install -q -r "$src/requirements-ci.txt"
          "$venv/bin/python" -m pip install -q -e "$src"

      - name: Prove canonical deploy and state-sync lockstep
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr469-zcloud-proof"
          venv="$RUNNER_TEMP/ftmo-pr469-zcloud-venv"
          cd "$src"
          "$venv/bin/python" -m py_compile src/prop_trading_ai/research/state_sync.py
          "$venv/bin/python" -m pytest -q             tests/test_autonomous_deploy_lockstep.py             tests/test_autonomous_research_state_sync.py             tests/test_research_state_sync_guard.py             tests/test_zero_cost_workflow_boundary.py
          "$venv/bin/python" -m pytest --collect-only -q >/tmp/ftmo-pr469-zcloud-collection-$GITHUB_RUN_ID.txt
          test -s /tmp/ftmo-pr469-zcloud-collection-$GITHUB_RUN_ID.txt
          test "$FTMO_AUTONOMOUS_CLOUD_BUDGET_USD" = "0.00"
          test -z "${FTMO_ALLOW_PAID_AWS:-}"
          echo "FTMO_PR469_ZCLOUD_PROOF_GREEN=1"
