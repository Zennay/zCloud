name: PR443 FTMO dedicated runner self-health proof

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-pr443-self-health-proof-20261002.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ftmo-pr443-self-health-proof-20261002
  cancel-in-progress: false

jobs:
  prove:
    runs-on: [self-hosted, ftmo-research]
    timeout-minutes: 4
    env:
      FTMO_SERVICE: actions.runner.Zennay-Ftmo.vps-bb300bba-ftmo.service
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          fetch-depth: 0
      - name: Prove current FTMO runner health without mutation
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          test "${RUNNER_NAME:-}" = "vps-bb300bba-ftmo"
          state="$(systemctl is-active "$FTMO_SERVICE" || true)"
          pid="$(systemctl show "$FTMO_SERVICE" -p MainPID --value || true)"
          result="$(systemctl show "$FTMO_SERVICE" -p Result --value || true)"
          restarts="$(systemctl show "$FTMO_SERVICE" -p NRestarts --value || true)"
          test "$state" = active
          [[ "$pid" =~ ^[1-9][0-9]*$ ]]
          test -r "/proc/$pid/cmdline"
          cmd="$(tr '\0' ' ' < "/proc/$pid/cmdline")"
          [[ "$cmd" == *"Runner.Listener"* || "$cmd" == *"runsvc.sh"* ]]
          workers="$(pgrep -u ftmo-runner -fc 'Runner\.Worker' || true)"
          oom="$( (sudo -n journalctl -k --since "-60 min" --no-pager 2>/dev/null || journalctl -k --since "-60 min" --no-pager 2>/dev/null || true) | grep -Eai 'out of memory|oom|killed process|memory cgroup' | tail -80 || true )"
          python3 - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          service=os.environ["FTMO_SERVICE"]
          def sh(cmd):
              return subprocess.check_output(["bash","-lc",cmd],text=True).strip()
          data={
              "schema_version":1,
              "queue_id":"zssh-ftmo-pr443-runner-recovery-20261002",
              "workflow_run_id":os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt":os.environ["GITHUB_RUN_ATTEMPT"],
              "runner_name":os.environ.get("RUNNER_NAME"),
              "service":service,
              "state":sh(f"systemctl is-active '{service}' || true"),
              "main_pid":sh(f"systemctl show '{service}' -p MainPID --value || true"),
              "result":sh(f"systemctl show '{service}' -p Result --value || true"),
              "nrestarts":sh(f"systemctl show '{service}' -p NRestarts --value || true"),
              "runner_processes":sh("ps -o pid=,ppid=,lstart=,etime=,cmd= -u ftmo-runner | grep -E 'Runner\\.(Worker|Listener)|runsvc\\.sh' || true").splitlines(),
              "fresh_oom_evidence":sh("(sudo -n journalctl -k --since '-60 min' --no-pager 2>/dev/null || journalctl -k --since '-60 min' --no-pager 2>/dev/null || true) | grep -Eai 'out of memory|oom|killed process|memory cgroup' | tail -80 || true").splitlines(),
          }
          p=Path("artifacts/ops/ftmo-pr443-self-health-proof-20261002.json")
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps(data,sort_keys=True,indent=2)+"\n")
          print(json.dumps(data,sort_keys=True))
          PY
          git fetch origin main
          git reset --hard origin/main
          git checkout -- artifacts/ops/ftmo-pr443-self-health-proof-20261002.json 2>/dev/null || true
          python3 - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          service=os.environ["FTMO_SERVICE"]
          def run(cmd):
              return subprocess.run(["bash","-lc",cmd],text=True,capture_output=True).stdout.strip()
          data={
              "schema_version":1,
              "queue_id":"zssh-ftmo-pr443-runner-recovery-20261002",
              "workflow_run_id":os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt":os.environ["GITHUB_RUN_ATTEMPT"],
              "runner_name":os.environ.get("RUNNER_NAME"),
              "service":service,
              "state":run(f"systemctl is-active '{service}' || true"),
              "main_pid":run(f"systemctl show '{service}' -p MainPID --value || true"),
              "result":run(f"systemctl show '{service}' -p Result --value || true"),
              "nrestarts":run(f"systemctl show '{service}' -p NRestarts --value || true"),
              "runner_processes":run("ps -o pid=,ppid=,lstart=,etime=,cmd= -u ftmo-runner | grep -E 'Runner\\.(Worker|Listener)|runsvc\\.sh' || true").splitlines(),
              "fresh_oom_evidence":run("(sudo -n journalctl -k --since '-60 min' --no-pager 2>/dev/null || journalctl -k --since '-60 min' --no-pager 2>/dev/null || true) | grep -Eai 'out of memory|oom|killed process|memory cgroup' | tail -80 || true").splitlines(),
          }
          p=Path("artifacts/ops/ftmo-pr443-self-health-proof-20261002.json")
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps(data,sort_keys=True,indent=2)+"\n")
          PY
          git config user.name zcloud-automation
          git config user.email zcloud-automation@users.noreply.github.com
          git add artifacts/ops/ftmo-pr443-self-health-proof-20261002.json
          if ! git diff --cached --quiet; then
            git commit -m "Record PR443 FTMO runner self-health proof"
            git push origin HEAD:main
          fi
