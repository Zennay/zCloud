name: zCloud Worker Cockpit UI (hosted)
on:
  pull_request:
    branches: [main]
    paths:
      - public/app.js
      - public/enhancements.css
      - public/index.html
      - public/design-system.css
      - tests/test_dashboard_ux_hierarchy.py
      - tests/test_global_worker_console_ui.py
      - tests/test_mobile_worker_actions_20261010.py
      - tests/test_mobile_worker_console_navigation.py
      - tests/test_mobile_css_delivery_20261010.py
      - tests/test_dashboard_design_system.py
      - tests/test_dashboard_start_force_regression.py
      - .github/workflows/zcloud-worker-cockpit-ui-hosted.yml
      - tests/test_worker_cockpit_ui_hosted_trust_20261014.py
      - tests/test_deployops_cockpit_dispatch_admission_20261014_w3.py
  push:
    branches:
      - fix/worker-allocation-cockpit-20261013
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zcloud-worker-cockpit-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-contract:
    # No untrusted forks, alternate dispatch refs or rerun attempts may execute
    # repository JS. This is hosted CI only, never a VPS deployment.
    if: >-
      github.repository == 'Zennay/zCloud' &&
      github.run_attempt == 1 &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.base.repo.full_name == github.repository) ||
       (github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' ||
         github.ref == 'refs/heads/fix/worker-allocation-cockpit-20261013')) ||
       (github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main' &&
        github.actor == 'Zennay' &&
        github.triggering_actor == 'Zennay'))
      && ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || (github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'Zennay'))
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 10
    steps:
      - name: Checkout immutable candidate revision without retained credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 1
      - name: Confirm tested candidate SHA before executing UI code
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name || github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          EVENT_REF: ${{ github.ref }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test "$REPOSITORY" = Zennay/zCloud
          test "$HEAD_REPOSITORY" = "$REPOSITORY"
          test "$BASE_REPOSITORY" = "$REPOSITORY"
          test "$ATTEMPT" = 1
          case "$EVENT_NAME" in
            pull_request) test "$GITHUB_BASE_REF" = main ;;
            push) [[ "$EVENT_REF" == refs/heads/main || "$EVENT_REF" == refs/heads/fix/worker-allocation-cockpit-20261013 ]] ;;
            workflow_dispatch)
              test "$EVENT_REF" = refs/heads/main
              test "$ACTOR" = Zennay
              test "$TRIGGERING_ACTOR" = Zennay
              current_main="$(timeout 15 git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
              test -n "$current_main"
              test "$current_main" = "$EXPECTED_SHA" ;;
            *) echo "Unrecognized workflow event" >&2; exit 1 ;;
          esac
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "COCKPIT_UI_IMMUTABLE_SOURCE_VERIFIED=1"
      - name: Check JavaScript syntax and workflow trust
        run: |
          set -euo pipefail
          node --check public/app.js
          python3 -m unittest -v tests.test_worker_cockpit_ui_hosted_trust_20261014 tests.test_deployops_cockpit_dispatch_admission_20261014_w3
      - name: Run focused UI contracts
        run: |
          set -euo pipefail
          for name in \
            test_dashboard_ux_hierarchy.py \
            test_global_worker_console_ui.py \
            test_mobile_worker_actions_20261010.py \
            test_mobile_worker_console_navigation.py \
            test_mobile_css_delivery_20261010.py \
            test_dashboard_design_system.py \
            test_dashboard_start_force_regression.py; do
              python3 -m unittest discover -s tests -p "$name" -v
          done
          node tests/test_worker_debug_panel.js
