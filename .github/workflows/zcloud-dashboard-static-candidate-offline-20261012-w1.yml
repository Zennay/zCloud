name: zCloud dashboard static candidate offline proof

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/zcloud_dashboard_static_candidate_plan_20261012_w1.py"
      - "tests/test_dashboard_static_candidate_plan_20261012_w1.py"
      - ".github/workflows/zcloud-dashboard-static-candidate-offline-20261012-w1.yml"

permissions:
  contents: read

concurrency:
  group: zcloud-dashboard-static-candidate-offline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-static-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Fetch only the PR's exact candidate head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          clean: true
          persist-credentials: false
      - name: Prove immutable candidate identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Verify offline static candidate planning against local Git fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_dashboard_static_candidate_plan_20261012_w1.py' -v
          python3 -m py_compile scripts/zcloud_dashboard_static_candidate_plan_20261012_w1.py
          echo "DASHBOARD_STATIC_CANDIDATE_PLAN_OFFLINE_GREEN=1"
      - name: Inventory exact PR-head source dashboard bundle (no deployment)
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 scripts/zcloud_dashboard_static_candidate_plan_20261012_w1.py \
            --root . --snapshot-sha "$EXPECTED_SHA"
          echo "DASHBOARD_SOURCE_SNAPSHOT_ONLY=1"
