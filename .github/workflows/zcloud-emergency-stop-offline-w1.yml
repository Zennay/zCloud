name: zCloud offline emergency stop contract
on:
  pull_request:
    paths:
      - 'tests/test_control_plane_emergency_stop_offline_20261009_w1.py'
      - 'docs/control-plane-emergency-stop-offline-20261009-w1.md'
      - '.github/workflows/zcloud-emergency-stop-offline-w1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Deny-first offline reference tests
        run: python3 -m unittest discover -s tests -p 'test_control_plane_emergency_stop_offline_20261009_w1.py' -v
