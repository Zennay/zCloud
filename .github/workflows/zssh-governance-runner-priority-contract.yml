name: zSSH governance queue-priority contract proof

on:
  pull_request:
    branches: [main]
    paths:
      - "tests/test_zssh_governance_runner_priority_contract.py"
      - "scripts/zssh_governance_queue_priority_plan.py"
      - ".github/workflows/zssh-governance-runner-priority-contract.yml"
      - ".github/workflows/zssh-governance-runner-priority.yml"

permissions:
  contents: read

concurrency:
  group: zssh-governance-priority-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate cancellation contract on hosted runner
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
          clean: true
          fetch-depth: 1

      - name: Verify exact checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Run focused contract suite
        run: python3 -m unittest -v tests.test_zssh_governance_runner_priority_contract

  prove:
    name: Prove cancellation contract on permanent VPS
    needs: validate
    if: github.actor == 'Zennay' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 5
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
          clean: true
          fetch-depth: 1

      - name: Verify exact checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Enforce permanent zCloud VPS runner identity
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/zcloud_vps_runner_guard.py --json
          test "$(hostname)" = "vps-bb300bba"
          test "$(id -un)" = "ubuntu"

      - name: Prove queue-priority cancellation contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m unittest -v tests.test_zssh_governance_runner_priority_contract
