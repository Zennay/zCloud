name: Recover FTMO listener for TASK-37 PR511

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ftmo-task37-pr511-listener-recovery.yml'

permissions:
  contents: write

concurrency:
  group: ftmo-task37-pr511-listener-recovery
  cancel-in-progress: true

jobs:
  recover:
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 6
    env:
      CURRENT_MAIN_SHA: 77134b142952f590ba19f4666a616d0e0001621d
      SYNC_RUN: '37171444603'
      PR_TEST_RUN: '37172359837'
      PR_NUMBER: '511'
      FTMO_SERVICE: actions.runner.Zennay-Ftmo.vps-bb300bba-ftmo.service
      FTMO_RUN_USER: ftmo-runner
    steps:
      - name: Recover only an idle FTMO listener
        id: recover
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          test "${RUNNER_NAME:-}" != "vps-bb300bba-ftmo"
          gh auth status >/dev/null 2>&1
          test "$(gh api repos/Zennay/Ftmo/branches/main --jq .commit.sha)" = "$CURRENT_MAIN_SHA"
          test "$(gh api repos/Zennay/Ftmo/actions/runs/$SYNC_RUN --jq .name)" = "Sync research state to VPS"
          test "$(gh api repos/Zennay/Ftmo/actions/runs/$PR_TEST_RUN --jq .name)" = "Test suite"
          test "$(gh api repos/Zennay/Ftmo/actions/runs/$PR_TEST_RUN --jq '.pull_requests[0].number')" = "$PR_NUMBER"

          pre_state="$(systemctl is-active "$FTMO_SERVICE" || true)"
          pre_pid="$(systemctl show "$FTMO_SERVICE" -p MainPID --value || true)"
          worker=0
          pgrep -u "$FTMO_RUN_USER" -f 'Runner\.Worker' >/dev/null 2>&1 && worker=1 || true
          echo "FTMO_RUNNER_PRE state=$pre_state pid=$pre_pid worker=$worker"

          if [[ "$worker" -eq 1 ]]; then
            action=preserve-active-worker
          else
            sudo -n systemctl reset-failed "$FTMO_SERVICE" || true
            sudo -n systemctl restart "$FTMO_SERVICE"
            action=restart-idle-listener
          fi

          post_state=""
          post_pid=""
          for _ in $(seq 1 30); do
            post_state="$(systemctl is-active "$FTMO_SERVICE" || true)"
            post_pid="$(systemctl show "$FTMO_SERVICE" -p MainPID --value || true)"
            if [[ "$post_state" == active && "$post_pid" =~ ^[1-9][0-9]*$ ]] && test -r "/proc/$post_pid/cmdline"; then
              cmd="$(tr '\0' ' ' < "/proc/$post_pid/cmdline")"
              [[ "$cmd" == *"Runner.Listener"* || "$cmd" == *"runsvc.sh"* ]] && break
            fi
            sleep 2
          done
          test "$post_state" = active
          [[ "$post_pid" =~ ^[1-9][0-9]*$ ]]
          echo "FTMO_RUNNER_RECOVERY_ACTION=$action"
          echo "action=$action" >> "$GITHUB_OUTPUT"

      - name: Prove TASK-37 lane leaves queue
        shell: bash
        run: |
          set -euo pipefail
          started=""
          for _ in $(seq 1 48); do
            sync_status="$(gh api repos/Zennay/Ftmo/actions/runs/$SYNC_RUN --jq .status)"
            test_status="$(gh api repos/Zennay/Ftmo/actions/runs/$PR_TEST_RUN --jq .status)"
            echo "FTMO_TASK37_LANES sync=$sync_status pr511_test=$test_status"
            if [[ "$sync_status" == in_progress || "$sync_status" == completed ]]; then
              started="$SYNC_RUN"
              break
            fi
            if [[ "$test_status" == in_progress || "$test_status" == completed ]]; then
              started="$PR_TEST_RUN"
              break
            fi
            sleep 5
          done
          test -n "$started"
          echo "FTMO_TASK37_SCHEDULING_GREEN=$started"

      - name: Record listener-recovery receipt
        if: always()
        env:
          RECOVERY_ACTION: ${{ steps.recover.outputs.action }}
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/ftmo-task37-pr511-listener-recovery.json"
          python3 - <<'PY' > "$receipt"
          import json, os, subprocess
          runs=[]
          for key in ("SYNC_RUN","PR_TEST_RUN"):
              rid=os.environ[key]
              d=json.loads(subprocess.check_output(["gh","api",f"repos/Zennay/Ftmo/actions/runs/{rid}"],text=True))
              runs.append({"run_id":int(rid),"name":d.get("name"),"status":d.get("status"),"conclusion":d.get("conclusion"),"head_sha":d.get("head_sha")})
          print(json.dumps({
              "scope":"ftmo-task37-pr511-listener-recovery",
              "current_main_sha":os.environ["CURRENT_MAIN_SHA"],
              "runner_name":os.environ.get("RUNNER_NAME"),
              "recovery_action":os.environ.get("RECOVERY_ACTION"),
              "workflow_run_id":os.environ["GITHUB_RUN_ID"],
              "protected_runs":runs,
          },sort_keys=True,indent=2))
          PY
          encoded="$(base64 -w0 "$receipt")"
          dest="runtime-evidence/ftmo-task37-pr511-listener-recovery-$GITHUB_RUN_ID.json"
          gh api --method PUT "repos/Zennay/zCloud/contents/$dest"             -f message="Record FTMO TASK-37 PR511 listener recovery $GITHUB_RUN_ID"             -f content="$encoded"             -f branch=main >/dev/null
