name: Supa runner recovery probe

on:
  pull_request:
    paths:
      - ".github/workflows/supa-runner-recovery-probe.yml"

concurrency:
  group: supa-runner-recovery-probe
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  recover:
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 5
    steps:
      - name: Verify control-plane runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          echo "control_runner=${RUNNER_NAME:-unknown}"
          echo "host=$(hostname)"

      - name: Inspect and recover existing Supa Actions listener
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t services < <(
            systemctl list-unit-files --type=service --no-legend \
              | awk '$1 ~ /^actions\.runner\.Zennay-Supa\..*\.service$/ {print $1}' \
              | sort -u
          )

          echo "supa_runner_service_count=${#services[@]}"
          printf 'supa_runner_service=%s\n' "${services[@]:-}"

          if [[ "${#services[@]}" -eq 0 ]]; then
            echo "SUPA_RUNNER_RECOVERY=no-existing-service"
            echo "available_actions_runner_services:"
            systemctl list-unit-files --type=service --no-legend \
              | awk '$1 ~ /^actions\.runner\./ {print $1}' \
              | sort -u
            exit 20
          fi

          if [[ "${#services[@]}" -ne 1 ]]; then
            echo "SUPA_RUNNER_RECOVERY=ambiguous-existing-services"
            exit 21
          fi

          service="${services[0]}"
          pre_state="$(systemctl is-active "$service" || true)"
          pre_pid="$(systemctl show "$service" -p MainPID --value || true)"
          cgroup="$(systemctl show "$service" -p ControlGroup --value || true)"
          worker=0
          listener=0

          if [[ -n "$cgroup" && -d "/sys/fs/cgroup$cgroup" ]]; then
            while read -r pid; do
              [[ -r "/proc/$pid/cmdline" ]] || continue
              cmd="$(tr '\0' ' ' < "/proc/$pid/cmdline" || true)"
              [[ "$cmd" == *"Runner.Worker"* ]] && worker=1
              [[ "$cmd" == *"Runner.Listener"* ]] && listener=1
            done < <(find "/sys/fs/cgroup$cgroup" -name cgroup.procs -type f -exec cat {} + 2>/dev/null | sort -u)
          fi

          echo "pre_state=$pre_state"
          echo "pre_pid=$pre_pid"
          echo "pre_listener=$listener"
          echo "pre_worker=$worker"

          action=preserve-active-worker
          if [[ "$worker" -eq 1 ]]; then
            action=preserve-active-worker
          elif [[ "$pre_state" != "active" ]]; then
            sudo -n systemctl restart "$service"
            action=restart-inactive-service
          else
            sudo -n systemctl restart "$service"
            action=restart-idle-or-unhealthy-listener
          fi

          sleep 4
          post_state="$(systemctl is-active "$service" || true)"
          post_pid="$(systemctl show "$service" -p MainPID --value || true)"
          echo "action=$action"
          echo "post_state=$post_state"
          echo "post_pid=$post_pid"

          test "$post_state" = "active"
          test -n "$post_pid"
          test "$post_pid" != "0"

          systemctl show "$service" \
            -p ActiveState -p SubState -p MainPID -p NRestarts -p Result \
            --no-pager
