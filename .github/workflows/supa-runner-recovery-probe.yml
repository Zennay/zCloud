name: Supa exact-head capture bridge

on:
  pull_request:
    paths:
      - ".github/workflows/supa-runner-recovery-probe.yml"

concurrency:
  group: supa-exact-head-capture-bridge
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  capture:
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 15
    env:
      SUPA_REPOSITORY: Zennay/Supa
      SUPA_SHA: b4554a0adb16d89b559b0754a47bbeeef36e3816
    steps:
      - name: Verify control-plane runner and Supa runner absence
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          echo "control_runner=${RUNNER_NAME:-unknown}"
          echo "host=$(hostname)"

          mapfile -t supa_services < <(
            systemctl list-unit-files --type=service --no-legend |
              awk '$1 ~ /^actions\.runner\.Zennay-Supa\..*\.service$/ {print $1}' |
              sort -u
          )
          echo "supa_runner_service_count=${#supa_services[@]}"
          printf 'supa_runner_service=%s\n' "${supa_services[@]:-}"

          if [[ "${#supa_services[@]}" -eq 0 ]]; then
            echo "bridge_reason=no-existing-supa-runner-service"
          else
            echo "bridge_reason=exact-head-independent-evidence"
          fi

      - name: Inspect existing browser automation capability
        shell: bash
        run: |
          set -euo pipefail
          echo "=== browser binaries ==="
          for cmd in firefox firefox-esr chromium chromium-browser google-chrome geckodriver chromedriver; do
            if command -v "$cmd" >/dev/null 2>&1; then
              echo "$cmd=$(command -v "$cmd")"
              "$cmd" --version 2>/dev/null | head -n 1 || true
            else
              echo "$cmd=missing"
            fi
          done

          echo "=== python browser modules ==="
          python3 - <<'PY'
          import importlib.util
          for name in ("selenium", "playwright"):
              print(f"{name}={'present' if importlib.util.find_spec(name) else 'missing'}")
          PY

          echo "=== node browser modules in control checkout ==="
          node - <<'NODE'
          for (const name of ['playwright','puppeteer','selenium-webdriver']) {
            try { console.log(name + '=' + require.resolve(name)) }
            catch { console.log(name + '=missing') }
          }
          NODE

      - name: Check out exact Supa PR 3 head
        uses: actions/checkout@v4
        with:
          repository: Zennay/Supa
          ref: b4554a0adb16d89b559b0754a47bbeeef36e3816
          path: supa-exact
          persist-credentials: false

      - name: Verify exact source identity
        shell: bash
        working-directory: supa-exact
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "expected=$SUPA_SHA"
          echo "actual=$actual"
          test "$actual" = "$SUPA_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install locked dependencies
        working-directory: supa-exact
        run: npm ci

      - name: Verify bounded source contract
        working-directory: supa-exact
        run: npm test

      - name: Run matching benchmark
        working-directory: supa-exact
        run: npm run m1:matching-benchmark

      - name: Capture representative public pages
        id: live_capture
        continue-on-error: true
        working-directory: supa-exact
        run: node scripts/m1-capture-sources.mjs

      - name: Inspect capture integrity and structured data
        id: inspect
        if: always()
        shell: bash
        working-directory: supa-exact
        run: |
          set -euo pipefail
          capture_dir="$(find artifacts/m1-captures -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1)"
          test -n "$capture_dir"
          npm run m1:inspect-captures -- "$capture_dir"

      - name: Evaluate capture freshness evidence
        id: freshness
        if: always()
        shell: bash
        working-directory: supa-exact
        run: |
          set -euo pipefail
          capture_dir="$(find artifacts/m1-captures -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1)"
          test -n "$capture_dir"
          npm run m1:evaluate-freshness -- "$capture_dir"

      - name: Export sanitized product candidates
        id: export
        if: steps.inspect.outcome == 'success'
        shell: bash
        working-directory: supa-exact
        run: |
          set -euo pipefail
          capture_dir="$(find artifacts/m1-captures -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1)"
          test -n "$capture_dir"
          npm run m1:export-candidates -- "$capture_dir"

      - name: Build M1 evidence summary
        id: evidence
        if: steps.inspect.outcome == 'success' && steps.freshness.outcome == 'success' && steps.export.outcome == 'success'
        shell: bash
        working-directory: supa-exact
        run: |
          set -euo pipefail
          capture_dir="$(find artifacts/m1-captures -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1)"
          test -n "$capture_dir"
          npm run m1:evidence-summary -- "$capture_dir"

      - name: Upload exact-head capture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supa-pr3-exact-head-capture
          path: supa-exact/artifacts/m1-captures/
          if-no-files-found: error
          retention-days: 14

      - name: Fail visibly when capture evidence fails
        if: steps.live_capture.outcome != 'success' || steps.inspect.outcome != 'success' || steps.freshness.outcome != 'success' || steps.export.outcome == 'failure' || steps.evidence.outcome == 'failure'
        shell: bash
        run: |
          echo "Exact-head Supa M1 evidence is incomplete. Inspect the uploaded artifact."
          exit 1
