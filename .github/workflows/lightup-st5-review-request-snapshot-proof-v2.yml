name: LightUp ST5 review-request snapshot proof v2

on:
  push:
    branches:
      - "ops/lightup-st5-review-request-snapshot-proof-v2-20261006"
    paths:
      - ".github/workflows/lightup-st5-review-request-snapshot-proof-v2.yml"

permissions:
  contents: read

concurrency:
  group: lightup-st5-review-request-snapshot-proof-v2
  cancel-in-progress: true

jobs:
  verify:
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify permanent zCloud VPS runner
        run: python3 scripts/zcloud_vps_runner_guard.py --json

      - name: Verify exact LightUp #303 candidate
        shell: bash
        env:
          LIGHTUP_REPO: /home/ubuntu/zennay-cloud/repos/lightup
          LIGHTUP_BRANCH: chatgpt/st5-plan-review-request-snapshot-isolation-20261006
          LIGHTUP_SHA: 27f7cb736c453b1b619567605c50b057221810f9
        run: |
          set -euo pipefail
          test -d "${LIGHTUP_REPO}/.git"
          git -C "${LIGHTUP_REPO}" fetch --no-tags origin             "+refs/heads/${LIGHTUP_BRANCH}:refs/remotes/origin/${LIGHTUP_BRANCH}"
          target_sha="$(git -C "${LIGHTUP_REPO}" rev-parse "refs/remotes/origin/${LIGHTUP_BRANCH}^{commit}")"
          test "${target_sha}" = "${LIGHTUP_SHA}"

          tmp_root="$(mktemp -d)"
          trap 'rm -rf "${tmp_root}"' EXIT
          snapshot="${tmp_root}/lightup"
          mkdir -p "${snapshot}"
          git -C "${LIGHTUP_REPO}" archive "${target_sha}" | tar -x -C "${snapshot}"

          cd "${snapshot}"
          export PYTHONPATH=src:tests
          python3 -m compileall -q src tests
          python3 -m unittest discover -s tests             -p 'test_future_remediation_implementation_plan_review_request_snapshot_isolation.py' -v
          python3 -m unittest discover -s tests             -p 'test_future_remediation_implementation_plan_review_request_handoff.py' -v

          printf 'LIGHTUP_ST5_REVIEW_REQUEST_SNAPSHOT_PROOF branch=%s target_sha=%s host=%s\n'             "${LIGHTUP_BRANCH}" "${target_sha}" "$(hostname)"
