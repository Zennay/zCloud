name: LightUp remediation handoff integrity pack VPS proof

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/lightup-remediation-handoff-integrity-pack-vps-proof.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lightup-remediation-handoff-integrity-pack-vps-proof
  cancel-in-progress: true

env:
  LIGHTUP_REPO: /home/ubuntu/zennay-cloud/repos/lightup
  LIGHTUP_BRANCH: chatgpt/st5-remediation-retest-handoff-integrity-pack-20261006
  LIGHTUP_EXPECTED_SHA: fa62f1466f8eaa7a0a65a7b68c5f5bd0c1f80857

jobs:
  prove:
    name: Exact handoff integrity pack on vps-bb300bba
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == github.repository_owner)
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 35

    steps:
      - name: Checkout exact zCloud proof harness
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          clean: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Guard permanent VPS runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          python3 scripts/zcloud_vps_runner_guard.py --json

      - name: Snapshot exact LightUp pack head
        shell: bash
        run: |
          set -euo pipefail
          remote_ref="refs/remotes/origin/lightup-remediation-handoff-integrity-pack-proof"
          snapshot="${RUNNER_TEMP}/lightup-remediation-handoff-integrity-pack-${GITHUB_RUN_ID}"
          git -C "${LIGHTUP_REPO}" fetch --prune origin             "+refs/heads/${LIGHTUP_BRANCH}:${remote_ref}"
          actual="$(git -C "${LIGHTUP_REPO}" rev-parse "${remote_ref}^{commit}")"
          test "${actual}" = "${LIGHTUP_EXPECTED_SHA}"
          rm -rf "${snapshot}"
          mkdir -p "${snapshot}"
          git -C "${LIGHTUP_REPO}" archive "${actual}" | tar -x -C "${snapshot}"
          echo "LIGHTUP_SNAPSHOT=${snapshot}" >> "${GITHUB_ENV}"
          echo "LIGHTUP_ACTUAL_SHA=${actual}" >> "${GITHUB_ENV}"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prove pack on Python 3.11
        shell: bash
        run: |
          set -euo pipefail
          cd "${LIGHTUP_SNAPSHOT}"
          export PYTHONPATH=src:tests
          python -m compileall -q src tests
          python -m unittest -v             test_future_security_remediation_retest_plan_live_validation_atomicity             test_future_security_remediation_retest_plan_parser_input_purity             test_future_security_remediation_retest_handoff_chain_atomicity
          python -m unittest discover -s tests -v
          python -m unittest discover -s tests/integration -v
          PYTHONPATH=src python scripts/check_safety_canaries.py

      - name: Setup Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Prove pack on Python 3.14
        shell: bash
        run: |
          set -euo pipefail
          cd "${LIGHTUP_SNAPSHOT}"
          export PYTHONPATH=src:tests
          python -m compileall -q src tests
          python -m unittest -v             test_future_security_remediation_retest_plan_live_validation_atomicity             test_future_security_remediation_retest_plan_parser_input_purity             test_future_security_remediation_retest_handoff_chain_atomicity
          python -m unittest discover -s tests -v
          python -m unittest discover -s tests/integration -v
          PYTHONPATH=src python scripts/check_safety_canaries.py

      - name: Write exact-head receipt
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/lightup-remediation-handoff-integrity-pack-receipt"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "schema_version": 1,
              "project": "LightUp",
              "result": "success",
              "host": os.uname().nodename,
              "github_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "source_branch": os.environ["LIGHTUP_BRANCH"],
              "target_sha": os.environ["LIGHTUP_ACTUAL_SHA"],
              "expected_sha": os.environ["LIGHTUP_EXPECTED_SHA"],
              "issues": [352, 354, 355],
              "python": ["3.11", "3.14"],
              "proof": [
                  "exact-sha-binding",
                  "three-dedicated-integrity-regressions",
                  "compile",
                  "full-unit-suite",
                  "real-producer-integration",
                  "safety-canaries",
              ],
          }
          path = Path(os.environ["RUNNER_TEMP"]) / "lightup-remediation-handoff-integrity-pack-receipt" / "receipt.json"
          path.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n")
          print(json.dumps(payload, sort_keys=True))
          PY

      - name: Upload exact-head receipt
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lightup-remediation-handoff-integrity-pack-vps-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/lightup-remediation-handoff-integrity-pack-receipt/receipt.json
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup snapshot
        if: always()
        shell: bash
        run: rm -rf "${LIGHTUP_SNAPSHOT:-}"
