name: zCloud P0 one-shot worker v2 activation
# A code merge can never trigger live Firefox/timer mutation.
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/zcloud-v2-one-shot-activation.yml
      - tests/test_zcloud_one_shot_v2_manual_gate_20261013_w1.py
  workflow_dispatch:
    inputs:
      confirm_sha:
        description: "Exact approved 40-hex current main SHA"
        type: string
        required: true
      confirm_maintenance_window:
        description: "Type I_APPROVE_SHARED_VPS_ONE_SHOT only after serialized owner approval"
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: zcloud-p0-one-shot-worker-v2-activation-alternate
  cancel-in-progress: false
jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout PR merge revision without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify immutable hosted PR contract only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m unittest -v tests.test_zcloud_one_shot_v2_manual_gate_20261013_w1

  activate:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'Zennay/zCloud' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'Zennay' &&
      inputs.confirm_maintenance_window == 'I_APPROVE_SHARED_VPS_ONE_SHOT'
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 10
    steps:
      - name: Checkout immutable approved current main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true
      - name: Fail closed on stale SHA, wrong runner, or missing owner confirmation
        shell: bash
        env:
          CONFIRMED_SHA: ${{ inputs.confirm_sha }}
        run: |
          set -euo pipefail
          [[ "$CONFIRMED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REPOSITORY" = Zennay/zCloud
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_ACTOR" = Zennay
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$CONFIRMED_SHA" = "$GITHUB_SHA"
          test "$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')" = "$GITHUB_SHA"
          test "$(hostname)" = vps-bb300bba
          test "$(id -un)" = ubuntu
          python3 scripts/zcloud_vps_runner_guard.py --json
      - name: Read-only stable worker idle proof before any live file or timer mutation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import time
          import urllib.request

          def unique(pairs):
              result = {}
              for key,value in pairs:
                  if key in result:
                      raise ValueError("duplicate JSON evidence")
                  result[key] = value
              return result

          def snapshot():
              with urllib.request.urlopen("http://127.0.0.1:8765/api/runner-live", timeout=5) as response:
                  if response.status != 200 or response.headers.get_content_type() != "application/json":
                      raise ValueError("untrusted status response")
                  content = response.read(65537)
                  if len(content) > 65536:
                      raise ValueError("oversized status")
                  data = json.loads(content, object_pairs_hook=unique)
              if not isinstance(data, dict):
                  raise ValueError("missing status")
              runners = data.get("chatgpt_runners")
              if not isinstance(runners,dict) or not runners:
                  raise ValueError("unverified runners")
              observed = set()
              for r in runners.values():
                  if not isinstance(r,dict) or not isinstance(r.get("workers"),list):
                      raise ValueError("missing worker evidence")
                  for w in r["workers"]:
                      if not isinstance(w,dict) or type(w.get("active")) is not bool:
                          raise ValueError("unknown worker")
                      if not w["active"]:
                          continue
                      identity = w.get("worker_id")
                      if not isinstance(identity,str) or not identity or identity in observed:
                          raise ValueError("ambiguous active identity")
                      observed.add(identity)
                      if (type(w.get("sending")) is not bool or w["sending"] or
                          type(w.get("generating")) is not bool or w["generating"] or
                          w.get("desired_state") not in ("running","active","idle")):
                          raise ValueError("active generation or unknown state")
              if not observed:
                  raise ValueError("no active-worker identity proof")
              return tuple(sorted(observed))

          first = snapshot()
          time.sleep(3)
          if snapshot() != first:
              raise ValueError("worker identity drift")
          print("READ_ONLY_STABLE_IDLE_WORKERS="+str(len(first)))
          PY
      - name: Verify one-tab engine from current main and activate without browser restart
        shell: bash
        env:
          XDG_RUNTIME_DIR: /run/user/1000
          DBUS_SESSION_BUS_ADDRESS: unix:path=/run/user/1000/bus
        run: |
          set -euo pipefail
          test "$(hostname)" = vps-bb300bba
          test "$(id -un)" = ubuntu
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote --exit-code origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          node --check firefox-extension/worker-controller-v2.js
          node --check public/zcloud-worker.user.js
          node tests/test_single_tab_v2_crash_recovery.js
          node tests/test_single_tab_v2_auto_heal.js
          node tests/test_single_tab_worker_v2.js
          node tests/test_single_tab_v2_thinking_high.js
          node tests/test_v2_workmode_high_controls.js
          node tests/test_single_tab_v2_cycle.js
          root="/home/ubuntu/zennay-cloud"
          addon="$HOME/snap/firefox/common/chatgpt-project-extension"
          backup="$HOME/.local/state/zcloud/p0-v2-one-shot-$GITHUB_RUN_ID"
          mkdir -p "$backup" "$root/public" "$addon"
          before="$(ps -eo pid=,args= | awk '$0 ~ /[/]firefox/ && $0 ~ /-start-debugger-server/ {print $1;exit}')"
          test -n "$before"
          kill -0 "$before"
          echo "FIREFOX_PID_BEFORE=$before"
          echo "DEPLOY_COMMIT=$(git rev-parse HEAD)"
          python3 - <<'PY'
          import json,pathlib
          m=json.loads(pathlib.Path("firefox-extension/manifest.json").read_text())
          assert m["background"]["scripts"][-1]=="worker-controller-v2.js"
          assert "storage" in m["permissions"]
          s=pathlib.Path("public/zcloud-worker.user.js").read_text()
          assert "// @version      2.0.1" in s
          assert "if (window.__ZCLOUD_SINGLE_TAB_V2) return;" in s
          assert "POLL_MS=30000" in s
          print("EXCLUSIVE_V2_SOURCE_CONTRACT=1")
          PY
          # Never kill Firefox, close tabs, navigate an existing page, or
          # touch an expert tab. Backup only the exact files being replaced.
          for rel in public/zcloud-worker.user.js public/zcloud-worker-v2-engine.js; do
            test ! -e "$root/$rel" || cp -p "$root/$rel" "$backup/$(basename "$rel").previous"
            install -m 0644 "$rel" "$root/$rel"
            cmp "$rel" "$root/$rel"
          done
          for rel in background.js manifest.json worker-controller-v2.js; do
            test ! -e "$addon/$rel" || cp -p "$addon/$rel" "$backup/$rel.previous"
            install -m 0644 "firefox-extension/$rel" "$addon/$rel"
            cmp "firefox-extension/$rel" "$addon/$rel"
          done
          echo "VM_V2_SOURCE_INSTALLED=1"
          echo "ADDON_V2_FILES_INSTALLED=1"
          bash scripts/zcloud_retire_legacy_worker_services.sh
          # Addon-only reload never stops or restarts the Firefox process.
          # V2 controller explicitly preserves preexisting unverified VM tabs.
          node scripts/zcloud_reload_extension.mjs
          sleep 3
          after="$(ps -eo pid=,args= | awk '$0 ~ /[/]firefox/ && $0 ~ /-start-debugger-server/ {print $1;exit}')"
          test "$before" = "$after"
          echo "FIREFOX_PID_AFTER=$after"
          echo "SAME_FIREFOX_PROCESS_VERIFIED=1"
          echo "V2_ADDON_CONTROLLER_HOT_RELOADED=1"
          echo "CRASH_TAB_REHYDRATION_INSTALLED=1"
          echo "ACTIVE_TAB_SELF_HEAL_INSTALLED=1"
          echo "NOTE=Violentmonkey installed script must independently upgrade to 2.0.1; existing tabs have not been reloaded."
