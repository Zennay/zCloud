name: zCloud UI-only guarded publish 2026-10-13

on:
  push:
    branches: [fix/worker-allocation-cockpit-20261013]
    paths: [.github/workflows/zcloud-ui-publish-20261013.yml]

permissions:
  actions: read
  contents: read

# Share the normal production deploy lock: static writes must not race a full promotion.
concurrency:
  group: zcloud-ui-only-publish-20261013
  cancel-in-progress: false

jobs:
  publish-dashboard-ui:
    if: >-
      github.repository == 'Zennay/zCloud' &&
      github.actor == 'Zennay' &&
      github.ref == 'refs/heads/fix/worker-allocation-cockpit-20261013' &&
      github.event.head_commit.message == 'deploy(ui): publish worker cockpit without worker restart'
    runs-on: self-hosted
    timeout-minutes: 7
    steps:
      - name: Checkout trusted exact feature revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 40

      - name: Verify scope, source revision and permanent VPS
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname -s)" = "vps-bb300bba"
          test "$(id -un)" = "ubuntu"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags --depth=40 origin main
          # Main may have advanced with unrelated worker engine commits. Never
          # overwrite a newer dashboard: both current main and candidate must
          # contain the exact green static UI files.
          git merge-base --is-ancestor 50cc2e0696254e47d03e14509f345cb2c122f699 origin/main
          for path in public/app.js public/enhancements.css public/index.html; do
            git diff --quiet 50cc2e0696254e47d03e14509f345cb2c122f699 origin/main -- "$path"
          done
          changed="$(git diff --name-only 3b16750c5ad427df159d0a195f959c6297941b84 HEAD)"
          while IFS= read -r path; do
            case "$path" in
              public/app.js|public/enhancements.css|public/index.html|tests/*|.github/workflows/zcloud-worker-cockpit-ui-hosted.yml|.github/workflows/zcloud-ui-publish-20261013.yml) ;;
              *) echo "UNAUTHORIZED_UI_DEPLOY_PATH=$path"; exit 2 ;;
            esac
          done <<< "$changed"
          # Require the same UI asset bytes that passed GitHub-hosted checks.
          for path in public/app.js public/enhancements.css public/index.html; do
            git diff --quiet ffacf70e5dd958f9d8a0ff85c6d0d44fbb0b6a19 HEAD -- "$path"
          done
          node --check public/app.js
          grep -Fq 'Worker verdeling' public/app.js
          grep -Fq '.worker-cockpit' public/enhancements.css
          grep -Fq '/app.js?v=r8' public/index.html
          grep -Fq '/enhancements.css?v=r5' public/index.html
          test "$(git ls-remote origin refs/heads/fix/worker-allocation-cockpit-20261013 | cut -f1)" = "$GITHUB_SHA"
          echo "UI_PUBLISH_SOURCE_VERIFIED sha=$GITHUB_SHA"

      - name: Back up, atomically publish static UI, verify live and rollback on failure
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          live="/home/ubuntu/zennay-cloud/public"
          test -d "$live"
          test ! -L "$live"
          test -w "$live"
          # Respect normal promotion's filesystem mutex; never overwrite while
          # another promotion transaction is operating.
          install -d -m 0700 "$HOME/.local/state/zcloud/recovery"
          exec 9>"$HOME/.local/state/zcloud/recovery/promotion.lock"
          flock -n 9 || { echo "UI_PUBLISH_BUSY_PROMOTION_LOCK"; exit 75; }
          # Do not race an already-running full production deploy.
          deploy_status="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/zcloud-vps-deploy.yml/runs?per_page=50" --jq '[.workflow_runs[] | select(.status == "in_progress")] | length')"
          test "$deploy_status" = "0" || { echo "UI_PUBLISH_BUSY_FULL_DEPLOY=$deploy_status"; exit 75; }
          systemctl is-active --quiet zennay-cloud.service
          before_pid="$(systemctl show zennay-cloud.service -p MainPID --value)"
          test -n "$before_pid"
          test "$before_pid" != 0
          state_root="$HOME/.local/state/zcloud/ui-publish"
          install -d -m 0700 "$state_root"
          backup="$(mktemp -d "$state_root/20261013-XXXXXXXX")"
          files=(app.js enhancements.css index.html)
          for name in "${files[@]}"; do
            test -f "public/$name"
            test -f "$live/$name"
            test ! -L "$live/$name"
            cp -p "$live/$name" "$backup/$name"
          done
          rollback(){
            echo "UI_PUBLISH_ROLLBACK backup=$backup"
            for name in "${files[@]}"; do
              if test -f "$backup/$name"; then
                install -m 0644 "$backup/$name" "$live/.$name.rollback.$$"
                mv -f "$live/.$name.rollback.$$" "$live/$name"
              fi
            done
          }
          trap rollback ERR
          for name in "${files[@]}"; do
            install -m 0644 "public/$name" "$live/.$name.candidate.$$"
            mv -f "$live/.$name.candidate.$$" "$live/$name"
            cmp -s "public/$name" "$live/$name"
            echo "UI_PUBLISH_INSTALLED path=public/$name"
          done

          # These are read-only requests; do not stop, restart or touch Firefox/SQLite.
          check_html="$(mktemp)"
          check_app="$(mktemp)"
          check_css="$(mktemp)"
          trap 'rm -f "$check_html" "$check_app" "$check_css"' EXIT
          curl --fail --silent --show-error --max-time 12 -H 'Cache-Control: no-cache'             'http://127.0.0.1:8765/' > "$check_html"
          curl --fail --silent --show-error --max-time 12 -H 'Cache-Control: no-cache'             'http://127.0.0.1:8765/app.js?v=r8' > "$check_app"
          curl --fail --silent --show-error --max-time 12 -H 'Cache-Control: no-cache'             'http://127.0.0.1:8765/enhancements.css?v=r5' > "$check_css"
          grep -Fq '/app.js?v=r8' "$check_html"
          grep -Fq '/enhancements.css?v=r5' "$check_html"
          grep -Fq 'Worker verdeling' "$check_app"
          grep -Fq 'function globalWorkerRows()' "$check_app"
          grep -Fq '.worker-cockpit' "$check_css"
          systemctl is-active --quiet zennay-cloud.service
          after_pid="$(systemctl show zennay-cloud.service -p MainPID --value)"
          test "$before_pid" = "$after_pid"
          trap - ERR
          echo "UI_PUBLISH_VERIFIED=1 source_sha=$GITHUB_SHA backup=$backup server_pid=$after_pid"
