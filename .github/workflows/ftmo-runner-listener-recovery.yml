name: Recover queued FTMO Actions runner

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-runner-listener-recovery.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ftmo-runner-listener-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 4
    steps:
      - name: Check out exact main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Verify live zSSH recovery assignment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import urllib.request

          queue_ids = (
              "zssh-ftmo-verify72-runner-recovery-20261002",
              "zssh-ftmo-runner-recovery-20261002",
              "zssh-ftmo-safe-gate-3b512f56",
          )
          with urllib.request.urlopen(
              "http://127.0.0.1:8765/api/portfolio-queue?all=1", timeout=10
          ) as response:
              payload = json.load(response)

          def find(value, wanted):
              if isinstance(value, dict):
                  if value.get("queue_id") == wanted:
                      return value
                  for child in value.values():
                      found = find(child, wanted)
                      if found:
                          return found
              elif isinstance(value, list):
                  for child in value:
                      found = find(child, wanted)
                      if found:
                          return found
              return None

          item = None
          queue_id = None
          for candidate in queue_ids:
              found = find(payload, candidate)
              if not found:
                  continue
              if str(found.get("status") or "").lower() in {"queued", "claimed", "in_progress"}:
                  item = found
                  queue_id = candidate
                  break
          if not item or not queue_id:
              raise SystemExit(
                  "no runnable zSSH FTMO recovery assignment is present in live SQLite queue"
              )
          if str(item.get("project_id") or "").lower() != "zssh":
              raise SystemExit(f"{queue_id} is not owned by zssh")
          if str(item.get("priority") or "").upper() != "P0":
              raise SystemExit(f"{queue_id} is not P0")
          if str(item.get("status") or "").lower() not in {"queued", "claimed", "in_progress"}:
              raise SystemExit(
                  f"{queue_id} is not runnable: status={item.get('status')!r}"
              )
          print(
              "FTMO_RUNNER_RECOVERY_QUEUE_GREEN",
              json.dumps(
                  {
                      "queue_id": queue_id,
                      "status": item.get("status"),
                      "worker_slot": item.get("worker_slot"),
                      "updated_at": item.get("updated_at"),
                  },
                  sort_keys=True,
              ),
          )
          PY

      - name: Diagnose recorded FTMO runner shutdown
        shell: bash
        run: |
          set -euo pipefail
          SERVICE=actions.runner.Zennay-Ftmo.vps-bb300bba-ftmo.service

          echo "FTMO_RUNNER_SERVICE=$SERVICE"
          systemctl show "$SERVICE"             -p ActiveState -p SubState -p MainPID -p NRestarts             -p Result -p ExecMainCode -p ExecMainStatus             -p ActiveEnterTimestamp -p InactiveEnterTimestamp             --no-pager || true

          echo "FTMO_RUNNER_JOURNAL_FRESH_BEGIN"
          journalctl -u "$SERVICE" --since "-45 min" --no-pager 2>/dev/null             | grep -Eai 'runner|listener|worker|shutdown|signal|stopp|start|kill|oom|memory'             | tail -120 || true
          echo "FTMO_RUNNER_JOURNAL_FRESH_END"

          echo "FTMO_KERNEL_OOM_FRESH_BEGIN"
          (sudo -n journalctl -k --since "-45 min" --no-pager 2>/dev/null ||             journalctl -k --since "-45 min" --no-pager 2>/dev/null || true)             | grep -Eai 'out of memory|oom|killed process|memory cgroup'             | tail -120 || true
          echo "FTMO_KERNEL_OOM_FRESH_END"

      - name: Recover only the FTMO Actions listener
        id: recovery
        shell: bash
        run: |
          set -euo pipefail
          SERVICE=actions.runner.Zennay-Ftmo.vps-bb300bba-ftmo.service
          RUN_USER=ftmo-runner

          pre_state="$(systemctl is-active "$SERVICE" || true)"
          pre_pid="$(systemctl show "$SERVICE" -p MainPID --value || true)"
          worker_before=0
          listener_before=0
          if pgrep -u "$RUN_USER" -f 'Runner\.Worker' >/dev/null 2>&1; then
            worker_before=1
          fi
          if [[ "$pre_pid" =~ ^[1-9][0-9]*$ ]] && test -r "/proc/$pre_pid/cmdline"; then
            pre_cmdline="$(tr '\0' ' ' < "/proc/$pre_pid/cmdline")"
            if [[ "$pre_cmdline" == *"Runner.Listener"* || "$pre_cmdline" == *"runsvc.sh"* ]]; then
              listener_before=1
            fi
          fi
          echo "FTMO_RUNNER_PRE state=$pre_state pid=$pre_pid listener=$listener_before worker=$worker_before"

          action=none
          if [[ "$pre_state" != "active" ]]; then
            sudo -n systemctl reset-failed "$SERVICE" || true
            sudo -n systemctl start "$SERVICE"
            action=start-inactive-listener
          elif [[ "$worker_before" -eq 1 ]]; then
            action=preserve-active-worker
          elif [[ "$listener_before" -eq 1 ]]; then
            action=preserve-healthy-listener
          else
            sudo -n systemctl restart "$SERVICE"
            action=restart-unhealthy-listener
          fi

          post_state=""
          for _ in $(seq 1 30); do
            post_state="$(systemctl is-active "$SERVICE" || true)"
            if [[ "$post_state" == "active" ]]; then
              break
            fi
            sleep 2
          done
          test "$post_state" = "active"

          post_pid="$(systemctl show "$SERVICE" -p MainPID --value)"
          [[ "$post_pid" =~ ^[1-9][0-9]*$ ]]
          test -r "/proc/$post_pid/cmdline"
          post_cmdline="$(tr '\0' ' ' < "/proc/$post_pid/cmdline")"
          [[ "$post_cmdline" == *"Runner.Listener"* || "$post_cmdline" == *"runsvc.sh"* ]]

          echo "FTMO_RUNNER_RECOVERY_ACTION=$action"
          echo "FTMO_RUNNER_POST state=$post_state pid=$post_pid listener=1"
          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "pre_state=$pre_state" >> "$GITHUB_OUTPUT"
          echo "pre_pid=$pre_pid" >> "$GITHUB_OUTPUT"
          echo "post_state=$post_state" >> "$GITHUB_OUTPUT"
          echo "post_pid=$post_pid" >> "$GITHUB_OUTPUT"
          systemctl show "$SERVICE"             -p ActiveState -p SubState -p MainPID -p NRestarts             -p Result -p ExecMainCode -p ExecMainStatus             --no-pager

      - name: Record verify72 recovery receipt
        env:
          RECOVERY_ACTION: ${{ steps.recovery.outputs.action }}
          PRE_STATE: ${{ steps.recovery.outputs.pre_state }}
          PRE_PID: ${{ steps.recovery.outputs.pre_pid }}
          POST_STATE: ${{ steps.recovery.outputs.post_state }}
          POST_PID: ${{ steps.recovery.outputs.post_pid }}
        shell: bash
        run: |
          set -euo pipefail
          SERVICE=actions.runner.Zennay-Ftmo.vps-bb300bba-ftmo.service
          git fetch origin main
          git reset --hard origin/main
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          service = "actions.runner.Zennay-Ftmo.vps-bb300bba-ftmo.service"
          oom = subprocess.run(
              ["bash", "-lc",
               "(sudo -n journalctl -k --since '-45 min' --no-pager 2>/dev/null || "
               "journalctl -k --since '-45 min' --no-pager 2>/dev/null || true) | "
               "grep -Eai 'out of memory|oom|killed process|memory cgroup' | tail -40"],
              text=True, capture_output=True
          ).stdout.strip().splitlines()
          workers = subprocess.run(
              ["bash", "-lc",
               "ps -o pid=,ppid=,lstart=,etime=,cmd= -u ftmo-runner | "
               "grep -E 'Runner\\.(Worker|Listener)|runsvc\\.sh' || true"],
              text=True, capture_output=True
          ).stdout.strip().splitlines()
          diag = subprocess.run(
              ["bash", "-lc",
               "latest=$(ls -1t /opt/ftmo-runner/_diag/Runner_*.log 2>/dev/null | head -1); "
               "if [ -n \"$latest\" ]; then echo DIAG_FILE=$latest; "
               "grep -Eai 'running job|job request|listening for jobs|assigned|shutdown|signal|session|message queue' "
               "\"$latest\" | tail -160; fi"],
              text=True, capture_output=True
          ).stdout.strip().splitlines()
          receipt = {
              "schema_version": 1,
              "queue_id": "zssh-ftmo-verify72-runner-recovery-20261002",
              "workflow_run_id": os.environ.get("GITHUB_RUN_ID"),
              "workflow_run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "workflow_sha": os.environ.get("GITHUB_SHA"),
              "runner_name": os.environ.get("RUNNER_NAME"),
              "service": service,
              "pre_state": os.environ.get("PRE_STATE"),
              "pre_pid": os.environ.get("PRE_PID"),
              "recovery_action": os.environ.get("RECOVERY_ACTION"),
              "post_state": os.environ.get("POST_STATE"),
              "post_pid": os.environ.get("POST_PID"),
              "listener_cmdline": subprocess.check_output(
                  ["bash", "-lc",
                   "pid=$(systemctl show actions.runner.Zennay-Ftmo.vps-bb300bba-ftmo.service "
                   "-p MainPID --value); tr '\\0' ' ' < /proc/$pid/cmdline"],
                  text=True
              ).strip(),
              "runner_processes": workers,
              "runner_diag_tail": diag,
              "fresh_oom_evidence": oom,
          }
          target = Path("artifacts/ops/zssh-ftmo-verify72-runner-recovery.json")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps(receipt, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          print("FTMO_VERIFY72_RECOVERY_RECEIPT", json.dumps(receipt, sort_keys=True))
          PY

          git config user.name "zcloud-automation"
          git config user.email "zcloud-automation@users.noreply.github.com"
          git add artifacts/ops/zssh-ftmo-verify72-runner-recovery.json
          if git diff --cached --quiet; then
            echo "FTMO_VERIFY72_RECEIPT_UNCHANGED=1"
          else
            git commit -m "Record verify72 FTMO runner recovery receipt"
            git push origin HEAD:main
          fi

# verify72 quality-retry recovery probe 2026-10-02T10:03Z
