name: Recover queued FTMO Actions runner

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-runner-listener-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ftmo-runner-listener-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: self-hosted
    timeout-minutes: 4
    steps:
      - name: Verify live zSSH recovery assignment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import urllib.request

          queue_id = "zssh-ftmo-runner-recovery-20261002"
          with urllib.request.urlopen(
              "http://127.0.0.1:8765/api/portfolio-queue?all=1", timeout=10
          ) as response:
              payload = json.load(response)

          def find(value):
              if isinstance(value, dict):
                  if value.get("queue_id") == queue_id:
                      return value
                  for child in value.values():
                      found = find(child)
                      if found:
                          return found
              elif isinstance(value, list):
                  for child in value:
                      found = find(child)
                      if found:
                          return found
              return None

          item = find(payload)
          if not item:
              raise SystemExit(f"{queue_id} is absent from live SQLite queue")
          if str(item.get("project_id") or "").lower() != "zssh":
              raise SystemExit(f"{queue_id} is not owned by zssh")
          if str(item.get("priority") or "").upper() != "P0":
              raise SystemExit(f"{queue_id} is not P0")
          if str(item.get("status") or "").lower() not in {"queued", "claimed", "in_progress"}:
              raise SystemExit(
                  f"{queue_id} is not runnable: status={item.get('status')!r}"
              )
          print(
              "FTMO_RUNNER_RECOVERY_QUEUE_GREEN",
              json.dumps(
                  {
                      "queue_id": queue_id,
                      "status": item.get("status"),
                      "worker_slot": item.get("worker_slot"),
                      "updated_at": item.get("updated_at"),
                  },
                  sort_keys=True,
              ),
          )
          PY

      - name: Recover only the FTMO Actions listener
        shell: bash
        run: |
          set -euo pipefail
          SERVICE=actions.runner.Zennay-Ftmo.vps-bb300bba-ftmo.service
          RUN_USER=ftmo-runner

          pre_state="$(systemctl is-active "$SERVICE" || true)"
          pre_pid="$(systemctl show "$SERVICE" -p MainPID --value || true)"
          worker_before=0
          if pgrep -u "$RUN_USER" -f 'Runner\.Worker' >/dev/null 2>&1; then
            worker_before=1
          fi
          echo "FTMO_RUNNER_PRE state=$pre_state pid=$pre_pid worker=$worker_before"

          action=none
          if [[ "$pre_state" != "active" ]]; then
            sudo -n systemctl reset-failed "$SERVICE" || true
            sudo -n systemctl start "$SERVICE"
            action=start
          elif [[ "$worker_before" -eq 1 ]]; then
            action=preserve-active-worker
          else
            sleep 5
            if pgrep -u "$RUN_USER" -f 'Runner\.Worker' >/dev/null 2>&1; then
              action=preserve-worker-appeared
            else
              sudo -n systemctl restart "$SERVICE"
              action=restart-idle-listener
            fi
          fi

          post_state=""
          for _ in $(seq 1 30); do
            post_state="$(systemctl is-active "$SERVICE" || true)"
            if [[ "$post_state" == "active" ]]; then
              break
            fi
            sleep 2
          done
          test "$post_state" = "active"

          post_pid="$(systemctl show "$SERVICE" -p MainPID --value)"
          [[ "$post_pid" =~ ^[1-9][0-9]*$ ]]
          test -r "/proc/$post_pid/cmdline"
          post_cmdline="$(tr '\0' ' ' < "/proc/$post_pid/cmdline")"
          [[ "$post_cmdline" == *"Runner.Listener"* || "$post_cmdline" == *"runsvc.sh"* ]]

          echo "FTMO_RUNNER_RECOVERY_ACTION=$action"
          echo "FTMO_RUNNER_POST state=$post_state pid=$post_pid"
          systemctl show "$SERVICE" -p ActiveState -p SubState -p MainPID -p NRestarts --no-pager
