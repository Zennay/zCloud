name: Scoped queue governance deploy

on:
  push:
    branches:
      - ops/queue-governance-scoped-live-20261001
    paths:
      - .github/workflows/queue-governance-scoped-live.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: zcloud-queue-governance-scoped-live
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 8
    steps:
      - name: Check out current main candidate
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 64

      - name: Require current main regression green
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current="$(git rev-parse HEAD)"
          remote="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          [[ "$current" == "$remote" ]]
          export CURRENT_SHA="$current"
          python3 - <<'PY'
          import json, os, urllib.request
          repo=os.environ["GITHUB_REPOSITORY"]
          sha=os.environ["CURRENT_SHA"]
          token=os.environ["GH_TOKEN"]
          req=urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/workflows/zcloud-regression-smoke.yml/runs?branch=main&event=push&status=success&per_page=100",
              headers={"Authorization":f"Bearer {token}","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"},
          )
          with urllib.request.urlopen(req,timeout=15) as r:
              payload=json.load(r)
          if not any(x.get("head_sha")==sha and x.get("conclusion")=="success" for x in payload.get("workflow_runs",[])):
              raise SystemExit(f"current main is not regression-green: {sha}")
          print("QUEUE_GOVERNANCE_MAIN_GREEN",sha)
          PY

      - name: Validate queue governance surface
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile server.py
          python3 -m unittest             tests.test_portfolio_queue_backend             tests.test_mobile_runner_controls
          node --check public/app.js
          echo "QUEUE_GOVERNANCE_CANDIDATE_GREEN"

      - name: Promote only queue governance files and verify live
        shell: bash
        run: |
          set -euo pipefail
          root="/home/ubuntu/zennay-cloud"
          service="zennay-cloud.service"
          sentinel="$root/.disable-self-heal"
          candidate_sha="$(git rev-parse HEAD)"
          backup="$HOME/.local/state/zcloud/queue-governance-backups/${candidate_sha}-$(date -u +%Y%m%dT%H%M%SZ)"
          files=(
            server.py
            projects.json
            portfolio_queue.seed.json
            public/app.js
            public/style.css
          )

          current_remote="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          [[ "$candidate_sha" == "$current_remote" ]]

          mkdir -p "$backup"
          created_sentinel=0
          if [[ ! -e "$sentinel" ]]; then
            touch "$sentinel"
            created_sentinel=1
          fi

          rollback() {
            code=$?
            trap - ERR
            echo "QUEUE_GOVERNANCE_ROLLBACK code=$code"
            for f in "${files[@]}"; do
              if [[ -f "$backup/$f" ]]; then
                mkdir -p "$root/$(dirname "$f")"
                cp -a "$backup/$f" "$root/$f"
              elif [[ -f "$backup/.missing-$f" ]]; then
                rm -f "$root/$f"
              fi
            done
            sudo -n systemctl restart "$service" || true
            if [[ "$created_sentinel" == "1" ]]; then rm -f "$sentinel"; fi
            exit "$code"
          }
          trap rollback ERR

          for f in "${files[@]}"; do
            mkdir -p "$backup/$(dirname "$f")"
            if [[ -f "$root/$f" ]]; then
              cp -a "$root/$f" "$backup/$f"
            else
              mkdir -p "$backup/$(dirname ".missing-$f")"
              : > "$backup/.missing-$f"
            fi
            mkdir -p "$root/$(dirname "$f")"
            tmp="$root/$f.queue-governance.$$"
            cp "$GITHUB_WORKSPACE/$f" "$tmp"
            if [[ -f "$root/$f" ]]; then chmod --reference="$root/$f" "$tmp"; fi
            mv -f "$tmp" "$root/$f"
          done

          # If another AI moved main, continue only when these five files are unchanged.
          newest="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [[ "$newest" != "$candidate_sha" ]]; then
            git fetch origin "$newest" --depth=1
            git diff --exit-code "$candidate_sha" "$newest" -- "${files[@]}"
          fi

          sudo -n systemctl restart "$service"

          python3 - <<'PY'
          import json, time, urllib.request
          base="http://127.0.0.1:8765"
          def get(path):
              with urllib.request.urlopen(base+path,timeout=8) as r:
                  return json.load(r)

          status=None
          last=None
          for _ in range(40):
              try:
                  status=get("/api/status")
                  if isinstance(status.get("attention_needed"),list) and isinstance(status.get("portfolio_queue_health"),dict) and not status.get("errors"):
                      break
                  last=status
              except Exception as exc:
                  last=repr(exc)
              time.sleep(1)
          else:
              raise RuntimeError("queue-governance API did not become healthy: "+str(last)[:1200])

          forbidden=("inspect ","audit ","review ","verify ","check ","monitor ","report ","summarize ","status ","superseded ")
          expected={"cloud","ftmo","haxlab","raiseai","supa","zssh"}
          last_state=None
          for _ in range(35):
              status=get("/api/status")
              attention=get("/api/portfolio-attention")
              queue=get("/api/portfolio-queue?all=1")
              runnable=[
                  x for x in queue.get("items",[])
                  if x.get("eligible") and str(x.get("status") or "").lower() in {"queued","claimed","running","verifying"}
              ]
              projects={str(x.get("project_id") or "") for x in runnable}
              missing=sorted(expected-projects)
              human_leak=any(x.get("project_id")=="ulab" for x in runnable)
              bad=[x.get("queue_id") for x in runnable if str(x.get("title") or "").strip().lower().startswith(forbidden)]
              attention_items=attention.get("items") or []
              human_visible=any(x.get("project_id")=="ulab" and x.get("status")=="open" for x in attention_items)
              health=status.get("portfolio_queue_health") or {}
              ready=int(health.get("ready") or 0)
              last_state={
                  "missing":missing,"human_leak":human_leak,"bad":bad,
                  "human_visible":human_visible,"ready":ready,
                  "projects":sorted(projects),
              }
              if not missing and not human_leak and not bad and human_visible and ready>=10:
                  break
              time.sleep(1)
          else:
              raise RuntimeError("queue audit did not converge: "+json.dumps(last_state,sort_keys=True))

          print("QUEUE_GOVERNANCE_LIVE_GREEN",json.dumps({
              "ready":health.get("ready"),
              "projects":sorted(projects),
              "attention_count":len(attention_items),
              "allocation":queue.get("allocation"),
              "notion_attention_url":attention.get("notion_url"),
          },sort_keys=True))
          PY

          trap - ERR
          if [[ "$created_sentinel" == "1" ]]; then rm -f "$sentinel"; fi
          echo "QUEUE_GOVERNANCE_SCOPED_DEPLOY_GREEN"
