name: FTMO PR462 monotonic research-state exact-head proof

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-pr462-monotonic-sync-proof.yml"

permissions:
  contents: read

concurrency:
  group: ftmo-pr462-monotonic-sync-proof
  cancel-in-progress: true

jobs:
  proof:
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 35
    env:
      TARGET_SHA: 9e488119a50f55f21e4bee431354ba8cb9e9196c
      FTMO_AUTONOMOUS_CLOUD_BUDGET_USD: "0.00"
      FTMO_ALLOW_PAID_AWS: ""
    steps:
      - name: Check out exact FTMO PR462 head
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          src="$RUNNER_TEMP/ftmo-pr462-zcloud-proof"
          rm -rf "$src"
          git init -q "$src"
          git -C "$src" remote add origin https://github.com/Zennay/Ftmo.git
          git -C "$src" -c protocol.version=2 fetch -q --depth=1 origin "$TARGET_SHA"
          git -C "$src" checkout -q --detach FETCH_HEAD
          test "$(git -C "$src" rev-parse HEAD)" = "$TARGET_SHA"
          echo "FTMO_PR462_EXACT_SHA=$TARGET_SHA"

      - name: Build isolated test environment
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr462-zcloud-proof"
          venv="$RUNNER_TEMP/ftmo-pr462-zcloud-venv"
          rm -rf "$venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install -q -r "$src/requirements-ci.txt"
          "$venv/bin/python" -m pip install -q -e "$src"

      - name: Prove monotonic sync and deploy boundaries
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr462-zcloud-proof"
          venv="$RUNNER_TEMP/ftmo-pr462-zcloud-venv"
          cd "$src"
          "$venv/bin/python" -m compileall -q \
            src/prop_trading_ai/research/state_sync.py \
            src/prop_trading_ai/research/immutable.py \
            src/prop_trading_ai/research/research_machine.py
          "$venv/bin/python" -m pytest -q \
            tests/test_research_state_sync_guard.py \
            tests/test_autonomous_research_state_sync.py \
            tests/test_autonomous_deploy_lockstep.py
          "$venv/bin/python" -m pytest -q tests/test_zero_cost_workflow_boundary.py \
            -k "research_state_sync or every_repository_workflow_has_no_github_hosted_runner or diagnostic_zero_cost_workflows_are_self_hosted_and_secret_free"
          echo "FTMO_PR462_TARGETED_BOUNDARIES_GREEN=1"

      - name: Run complete suite in memory-bounded file batches
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr462-zcloud-proof"
          venv="$RUNNER_TEMP/ftmo-pr462-zcloud-venv"
          cd "$src"
          "$venv/bin/python" - <<'PY'
          from pathlib import Path
          import contextlib
          import io
          import pytest

          class Collector:
              paths = None
              count = None

              def pytest_collection_finish(self, session):
                  self.count = len(session.items)
                  self.paths = sorted({
                      Path(str(item.path)).resolve().relative_to(Path.cwd().resolve()).as_posix()
                      for item in session.items
                  })

          collector = Collector()
          captured = io.StringIO()
          with contextlib.redirect_stdout(captured), contextlib.redirect_stderr(captured):
              exit_code = pytest.main(["--collect-only", "-q"], plugins=[collector])
          if exit_code != pytest.ExitCode.OK or not collector.paths or not collector.count:
              raise SystemExit("pytest collection failed: " + captured.getvalue()[-2000:])
          Path(".scratch").mkdir(exist_ok=True)
          Path(".scratch/pr462-test-files.txt").write_text(
              "\n".join(collector.paths) + "\n", encoding="utf-8"
          )
          Path(".scratch/pr462-test-count.txt").write_text(
              str(collector.count) + "\n", encoding="utf-8"
          )
          print(f"collected_tests={collector.count}")
          print(f"test_files={len(collector.paths)}")
          PY

          executed=0
          while IFS= read -r test_file; do
            [[ -n "$test_file" ]] || continue
            "$venv/bin/python" -m pytest -q "$test_file"
            executed=$((executed + 1))
          done < .scratch/pr462-test-files.txt
          test "$executed" -gt 0
          echo "FTMO_PR462_FULL_SUITE_GREEN=1"
          echo "planned_collected_tests=$(cat .scratch/pr462-test-count.txt)"
          echo "executed_test_files=$executed"

      - name: Clean isolated proof workspace
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/ftmo-pr462-zcloud-proof" "$RUNNER_TEMP/ftmo-pr462-zcloud-venv"
