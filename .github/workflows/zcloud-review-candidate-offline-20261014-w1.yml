name: zCloud deploy-ops review candidate offline proof (2026-10-14 w1)

on:
  push:
    branches:
      - feat/deployops-review-candidate-admission-20261014-w1

permissions:
  contents: read

jobs:
  offline-review-queue:
    if: ${{ github.repository == 'Zennay/zCloud' && github.ref == 'refs/heads/feat/deployops-review-candidate-admission-20261014-w1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout immutable branch head without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Compile standalone offline verifier
        run: python3 -m py_compile scripts/zcloud_deployops_review_candidates_20261014_w1.py
      - name: Run exact-head isolated offline regressions
        run: python3 -m unittest discover -s tests -p 'test_zcloud_deployops_review_candidates_20261014_w1.py' -v
      - name: Run complete zCloud Python regression suite
        run: python3 -m unittest discover -v
      - name: Run browser and scheduler contract smoke
        run: |
          bash tests/test_birds_eye_review.sh
          bash tests/test_improvement_stopgate_js.sh
          bash tests/test_autonomy_runner_js.sh
          node tests/test_reload_extension.mjs
          node --check firefox-extension/recovery.js
          node --check firefox-extension/background.js
          node tests/test_firefox_recovery.js
          node tests/test_firefox_recovery_contract.js
          node tests/test_worker_tab_reuse.js
          node tests/test_worker_tab_identity_guard.js
          node tests/test_violentmonkey_send_tab_preservation.js
          node --check public/zcloud-worker.user.js
      - name: Confirm no live mutation is permitted
        run: |
          python3 - <<'PY'
          import importlib.util
          from datetime import datetime, timezone
          spec = importlib.util.spec_from_file_location('m','scripts/zcloud_deployops_review_candidates_20261014_w1.py')
          m = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          sha = 'a' * 40
          result = m.snapshot({'main_sha': sha, 'observed_at': datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'), 'inventory': {'prs_complete': True,'branches_complete': True,
              'open_pr_count': 1, 'prless_branch_count': 0},
            'branch_inventory_receipt': {'schema': 'zcloud-prless-branch-snapshot-v1',
              'inventory_complete': True, 'admission_authorized': False,
              'deployment_authorized': False, 'paths_compared': False, 'main_sha': sha,
              'branch_count': 1, 'open_pr_head_count': 1, 'branch_pages': 1, 'pr_pages': 1,
              'pr_less': []},
            'gates': {'580': 'closed','1089': 'closed','1135': 'closed'},
            'prs': [{'number': 12,'head_sha': sha,'base_sha': sha,
              'ancestry_evidence': {'complete': True, 'main_sha': sha, 'head_sha': sha,
                 'merge_base_sha': sha, 'ahead_by': 0, 'behind_by': 0, 'status': 'identical'},
              'draft': False,'owner_approved': True,
              'owner_review_evidence': {'complete': True, 'decision': 'approved', 'dismissed': False,
                  'repository_full_name': 'Zennay/zCloud', 'pr_number': 12, 'review_id': 99012,
                  'author_login': 'project-author', 'reviewer_login': 'independent-reviewer',
                  'reviewed_head_sha': sha,
                  'submitted_at': datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')},
              'files': ['README.md'], 'previous_files': [], 'files_evidence': {'complete': True,
                'total_count': 1, 'rename_sources_complete': True, 'previous_files_total': 0,
                'head_sha': sha, 'base_sha': sha}, 'required_checks': ['unit'],
              'checks': [{'name': 'unit','head_sha': sha,'conclusion': 'success'}]}], 'branches': []})
          assert result['review_candidate_count'] == 1
          assert result['release_authorized'] is False
          assert result['mutations_performed'] is False
          PY
      - name: Publish human-readable non-authorizing proof context
        if: ${{ always() }}
        shell: bash
        run: |
          {
            printf '%s\n' '### zCloud deploy-ops: reviewveiligheid (bronbewijs)'
            printf '%s\n' ''
            printf '%s\n' 'Deze run test een **kunstmatig offline scenario**. Dit is geen echte inventarisatie van open PR’s en geen toestemming om wijzigingen te publiceren.'
            printf '%s\n' ''
            printf '%s\n' 'De tests toetsen volledigheid, bestandsconflicten, hernoemingen, verouderde gegevens en bescherming tegen ongeautoriseerde deployment.'
            printf '%s\n' 'Bekijk de resultaten van de afzonderlijke stappen om te zien of alle controles zijn geslaagd.'
            printf '%s\n' ''
            printf '%s\n' '**Geen VPS-/SQLite-/Firefox-/worker-/queue-/productieactie uitgevoerd door deze workflow.**'
          } >> "$GITHUB_STEP_SUMMARY"
