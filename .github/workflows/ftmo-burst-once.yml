name: FTMO VPS useful-compute rescue
# Worker 4 refresh trigger: 2026-10-02T00:39Z; behavior unchanged.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-burst-once.yml"

permissions:
  contents: write

concurrency:
  group: ftmo-vps-useful-compute-rescue
  cancel-in-progress: true

jobs:
  rescue:
    runs-on: self-hosted
    timeout-minutes: 10
    env:
      FTMO_ROOT: /opt/ftmo-autonomous
    steps:
      - name: Check out exact zCloud main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Prove and rescue FTMO useful CPU
        shell: bash
        run: |
          set -euo pipefail

          test -d "$FTMO_ROOT"
          test -x "$FTMO_ROOT/.venv/bin/python"
          test -f "$FTMO_ROOT/.scratch/autonomy/status.json"
          test -f "$FTMO_ROOT/.scratch/autonomy/deployed-main-sha"

          overlay_root="$GITHUB_WORKSPACE/ops/ftmo-runtime-overlay/1b85e412703f966a2b92d98cfd45cb0ffc47b51e"

          # Repair only the malformed TARGET + literal backslash+n marker from
          # the first overlay attempt. Any other unexpected revision stays fail-closed.
          sudo -n python3 - "$FTMO_ROOT/.scratch/autonomy/deployed-main-sha" <<'PY'
          from pathlib import Path
          import sys
          target = b"1b85e412703f966a2b92d98cfd45cb0ffc47b51e"
          marker = Path(sys.argv[1])
          raw = marker.read_bytes()
          if raw == target + bytes((92, 110)):
              marker.write_bytes(target + bytes((10,)))
              print("FTMO_DEPLOYED_MARKER_NORMALIZED=literal-backslash-n")
          PY

          baseline_completed_at="$("$FTMO_ROOT/.venv/bin/python" - <<'PY'
          import json
          from pathlib import Path
          path = Path("/opt/ftmo-autonomous/.scratch/autonomy/status.json")
          try:
              print(json.loads(path.read_text(encoding="utf-8")).get("completed_at_utc") or "")
          except Exception:
              print("")
          PY
          )"
          export BASELINE_COMPLETED_AT="$baseline_completed_at"

          deployed_before="$(tr -d '\\r\\n' < "$FTMO_ROOT/.scratch/autonomy/deployed-main-sha")"
          if [[ "$deployed_before" == "cba3e2747ed9569e6df247625655e64b14137d07" ]]; then
            sudo -n python3 - "$overlay_root" "$FTMO_ROOT" <<'PY'
          from pathlib import Path
          import hashlib
          import os
          import shutil
          import sys

          overlay = Path(sys.argv[1]).resolve()
          root = Path(sys.argv[2]).resolve()
          expected_root = Path("/opt/ftmo-autonomous")
          if root != expected_root:
              raise SystemExit(f"refusing unexpected FTMO root: {root}")
          files = (
              "scripts/run-autonomous-marathon.sh",
              "src/prop_trading_ai/ops/autonomous_generation_loop.py",
              "src/prop_trading_ai/ops/autonomous_rollover.py",
          )
          for relative in files:
              source = overlay / relative
              target = root / relative
              if source.is_symlink() or not source.is_file():
                  raise SystemExit(f"overlay source missing or unsafe: {relative}")
              if target.parent.resolve() != (root / Path(relative).parent).resolve():
                  raise SystemExit(f"overlay target escaped FTMO root: {relative}")
              temporary = target.with_name(target.name + ".zcloud-overlay.tmp")
              shutil.copyfile(source, temporary)
              temporary.chmod(source.stat().st_mode & 0o777)
              os.replace(temporary, target)
              if hashlib.sha256(source.read_bytes()).digest() != hashlib.sha256(target.read_bytes()).digest():
                  raise SystemExit(f"overlay verification failed: {relative}")
              print(f"FTMO_OVERLAY_FILE_GREEN={relative}")
          marker = root / ".scratch/autonomy/deployed-main-sha"
          temporary_marker = marker.with_name(marker.name + ".zcloud-overlay.tmp")
          temporary_marker.write_bytes(b"1b85e412703f966a2b92d98cfd45cb0ffc47b51e" + bytes((10,)))
          os.replace(temporary_marker, marker)
          PY
            sudo -n "$FTMO_ROOT/.venv/bin/python" -m py_compile \
              "$FTMO_ROOT/src/prop_trading_ai/ops/autonomous_generation_loop.py" \
              "$FTMO_ROOT/src/prop_trading_ai/ops/autonomous_rollover.py"
            sudo -n systemctl restart ftmo-autonomous-marathon.service
            echo "FTMO_RUNTIME_OVERLAY_PROMOTED=1b85e412703f966a2b92d98cfd45cb0ffc47b51e"
          elif [[ "$deployed_before" == "1b85e412703f966a2b92d98cfd45cb0ffc47b51e" ]]; then
            echo "FTMO_RUNTIME_OVERLAY_ALREADY_CURRENT=1b85e412703f966a2b92d98cfd45cb0ffc47b51e"
          else
            echo "Refusing FTMO overlay from unexpected deployed revision: $deployed_before" >&2
            exit 78
          fi

          for relative in \
            scripts/run-autonomous-marathon.sh \
            src/prop_trading_ai/ops/autonomous_generation_loop.py \
            src/prop_trading_ai/ops/autonomous_rollover.py; do
            cmp "$overlay_root/$relative" "$FTMO_ROOT/$relative"
          done
          test "$(tr -d '\\r\\n' < "$FTMO_ROOT/.scratch/autonomy/deployed-main-sha")" = "1b85e412703f966a2b92d98cfd45cb0ffc47b51e"
          deployed_revision="$(tr -d '\r\n' < "$FTMO_ROOT/.scratch/autonomy/deployed-main-sha")"
          test -n "$deployed_revision"
          echo "FTMO_DEPLOYED_RUNTIME_REVISION=$deployed_revision"
          grep -Fq 'top_level_cgroup_cpu_seconds' "$FTMO_ROOT/src/prop_trading_ai/ops/cpu_attribution.py"
          grep -Fq 'user_slice_cpu_seconds' "$FTMO_ROOT/src/prop_trading_ai/ops/cpu_attribution.py"
          grep -Fq 'system_slice_unclassified_cpu_seconds' "$FTMO_ROOT/src/prop_trading_ai/ops/cpu_attribution.py"

          # Main 76bcfefd fixed an interpreter fallback that can leave an older
          # stable copy crash-looping while the dedicated FTMO runner is busy.
          # Apply only that already-merged semantic fix when the exact legacy
          # line is still present; refuse any unknown source shape.
          runtime_py="$FTMO_ROOT/src/prop_trading_ai/ops/autonomous_runtime.py"
          if grep -Fq 'python = os.environ.get("FTMO_PYTHON", "python")' "$runtime_py"; then
            sudo -n python3 - "$runtime_py" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          old = '    python = os.environ.get("FTMO_PYTHON", "python")'
          new = '    python = os.environ.get("FTMO_PYTHON") or str(root / ".venv/bin/python")'
          if text.count(old) != 1:
              raise SystemExit("legacy FTMO Python fallback shape changed; refusing hotfix")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
            echo "FTMO_RUNTIME_HOTFIX=merged-python-fallback-applied"
          elif grep -Fq 'python = _runtime_python()' "$runtime_py" || grep -Fq 'python = os.environ.get("FTMO_PYTHON") or str(root / ".venv/bin/python")' "$runtime_py"; then
            echo "FTMO_RUNTIME_HOTFIX=not-needed"
          else
            echo "FTMO runtime Python fallback is neither known old nor known fixed shape" >&2
            exit 76
          fi
          sudo -n "$FTMO_ROOT/.venv/bin/python" -m py_compile "$runtime_py"

          # The persistent marathon is the source of FTMO compute. Keep the
          # legacy timer disabled so it cannot contend for the same tick lock.
          sudo -n systemctl disable --now ftmo-autonomous.timer || true
          sudo -n systemctl enable --now ftmo-autonomous-marathon.service
          systemctl is-active --quiet ftmo-autonomous-marathon.service

          "$FTMO_ROOT/.venv/bin/python" - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path
          import subprocess
          import time

          root = Path(os.environ["FTMO_ROOT"])
          cgroup_root = Path("/sys/fs/cgroup")
          system_slice = cgroup_root / "system.slice"

          def host_busy_ticks() -> int:
              parts = Path("/proc/stat").read_text(encoding="utf-8").splitlines()[0].split()
              values = [int(value) for value in parts[1:]]
              idle = values[3]
              iowait = values[4] if len(values) > 4 else 0
              return sum(values) - idle - iowait

          def usage_usec(path: Path) -> int:
              values = {}
              for line in path.read_text(encoding="utf-8").splitlines():
                  key, value = line.split(maxsplit=1)
                  values[key] = int(value)
              return values["usage_usec"]

          def units() -> dict[str, int]:
              result: dict[str, int] = {}
              if not system_slice.is_dir():
                  return result
              for unit in sorted(system_slice.iterdir()):
                  stat = unit / "cpu.stat"
                  if unit.is_dir() and unit.name.endswith(".service") and stat.is_file():
                      try:
                          result[unit.name] = usage_usec(stat)
                      except (OSError, KeyError, ValueError):
                          pass
              return result

          def bucket(name: str) -> str:
              lower = name.lower()
              if "haxlab" in lower:
                  return "haxlab"
              if "zcloud" in lower or "zennay-cloud" in lower or "actions.runner" in lower or "github" in lower:
                  return "control_plane"
              if "ftmo" in lower:
                  return "ftmo"
              return "other_systemd"

          def sample(seconds: float = 12.0) -> dict:
              def top_levels() -> dict[str, int]:
                  result: dict[str, int] = {}
                  for group in sorted(cgroup_root.iterdir()):
                      stat = group / "cpu.stat"
                      if group.is_dir() and stat.is_file():
                          try:
                              result[group.name] = usage_usec(stat)
                          except (OSError, KeyError, ValueError):
                              pass
                  return result

              start_wall = time.monotonic()
              start_host = host_busy_ticks()
              start_units = units()
              start_top = top_levels()
              time.sleep(seconds)
              end_wall = time.monotonic()
              end_host = host_busy_ticks()
              end_units = units()
              end_top = top_levels()

              unit_seconds: dict[str, float] = {}
              for name, end in end_units.items():
                  start = start_units.get(name)
                  if start is None or end < start:
                      continue
                  delta = (end - start) / 1_000_000.0
                  if delta > 0:
                      unit_seconds[name] = delta

              buckets = {"ftmo": 0.0, "haxlab": 0.0, "control_plane": 0.0, "other_systemd": 0.0}
              for name, seconds_used in unit_seconds.items():
                  buckets[bucket(name)] += seconds_used

              top_delta: dict[str, float] = {}
              for name, end in end_top.items():
                  start = start_top.get(name)
                  if start is None or end < start:
                      continue
                  delta = (end - start) / 1_000_000.0
                  if delta > 0:
                      top_delta[name] = delta

              wall = end_wall - start_wall
              ticks = int(os.sysconf("SC_CLK_TCK"))
              cpus = os.cpu_count() or 1
              host_busy = max(0, end_host - start_host) / ticks
              attributed = sum(buckets.values())
              system_slice_seconds = top_delta.get("system.slice", 0.0)
              user_slice_seconds = top_delta.get("user.slice", 0.0)
              machine_slice_seconds = top_delta.get("machine.slice", 0.0)
              other_top_level_seconds = sum(
                  value for name, value in top_delta.items()
                  if name not in {"system.slice", "user.slice", "machine.slice"}
              )
              system_slice_unclassified = max(0.0, system_slice_seconds - attributed)
              top_level_accounted = sum(top_delta.values())
              unattributed = max(0.0, host_busy - top_level_accounted)
              competitors = {
                  "haxlab": buckets["haxlab"],
                  "control_plane": buckets["control_plane"],
                  "other_systemd": buckets["other_systemd"],
                  "system_slice_unclassified": system_slice_unclassified,
                  "user_slice": user_slice_seconds,
                  "machine_slice": machine_slice_seconds,
                  "other_top_level": other_top_level_seconds,
                  "unattributed_host": unattributed,
              }
              competitor, competitor_seconds = max(competitors.items(), key=lambda item: item[1])
              top = [
                  {"unit": name, "cpu_seconds": round(seconds_used, 6), "bucket": bucket(name)}
                  for name, seconds_used in sorted(unit_seconds.items(), key=lambda item: item[1], reverse=True)[:15]
              ]
              return {
                  "sample_seconds": round(wall, 6),
                  "logical_cpus": cpus,
                  "host_busy_cpu_seconds": round(host_busy, 6),
                  "host_capacity_cpu_seconds": round(wall * cpus, 6),
                  "bucket_cpu_seconds": {key: round(value, 6) for key, value in buckets.items()},
                  "top_level_cgroup_cpu_seconds": {key: round(value, 6) for key, value in top_delta.items()},
                  "system_slice_cpu_seconds": round(system_slice_seconds, 6),
                  "system_slice_unclassified_cpu_seconds": round(system_slice_unclassified, 6),
                  "user_slice_cpu_seconds": round(user_slice_seconds, 6),
                  "machine_slice_cpu_seconds": round(machine_slice_seconds, 6),
                  "other_top_level_cpu_seconds": round(other_top_level_seconds, 6),
                  "unattributed_host_cpu_seconds": round(unattributed, 6),
                  "ftmo_busy_cpu_share": round(buckets["ftmo"] / host_busy, 6) if host_busy else 0.0,
                  "ftmo_host_capacity_share": round(buckets["ftmo"] / (wall * cpus), 6) if wall else 0.0,
                  "primary_competitor_bucket": competitor,
                  "primary_competitor_cpu_seconds": round(competitor_seconds, 6),
                  "ftmo_primary_attributed_compute": buckets["ftmo"] > 0 and buckets["ftmo"] > competitor_seconds,
                  "top_systemd_units": top,
              }

          def run(*args: str) -> subprocess.CompletedProcess[str]:
              return subprocess.run(args, text=True, capture_output=True, check=False, timeout=30)

          pre = sample()
          rescue_applied = not pre["ftmo_primary_attributed_compute"]
          rescue_actions: list[str] = []

          if rescue_applied:
              commands = [
                  ("ftmo-priority", "sudo", "-n", "systemctl", "set-property", "--runtime",
                   "ftmo-autonomous-marathon.service", "CPUWeight=10000", "CPUQuota=500%"),
              ]
              for label, *cmd in commands:
                  result = run(*cmd)
                  if result.returncode != 0:
                      raise SystemExit(f"{label} failed: {result.stderr.strip()}")
                  rescue_actions.append(label)

              for unit in (
                  "haxlab-autonomy.service",
                  "haxlab-live-room.service",
                  "haxlab-worker.service",
                  "haxlab-analyzer.service",
                  "haxlab-ingest.service",
              ):
                  loaded = run("systemctl", "show", unit, "--property=LoadState", "--value")
                  if loaded.returncode == 0 and loaded.stdout.strip() == "loaded":
                      result = run(
                          "sudo", "-n", "systemctl", "set-property", "--runtime",
                          unit, "CPUWeight=100", "CPUQuota=100%"
                      )
                      if result.returncode != 0:
                          raise SystemExit(f"haxlab cap failed for {unit}: {result.stderr.strip()}")
                      rescue_actions.append(f"haxlab-cap:{unit}")

              # If user.slice is consuming more than one CPU on average, cap
              # only the managed Firefox user-service rather than the whole
              # interactive session. This is runtime-only and reversible.
              if float(pre.get("user_slice_cpu_seconds") or 0.0) > float(pre.get("sample_seconds") or 1.0):
                  uid = run("id", "-u", "ubuntu").stdout.strip()
                  if not uid.isdigit():
                      raise SystemExit(f"cannot resolve ubuntu uid: {uid!r}")
                  user_env = (
                      "env",
                      f"XDG_RUNTIME_DIR=/run/user/{uid}",
                      f"DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/{uid}/bus",
                  )
                  loaded = run(
                      "sudo", "-n", "-u", "ubuntu", *user_env,
                      "systemctl", "--user", "show", "chatgpt-firefox.service",
                      "--property=LoadState", "--value"
                  )
                  if loaded.returncode == 0 and loaded.stdout.strip() == "loaded":
                      result = run(
                          "sudo", "-n", "-u", "ubuntu", *user_env,
                          "systemctl", "--user", "set-property", "--runtime",
                          "chatgpt-firefox.service", "CPUWeight=50", "CPUQuota=100%"
                      )
                      if result.returncode != 0:
                          raise SystemExit(f"Firefox cap failed: {result.stderr.strip()}")
                      rescue_actions.append("firefox-cap:chatgpt-firefox.service:100%")

              restarted = run("sudo", "-n", "systemctl", "restart", "ftmo-autonomous-marathon.service")
              if restarted.returncode != 0:
                  raise SystemExit(f"FTMO restart failed: {restarted.stderr.strip()}")
              rescue_actions.append("ftmo-restart")
              time.sleep(3)

          status_path = root / ".scratch/autonomy/status.json"
          baseline_completed_at = os.environ.get("BASELINE_COMPLETED_AT", "")
          fresh_after_restart = False
          status: dict = {}
          deadline = time.monotonic() + 150.0
          while time.monotonic() < deadline:
              try:
                  status = json.loads(status_path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError):
                  time.sleep(2)
                  continue
              completed_at = str(status.get("completed_at_utc") or "")
              if completed_at and completed_at != baseline_completed_at:
                  fresh_after_restart = True
                  break
              time.sleep(2)

          post = sample()

          status = json.loads(status_path.read_text(encoding="utf-8"))
          research = status.get("research") or {}
          controller = status.get("research_controller") or {}
          generation_loop = controller.get("generation_loop") or {}
          service = {
              "active_state": run("systemctl", "show", "ftmo-autonomous-marathon.service", "--property=ActiveState", "--value").stdout.strip(),
              "sub_state": run("systemctl", "show", "ftmo-autonomous-marathon.service", "--property=SubState", "--value").stdout.strip(),
              "control_group": run("systemctl", "show", "ftmo-autonomous-marathon.service", "--property=ControlGroup", "--value").stdout.strip(),
              "cpu_weight": run("systemctl", "show", "ftmo-autonomous-marathon.service", "--property=CPUWeight", "--value").stdout.strip(),
              "cpu_quota_per_sec_usec": run("systemctl", "show", "ftmo-autonomous-marathon.service", "--property=CPUQuotaPerSecUSec", "--value").stdout.strip(),
          }

          receipt = {
              "schema_version": 1,
              "scope": "zcloud-ftmo-useful-compute-rescue",
              "required_attribution_ancestor": "0acfac83eff1136bdce1bfbde6e52b6905ccf1fc",
              "deployed_runtime_revision": (root / ".scratch/autonomy/deployed-main-sha").read_text(encoding="utf-8").strip(),
              "pre_attribution": pre,
              "rescue_applied": rescue_applied,
              "rescue_actions": rescue_actions,
              "post_attribution": post,
              "service": service,
              "runtime_error": status.get("error"),
              "paper_forward_shadow": status.get("paper_forward_shadow"),
              "controller_receipt": {
                  "completed_at_utc": status.get("completed_at_utc"),
                  "ok": status.get("ok"),
                  "generation_number": research.get("generation_number"),
                  "generation_id": research.get("generation_id"),
                  "next_stage": research.get("next_stage"),
                  "controller_action": controller.get("action"),
                  "controller_compute": controller.get("compute"),
                  "fresh_after_restart": fresh_after_restart,
                  "generation_loop_action": generation_loop.get("action"),
                  "generation_loop_stage": generation_loop.get("stage"),
                  "generation_loop_outcomes_executed": generation_loop.get("outcomes_executed"),
                  "research_outcomes_executed": (controller.get("outcome_execution") or {}).get("research_outcomes_executed"),
              },
              "autonomous_cloud_budget_usd": status.get("autonomous_cloud_budget_usd"),
              "broker_order_submission_allowed": status.get("broker_order_submission_allowed"),
              "live_trading_allowed": status.get("live_trading_allowed"),
          }

          target = Path("/tmp/zcloud-ftmo-cpu-rescue.json")
          target.write_text(json.dumps(receipt, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          print("FTMO_CPU_RESCUE_RECEIPT=" + json.dumps(receipt, sort_keys=True))

          PY

          echo "=== FTMO / HAXLAB PROCESS SNAPSHOT ==="
          ps -eo pid,ppid,user,cgroup,comm,%cpu,%mem,etime --sort=-%cpu | head -n 35
          echo "=== CGROUP CPU SNAPSHOT ==="
          systemd-cgtop -b -n 1 --depth=5 --order=cpu 2>/dev/null | head -n 60 || true
          echo "=== FTMO MARATHON STATE ==="
          systemctl show ftmo-autonomous-marathon.service \
            -p ActiveState -p SubState -p Result -p ExecMainCode -p ExecMainStatus \
            -p NRestarts -p MainPID -p ControlGroup --no-pager || true
          echo "=== FTMO MARATHON JOURNAL ==="
          sudo -n journalctl -u ftmo-autonomous-marathon.service -n 160 --no-pager || true

          python3 - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path("/tmp/zcloud-ftmo-cpu-rescue.json").read_text(encoding="utf-8"))
          if receipt["broker_order_submission_allowed"] is not False:
              raise SystemExit("broker order boundary changed")
          if receipt["live_trading_allowed"] is not False:
              raise SystemExit("live trading boundary changed")
          if receipt["service"]["active_state"] != "active":
              raise SystemExit(f"FTMO marathon is not active: {receipt['service']}")
          controller = receipt["controller_receipt"]
          if controller.get("fresh_after_restart") is not True:
              raise SystemExit("controller receipt is not fresh after the runtime restart")
          provider_retry = (
              controller.get("generation_loop_action")
              == "provider_foundation_provider_unavailable_retry_later"
              and controller.get("generation_loop_outcomes_executed") is False
          )
          advanced_compute = (controller.get("controller_compute") or {}).get("ok") is True
          if not (provider_retry or advanced_compute):
              raise SystemExit("neither advanced compute nor a sealed provider retry was proven")
          if receipt["post_attribution"]["ftmo_primary_attributed_compute"] is not True:
              if not (provider_retry and receipt.get("rescue_applied") is True):
                  raise SystemExit("FTMO is still not primary without a sealed external-provider retry after rescue")
              print("FTMO_EXTERNAL_PROVIDER_WAIT_GREEN=outcome-free retry + bounded CPU rescue")
          PY

      - name: Persist sanitized CPU proof receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/zcloud-ftmo-cpu-rescue.json
          git fetch origin main
          git reset --hard origin/main
          mkdir -p artifacts/ops
          cp /tmp/zcloud-ftmo-cpu-rescue.json artifacts/ops/ftmo-vps-cpu-attribution-proof.json
          git config user.name "zcloud-automation"
          git config user.email "zcloud-automation@users.noreply.github.com"
          git add artifacts/ops/ftmo-vps-cpu-attribution-proof.json
          if git diff --cached --quiet; then
            echo "CPU proof receipt unchanged"
          else
            git commit -m "Record FTMO VPS CPU attribution proof"
            git push origin HEAD:main
          fi
