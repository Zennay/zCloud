name: FTMO runner self-health safety contract

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-runner-self-health-proof-20261002.yml"
      - "tests/test_ftmo_pr507_runner_lane.py"
      - ".github/workflows/ftmo-runner-self-health-contract.yml"

permissions:
  contents: read

concurrency:
  group: ftmo-runner-self-health-contract-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out exact candidate revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 1

      - name: Run focused contract
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python3 -m unittest -v tests.test_ftmo_pr507_runner_lane

  prove:
    needs: validate
    if: >-
      github.actor == github.repository_owner &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 4
    steps:
      - name: Check out exact candidate revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 1

      - name: Prove permanent zCloud VPS runner identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(id -un)" = "ubuntu"
          test "$(hostname)" = "vps-bb300bba"
          python3 scripts/zcloud_vps_runner_guard.py --json

      - name: Re-run focused contract on permanent VPS
        run: |
          set -euo pipefail
          python3 -m unittest -v tests.test_ftmo_pr507_runner_lane
          echo "FTMO_RUNNER_SELF_HEALTH_CONTRACT_GREEN=1"
