name: Repair FTMO stable-root publication permissions

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-stable-root-permission-repair.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ftmo-stable-root-permission-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 12
    env:
      FTMO_ROOT: /opt/ftmo-autonomous
      FTMO_MAIN_SHA: e5363979dd40097ede98234554ed49b262514fa1
    steps:
      - name: Checkout zCloud receipt workspace
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Repair only unsafe stable-root directory write bits
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          test -d "$FTMO_ROOT"
          test ! -L "$FTMO_ROOT"
          test "$(stat -c %U "$FTMO_ROOT")" = "ftmo-runner"

          before_config_sha="$(sha256sum "$FTMO_ROOT/configs/research_machine.json" | awk '{print $1}')"
          before_status_sha="$(sha256sum "$FTMO_ROOT/.scratch/autonomy/status.json" | awk '{print $1}')"

          mapfile -t unsafe < <(
            sudo -n find "$FTMO_ROOT" \
              -path "$FTMO_ROOT/.venv" -prune -o \
              -type d -user ftmo-runner -perm /022 -print
          )
          printf '%s\n' "${unsafe[@]}" | sed '/^$/d' > /tmp/ftmo-unsafe-dirs-before.txt
          echo "unsafe_directory_count_before=${#unsafe[@]}"

          for directory in "${unsafe[@]}"; do
            test -n "$directory"
            test ! -L "$directory"
            case "$directory" in
              "$FTMO_ROOT"|"$FTMO_ROOT"/*) ;;
              *) echo "refusing out-of-root path: $directory" >&2; exit 1 ;;
            esac
            test "$(stat -c %U "$directory")" = "ftmo-runner"
            sudo -n chmod go-w "$directory"
          done

          remaining="$(sudo -n find "$FTMO_ROOT" \
            -path "$FTMO_ROOT/.venv" -prune -o \
            -type d -user ftmo-runner -perm /022 -print | wc -l)"
          test "$remaining" -eq 0

          after_config_sha="$(sha256sum "$FTMO_ROOT/configs/research_machine.json" | awk '{print $1}')"
          after_status_sha="$(sha256sum "$FTMO_ROOT/.scratch/autonomy/status.json" | awk '{print $1}')"
          test "$before_config_sha" = "$after_config_sha"
          test "$before_status_sha" = "$after_status_sha"

          echo "FTMO_CONFIG_SHA=$after_config_sha" >> "$GITHUB_ENV"
          echo "FTMO_STATUS_SHA=$after_status_sha" >> "$GITHUB_ENV"
          echo "FTMO_REPAIRED_DIRS=${#unsafe[@]}" >> "$GITHUB_ENV"

      - name: Prove Gen30 state and descriptor-bound reads
        shell: bash
        run: |
          set -euo pipefail
          work="/tmp/ftmo-permission-proof-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          rm -rf "$work"
          git init -q "$work"
          git -C "$work" remote add origin https://github.com/Zennay/Ftmo.git
          git -C "$work" -c protocol.version=2 fetch -q --depth=1 origin "$FTMO_MAIN_SHA"
          git -C "$work" checkout -q --detach FETCH_HEAD
          test "$(git -C "$work" rev-parse HEAD)" = "$FTMO_MAIN_SHA"
          chmod -R a+rX "$work"

          sudo -n -u ftmo-runner env PYTHONPATH="$work/src" FTMO_ROOT="$FTMO_ROOT" python3 - <<'PY'
          import json, os
          from pathlib import Path
          from prop_trading_ai.ops.deploy_publish import read_existing_file_bytes
          from prop_trading_ai.research.research_machine import load_generation_layout_bytes, decide_research_stage

          root = Path(os.environ["FTMO_ROOT"])
          config_bytes = read_existing_file_bytes(root=root, relative="configs/research_machine.json")
          assert config_bytes is not None
          layout = load_generation_layout_bytes(config_bytes)
          assert layout.generation_number == 30, layout
          assert layout.generation_id == "eurusd-fxcm-g30-chronological-2026-q4-v1-alpha-30", layout
          decision = decide_research_stage(root, layout)
          assert decision.stage.value == "provider_foundation", decision
          assert decision.development_access_allowed is False
          assert decision.walk_forward_access_allowed is False
          assert decision.final_holdout_access_allowed is False

          for relative in (
              "src/prop_trading_ai/research/immutable.py",
              "src/prop_trading_ai/research/research_machine.py",
              "src/prop_trading_ai/ops/deploy_publish.py",
          ):
              payload = read_existing_file_bytes(root=root, relative=relative)
              assert payload is not None and payload, relative

          status = json.loads((root / ".scratch/autonomy/status.json").read_text(encoding="utf-8"))
          assert status["research"]["generation_id"] == layout.generation_id, status["research"]
          assert status["research"]["walk_forward_access_allowed"] is False
          assert status["research"]["final_holdout_access_allowed"] is False
          print("FTMO_STABLE_PERMISSION_REPAIR_PROOF=success")
          PY

      - name: Dispatch repaired research-state sync
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/Zennay/Ftmo/commits/main --jq .sha)" = "$FTMO_MAIN_SHA"
          gh workflow run sync-autonomous-research-state.yml --repo Zennay/Ftmo --ref main
          echo "FTMO_REPAIRED_SYNC_DISPATCHED=1"

      - name: Persist repair receipt
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          mkdir -p runtime-evidence
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          payload = {
              "schema_version": 1,
              "project": "ftmo",
              "scope": "stable-root-publication-permission-repair",
              "ftmo_main_sha": os.environ["FTMO_MAIN_SHA"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "runner": os.environ.get("RUNNER_NAME", ""),
              "host": "vps-bb300bba",
              "repaired_directory_count": int(os.environ["FTMO_REPAIRED_DIRS"]),
              "config_sha256_after": os.environ["FTMO_CONFIG_SHA"],
              "status_sha256_after": os.environ["FTMO_STATUS_SHA"],
              "generation_number_verified": 30,
              "provider_io_forced": False,
              "walk_forward_accessed": False,
              "final_holdout_accessed": False,
              "live_or_broker_access_opened": False,
              "paid_cloud_budget_usd": "0.00",
              "result": "success",
          }
          Path("runtime-evidence/ftmo-stable-root-permission-repair.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime-evidence/ftmo-stable-root-permission-repair.json
          git commit -m "Record FTMO stable-root permission repair"
          git push origin HEAD:main

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -rf "/tmp/ftmo-permission-proof-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
