name: FTMO PR421 exact-head Jetta transport proof

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-pr421-jetta-transport-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ftmo-pr421-exact-head-jetta-transport-proof
  cancel-in-progress: false

jobs:
  proof:
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 18
    env:
      TARGET_SHA: 44c28172f2d6db168f0d3271bf859fb43b82e3d5
    steps:
      - name: Fetch exact FTMO PR421 head
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          src="$RUNNER_TEMP/ftmo-pr421-proof"
          rm -rf "$src"
          gh repo clone Zennay/Ftmo "$src" -- --filter=blob:none --no-checkout >/dev/null
          git -C "$src" checkout --detach "$TARGET_SHA" >/dev/null
          test "$(git -C "$src" rev-parse HEAD)" = "$TARGET_SHA"
          echo "FTMO_PR421_EXACT_SHA=$TARGET_SHA"

      - name: Install isolated test environment
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr421-proof"
          venv="$RUNNER_TEMP/ftmo-pr421-proof-venv"
          rm -rf "$venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install -q -r "$src/requirements-ci.txt"
          "$venv/bin/python" -m pip install -q -e "$src"

      - name: Compile Jetta provider boundary
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr421-proof"
          venv="$RUNNER_TEMP/ftmo-pr421-proof-venv"
          cd "$src"
          "$venv/bin/python" -m compileall -q src/prop_trading_ai/data/market/providers/dukascopy_jetta.py
          echo "FTMO_PR421_COMPILE_GREEN=1"

      - name: Prove Jetta transport and decoder integrity
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr421-proof"
          venv="$RUNNER_TEMP/ftmo-pr421-proof-venv"
          cd "$src"
          "$venv/bin/python" -m pytest -q \
            tests/test_dukascopy_jetta.py \
            tests/test_dukascopy_jetta_m1.py
          echo "FTMO_PR421_JETTA_TESTS_GREEN=1"

      - name: Prove adjacent sealed provider boundaries
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr421-proof"
          venv="$RUNNER_TEMP/ftmo-pr421-proof-venv"
          cd "$src"
          "$venv/bin/python" -m pytest -q \
            tests/test_autonomous_provider_retry.py \
            tests/test_autonomous_deploy_lockstep.py \
            tests/test_zero_cost_workflow_boundary.py
          echo "FTMO_PR421_BOUNDARIES_GREEN=1"

      - name: Record proof identity
        shell: bash
        run: |
          set -euo pipefail
          echo "FTMO_PR421_PROOF_RUN_ID=$GITHUB_RUN_ID"
          echo "FTMO_PR421_PROOF_RESULT=success"
          echo "FTMO_PR421_TARGET_SHA=$TARGET_SHA"
