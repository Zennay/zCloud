name: zCloud capability dependency DAG

on:
  pull_request:
    paths:
      - "scripts/zcloud_capability_dependency_dag.py"
      - "tests/test_capability_dependency_dag.py"
      - ".github/workflows/zcloud-capability-dependency-dag.yml"
  push:
    branches: [main]
    paths:
      - "scripts/zcloud_capability_dependency_dag.py"
      - "tests/test_capability_dependency_dag.py"
      - ".github/workflows/zcloud-capability-dependency-dag.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zcloud-capability-dependency-dag-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 1

      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Run focused dependency DAG regressions
        run: |
          set -euo pipefail
          python3 -m unittest -v tests.test_capability_dependency_dag
          python3 -m py_compile scripts/zcloud_capability_dependency_dag.py
          echo "ZCLOUD_CAPABILITY_DEPENDENCY_DAG_GREEN=1"
