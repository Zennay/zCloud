name: PWQ-24 release lane unblock

on:
  push:
    branches:
      - ops/pwq24-release-lane-unblock-20261005
    paths:
      - .github/workflows/pwq24-release-lane-unblock-20261005.yml

permissions:
  actions: write
  contents: read

jobs:
  cancel-merged-fix-branch-runs:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      EXPECTED_MAIN: 7574568dec8fd26b037170cc64d9fb8acec69b8c
      CURRENT_DEPLOY_RUN: "37303400701"
      STALE_BRANCH: fix/pwq24-receipt-warmup-retry-20261005
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Guard exact release owner
        shell: bash
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          main="$(gh api "repos/${repo}/branches/main" --jq '.commit.sha')"
          test "${main}" = "${EXPECTED_MAIN}"
          name="$(gh api "repos/${repo}/actions/runs/${CURRENT_DEPLOY_RUN}" --jq '.name')"
          sha="$(gh api "repos/${repo}/actions/runs/${CURRENT_DEPLOY_RUN}" --jq '.head_sha')"
          status="$(gh api "repos/${repo}/actions/runs/${CURRENT_DEPLOY_RUN}" --jq '.status')"
          test "${name}" = "zCloud VPS deploy"
          test "${sha}" = "${EXPECTED_MAIN}"
          case "${status}" in queued|in_progress|pending|waiting) ;; *) echo "deploy not waiting: ${status}"; exit 1;; esac
          echo "PWQ24_RELEASE_OWNER_GREEN main=${main} deploy=${CURRENT_DEPLOY_RUN} status=${status}"

      - name: Cancel exact stale merged-fix runs
        shell: bash
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          cancel_exact() {
            local id="$1" expected="$2"
            local name branch status
            name="$(gh api "repos/${repo}/actions/runs/${id}" --jq '.name')"
            branch="$(gh api "repos/${repo}/actions/runs/${id}" --jq '.head_branch')"
            status="$(gh api "repos/${repo}/actions/runs/${id}" --jq '.status')"
            test "${name}" = "${expected}" || { echo "name mismatch id=${id} got=${name}"; exit 1; }
            test "${branch}" = "${STALE_BRANCH}" || { echo "branch mismatch id=${id} got=${branch}"; exit 1; }
            case "${status}" in
              queued|in_progress|pending|waiting)
                echo "CANCEL_STALE_FIX id=${id} name=${name} status=${status}"
                gh api --method POST "repos/${repo}/actions/runs/${id}/cancel" >/dev/null
                ;;
              completed) echo "ALREADY_TERMINAL id=${id} name=${name}" ;;
              *) echo "unknown status id=${id} status=${status}"; exit 1 ;;
            esac
          }
          cancel_exact 37303082340 "zCloud dashboard access recovery"
          cancel_exact 37303082451 "zCloud live dynamic worker debug"
          cancel_exact 37303082480 "zCloud VPS execution lane probe"
          cancel_exact 37303082341 "zCloud cross-runner listener proof"

      - name: Verify stale branch no longer owns release lane
        shell: bash
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          ids=(37303082340 37303082451 37303082480 37303082341)
          for attempt in {1..12}; do
            live=0
            line=""
            for id in "${ids[@]}"; do
              status="$(gh api "repos/${repo}/actions/runs/${id}" --jq '.status')"
              line+=" ${id}=${status}"
              [[ "${status}" = completed ]] || live=1
            done
            deploy="$(gh api "repos/${repo}/actions/runs/${CURRENT_DEPLOY_RUN}" --jq '.status')"
            echo "VERIFY attempt=${attempt}${line} deploy=${deploy}"
            if [[ "${live}" -eq 0 ]]; then
              echo "PWQ24_MERGED_FIX_LANE_UNBLOCK_GREEN deploy=${CURRENT_DEPLOY_RUN} status=${deploy}"
              exit 0
            fi
            sleep 5
          done
          exit 1
