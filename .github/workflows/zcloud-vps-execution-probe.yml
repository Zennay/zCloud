name: zCloud VPS execution lane probe

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["zCloud VPS deploy"]
    types: [completed]
  pull_request:
    branches: [main]
    paths:
      - vps-execution-policy.json
      - scripts/zcloud_vps_execution_probe.sh
      - scripts/zcloud_vps_runner_guard.py
      - scripts/zcloud_vps_deploylane_coordination.py
      - scripts/zcloud_transactional_promote.py
      - scripts/zcloud_deploy_safe_idle.py
      - tests/test_deploy_safe_idle.py
      - tests/test_transactional_promote.py
      - tests/test_vps_runner_guard.py
      - server.py
      - .github/workflows/zcloud-vps-deploy.yml
      - .github/workflows/zcloud-vps-execution-probe.yml

permissions:
  contents: read

env:
  ZCLOUD_RUN_STATE_DIR: /home/ubuntu/.local/state/zcloud/actions/${{ github.run_id }}-${{ github.run_attempt }}

concurrency:
  group: zcloud-vps-execution-probe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 5
    steps:
      - name: Check out the zCloud control plane
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          clean: true
          fetch-depth: 513
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Prepare stable probe state
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 0700 "$ZCLOUD_RUN_STATE_DIR"
          echo "ZCLOUD_STABLE_STATE_READY path=$ZCLOUD_RUN_STATE_DIR"

      - name: Enforce permanent zCloud VPS runner identity
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/zcloud_vps_runner_guard.py --json \
            | tee "$ZCLOUD_RUN_STATE_DIR/zcloud-vps-runner-guard.json"

      - name: Acquire cloud deploylane coordination claim
        id: claim
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/zcloud_vps_deploylane_coordination.py acquire \
            | tee "$ZCLOUD_RUN_STATE_DIR/zcloud-deploylane-claim.jsonl"

      - name: Verify portfolio queue allocator on VPS runner
        run: |
          set -euo pipefail
          python3 -m unittest -v tests.test_portfolio_queue_backend

      - name: Inspect sanitized deploy pre-change evidence
        run: |
          set -euo pipefail
          python3 scripts/zcloud_prechange_evidence.py \
            --candidate "$GITHUB_WORKSPACE" \
            | tee "$ZCLOUD_RUN_STATE_DIR/zcloud-prechange-evidence.json"

      - name: Probe shared VPS execution capabilities
        run: |
          set -euo pipefail
          bash scripts/zcloud_vps_execution_probe.sh \
            | tee "$ZCLOUD_RUN_STATE_DIR/zcloud-vps-execution-probe.log"

      - name: Verify cloud deploylane claim is still exact
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/zcloud_vps_deploylane_coordination.py verify \
            | tee -a "$ZCLOUD_RUN_STATE_DIR/zcloud-deploylane-claim.jsonl"

      - name: Release cloud deploylane coordination claim
        if: always() && github.event_name != 'pull_request' && steps.claim.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/zcloud_vps_deploylane_coordination.py release \
            | tee -a "$ZCLOUD_RUN_STATE_DIR/zcloud-deploylane-claim.jsonl"

      - name: Diagnose runner workspace isolation
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          out="$ZCLOUD_RUN_STATE_DIR/zcloud-runner-topology.txt"
          {
            echo "RUNNER_NAME=$RUNNER_NAME"
            echo "RUNNER_TEMP=$RUNNER_TEMP"
            echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
            echo "HOST=$(hostname)"
            echo "=== ACTIONS RUNNER UNITS ==="
            systemctl --no-pager --all --type=service | grep -F 'actions.runner.' || true
            echo "=== RUNNER PROCESSES ==="
            ps -eo pid=,ppid=,user=,lstart=,cmd= | grep -E 'Runner\.(Listener|Worker)|runsvc\.sh' | grep -v grep || true
            echo "=== RUNNER CWD ==="
            for pid in $(pgrep -f 'Runner\.(Listener|Worker)|runsvc\.sh' || true); do
              printf 'pid=%s cwd=' "$pid"
              readlink -f "/proc/$pid/cwd" || true
            done
            echo "=== TEMP PRESENCE ==="
            test -d "$RUNNER_TEMP" && echo "runner_temp=present" || echo "runner_temp=missing"
            test -d "$ZCLOUD_RUN_STATE_DIR" && echo "stable_state=present" || echo "stable_state=missing"
          } | tee "$out"

      - name: Upload sanitized deploylane evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zcloud-vps-deploylane-evidence-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ env.ZCLOUD_RUN_STATE_DIR }}/zcloud-deploylane-claim.jsonl
            ${{ env.ZCLOUD_RUN_STATE_DIR }}/zcloud-vps-execution-probe.log
            ${{ env.ZCLOUD_RUN_STATE_DIR }}/zcloud-vps-runner-guard.json
            ${{ env.ZCLOUD_RUN_STATE_DIR }}/zcloud-prechange-evidence.json
            ${{ env.ZCLOUD_RUN_STATE_DIR }}/zcloud-runner-topology.txt

      - name: Cleanup stable probe state
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          case "$ZCLOUD_RUN_STATE_DIR" in
            /home/ubuntu/.local/state/zcloud/actions/*) ;;
            *) echo "Refusing unsafe cleanup path: $ZCLOUD_RUN_STATE_DIR" >&2; exit 2 ;;
          esac
          rm -rf -- "$ZCLOUD_RUN_STATE_DIR"
