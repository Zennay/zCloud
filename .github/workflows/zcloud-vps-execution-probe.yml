name: zCloud VPS execution lane probe

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/zcloud_runtime_project_schema_repair.py
      - tests/test_runtime_project_schema_repair.py
      - tests/test_vps_deploy_workflow.py
      - .github/workflows/zcloud-vps-execution-probe.yml
  workflow_run:
    workflows: ["zCloud VPS deploy"]
    types: [completed]
  pull_request:
    branches: [main]
    paths:
      - vps-execution-policy.json
      - scripts/zcloud_vps_execution_probe.sh
      - scripts/zcloud_vps_runner_guard.py
      - scripts/zcloud_vps_deploylane_coordination.py
      - scripts/zcloud_transactional_promote.py
      - scripts/zcloud_recovery.py
      - scripts/zcloud_safe_idle_retry_wait.py
      - scripts/zcloud_deploy_safe_idle.py
      - scripts/zcloud_runtime_project_schema_repair.py
      - tests/test_deploy_safe_idle.py
      - tests/test_runtime_project_schema_repair.py
      - tests/test_transactional_promote.py
      - tests/test_zcloud_recovery.py
      - tests/test_safe_idle_retry_wait.py
      - tests/test_safe_idle_retry_workflow.py
      - tests/test_vps_runner_guard.py
      - server.py
      - .github/workflows/zcloud-vps-deploy.yml
      - .github/workflows/zcloud-safe-idle-retry.yml
      - .github/workflows/zcloud-vps-execution-probe.yml

permissions:
  contents: read

env:
  ZCLOUD_RUN_STATE_DIR: /home/ubuntu/.local/state/zcloud/actions/${{ github.run_id }}-${{ github.run_attempt }}

concurrency:
  group: zcloud-vps-execution-probe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  project-schema-repair:
    if: github.event_name == 'push'
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 5
    steps:
      - name: Check out exact pushed revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          clean: true

      - name: Enforce permanent zCloud VPS runner identity
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/zcloud_vps_runner_guard.py --json

      - name: Verify runtime project-schema migration
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v \
            tests.test_runtime_project_schema_repair \
            tests.test_vps_deploy_workflow

  probe:
    if: github.event_name != 'push' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 5
    steps:
      - name: Check out the zCloud control plane
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          clean: true
          fetch-depth: 513
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Prepare stable probe state
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 0700 "$ZCLOUD_RUN_STATE_DIR"
          echo "ZCLOUD_STABLE_STATE_READY path=$ZCLOUD_RUN_STATE_DIR"

      - name: Enforce permanent zCloud VPS runner identity
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/zcloud_vps_runner_guard.py --json \
            | tee "$ZCLOUD_RUN_STATE_DIR/zcloud-vps-runner-guard.json"

      - name: Acquire cloud deploylane coordination claim
        id: claim
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/zcloud_vps_deploylane_coordination.py acquire \
            | tee "$ZCLOUD_RUN_STATE_DIR/zcloud-deploylane-claim.jsonl"

      - name: Verify portfolio queue allocator on VPS runner
        run: |
          set -euo pipefail
          python3 -m unittest -v tests.test_portfolio_queue_backend

      - name: Verify runtime project-schema migration on VPS runner
        run: |
          set -euo pipefail
          python3 -m unittest -v \
            tests.test_runtime_project_schema_repair \
            tests.test_vps_deploy_workflow

      - name: Inspect sanitized deploy pre-change evidence
        run: |
          set -euo pipefail
          python3 scripts/zcloud_prechange_evidence.py \
            --candidate "$GITHUB_WORKSPACE" \
            | tee "$ZCLOUD_RUN_STATE_DIR/zcloud-prechange-evidence.json"

      - name: Probe shared VPS execution capabilities
        run: |
          set -euo pipefail
          bash scripts/zcloud_vps_execution_probe.sh \
            | tee "$ZCLOUD_RUN_STATE_DIR/zcloud-vps-execution-probe.log"

      - name: Verify cloud deploylane claim is still exact
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/zcloud_vps_deploylane_coordination.py verify \
            | tee -a "$ZCLOUD_RUN_STATE_DIR/zcloud-deploylane-claim.jsonl"

      - name: Release cloud deploylane coordination claim
        if: always() && github.event_name != 'pull_request' && steps.claim.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/zcloud_vps_deploylane_coordination.py release \
            | tee -a "$ZCLOUD_RUN_STATE_DIR/zcloud-deploylane-claim.jsonl"

      - name: Diagnose runner workspace isolation
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          out="$ZCLOUD_RUN_STATE_DIR/zcloud-runner-topology.txt"
          {
            echo "RUNNER_NAME=$RUNNER_NAME"
            echo "RUNNER_TEMP=$RUNNER_TEMP"
            echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
            echo "HOST=$(hostname)"
            echo "=== ACTIONS RUNNER UNITS ==="
            systemctl --no-pager --all --type=service | grep -F 'actions.runner.' || true
            echo "=== RUNNER PROCESSES ==="
            ps -eo pid=,ppid=,user=,lstart=,cmd= | grep -E 'Runner\.(Listener|Worker)|runsvc\.sh' | grep -v grep || true
            echo "=== RUNNER CWD ==="
            for pid in $(pgrep -f 'Runner\.(Listener|Worker)|runsvc\.sh' || true); do
              printf 'pid=%s cwd=' "$pid"
              readlink -f "/proc/$pid/cwd" || true
            done
            echo "=== TEMP PRESENCE ==="
            test -d "$RUNNER_TEMP" && echo "runner_temp=present" || echo "runner_temp=missing"
            test -d "$ZCLOUD_RUN_STATE_DIR" && echo "stable_state=present" || echo "stable_state=missing"
          } | tee "$out"

      - name: Finalize FTMO Worker5 queue item after current-main deploy
        if: github.event_name == 'pull_request' && github.head_ref == 'worker/ftmo-w5-finalize-9c518-20261002'
        env:
          QUEUE_ID: ftmo-9c518045b0d66472
          FTMO_DEPLOY_RUN: "37038143107"
          FTMO_DEPLOY_SHA: 325cc2524596a6c936ee24c5f384a23a2965d721
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"

          gate_green=0
          for _ in $(seq 1 120); do
            payload="$(gh api "repos/Zennay/Ftmo/actions/runs/$FTMO_DEPLOY_RUN")"
            status="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])' <<<"$payload")"
            conclusion="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("conclusion"))' <<<"$payload")"
            sha="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["head_sha"])' <<<"$payload")"
            echo "FTMO_W5_DEPLOY_GATE run=$FTMO_DEPLOY_RUN status=$status conclusion=$conclusion sha=$sha"
            test "$sha" = "$FTMO_DEPLOY_SHA"
            if [[ "$status" == "completed" ]]; then
              test "$conclusion" = "success"
              gate_green=1
              break
            fi
            sleep 5
          done
          test "$gate_green" = "1"

          python3 - <<'PY'
          import importlib.util
          import json
          import os
          from pathlib import Path

          queue_id = os.environ["QUEUE_ID"]
          root = Path("/home/ubuntu/zennay-cloud")
          spec = importlib.util.spec_from_file_location("zcloud_live_server", root / "server.py")
          if spec is None or spec.loader is None:
              raise SystemExit("cannot load live zCloud server")
          server = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(server)
          server.DB = root / "history.db"

          with server.connect() as conn:
              row = conn.execute(
                  "SELECT queue_id,project_id,status,eligible,worker_slot,evidence,updated_at "
                  "FROM portfolio_queue WHERE queue_id=?",
                  (queue_id,),
              ).fetchone()
          if row is None:
              raise SystemExit("FTMO Worker5 queue item missing")
          before = dict(row)
          print("FTMO_W5_QUEUE_BEFORE=" + json.dumps(before, sort_keys=True, default=str))
          if before["project_id"] != "ftmo":
              raise SystemExit("queue project mismatch")

          evidence = (
              "Worker5 substantial FTMO provider-foundation package complete: "
              "PR451 merge 0e85da2cf53f846a6f21f13f8e5eadbedc6f825f with exact-head provider gate run 37035342356 SUCCESS; "
              "PR453 merge 756e00da4712af0612ac7a4fe2640c3fbd0af058 with exact-head self-hosted deploy-lockstep proof run 37036370074 SUCCESS; "
              "current-main autonomous VPS deploy run 37038143107 SUCCESS at 325cc2524596a6c936ee24c5f384a23a2965d721; "
              "runner recovery proof 37037498698 SUCCESS without interrupting active Runner.Worker. "
              "Generation boundaries remained sealed at provider_foundation; no development/walk-forward/final-holdout/live/paid-cloud boundary was opened."
          )

          if before["status"] == "done" and int(before["eligible"] or 0) == 0 and before["worker_slot"] is None:
              print("FTMO_W5_QUEUE_ALREADY_DONE=1")
          elif before["status"] in {"claimed","running","verifying","in_progress"} and before["worker_slot"] is not None:
              result = server.portfolio_queue_finish(
                  int(before["worker_slot"]), queue_id, "DONE", evidence
              )
              print("FTMO_W5_QUEUE_FINISH=" + json.dumps(result, sort_keys=True, default=str))
              if not result.get("updated"):
                  raise SystemExit("portfolio_queue_finish refused active FTMO Worker5 assignment")
          else:
              raise SystemExit(
                  f"refusing nonstandard queue finalization: status={before['status']} "
                  f"eligible={before['eligible']} worker_slot={before['worker_slot']}"
              )

          with server.connect() as conn:
              row = conn.execute(
                  "SELECT queue_id,project_id,status,eligible,worker_slot,evidence,updated_at "
                  "FROM portfolio_queue WHERE queue_id=?",
                  (queue_id,),
              ).fetchone()
          after = dict(row) if row else None
          print("FTMO_W5_QUEUE_AFTER=" + json.dumps(after, sort_keys=True, default=str))
          if (
              not after
              or after["status"] != "done"
              or int(after["eligible"] or 0) != 0
              or after["worker_slot"] is not None
          ):
              raise SystemExit("FTMO Worker5 queue final state is not done/ineligible/unclaimed")
          print("FTMO_W5_SQLITE_DONE_GREEN=1")
          PY

      - name: Upload sanitized deploylane evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zcloud-vps-deploylane-evidence-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ env.ZCLOUD_RUN_STATE_DIR }}/zcloud-deploylane-claim.jsonl
            ${{ env.ZCLOUD_RUN_STATE_DIR }}/zcloud-vps-execution-probe.log
            ${{ env.ZCLOUD_RUN_STATE_DIR }}/zcloud-vps-runner-guard.json
            ${{ env.ZCLOUD_RUN_STATE_DIR }}/zcloud-prechange-evidence.json
            ${{ env.ZCLOUD_RUN_STATE_DIR }}/zcloud-runner-topology.txt

      - name: Cleanup stable probe state
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          case "$ZCLOUD_RUN_STATE_DIR" in
            /home/ubuntu/.local/state/zcloud/actions/*) ;;
            *) echo "Refusing unsafe cleanup path: $ZCLOUD_RUN_STATE_DIR" >&2; exit 2 ;;
          esac
          rm -rf -- "$ZCLOUD_RUN_STATE_DIR"
