name: zCloud VPS execution lane probe

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["zCloud VPS deploy"]
    types: [completed]
  pull_request:
    branches: [main]
    paths:
      - vps-execution-policy.json
      - scripts/zcloud_vps_execution_probe.sh
      - scripts/zcloud_vps_runner_guard.py
      - scripts/zcloud_vps_deploylane_coordination.py
      - scripts/zcloud_transactional_promote.py
      - tests/test_transactional_promote.py
      - tests/test_vps_runner_guard.py
      - server.py
      - .github/workflows/zcloud-vps-deploy.yml
      - .github/workflows/zcloud-vps-execution-probe.yml

permissions:
  contents: read

concurrency:
  group: zcloud-vps-execution-probe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Check out the zCloud control plane
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          clean: true
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Enforce permanent zCloud VPS runner identity
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/zcloud_vps_runner_guard.py --json \
            | tee "$RUNNER_TEMP/zcloud-vps-runner-guard.json"

      - name: Acquire cloud deploylane coordination claim
        id: claim
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/zcloud_vps_deploylane_coordination.py acquire \
            | tee "$RUNNER_TEMP/zcloud-deploylane-claim.jsonl"

      - name: Verify portfolio queue allocator on VPS runner
        run: |
          set -euo pipefail
          python3 -m unittest -v tests.test_portfolio_queue_backend

      - name: Probe shared VPS execution capabilities
        run: |
          set -euo pipefail
          bash scripts/zcloud_vps_execution_probe.sh \
            | tee "$RUNNER_TEMP/zcloud-vps-execution-probe.log"

      - name: Verify cloud deploylane claim is still exact
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/zcloud_vps_deploylane_coordination.py verify \
            | tee -a "$RUNNER_TEMP/zcloud-deploylane-claim.jsonl"

      - name: Release cloud deploylane coordination claim
        if: always() && github.event_name != 'pull_request' && steps.claim.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/zcloud_vps_deploylane_coordination.py release \
            | tee -a "$RUNNER_TEMP/zcloud-deploylane-claim.jsonl"

      - name: Recover FTMO listener for Worker5 deploy
        if: github.event_name == 'pull_request' && github.head_ref == 'worker/ftmo-w5-runner-recovery-20261002'
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          QUEUE_ID="zssh-ftmo-worker5-runner-recovery-20261002"
          SERVICE="actions.runner.Zennay-Ftmo.vps-bb300bba-ftmo.service"
          RUN_USER="ftmo-runner"

          python3 - <<'PY'
          import importlib.util
          import json
          from pathlib import Path

          queue_id = "zssh-ftmo-worker5-runner-recovery-20261002"
          spec = importlib.util.spec_from_file_location(
              "zcloud_server", Path("/home/ubuntu/zennay-cloud/server.py")
          )
          server = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(server)
          server.DB = Path("/home/ubuntu/zennay-cloud/history.db")
          server.init_db()
          with server.connect() as conn:
              row = conn.execute(
                  "SELECT queue_id,project_id,priority,status,eligible,worker_slot FROM portfolio_queue WHERE queue_id=?",
                  (queue_id,),
              ).fetchone()
          if row is None:
              result = server.portfolio_queue_enqueue(
                  "zssh",
                  "Recover FTMO Actions listener for Worker5 deployment",
                  "P0",
                  "On vps-bb300bba recover only the FTMO GitHub Actions listener so queued deploy run 37036478118 for SHA 756e00da4712af0612ac7a4fe2640c3fbd0af058 can execute; preserve active Runner.Worker jobs; prove listener active after recovery.",
                  "https://github.com/Zennay/Ftmo/actions/runs/37036478118",
                  None,
                  queue_id,
              )
              print("WORKER5_RECOVERY_QUEUE_ENQUEUE=" + json.dumps(result, sort_keys=True, default=str))
          with server.connect() as conn:
              row = conn.execute(
                  "SELECT queue_id,project_id,priority,status,eligible,worker_slot FROM portfolio_queue WHERE queue_id=?",
                  (queue_id,),
              ).fetchone()
          item = dict(row) if row else None
          if not item or item["project_id"] != "zssh" or item["priority"] != "P0":
              raise SystemExit("guarded zSSH recovery queue assignment missing or invalid")
          print("WORKER5_RECOVERY_QUEUE_GUARD=" + json.dumps(item, sort_keys=True, default=str))
          PY

          pre_state="$(systemctl is-active "$SERVICE" || true)"
          pre_pid="$(systemctl show "$SERVICE" -p MainPID --value || true)"
          worker_before=0
          if pgrep -u "$RUN_USER" -f 'Runner\.Worker' >/dev/null 2>&1; then
            worker_before=1
          fi
          echo "FTMO_W5_RUNNER_PRE state=$pre_state pid=$pre_pid worker=$worker_before"

          if [[ "$worker_before" -eq 1 ]]; then
            action="preserve-active-worker"
          else
            sudo -n systemctl reset-failed "$SERVICE" || true
            sudo -n systemctl restart "$SERVICE"
            action="restart-idle-listener"
          fi

          for _ in $(seq 1 30); do
            state="$(systemctl is-active "$SERVICE" || true)"
            pid="$(systemctl show "$SERVICE" -p MainPID --value || true)"
            if [[ "$state" == "active" && "$pid" =~ ^[1-9][0-9]*$ && -r "/proc/$pid/cmdline" ]]; then
              cmdline="$(tr '\0' ' ' < "/proc/$pid/cmdline")"
              if [[ "$cmdline" == *"Runner.Listener"* || "$cmdline" == *"runsvc.sh"* ]]; then
                break
              fi
            fi
            sleep 2
          done
          test "$(systemctl is-active "$SERVICE")" = "active"
          pid="$(systemctl show "$SERVICE" -p MainPID --value)"
          test -r "/proc/$pid/cmdline"
          cmdline="$(tr '\0' ' ' < "/proc/$pid/cmdline")"
          [[ "$cmdline" == *"Runner.Listener"* || "$cmdline" == *"runsvc.sh"* ]]
          echo "FTMO_W5_RUNNER_RECOVERY_ACTION=$action"
          echo "FTMO_W5_RUNNER_POST state=active pid=$pid listener=1"

          for _ in $(seq 1 30); do
            if pgrep -u "$RUN_USER" -f 'Runner\.Worker' >/dev/null 2>&1; then
              echo "FTMO_W5_RUNNER_ACCEPTED_JOB=1"
              break
            fi
            sleep 2
          done

          RECOVERY_ACTION="$action" python3 - <<'PY'
          import importlib.util
          import json
          import os
          from pathlib import Path

          queue_id = "zssh-ftmo-worker5-runner-recovery-20261002"
          spec = importlib.util.spec_from_file_location(
              "zcloud_server", Path("/home/ubuntu/zennay-cloud/server.py")
          )
          server = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(server)
          server.DB = Path("/home/ubuntu/zennay-cloud/history.db")
          server.init_db()
          evidence = (
              "Worker5 FTMO listener recovery executed on vps-bb300bba; "
              f"action={os.environ.get('RECOVERY_ACTION')}; "
              "target deploy run=37036478118; target SHA=756e00da4712af0612ac7a4fe2640c3fbd0af058"
          )
          result = server.portfolio_queue_drop(queue_id, evidence)
          print("WORKER5_RECOVERY_QUEUE_DROP=" + json.dumps(result, sort_keys=True, default=str))
          if not result.get("dropped"):
              raise SystemExit("recovery queue drop refused")
          with server.connect() as conn:
              row = conn.execute(
                  "SELECT queue_id,status,eligible,worker_slot,evidence FROM portfolio_queue WHERE queue_id=?",
                  (queue_id,),
              ).fetchone()
          print("WORKER5_RECOVERY_QUEUE_READBACK=" + json.dumps(dict(row) if row else None, sort_keys=True, default=str))
          if row is not None and (int(row["eligible"] or 0) != 0 or row["worker_slot"] is not None):
              raise SystemExit("recovery queue remained eligible or assigned")
          PY

      - name: Upload sanitized deploylane evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zcloud-vps-deploylane-evidence-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/zcloud-deploylane-claim.jsonl
            ${{ runner.temp }}/zcloud-vps-execution-probe.log
            ${{ runner.temp }}/zcloud-vps-runner-guard.json
