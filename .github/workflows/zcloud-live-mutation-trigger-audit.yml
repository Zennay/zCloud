name: zCloud live mutation trigger audit

on:
  pull_request:
    paths:
      - scripts/zcloud_live_mutation_trigger_audit.py
      - tests/test_zcloud_live_mutation_trigger_audit.py
      - docs/zcloud-live-mutation-trigger-audit.md
      - .github/workflows/zcloud-live-mutation-trigger-audit.yml
  push:
    branches: [main]
    paths:
      - scripts/zcloud_live_mutation_trigger_audit.py
      - tests/test_zcloud_live_mutation_trigger_audit.py
      - docs/zcloud-live-mutation-trigger-audit.md
      - .github/workflows/zcloud-live-mutation-trigger-audit.yml

permissions:
  contents: read

concurrency:
  group: zcloud-live-mutation-trigger-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    if: >-
      github.event_name != 'pull_request' ||
      (github.actor == 'Zennay' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 5
    env:
      EXPECTED_ZCLOUD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact trusted revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.EXPECTED_ZCLOUD_SHA }}
          persist-credentials: false
          clean: true
          fetch-depth: 1

      - name: Verify exact permanent VPS runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_ZCLOUD_SHA"
          test "${RUNNER_NAME:-}" = "zcloud-vps-1"
          test "$(hostname)" = "vps-bb300bba"
          test "$(id -un)" = "ubuntu"
          python3 scripts/zcloud_vps_runner_guard.py --json
          echo "ZCLOUD_LIVE_MUTATION_AUDIT_RUNNER_GREEN=1"

      - name: Run focused regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v tests.test_zcloud_live_mutation_trigger_audit

      - name: Produce bounded read-only inventory
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/zcloud-live-mutation-trigger-audit.json"
          python3 scripts/zcloud_live_mutation_trigger_audit.py --json > "$report"
          python3 - "$report" <<'PY'
          import json
          import sys

          report = json.load(open(sys.argv[1], encoding="utf-8"))
          if report.get("inventory_complete") is not True:
              raise SystemExit("live-mutation trigger inventory incomplete")
          if report.get("mutation_performed") is not False:
              raise SystemExit("audit unexpectedly reports a mutation")
          print(
              "ZCLOUD_LIVE_MUTATION_TRIGGER_AUDIT_GREEN "
              f"workflows={report.get('workflow_count')} "
              "automatic_candidates="
              f"{report.get('automatic_live_mutation_candidate_count')} "
              "manual_candidates="
              f"{report.get('manual_or_called_mutation_candidate_count')}"
          )
          PY
