name: FTMO PR477 exact-head telemetry proof

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-pr477-exact-head-proof.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ftmo-pr477-exact-head-proof
  cancel-in-progress: true

jobs:
  proof:
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 30
    env:
      TARGET_SHA: eec48986ab3e08952660416356ae7306d4c1076e
      TARGET_PR: "477"
      EXPECTED_MAIN_SHA: c7aba84919e2aea9d941c90e2da407f4d2bea85c
      FTMO_AUTONOMOUS_CLOUD_BUDGET_USD: "0.00"
      FTMO_ALLOW_PAID_AWS: ""
    steps:
      - name: Checkout zCloud receipt workspace
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout exact FTMO PR477 head
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          work="$RUNNER_TEMP/ftmo-pr477-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          rm -rf "$work"
          git init -q "$work"
          git -C "$work" remote add origin https://github.com/Zennay/Ftmo.git
          git -C "$work" -c protocol.version=2 fetch -q --depth=1 origin "$TARGET_SHA"
          git -C "$work" checkout -q --detach FETCH_HEAD
          test "$(git -C "$work" rev-parse HEAD)" = "$TARGET_SHA"
          python3 - <<'PY'
          import json, os, subprocess
          pr=json.loads(subprocess.check_output(
              ["gh","api",f"repos/Zennay/Ftmo/pulls/{os.environ['TARGET_PR']}"],
              text=True,
          ))
          assert pr["state"] == "open"
          assert pr["head"]["sha"] == os.environ["TARGET_SHA"]
          print("FTMO_PR477_IDENTITY=verified")
          PY

      - name: Prove hardened telemetry boundaries
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/ftmo-pr477-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          venv="$RUNNER_TEMP/ftmo-pr477-venv-$GITHUB_RUN_ID"
          rm -rf "$venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install -q -r "$work/requirements-ci.txt"
          "$venv/bin/python" -m pip install -q -e "$work"
          cd "$work"
          "$venv/bin/python" -m py_compile src/prop_trading_ai/cli/v1_project_telemetry.py
          "$venv/bin/python" -m pytest -q \
            tests/test_project_telemetry.py \
            tests/test_project_telemetry_cli.py \
            tests/test_project_telemetry_runtime_status.py \
            tests/test_zero_cost_workflow_boundary.py

          stable="/opt/ftmo-autonomous"
          status="$stable/.scratch/autonomy/status.json"
          deploy_receipt="artifacts/autonomous_runtime/vps-controller-receipt.json"
          test -d "$stable"
          test ! -L "$stable"
          test -f "$status"
          test ! -L "$status"
          test -f "$deploy_receipt"
          test ! -L "$deploy_receipt"

          expected="$("$venv/bin/python" - "$deploy_receipt" <<'PY'
          import json, sys
          from pathlib import Path
          payload=json.loads(Path(sys.argv[1]).read_text())
          source=payload["source_main_sha"]
          runtime=payload["runtime_revision"]
          assert source == runtime
          assert payload.get("autonomous_cloud_budget_usd") == "0.00"
          assert payload.get("live_trading_allowed") is False
          assert payload.get("broker_order_submission_allowed") is False
          research=payload.get("research")
          assert isinstance(research, dict)
          for field in (
              "development_access_allowed",
              "walk_forward_access_allowed",
              "final_holdout_access_allowed",
          ):
              assert research.get(field) is False, field
          print(source)
          PY
          )"

          before="$(sha256sum "$status" | awk '{print $1}')"
          runtime_json="$RUNNER_TEMP/ftmo-pr477-$GITHUB_RUN_ID.json"
          runtime_md="$RUNNER_TEMP/ftmo-pr477-$GITHUB_RUN_ID.md"
          sudo -n -u ftmo-runner env HOME=/home/ftmo-runner \
            "$venv/bin/python" -m prop_trading_ai.cli.v1_project_telemetry \
              --root . \
              --config configs/research_machine.json \
              --runtime-status "$status" \
              --expected-runtime-revision "$expected" \
              --output "$runtime_json" \
              --markdown-output "$runtime_md"
          after="$(sha256sum "$status" | awk '{print $1}')"
          test "$before" = "$after"

          grep -F 'Live autonomous:** Generation **30**' "$runtime_md"
          grep -F 'matches canonical deploy receipt' "$runtime_md"
          grep -F 'provider_foundation_window_not_elapsed' "$runtime_md"
          grep -F '2026-12-25T21:00:00+00:00' "$runtime_md"

          "$venv/bin/python" - "$runtime_json" <<'PY'
          import json, sys
          from pathlib import Path
          data=json.loads(Path(sys.argv[1]).read_text())
          live=data["autonomous_runtime"]
          assert live["generation_number"] == 30
          assert live["stage"] == "provider_foundation"
          assert live["action"] == "provider_foundation_window_not_elapsed"
          assert live["runtime_revision_matches_expected"] is True
          assert live["research_cycle_ok"] is True
          assert live["development_access_allowed"] is False
          assert live["walk_forward_access_allowed"] is False
          assert live["final_holdout_access_allowed"] is False
          assert live["live_trading_allowed"] is False
          assert live["broker_order_submission_allowed"] is False
          print("FTMO_PR477_LIVE_GEN30=verified")
          PY

      - name: Merge exact FTMO head after green proof
        shell: bash
        run: |
          set -euo pipefail
          current_main="$(gh api repos/Zennay/Ftmo/commits/main --jq .sha)"
          test "$current_main" = "$EXPECTED_MAIN_SHA"
          current_head="$(gh api "repos/Zennay/Ftmo/pulls/$TARGET_PR" --jq .head.sha)"
          current_base="$(gh api "repos/Zennay/Ftmo/pulls/$TARGET_PR" --jq .base.sha)"
          current_state="$(gh api "repos/Zennay/Ftmo/pulls/$TARGET_PR" --jq .state)"
          test "$current_head" = "$TARGET_SHA"
          test "$current_base" = "$EXPECTED_MAIN_SHA"
          test "$current_state" = "open"
          result="$(gh api --method PUT "repos/Zennay/Ftmo/pulls/$TARGET_PR/merge" \
            -f merge_method=squash \
            -f sha="$TARGET_SHA")"
          test "$(python3 -c 'import json,sys; print(str(json.load(sys.stdin).get("merged")).lower())' <<<"$result")" = "true"
          echo "FTMO_PR477_MERGED=1"

      - name: Persist durable proof receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-evidence
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          payload = {
              "schema_version": 1,
              "project": "ftmo",
              "pull_request": 477,
              "target_sha": os.environ["TARGET_SHA"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "runner": os.environ.get("RUNNER_NAME", ""),
              "host": "vps-bb300bba",
              "result": "success",
              "proof": [
                  "exact-sha-checkout",
                  "telemetry-cli-compile",
                  "runtime-status-filesystem-integrity",
                  "sealed-authority-invariants",
                  "canonical-deploy-receipt-revision-authority",
                  "live-gen30-runtime-overlay",
                  "zero-cost-workflow-boundary"
              ],
              "paid_cloud_budget_usd": "0.00",
              "research_outcomes_accessed": False,
              "walk_forward_accessed": False,
              "final_holdout_accessed": False,
              "live_or_broker_access_opened": False,
          }
          Path("runtime-evidence/ftmo-pr477-zcloud-proof.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime-evidence/ftmo-pr477-zcloud-proof.json
          git commit -m "Record FTMO PR477 exact-head proof $GITHUB_RUN_ID"
          git push origin HEAD:main

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/ftmo-pr477-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" "$RUNNER_TEMP/ftmo-pr477-venv-$GITHUB_RUN_ID"
