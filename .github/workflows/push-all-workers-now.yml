# owner-requested all-worker recovery trigger 2026-10-07T02:18Z
name: Push all zCloud workers now
# enforce seven desired ChatGPT workers + push all 2026-10-06T07:36Z

on:
  schedule:
    - cron: "0 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/push-all-workers-now.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  push-all:
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 3
    steps:
      - name: Force push every saved running worker
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import sqlite3
          import time
          import urllib.request

          BASE = "http://127.0.0.1:8765"
          DB = "/home/ubuntu/zennay-cloud/history.db"

          def call(method, path, payload=None):
              data = None
              headers = {"User-Agent": "zcloud-push-all-workers-now/1"}
              if payload is not None:
                  data = json.dumps(payload).encode("utf-8")
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(BASE + path, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=20) as response:
                  return json.load(response)

          # Keep the owner-requested seven ChatGPT workers as desired capacity.
          # The backend memory/OOM admission guard remains authoritative and may
          # safely admit fewer slots when the VPS does not have enough headroom.
          dynamic = (call("GET", "/api/dynamic-workers").get("dynamic_workers") or {})
          desired = {
              key: dynamic.get(key)
              for key in (
                  "chatgpt_count",
                  "claude_count",
                  "chatgpt_cooldown_seconds",
                  "claude_cooldown_seconds",
                  "check_interval_ms",
                  "tick_interval_ms",
                  "heartbeat_interval_ms",
                  "generation_start_timeout_ms",
                  "scheduler_interval_seconds",
              )
              if key in dynamic
          }
          desired["chatgpt_count"] = 7
          reconciled = call("POST", "/api/dynamic-workers", desired)
          print("WORKER_CAPACITY_RECONCILED=" + json.dumps(reconciled, sort_keys=True))
          if not reconciled.get("ok"):
              raise SystemExit("failed to reconcile seven-worker desired capacity")

          desired_total = int(
              ((reconciled.get("dynamic_workers") or {}).get("count") or 0)
          )
          allocation_deadline = time.time() + 20
          before = {}
          allocation = []
          while time.time() < allocation_deadline:
              before = call("GET", "/api/runner-targets")
              allocation = (before.get("global_allocation") or {}).get("workers") or []
              if desired_total <= 0 or len(allocation) >= desired_total:
                  break
              time.sleep(2)

          print("ALLOCATION_CONVERGENCE=" + json.dumps({
              "desired": desired_total,
              "allocated": len(allocation),
              "workers": [str(item.get("worker_key") or "") for item in allocation],
          }, sort_keys=True))
          if desired_total > 0 and len(allocation) < desired_total:
              raise SystemExit(
                  f"worker allocation did not converge to desired capacity: "
                  f"{len(allocation)}/{desired_total}"
              )

          active = []
          for item in allocation:
              key = str(item.get("worker_key") or "").strip()
              if not key:
                  base = str(item.get("project_id") or "").strip()
                  slot = int(item.get("worker_slot") or 1)
                  key = f"{base}::w{slot}"
              active.append({
                  "worker": key,
                  "project": item.get("project_id"),
                  "provider": item.get("provider"),
                  "global_slot": item.get("global_worker_slot"),
              })

          if not active:
              raise SystemExit("no allocated active workers to push")

          print("ACTIVE_WORKERS=" + json.dumps(active, sort_keys=True))
          # Supersede recovery-era pending commands first. They are stale control
          # intents from the browser restart and must not interrupt a worker after
          # this scheduled/manual push-all request.
          with sqlite3.connect(DB, timeout=10) as conn:
              conn.row_factory = sqlite3.Row
              conn.execute("PRAGMA busy_timeout=10000")
              conn.execute("BEGIN IMMEDIATE")
              ts = __import__("datetime").datetime.now(__import__("datetime").timezone.utc).isoformat()
              superseded = []
              for item in active:
                  worker = item["worker"]
                  rows = conn.execute(
                      "SELECT id,action FROM runner_commands "
                      "WHERE project_id=? AND status='pending' ORDER BY id",
                      (worker,),
                  ).fetchall()
                  for row in rows:
                      superseded.append({"worker": worker, "id": int(row["id"]), "action": str(row["action"])})
                      conn.execute(
                          "UPDATE runner_commands SET status='failed',updated_at=?,result=? "
                          "WHERE id=? AND status='pending'",
                          (ts, "scheduled/manual push-all superseded stale pending control command", int(row["id"])),
                      )
          print("SUPERSEDED_PENDING=" + json.dumps(superseded, sort_keys=True))

          pushed = call("POST", "/api/dynamic-workers/force-push", {})
          print("FORCE_PUSH=" + json.dumps(pushed, sort_keys=True))
          if not pushed.get("ok"):
              raise SystemExit("force-push returned ok=false")

          results = pushed.get("results") or []
          by_worker = {str(r.get("worker")): r for r in results}
          missing = [item["worker"] for item in active if item["worker"] not in by_worker]
          refused = [
              item["worker"] for item in active
              if not bool((by_worker.get(item["worker"]) or {}).get("queued"))
          ]
          if missing or refused:
              raise SystemExit(
                  "not all allocated workers were queued: "
                  + json.dumps({"missing": missing, "refused": refused}, sort_keys=True)
              )

          command_ids = {
              item["worker"]: int(by_worker[item["worker"]]["command_id"])
              for item in active
          }
          def locate_live_worker(payload, worker_key):
              base = worker_key.split("::w", 1)[0]
              workers = ((payload.get("chatgpt_runners") or {}).get(base) or {}).get("workers") or []
              return next(
                  (item for item in workers if str(item.get("worker_id") or "") == worker_key),
                  None,
              )

          final = {}
          progressed = set()
          # A fresh queue row is not material progress. Give the VPS browser
          # consumer a bounded window to claim work. Pending is accepted only
          # when that exact worker is demonstrably generating/sending already.
          deadline = time.time() + 60
          while time.time() < deadline:
              with sqlite3.connect(DB, timeout=5) as conn:
                  conn.row_factory = sqlite3.Row
                  final = {}
                  for worker, command_id in command_ids.items():
                      row = conn.execute(
                          "SELECT id,action,status,result,created_at,updated_at "
                          "FROM runner_commands WHERE id=?",
                          (command_id,),
                      ).fetchone()
                      state = dict(row) if row else {"status": "missing"}
                      final[worker] = state
                      if state.get("status") != "pending":
                          progressed.add(worker)
              if len(progressed) == len(command_ids):
                  break
              time.sleep(5)

          print("PUSH_COMMANDS=" + json.dumps(final, sort_keys=True, default=str))
          failed = [w for w, v in final.items() if v.get("status") == "failed"]
          missing_commands = [w for w, v in final.items() if v.get("status") == "missing"]
          if failed:
              raise SystemExit("fresh push failed for: " + ", ".join(failed))
          if missing_commands:
              raise SystemExit("fresh push command missing for: " + ", ".join(missing_commands))

          pending = [w for w, v in final.items() if v.get("status") == "pending"]
          if pending:
              live = call("GET", "/api/runner-live")
              unjustified_pending = []
              pending_runtime = {}
              for worker in pending:
                  state = locate_live_worker(live, worker) or {}
                  runtime = {
                      "state": state.get("state"),
                      "generating": bool(state.get("generating")),
                      "sending": bool(state.get("sending")),
                      "progress_age_seconds": state.get("progress_age_seconds"),
                  }
                  pending_runtime[worker] = runtime
                  if not runtime["generating"] and not runtime["sending"]:
                      unjustified_pending.append(worker)
              print("PENDING_WORKER_RUNTIME=" + json.dumps(pending_runtime, sort_keys=True))

              # Recover only exact allocated workers that are still idle after
              # the normal push window. Do not restart Firefox or disturb the
              # healthy workers: supersede the stuck push, open one fresh chat,
              # then send one targeted push and prove browser progress again.
              if unjustified_pending:
                  with sqlite3.connect(DB, timeout=10) as conn:
                      conn.execute("PRAGMA busy_timeout=10000")
                      conn.execute("BEGIN IMMEDIATE")
                      ts = __import__("datetime").datetime.now(__import__("datetime").timezone.utc).isoformat()
                      for worker in unjustified_pending:
                          command_id = command_ids[worker]
                          conn.execute(
                              "UPDATE runner_commands SET status='failed',updated_at=?,result=? "
                              "WHERE id=? AND status='pending'",
                              (ts, "push-all targeted recovery superseded idle pending push", command_id),
                          )

                  recovery_ids = {}
                  for worker in unjustified_pending:
                      recovery = call("POST", "/api/runner-control", {
                          "project_id": worker,
                          "action": "new_chat",
                      })
                      if not recovery.get("ok") or not recovery.get("command_id"):
                          raise SystemExit(
                              "targeted new_chat recovery was not admitted for "
                              + worker + ": " + json.dumps(recovery, sort_keys=True)
                          )
                      recovery_ids[worker] = int(recovery["command_id"])
                  print("TARGETED_NEW_CHAT=" + json.dumps(recovery_ids, sort_keys=True))

                  recovery_deadline = time.time() + 30
                  recovery_states = {}
                  while time.time() < recovery_deadline:
                      with sqlite3.connect(DB, timeout=5) as conn:
                          conn.row_factory = sqlite3.Row
                          recovery_states = {}
                          for worker, command_id in recovery_ids.items():
                              row = conn.execute(
                                  "SELECT id,action,status,result,created_at,updated_at "
                                  "FROM runner_commands WHERE id=?",
                                  (command_id,),
                              ).fetchone()
                              recovery_states[worker] = dict(row) if row else {"status": "missing"}
                      if all(
                          state.get("status") in ("completed", "failed")
                          for state in recovery_states.values()
                      ):
                          break
                      time.sleep(3)
                  print("TARGETED_NEW_CHAT_RESULT=" + json.dumps(
                      recovery_states, sort_keys=True, default=str
                  ))
                  recovery_failed = [
                      worker for worker, state in recovery_states.items()
                      if state.get("status") in ("failed", "missing")
                  ]
                  if recovery_failed:
                      raise SystemExit(
                          "targeted new_chat recovery failed for: "
                          + ", ".join(recovery_failed)
                      )

                  live_after_recovery = call("GET", "/api/runner-live")
                  targeted_push_ids = {}
                  recovered_by_activity = []
                  for worker in unjustified_pending:
                      state = locate_live_worker(live_after_recovery, worker) or {}
                      if bool(state.get("generating")) or bool(state.get("sending")):
                          recovered_by_activity.append(worker)
                          continue
                      if recovery_states.get(worker, {}).get("status") != "completed":
                          raise SystemExit(
                              "targeted new_chat recovery stayed pending and idle for: " + worker
                          )
                      retry = call("POST", "/api/runner-control", {
                          "project_id": worker,
                          "action": "push",
                      })
                      if not retry.get("ok") or not retry.get("command_id"):
                          raise SystemExit(
                              "targeted push recovery was not admitted for "
                              + worker + ": " + json.dumps(retry, sort_keys=True)
                          )
                      targeted_push_ids[worker] = int(retry["command_id"])
                  print("TARGETED_PUSH=" + json.dumps(targeted_push_ids, sort_keys=True))

                  targeted_states = {}
                  targeted_deadline = time.time() + 35
                  while targeted_push_ids and time.time() < targeted_deadline:
                      with sqlite3.connect(DB, timeout=5) as conn:
                          conn.row_factory = sqlite3.Row
                          targeted_states = {}
                          for worker, command_id in targeted_push_ids.items():
                              row = conn.execute(
                                  "SELECT id,action,status,result,created_at,updated_at "
                                  "FROM runner_commands WHERE id=?",
                                  (command_id,),
                              ).fetchone()
                              targeted_states[worker] = dict(row) if row else {"status": "missing"}
                      if all(
                          state.get("status") in ("completed", "failed")
                          for state in targeted_states.values()
                      ):
                          break
                      time.sleep(3)

                  final_live = call("GET", "/api/runner-live")
                  unrecovered = []
                  recovery_evidence = {}
                  for worker in unjustified_pending:
                      runtime = locate_live_worker(final_live, worker) or {}
                      command_state = targeted_states.get(worker, {})
                      recovered = (
                          worker in recovered_by_activity
                          or command_state.get("status") == "completed"
                          or bool(runtime.get("generating"))
                          or bool(runtime.get("sending"))
                      )
                      recovery_evidence[worker] = {
                          "new_chat_status": recovery_states.get(worker, {}).get("status"),
                          "targeted_push_status": command_state.get("status"),
                          "generating": bool(runtime.get("generating")),
                          "sending": bool(runtime.get("sending")),
                      }
                      if command_state.get("status") in ("failed", "missing") or not recovered:
                          unrecovered.append(worker)
                  print("TARGETED_RECOVERY_EVIDENCE=" + json.dumps(
                      recovery_evidence, sort_keys=True
                  ))
                  if unrecovered:
                      raise SystemExit(
                          "fresh push stayed idle after targeted recovery for: "
                          + ", ".join(unrecovered)
                      )
                  progressed.update(unjustified_pending)

          if not progressed and pending:
              print("ALL_PENDING_JUSTIFIED_BY_ACTIVE_GENERATION=1")
          else:
              print("MATERIAL_PUSH_PROGRESS=" + json.dumps(sorted(progressed)))

          print("ALL_WORKERS_PUSHED_GREEN=1")
          PY
