name: Push all zCloud workers now
# enforce seven desired ChatGPT workers + push all 2026-10-06T07:36Z

on:
  schedule:
    - cron: "0 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/push-all-workers-now.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  push-all:
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 3
    steps:
      - name: Force push every saved running worker
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import sqlite3
          import time
          import urllib.request
          from datetime import datetime, timezone

          BASE = "http://127.0.0.1:8765"
          DB = "/home/ubuntu/zennay-cloud/history.db"
          ORDINARY_COMMAND_STALE_SECONDS = 300
          LONG_COMMAND_STALE_SECONDS = 900

          def call(method, path, payload=None):
              data = None
              headers = {"User-Agent": "zcloud-push-all-workers-now/1"}
              if payload is not None:
                  data = json.dumps(payload).encode("utf-8")
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(BASE + path, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=20) as response:
                  return json.load(response)

          # Keep the owner-requested seven ChatGPT workers as desired capacity.
          # The backend memory/OOM admission guard remains authoritative and may
          # safely admit fewer slots when the VPS does not have enough headroom.
          dynamic = (call("GET", "/api/dynamic-workers").get("dynamic_workers") or {})
          desired = {
              key: dynamic.get(key)
              for key in (
                  "chatgpt_count",
                  "claude_count",
                  "chatgpt_cooldown_seconds",
                  "claude_cooldown_seconds",
                  "check_interval_ms",
                  "tick_interval_ms",
                  "heartbeat_interval_ms",
                  "generation_start_timeout_ms",
                  "scheduler_interval_seconds",
              )
              if key in dynamic
          }
          desired["chatgpt_count"] = 7
          reconciled = call("POST", "/api/dynamic-workers", desired)
          print("WORKER_CAPACITY_RECONCILED=" + json.dumps(reconciled, sort_keys=True))
          if not reconciled.get("ok"):
              raise SystemExit("failed to reconcile seven-worker desired capacity")

          before = call("GET", "/api/runner-targets")
          allocation = (before.get("global_allocation") or {}).get("workers") or []
          active = []
          for item in allocation:
              key = str(item.get("worker_key") or "").strip()
              if not key:
                  base = str(item.get("project_id") or "").strip()
                  slot = int(item.get("worker_slot") or 1)
                  key = f"{base}::w{slot}"
              active.append({
                  "worker": key,
                  "project": item.get("project_id"),
                  "provider": item.get("provider"),
                  "global_slot": item.get("global_worker_slot"),
              })

          if not active:
              raise SystemExit("no allocated active workers to push")

          print("ACTIVE_WORKERS=" + json.dumps(active, sort_keys=True))
          # Clear only genuinely stale control intents. Replacement/drain commands
          # may legitimately need more than five minutes while the browser consumer
          # moves to a fresh conversation or finishes a drain. Preserve those until
          # the same bounded long lease used by scheduler/watchdog health recovery.
          with sqlite3.connect(DB, timeout=10) as conn:
              conn.row_factory = sqlite3.Row
              conn.execute("PRAGMA busy_timeout=10000")
              conn.execute("BEGIN IMMEDIATE")
              observed_at = datetime.now(timezone.utc)
              ts = observed_at.isoformat()
              superseded = []
              preserved = []
              for item in active:
                  worker = item["worker"]
                  rows = conn.execute(
                      "SELECT id,action,created_at FROM runner_commands "
                      "WHERE project_id=? AND status='pending' ORDER BY id",
                      (worker,),
                  ).fetchall()
                  for row in rows:
                      action = str(row["action"] or "").strip().lower()
                      stale_after = (
                          LONG_COMMAND_STALE_SECONDS
                          if action in {"new_chat", "drain"}
                          else ORDINARY_COMMAND_STALE_SECONDS
                      )
                      try:
                          created = datetime.fromisoformat(
                              str(row["created_at"]).replace("Z", "+00:00")
                          ).astimezone(timezone.utc)
                          age = max(0.0, (observed_at - created).total_seconds())
                      except Exception:
                          age = stale_after + 1
                      record = {
                          "worker": worker,
                          "id": int(row["id"]),
                          "action": action,
                          "age_seconds": round(age),
                          "stale_after_seconds": stale_after,
                      }
                      if age < stale_after:
                          preserved.append(record)
                          continue
                      superseded.append(record)
                      conn.execute(
                          "UPDATE runner_commands SET status='failed',updated_at=?,result=? "
                          "WHERE id=? AND status='pending'",
                          (ts, "scheduled/manual push-all superseded stale pending control command", int(row["id"])),
                      )
          print("SUPERSEDED_PENDING=" + json.dumps(superseded, sort_keys=True))
          print("PRESERVED_PENDING=" + json.dumps(preserved, sort_keys=True))

          pushed = call("POST", "/api/dynamic-workers/force-push", {})
          print("FORCE_PUSH=" + json.dumps(pushed, sort_keys=True))
          if not pushed.get("ok"):
              raise SystemExit("force-push returned ok=false")

          results = pushed.get("results") or []
          by_worker = {str(r.get("worker")): r for r in results}
          missing = [item["worker"] for item in active if item["worker"] not in by_worker]
          refused = [
              item["worker"] for item in active
              if not bool((by_worker.get(item["worker"]) or {}).get("queued"))
          ]
          if missing or refused:
              raise SystemExit(
                  "not all allocated workers were queued: "
                  + json.dumps({"missing": missing, "refused": refused}, sort_keys=True)
              )

          command_ids = {
              item["worker"]: int(by_worker[item["worker"]]["command_id"])
              for item in active
          }
          final = {}
          # A push is successfully issued once every allocated worker has a fresh
          # queued command. Workers already generating may intentionally consume it
          # only after the current answer finishes, so do not treat pending as failure.
          deadline = time.time() + 12
          while time.time() < deadline:
              with sqlite3.connect(DB, timeout=5) as conn:
                  conn.row_factory = sqlite3.Row
                  final = {}
                  for worker, command_id in command_ids.items():
                      row = conn.execute(
                          "SELECT id,action,status,result,created_at,updated_at "
                          "FROM runner_commands WHERE id=?",
                          (command_id,),
                      ).fetchone()
                      final[worker] = dict(row) if row else {"status": "missing"}
              if all(v.get("status") in ("completed", "failed") for v in final.values()):
                  break
              time.sleep(4)

          print("PUSH_COMMANDS=" + json.dumps(final, sort_keys=True, default=str))
          failed = [w for w, v in final.items() if v.get("status") == "failed"]
          missing_commands = [w for w, v in final.items() if v.get("status") == "missing"]
          if failed:
              raise SystemExit("fresh push failed for: " + ", ".join(failed))
          if missing_commands:
              raise SystemExit("fresh push command missing for: " + ", ".join(missing_commands))

          print("ALL_WORKERS_PUSHED_GREEN=1")
          PY
