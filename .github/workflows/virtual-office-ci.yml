name: Virtual Office isolated CI
on:
  push:
    branches:
      - feature/virtual-ai-office-mvp-20261012
    paths:
      - "virtual-office/**"
      - ".github/workflows/virtual-office-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  office-tests:
    name: Python API + UI syntax + smoke
    if: ${{ github.repository == 'Zennay/zCloud' && github.ref == 'refs/heads/feature/virtual-ai-office-mvp-20261012' && github.actor == 'Zennay' }}
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile + unit tests
        run: |
          test "$(hostname)" = "vps-bb300bba"
          python3 -m py_compile virtual-office/server.py virtual-office/office_features.py
          python3 -m unittest discover -s virtual-office/tests -v
      - name: Parse module and check JS syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html=Path("virtual-office/index.html").read_text()
          assert html.count('<script type="module">') == 1
          part=html.split('<script type="module">',1)[1].split('</script>',1)[0]
          Path("/tmp/virtual-office-ui.mjs").write_text(part)
          PY
          node --check /tmp/virtual-office-ui.mjs
          cp virtual-office/scene.js /tmp/virtual-office-scene.mjs
          node --check /tmp/virtual-office-scene.mjs
          node --check virtual-office/office-relay.user.js
      - name: Local API smoke (no account needed)
        run: |
          OFFICE_ZCLOUD_URL=http://127.0.0.1:18998 OFFICE_DB_PATH="$RUNNER_TEMP/office-smoke-$GITHUB_RUN_ID.db" OFFICE_PORT=18999 python3 virtual-office/server.py all &
          PID=$!
          trap 'kill "$PID" || true' EXIT
          for i in $(seq 1 15); do
            if curl --fail --silent http://127.0.0.1:18999/api/health > /tmp/office-health.json; then break; fi
            sleep 1
          done
          python3 - <<'PY'
          import json
          import urllib.request
          root="http://127.0.0.1:18999"
          health=json.load(open("/tmp/office-health.json"))
          assert health["online"] is True
          assert health["mode"] == "zcloud_chatgpt_chats"
          assert health["zcloud_online"] is False
          body=json.dumps({"employee":"maya","kind":"task","instruction":"Maak een weekplanning"}).encode()
          request=urllib.request.Request(root+"/api/jobs",data=body,headers={"Content-Type":"application/json"})
          response=json.load(urllib.request.urlopen(request))
          assert response["status"]=="queued"
          pending=json.load(urllib.request.urlopen(root+"/api/jobs"))
          assert pending["jobs"][0]["id"]==response["id"]
          print("Live browser UI + authenticated-independent SQLite outbox OK")
          PY

  deploy-vps:
    name: Deploy isolated office on VPS
    needs: [office-tests]
    # Explicitly avoid PR/fork/untrusted contexts on a privileged self-hosted runner.
    if: ${{ github.event_name == 'push' && github.repository == 'Zennay/zCloud' && github.ref == 'refs/heads/feature/virtual-ai-office-mvp-20261012' && github.actor == 'Zennay' }}
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 9
    concurrency:
      group: virtual-office-release
      cancel-in-progress: false
    steps:
      - name: Check out exact tested source (never persist credentials)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch licensed high-altitude city photograph
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 60 -A 'VirtualOffice/1.0 (Wikimedia attribution included)' 'https://thumb.wikimedia.org/wikipedia/commons/thumb/7/79/Midtown_Manhattan_skyline_from_the_One_World_Observatory%2C_New_York_City.jpg/3840px-Midtown_Manhattan_skyline_from_the_One_World_Observatory%2C_New_York_City.jpg' -o "$RUNNER_TEMP/office-skyline.jpg"
          python3 - <<'PY'
          import os
          from pathlib import Path
          data=(Path(os.environ["RUNNER_TEMP"])/"office-skyline.jpg").read_bytes()
          assert data[:3] == b"\xff\xd8\xff" and 100000 < len(data) < 30000000, "Invalid skyline asset"
          PY
      - name: Install separate, always-on 3D Office service
        shell: bash
        env:
          EXPECTED_HOST: vps-bb300bba
          OFFICE_PORT: "3422"
        run: |
          set -euo pipefail
          test "$(hostname)" = "$EXPECTED_HOST"
          test "$GITHUB_REPOSITORY" = "Zennay/zCloud"
          test "$GITHUB_REF" = "refs/heads/feature/virtual-ai-office-mvp-20261012"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f virtual-office/server.py
          test -f virtual-office/index.html
          python3 -m py_compile virtual-office/server.py
          user="$(id -un)"
          group="$(id -gn)"
          sudo install -d -m 0755 -o "$user" -g "$group" /opt/virtual-office
          sudo install -d -m 0700 -o "$user" -g "$group" /var/lib/virtual-office
          sudo install -d -m 0700 /etc/virtual-office
          if ! sudo test -s /etc/virtual-office/office.env; then
            secret="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
            printf 'OFFICE_ACCESS_TOKEN=%s\n' "$secret" | sudo tee /etc/virtual-office/office.env >/dev/null
            unset secret
          fi
          sudo chmod 0600 /etc/virtual-office/office.env
          sudo install -m 0644 "$RUNNER_TEMP/office-skyline.jpg" /opt/virtual-office/skyline.jpg
          sudo install -m 0644 virtual-office/server.py /opt/virtual-office/server.py
          sudo install -m 0644 virtual-office/index.html /opt/virtual-office/index.html
          sudo install -m 0644 virtual-office/office_features.py virtual-office/scene.js virtual-office/office-relay.user.js /opt/virtual-office/
          printf '%s' "$GITHUB_SHA" | sudo tee /opt/virtual-office/RELEASE >/dev/null
          sudo chown "$user:$group" /opt/virtual-office/server.py /opt/virtual-office/index.html
          printf '[Unit]\nDescription=3D Virtual Office ChatGPT worker frontend\nAfter=network-online.target zennay-cloud.service\nWants=network-online.target\n\n[Service]\nType=simple\nUser=%s\nGroup=%s\nWorkingDirectory=/opt/virtual-office\nEnvironment=OFFICE_BIND=0.0.0.0\nEnvironment=OFFICE_PORT=%s\nEnvironment=OFFICE_DB_PATH=/var/lib/virtual-office/office.db\nEnvironment=OFFICE_ZCLOUD_URL=http://127.0.0.1:8765\nEnvironmentFile=/etc/virtual-office/office.env\nExecStart=/usr/bin/python3 /opt/virtual-office/server.py all\nRestart=always\nRestartSec=5\nNoNewPrivileges=true\nPrivateTmp=true\nProtectSystem=strict\nReadWritePaths=/var/lib/virtual-office\n\n[Install]\nWantedBy=multi-user.target\n' "$user" "$group" "$OFFICE_PORT" | sudo tee /etc/systemd/system/virtual-office.service >/dev/null
          sudo systemctl daemon-reload
          sudo systemctl enable virtual-office.service
          sudo systemctl restart virtual-office.service
          healthy=0
          for i in $(seq 1 20); do
            if curl -fsS --max-time 2 "http://127.0.0.1:$OFFICE_PORT/api/health" >/tmp/virtual-office-health.json; then
              healthy=1; break
            fi
            sleep 1
          done
          if [ "$healthy" != 1 ]; then
            sudo journalctl -u virtual-office.service --no-pager -n 30
            exit 1
          fi
          curl -fsS --max-time 3 "http://127.0.0.1:$OFFICE_PORT/" | grep -q 'VIRTUAL OFFICE'
          python3 - <<'PY'
          import json
          with open("/tmp/virtual-office-health.json") as file:
              state=json.load(file)
          assert state["online"] is True
          assert state["auth_required"] is True
          assert state["mode"] == "zcloud_chatgpt_chats"
          print("office server healthy, work endpoints access-code protected; zcloud online:",state["zcloud_online"])
          PY
          if command -v ufw >/dev/null 2>&1; then
            sudo ufw allow "$OFFICE_PORT/tcp" comment 'Virtual Office 3D demo' || true
          fi
          public_ip="$(curl -fsS --max-time 8 https://api.ipify.org || true)"
          echo "Source SHA: $GITHUB_SHA"
          echo "Private task API guarded by a long randomly generated server-side secret."
          echo "No ChatGPT credentials, Codex CLI, or token API are used."
          if [ -n "$public_ip" ]; then
            echo "Candidate browser demo URL: http://$public_ip:$OFFICE_PORT/"
            {
              echo "## Virtual Office 0.3 Penthouse"
              echo "Built and deployed SHA: $GITHUB_SHA"
              echo "Candidate browser demo: http://$public_ip:$OFFICE_PORT/"
              echo "Interactive office + ChatGPT link. Server-only authenticated task submission."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          sudo systemctl is-active --quiet virtual-office.service

      - name: Private workstation readback and anonymous denial on deployed server
        shell: bash
        run: |
          set -euo pipefail
          sudo python3 - <<'PY'
          import json, urllib.request, urllib.error
          from pathlib import Path
          token = next(line.split("=",1)[1].strip() for line in Path("/etc/virtual-office/office.env").read_text().splitlines() if line.startswith("OFFICE_ACCESS_TOKEN="))
          root = "http://127.0.0.1:3422"
          for command in ("uptime", "memory", "disk", "services"):
              req = urllib.request.Request(root+"/api/workstation", data=json.dumps({"command":command}).encode(), headers={"Content-Type":"application/json","X-Office-Token":token})
              result = json.load(urllib.request.urlopen(req,timeout=8))
              assert result["source"] == "vps" and result["output"]
              print("Private VPS command verified:", command)
          for path in ("/api/decks", "/api/relay/status", "/api/jobs"):
              try:
                  urllib.request.urlopen(root+path,timeout=5)
                  raise AssertionError("Private route exposed")
              except urllib.error.HTTPError as exc:
                  assert exc.code == 401
          for path in ("/scene.js", "/office-relay.user.js"):
              response = urllib.request.urlopen(root+path,timeout=5)
              assert response.status == 200
          health = json.load(urllib.request.urlopen(root+"/api/health",timeout=12))
          assert health["version"] == "0.3-penthouse"
          print("Penthouse private API and static assets verified. No work queued by this probe.")
          PY

      - name: Isolated Firefox visual evidence
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          browser="$(command -v firefox || true)"
          if [ -z "$browser" ]; then
            for candidate in /opt/firefox/firefox /usr/lib/firefox/firefox /snap/bin/firefox /home/ubuntu/firefox/firefox; do
              if [ -x "$candidate" ]; then browser="$candidate"; break; fi
            done
          fi
          test -n "$browser"
          profile="$(mktemp -d "$RUNNER_TEMP/office-visual-XXXXXX")"
          mkdir -p "$RUNNER_TEMP/office-visual"
          printf 'user_pref("webgl.force-enabled",true);\nuser_pref("gfx.webrender.all",true);\n' > "$profile/user.js"
          timeout 55s "$browser" --headless --no-remote --profile "$profile" --window-size 1600,1000 --screenshot "$RUNNER_TEMP/office-visual/lounge.png" http://127.0.0.1:3422/
          test -s "$RUNNER_TEMP/office-visual/lounge.png"
      - name: Preserve visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: office-visual-evidence
          path: ${{ runner.temp }}/office-visual/
          if-no-files-found: ignore
          retention-days: 3
