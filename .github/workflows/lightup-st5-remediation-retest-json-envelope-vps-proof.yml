name: LightUp ST5 remediation/retest hardening + JSON envelope VPS proof

on:
  push:
    branches:
      - ops/lightup-st5-remediation-retest-json-envelope-proof-20261006
    paths:
      - .github/workflows/lightup-st5-remediation-retest-json-envelope-vps-proof.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lightup-st5-remediation-retest-json-envelope-vps-proof
  cancel-in-progress: true

env:
  LIGHTUP_REPO: /home/ubuntu/zennay-cloud/repos/lightup
  LIGHTUP_BRANCH: chatgpt/st5-remediation-retest-json-envelope-hardening-pack-20261006
  LIGHTUP_EXPECTED_SHA: 7e4c0a413d3d85f54c602c349882f735e4215b3e

jobs:
  prove:
    name: Exact LightUp hardening + JSON-envelope pack on vps-bb300bba
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 35

    steps:
      - name: Checkout zCloud proof harness
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Guard permanent VPS runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          python3 scripts/zcloud_vps_runner_guard.py --json

      - name: Snapshot exact LightUp candidate
        shell: bash
        run: |
          set -euo pipefail
          test -d "${LIGHTUP_REPO}/.git"
          git -C "${LIGHTUP_REPO}" fetch --prune origin             "refs/heads/${LIGHTUP_BRANCH}:refs/remotes/origin/lightup-st5-json-envelope-proof"
          ACTUAL_SHA="$(git -C "${LIGHTUP_REPO}" rev-parse             refs/remotes/origin/lightup-st5-json-envelope-proof^{commit})"
          test "${ACTUAL_SHA}" = "${LIGHTUP_EXPECTED_SHA}"

          SNAPSHOT="${RUNNER_TEMP}/lightup-st5-json-envelope-${GITHUB_RUN_ID}"
          rm -rf "${SNAPSHOT}"
          mkdir -p "${SNAPSHOT}"
          git -C "${LIGHTUP_REPO}" archive "${ACTUAL_SHA}" | tar -x -C "${SNAPSHOT}"

          echo "LIGHTUP_SNAPSHOT=${SNAPSHOT}" >> "${GITHUB_ENV}"
          echo "LIGHTUP_ACTUAL_SHA=${ACTUAL_SHA}" >> "${GITHUB_ENV}"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python 3.11 exact-head proof
        shell: bash
        run: |
          set -euo pipefail
          cd "${LIGHTUP_SNAPSHOT}"
          PYTHONPATH=src:tests python -m compileall -q src tests
          PYTHONPATH=src:tests python -m unittest -v \
            test_future_security_remediation_retest_nested_json_integrity \
            test_future_security_remediation_retest_nested_schema_integrity \
            test_future_security_remediation_retest_graph_action_coherence \
            test_future_security_remediation_retest_json_envelope_integrity \
            test_future_security_remediation_retest_plan_handoff
          PYTHONPATH=src:tests python -m unittest discover -s tests -v
          PYTHONPATH=src:tests python -m unittest discover -s tests/integration -v
          PYTHONPATH=src python scripts/check_safety_canaries.py

      - name: Setup Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Python 3.14 exact-head proof
        shell: bash
        run: |
          set -euo pipefail
          cd "${LIGHTUP_SNAPSHOT}"
          PYTHONPATH=src:tests python -m compileall -q src tests
          PYTHONPATH=src:tests python -m unittest -v \
            test_future_security_remediation_retest_nested_json_integrity \
            test_future_security_remediation_retest_nested_schema_integrity \
            test_future_security_remediation_retest_graph_action_coherence \
            test_future_security_remediation_retest_json_envelope_integrity \
            test_future_security_remediation_retest_plan_handoff
          PYTHONPATH=src:tests python -m unittest discover -s tests -v
          PYTHONPATH=src:tests python -m unittest discover -s tests/integration -v
          PYTHONPATH=src python scripts/check_safety_canaries.py

      - name: Write exact-head receipt
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          RECEIPT_DIR="${RUNNER_TEMP}/lightup-st5-remediation-retest-hardening-json-envelope-receipt"
          mkdir -p "${RECEIPT_DIR}"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "project": "LightUp",
              "issues": [371, 373, 374, 375],
              "branch": os.environ["LIGHTUP_BRANCH"],
              "target_sha": os.environ["LIGHTUP_ACTUAL_SHA"],
              "expected_sha": os.environ["LIGHTUP_EXPECTED_SHA"],
              "host": os.uname().nodename,
              "github_run_id": os.environ["GITHUB_RUN_ID"],
              "python": ["3.11", "3.14"],
              "proof": "compile+all-hardening-dedicated+parent-handoff+full-unit+integration+safety-canaries",
          }
          path = Path(os.environ["RUNNER_TEMP"]) / "lightup-st5-remediation-retest-hardening-json-envelope-receipt" / "receipt.json"
          path.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n")
          print(json.dumps(payload, sort_keys=True))
          PY

      - name: Upload exact-head receipt
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lightup-st5-remediation-retest-hardening-json-envelope-vps-proof
          path: ${{ runner.temp }}/lightup-st5-remediation-retest-hardening-json-envelope-receipt/receipt.json
          if-no-files-found: error

      - name: Cleanup snapshot
        if: always()
        shell: bash
        run: rm -rf "${LIGHTUP_SNAPSHOT:-}"
