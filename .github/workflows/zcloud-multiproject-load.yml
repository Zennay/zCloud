name: zCloud multi-project control-plane load

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zcloud-multiproject-load-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  multiproject-load:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true

      - name: Run bounded 8-slot multi-project load test
        run: python3 -m unittest -v tests.test_multi_project_load
