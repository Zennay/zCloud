name: zSSH standalone VPS release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/zssh-standalone-vps-release.yml
      - scripts/zssh_release_coordination.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zssh-standalone-vps-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: self-hosted
    timeout-minutes: 15
    env:
      ZSSH_RELEASE_SHA: 9fcdfea1bc9d211929e4e649e60aba3be85d2b92
      XDG_RUNTIME_DIR: /run/user/1000
      DBUS_SESSION_BUS_ADDRESS: unix:path=/run/user/1000/bus
    steps:
      - name: Check out zCloud release coordination
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce permanent zCloud VPS runner identity
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/zcloud_vps_runner_guard.py --json \
            | tee "$RUNNER_TEMP/zssh-vps-runner-guard.json"
      - name: Check out exact green zSSH release
        uses: actions/checkout@v4
        with:
          repository: Zennay/zSSH
          ref: ${{ env.ZSSH_RELEASE_SHA }}
          path: zssh-source
          persist-credentials: false
      - name: Check runner identity and source revision
        run: |
          test "$(id -un)" = ubuntu
          test "$(git -C zssh-source rev-parse HEAD)" = "$ZSSH_RELEASE_SHA"
          systemctl --user is-active --quiet zssh.service
          curl --fail --silent --show-error http://127.0.0.1:8788/health
      - name: Register fresh preflight and exclusive zSSH claim
        run: python3 scripts/zssh_release_coordination.py acquire --sha "$ZSSH_RELEASE_SHA"
      - name: Promote standalone release and run live MCP file proof
        env:
          ZSSH_EXPECTED_SHA: ${{ env.ZSSH_RELEASE_SHA }}
        run: bash zssh-source/deploy/install-live.sh "$GITHUB_WORKSPACE/zssh-source"
      - name: Verify live release provenance
        run: |
          test "$(readlink -f /home/ubuntu/.local/share/zssh/current)" = "/home/ubuntu/.local/share/zssh/releases/$ZSSH_RELEASE_SHA"
          systemctl --user is-active --quiet zssh.service
          curl --fail --silent --show-error http://127.0.0.1:8788/health
          echo "ZSSH_STANDALONE_M1_LIVE_GREEN sha=$ZSSH_RELEASE_SHA"
      - name: Verify isolated public review site on exact release
        shell: bash
        run: |
          set -euo pipefail
          test_root="$(mktemp -d)"
          port=18797
          server_pid=""
          cleanup() {
            if [ -n "$server_pid" ]; then kill "$server_pid" 2>/dev/null || true; fi
            rm -rf "$test_root"
          }
          trap cleanup EXIT

          NODE_ENV=production \
          PORT="$port" \
          ZSSH_PLUGIN_PROFILE=public \
          ZSSH_PUBLIC_AUTH_MODE=legacy \
          ZSSH_ALLOW_LEGACY_PUBLIC_AUTH=1 \
          ZSSH_PAIRING_REQUIRED=0 \
          ZSSH_ALLOW_UNPAIRED_PUBLIC=1 \
          ZSSH_EXEC_MODE=disabled \
          ZSSH_PUBLIC_ALLOWED_ROOTS="$test_root" \
          ZSSH_ALLOWED_ROOTS="$test_root" \
          ZSSH_AUDIT_LOG="$test_root/audit.jsonl" \
          ZSSH_DEV_BEARER_TOKEN="$(openssl rand -hex 32)" \
          node "/home/ubuntu/.local/share/zssh/current/server.mjs" >"$test_root/server.log" 2>&1 &
          server_pid=$!

          for attempt in $(seq 1 30); do
            if curl --fail --silent "http://127.0.0.1:$port/health" >/dev/null; then break; fi
            sleep 1
          done
          if ! curl --fail --silent "http://127.0.0.1:$port/health" >/dev/null; then
            echo "ZSSH_PUBLIC_LISTING_SITE_STARTUP_LOG_BEGIN"
            cat "$test_root/server.log" || true
            echo "ZSSH_PUBLIC_LISTING_SITE_STARTUP_LOG_END"
            exit 1
          fi

          for page in / /support /privacy /terms; do
            headers="$test_root/headers-$(echo "$page" | tr '/' '_' | sed 's/^_$/root/').txt"
            body="$test_root/body-$(echo "$page" | tr '/' '_' | sed 's/^_$/root/').html"
            curl --fail --silent --show-error --dump-header "$headers" --output "$body" "http://127.0.0.1:$port$page"
            grep -Eqi '^content-type: text/html' "$headers"
            grep -Eqi "^content-security-policy: .*default-src 'none'" "$headers"
            grep -Eqi "frame-ancestors 'none'" "$headers"
            grep -F 'zSSH' "$body" >/dev/null
          done

          grep -F 'Your Linux target stays yours.' "$test_root/body-root.html" >/dev/null
          grep -F '<h1>Support</h1>' "$test_root/body-_support.html" >/dev/null
          grep -F '<h1>Privacy</h1>' "$test_root/body-_privacy.html" >/dev/null
          grep -F '<h1>Terms</h1>' "$test_root/body-_terms.html" >/dev/null
          echo "ZSSH_PUBLIC_LISTING_SITE_VPS_GREEN sha=$ZSSH_RELEASE_SHA"

      - name: Verify public hosted-client MCP auth
        run: |
          set -a
          source /home/ubuntu/.config/zssh/gateway.env
          set +a
          test -n "$ZSSH_API_KEY"
          test -n "$ZSSH_MCP_CAPABILITY_TOKEN"
          ZSSH_MCP_URL="https://198.244.191.182/mcp" \
          ZSSH_MCP_API_KEY="$ZSSH_API_KEY" \
          ZSSH_MCP_CAPABILITY_TOKEN="" \
          node /home/ubuntu/.local/share/zssh/current/mcp-claude-canary.mjs
          ZSSH_MCP_URL="https://198.244.191.182/mcp" \
          ZSSH_MCP_API_KEY="" \
          ZSSH_MCP_CAPABILITY_TOKEN="$ZSSH_MCP_CAPABILITY_TOKEN" \
          node /home/ubuntu/.local/share/zssh/current/mcp-claude-canary.mjs
      - name: Record evidence-backed zSSH release state receipt
        if: success()
        shell: bash
        env:
          RELEASE_WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          evidence_json="$(python3 - <<'PY'
          import json
          import os

          print(json.dumps({
              "workflow_run_id": os.environ.get("RELEASE_WORKFLOW_RUN_ID"),
              "runner_name": os.environ.get("RUNNER_NAME"),
              "machine": os.uname().nodename,
              "release_sha": os.environ.get("ZSSH_RELEASE_SHA"),
              "live_marker": "ZSSH_STANDALONE_M1_LIVE_GREEN",
              "public_listing_marker": "ZSSH_PUBLIC_LISTING_SITE_VPS_GREEN",
              "public_mcp_auth": "verified",
          }, ensure_ascii=False, sort_keys=True, separators=(",", ":")))
          PY
          )"
          python3 scripts/zcloud_runtime.py             --db /home/ubuntu/zennay-cloud/history.db             receipt             --project zssh             --phase "Public plugin · ship-ready program"             --action "Standalone VPS release and public MCP canaries succeeded"             --commit "$ZSSH_RELEASE_SHA"             --ci-status success             --next-gate "Continue the zSSH ship queue with production auth, hardening and review-ready packaging"             --source "github-actions:zssh-standalone-vps-release"             --evidence-json "$evidence_json"

      - name: Release coordination claim
        if: always()
        run: python3 scripts/zssh_release_coordination.py release
