name: FTMO PR480 atomic-status exact-head proof

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-pr480-atomic-status-proof.yml"

permissions:
  contents: write

concurrency:
  group: ftmo-pr480-atomic-status-proof
  cancel-in-progress: true

jobs:
  proof:
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 20
    env:
      TARGET_SHA: 0ac78390f1c4f6a2684bcd52ca42d09a6f90f9e9
      TARGET_PR: "480"
      EXPECTED_MAIN_SHA: 86dc06dbed0965a8a71891dfe165a58b2a517833
      FTMO_AUTONOMOUS_CLOUD_BUDGET_USD: "0.00"
      FTMO_ALLOW_PAID_AWS: ""
    steps:
      - name: Checkout zCloud receipt workspace
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout exact FTMO PR480 head
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          src="$RUNNER_TEMP/ftmo-pr480-zcloud-$GITHUB_RUN_ID"
          rm -rf "$src"
          git init -q "$src"
          git -C "$src" remote add origin https://github.com/Zennay/Ftmo.git
          git -C "$src" -c protocol.version=2 fetch -q --depth=1 origin "$TARGET_SHA"
          git -C "$src" checkout -q --detach FETCH_HEAD
          test "$(git -C "$src" rev-parse HEAD)" = "$TARGET_SHA"
          python3 - <<'PY'
          import json, os, subprocess
          pr=json.loads(subprocess.check_output(
              ["gh","api",f"repos/Zennay/Ftmo/pulls/{os.environ['TARGET_PR']}"],
              text=True,
          ))
          assert pr["state"] == "open"
          assert pr["head"]["sha"] == os.environ["TARGET_SHA"]
          assert pr["base"]["sha"] == os.environ["EXPECTED_MAIN_SHA"]
          main=subprocess.check_output(
              ["gh","api","repos/Zennay/Ftmo/commits/main","--jq",".sha"],
              text=True,
          ).strip()
          assert main == os.environ["EXPECTED_MAIN_SHA"]
          print("FTMO_PR480_IDENTITY=verified")
          PY

      - name: Prove autonomous status integrity
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr480-zcloud-$GITHUB_RUN_ID"
          venv="$RUNNER_TEMP/ftmo-pr480-zcloud-venv-$GITHUB_RUN_ID"
          rm -rf "$venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install -q -r "$src/requirements-ci.txt"
          "$venv/bin/python" -m pip install -q -e "$src"
          cd "$src"
          "$venv/bin/python" -m py_compile src/prop_trading_ai/ops/autonomous_runtime.py
          "$venv/bin/python" -m pytest -q \
            tests/test_autonomous_runtime.py \
            tests/test_autonomous_deploy_lockstep.py
          "$venv/bin/python" -m pytest -q \
            tests/test_zero_cost_workflow_boundary.py::test_every_repository_workflow_has_no_github_hosted_runner \
            tests/test_zero_cost_workflow_boundary.py::test_diagnostic_zero_cost_workflows_are_self_hosted_and_secret_free
          test "$FTMO_AUTONOMOUS_CLOUD_BUDGET_USD" = "0.00"
          test -z "${FTMO_ALLOW_PAID_AWS:-}"
          echo "FTMO_PR480_ATOMIC_STATUS_PROOF=success"

      - name: Persist durable proof receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-evidence
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          payload = {
              "schema_version": 1,
              "project": "ftmo",
              "pull_request": 480,
              "target_sha": os.environ["TARGET_SHA"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "runner": os.environ.get("RUNNER_NAME", ""),
              "host": "vps-bb300bba",
              "result": "success",
              "proof": [
                  "exact-sha-checkout",
                  "autonomous-runtime-compile",
                  "descriptor-bound-exclusive-status-temp",
                  "no-follow-status-parent-ancestry",
                  "status-parent-permission-seal",
                  "stale-temp-symlink-regression",
                  "symlink-parent-rejection",
                  "file-and-parent-fsync",
                  "permanent-self-hosted-status-integrity-gate",
                  "deploy-lockstep-regressions",
                  "zero-cost-boundary"
              ],
              "paid_cloud_budget_usd": "0.00",
              "research_outcomes_accessed": False,
              "walk_forward_accessed": False,
              "final_holdout_accessed": False,
              "live_or_broker_access_opened": False,
          }
          Path("runtime-evidence/ftmo-pr480-atomic-status-proof.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime-evidence/ftmo-pr480-atomic-status-proof.json
          git commit -m "Record FTMO PR480 exact-head proof $GITHUB_RUN_ID"
          git push origin HEAD:main

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/ftmo-pr480-zcloud-$GITHUB_RUN_ID" "$RUNNER_TEMP/ftmo-pr480-zcloud-venv-$GITHUB_RUN_ID"
