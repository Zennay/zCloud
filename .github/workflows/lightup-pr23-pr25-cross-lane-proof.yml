name: LightUp PR23 PR24 PR25 cross-lane exact-head proof

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/lightup-pr23-pr25-cross-lane-proof.yml"
      - "tests/test_lightup_pr23_pr25_cross_lane_proof.py"
  pull_request:
    paths:
      - ".github/workflows/lightup-pr23-pr25-cross-lane-proof.yml"
      - "tests/test_lightup_pr23_pr25_cross_lane_proof.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lightup-pr23-pr25-cross-lane-proof
  cancel-in-progress: true

jobs:
  preflight:
    name: GitHub-hosted exact-head preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      pr23_sha: ${{ steps.heads.outputs.pr23_sha }}
      pr24_sha: ${{ steps.heads.outputs.pr24_sha }}
      pr25_sha: ${{ steps.heads.outputs.pr25_sha }}
    steps:
      - name: Resolve exact LightUp PR heads
        id: heads
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          resolve() {
            local pr="$1"
            local state sha
            state="$(gh api "repos/Zennay/Lightup/pulls/$pr" --jq .state)"
            sha="$(gh api "repos/Zennay/Lightup/pulls/$pr" --jq .head.sha)"
            test "$state" = "open"
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
            echo "pr${pr}_sha=$sha" >> "$GITHUB_OUTPUT"
            echo "PR${pr}_SHA=$sha" >> "$GITHUB_ENV"
            echo "LIGHTUP_PREFLIGHT_HEAD_RESOLVED PR=$pr SHA=$sha"
          }
          resolve 23
          resolve 24
          resolve 25

      - name: Verify exact LightUp heads before VPS scheduling
        shell: bash
        run: |
          set -Eeuo pipefail

          prove() {
            local pr="$1"
            local sha="$2"
            local work="$RUNNER_TEMP/lightup-preflight-pr$pr-$GITHUB_RUN_ID"
            local scope="$RUNNER_TEMP/lightup-preflight-pr$pr-scope.json"
            local plan="$RUNNER_TEMP/lightup-preflight-pr$pr-plan.json"

            rm -rf "$work"
            git init -q "$work"
            git -C "$work" remote add origin https://github.com/Zennay/Lightup.git
            git -C "$work" -c protocol.version=2 fetch -q --depth=1 origin "$sha"
            git -C "$work" checkout -q --detach FETCH_HEAD
            test "$(git -C "$work" rev-parse HEAD)" = "$sha"

            (
              cd "$work"
              export PYTHONPATH=src
              python3 -m compileall -q src tests
              python3 -m unittest discover -s tests -v

              set +e
              python3 -m lightup.cli scope-check 8.8.8.8 > "$scope"
              code=$?
              set -e
              test "$code" -eq 2
              grep -q '"allowed": false' "$scope"

              python3 -m lightup.cli plan 127.0.0.1 > "$plan"
              grep -q '"execution_enabled": false' "$plan"
            )

            echo "LIGHTUP_HOSTED_PREFLIGHT_GREEN PR=$pr SHA=$sha"
          }

          prove 23 "$PR23_SHA"
          prove 24 "$PR24_SHA"
          prove 25 "$PR25_SHA"

  prove:
    needs: preflight
    runs-on: [self-hosted, zcloud, vps]
    env:
      PR23_SHA: ${{ needs.preflight.outputs.pr23_sha }}
      PR24_SHA: ${{ needs.preflight.outputs.pr24_sha }}
      PR25_SHA: ${{ needs.preflight.outputs.pr25_sha }}
    timeout-minutes: 25
    steps:
      - name: Guard VPS identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = "vps-bb300bba"
          echo "LIGHTUP_CROSS_LANE_HOST=$(hostname) RUNNER_NAME=${RUNNER_NAME:-unknown}"

      - name: Confirm exact LightUp PR heads are unchanged
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          confirm() {
            local pr="$1"
            local expected="$2"
            local state live
            state="$(gh api "repos/Zennay/Lightup/pulls/$pr" --jq .state)"
            live="$(gh api "repos/Zennay/Lightup/pulls/$pr" --jq .head.sha)"
            test "$state" = "open"
            test "$live" = "$expected"
            echo "LIGHTUP_PR_HEAD_STILL_EXACT PR=$pr SHA=$live"
          }
          confirm 23 "$PR23_SHA"
          confirm 24 "$PR24_SHA"
          confirm 25 "$PR25_SHA"

      - name: Verify exact LightUp heads
        shell: bash
        run: |
          set -Eeuo pipefail

          prove() {
            local pr="$1"
            local sha="$2"
            local work="$RUNNER_TEMP/lightup-pr$pr-$GITHUB_RUN_ID"
            local scope="$RUNNER_TEMP/lightup-pr$pr-scope.json"
            local plan="$RUNNER_TEMP/lightup-pr$pr-plan.json"

            rm -rf "$work"
            git init -q "$work"
            git -C "$work" remote add origin https://github.com/Zennay/Lightup.git
            git -C "$work" -c protocol.version=2 fetch -q --depth=1 origin "$sha"
            git -C "$work" checkout -q --detach FETCH_HEAD
            test "$(git -C "$work" rev-parse HEAD)" = "$sha"

            (
              cd "$work"
              export PYTHONPATH=src
              python3 -m compileall -q src tests
              python3 -m unittest discover -s tests -v

              set +e
              python3 -m lightup.cli scope-check 8.8.8.8 > "$scope"
              code=$?
              set -e
              test "$code" -eq 2
              grep -q '"allowed": false' "$scope"

              python3 -m lightup.cli plan 127.0.0.1 > "$plan"
              grep -q '"execution_enabled": false' "$plan"
            )

            echo "LIGHTUP_EXACT_HEAD_PROOF_GREEN PR=$pr SHA=$sha HOST=$(hostname)"
          }

          prove 23 "$PR23_SHA"
          prove 24 "$PR24_SHA"
          prove 25 "$PR25_SHA"

      - name: Build green proof receipt
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts
          receipt="artifacts/lightup-pr23-pr25-cross-lane-proof.json"
          python3 - <<'PY' > "$receipt"
          import json, os, socket
          print(json.dumps({
              "schema_version": 1,
              "result": "success",
              "host": socket.gethostname(),
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "repository": os.environ["GITHUB_REPOSITORY"],
              "heads": {
                  "23": os.environ["PR23_SHA"],
                  "24": os.environ["PR24_SHA"],
                  "25": os.environ["PR25_SHA"],
              },
          }, sort_keys=True, indent=2))
          PY
          cat "$receipt"

      - name: Upload green proof receipt
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lightup-pr23-pr25-cross-lane-proof-${{ github.run_id }}
          path: artifacts/lightup-pr23-pr25-cross-lane-proof.json
          if-no-files-found: error
          retention-days: 14

      - name: Emit proof receipt
        if: always()
        shell: bash
        run: |
          printf 'LIGHTUP_CROSS_LANE_PROOF PR23=%s PR24=%s PR25=%s HOST=%s RUN_ID=%s\n' \
            "${PR23_SHA:-unresolved}" "${PR24_SHA:-unresolved}" "${PR25_SHA:-unresolved}" "$(hostname)" "$GITHUB_RUN_ID"


  publish:
    needs: prove
    if: success()
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Download exact-head proof receipt
        uses: actions/download-artifact@v4
        with:
          pattern: lightup-pr23-pr25-cross-lane-proof-*
          merge-multiple: true
          path: artifacts

      - name: Publish green receipt to control-plane PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          receipt="artifacts/lightup-pr23-pr25-cross-lane-proof.json"
          test -s "$receipt"
          body="$(printf 'LightUp PR23/PR24/PR25 cross-lane exact-head proof is green.\n\n```json\n%s\n```' "$(cat "$receipt")")"
          gh api repos/Zennay/zCloud/issues/491/comments -f body="$body" >/dev/null
          echo "LIGHTUP_CROSS_LANE_RECEIPT_PUBLISHED issue=491"
