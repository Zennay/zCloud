name: zCloud VPS deploy

on:
  workflow_run:
    workflows: ["zCloud regression smoke"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: zcloud-production-deploy
  # Never cancel an in-flight production transaction. A queued workflow_run
  # must prove that its tested SHA is still the current main head before writes.
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Check out the exact green main revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          clean: true
          fetch-depth: 1

      - name: Reject stale workflow-run revisions
        id: freshness
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.workflow_run.head_sha }}"
          current="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [[ -z "$current" ]]; then
            echo "Could not resolve current main SHA" >&2
            exit 2
          fi
          if [[ "$current" != "$expected" ]]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "STALE_DEPLOY_SKIPPED expected=$expected current=$current"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "CURRENT_MAIN_CONFIRMED sha=$current"
          fi

      - name: Quarantine stale selector backup before guarded promotion
        if: steps.freshness.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          backup="/home/ubuntu/zennay-cloud/public/zcloud-worker.user.js.pre-effort-selector.bak"
          if [[ -f "$backup" ]]; then
            quarantine="$HOME/.local/state/zcloud/runtime-backups"
            mkdir -p "$quarantine"
            stamp="$(date -u +%Y%m%dT%H%M%SZ)"
            mv -- "$backup" "$quarantine/zcloud-worker.user.js.pre-effort-selector.bak.$stamp"
            echo "QUARANTINED_STALE_SELECTOR_BACKUP=$quarantine/zcloud-worker.user.js.pre-effort-selector.bak.$stamp"
          else
            echo "NO_STALE_SELECTOR_BACKUP"
          fi

      - name: Ensure Firefox automation service for guarded canaries
        if: steps.freshness.outputs.deploy == 'true'
        shell: bash
        env:
          XDG_RUNTIME_DIR: /run/user/1000
          DBUS_SESSION_BUS_ADDRESS: unix:path=/run/user/1000/bus
        run: |
          set -euo pipefail
          if systemctl --user is-active --quiet chatgpt-firefox.service; then
            echo "FIREFOX_AUTOMATION_SERVICE=already_active"
          else
            systemctl --user start chatgpt-firefox.service
            systemctl --user is-active --quiet chatgpt-firefox.service
            echo "FIREFOX_AUTOMATION_SERVICE=recovered"
          fi

      - name: Promote Violentmonkey worker
        if: steps.freshness.outputs.deploy == 'true'
        run: |
          python3 scripts/zcloud_transactional_promote.py \
            --candidate "$GITHUB_WORKSPACE" \
            --path public/zcloud-worker.user.js \
            --path firefox-extension/background.js \
            --actor "github-actions-vps-deploy" \
            --json

      - name: Promote backend and autonomy policy
        if: steps.freshness.outputs.deploy == 'true'
        run: |
          python3 scripts/zcloud_transactional_promote.py \
            --candidate "$GITHUB_WORKSPACE" \
            --path server.py \
            --path scripts/zcloud_recovery.py \
            --path autonomy-policy.json \
            --path vps-execution-policy.json \
            --path portfolio_queue.seed.json \
            --actor "github-actions-vps-deploy" \
            --json

      - name: Promote mobile UI
        if: steps.freshness.outputs.deploy == 'true'
        run: |
          python3 scripts/zcloud_transactional_promote.py \
            --candidate "$GITHUB_WORKSPACE" \
            --path public/app.js \
            --path public/index.html \
            --path public/style.css \
            --path public/enhancements.js \
            --path public/enhancements.css \
            --actor "github-actions-vps-deploy" \
            --json

      - name: Promote translated project catalog
        if: steps.freshness.outputs.deploy == 'true'
        run: |
          python3 scripts/zcloud_transactional_promote.py \
            --candidate "$GITHUB_WORKSPACE" \
            --path projects.json \
            --actor "github-actions-vps-deploy" \
            --json

      - name: Apply low-priority Firefox scheduler profile
        if: steps.freshness.outputs.deploy == 'true'
        run: |
          install -D -m 0644 "$GITHUB_WORKSPACE/deploy/chatgpt-firefox.service" "$HOME/.config/systemd/user/chatgpt-firefox.service"
          export XDG_RUNTIME_DIR=/run/user/1000
          export DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1000/bus
          systemctl --user daemon-reload
          systemctl --user set-property --runtime chatgpt-firefox.service CPUWeight=100
