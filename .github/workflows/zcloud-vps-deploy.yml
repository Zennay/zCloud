name: zCloud VPS deploy

on:
  workflow_run:
    workflows: ["zCloud regression smoke"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read
  statuses: write

jobs:
  deploy:
    if: github.run_attempt == 1 && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    concurrency:
      group: zcloud-production-deploy
      # Never cancel an in-flight production transaction. Keeping concurrency
      # at job scope means skipped deploy reruns cannot evict a fresh pending job.
      # Exact-green revisions are serialized; stale revisions self-skip before
      # any VPS write, leaving only current main eligible for promotion.
      cancel-in-progress: false
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 25
    steps:
      - name: Check out current main candidate
        uses: actions/checkout@v4
        with:
          ref: main
          clean: true
          fetch-depth: 513

      - name: Enforce permanent zCloud VPS runner identity
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/zcloud_vps_runner_guard.py --json \
            | tee "$RUNNER_TEMP/zcloud-vps-runner-guard.json"

      - name: Resolve latest green main revision
        id: freshness
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          resolved="$(git rev-parse HEAD)"
          deadline=$((SECONDS + 180))
          poll_seconds=8

          while true; do
            current="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
            if [[ -z "$current" ]]; then
              echo "Could not resolve current main SHA" >&2
              exit 2
            fi

            if [[ "$current" != "$resolved" ]]; then
              echo "MAIN_MOVED_DURING_GREEN_WAIT resolved=$resolved current=$current"
              git fetch --no-tags --depth=513 origin main
              git checkout --detach "$current"
              resolved="$(git rev-parse HEAD)"
              if [[ "$resolved" != "$current" ]]; then
                echo "Failed to check out current main SHA expected=$current actual=$resolved" >&2
                exit 2
              fi
              echo "COALESCED_CURRENT_MAIN sha=$resolved"
            fi

            export RESOLVED_SHA="$resolved"
            set +e
            regression_match="$(python3 - <<'PY'
          import json
          import os
          import subprocess
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          current_sha = os.environ["RESOLVED_SHA"]
          token = os.environ["GITHUB_TOKEN"]
          protected_paths = [
              ".github/workflows/zcloud-vps-deploy.yml",
              ".github/workflows/zcloud-regression-smoke.yml",
              "tests",
              "server.py",
              "enhancements.py",
              "project_runtime.py",
              "lane_generator.py",
              "project-contracts.json",
              "autonomy-policy.json",
              "vps-execution-policy.json",
              "portfolio_queue.seed.json",
              "firefox-extension",
              "public",
              "deploy",
              "scripts",
          ]

          request = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/workflows/zcloud-regression-smoke.yml/runs"
              "?branch=main&status=success&per_page=100",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "zcloud-vps-deploy",
              },
          )
          with urllib.request.urlopen(request, timeout=15) as response:
              payload = json.load(response)

          eligible = [
              run
              for run in payload.get("workflow_runs", [])
              if str(run.get("conclusion") or "") == "success"
              and str(run.get("event") or "") in {"push", "workflow_dispatch"}
              and str(run.get("head_branch") or "") == "main"
          ]

          for run in eligible:
              green_sha = str(run.get("head_sha") or "")
              if not green_sha:
                  continue
              if green_sha == current_sha:
                  print(f'{int(run["id"])}|{green_sha}|exact')
                  raise SystemExit(0)

              ancestor = subprocess.run(
                  ["git", "merge-base", "--is-ancestor", green_sha, current_sha],
                  check=False,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              )
              if ancestor.returncode != 0:
                  continue

              diff = subprocess.run(
                  ["git", "diff", "--quiet", green_sha, current_sha, "--", *protected_paths],
                  check=False,
              )
              if diff.returncode == 0:
                  print(f'{int(run["id"])}|{green_sha}|runtime-equivalent')
                  raise SystemExit(0)
              if diff.returncode not in {0, 1}:
                  raise SystemExit(4)

          raise SystemExit(3)
          PY
            )"
            regression_rc=$?
            set -e

            if [[ "$regression_rc" -eq 0 ]]; then
              IFS='|' read -r regression_id regression_sha regression_mode <<<"$regression_match"
              if [[ -z "$regression_id" || -z "$regression_sha" || -z "$regression_mode" ]]; then
                echo "Malformed regression evidence: $regression_match" >&2
                exit 2
              fi
              {
                echo "deploy=true"
                echo "deploy_sha=$resolved"
                echo "regression_run_id=$regression_id"
                echo "regression_sha=$regression_sha"
                echo "regression_mode=$regression_mode"
              } >> "$GITHUB_OUTPUT"
              if [[ "$regression_mode" == "exact" ]]; then
                echo "GREEN_MAIN_CONFIRMED sha=$resolved regression_run_id=$regression_id"
              else
                echo "GREEN_RUNTIME_EQUIVALENT current_sha=$resolved regression_sha=$regression_sha regression_run_id=$regression_id"
              fi
              exit 0
            fi
            if [[ "$regression_rc" -ne 3 ]]; then
              echo "Failed to resolve green regression evidence for sha=$resolved rc=$regression_rc" >&2
              exit "$regression_rc"
            fi

            if (( SECONDS >= deadline )); then
              echo "deploy=false" >> "$GITHUB_OUTPUT"
              echo "CURRENT_MAIN_NOT_GREEN_TIMEOUT sha=$resolved wait_seconds=180"
              exit 0
            fi

            echo "GREEN_WAIT_CURRENT_MAIN sha=$resolved poll_seconds=$poll_seconds"
            sleep "$poll_seconds"
          done

      - name: Reconfirm green main before VPS writes
        id: prewrite
        if: steps.freshness.outputs.deploy == 'true'
        shell: bash
        env:
          DEPLOY_SHA: ${{ steps.freshness.outputs.deploy_sha }}
        run: |
          set -euo pipefail
          current="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [[ -n "$current" && "$current" == "$DEPLOY_SHA" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "PREWRITE_MAIN_CONFIRMED sha=$DEPLOY_SHA"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "MAIN_MOVED_BEFORE_VPS_WRITE resolved=$DEPLOY_SHA current=$current"
          fi

      - name: Mark production deploy pending
        if: steps.prewrite.outputs.deploy == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ steps.freshness.outputs.deploy_sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["DEPLOY_SHA"]
          token = os.environ["GITHUB_TOKEN"]
          run_url = f"{os.environ['GITHUB_SERVER_URL']}/{repo}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          payload = json.dumps({
              "state": "pending",
              "context": "zcloud/vps-production",
              "description": "VPS production promotion in progress",
              "target_url": run_url,
          }).encode()
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/statuses/{sha}",
              data=payload,
              method="POST",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
                  "User-Agent": "zcloud-vps-deploy",
              },
          )
          with urllib.request.urlopen(request, timeout=15) as response:
              if response.status != 201:
                  raise RuntimeError(f"unexpected GitHub status response: {response.status}")
          print(f"PRODUCTION_DEPLOY_STATUS=pending sha={sha}")
          PY

      - name: Suspend external self-heal during guarded deploy
        id: self_heal_guard
        if: steps.prewrite.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sentinel="/home/ubuntu/zennay-cloud/.disable-self-heal"
          if [[ -e "$sentinel" ]]; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "SELF_HEAL_GUARD=preexisting"
          else
            touch "$sentinel"
            echo "created=true" >> "$GITHUB_OUTPUT"
            echo "SELF_HEAL_GUARD=created"
          fi

      - name: Bootstrap aligned backend dependencies before health gate
        id: backend_dependency_bootstrap
        if: steps.prewrite.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          root="/home/ubuntu/zennay-cloud"
          live_server="$root/server.py"
          candidate_server="$GITHUB_WORKSPACE/server.py"

          echo "changed=false" >> "$GITHUB_OUTPUT"
          echo "had_live_runtime=false" >> "$GITHUB_OUTPUT"
          echo "had_live_contract=false" >> "$GITHUB_OUTPUT"

          live_server_sha="$(sha256sum "$live_server" | awk '{print $1}')"
          candidate_server_sha="$(sha256sum "$candidate_server" | awk '{print $1}')"
          if [[ "$live_server_sha" != "$candidate_server_sha" ]]; then
            echo "BACKEND_DEPENDENCY_BOOTSTRAP=skipped_server_not_candidate"
            exit 0
          fi

          changed=false
          for spec in \
            "project_runtime.py:runtime" \
            "project-contracts.json:contract"
          do
            rel="${spec%%:*}"
            label="${spec##*:}"
            live="$root/$rel"
            candidate="$GITHUB_WORKSPACE/$rel"
            backup="$RUNNER_TEMP/$rel.prehealth.bak"

            candidate_sha="$(sha256sum "$candidate" | awk '{print $1}')"
            if [[ -f "$live" ]]; then
              live_sha="$(sha256sum "$live" | awk '{print $1}')"
              if [[ "$live_sha" == "$candidate_sha" ]]; then
                echo "BACKEND_DEPENDENCY_${label^^}=already_aligned"
                continue
              fi
              cp -p "$live" "$backup"
              echo "had_live_$label=true" >> "$GITHUB_OUTPUT"
            fi

            stage="$root/.$rel.zcloud-bootstrap.$$"
            install -m 0644 "$candidate" "$stage"
            mv -f "$stage" "$live"
            changed=true
            echo "BACKEND_DEPENDENCY_${label^^}=aligned sha=$candidate_sha"
          done

          if [[ "$changed" == "true" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "BACKEND_DEPENDENCY_BOOTSTRAP=already_aligned"
          fi

      - name: Recover zCloud health before guarded promotion
        if: steps.prewrite.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          service="zennay-cloud.service"
          url="http://127.0.0.1:8765/"
          lock_file="/run/zcloud-self-heal.lock"

          # The self-heal timer owns this /run lock as root. Hold the same lock
          # through sudo instead of trying to open the root-owned file as the
          # Actions runner user. The recovery body runs under that lock and the
          # sentinel above prevents a new self-heal pass from racing it.
          sudo -n flock -w 240 "$lock_file" bash -s <<'ZCLOUD_RECOVERY'
          set -euo pipefail
          service="zennay-cloud.service"
          url="http://127.0.0.1:8765/"

          healthy() {
            systemctl is-active --quiet "$service" &&
              curl -fsS --max-time 4 "$url" >/dev/null
          }

          if healthy; then
            echo "ZCLOUD_PREDEPLOY_HEALTH=already_green"
            exit 0
          fi

          echo "ZCLOUD_PREDEPLOY_HEALTH=recovering"
          systemctl reset-failed "$service" || true
          systemctl restart "$service"
          for _ in $(seq 1 20); do
            if healthy; then
              echo "ZCLOUD_PREDEPLOY_HEALTH=recovered"
              exit 0
            fi
            sleep 1
          done

          systemctl --no-pager --full status "$service" || true
          journalctl -u "$service" -n 120 --no-pager || true
          echo "ZCLOUD_PREDEPLOY_HEALTH=failed"
          exit 1
          ZCLOUD_RECOVERY

      - name: Roll back failed pre-health dependency bootstrap
        if: failure() && steps.backend_dependency_bootstrap.outputs.changed == 'true'
        shell: bash
        env:
          HAD_LIVE_RUNTIME: ${{ steps.backend_dependency_bootstrap.outputs.had_live_runtime }}
          HAD_LIVE_CONTRACT: ${{ steps.backend_dependency_bootstrap.outputs.had_live_contract }}
        run: |
          set -euo pipefail
          root="/home/ubuntu/zennay-cloud"
          for spec in \
            "project_runtime.py:runtime:$HAD_LIVE_RUNTIME" \
            "project-contracts.json:contract:$HAD_LIVE_CONTRACT"
          do
            rel="${spec%%:*}"
            rest="${spec#*:}"
            label="${rest%%:*}"
            had_live="${rest##*:}"
            live="$root/$rel"
            backup="$RUNNER_TEMP/$rel.prehealth.bak"
            if [[ "$had_live" == "true" ]]; then
              install -m 0644 "$backup" "$live"
              echo "BACKEND_DEPENDENCY_${label^^}_ROLLBACK=restored"
            else
              rm -f "$live"
              echo "BACKEND_DEPENDENCY_${label^^}_ROLLBACK=removed"
            fi
          done
          sudo -n systemctl restart zennay-cloud.service || true

      - name: Quarantine stale non-runtime userscript backups before guarded promotion
        if: steps.prewrite.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          live="/home/ubuntu/zennay-cloud/public"
          quarantine="$HOME/.local/state/zcloud/runtime-backups"
          mkdir -p "$quarantine"
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          shopt -s nullglob
          backups=(
            "$live/zcloud-worker.user.js.pre-effort-selector.bak"
            "$live"/zcloud-worker.user.js.bak-*
          )
          moved=0
          for backup in "${backups[@]}"; do
            [[ -f "$backup" ]] || continue
            name="$(basename "$backup")"
            target="$quarantine/$name.$stamp"
            suffix=0
            while [[ -e "$target" ]]; do
              suffix=$((suffix + 1))
              target="$quarantine/$name.$stamp.$suffix"
            done
            mv -- "$backup" "$target"
            echo "QUARANTINED_NON_RUNTIME_BACKUP=$target"
            moved=$((moved + 1))
          done
          if [[ "$moved" -eq 0 ]]; then
            echo "NO_STALE_NON_RUNTIME_USERSCRIPT_BACKUPS"
          fi

      - name: Quarantine generated Python bytecode before guarded promotion
        if: steps.prewrite.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          live="/home/ubuntu/zennay-cloud/scripts/__pycache__"
          if [[ ! -d "$live" ]]; then
            echo "NO_LIVE_PYTHON_BYTECODE_CACHE"
            exit 0
          fi
          quarantine="$HOME/.local/state/zcloud/runtime-backups"
          mkdir -p "$quarantine"
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          target="$quarantine/scripts-__pycache__.$stamp"
          suffix=0
          while [[ -e "$target" ]]; do
            suffix=$((suffix + 1))
            target="$quarantine/scripts-__pycache__.$stamp.$suffix"
          done
          mv -- "$live" "$target"
          echo "QUARANTINED_LIVE_PYTHON_BYTECODE=$target"

      - name: Ensure Firefox automation service for guarded canaries
        if: steps.prewrite.outputs.deploy == 'true'
        shell: bash
        env:
          XDG_RUNTIME_DIR: /run/user/1000
          DBUS_SESSION_BUS_ADDRESS: unix:path=/run/user/1000/bus
        run: |
          set -euo pipefail
          if systemctl --user is-active --quiet chatgpt-firefox.service; then
            echo "FIREFOX_AUTOMATION_SERVICE=already_active"
            exit 0
          fi

          legacy_disable="$HOME/.config/systemd/user/chatgpt-firefox.service.d/10-legacy-disabled.conf"
          if [[ -f "$legacy_disable" ]] \
            && grep -qi 'Violentmonkey only' "$legacy_disable" \
            && grep -q 'ExecCondition=/bin/false' "$legacy_disable"; then
            echo "FIREFOX_AUTOMATION_SERVICE=intentionally_disabled_violentmonkey"
            exit 0
          fi

          # The Firefox unit explicitly Requires= the display and window-manager
          # units. Recover those first so a stale dependency cannot block an
          # otherwise unrelated backend/queue deployment.
          for dependency in chatgpt-display.service chatgpt-openbox.service; do
            if ! systemctl --user is-active --quiet "$dependency"; then
              systemctl --user reset-failed "$dependency" || true
              systemctl --user start "$dependency"
            fi
            systemctl --user is-active --quiet "$dependency"
          done

          systemctl --user reset-failed chatgpt-firefox.service || true
          if ! systemctl --user start chatgpt-firefox.service; then
            systemctl --user --no-pager --full status chatgpt-display.service chatgpt-openbox.service chatgpt-firefox.service || true
            journalctl --user -u chatgpt-display.service -u chatgpt-openbox.service -u chatgpt-firefox.service -n 120 --no-pager || true
            exit 1
          fi

          for _ in $(seq 1 15); do
            if systemctl --user is-active --quiet chatgpt-firefox.service; then
              echo "FIREFOX_AUTOMATION_SERVICE=recovered"
              exit 0
            fi
            sleep 2
          done

          systemctl --user --no-pager --full status chatgpt-display.service chatgpt-openbox.service chatgpt-firefox.service || true
          journalctl --user -u chatgpt-display.service -u chatgpt-openbox.service -u chatgpt-firefox.service -n 120 --no-pager || true
          echo "FIREFOX_AUTOMATION_SERVICE=failed"
          exit 1

      - name: Enter browser safe-idle for guarded promotion
        id: safe_idle
        if: steps.prewrite.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/zcloud_deploy_safe_idle.py enter \
            --state "$RUNNER_TEMP/zcloud-deploy-safe-idle.json" \
            --timeout-seconds 480 \
            --json

      - name: Repair legacy runtime project schema
        if: steps.prewrite.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/zcloud_runtime_project_schema_repair.py \
            --candidate "$GITHUB_WORKSPACE" \
            --json

      - name: Authorize one-shot known live server reconciliation
        id: server_drift_reconcile
        if: steps.prewrite.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          root="/home/ubuntu/zennay-cloud"
          pointer="$HOME/.local/state/zcloud/recovery/last-known-good.json"
          expected_live_sha="160c82219aca441644edb6acebbbfa92914e7f5e71736dbc75481576a815c80f"
          expected_lkg="20261002T105256Z-a57439eb"
          live_sha="$(sha256sum "$root/server.py" | awk '{print $1}')"
          current_lkg="$(python3 - "$pointer" <<'PY'
          import json
          import sys
          from pathlib import Path
          print(json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))["snapshot_id"])
          PY
          )"

          if [[ "$live_sha" == "$expected_live_sha" && "$current_lkg" == "$expected_lkg" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "KNOWN_LIVE_SERVER_RECONCILE=authorized live_sha=$live_sha lkg=$current_lkg"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "KNOWN_LIVE_SERVER_RECONCILE=not_applicable live_sha=$live_sha lkg=$current_lkg"
          fi

      - name: Promote backend runtime core
        if: steps.prewrite.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          reconcile_args=()
          if [[ "${{ steps.server_drift_reconcile.outputs.enabled }}" == "true" ]]; then
            reconcile_args+=(
              --reconcile-known-live-sha
              "server.py=160c82219aca441644edb6acebbbfa92914e7f5e71736dbc75481576a815c80f"
            )
          fi
          python3 scripts/zcloud_transactional_promote.py \
            --candidate "$GITHUB_WORKSPACE" \
            --path server.py \
            --path project_runtime.py \
            --path project-contracts.json \
            --path lane_generator.py \
            --path vps-execution-policy.json \
            --preserve-prechange-drift public/zcloud-worker.user.js \
            --preserve-prechange-drift firefox-extension/background.js \
            --allow-recent-ancestor-prechange-drift \
            --preserve-schema-validated-runtime-config \
            "${reconcile_args[@]}" \
            --actor "github-actions-vps-deploy" \
            --json

      - name: Promote autonomy policies and queue seed
        if: steps.prewrite.outputs.deploy == 'true'
        run: |
          python3 scripts/zcloud_transactional_promote.py \
            --candidate "$GITHUB_WORKSPACE" \
            --path scripts/zcloud_recovery.py \
            --path autonomy-policy.json \
            --path portfolio_queue.seed.json \
            --preserve-prechange-drift public/zcloud-worker.user.js \
            --preserve-prechange-drift firefox-extension/background.js \
            --preserve-schema-validated-runtime-config \
            --actor "github-actions-vps-deploy" \
            --json

      - name: Promote Violentmonkey worker
        if: steps.prewrite.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          worker_paths=(--path public/zcloud-worker.user.js)
          legacy_disable="$HOME/.config/systemd/user/chatgpt-firefox.service.d/10-legacy-disabled.conf"
          if [[ -f "$legacy_disable" ]] \
            && grep -qi 'Violentmonkey only' "$legacy_disable" \
            && grep -q 'ExecCondition=/bin/false' "$legacy_disable"; then
            echo "WORKER_RUNTIME_MODE=violentmonkey_only"
          else
            worker_paths+=(--path firefox-extension/background.js)
            echo "WORKER_RUNTIME_MODE=firefox_extension_active"
          fi
          python3 scripts/zcloud_transactional_promote.py \
            --candidate "$GITHUB_WORKSPACE" \
            "${worker_paths[@]}" \
            --preserve-schema-validated-runtime-config \
            --actor "github-actions-vps-deploy" \
            --json

      - name: Promote mobile UI
        if: steps.prewrite.outputs.deploy == 'true'
        run: |
          python3 scripts/zcloud_transactional_promote.py \
            --candidate "$GITHUB_WORKSPACE" \
            --path public/app.js \
            --path public/index.html \
            --path public/style.css \
            --path public/enhancements.js \
            --path public/enhancements.css \
            --preserve-schema-validated-runtime-config \
            --actor "github-actions-vps-deploy" \
            --json

      - name: Apply low-priority Firefox scheduler profile
        if: steps.prewrite.outputs.deploy == 'true'
        run: |
          install -D -m 0644 "$GITHUB_WORKSPACE/deploy/chatgpt-firefox.service" "$HOME/.config/systemd/user/chatgpt-firefox.service"
          export XDG_RUNTIME_DIR=/run/user/1000
          export DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1000/bus
          systemctl --user daemon-reload
          systemctl --user set-property --runtime chatgpt-firefox.service CPUWeight=100

      - name: Install aligned self-heal probe
        if: steps.prewrite.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo -n install -m 0755 "$GITHUB_WORKSPACE/scripts/zcloud-self-heal.sh" /usr/local/sbin/zcloud-self-heal
          echo "SELF_HEAL_PROBE_INSTALLED=max_time_8"

      - name: Restore browser workers after guarded promotion
        if: always() && steps.prewrite.outputs.deploy == 'true' && steps.safe_idle.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/zcloud_deploy_safe_idle.py restore \
            --state "$RUNNER_TEMP/zcloud-deploy-safe-idle.json" \
            --json

      - name: Capture green production deploy evidence
        if: steps.prewrite.outputs.deploy == 'true'
        shell: bash
        env:
          DEPLOY_SHA: ${{ steps.freshness.outputs.deploy_sha }}
        run: |
          set -euo pipefail
          health="$RUNNER_TEMP/zcloud-production-health.json"
          evidence="$RUNNER_TEMP/zcloud-production-deploy-evidence.json"
          set +e
          python3 scripts/zcloud_healthcheck.py --json | tee "$health"
          health_rc=${PIPESTATUS[0]}
          set -e
          if [[ "$health_rc" -ne 0 ]]; then
            echo "PRODUCTION_HEALTH_BLOCKED rc=$health_rc" >&2
            exit "$health_rc"
          fi
          python3 - "$health" "$evidence" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          health_path = Path(sys.argv[1])
          evidence_path = Path(sys.argv[2])
          health = json.loads(health_path.read_text(encoding="utf-8"))
          if not health.get("ok"):
              raise SystemExit("production health contract is not green")

          pointer_path = Path.home() / ".local/state/zcloud/recovery/last-known-good.json"
          pointer = json.loads(pointer_path.read_text(encoding="utf-8"))
          manifest_path = Path(pointer["manifest"])
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          lkg_evidence = str(manifest.get("evidence") or "")
          if "POSTDEPLOY_GREEN" not in lkg_evidence:
              raise SystemExit("latest LKG is missing POSTDEPLOY_GREEN evidence")

          result = {
              "ok": True,
              "commit_sha": os.environ["DEPLOY_SHA"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "runner_name": os.environ.get("RUNNER_NAME"),
              "machine": os.uname().nodename,
              "health_summary": health.get("summary"),
              "lkg_snapshot_id": pointer.get("snapshot_id"),
              "lkg_updated_at": pointer.get("updated_at"),
              "lkg_evidence": lkg_evidence,
          }
          evidence_path.write_text(json.dumps(result, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(
              "PRODUCTION_DEPLOY_EVIDENCE_GREEN "
              f"sha={result['commit_sha']} "
              f"run_id={result['workflow_run_id']} "
              f"runner={result['runner_name']} "
              f"lkg={result['lkg_snapshot_id']}"
          )
          PY

      - name: Upload production deploy evidence
        if: steps.prewrite.outputs.deploy == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: zcloud-production-deploy-evidence-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/zcloud-production-health.json
            ${{ runner.temp }}/zcloud-production-deploy-evidence.json
            ${{ runner.temp }}/zcloud-deploy-safe-idle.json

      - name: Resume external self-heal
        if: always() && steps.freshness.outputs.deploy == 'true' && steps.self_heal_guard.outputs.created == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -f /home/ubuntu/zennay-cloud/.disable-self-heal
          echo "SELF_HEAL_GUARD=released"

      - name: Record evidence-backed production state receipt
        if: success() && steps.freshness.outputs.deploy == 'true' && steps.prewrite.outputs.deploy == 'true'
        shell: bash
        env:
          DEPLOY_SHA: ${{ steps.freshness.outputs.deploy_sha }}
          REGRESSION_RUN_ID: ${{ steps.freshness.outputs.regression_run_id }}
        run: |
          set -euo pipefail
          deploy_evidence="$RUNNER_TEMP/zcloud-production-deploy-evidence.json"
          evidence_json="$(python3 - "$deploy_evidence" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          deployment = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          payload = {
              "workflow_run_id": deployment.get("workflow_run_id"),
              "regression_run_id": os.environ.get("REGRESSION_RUN_ID"),
              "runner_name": deployment.get("runner_name"),
              "machine": deployment.get("machine"),
              "lkg_snapshot_id": deployment.get("lkg_snapshot_id"),
              "lkg_updated_at": deployment.get("lkg_updated_at"),
              "production_status": "HEALTH_GREEN+POSTDEPLOY_GREEN",
          }
          print(json.dumps(payload, ensure_ascii=False, sort_keys=True, separators=(",", ":")))
          PY
          )"
          python3 scripts/zcloud_runtime.py \
            --db /home/ubuntu/zennay-cloud/history.db \
            receipt \
            --project cloud \
            --phase "Runtime control-plane rollout" \
            --action "Guarded VPS production deploy succeeded" \
            --commit "$DEPLOY_SHA" \
            --ci-status success \
            --next-gate "Finish project receipt backfill and remaining runtime-control-plane rollout gates" \
            --source "github-actions:zcloud-vps-deploy" \
            --evidence-json "$evidence_json"

          python3 - "$DEPLOY_SHA" <<'PY'
          import json
          import sys
          import urllib.request

          expected_sha = sys.argv[1]
          with urllib.request.urlopen("http://127.0.0.1:8765/api/status", timeout=10) as response:
              payload = json.load(response)
          project = next((item for item in payload.get("projects", []) if item.get("id") == "cloud"), None)
          if not project:
              raise SystemExit("cloud project missing from live /api/status")
          state = project.get("execution_state") or {}
          if project.get("state_source") != "evidence_receipt":
              raise SystemExit("cloud live state is not receipt-backed")
          if state.get("commit_sha") != expected_sha:
              raise SystemExit(
                  f"cloud receipt commit mismatch expected={expected_sha} actual={state.get('commit_sha')}"
              )
          if state.get("ci_status") != "success":
              raise SystemExit("cloud receipt does not report successful production state")
          print(
              "ZCLOUD_PRODUCTION_RECEIPT_GREEN "
              f"receipt_id={state.get('receipt_id')} sha={expected_sha}"
          )
          PY

      - name: Publish production deploy result
        if: always() && steps.freshness.outputs.deploy == 'true' && steps.prewrite.outputs.deploy == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ steps.freshness.outputs.deploy_sha }}
          DEPLOY_RESULT: ${{ job.status }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          result = os.environ.get("DEPLOY_RESULT", "failure")
          state = "success" if result == "success" else "failure"
          description = (
              "HEALTH_GREEN + POSTDEPLOY_GREEN LKG"
              if state == "success"
              else "VPS production promotion failed"
          )
          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["DEPLOY_SHA"]
          token = os.environ["GITHUB_TOKEN"]
          run_url = f"{os.environ['GITHUB_SERVER_URL']}/{repo}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          payload = json.dumps({
              "state": state,
              "context": "zcloud/vps-production",
              "description": description,
              "target_url": run_url,
          }).encode()
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/statuses/{sha}",
              data=payload,
              method="POST",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
                  "User-Agent": "zcloud-vps-deploy",
              },
          )
          with urllib.request.urlopen(request, timeout=15) as response:
              if response.status != 201:
                  raise RuntimeError(f"unexpected GitHub status response: {response.status}")
          print(f"PRODUCTION_DEPLOY_STATUS={state} sha={sha}")
          PY
