name: zCloud VPS deploy

on:
  workflow_run:
    workflows: ["zCloud regression smoke"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: zcloud-production-deploy
  cancel-in-progress: true

jobs:
  handoff:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Hand off green main to VPS-native deployer
        run: |
          echo "Green zCloud main: ${{ github.event.workflow_run.head_sha }}"
          echo "The VPS-native zcloud-autodeploy.timer will independently verify this exact SHA and promote it transactionally."
