name: zCloud scheduled launch burst budget (hosted source-only)

on:
  pull_request:
    branches: [main]
    paths:
      # Run for any workflow change that may add or shift a cron event.
      - .github/workflows/**
      - .github/workflows/zcloud-schedule-burst-budget-20261016.yml
      - scripts/zcloud_schedule_burst_budget_20261016.py
      - tests/test_zcloud_schedule_burst_budget_20261016.py

permissions:
  contents: read

concurrency:
  group: zcloud-schedule-burst-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  source-budget:
    # Required checks must fail rather than SKIP on untrusted fork PRs:
    # GitHub may treat a skipped required check as successful.
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Reject untrusted PR event before any source checkout
        shell: bash
        env:
          EVENT_KIND: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
        run: |
          set -euo pipefail
          test "$EVENT_KIND" = pull_request
          test "$GITHUB_REPOSITORY" = Zennay/zCloud
          test "$GITHUB_BASE_REF" = main
          test "$HEAD_REPO" = "$GITHUB_REPOSITORY"
          test "$BASE_REPO" = "$GITHUB_REPOSITORY"
      - name: Fetch exact immutable candidate and historical baseline
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - name: Verify immutable provenance before executing candidate tests
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$HEAD_SHA^{commit}"
          # An out-of-date PR can omit main schedules. Counting its source
          # instead of the actual future merge could understate congestion.
          if ! git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA"; then
            echo "Denied: PR head must descend from exact main baseline" >&2
            exit 1
          fi
      - name: Run adversarial Git-only regression and compile
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/zcloud_schedule_burst_budget_20261016.py
          python3 -m unittest -v tests.test_zcloud_schedule_burst_budget_20261016
      - name: Reject increased theoretical workflow start congestion
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python3 scripts/zcloud_schedule_burst_budget_20261016.py \
            --baseline-sha "$BASE_SHA" --candidate-sha "$HEAD_SHA" \
            | tee "$RUNNER_TEMP/zcloud-schedule-burst.json"
          python3 - "$RUNNER_TEMP/zcloud-schedule-burst.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          report = json.loads(Path(sys.argv[1]).read_text())
          assert report['mutation_performed'] is False
          assert report['deploy_authorized'] is False
          assert report['observation_only'] is True
          print(f"Schedule starts: {report['baseline_crons']} -> {report['candidate_crons']}")
          print(f"Theoretical peak: {report['baseline_peak']} -> {report['candidate_peak']}")
          PY
      - name: Publish readable review receipt even when policy rejects change
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          report = Path(os.environ['RUNNER_TEMP']) / 'zcloud-schedule-burst.json'
          lines = [
              '## Scheduled Actions launch-burst guard',
              '',
              '- Mode: **read-only Git-source estimate; not production approval**',
              '- Budget: at most 4 theoretical launch starts in one minute,',
              '  grandfathering an existing higher baseline without growth.',
          ]
          if report.exists():
              data = json.loads(report.read_text(encoding='utf-8'))
              if data.get('error'):
                  lines.append('- Result: **cannot verify source; fail closed**')
                  lines.append('- Cause: `' + str(data['error']).replace('`', '')[:180] + '`')
              else:
                  lines.extend([
                      f"- Cron entries: {data['baseline_crons']} → {data['candidate_crons']}",
                      f"- Highest potential density: {data['baseline_peak']} → {data['candidate_peak']}",
                      f"- New over-budget minute slots: **{data['new_over_budget_slots']}**",
                      '- Limitations: hypothetical minute-of-week overlap, not VPS/runner health.',
                  ])
                  for slot in data.get('sample', [])[:10]:
                      lines.append(
                          f"  - UTC weekday={slot['weekday_sunday_zero']} "
                          f"{slot['hour_utc']:02d}:{slot['minute_utc']:02d}: "
                          f"{slot['baseline']} → {slot['candidate']} "
                          f"({slot['changed_source_count']} changed cron entries)"
                      )
                      for source in slot['new_or_changed_sources'][:5]:
                          lines.append(
                              "    - changed: `" +
                              source['workflow'].replace('`', '')[:160] +
                              "` cron=`" + source['cron'].replace('`', '')[:100] + "`"
                          )
                      if slot['changed_source_count'] > 5:
                          lines.append("    - ... additional changed cron entries omitted")
          else:
              lines.append('- Result: **source proof unavailable**; see failing job.')
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as handle:
              handle.write('\n'.join(lines) + '\n')
          PY
