name: LightUp provider and fixture VPS proof

on:
  push:
    branches: [codex/lightup-web-vps-proof]
    paths: [.github/workflows/lightup-web-vps-proof.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lightup-web-hardening-vps-proof
  cancel-in-progress: false

jobs:
  verify:
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 8
    steps:
      - name: Verify intended VPS
        run: |
          python3 - <<'PY'
          import os, socket
          host = socket.gethostname().split(".")[0]
          assert host == "vps-bb300bba", host
          print("host=" + host)
          print("runner=" + os.environ.get("RUNNER_NAME", ""))
          PY
      - name: Check out exact LightUp revision
        uses: actions/checkout@v4
        with:
          repository: Zennay/Lightup
          ref: 9e93cb7b94a15141c37db05c70fdec286af2d466
          path: lightup-web-proof
          persist-credentials: false
      - name: Compile and run full offline and lab suite
        working-directory: lightup-web-proof
        env:
          PYTHONPATH: src
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "9e93cb7b94a15141c37db05c70fdec286af2d466"
          python3 --version
          python3 -m compileall -q src tests
          nice -n 10 python3 -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/lightup-web-proof.log"
      - name: Verify real SDK compatibility without API calls
        working-directory: lightup-web-proof
        env:
          PYTHONPATH: src
        shell: bash
        run: |
          set -euo pipefail
          task_venv=$(mktemp -d "$RUNNER_TEMP/lightup-sdk.XXXXXX")
          trap 'rm -rf "$task_venv"' EXIT
          python3 -m venv "$task_venv"
          "$task_venv/bin/pip" install --quiet '.[anthropic]'
          "$task_venv/bin/python" - <<'PY' | tee -a "$RUNNER_TEMP/lightup-web-proof.log"
          import anthropic
          from unittest.mock import patch
          from anthropic.types import Message
          from lightup.ai.gateway import ModelMessage, ModelRequest, ModelRole
          from lightup.ai.providers.anthropic_provider import AnthropicProvider
          response = Message(id="msg_offline", type="message", role="assistant",
                             model="configured-model", content=[{"type": "text", "text": "verified"}],
                             stop_reason="end_turn", stop_sequence=None,
                             usage={"input_tokens": 5, "output_tokens": 2})
          with patch("socket.socket.connect", side_effect=AssertionError("network forbidden")):
              provider = AnthropicProvider(api_key="offline-test-key", provider_id="sdk-smoke")
              with patch.object(provider._client.messages, "create", return_value=response):
                  result = provider.complete(ModelRequest(
                      ModelRole.VERIFIER, (ModelMessage("user", "offline test"),), "configured-model"))
              assert result.content == "verified" and result.provider_id == "sdk-smoke"
              assert result.input_tokens == 5 and result.output_tokens == 2
              provider._client.close()
          print("Real SDK offline smoke OK; SDK version=" + anthropic.__version__)
          PY
      - name: Preserve test receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lightup-web-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/lightup-web-proof.log
          if-no-files-found: warn
          retention-days: 14
