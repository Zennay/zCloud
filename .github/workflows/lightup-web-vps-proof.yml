name: LightUp HTTPS deployment VPS proof

on:
  push:
    branches: [codex/lightup-web-vps-proof]
    paths: [.github/workflows/lightup-web-vps-proof.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lightup-web-hardening-vps-proof
  cancel-in-progress: false

jobs:
  verify:
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 8
    steps:
      - name: Verify intended VPS
        run: |
          python3 - <<'PY'
          import os, socket
          host = socket.gethostname().split(".")[0]
          assert host == "vps-bb300bba", host
          print("host=" + host)
          print("runner=" + os.environ.get("RUNNER_NAME", ""))
          PY
      - name: Check out exact LightUp revision
        uses: actions/checkout@v4
        with:
          repository: Zennay/Lightup
          ref: d4cbde7e0b4825c310e7a156969ca5aa47cde540
          path: lightup-web-proof
          persist-credentials: false
      - name: Compile and run full suite
        working-directory: lightup-web-proof
        env:
          PYTHONPATH: src
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "d4cbde7e0b4825c310e7a156969ca5aa47cde540"
          python3 -m compileall -q src tests scripts
          nice -n 10 python3 -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/lightup-web-proof.log"
      - name: Real Gunicorn runtime smoke
        working-directory: lightup-web-proof
        env:
          PYTHONPATH: src
        shell: bash
        run: |
          set -euo pipefail
          task_venv=$(mktemp -d "$RUNNER_TEMP/lightup-web.XXXXXX")
          trap 'rm -rf "$task_venv"' EXIT
          python3 -m venv "$task_venv"
          "$task_venv/bin/pip" install --quiet '.[web]'
          "$task_venv/bin/gunicorn" --check-config --config deploy/gunicorn.conf.py \
            'lightup.webapp.production:create_production_app()' \
            --env LIGHTUP_PUBLIC_ORIGIN=https://lightup.example.test \
            --env LIGHTUP_DB="$task_venv/check.db"
          "$task_venv/bin/python" scripts/smoke_web_deployment.py 2>&1 | tee -a "$RUNNER_TEMP/lightup-web-proof.log"
      - name: Preserve test receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lightup-web-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/lightup-web-proof.log
          if-no-files-found: warn
          retention-days: 14
