name: zCloud browser project isolation contract

on:
  pull_request:
    branches: [main]
    paths:
      - public/zcloud-worker.user.js
      - firefox-extension/background.js
      - scripts/zcloud_browser_project_isolation_contract.py
      - tests/test_browser_project_isolation_contract.py
      - tests/test_browser_project_isolation_workflow.py
      - .github/workflows/zcloud-browser-project-isolation-contract.yml
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zcloud-browser-project-isolation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  isolation:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.actor == 'Zennay' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact candidate and permanent VPS runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -un)" = ubuntu
          python3 scripts/zcloud_vps_runner_guard.py --json
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          fi

      - name: Prove browser project isolation contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/zcloud_browser_project_isolation_contract.py tests/test_browser_project_isolation_contract.py tests/test_browser_project_isolation_workflow.py
          python3 -m unittest -v tests.test_browser_project_isolation_contract tests.test_browser_project_isolation_workflow
          python3 scripts/zcloud_browser_project_isolation_contract.py --root . --pretty
          echo "ZCLOUD_BROWSER_PROJECT_ISOLATION_GREEN=1"
