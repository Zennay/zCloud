name: zSSH public header auth verify

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/zssh-header-auth-verify.yml
  pull_request:
    paths:
      - .github/workflows/zssh-header-auth-verify.yml
      - tests/test_zssh_header_auth_verify_workflow.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zssh-header-auth-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.event_name != 'pull_request' ||
      (github.actor == 'Zennay' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 5
    env:
      XDG_RUNTIME_DIR: /run/user/1000
      DBUS_SESSION_BUS_ADDRESS: unix:path=/run/user/1000/bus
      ZCLOUD_EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact zCloud guard source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.ZCLOUD_EXPECTED_SHA }}
          persist-credentials: false
          clean: true
          fetch-depth: 1

      - name: Verify permanent zCloud VPS runner and exact revision
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$ZCLOUD_EXPECTED_SHA"
          python3 scripts/zcloud_vps_runner_guard.py --json \
            | tee "$RUNNER_TEMP/zssh-header-auth-runner-guard.json"
          test "$(hostname)" = "vps-bb300bba"
          test "$(id -un)" = "ubuntu"

      - name: Verify active release and public no-sign-in capability path
        shell: bash
        run: |
          set -Eeuo pipefail
          systemctl --user is-active --quiet zssh.service
          test -f /home/ubuntu/.config/zssh/gateway.env
          set -a
          source /home/ubuntu/.config/zssh/gateway.env
          set +a
          test -n "$ZSSH_MCP_CAPABILITY_TOKEN"
          curl --fail --silent --show-error https://198.244.191.182/health >/dev/null
          ZSSH_MCP_URL="https://198.244.191.182/mcp" \
          ZSSH_MCP_API_KEY="" \
          ZSSH_MCP_CAPABILITY_TOKEN="$ZSSH_MCP_CAPABILITY_TOKEN" \
          node /home/ubuntu/.local/share/zssh/current/mcp-claude-canary.mjs
