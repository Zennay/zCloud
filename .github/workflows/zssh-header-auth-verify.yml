name: zSSH public header auth verify

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/zssh-header-auth-verify.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: self-hosted
    timeout-minutes: 5
    env:
      XDG_RUNTIME_DIR: /run/user/1000
      DBUS_SESSION_BUS_ADDRESS: unix:path=/run/user/1000/bus
    steps:
      - name: Verify active release and public no-sign-in capability path
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(id -un)" = "ubuntu"
          systemctl --user is-active --quiet zssh.service
          test -f /home/ubuntu/.config/zssh/gateway.env
          set -a
          source /home/ubuntu/.config/zssh/gateway.env
          set +a
          test -n "$ZSSH_MCP_CAPABILITY_TOKEN"
          curl --fail --silent --show-error https://198.244.191.182/health >/dev/null
          ZSSH_MCP_URL="https://198.244.191.182/mcp" \
          ZSSH_MCP_API_KEY="" \
          ZSSH_MCP_CAPABILITY_TOKEN="$ZSSH_MCP_CAPABILITY_TOKEN" \
          node /home/ubuntu/.local/share/zssh/current/mcp-claude-canary.mjs
