name: zSSH public header auth verify

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/zssh-header-auth-verify.yml"
      - "tests/test_zssh_header_auth_verify_workflow.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/zssh-header-auth-verify.yml"
      - "tests/test_zssh_header_auth_verify_workflow.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zssh-header-auth-verify-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'live' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPECTED_ZCLOUD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact zCloud candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.EXPECTED_ZCLOUD_SHA }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact zCloud candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_ZCLOUD_SHA"

      - name: Validate header-auth workflow contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v tests.test_zssh_header_auth_verify_workflow

  verify:
    if: github.event_name != 'pull_request' && github.repository == 'Zennay/zCloud' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 5
    env:
      EXPECTED_ZCLOUD_SHA: ${{ github.sha }}
      XDG_RUNTIME_DIR: /run/user/1000
      DBUS_SESSION_BUS_ADDRESS: unix:path=/run/user/1000/bus
    steps:
      - name: Checkout exact zCloud revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.EXPECTED_ZCLOUD_SHA }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify permanent VPS runner and exact revision
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_ZCLOUD_SHA"
          test "$(id -un)" = "ubuntu"
          python3 scripts/zcloud_vps_runner_guard.py --json

      - name: Verify active release and public no-sign-in capability path
        shell: bash
        run: |
          set -Eeuo pipefail
          systemctl --user is-active --quiet zssh.service
          test -f /home/ubuntu/.config/zssh/gateway.env
          set -a
          source /home/ubuntu/.config/zssh/gateway.env
          set +a
          test -n "$ZSSH_MCP_CAPABILITY_TOKEN"
          curl --fail --silent --show-error https://198.244.191.182/health >/dev/null
          ZSSH_MCP_URL="https://198.244.191.182/mcp" \
          ZSSH_MCP_API_KEY="" \
          ZSSH_MCP_CAPABILITY_TOKEN="$ZSSH_MCP_CAPABILITY_TOKEN" \
          node /home/ubuntu/.local/share/zssh/current/mcp-claude-canary.mjs
