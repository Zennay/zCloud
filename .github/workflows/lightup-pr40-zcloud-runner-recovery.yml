name: Recover zCloud runner for LightUp PR40 proof

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/lightup-pr40-zcloud-runner-recovery.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: lightup-pr40-zcloud-runner-recovery
  cancel-in-progress: true

jobs:
  recover:
    runs-on: [self-hosted, ftmo-research]
    timeout-minutes: 6
    env:
      BLOCKING_RUN_ID: "37341085861"
      BLOCKING_HEAD_SHA: "8b795898b18348832ed677051bd513ee85fde2b5"
      LIGHTUP_RUN_ID: "37343030852"
      LIGHTUP_EXPECTED_SHA: "29e720902e062b215560665677328c59cdc9ec9d"
      ZCLOUD_SERVICE: "actions.runner.Zennay-zCloud.zcloud-vps-1.service"
      ZCLOUD_RUNNER_ROOT: "/home/ubuntu/actions-runner-zcloud"

    steps:
      - name: Guard exact stale blocker and queued LightUp proof
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = "vps-bb300bba"

          lightup="$(gh api "repos/Zennay/zCloud/actions/runs/$LIGHTUP_RUN_ID")"
          test "$(jq -r .status <<<"$lightup")" = "queued"
          test "$(jq -r .name <<<"$lightup")" = "LightUp PR40 exact-head VPS proof"

          mapfile -t lightup_jobs < <(
            gh api "repos/Zennay/zCloud/actions/runs/$LIGHTUP_RUN_ID/jobs"               --jq '.jobs[] | select(.status == "queued") | .name'
          )
          test "${#lightup_jobs[@]}" -ge 1

          blocker="$(gh api "repos/Zennay/zCloud/actions/runs/$BLOCKING_RUN_ID")"
          test "$(jq -r .status <<<"$blocker")" = "in_progress"
          test "$(jq -r .head_sha <<<"$blocker")" = "$BLOCKING_HEAD_SHA"
          test "$(jq -r .path <<<"$blocker")" = ".github/workflows/ftmo-task125-unit-lockstep-recovery.yml"

          age_s="$(
            jq -r .created_at <<<"$blocker" |
            python3 -c 'import datetime,sys; s=sys.stdin.read().strip(); t=datetime.datetime.fromisoformat(s.replace("Z","+00:00")); print(int((datetime.datetime.now(datetime.timezone.utc)-t).total_seconds()))'
          )"
          test "$age_s" -gt 600
          echo "LIGHTUP_PR40_RECOVERY_GUARD_GREEN blocker_age_s=$age_s queued_jobs=${#lightup_jobs[@]}"

      - name: Cancel only the exact over-time blocker
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api --method POST "repos/Zennay/zCloud/actions/runs/$BLOCKING_RUN_ID/cancel" >/dev/null

          for _ in $(seq 1 30); do
            status="$(gh api "repos/Zennay/zCloud/actions/runs/$BLOCKING_RUN_ID" --jq .status)"
            echo "BLOCKER_CANCEL status=$status"
            [[ "$status" == "completed" ]] && break
            sleep 2
          done
          test "$(gh api "repos/Zennay/zCloud/actions/runs/$BLOCKING_RUN_ID" --jq .status)" = "completed"

      - name: Recover zCloud listener from independent runner
        shell: bash
        run: |
          set -Eeuo pipefail

          worker_pids() {
            for proc in /proc/[0-9]*; do
              pid="${proc##*/}"
              cmd="$(tr '\0' ' ' < "$proc/cmdline" 2>/dev/null || true)"
              [[ "$cmd" == *"$ZCLOUD_RUNNER_ROOT/bin/Runner.Worker"* ]] && echo "$pid"
            done
          }

          listener_pids() {
            for proc in /proc/[0-9]*; do
              pid="${proc##*/}"
              cmd="$(tr '\0' ' ' < "$proc/cmdline" 2>/dev/null || true)"
              [[ "$cmd" == *"$ZCLOUD_RUNNER_ROOT/bin/Runner.Listener"* ]] && echo "$pid"
            done
          }

          for _ in $(seq 1 15); do
            mapfile -t workers < <(worker_pids)
            [[ "${#workers[@]}" -eq 0 ]] && break
            echo "ZCLOUD_STALE_WORKER_WAIT pids=${workers[*]}"
            sleep 2
          done

          mapfile -t workers < <(worker_pids)
          state="$(systemctl is-active "$ZCLOUD_SERVICE" || true)"
          mapfile -t listeners < <(listener_pids)
          echo "ZCLOUD_RECOVERY_PRE state=$state workers=${workers[*]:-none} listeners=${listeners[*]:-none}"

          if [[ "${#workers[@]}" -gt 0 || "$state" != "active" || "${#listeners[@]}" -ne 1 ]]; then
            sudo -n systemctl reset-failed "$ZCLOUD_SERVICE" || true
            sudo -n systemctl restart "$ZCLOUD_SERVICE"
          fi

          for _ in $(seq 1 30); do
            state="$(systemctl is-active "$ZCLOUD_SERVICE" || true)"
            mapfile -t listeners < <(listener_pids)
            mapfile -t workers < <(worker_pids)
            if [[ "$state" == "active" && "${#listeners[@]}" -eq 1 && "${#workers[@]}" -eq 0 ]]; then
              break
            fi
            sleep 1
          done

          test "$state" = "active"
          test "${#listeners[@]}" -eq 1
          test "${#workers[@]}" -eq 0
          echo "ZCLOUD_RECOVERY_GREEN listener=${listeners[0]}"

      - name: Prove exact LightUp run starts scheduling
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          for _ in $(seq 1 30); do
            jobs="$(gh api "repos/Zennay/zCloud/actions/runs/$LIGHTUP_RUN_ID/jobs")"
            statuses="$(jq -r '[.jobs[] | .status] | join(",")' <<<"$jobs")"
            echo "LIGHTUP_PR40_SCHEDULING statuses=$statuses"
            if jq -e '.jobs | any(.status == "in_progress" or .status == "completed")' <<<"$jobs" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "LightUp PR40 proof remained queued after bounded cross-lane recovery" >&2
          exit 1
