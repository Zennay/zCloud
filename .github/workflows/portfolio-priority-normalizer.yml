name: Reconcile live FTMO-first portfolio priorities

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/portfolio-priority-normalizer.yml
      - portfolio_queue.seed.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Reconcile live SQLite queue priorities
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import urllib.request

          base="http://127.0.0.1:8765"
          desired={
            "zssh-openai-public-plugin-release":(
              "zssh","P1","Finish the next zSSH public plugin release increment",
              "Make a material production-grade code/config/workflow change that advances the self-hosted public OpenAI plugin route while FTMO retains the portfolio P0 compute/research lane.",
              "https://app.notion.com/p/3e89e19ac955811a9008d420e3e2a634"),
            "ftmo-current-generation-safe-gate":(
              "ftmo","P0","Keep FTMO autonomous progression healthy and self-recovering",
              "Do not manually act as the normal generation loop. FTMO research progression belongs to the persistent self-hosted runtime. Only intervene when that runtime cannot self-advance: fix the concrete code/config/service/data-gate cause, preserve provider provenance and sealed outcome boundaries, then prove the persistent runtime resumes autonomous safe progression with deterministic workflow/runtime evidence.",
              "https://app.notion.com/p/3db9e19ac9558135940bec5110a2157e"),
            "haxlab-closed-loop-arena-v2-implementation":(
              "haxlab","P3","Build the next Closed-Loop Evaluation Arena v2 implementation increment",
              "Make a material code/config/workflow change that advances Closed-Loop Evaluation Arena v2 with deterministic tests. HaxLab is a background lane and must not outrank FTMO or other revenue-oriented work.",
              "https://app.notion.com/p/3e59e19ac9558189853ffc41080c858b"),
            "haxlab-multisource-evaluation-suite-v2":(
              "haxlab","P3","Implement the frozen multi-source evaluation suite v2",
              "Implement deterministic multi-source evaluation tooling/config with provenance and regression coverage.",
              "https://app.notion.com/p/3e59e19ac9558189853ffc41080c858b"),
            "haxlab-guard-independence-promotion-gate-v2":(
              "haxlab","P3","Implement guard-independence as a mandatory Arena v2 promotion gate",
              "Implement guard-independence metrics and fail-closed promotion logic with regression tests.",
              "https://app.notion.com/p/3e59e19ac9558189853ffc41080c858b"),
            "haxlab-rollout-recovery-dataset-v1":(
              "haxlab","P3","Implement versioned rollout/recovery dataset generation",
              "Implement a deterministic versioned rollout/recovery dataset pipeline with provenance and automated evidence.",
              "https://app.notion.com/p/3e59e19ac9558189853ffc41080c858b"),
          }

          def get(path):
              with urllib.request.urlopen(base+path,timeout=10) as r:
                  return json.load(r)

          def post(path,payload,actor):
              req=urllib.request.Request(
                  base+path,
                  data=json.dumps(payload).encode(),
                  method="POST",
                  headers={"Content-Type":"application/json","X-ZCloud-Actor":actor},
              )
              with urllib.request.urlopen(req,timeout=10) as r:
                  return json.load(r)

          for qid,(project,priority,title,criteria,source) in desired.items():
              result=post("/api/portfolio-queue",{
                  "action":"enqueue","queue_id":qid,"project_id":project,
                  "title":title,"priority":priority,
                  "completion_criteria":criteria,"source_url":source,
              },"portfolio-priority-normalizer")
              print("QUEUE_PRIORITY",qid,priority,json.dumps(result,sort_keys=True))

          # Reconcile current allocation with unchanged worker settings. Existing
          # real claimed/running work is not killed; newly free slots follow P0>P1>P2>P3.
          dynamic=get("/api/dynamic-workers").get("dynamic_workers") or {}
          same={
              key:dynamic.get(key)
              for key in (
                  "chatgpt_count","claude_count",
                  "chatgpt_cooldown_seconds","claude_cooldown_seconds",
                  "check_interval_ms","tick_interval_ms","heartbeat_interval_ms",
                  "generation_start_timeout_ms","scheduler_interval_seconds"
              )
              if dynamic.get(key) is not None
          }
          if same:
              print("RECONCILE",json.dumps(post("/api/dynamic-workers",same,"portfolio-priority-normalizer"),sort_keys=True))

          final=get("/api/portfolio-queue?all=1")
          focus=[
              {k:x.get(k) for k in ("queue_id","project_id","priority","status","worker_slot","title")}
              for x in final.get("items",[])
              if x.get("eligible") and x.get("project_id") in {"ftmo","haxlab"}
          ]
          print("FTMO_HAXLAB_FINAL",json.dumps(focus,sort_keys=True))
          print("ALLOCATION_FINAL",json.dumps(final.get("allocation"),sort_keys=True))
          PY
