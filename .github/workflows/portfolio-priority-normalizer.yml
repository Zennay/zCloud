name: Reconcile live LightUp-first portfolio priorities

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/portfolio-priority-normalizer.yml
      - portfolio_queue.seed.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Reconcile live SQLite queue priorities
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import urllib.request

          base="http://127.0.0.1:8765"
          desired={
            "lightup-m0-control-plane":(
              "lightup","P0","Finish LightUp M0 authorization-first control plane",
              "Advance LightUp infrastructure only: implement plan-only orchestration, explicit authorization/scope contracts, fail-closed execution gates and deterministic tests. Do not perform active target interaction or offensive execution; keep activation disabled until the user explicitly authorizes a specific owned or permitted lab target.",
              "https://app.notion.com/p/3ed9e19ac9558117b639f2254fe0e165"),
            "lightup-m0-evidence-lab-ci":(
              "lightup","P0","Finish LightUp reproducible lab, evidence store and defensive CI",
              "Advance the isolated LightUp lab harness, reproducible fixtures, evidence/remediation/retest storage and defensive CI with deterministic test evidence. Infrastructure and safe local fixtures only; no live external target interaction until explicit activation and authorization.",
              "https://app.notion.com/p/3ed9e19ac9558117b639f2254fe0e165"),
            "zssh-openai-public-plugin-release":(
              "zssh","P1","Finish the next zSSH public plugin release increment",
              "Drive only the canonical zSSH M5 gate. Read managed zSSH issue #159 (or its successor) before any mutation. If execution_state=external_input_only, do not invent repository hardening or unrelated PRs; restrict work to the exact secret-safe provider/control-plane transition and existing zCloud DNS/VPS gateway/ingress lanes. When the gate becomes provider_execution or advances, execute only that lane from exact zSSH main and record immutable run evidence. Never expose provider/OAuth/reviewer secret values. LightUp retains the portfolio P0 build lane.",
              "https://app.notion.com/p/3e89e19ac955811a9008d420e3e2a634"),
            "ftmo-current-generation-safe-gate":(
              "ftmo","P1","Keep FTMO autonomous progression healthy and self-recovering",
              "Do not manually act as the normal generation loop. FTMO research progression belongs to the persistent self-hosted runtime. Only intervene when that runtime cannot self-advance: fix the concrete code/config/service/data-gate cause, preserve provider provenance and sealed outcome boundaries, then prove the persistent runtime resumes autonomous safe progression with deterministic workflow/runtime evidence.",
              "https://app.notion.com/p/3db9e19ac9558135940bec5110a2157e"),
            "supa-supermarket-html-scrapers":(
              "supa","P1","Build supermarket HTML snapshot scrapers and selector extraction",
              "Build real supermarket web scrapers from captured source HTML, not invented selectors. Select the first two target supermarkets for the M1 data-feasibility lane; download representative real public product/search/offer pages and store sanitized/versioned HTML fixtures with source URL and captured-at provenance; inspect those fixtures to derive resilient selectors or embedded-data extraction paths for product identity, name, price, unit/pack size, offer mechanics and availability; implement source-specific adapters/scrapers against the captured HTML; add parser regression tests using the real snapshots plus explicit failure/staleness handling. Re-fetch live pages through the VPS execution lane to prove at least one end-to-end extraction per target source when legally/technically accessible. Do not fabricate HTML or selectors and do not bypass authentication, anti-bot controls, paywalls or terms restrictions.",
              "https://app.notion.com/p/3e79e19ac955810f903be62439eef2b3"),
            "haxlab-closed-loop-arena-v2-implementation":(
              "haxlab","P3","Build the next Closed-Loop Evaluation Arena v2 implementation increment",
              "Make a material code/config/workflow change that advances Closed-Loop Evaluation Arena v2 with deterministic tests. HaxLab is a background lane and must not outrank FTMO or other revenue-oriented work.",
              "https://app.notion.com/p/3e59e19ac9558189853ffc41080c858b"),
            "haxlab-multisource-evaluation-suite-v2":(
              "haxlab","P3","Implement the frozen multi-source evaluation suite v2",
              "Implement deterministic multi-source evaluation tooling/config with provenance and regression coverage.",
              "https://app.notion.com/p/3e59e19ac9558189853ffc41080c858b"),
            "haxlab-guard-independence-promotion-gate-v2":(
              "haxlab","P3","Implement guard-independence as a mandatory Arena v2 promotion gate",
              "Implement guard-independence metrics and fail-closed promotion logic with regression tests.",
              "https://app.notion.com/p/3e59e19ac9558189853ffc41080c858b"),
            "haxlab-rollout-recovery-dataset-v1":(
              "haxlab","P3","Implement versioned rollout/recovery dataset generation",
              "Implement a deterministic versioned rollout/recovery dataset pipeline with provenance and automated evidence.",
              "https://app.notion.com/p/3e59e19ac9558189853ffc41080c858b"),
          }

          def get(path):
              with urllib.request.urlopen(base+path,timeout=10) as r:
                  return json.load(r)

          def post(path,payload,actor):
              req=urllib.request.Request(
                  base+path,
                  data=json.dumps(payload).encode(),
                  method="POST",
                  headers={"Content-Type":"application/json","X-ZCloud-Actor":actor},
              )
              with urllib.request.urlopen(req,timeout=10) as r:
                  return json.load(r)

          for qid,(project,priority,title,criteria,source) in desired.items():
              result=post("/api/portfolio-queue",{
                  "action":"enqueue","queue_id":qid,"project_id":project,
                  "title":title,"priority":priority,
                  "completion_criteria":criteria,"source_url":source,
              },"portfolio-priority-normalizer")
              print("QUEUE_PRIORITY",qid,priority,json.dumps(result,sort_keys=True))

          legacy_runtime_tasks=(
              "ftmo-useful-compute-cpu-attribution",
          )
          for qid in legacy_runtime_tasks:
              result=post("/api/portfolio-queue",{
                  "action":"drop","queue_id":qid,
                  "evidence":"Superseded by persistent ftmo-autonomous-marathon.service; normal FTMO compute is no longer worker-queue work.",
              },"portfolio-priority-normalizer")
              print("QUEUE_RETIRED",qid,json.dumps(result,sort_keys=True))

          # Reconcile current allocation with unchanged worker settings. Existing
          # real running work is not killed; newly free slots follow P0>P1>P2>P3,
          # with two independent LightUp M0 infrastructure lanes occupying P0.
          dynamic=get("/api/dynamic-workers").get("dynamic_workers") or {}
          same={
              key:dynamic.get(key)
              for key in (
                  "chatgpt_count","claude_count",
                  "chatgpt_cooldown_seconds","claude_cooldown_seconds",
                  "check_interval_ms","tick_interval_ms","heartbeat_interval_ms",
                  "generation_start_timeout_ms","scheduler_interval_seconds"
              )
              if dynamic.get(key) is not None
          }
          if same:
              print("RECONCILE",json.dumps(post("/api/dynamic-workers",same,"portfolio-priority-normalizer"),sort_keys=True))

          final=get("/api/portfolio-queue?all=1")
          focus=[
              {k:x.get(k) for k in ("queue_id","project_id","priority","status","worker_slot","title")}
              for x in final.get("items",[])
              if x.get("eligible") and x.get("project_id") in {"lightup","ftmo","haxlab"}
          ]
          print("LIGHTUP_FTMO_HAXLAB_FINAL",json.dumps(focus,sort_keys=True))
          print("ALLOCATION_FINAL",json.dumps(final.get("allocation"),sort_keys=True))
          PY
