name: Enqueue stale FTMO CI cancellation on zSSH

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ftmo-cancel-stale-ci-zssh-queue.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enqueue:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Check out exact main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Enqueue exact stale FTMO Actions cancellation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import urllib.request

          base = "http://127.0.0.1:8765"
          queue_id = "zssh-ftmo-cancel-stale-pr430-432-ci-20261002"
          payload = {
              "action": "enqueue",
              "queue_id": queue_id,
              "project_id": "zssh",
              "title": "Cancel stale FTMO CI runs",
              "priority": "P0",
              "completion_criteria": (
                  "On vps-bb300bba cancel only GitHub Actions runs "
                  "37000234497, 37000234650, 37000234499, 37000325165, 37000325166, "
                  "37000325149, 37000325172 and 37000325179 in Zennay/Ftmo, and only while "
                  "each run is still queued, pending, or in_progress. The first three belong to "
                  "superseded PR #430 head 521a34d413de96a57a4785601598e02cc591355a; the latter "
                  "five belong to closed duplicate PR #432 head f0a372ee08a8e7e6c3af2467604ac3e21495a9d6. "
                  "Never cancel current PR #430 exact-head runs 37000518099, 37000518102, "
                  "37000518123, 37000518148 or 37000518171, or any newer FTMO run. Use existing "
                  "authorized GitHub credentials already available to the zSSH lane; do not print "
                  "tokens. Verify each requested stale run is completed/cancelled or already terminal, "
                  "then report the protected exact-head run statuses. Do not modify repository files, "
                  "provider evidence, research artifacts, preregistration, development, walk-forward, "
                  "final holdout, broker or live-trading state."
              ),
              "source_url": "https://github.com/Zennay/Ftmo/pull/430",
          }
          request = urllib.request.Request(
              base + "/api/portfolio-queue",
              data=json.dumps(payload).encode(),
              method="POST",
              headers={"Content-Type": "application/json"},
          )
          with urllib.request.urlopen(request, timeout=10) as response:
              body = json.load(response)
              if response.status != 200:
                  raise RuntimeError(f"queue enqueue failed: HTTP {response.status}")
          print("FTMO_STALE_CI_CANCEL_QUEUE", json.dumps(body, sort_keys=True))

          def post(path, payload):
              request = urllib.request.Request(
                  base + path,
                  data=json.dumps(payload).encode(),
                  method="POST",
                  headers={"Content-Type": "application/json"},
              )
              with urllib.request.urlopen(request, timeout=10) as response:
                  result = json.load(response)
                  if response.status >= 300:
                      raise RuntimeError(f"{path} failed: HTTP {response.status}")
              return result

          start = post("/api/runner-control", {"project_id": "zssh", "action": "start"})
          push = post("/api/runner-control", {"project_id": "zssh", "action": "push"})
          print("ZSSH_START", json.dumps(start, sort_keys=True))
          print("ZSSH_PUSH", json.dumps(push, sort_keys=True))

          with urllib.request.urlopen(base + "/api/portfolio-queue?all=1", timeout=10) as response:
              live = json.load(response)

          def find(value):
              if isinstance(value, dict):
                  if value.get("queue_id") == queue_id:
                      return value
                  for child in value.values():
                      found = find(child)
                      if found:
                          return found
              elif isinstance(value, list):
                  for child in value:
                      found = find(child)
                      if found:
                          return found
              return None

          item = find(live)
          if not item:
              raise RuntimeError("stale FTMO CI cancellation queue item not found after enqueue")
          receipt = {
              "schema_version": 1,
              "scope": "ftmo-stale-ci-zssh-queue",
              "queue_id": queue_id,
              "queue_status": item.get("status"),
              "queue_priority": item.get("priority"),
              "queue_project_id": item.get("project_id"),
              "worker_slot": item.get("worker_slot"),
              "start_ok": start.get("ok"),
              "push_ok": push.get("ok"),
              "stale_run_ids": [
                  37000234497, 37000234650, 37000234499,
                  37000325165, 37000325166, 37000325149, 37000325172, 37000325179,
              ],
              "protected_current_run_ids": [
                  37000518099, 37000518102, 37000518123, 37000518148, 37000518171,
              ],
          }
          from pathlib import Path
          target = Path("artifacts/ops/ftmo-stale-ci-zssh-queue.json")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps(receipt, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          print("FTMO_STALE_CI_QUEUE_RECEIPT", json.dumps(receipt, sort_keys=True))
          PY

      - name: Persist sanitized queue receipt
        shell: bash
        run: |
          set -euo pipefail
          test -f artifacts/ops/ftmo-stale-ci-zssh-queue.json
          git config user.name "zcloud-automation"
          git config user.email "zcloud-automation@users.noreply.github.com"
          git add artifacts/ops/ftmo-stale-ci-zssh-queue.json
          if git diff --cached --quiet; then
            echo "Queue receipt unchanged"
          else
            git commit -m "Record stale FTMO CI zSSH queue receipt"
            git push origin HEAD:main
          fi
