name: zCloud cross-runner listener proof

# Source validation runs on a GitHub-hosted VM. Only an explicit owner
# dispatch from canonical main may inspect the permanent VPS.
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/zcloud-runner-cross-lane-proof.yml"
      - ".github/workflows/zcloud-vps-deploy.yml"
      - ".github/workflows/zcloud-vps-execution-probe.yml"
      - "tests/test_zcloud_cross_runner_manual_trust_20261014.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zcloud-cross-runner-listener-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  hosted-contract:
    if: >-
      github.event_name == 'pull_request' &&
      github.repository == 'Zennay/zCloud' &&
      github.event.pull_request.head.repo.full_name == github.repository
      && ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || (github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'Zennay'))
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 8
    steps:
      - name: Check out immutable pull request head without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          clean: true
      - name: Check exact head and run source trust regressions
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python3 -m unittest -v tests.test_zcloud_cross_runner_manual_trust_20261014
          python3 -m unittest discover -v

  prove:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'Zennay/zCloud' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'Zennay' &&
      github.triggering_actor == 'Zennay' &&
      github.run_attempt == 1
    runs-on: [self-hosted, ftmo-research]
    timeout-minutes: 4
    steps:
      - name: Reject untrusted, rerun or stale main before VPS inspection
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REPOSITORY" = "Zennay/zCloud"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_ACTOR" = "Zennay"
          test "$GITHUB_TRIGGERING_ACTOR" = "Zennay"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(hostname -s)" = "vps-bb300bba"
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          current_main="$(timeout 15 git ls-remote --exit-code https://github.com/Zennay/zCloud.git refs/heads/main | awk '{print $1}')"
          test "$current_main" = "$EXPECTED_SHA"
      - name: Prove zCloud listener isolation from independent VPS runner
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = "vps-bb300bba"

          service="actions.runner.Zennay-zCloud.zcloud-vps-1.service"
          runner_root="/home/ubuntu/actions-runner-zcloud"
          temp_root="$runner_root/_work/_temp"

          echo "=== RECOVERY ==="
          recovery="$(
            systemctl list-units --all --full --plain 'zcloud-runner-listener-recovery-*.service' --no-legend \
              | awk '{print $1}' \
              | sort -V \
              | tail -n 1
          )"
          test -n "$recovery"
          echo "ZCLOUD_RECOVERY_LATEST unit=$recovery"
          for _ in $(seq 1 60); do
            state="$(systemctl is-active "$recovery" || true)"
            [[ "$state" != "active" && "$state" != "activating" ]] && break
            echo "ZCLOUD_RECOVERY_WAIT unit=$recovery state=$state"
            sleep 2
          done
          state="$(systemctl is-active "$recovery" || true)"
          result="$(systemctl show "$recovery" -p Result --value || true)"
          exit_status="$(systemctl show "$recovery" -p ExecMainStatus --value || true)"
          echo "ZCLOUD_RECOVERY state=$state result=$result exit_status=$exit_status"
          # Raw journal can contain user/worker secrets; only bounded service states are reported.
          test "$state" != "active"
          test "$state" != "activating"
          test "$result" = "success"
          test "$exit_status" = "0"

          echo "=== LISTENERS ==="
          cgroup="$(systemctl show "$service" -p ControlGroup --value)"
          mapfile -t listeners < <(
            for proc in /proc/[0-9]*; do
              pid="${proc##*/}"
              cmd="$(tr '\0' ' ' < "$proc/cmdline" 2>/dev/null || true)"
              [[ "$cmd" == *"$runner_root/bin/Runner.Listener"* ]] && echo "$pid"
            done
          )
          echo "ZCLOUD_LISTENERS count=${#listeners[@]} pids=${listeners[*]:-none} cgroup=$cgroup"
          test "${#listeners[@]}" -eq 1
          grep -Fq "$cgroup" "/proc/${listeners[0]}/cgroup"
          systemctl is-active --quiet "$service"

          echo "=== TEMP SENTINEL ==="
          sentinel="$temp_root/.zcloud-cross-runner-proof-$GITHUB_RUN_ID"
          sudo -n -u ubuntu touch "$sentinel"
          sleep 12
          test -f "$sentinel"
          rm -f "$sentinel"
          echo "ZCLOUD_CROSS_RUNNER_LISTENER_GREEN listener=${listeners[0]} cgroup=$cgroup"
