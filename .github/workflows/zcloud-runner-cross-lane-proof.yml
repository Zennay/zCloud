name: zCloud cross-runner listener proof

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/zcloud-runner-cross-lane-proof.yml"
      - ".github/workflows/zcloud-vps-deploy.yml"
      - ".github/workflows/zcloud-vps-execution-probe.yml"

permissions:
  contents: read

concurrency:
  group: zcloud-cross-runner-listener-proof
  cancel-in-progress: true

jobs:
  prove:
    runs-on: [self-hosted, ftmo-research]
    timeout-minutes: 4
    steps:
      - name: Recover and prove zCloud listener from independent VPS runner
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = "vps-bb300bba"

          service="actions.runner.Zennay-zCloud.zcloud-vps-1.service"
          runner_root="/home/ubuntu/actions-runner-zcloud"
          temp_root="$runner_root/_work/_temp"

          pre_state="$(systemctl is-active "$service" || true)"
          pre_pid="$(systemctl show "$service" -p MainPID --value || true)"
          worker_count=0
          listener_count=0
          for proc in /proc/[0-9]*; do
            pid="${proc##*/}"
            cmd="$(tr '\0' ' ' < "$proc/cmdline" 2>/dev/null || true)"
            [[ "$cmd" == *"$runner_root/bin/Runner.Worker"* ]] && worker_count=$((worker_count+1))
            [[ "$cmd" == *"$runner_root/bin/Runner.Listener"* ]] && listener_count=$((listener_count+1))
          done
          echo "ZCLOUD_RECOVERY_PRE state=$pre_state pid=$pre_pid listeners=$listener_count workers=$worker_count"

          action=none
          if [[ "$worker_count" -gt 0 ]]; then
            action=preserve-active-worker
          elif [[ "$pre_state" != "active" ]]; then
            sudo -n systemctl reset-failed "$service" || true
            sudo -n systemctl start "$service"
            action=start-inactive-listener
          elif [[ "$listener_count" -eq 1 ]]; then
            action=preserve-healthy-listener
          else
            sudo -n systemctl restart "$service"
            action=restart-unhealthy-listener
          fi

          for _ in $(seq 1 30); do
            state="$(systemctl is-active "$service" || true)"
            [[ "$state" = "active" ]] && break
            sleep 2
          done
          test "$(systemctl is-active "$service" || true)" = "active"

          cgroup="$(systemctl show "$service" -p ControlGroup --value)"
          mapfile -t listeners < <(
            for proc in /proc/[0-9]*; do
              pid="${proc##*/}"
              cmd="$(tr '\0' ' ' < "$proc/cmdline" 2>/dev/null || true)"
              [[ "$cmd" == *"$runner_root/bin/Runner.Listener"* ]] && echo "$pid"
            done
          )
          echo "ZCLOUD_RECOVERY_POST action=$action listeners=${#listeners[@]} pids=${listeners[*]:-none} cgroup=$cgroup"
          test "${#listeners[@]}" -eq 1
          grep -Fq "$cgroup" "/proc/${listeners[0]}/cgroup"

          sentinel="$temp_root/.zcloud-cross-runner-proof-$GITHUB_RUN_ID"
          sudo -n -u ubuntu touch "$sentinel"
          sleep 12
          test -f "$sentinel"
          rm -f "$sentinel"

          echo "ZCLOUD_CROSS_RUNNER_LISTENER_GREEN action=$action listener=${listeners[0]} cgroup=$cgroup"
          systemctl show "$service" -p ActiveState -p SubState -p MainPID -p NRestarts -p Result -p ExecMainStatus --no-pager
          journalctl -u "$service" --since "-30 min" --no-pager 2>/dev/null | tail -100 || true
