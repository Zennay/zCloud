name: FTMO PR443 superseded CI cleanup Worker2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-pr443-superseded-ci-cleanup-worker2.yml"

permissions:
  contents: write

concurrency:
  group: ftmo-pr443-superseded-ci-cleanup-worker2
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 8
    env:
      QUEUE_ID: zssh-ftmo-cancel-superseded-pr-ci-20261002-worker1-pr443
      FTMO_REPO: Zennay/Ftmo
      TARGET_PR: "421"
      TARGET_RUN: "36996247136"
      TARGET_SHA: 44c28172f2d6db168f0d3271bf859fb43b82e3d5
      ASSIGNMENT_MAIN_SHA: f761bc3af1e62a16cdc441df7d4585d4a6e32f54
      PROTECTED_PR: "443"
      PROTECTED_PR_SHA: 9b78f850e4c8be9cf9d826bfad950f4041ef0441
      PROTECTED_RUNS: "37005325337 37005325289 37005325357"
      RECEIPT_PATH: artifacts/ops/zssh-ftmo-cancel-superseded-pr-ci-20261002-worker1-pr443.json
    steps:
      - name: Checkout zCloud control plane
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          fetch-depth: 0

      - name: Verify live assignment and safely clean FTMO Actions
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          gh auth status >/dev/null 2>&1
          python3 - <<'PY'
          import json, os, subprocess, time
          from pathlib import Path

          repo=os.environ["FTMO_REPO"]
          target_pr=int(os.environ["TARGET_PR"])
          target_run=int(os.environ["TARGET_RUN"])
          target_sha=os.environ["TARGET_SHA"]
          assignment_main=os.environ["ASSIGNMENT_MAIN_SHA"]
          protected_pr=int(os.environ["PROTECTED_PR"])
          protected_pr_sha=os.environ["PROTECTED_PR_SHA"]
          protected_runs={int(x) for x in os.environ["PROTECTED_RUNS"].split()}
          protected_shas={assignment_main, protected_pr_sha}
          active_statuses=("queued","pending","in_progress")

          def gh(path):
              return json.loads(subprocess.check_output([
                  "gh","api","-H","X-GitHub-Api-Version: 2022-11-28",path
              ], text=True))

          def request_cancel(rid):
              latest=gh(f"repos/{repo}/actions/runs/{rid}")
              if latest.get("status") not in active_statuses:
                  return {"action":"already_terminal","status":latest.get("status"),"conclusion":latest.get("conclusion")}
              p=subprocess.run([
                  "gh","api","--method","POST","-H","X-GitHub-Api-Version: 2022-11-28",
                  f"repos/{repo}/actions/runs/{rid}/cancel"
              ], stdout=subprocess.DEVNULL, stderr=subprocess.PIPE, text=True)
              if p.returncode == 0:
                  return {"action":"cancel_requested"}
              latest=gh(f"repos/{repo}/actions/runs/{rid}")
              if latest.get("status") not in active_statuses:
                  return {"action":"terminal_race","status":latest.get("status"),"conclusion":latest.get("conclusion")}
              raise SystemExit(f"cancel failed run={rid} status={latest.get('status')} stderr={p.stderr.strip()[:300]}")

          current_main=gh(f"repos/{repo}/branches/main")["commit"]["sha"]
          open_prs=gh(f"repos/{repo}/pulls?state=open&per_page=100")
          open_by_branch={(p.get("head") or {}).get("ref"):p for p in open_prs if (p.get("head") or {}).get("ref")}
          open_head_shas={(p.get("head") or {}).get("sha") for p in open_prs if (p.get("head") or {}).get("sha")}

          pr421=gh(f"repos/{repo}/pulls/{target_pr}")
          target=gh(f"repos/{repo}/actions/runs/{target_run}")
          if pr421.get("state")!="closed": raise SystemExit("PR421 is not closed")
          if (pr421.get("head") or {}).get("sha")!=target_sha: raise SystemExit("PR421 head mismatch")
          if target.get("head_sha")!=target_sha: raise SystemExit("target run head mismatch")
          if target_sha==current_main: raise SystemExit("target SHA became current main")
          if target_sha in open_head_shas: raise SystemExit("target SHA became latest open-PR head")

          pr443=gh(f"repos/{repo}/pulls/{protected_pr}")
          if (pr443.get("head") or {}).get("sha")!=protected_pr_sha: raise SystemExit("PR443 protected head mismatch")
          protected_state={"pr443_state":pr443.get("state"),"pr443_merged":bool(pr443.get("merged_at"))}
          protected={}
          for rid in sorted(protected_runs):
              r=gh(f"repos/{repo}/actions/runs/{rid}")
              if r.get("head_sha")!=protected_pr_sha: raise SystemExit(f"protected run {rid} head mismatch")
              protected[str(rid)]={"status":r.get("status"),"conclusion":r.get("conclusion"),"head_sha":r.get("head_sha"),"head_branch":r.get("head_branch")}

          before={}; active=[]
          for st in active_statuses:
              payload=gh(f"repos/{repo}/actions/runs?status={st}&per_page=100")
              total=int(payload.get("total_count") or 0)
              if total>100: raise SystemExit(f"refusing incomplete pagination {st}={total}")
              before[st]=total
              active.extend(payload.get("workflow_runs") or [])

          cancelled=[]; kept=[]
          if target.get("status") in active_statuses:
              outcome=request_cancel(target_run)
              if outcome["action"]=="cancel_requested": cancelled.append({"id":target_run,"reason":"closed_pr421_exact_target"})
              else: kept.append({"id":target_run,"reason":"target_terminal_race",**outcome})
          else:
              kept.append({"id":target_run,"reason":f"already_terminal:{target.get('status')}:{target.get('conclusion')}"})

          for run in sorted(active,key=lambda r:int(r["id"])):
              rid=int(run["id"]); sha=run.get("head_sha"); branch=run.get("head_branch"); status=run.get("status")
              if rid==target_run: continue
              if rid in protected_runs:
                  kept.append({"id":rid,"status":status,"sha":sha,"branch":branch,"reason":"explicit_protected_run"}); continue
              if sha in protected_shas:
                  kept.append({"id":rid,"status":status,"sha":sha,"branch":branch,"reason":"explicit_protected_assignment_sha"}); continue
              if sha==current_main or branch=="main":
                  kept.append({"id":rid,"status":status,"sha":sha,"branch":branch,"reason":"current_main"}); continue
              if sha in open_head_shas:
                  prs=[int(p["number"]) for p in open_prs if (p.get("head") or {}).get("sha")==sha]
                  kept.append({"id":rid,"status":status,"sha":sha,"branch":branch,"reason":"latest_head_of_open_pr","prs":prs}); continue
              open_pr=open_by_branch.get(branch)
              if open_pr is not None:
                  latest=(open_pr.get("head") or {}).get("sha")
                  if latest and sha!=latest:
                      outcome=request_cancel(rid)
                      if outcome["action"]=="cancel_requested":
                          cancelled.append({"id":rid,"status":status,"sha":sha,"branch":branch,"reason":"stale_head_of_open_pr","pr":int(open_pr["number"]),"latest_sha":latest})
                      else:
                          kept.append({"id":rid,"status":status,"sha":sha,"branch":branch,"reason":"terminal_race_stale_head","pr":int(open_pr["number"]),**outcome})
                      continue
              related=gh(f"repos/{repo}/commits/{sha}/pulls") if sha else []
              if related and all(p.get("state")=="closed" for p in related):
                  outcome=request_cancel(rid)
                  if outcome["action"]=="cancel_requested":
                      cancelled.append({"id":rid,"status":status,"sha":sha,"branch":branch,"reason":"associated_prs_closed_or_merged","prs":[{"number":int(p["number"]),"merged":bool(p.get("merged_at"))} for p in related]})
                  else:
                      kept.append({"id":rid,"status":status,"sha":sha,"branch":branch,"reason":"terminal_race_closed_pr",**outcome})
                  continue
              kept.append({"id":rid,"status":status,"sha":sha,"branch":branch,"reason":"no_safe_cancel_proof"})

          time.sleep(3)
          after={}
          for st in active_statuses:
              after[st]=int(gh(f"repos/{repo}/actions/runs?status={st}&per_page=100").get("total_count") or 0)
          final_cancelled={}
          for item in cancelled:
              r=gh(f"repos/{repo}/actions/runs/{item['id']}")
              final_cancelled[str(item["id"])]={"status":r.get("status"),"conclusion":r.get("conclusion"),"head_sha":r.get("head_sha")}

          receipt={
              "schema_version":1, "queue_id":os.environ["QUEUE_ID"], "workflow_run_id":os.environ["GITHUB_RUN_ID"],
              "host":subprocess.check_output(["hostname"],text=True).strip(), "runner_name":os.environ.get("RUNNER_NAME"),
              "assignment_main_sha":assignment_main, "current_main_sha":current_main,
              "open_pr_heads":[{"number":int(p["number"]),"head_ref":(p.get("head") or {}).get("ref"),"head_sha":(p.get("head") or {}).get("sha")} for p in open_prs],
              "preflight":{"pr421_state":pr421.get("state"),"pr421_head_sha":(pr421.get("head") or {}).get("sha"),"target_run_status":target.get("status"),"target_run_conclusion":target.get("conclusion"),"target_run_head_sha":target.get("head_sha"),"target_not_current_main":target_sha!=current_main,"target_not_latest_open_pr_head":target_sha not in open_head_shas},
              "protected_pr443":protected_state, "protected_pr443_sha":protected_pr_sha, "protected_runs":protected,
              "before":before, "cancelled":cancelled, "kept":kept, "after":after, "cancelled_final_status":final_cancelled
          }
          Path(os.environ["RECEIPT_PATH"]).parent.mkdir(parents=True,exist_ok=True)
          Path(os.environ["RECEIPT_PATH"]).write_text(json.dumps(receipt,sort_keys=True,indent=2)+"\n")
          print("FTMO_PR443_CLEANUP_RESULT="+json.dumps(receipt,sort_keys=True))
          PY

      - name: Finalize exact live SQLite queue item
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util, json, os, sqlite3, sys
          from pathlib import Path
          qid=os.environ["QUEUE_ID"]; root=Path("/home/ubuntu/zennay-cloud"); db=root/"history.db"; sp=root/"server.py"
          sys.path.insert(0,str(root))
          spec=importlib.util.spec_from_file_location("zcloud_live_server",sp)
          server=importlib.util.module_from_spec(spec); spec.loader.exec_module(server); server.DB=db
          with sqlite3.connect(db) as c:
              c.row_factory=sqlite3.Row
              row=c.execute("SELECT queue_id,project_id,status,eligible,worker_slot,evidence,updated_at FROM portfolio_queue WHERE queue_id=?",(qid,)).fetchone()
          if not row: raise SystemExit("queue item missing")
          item=dict(row); print("QUEUE_BEFORE="+json.dumps(item,sort_keys=True,default=str))
          if item["project_id"]!="zssh": raise SystemExit("wrong queue project")
          receipt=json.loads(Path(os.environ["RECEIPT_PATH"]).read_text())
          ev=(f"FTMO PR443 superseded-CI cleanup workflow {os.environ['GITHUB_RUN_ID']} on vps-bb300bba; "
              f"cancelled={[x['id'] for x in receipt['cancelled']]}; before={receipt['before']}; after={receipt['after']}; "
              f"actual_main={receipt['current_main_sha']}; PR421 target verified; PR443 exact-head runs preserved.")
          if item["status"]=="done" and int(item["eligible"] or 0)==0 and item["worker_slot"] is None:
              print("QUEUE_ALREADY_DONE=1")
          elif item["status"] in {"claimed","running","verifying","in_progress"} and item["worker_slot"] is not None:
              result=server.portfolio_queue_finish(int(item["worker_slot"]),qid,"DONE",ev)
              print("QUEUE_FINISH_RESULT="+json.dumps(result,sort_keys=True,default=str))
              if not result.get("updated"): raise SystemExit("queue finish refused")
          else:
              raise SystemExit(f"queue not safely finalizable status={item['status']} eligible={item['eligible']} worker_slot={item['worker_slot']}")
          with sqlite3.connect(db) as c:
              c.row_factory=sqlite3.Row
              final=c.execute("SELECT queue_id,project_id,status,eligible,worker_slot,evidence,updated_at FROM portfolio_queue WHERE queue_id=?",(qid,)).fetchone()
          final=dict(final); print("QUEUE_AFTER="+json.dumps(final,sort_keys=True,default=str))
          if final["status"]!="done" or int(final["eligible"] or 0)!=0 or final["worker_slot"] is not None:
              raise SystemExit("queue final state not done/eligible=0/unclaimed")
          PY

      - name: Commit immutable cleanup receipt
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          test -f "$RECEIPT_PATH"
          git config user.name zcloud-automation
          git config user.email zcloud-automation@users.noreply.github.com
          git add "$RECEIPT_PATH"
          if ! git diff --cached --quiet; then
            git commit -m "Record FTMO PR443 superseded CI cleanup"
            git push origin HEAD:main
          fi
