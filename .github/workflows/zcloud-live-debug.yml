# incident retrigger 2026-10-06T06:30Z: inspect API reset after worker restart attempt 3
name: zCloud live dynamic worker debug
# retrigger: inspect zCloud service health before worker activation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/zcloud-live-debug.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/zcloud-live-debug.yml"
      - ".github/workflows/zcloud-vps-deploy.yml"
      - "scripts/zcloud_transactional_promote.py"
      - "scripts/zcloud_vps_runner_guard.py"
      - "tests/test_live_debug_workflow.py"
      - "server.py"

permissions:
  contents: read

concurrency:
  group: zcloud-live-dynamic-worker-debug
  cancel-in-progress: true

jobs:
  inspect:
    if: github.event_name != 'pull_request' || (github.actor == 'Zennay' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 5
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
          clean: true
          fetch-depth: 512

      - name: Verify permanent zCloud VPS runner and exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python3 scripts/zcloud_vps_runner_guard.py --json

      - name: Read live canary and worker state
        shell: bash
        run: |
          set +e
          export XDG_RUNTIME_DIR=/run/user/1000
          export DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1000/bus
          echo "=== TIME ==="
          date -Ins
          echo "=== SERVICES ==="
          systemctl is-active zennay-cloud.service
          systemctl --no-pager --full status zennay-cloud.service || true
          systemctl show zennay-cloud.service \
            -p ActiveState -p SubState -p MainPID -p NRestarts \
            -p ExecMainStartTimestamp -p ExecMainExitTimestamp -p ExecMainStatus \
            -p Restart -p RestartUSec -p TimeoutStartUSec || true
          sudo -n journalctl -u zennay-cloud.service --since "10 minutes ago" --no-pager -n 240 || \
            journalctl -u zennay-cloud.service -n 100 --no-pager || true
          systemctl --user is-active chatgpt-firefox.service
          echo "=== LIVE PRECHANGE GUARD ==="
          "$HOME/.local/bin/zcloud-prechange-guard" \
            --root /home/ubuntu/zennay-cloud \
            --state "$HOME/.local/state/zcloud/recovery" \
            --json
          echo "PRECHANGE_RC=$?"
          echo "=== LIVE POSTDEPLOY CANARY ==="
          "$HOME/.local/bin/zcloud-postdeploy-canary" \
            --root /home/ubuntu/zennay-cloud \
            --db /home/ubuntu/zennay-cloud/history.db \
            --json
          echo "CANARY_RC=$?"
          echo "=== API STATUS SUMMARY ==="
          python3 - <<'PY'
          import json, urllib.request
          def get(path):
              with urllib.request.urlopen("http://127.0.0.1:8765"+path, timeout=5) as r:
                  return json.load(r)
          s=get("/api/status")
          t=get("/api/runner-targets")
          print(json.dumps({
              "time": s.get("time"),
              "errors": s.get("errors"),
              "dynamic_workers": s.get("dynamic_workers"),
              "chatgpt_firefox": s.get("chatgpt_firefox"),
              "global_allocation": t.get("global_allocation"),
              "max_workers": t.get("max_workers"),
              "workers": {
                  pid: {
                      "state": r.get("state"),
                      "error": r.get("error"),
                      "event": r.get("event"),
                      "last_event": r.get("last_event"),
                      "last_prompt_sent": r.get("last_prompt_sent"),
                      "last_generation_started": r.get("last_generation_started"),
                      "last_generation_finished": r.get("last_generation_finished"),
                      "workers": r.get("workers"),
                  }
                  for pid,r in (s.get("chatgpt_runners") or {}).items()
                  if r.get("active") or r.get("state") in ("live","stale")
              },
          }, ensure_ascii=False, indent=2))
          PY
          echo "=== VERSION / HASH PARITY ==="
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, urllib.request
          def sha(p):
              p=Path(p)
              return hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else None
          paths={
              "live_server":"/home/ubuntu/zennay-cloud/server.py",
              "live_queue_seed":"/home/ubuntu/zennay-cloud/portfolio_queue.seed.json",
              "live_background":"/home/ubuntu/zennay-cloud/firefox-extension/background.js",
              "runtime_background":"/home/ubuntu/snap/firefox/common/chatgpt-project-extension/background.js",
              "live_userscript":"/home/ubuntu/zennay-cloud/public/zcloud-worker.user.js",
          }
          for k,p in paths.items():
              print(k, sha(p), p)
          try:
              text=urllib.request.urlopen("http://127.0.0.1:8765/zcloud-worker.user.js",timeout=5).read().decode("utf-8","replace")
              print("served_userscript_version", next((line.strip() for line in text.splitlines() if "@version" in line), "missing"))
              print("served_userscript_sha", hashlib.sha256(text.encode()).hexdigest())
          except Exception as e:
              print("served_userscript_error", repr(e))
          PY
          echo "=== DEPLOY DRIFT PROVENANCE ==="
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, sqlite3, subprocess
          from datetime import datetime

          root=Path("/home/ubuntu/zennay-cloud")
          repo=Path.cwd()
          state=Path.home()/".local/state/zcloud/recovery"

          def sha(path):
              path=Path(path)
              return hashlib.sha256(path.read_bytes()).hexdigest() if path.is_file() else None

          def ancestor_match(rel, live_sha):
              proc=subprocess.run(
                  ["git","rev-list","--first-parent","--max-count=512","HEAD"],
                  text=True,capture_output=True,check=False,
              )
              for commit in proc.stdout.splitlines():
                  blob=subprocess.run(
                      ["git","show",f"{commit}:{rel}"],
                      capture_output=True,check=False,
                  )
                  if blob.returncode == 0 and hashlib.sha256(blob.stdout).hexdigest() == live_sha:
                      return commit
              return None

          report={}
          for rel in ("server.py","resource-policy.json"):
              live=root/rel
              candidate=repo/rel
              live_sha=sha(live)
              candidate_sha=sha(candidate)
              report[rel]={
                  "live_sha256":live_sha,
                  "candidate_sha256":candidate_sha,
                  "equal":bool(live_sha and live_sha == candidate_sha),
                  "recent_first_parent_match":ancestor_match(rel, live_sha) if live_sha else None,
              }

          try:
              pointer=json.loads((state/"last-known-good.json").read_text())
              manifest=json.loads((state/"snapshots"/pointer["snapshot_id"]/"manifest.json").read_text())
              report["lkg"]={
                  "snapshot_id":pointer.get("snapshot_id"),
                  "created_at":manifest.get("created_at"),
              }
          except Exception as exc:
              report["lkg"]={"error":type(exc).__name__}

          try:
              conn=sqlite3.connect(root/"history.db",timeout=4)
              rows=conn.execute(
                  "SELECT ts,target,new_value_json,result FROM config_audit "
                  "WHERE config_key='resource.priority' ORDER BY id DESC LIMIT 20"
              ).fetchall()
              conn.close()
              report["resource_priority_audit"]=[
                  {"ts":r[0],"target":r[1],"new_value_json":r[2],"result":r[3]} for r in rows
              ]
          except Exception as exc:
              report["resource_priority_audit"]={"error":type(exc).__name__}

          print(json.dumps(report,sort_keys=True,indent=2))
          PY
          echo "=== AUDITED RESOURCE DRIFT DECISION ==="
          python3 - <<'PY'
          from pathlib import Path
          import json, sqlite3
          import scripts.zcloud_transactional_promote as promote

          root=Path("/home/ubuntu/zennay-cloud")
          state=Path.home()/".local/state/zcloud/recovery"
          pointer=json.loads((state/"last-known-good.json").read_text())
          snapshot=state/"snapshots"/pointer["snapshot_id"]
          manifest=json.loads((snapshot/"manifest.json").read_text())
          baseline=json.loads((snapshot/"files"/"resource-policy.json").read_text())
          live=json.loads((root/"resource-policy.json").read_text())
          projects=sorted(set(baseline)|set(live))
          delta=[]
          db_path=root/"history.db"
          if db_path.is_symlink() or not db_path.is_file():
              raise SystemExit("live history.db must be a regular non-symlink file")
          with sqlite3.connect(f"file:{db_path}?mode=ro",uri=True,timeout=4) as conn:
              conn.execute("PRAGMA query_only=ON")
              for project in projects:
                  before=baseline.get(project) or {}
                  after=live.get(project) or {}
                  if before==after:
                      continue
                  row=conn.execute(
                      "SELECT id,ts,actor,new_value_json,result,detail FROM config_audit "
                      "WHERE config_key='resource.priority' AND target=? ORDER BY id DESC LIMIT 1",
                      (project,),
                  ).fetchone()
                  delta.append({
                      "project":project,
                      "lkg":before,
                      "live":after,
                      "latest_priority_audit":(
                          {"id":row[0],"ts":row[1],"actor":row[2],"new_value_json":row[3],"result":row[4],"detail":row[5]}
                          if row else None
                      ),
                  })
          print(json.dumps({
              "lkg_snapshot_id":pointer["snapshot_id"],
              "lkg_created_at":manifest.get("created_at"),
              "delta":delta,
              "matcher_accepts":promote.audited_runtime_config_drift_matches(
                  root,state,"resource-policy.json"
              ),
          },sort_keys=True,indent=2))
          PY

          echo "=== DEPLOY DRIFT SEMANTIC DIFF ==="
          python3 - <<'PY'
          from pathlib import Path
          import difflib, json

          root=Path("/home/ubuntu/zennay-cloud")
          repo=Path.cwd()

          live_server=(root/"server.py").read_text(encoding="utf-8",errors="replace").splitlines()
          candidate_server=(repo/"server.py").read_text(encoding="utf-8",errors="replace").splitlines()
          diff=list(difflib.unified_diff(
              candidate_server,live_server,
              fromfile="candidate/server.py",tofile="live/server.py",
              lineterm="",
          ))
          print("SERVER_DIFF_LINES",len(diff))
          for line in diff[:500]:
              print(line)

          live_policy=json.loads((root/"resource-policy.json").read_text(encoding="utf-8"))
          candidate_policy=json.loads((repo/"resource-policy.json").read_text(encoding="utf-8"))
          keys=sorted(set(live_policy)|set(candidate_policy))
          delta=[]
          for project in keys:
              old=candidate_policy.get(project) or {}
              new=live_policy.get(project) or {}
              fields={}
              for key in sorted(set(old)|set(new)):
                  if old.get(key)!=new.get(key):
                      fields[key]={"candidate":old.get(key),"live":new.get(key)}
              if fields:
                  delta.append({"project":project,"fields":fields})
          print("RESOURCE_POLICY_DELTA",json.dumps(delta,sort_keys=True))
          PY
          echo "=== FIREFOX JOURNAL TAIL ==="
          journalctl --user -u chatgpt-firefox.service -n 80 --no-pager
          echo "=== PROCESSES ==="
          pgrep -af 'firefox|web-ext|violentmonkey' || true
