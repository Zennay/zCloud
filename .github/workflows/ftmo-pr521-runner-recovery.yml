name: Recover FTMO runner for PR521 exact-head rerun

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-pr521-runner-recovery.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ftmo-pr521-runner-recovery
  cancel-in-progress: true

jobs:
  recover:
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 6
    env:
      FTMO_MAIN_SHA: 9145322dd71837e50777b4a1289fec80e98932b4
      PR_NUMBER: '521'
      PR_HEAD_SHA: a3cd0a08ccd24dec1edee31a7e2b126c3f990830
      TEST_RUN_ID: '37176592985'
      FTMO_SERVICE: actions.runner.Zennay-Ftmo.vps-bb300bba-ftmo.service
      FTMO_RUN_USER: ftmo-runner
      RECEIPT_PATH: runtime-evidence/ftmo-pr521-runner-recovery.json

    steps:
      - name: Verify exact FTMO identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          gh auth status >/dev/null 2>&1
          test "$(gh api repos/Zennay/Ftmo/branches/main --jq .commit.sha)" = "$FTMO_MAIN_SHA"
          test "$(gh api repos/Zennay/Ftmo/pulls/$PR_NUMBER --jq .state)" = "open"
          test "$(gh api repos/Zennay/Ftmo/pulls/$PR_NUMBER --jq .base.ref)" = "main"
          test "$(gh api repos/Zennay/Ftmo/pulls/$PR_NUMBER --jq .base.sha)" = "$FTMO_MAIN_SHA"
          test "$(gh api repos/Zennay/Ftmo/pulls/$PR_NUMBER --jq .head.sha)" = "$PR_HEAD_SHA"
          test "$(gh api repos/Zennay/Ftmo/actions/runs/$TEST_RUN_ID --jq .head_sha)" = "$PR_HEAD_SHA"
          test "$(gh api repos/Zennay/Ftmo/actions/runs/$TEST_RUN_ID --jq .name)" = "Test suite"
          echo "FTMO_PR521_IDENTITIES=verified"

      - name: Diagnose and recover only the dedicated FTMO listener
        id: recover
        shell: bash
        run: |
          set -euo pipefail
          pre_state="$(systemctl is-active "$FTMO_SERVICE" || true)"
          pre_pid="$(systemctl show "$FTMO_SERVICE" -p MainPID --value || true)"
          worker=0
          listener=0
          pgrep -u "$FTMO_RUN_USER" -f 'Runner\.Worker' >/dev/null 2>&1 && worker=1 || true
          if [[ "$pre_pid" =~ ^[1-9][0-9]*$ ]] && test -r "/proc/$pre_pid/cmdline"; then
            pre_cmd="$(tr '\0' ' ' < "/proc/$pre_pid/cmdline")"
            [[ "$pre_cmd" == *"Runner.Listener"* || "$pre_cmd" == *"runsvc.sh"* ]] && listener=1 || true
          fi
          echo "FTMO_RUNNER_PRE state=$pre_state pid=$pre_pid worker=$worker listener=$listener"

          run_status="$(gh api repos/Zennay/Ftmo/actions/runs/$TEST_RUN_ID --jq .status)"
          action=none
          if [[ "$worker" -eq 1 ]]; then
            action=preserve-active-worker
          elif [[ "$run_status" != "queued" ]]; then
            action=preserve-no-queued-work
          elif [[ "$pre_state" == "active" && "$listener" -eq 1 ]]; then
            sudo -n systemctl restart "$FTMO_SERVICE"
            action=restart-idle-listener
          else
            sudo -n systemctl reset-failed "$FTMO_SERVICE" || true
            sudo -n systemctl restart "$FTMO_SERVICE"
            action=restart-unhealthy-listener
          fi

          post_state="$(systemctl is-active "$FTMO_SERVICE" || true)"
          post_pid="$(systemctl show "$FTMO_SERVICE" -p MainPID --value || true)"
          if [[ "$action" == restart-* ]]; then
            for _ in $(seq 1 30); do
              post_state="$(systemctl is-active "$FTMO_SERVICE" || true)"
              post_pid="$(systemctl show "$FTMO_SERVICE" -p MainPID --value || true)"
              if [[ "$post_state" == "active" && "$post_pid" =~ ^[1-9][0-9]*$ ]] && test -r "/proc/$post_pid/cmdline"; then
                post_cmd="$(tr '\0' ' ' < "/proc/$post_pid/cmdline")"
                if [[ "$post_cmd" == *"Runner.Listener"* || "$post_cmd" == *"runsvc.sh"* ]]; then
                  break
                fi
              fi
              sleep 2
            done
          fi
          test "$post_state" = "active"
          echo "FTMO_RUNNER_RECOVERY_ACTION=$action"
          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "pre_state=$pre_state" >> "$GITHUB_OUTPUT"
          echo "pre_pid=$pre_pid" >> "$GITHUB_OUTPUT"
          echo "post_state=$post_state" >> "$GITHUB_OUTPUT"
          echo "post_pid=$post_pid" >> "$GITHUB_OUTPUT"

      - name: Prove exact-head rerun starts scheduling
        id: schedule
        shell: bash
        run: |
          set -euo pipefail
          status=""
          conclusion=""
          for _ in $(seq 1 36); do
            status="$(gh api repos/Zennay/Ftmo/actions/runs/$TEST_RUN_ID --jq .status)"
            conclusion="$(gh api repos/Zennay/Ftmo/actions/runs/$TEST_RUN_ID --jq '.conclusion // ""')"
            echo "FTMO_PR521_TEST status=$status conclusion=$conclusion"
            if [[ "$status" == "in_progress" || "$status" == "completed" ]]; then
              break
            fi
            sleep 5
          done
          [[ "$status" == "in_progress" || "$status" == "completed" ]]
          echo "run_status=$status" >> "$GITHUB_OUTPUT"
          echo "run_conclusion=$conclusion" >> "$GITHUB_OUTPUT"

      - name: Persist sanitized recovery receipt
        if: always()
        shell: bash
        env:
          RECOVERY_ACTION: ${{ steps.recover.outputs.action }}
          PRE_STATE: ${{ steps.recover.outputs.pre_state }}
          PRE_PID: ${{ steps.recover.outputs.pre_pid }}
          POST_STATE: ${{ steps.recover.outputs.post_state }}
          POST_PID: ${{ steps.recover.outputs.post_pid }}
          TEST_STATUS: ${{ steps.schedule.outputs.run_status }}
          TEST_CONCLUSION: ${{ steps.schedule.outputs.run_conclusion }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/zcloud-ftmo-pr521-runner-recovery"
          rm -rf "$work"
          gh repo clone Zennay/zCloud "$work" -- --filter=blob:none >/dev/null
          cd "$work"
          git checkout main >/dev/null
          git pull --rebase origin main
          mkdir -p "$(dirname "$RECEIPT_PATH")"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          payload = {
              "schema_version": 1,
              "project": "ftmo",
              "task": "TASK-78",
              "pull_request": 521,
              "main_sha": os.environ["FTMO_MAIN_SHA"],
              "target_sha": os.environ["PR_HEAD_SHA"],
              "test_run_id": int(os.environ["TEST_RUN_ID"]),
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "workflow_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "runner_host": os.environ.get("RUNNER_NAME"),
              "recovery_action": os.environ.get("RECOVERY_ACTION"),
              "pre_state": os.environ.get("PRE_STATE"),
              "pre_pid": os.environ.get("PRE_PID"),
              "post_state": os.environ.get("POST_STATE"),
              "post_pid": os.environ.get("POST_PID"),
              "test_status_after_recovery": os.environ.get("TEST_STATUS"),
              "test_conclusion_after_recovery": os.environ.get("TEST_CONCLUSION"),
              "research_authority_changed": False,
              "paid_cloud_enabled": False,
          }
          Path(os.environ["RECEIPT_PATH"]).write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          git config user.name "zcloud-automation"
          git config user.email "zcloud-automation@users.noreply.github.com"
          git add "$RECEIPT_PATH"
          if ! git diff --cached --quiet; then
            git commit -m "Record FTMO PR521 runner recovery"
            for _ in 1 2 3; do
              if git push origin HEAD:main; then exit 0; fi
              git fetch origin main
              git rebase origin/main
            done
            exit 1
          fi
