name: zSSH Caddy bootstrap retired

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/zssh-caddy-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: read

# Intentionally shares the legacy bootstrap concurrency group. A run from this
# retired definition supersedes/cancels any queued or in-progress copy of the
# old dormant-bootstrap workflow before it can mutate the VPS.
concurrency:
  group: zssh-caddy-bootstrap-zcloud
  cancel-in-progress: true

jobs:
  retired:
    name: Use canonical DNS-gated public ingress bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm legacy bootstrap is retired
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "ZSSH_CADDY_BOOTSTRAP_RETIRED"
          echo "Canonical lane: .github/workflows/zssh-public-ingress-bootstrap.yml"
          echo "Reason: the canonical lane owns first Caddy installation plus transactional zSSH ingress promotion only after DNS and public-gateway gates are green."
