name: zCloud deploy freshness proof

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/zcloud-deploy-freshness-proof.yml
      - scripts/zcloud_deploy_freshness_report.py
      - tests/test_deploy_freshness_report.py
      - tests/test_deploy_freshness_report_workflow.py
      - scripts/zcloud_recovery.py
      - .github/workflows/zcloud-vps-deploy.yml
      - .github/workflows/zcloud-regression-smoke.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/zcloud-deploy-freshness-proof.yml
      - scripts/zcloud_deploy_freshness_report.py
      - tests/test_deploy_freshness_report.py
      - tests/test_deploy_freshness_report_workflow.py
      - scripts/zcloud_recovery.py
      - .github/workflows/zcloud-vps-deploy.yml
      - .github/workflows/zcloud-regression-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zcloud-deploy-freshness-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    if: github.event_name != 'pull_request' || (github.actor == 'Zennay' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 5
    env:
      EXPECTED_ZCLOUD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact zCloud proof revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 1

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_ZCLOUD_SHA"
          printf 'ZCLOUD_DEPLOY_FRESHNESS_EXACT_CHECKOUT_GREEN sha=%s\n' "$actual"

      - name: Enforce permanent zCloud VPS runner identity
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/zcloud_vps_runner_guard.py --json

      - name: Run deploy freshness contract tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v \
            tests.test_deploy_freshness_report \
            tests.test_deploy_freshness_report_workflow

      - name: Mark deploy freshness proof green
        run: echo "ZCLOUD_DEPLOY_FRESHNESS_PROOF_GREEN=1"
