name: FTMO PR476 provider-clock exact-head proof

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-pr476-provider-clock-proof.yml"

permissions:
  contents: write

concurrency:
  group: ftmo-pr476-provider-clock-proof
  cancel-in-progress: true

jobs:
  proof:
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 30
    env:
      TARGET_SHA: e763d57eb978295b2f15f5ed83eb83635c7aa926
      FTMO_AUTONOMOUS_CLOUD_BUDGET_USD: "0.00"
      FTMO_ALLOW_PAID_AWS: ""
    steps:
      - name: Checkout zCloud receipt workspace
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout exact FTMO PR476 head
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          src="$RUNNER_TEMP/ftmo-pr476-exact"
          rm -rf "$src"
          git init -q "$src"
          git -C "$src" remote add origin https://github.com/Zennay/Ftmo.git
          git -C "$src" -c protocol.version=2 fetch -q --depth=1 origin "$TARGET_SHA"
          git -C "$src" checkout -q --detach FETCH_HEAD
          test "$(git -C "$src" rev-parse HEAD)" = "$TARGET_SHA"

      - name: Prove provider clock remains fail-closed
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr476-exact"
          venv="$RUNNER_TEMP/ftmo-pr476-venv"
          rm -rf "$venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install -q -r "$src/requirements-ci.txt"
          "$venv/bin/python" -m pip install -q -e "$src"
          cd "$src"
          "$venv/bin/python" -m compileall -q \
            src/prop_trading_ai/ops/autonomous_rollover.py \
            src/prop_trading_ai/ops/autonomous_generation_loop.py
          "$venv/bin/python" -m pytest -q \
            tests/test_autonomous_provider_retry.py \
            tests/test_provider_foundation_publication.py
          "$venv/bin/python" -m pytest -q tests/test_zero_cost_workflow_boundary.py \
            -k "every_repository_workflow_has_no_github_hosted_runner or diagnostic_zero_cost_workflows_are_self_hosted_and_secret_free"

      - name: Persist sanitized proof receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-evidence
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          payload = {
              "schema_version": 1,
              "project": "ftmo",
              "pr": 476,
              "target_sha": os.environ["TARGET_SHA"],
              "host": "vps-bb300bba",
              "runner": os.environ.get("RUNNER_NAME", ""),
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "result": "success",
              "proof": [
                  "exact-sha-checkout",
                  "isolated-install",
                  "omitted-clock-future-window-no-provider-io",
                  "explicit-clock-boundary",
                  "provider-foundation-publication-regressions",
                  "zero-cost-boundaries",
              ],
              "paid_cloud_budget_usd": "0.00",
              "research_outcomes_accessed": False,
              "walk_forward_accessed": False,
              "final_holdout_accessed": False,
              "live_or_broker_access_opened": False,
          }
          Path("runtime-evidence/ftmo-pr476-provider-clock-proof.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime-evidence/ftmo-pr476-provider-clock-proof.json
          git commit -m "Record FTMO PR476 provider-clock proof"
          git push origin HEAD:main

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/ftmo-pr476-exact" "$RUNNER_TEMP/ftmo-pr476-venv"
