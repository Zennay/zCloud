name: FTMO PR448 live finalization snapshot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-pr448-live-finalization-snapshot.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ftmo-pr448-live-finalization-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: self-hosted
    timeout-minutes: 5
    env:
      QUEUE_ID: ftmo-7ee077e0b88278da
      FTMO_ROOT: /opt/ftmo-autonomous
      REQUIRED_MERGE: 920df21438332e57e2bd4027bdd0e8f68f922e8d
      REQUIRED_DEPLOY_FIX: b03e28641dd2937327150bf3f654ae6e347f52cf
    steps:
      - name: Capture live FTMO finalization state
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          python3 - <<'PY' > /tmp/ftmo-pr448-live-snapshot.json
          import json, os, sqlite3, subprocess
          from pathlib import Path

          def gh(path):
              return json.loads(subprocess.check_output(["gh","api",path], text=True))

          runs=gh("repos/Zennay/Ftmo/actions/workflows/deploy-autonomous-vps.yml/runs?per_page=10").get("workflow_runs", [])
          deploys=[{
              "id":r.get("id"),"status":r.get("status"),"conclusion":r.get("conclusion"),
              "head_sha":r.get("head_sha"),"event":r.get("event"),"created_at":r.get("created_at"),
              "updated_at":r.get("updated_at")
          } for r in runs]

          root=Path(os.environ["FTMO_ROOT"])
          status_path=root/".scratch/autonomy/status.json"
          runtime=None
          if status_path.is_file() and not status_path.is_symlink():
              try:
                  s=json.loads(status_path.read_text(encoding="utf-8"))
                  research=s.get("research") or {}
                  ctl=s.get("research_controller") or {}
                  loop=ctl.get("generation_loop") or {}
                  outcome=ctl.get("outcome_execution") or {}
                  runtime={
                      "runtime_revision":s.get("runtime_revision"),
                      "deployment_workflow_run_id":s.get("deployment_workflow_run_id"),
                      "completed_at_utc":s.get("completed_at_utc"),
                      "research_cycle_completed_at_utc":s.get("research_cycle_completed_at_utc"),
                      "research_cycle_ok":s.get("research_cycle_ok"),
                      "generation_number":research.get("generation_number"),
                      "generation_id":research.get("generation_id"),
                      "stage":research.get("next_stage"),
                      "development_access_allowed":research.get("development_access_allowed"),
                      "walk_forward_access_allowed":research.get("walk_forward_access_allowed"),
                      "final_holdout_access_allowed":research.get("final_holdout_access_allowed"),
                      "loop_action":loop.get("action"),
                      "provider_foundation_progress_made":loop.get("provider_foundation_progress_made"),
                      "partial_progress_providers":loop.get("partial_progress_providers"),
                      "walk_forward_accessed":outcome.get("walk_forward_accessed"),
                      "final_holdout_accessed":outcome.get("final_holdout_accessed"),
                      "live_trading_allowed":s.get("live_trading_allowed"),
                      "broker_order_submission_allowed":s.get("broker_order_submission_allowed"),
                      "autonomous_cloud_budget_usd":s.get("autonomous_cloud_budget_usd"),
                  }
              except Exception as exc:
                  runtime={"error":repr(exc)}

          queue=None
          db=Path("/home/ubuntu/zennay-cloud/history.db")
          if db.is_file():
              with sqlite3.connect(db) as c:
                  c.row_factory=sqlite3.Row
                  row=c.execute(
                      "SELECT queue_id,project_id,status,eligible,worker_slot,evidence,updated_at "
                      "FROM portfolio_queue WHERE queue_id=?",(os.environ["QUEUE_ID"],)
                  ).fetchone()
                  queue=dict(row) if row else None

          service={
              "state":subprocess.run(["systemctl","is-active","ftmo-autonomous-marathon.service"],text=True,capture_output=True).stdout.strip(),
              "pid":subprocess.run(["systemctl","show","ftmo-autonomous-marathon.service","-p","MainPID","--value"],text=True,capture_output=True).stdout.strip(),
          }

          print(json.dumps({
              "project":"ftmo","queue_id":os.environ["QUEUE_ID"],
              "required_merge":os.environ["REQUIRED_MERGE"],
              "required_deploy_fix":os.environ["REQUIRED_DEPLOY_FIX"],
              "deploy_runs":deploys,"runtime":runtime,"queue":queue,"service":service
          },sort_keys=True,indent=2,default=str))
          PY
          encoded="$(base64 -w0 /tmp/ftmo-pr448-live-snapshot.json)"
          path="artifacts/ops/ftmo-pr448-live-finalization-snapshot.json"
          current="$(gh api "repos/Zennay/zCloud/contents/$path" --jq .sha 2>/dev/null || true)"
          args=(--method PUT "repos/Zennay/zCloud/contents/$path" -f message="Record FTMO PR448 live finalization snapshot" -f content="$encoded")
          if [[ -n "$current" ]]; then args+=(-f sha="$current"); fi
          gh api "${args[@]}" >/dev/null
          cat /tmp/ftmo-pr448-live-snapshot.json
