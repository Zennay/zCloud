name: zCloud automatic VPS mutation no-new-exposure gate

# Hosted-only source guard: never starts a VPS job, deploys, stops workers,
# writes SQLite, calls privileged GitHub APIs or authorizes recovery.
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "scripts/zcloud_automatic_vps_mutation_ratchet_20261014_w2.py"
      - "tests/test_zcloud_automatic_vps_mutation_ratchet_20261014_w2.py"

permissions:
  contents: read

concurrency:
  group: zcloud-auto-vps-mutation-ratchet-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  source-guard:
    if: >-
      github.repository == 'Zennay/zCloud' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact immutable PR head and base history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - name: Fail closed on new automatic self-hosted mutation exposure
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Zennay/zCloud"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          [[ "$EXPECTED_BASE" =~ ^[0-9a-f]{40}$ ]]
          python3 -m py_compile scripts/zcloud_automatic_vps_mutation_ratchet_20261014_w2.py
          python3 -m unittest -v tests.test_zcloud_automatic_vps_mutation_ratchet_20261014_w2
          python3 scripts/zcloud_automatic_vps_mutation_ratchet_20261014_w2.py --base-sha "$EXPECTED_BASE" \
            > "$RUNNER_TEMP/automatic-vps-mutation-ratchet.json"
          python3 - "$RUNNER_TEMP/automatic-vps-mutation-ratchet.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              receipt = json.load(handle)
          assert receipt["policy"] == "zcloud-automatic-vps-mutation-no-new-exposure-v1"
          assert receipt["safe_to_review"] is True
          assert receipt["new_exposure_count"] == 0
          assert receipt["mutation_authorized"] is False
          assert receipt["production_verified"] is False
          print("ZCLOUD_AUTO_VPS_MUTATION_NO_NEW_DEBT_GREEN=1")
          PY
