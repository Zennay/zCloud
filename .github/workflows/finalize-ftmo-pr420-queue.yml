name: Finalize FTMO PR420 queue assignment

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-ftmo-pr420-queue.yml"

permissions:
  contents: read

concurrency:
  group: finalize-ftmo-pr420-queue
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: self-hosted
    timeout-minutes: 15
    env:
      MERGE_SHA: fd409196cb6a4d83c258343a3799d27d916c07d6
      EXACT_PROOF_RUN: "36995756456"
      STALE_FINALIZER_RUN: "36995584467"
      STALE_FINALIZER_SHA: "14c54e9bcc678bbb5ee07baddcb18c86c828e2e7"
      QUEUE_ID: ftmo-1c523ac7e47c9a6b
    steps:
      - name: Guard host and cancel only stale finalizer
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          gh auth status >/dev/null 2>&1
          raw="$(gh api "repos/Zennay/Ftmo/actions/runs/$STALE_FINALIZER_RUN")"
          python3 - "$STALE_FINALIZER_SHA" <<'PY' <<<"$raw"
          import json, sys
          expected = sys.argv[1]
          data = json.load(sys.stdin)
          if data.get("head_sha") != expected or data.get("name") != "Worker5 SQLite queue finalizer":
              raise SystemExit("stale-finalizer identity mismatch")
          print("stale_finalizer_status=" + str(data.get("status")))
          PY
          status="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])' <<<"$raw")"
          if [ "$status" = "queued" ] || [ "$status" = "in_progress" ]; then
            gh api --method POST "repos/Zennay/Ftmo/actions/runs/$STALE_FINALIZER_RUN/cancel"
            echo "STALE_FINALIZER_CANCEL_REQUESTED=1"
          fi

      - name: Verify exact-head implementation proof
        shell: bash
        run: |
          set -euo pipefail
          raw="$(gh api "repos/Zennay/zCloud/actions/runs/$EXACT_PROOF_RUN")"
          python3 - "$MERGE_SHA" <<'PY' <<<"$raw"
          import json, sys
          data = json.load(sys.stdin)
          if (data.get("status"), data.get("conclusion")) != ("completed", "success"):
              raise SystemExit("PR420 exact-head VPS proof is not green")
          print("PR420_EXACT_PROOF_GREEN=1")
          PY

      - name: Wait for deployed descendant and prove sealed runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import time
          from pathlib import Path

          merge_sha = os.environ["MERGE_SHA"]
          status_path = Path("/opt/ftmo-autonomous/.scratch/autonomy/status.json")

          def gh_json(path):
              return json.loads(subprocess.check_output(
                  ["gh", "api", "-H", "X-GitHub-Api-Version: 2022-11-28", path],
                  text=True,
              ))

          accepted = None
          for attempt in range(60):
              try:
                  if status_path.is_file() and not status_path.is_symlink():
                      status = json.loads(status_path.read_text(encoding="utf-8"))
                      runtime_revision = str(status.get("runtime_revision") or "")
                      live_run_id = str(status.get("deployment_workflow_run_id") or "")
                      if len(runtime_revision) == 40 and live_run_id.isdigit():
                          ancestry = gh_json(f"repos/Zennay/Ftmo/compare/{merge_sha}...{runtime_revision}")
                          live_run = gh_json(f"repos/Zennay/Ftmo/actions/runs/{live_run_id}")
                          if (
                              ancestry.get("status") in {"ahead", "identical"}
                              and (live_run.get("status"), live_run.get("conclusion"))
                              == ("completed", "success")
                          ):
                              accepted = (status, runtime_revision, live_run_id)
                              break
              except Exception as exc:
                  print(f"runtime_probe_attempt={attempt} transient={type(exc).__name__}")
              time.sleep(10)

          if accepted is None:
              raise SystemExit("no successful deployed runtime descendant of PR420 merge observed")

          status, runtime_revision, live_run_id = accepted
          research = status.get("research") or {}
          controller = status.get("research_controller") or {}
          loop = controller.get("generation_loop") or {}
          outcome = controller.get("outcome_execution") or {}
          compute = controller.get("compute") or {}
          required = {
              "research_cycle_ok": status.get("research_cycle_ok") is True,
              "generation_29": research.get("generation_number") == 29,
              "provider_foundation": research.get("next_stage") == "provider_foundation",
              "development_sealed": research.get("development_access_allowed") is False,
              "walk_forward_sealed": research.get("walk_forward_access_allowed") is False,
              "final_holdout_sealed": research.get("final_holdout_access_allowed") is False,
              "no_outcomes": loop.get("outcomes_executed") is False,
              "wf_not_accessed": loop.get("walk_forward_accessed") is False,
              "holdout_not_accessed": loop.get("final_holdout_accessed") is False,
              "live_false": status.get("live_trading_allowed") is False,
              "broker_false": status.get("broker_order_submission_allowed") is False,
              "controller_wf_false": outcome.get("walk_forward_accessed") is False,
              "controller_holdout_false": outcome.get("final_holdout_accessed") is False,
              "controller_broker_false": outcome.get("broker_order_submission_allowed") is False,
              "compute_ok": compute.get("ok") is True,
              "zero_cloud": str(status.get("autonomous_cloud_budget_usd")) == "0.00",
          }
          failed = [name for name, ok in required.items() if not ok]
          if failed:
              raise SystemExit("sealed runtime verification failed: " + ",".join(failed))
          state = subprocess.check_output(
              ["systemctl", "is-active", "ftmo-autonomous-marathon.service"], text=True
          ).strip()
          pid = subprocess.check_output(
              ["systemctl", "show", "ftmo-autonomous-marathon.service", "-p", "MainPID", "--value"],
              text=True,
          ).strip()
          if state != "active" or not pid.isdigit() or int(pid) <= 0:
              raise SystemExit(f"FTMO service unhealthy state={state!r} pid={pid!r}")

          evidence = {
              "runtime_revision": runtime_revision,
              "deployment_workflow_run_id": live_run_id,
              "generation_number": research.get("generation_number"),
              "stage": research.get("next_stage"),
              "controller_action": controller.get("action"),
              "walk_forward_accessed": loop.get("walk_forward_accessed"),
              "final_holdout_accessed": loop.get("final_holdout_accessed"),
              "service_state": state,
              "service_pid": pid,
          }
          Path("/tmp/ftmo-pr420-runtime-evidence.json").write_text(
              json.dumps(evidence, sort_keys=True), encoding="utf-8"
          )
          print("PR420_LIVE_RUNTIME_GREEN=" + json.dumps(evidence, sort_keys=True))
          PY

      - name: Finish or reconcile exact SQLite queue item
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import datetime as dt
          import importlib.util
          import json
          import os
          import sqlite3
          import sys
          from pathlib import Path

          queue_id = os.environ["QUEUE_ID"]
          merge_sha = os.environ["MERGE_SHA"]
          exact_run = os.environ["EXACT_PROOF_RUN"]
          runtime = json.loads(Path("/tmp/ftmo-pr420-runtime-evidence.json").read_text())
          live_root = Path("/home/ubuntu/zennay-cloud")
          server_path = live_root / "server.py"
          db_path = live_root / "history.db"
          if not server_path.is_file() or not db_path.is_file():
              raise SystemExit("live zCloud backend missing")

          sys.path.insert(0, str(live_root))
          spec = importlib.util.spec_from_file_location("zcloud_live_server", server_path)
          if spec is None or spec.loader is None:
              raise SystemExit("cannot load live zCloud server")
          server = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(server)
          server.DB = db_path

          evidence = (
              "Worker5 Gen29 hourly-cache directory integrity completed. PR #420 merged as "
              f"{merge_sha}; exact-head VPS proof {exact_run} SUCCESS on vps-bb300bba "
              "(exact checkout, isolated install, compile, full hourly-cache tests, adjacent sealed-boundary "
              "tests and full-suite collection). Canonical deployed runtime descendant "
              f"{runtime['runtime_revision']} via workflow {runtime['deployment_workflow_run_id']} SUCCESS; "
              "Generation 29 remains provider_foundation, research_cycle_ok=true, zero cloud budget, "
              "live/broker=false, and walk-forward/final-holdout unaccessed."
          )

          with sqlite3.connect(db_path) as c:
              c.row_factory = sqlite3.Row
              row = c.execute(
                  "SELECT queue_id,project_id,status,eligible,worker_slot,evidence FROM portfolio_queue WHERE queue_id=?",
                  (queue_id,),
              ).fetchone()
          if row is None:
              raise SystemExit("queue item missing")
          item = dict(row)
          print("QUEUE_BEFORE=" + json.dumps(item, sort_keys=True))
          if item["project_id"] != "ftmo":
              raise SystemExit("queue project mismatch")

          if item["status"] == "done":
              with sqlite3.connect(db_path) as c:
                  c.execute("BEGIN IMMEDIATE")
                  c.execute(
                      "UPDATE portfolio_queue SET evidence=?, updated_at=? "
                      "WHERE queue_id=? AND project_id='ftmo' AND status='done'",
                      (evidence, dt.datetime.now(dt.timezone.utc).isoformat(), queue_id),
                  )
                  c.commit()
              print("QUEUE_DONE_EVIDENCE_RECONCILED=1")
          elif item["status"] in {"claimed", "running", "verifying", "in_progress"} and item["worker_slot"] is not None:
              result = server.portfolio_queue_finish(int(item["worker_slot"]), queue_id, "DONE", evidence)
              print("QUEUE_FINISH_RESULT=" + json.dumps(result, sort_keys=True, default=str))
              if not result.get("updated"):
                  raise SystemExit("portfolio_queue_finish refused active assignment")
          else:
              raise SystemExit(
                  f"refusing nonstandard queue mutation status={item['status']} slot={item['worker_slot']}"
              )

          with sqlite3.connect(db_path) as c:
              c.row_factory = sqlite3.Row
              final = c.execute(
                  "SELECT queue_id,project_id,status,eligible,worker_slot,evidence,updated_at "
                  "FROM portfolio_queue WHERE queue_id=?",
                  (queue_id,),
              ).fetchone()
          final = dict(final) if final else None
          print("QUEUE_AFTER=" + json.dumps(final, sort_keys=True))
          if (
              not final
              or final["status"] != "done"
              or int(final["eligible"] or 0) != 0
              or merge_sha not in str(final["evidence"])
          ):
              raise SystemExit("queue final state/evidence is not canonical")
          print("PR420_SQLITE_QUEUE_DONE=1")
          PY
