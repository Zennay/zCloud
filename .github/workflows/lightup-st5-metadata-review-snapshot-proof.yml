name: LightUp ST5 metadata-review snapshot proof

on:
  push:
    branches:
      - "ops/lightup-st5-metadata-review-snapshot-proof-20261006"
    paths:
      - ".github/workflows/lightup-st5-metadata-review-snapshot-proof.yml"

permissions:
  contents: read

concurrency:
  group: lightup-st5-metadata-review-snapshot-proof
  cancel-in-progress: true

jobs:
  verify:
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify permanent zCloud VPS runner
        run: python3 scripts/zcloud_vps_runner_guard.py --json

      - name: Verify exact LightUp metadata-review snapshot candidate
        shell: bash
        env:
          LIGHTUP_REPO: /home/ubuntu/zennay-cloud/repos/lightup
          LIGHTUP_BRANCH: chatgpt/st5-evidence-metadata-review-snapshot-isolation-20261006
          LIGHTUP_SHA: e50d28bf03dfb01f315b91cb0a9338ea47a8e3d1
        run: |
          set -euo pipefail
          test -d "${LIGHTUP_REPO}/.git"
          git -C "${LIGHTUP_REPO}" fetch --no-tags origin             "+refs/heads/${LIGHTUP_BRANCH}:refs/remotes/origin/${LIGHTUP_BRANCH}"
          target_sha="$(git -C "${LIGHTUP_REPO}" rev-parse "refs/remotes/origin/${LIGHTUP_BRANCH}^{commit}")"
          test "${target_sha}" = "${LIGHTUP_SHA}"

          tmp_root="$(mktemp -d)"
          trap 'rm -rf "${tmp_root}"' EXIT
          snapshot="${tmp_root}/lightup"
          mkdir -p "${snapshot}"
          git -C "${LIGHTUP_REPO}" archive "${target_sha}" | tar -x -C "${snapshot}"

          cd "${snapshot}"
          export PYTHONPATH=src:tests
          python3 -m compileall -q src tests
          python3 -m unittest discover -s tests             -p 'test_future_security_evidence_metadata_contract_review_snapshot_isolation.py' -v
          python3 -m unittest discover -s tests             -p 'test_future_security_evidence_metadata_contract_review_handoff.py' -v
          python3 -m unittest discover -s tests/integration -v

          printf 'LIGHTUP_ST5_METADATA_REVIEW_SNAPSHOT_PROOF branch=%s target_sha=%s host=%s\n'             "${LIGHTUP_BRANCH}" "${target_sha}" "$(hostname)"
