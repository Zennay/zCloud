name: zCloud iteration effect gate

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/zcloud_iteration_effect_gate.py"
      - "tests/test_iteration_effect_gate.py"
      - "tests/test_iteration_effect_gate_workflow.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact pull-request head
        if: github.event_name == 'pull_request'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$HEAD_SHA"

      - name: Run iteration effect gate contract
        run: |
          set -euo pipefail
          python3 -m unittest -v \
            tests.test_iteration_effect_gate \
            tests.test_iteration_effect_gate_workflow
