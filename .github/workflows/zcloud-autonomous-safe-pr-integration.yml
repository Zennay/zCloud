name: zCloud autonomous safe PR integration

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

concurrency:
  group: zcloud-autonomous-integration-main
  cancel-in-progress: false

jobs:
  integrate:
    name: Autonomous development integration
    if: github.repository == 'Zennay/zCloud' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 4
    steps:
      - name: Refuse replay and untrusted dispatch before checkout or GitHub API
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Zennay/zCloud"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$GITHUB_ACTOR" = "Zennay"
          test "$GITHUB_TRIGGERING_ACTOR" = "Zennay"
          case "$GITHUB_EVENT_NAME" in
            schedule|workflow_dispatch) ;;
            *) exit 2 ;;
          esac
      - name: Check out immutable event commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require exact checkout and current canonical main before testing
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          main_sha="$(timeout 15 git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          test "$main_sha" = "$GITHUB_SHA"
      - name: Validate engine and safety gates
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v \
            tests.test_zcloud_autonomous_pr_integrator \
            tests.test_deployops_automerge_trust_roots_20261014_w12 \
            tests.test_deployops_automerge_check_provenance_20261014_w14 \
            tests.test_deployops_automerge_file_count_cpu_20261014_w15 \
            tests.test_deployops_automerge_import_shadow_20261014_w16 \
            tests.test_deployops_automerge_api_transport_20261014_w17 \
            tests.test_zcloud_automerge_report_20261014
      - name: Plan or merge one approved development PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ZCLOUD_AUTOMERGE_ENABLED: ${{ vars.ZCLOUD_AUTOMERGE_ENABLED || 'true' }}
        run: |
          set -euo pipefail
          if [ "$ZCLOUD_AUTOMERGE_ENABLED" = 'true' ]; then
            python3 scripts/zcloud_autonomous_pr_integrator.py --apply | tee "$RUNNER_TEMP/zcloud-automerge-report.json"
          else
            python3 scripts/zcloud_autonomous_pr_integrator.py | tee "$RUNNER_TEMP/zcloud-automerge-report.json"
          fi
      - name: Show bounded source integration backlog and refusal reasons
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/zcloud_automerge_report_20261014.py \
            "$RUNNER_TEMP/zcloud-automerge-report.json" "$GITHUB_STEP_SUMMARY"
