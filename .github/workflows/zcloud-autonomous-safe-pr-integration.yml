name: zCloud autonomous safe PR integration

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

concurrency:
  group: zcloud-autonomous-integration-main
  cancel-in-progress: false

jobs:
  integrate:
    name: Autonomous development integration
    if: github.repository == 'Zennay/zCloud' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out immutable event commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate engine and safety gates
        run: python3 -m unittest discover -s tests -p 'test_zcloud_autonomous_pr_integrator.py' -v
      - name: Plan or merge one approved development PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ZCLOUD_AUTOMERGE_ENABLED: ${{ vars.ZCLOUD_AUTOMERGE_ENABLED || 'true' }}
        run: |
          if [ "$ZCLOUD_AUTOMERGE_ENABLED" = 'true' ]; then
            python3 scripts/zcloud_autonomous_pr_integrator.py --apply
          else
            python3 scripts/zcloud_autonomous_pr_integrator.py
          fi
