name: FTMO PR417 exact-head Jetta chronology proof

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-pr417-jetta-chronology-proof.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ftmo-pr417-exact-head-jetta-chronology-proof
  cancel-in-progress: false

jobs:
  proof:
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 18
    env:
      TARGET_SHA: aaac79c66160c673e8d9259e3167338ffababe6d
      RECEIPT_PATH: runtime-evidence/ftmo-pr417-exact-head-proof.json
    steps:
      - name: Checkout zCloud receipt workspace
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main

      - name: Fetch exact FTMO PR417 head
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          src="$RUNNER_TEMP/ftmo-pr417-proof"
          rm -rf "$src"
          gh repo clone Zennay/Ftmo "$src" -- --filter=blob:none --no-checkout >/dev/null
          git -C "$src" checkout --detach "$TARGET_SHA" >/dev/null
          test "$(git -C "$src" rev-parse HEAD)" = "$TARGET_SHA"
          echo "FTMO_PR417_EXACT_SHA=$TARGET_SHA"

      - name: Install isolated test environment
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr417-proof"
          venv="$RUNNER_TEMP/ftmo-pr417-proof-venv"
          rm -rf "$venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install -q -r "$src/requirements-ci.txt"
          "$venv/bin/python" -m pip install -q -e "$src"

      - name: Compile Jetta provider boundary
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr417-proof"
          venv="$RUNNER_TEMP/ftmo-pr417-proof-venv"
          cd "$src"
          "$venv/bin/python" -m compileall -q             src/prop_trading_ai/data/market/providers/dukascopy_jetta.py
          echo "FTMO_PR417_COMPILE_GREEN=1"

      - name: Prove Jetta chronology regressions
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr417-proof"
          venv="$RUNNER_TEMP/ftmo-pr417-proof-venv"
          cd "$src"
          "$venv/bin/python" -m pytest -q tests/test_dukascopy_jetta.py
          echo "FTMO_PR417_JETTA_TESTS_GREEN=1"

      - name: Prove deploy preflight and provider compatibility
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr417-proof"
          venv="$RUNNER_TEMP/ftmo-pr417-proof-venv"
          cd "$src"
          "$venv/bin/python" -m pytest -q             tests/test_autonomous_deploy_lockstep.py             tests/test_autonomous_provider_retry.py
          echo "FTMO_PR417_COMPATIBILITY_GREEN=1"

      - name: Record exact-head proof receipt
        if: always()
        shell: bash
        env:
          PROOF_STATUS: ${{ job.status }}
          PROOF_RUN_ID: ${{ github.run_id }}
          PROOF_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$RECEIPT_PATH")"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "schema_version": 1,
              "project": "ftmo",
              "pull_request": 417,
              "target_sha": os.environ["TARGET_SHA"],
              "workflow_run_id": int(os.environ["PROOF_RUN_ID"]),
              "workflow_run_attempt": int(os.environ["PROOF_RUN_ATTEMPT"]),
              "result": os.environ["PROOF_STATUS"],
              "runner_required": "vps-bb300bba",
              "proof_scope": [
                  "compile Jetta provider",
                  "Jetta chronology regressions",
                  "autonomous deploy preflight lockstep",
                  "autonomous provider retry compatibility",
              ],
          }
          Path(os.environ["RECEIPT_PATH"]).write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          git config user.name "zCloud FTMO proof"
          git config user.email "zcloud-ftmo-proof@users.noreply.github.com"
          git pull --rebase origin main
          git add "$RECEIPT_PATH"
          if git diff --cached --quiet; then
            echo "FTMO_PR417_RECEIPT_UNCHANGED=1"
            exit 0
          fi
          git commit -m "Record FTMO PR417 exact-head proof receipt"
          git push origin HEAD:main
