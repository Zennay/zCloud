name: Cancel superseded zCloud deploy 37614704407

on:
  push:
    branches:
      - "ops/zguard-targeted-recovery-live-20261007"
    paths:
      - ".github/workflows/cancel-superseded-deploy-37614704407.yml"

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Cancel exact superseded guarded deploy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_RUN_ID: "37614704407"
          TARGET_SHA: "cb0df01298eaee048e94e1208993369d20c64703"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.request

          repo=os.environ["GITHUB_REPOSITORY"]
          token=os.environ["GH_TOKEN"]
          run_id=os.environ["TARGET_RUN_ID"]
          expected_sha=os.environ["TARGET_SHA"]
          base=f"https://api.github.com/repos/{repo}/actions/runs/{run_id}"
          headers={
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "zcloud-cancel-superseded-deploy",
          }
          def get():
              with urllib.request.urlopen(urllib.request.Request(base, headers=headers), timeout=15) as r:
                  return json.load(r)

          before=get()
          evidence={
              "id": before.get("id"),
              "name": before.get("name"),
              "event": before.get("event"),
              "head_branch": before.get("head_branch"),
              "head_sha": before.get("head_sha"),
              "status": before.get("status"),
              "run_attempt": before.get("run_attempt"),
          }
          print("BEFORE="+json.dumps(evidence, sort_keys=True))
          if (
              before.get("name") != "zCloud VPS deploy"
              or before.get("event") != "workflow_run"
              or before.get("head_branch") != "main"
              or before.get("head_sha") != expected_sha
              or int(before.get("run_attempt") or 0) != 1
          ):
              raise SystemExit("refusing to cancel: exact run identity mismatch")

          if before.get("status") == "completed":
              print("CANCEL_NOT_NEEDED=already-completed")
              raise SystemExit(0)
          req=urllib.request.Request(
              base+"/cancel",
              data=b"{}",
              headers={**headers, "Content-Type":"application/json"},
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=15) as r:
              print("CANCEL_HTTP="+str(r.status))

          deadline=time.time()+45
          after={}
          while time.time()<deadline:
              after=get()
              if after.get("status")=="completed":
                  break
              time.sleep(2)
          print("AFTER="+json.dumps({
              "status":after.get("status"),
              "conclusion":after.get("conclusion"),
              "head_sha":after.get("head_sha"),
          },sort_keys=True))
          if after.get("status")!="completed" or after.get("conclusion")!="cancelled":
              raise SystemExit("superseded deploy did not reach cancelled state")
          print("SUPERSEDED_DEPLOY_CANCELLED_GREEN=1")
          PY
