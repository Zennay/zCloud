name: zCloud FTMO research runner diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/zcloud_ftmo_research_runner_diagnostic.py"
      - "tests/test_zcloud_ftmo_research_runner_diagnostic.py"
      - "tests/test_zcloud_ftmo_research_runner_diagnostic_workflow.py"
      - "tests/test_ftmo_diagnostic_dispatch_isolation_20261014.py"
      - ".github/workflows/zcloud-ftmo-research-runner-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zcloud-ftmo-research-runner-diagnostic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  hosted-source:
    name: Offline FTMO runner diagnostic contract (GitHub-hosted)
    if: >-
      github.event_name == 'pull_request' &&
      github.actor == 'Zennay' &&
      github.triggering_actor == 'Zennay' &&
      github.event.pull_request.head.repo.full_name == github.repository
      && ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || (github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'Zennay'))
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR revision without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true
      - name: Verify immutable candidate and offline runner diagnostics
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python3 -m py_compile scripts/zcloud_ftmo_research_runner_diagnostic.py
          python3 -m unittest -v \
            tests.test_zcloud_ftmo_research_runner_diagnostic \
            tests.test_zcloud_ftmo_research_runner_diagnostic_workflow \
            tests.test_ftmo_diagnostic_dispatch_isolation_20261014
          echo ZCLOUD_FTMO_DIAGNOSTIC_HOSTED_GREEN=1

  diagnose:
    # VPS inspection must never execute on PRs or on untrusted/stale dispatch.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'Zennay/zCloud' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'Zennay' &&
      github.triggering_actor == 'Zennay'
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 5
    steps:
      - name: Check out exact diagnostic revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 1

      - name: Prove trusted permanent zCloud runner
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REPOSITORY" = "Zennay/zCloud"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_ACTOR" = "Zennay"
          test "$GITHUB_TRIGGERING_ACTOR" = "Zennay"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          # Fail closed if main moved since the manual run was dispatched.
          current_main="$(timeout 15 git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          test -n "$current_main"
          test "$current_main" = "$EXPECTED_SHA"
          test "$(id -un)" = "ubuntu"
          test "$(hostname)" = "vps-bb300bba"
          python3 scripts/zcloud_vps_runner_guard.py --json

      - name: Run focused diagnostic regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v             tests.test_zcloud_ftmo_research_runner_diagnostic             tests.test_zcloud_ftmo_research_runner_diagnostic_workflow
          python3 -m py_compile scripts/zcloud_ftmo_research_runner_diagnostic.py

      - name: Collect bounded dedicated-runner evidence
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/zcloud-ftmo-research-runner-diagnostic.json"
          python3 scripts/zcloud_ftmo_research_runner_diagnostic.py | tee "$report"
          REPORT="$report" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path(os.environ["REPORT"]).read_text(encoding="utf-8"))
          assert payload["policy"] == "zcloud-ftmo-research-runner-diagnostic-v2"
          assert payload["mutation_performed"] is False
          assert payload["runner_service_count"] >= 1
          assert payload["candidate_count"] >= 0
          assert payload["status"] in {
              "missing",
              "ambiguous",
              "offline",
              "orphaned_processes",
              "degraded",
              "busy",
              "idle",
          }
          for item in payload["candidates"]:
              assert item["status"] in {
                  "offline",
                  "orphaned_processes",
                  "degraded",
                  "busy",
                  "idle",
              }
              assert item["recovery_advice"] in {
                  "service_start_candidate",
                  "reconcile_orphans_before_service_start",
                  "inspect_listener_state",
                  "leave_inflight_work_untouched",
                  "runner_ready",
              }
              assert item["listener_count"] >= 0
              assert item["worker_count"] >= 0
          print(
              "ZCLOUD_FTMO_RESEARCH_RUNNER_DIAGNOSTIC_GREEN="
              f"status:{payload['status']}:"
              f"candidates:{payload['candidate_count']}:"
              f"services:{payload['runner_service_count']}"
          )
          PY

      - name: Upload bounded diagnostic evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zcloud-ftmo-research-runner-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/zcloud-ftmo-research-runner-diagnostic.json
          if-no-files-found: error
          retention-days: 14
