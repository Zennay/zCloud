name: Worker FTMO PR456 exact-head VPS proof

on:
  push:
    branches:
      - worker/ftmo-marathon-observer-recovery-20261002
    paths:
      - ".github/workflows/worker-ftmo-marathon-observer-recovery.yml"

permissions:
  contents: read

concurrency:
  group: worker-ftmo-pr456-proof
  cancel-in-progress: true

jobs:
  prove:
    runs-on: self-hosted
    timeout-minutes: 10
    env:
      FTMO_HEAD: c7587dec3e826585870d22a59265d33ebdbdff6d
    steps:
      - name: Cancel only proven stale FTMO runs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import subprocess

          stale = {
              37036093663: ("cfd62e3eccbabd0da50a5b83308768571248e996", 453),
              37036745305: ("a1bcba2758e59540237cd6ccdee393cea3c36745", 455),
              37036745503: ("a1bcba2758e59540237cd6ccdee393cea3c36745", 455),
          }

          def gh(path, method=None):
              cmd = ["gh", "api"]
              if method:
                  cmd += ["--method", method]
              cmd.append(path)
              raw = subprocess.check_output(cmd, text=True)
              return json.loads(raw) if raw.strip() else {}

          for run_id, (expected_head, pr_number) in stale.items():
              pr = gh(f"repos/Zennay/Ftmo/pulls/{pr_number}")
              if not pr.get("merged_at") or (pr.get("head") or {}).get("sha") != expected_head:
                  raise SystemExit(f"refusing stale cancellation for PR {pr_number}")
              run = gh(f"repos/Zennay/Ftmo/actions/runs/{run_id}")
              if run.get("head_sha") != expected_head:
                  raise SystemExit(f"run {run_id} head mismatch")
              if run.get("status") in {"queued", "in_progress", "pending", "waiting"}:
                  gh(f"repos/Zennay/Ftmo/actions/runs/{run_id}/cancel", method="POST")
                  print(f"cancelled_stale_run={run_id}")
              else:
                  print(f"stale_run_already_terminal={run_id}:{run.get('conclusion')}")
          PY

          # This temporary diagnostic belongs to this worker and is superseded by PR456.
          raw="$(gh api repos/Zennay/Ftmo/actions/runs/37035353068)"
          status="$(python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["head_sha"]=="c579b632fa1a076baa9c13510bd89efc9c92280c"; print(d["status"])' <<<"$raw")"
          if [[ "$status" == "queued" || "$status" == "in_progress" || "$status" == "pending" || "$status" == "waiting" ]]; then
            gh api --method POST repos/Zennay/Ftmo/actions/runs/37035353068/cancel
            echo "cancelled_stale_run=37035353068"
          fi

      - name: Prove exact FTMO observer head
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          gh auth status >/dev/null 2>&1

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cd "$tmp"

          remote_sha="$(gh api "repos/Zennay/Ftmo/commits/$FTMO_HEAD" --jq .sha)"
          test "$remote_sha" = "$FTMO_HEAD"
          gh api "repos/Zennay/Ftmo/tarball/$FTMO_HEAD" > ftmo.tar.gz
          mkdir src
          tar -xzf ftmo.tar.gz -C src --strip-components=1
          cd src

          PY=/opt/ftmo-autonomous/.venv/bin/python
          test -x "$PY"
          PYTHONPATH=src "$PY" -m pytest -q             tests/test_generation_marathon_observer_workflow.py             tests/test_zero_cost_workflow_boundary.py::test_persistent_generation_observer_is_strictly_read_only

          python3 - <<'PY'
          from pathlib import Path
          text = Path(".github/workflows/ftmo-generation-marathon-once.yml").read_text()
          required = (
              'runs-on: [self-hosted, ftmo-research]',
              'FTMO_AUTONOMOUS_CLOUD_BUDGET_USD: "0.00"',
              'FTMO_ALLOW_PAID_AWS: ""',
              '"activating"',
              '"reloading"',
              'persistent_service_not_stable',
              'research_cycle_not_ok',
              'walk_forward_access_without_gate',
              'final_holdout_access_without_gate',
          )
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit("missing observer invariants: " + ",".join(missing))
          forbidden = (
              'v1_autonomous_tick',
              'systemctl restart "$SERVICE"',
              'systemctl start "$SERVICE"',
              'systemctl stop "$SERVICE"',
          )
          present = [item for item in forbidden if item in text]
          if present:
              raise SystemExit("observer mutates runtime: " + ",".join(present))
          print("FTMO_PR456_EXACT_HEAD_PROOF=green")
          PY
