name: Worker FTMO marathon observer recovery

on:
  push:
    branches:
      - worker/ftmo-marathon-observer-recovery-20261002
    paths:
      - ".github/workflows/worker-ftmo-marathon-observer-recovery.yml"

permissions:
  contents: read

concurrency:
  group: worker-ftmo-marathon-observer-recovery
  cancel-in-progress: true

jobs:
  recover:
    runs-on: self-hosted
    timeout-minutes: 8
    steps:
      - name: Classify FTMO crash loop without exposing errors
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/opt/ftmo-autonomous
          SERVICE=ftmo-autonomous-marathon.service
          PY="$ROOT/.venv/bin/python"
          PV="$ROOT/src/prop_trading_ai/research/provider_validation.py"
          EXPECTED_PV_BLOB=91c2784fda0c316516e018c6e65998db9104eda5

          systemctl show "$SERVICE" -p ActiveState -p SubState -p NRestarts -p ExecMainStatus --no-pager
          if test -f "$PV" && test ! -L "$PV"; then
            actual="$(git hash-object "$PV")"
            echo "provider_validation_exists=yes"
            echo "provider_validation_matches_deployed_revision=$([[ "$actual" == "$EXPECTED_PV_BLOB" ]] && echo yes || echo no)"
            echo "provider_validation_blob=$actual"
          else
            echo "provider_validation_exists=no"
            echo "provider_validation_matches_deployed_revision=no"
          fi

          "$PY" - <<'PY'
          import json
          from pathlib import Path

          root = Path("/opt/ftmo-autonomous")
          status = json.loads((root / ".scratch/autonomy/status.json").read_text(encoding="utf-8"))
          error = status.get("error")
          text = error if isinstance(error, str) else ""
          classes = {
              "mentions_provider_validation": "provider_validation" in text,
              "mentions_missing_file": any(x in text for x in ("No such file", "FileNotFoundError")),
              "mentions_import_error": any(x in text for x in ("ImportError", "ModuleNotFoundError")),
              "mentions_provider_unavailable": any(x in text.lower() for x in ("provider unavailable", "dukascop", "fxcm")),
              "mentions_secondary_validation": "secondary-feed validation did not pass" in text,
              "mentions_command_failed": "command failed" in text,
              "mentions_integrity": any(x in text.lower() for x in ("hash", "canonical", "integrity", "validation")),
          }
          print("FTMO_ERROR_CLASSES", json.dumps(classes, sort_keys=True))
          print("FTMO_ERROR_LENGTH", len(text))
          PY
