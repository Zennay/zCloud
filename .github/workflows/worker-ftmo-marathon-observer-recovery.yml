name: Worker FTMO queue source-of-truth proof

on:
  push:
    branches:
      - worker/ftmo-marathon-observer-recovery-20261002
    paths:
      - ".github/workflows/worker-ftmo-marathon-observer-recovery.yml"

permissions:
  contents: read

concurrency:
  group: worker-ftmo-queue-proof
  cancel-in-progress: true

jobs:
  prove:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Read FTMO SQLite queue source of truth
        shell: bash
        run: |
          set -euo pipefail
          TARGET=ftmo-7ee077e0b88278da
          DB=""
          for candidate in /opt/zcloud/history.db /opt/zCloud/history.db "$HOME/zCloud/history.db"; do
            if test -r "$candidate"; then
              DB="$candidate"
              break
            fi
          done
          if test -z "$DB"; then
            DB="$(find /opt "$HOME" -maxdepth 4 -type f -name history.db -readable 2>/dev/null | head -n 1 || true)"
          fi
          test -n "$DB"
          echo "queue_db_found=yes"

          python3 - "$DB" "$TARGET" <<'PY'
          import json
          import sqlite3
          import sys

          db, target = sys.argv[1:3]
          con = sqlite3.connect(f"file:{db}?mode=ro", uri=True)
          con.row_factory = sqlite3.Row

          def safe(row):
              if row is None:
                  return None
              keys = set(row.keys())
              keep = (
                  "queue_id", "project_id", "priority", "status", "eligible",
                  "worker_slot", "created_at", "updated_at", "claimed_at",
                  "claim_expires", "source",
              )
              return {key: row[key] for key in keep if key in keys}

          row = con.execute(
              "SELECT * FROM portfolio_queue WHERE queue_id=?",
              (target,),
          ).fetchone()
          print("FTMO_QUEUE_TARGET", json.dumps(safe(row), sort_keys=True))

          rows = con.execute(
              """SELECT * FROM portfolio_queue
                 WHERE project_id='ftmo'
                 ORDER BY
                   CASE status
                     WHEN 'running' THEN 0
                     WHEN 'verifying' THEN 1
                     WHEN 'claimed' THEN 2
                     WHEN 'queued' THEN 3
                     ELSE 4
                   END,
                   priority ASC,
                   updated_at DESC
                 LIMIT 12"""
          ).fetchall()
          print("FTMO_QUEUE_HEAD", json.dumps([safe(item) for item in rows], sort_keys=True))
          PY
