name: Worker FTMO marathon observer recovery

on:
  push:
    branches:
      - worker/ftmo-marathon-observer-recovery-20261002
    paths:
      - ".github/workflows/worker-ftmo-marathon-observer-recovery.yml"

permissions:
  contents: read

concurrency:
  group: worker-ftmo-marathon-observer-recovery
  cancel-in-progress: true

jobs:
  recover:
    runs-on: self-hosted
    timeout-minutes: 8
    steps:
      - name: Diagnose FTMO marathon restart loop
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/opt/ftmo-autonomous
          SERVICE=ftmo-autonomous-marathon.service
          PY="$ROOT/.venv/bin/python"

          echo "runner=$(hostname)"
          systemctl show "$SERVICE"             -p ActiveState -p SubState -p NRestarts -p MainPID             -p ExecMainCode -p ExecMainStatus -p Result             -p ExecMainStartTimestamp -p ExecMainExitTimestamp --no-pager

          test -x "$PY"
          "$PY" - <<'PY'
          import json
          from pathlib import Path

          root = Path("/opt/ftmo-autonomous")
          status = json.loads((root / ".scratch/autonomy/status.json").read_text(encoding="utf-8"))
          research = status.get("research") or {}
          controller = status.get("research_controller") or {}
          print("FTMO_SAFE_STATUS", json.dumps({
              "ok": status.get("ok"),
              "research_cycle_ok": status.get("research_cycle_ok"),
              "error_type": type(status.get("error")).__name__ if status.get("error") is not None else None,
              "error_present": bool(status.get("error")),
              "generation_number": research.get("generation_number"),
              "generation_id": research.get("generation_id"),
              "next_stage": research.get("next_stage"),
              "controller_action": controller.get("action"),
              "runtime_revision": status.get("runtime_revision"),
              "deployment_workflow_run_id": status.get("deployment_workflow_run_id"),
              "live_trading_allowed": status.get("live_trading_allowed"),
              "broker_order_submission_allowed": status.get("broker_order_submission_allowed"),
              "autonomous_cloud_budget_usd": str(status.get("autonomous_cloud_budget_usd")),
          }, sort_keys=True))
          PY

          echo "FTMO_RECENT_SERVICE_EVENTS_BEGIN"
          journalctl -u "$SERVICE" --since "-12 min" --no-pager -o cat             | grep -E '^(FTMO |Traceback|[A-Za-z].*(Error|Exception):|.*provider.*|.*autonomous.*)'             | tail -n 80             | sed -E 's/([A-Za-z0-9_]*(TOKEN|SECRET|PASSWORD|API_KEY)[A-Za-z0-9_]*)=[^[:space:]]+/\1=<redacted>/Ig'             || true
          echo "FTMO_RECENT_SERVICE_EVENTS_END"
