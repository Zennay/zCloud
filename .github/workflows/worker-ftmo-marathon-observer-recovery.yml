name: Worker FTMO marathon observer recovery

on:
  push:
    branches:
      - worker/ftmo-marathon-observer-recovery-20261002
    paths:
      - ".github/workflows/worker-ftmo-marathon-observer-recovery.yml"

permissions:
  contents: read

concurrency:
  group: worker-ftmo-marathon-observer-recovery
  cancel-in-progress: true

jobs:
  recover:
    runs-on: self-hosted
    timeout-minutes: 8
    steps:
      - name: Diagnose FTMO observer invariants safely
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/opt/ftmo-autonomous
          SERVICE=ftmo-autonomous-marathon.service
          PY="$ROOT/.venv/bin/python"

          echo "runner=$(hostname)"
          echo "service_state=$(systemctl is-active "$SERVICE" 2>/dev/null || true)"
          test -x "$PY"

          "$PY" - <<'PY'
          from datetime import datetime, timezone
          import json
          from pathlib import Path

          root = Path("/opt/ftmo-autonomous")
          status = json.loads((root / ".scratch/autonomy/status.json").read_text(encoding="utf-8"))
          revision = (root / ".scratch/autonomy/deployed-main-sha").read_text(encoding="utf-8").strip()
          run_id = (root / ".scratch/autonomy/deployed-workflow-run-id").read_text(encoding="utf-8").strip()
          research = status.get("research") or {}
          controller = status.get("research_controller") or {}
          loop = controller.get("generation_loop") or {}
          outcome = controller.get("outcome_execution") or {}
          completed_raw = status.get("research_cycle_completed_at_utc")
          age = None
          if completed_raw:
              completed = datetime.fromisoformat(completed_raw.replace("Z", "+00:00"))
              age = (datetime.now(timezone.utc) - completed).total_seconds()

          checks = {
              "valid_deployed_revision": len(revision) == 40,
              "valid_deployment_run_id": run_id.isdigit(),
              "runtime_revision_matches_marker": status.get("runtime_revision") == revision,
              "deployment_run_matches_marker": str(status.get("deployment_workflow_run_id")) == run_id,
              "research_cycle_ok": status.get("research_cycle_ok") is True,
              "live_trading_sealed": status.get("live_trading_allowed") is False,
              "broker_submission_sealed": status.get("broker_order_submission_allowed") is False,
              "cloud_budget_zero": str(status.get("autonomous_cloud_budget_usd")) in {"0", "0.0", "0.00"},
              "compute_ok": (controller.get("compute") or {}).get("ok") is True,
              "generation_loop_enabled": loop.get("enabled") is True,
              "outcome_live_sealed": outcome.get("live_trading_allowed") is False,
              "outcome_broker_sealed": outcome.get("broker_order_submission_allowed") is False,
              "walk_forward_access_consistent": outcome.get("walk_forward_accessed") is not True
                  or research.get("walk_forward_access_allowed") is True,
              "holdout_access_consistent": outcome.get("final_holdout_accessed") is not True
                  or research.get("final_holdout_access_allowed") is True,
              "cycle_timestamp_present": bool(completed_raw),
              "cycle_timestamp_not_future": age is not None and age >= 0,
              "cycle_fresh_under_1800s": age is not None and age < 1800,
          }
          failed = sorted(name for name, ok in checks.items() if not ok)
          print("FTMO_OBSERVER_CHECKS", json.dumps(checks, sort_keys=True))
          print("FTMO_OBSERVER_FAILED", json.dumps(failed))
          print("FTMO_OBSERVER_STATE", json.dumps({
              "research_cycle_age_seconds": age,
              "generation_number": research.get("generation_number"),
              "generation_id": research.get("generation_id"),
              "next_stage": research.get("next_stage"),
              "controller_action": controller.get("action"),
              "generation_loop_action": loop.get("action"),
              "walk_forward_accessed": outcome.get("walk_forward_accessed"),
              "final_holdout_accessed": outcome.get("final_holdout_accessed"),
          }, sort_keys=True))
          raise SystemExit(1 if failed else 0)
          PY
