name: Cancel superseded FTMO PR402 CI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-pr405-hour-cache-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cancel-stale:
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 5
    steps:
      - name: Verify superseding proof and cancel only stale PR402 run
        shell: bash
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN || true
          gh auth status >/dev/null 2>&1
          python3 - <<'PY'
          import json, subprocess

          def gh_json(path):
              return json.loads(subprocess.check_output(
                  ["gh","api","-H","X-GitHub-Api-Version: 2022-11-28",path],
                  text=True,
              ))

          pr = gh_json("repos/Zennay/Ftmo/pulls/402")
          post_test = gh_json("repos/Zennay/Ftmo/actions/runs/36979732485")
          post_deploy = gh_json("repos/Zennay/Ftmo/actions/runs/36979732503")
          stale = gh_json("repos/Zennay/Ftmo/actions/runs/36979437315")

          if not pr.get("merged_at"):
              raise SystemExit("PR402 is not merged; refusing cancellation")
          for label, run in (("post_test", post_test), ("post_deploy", post_deploy)):
              if run.get("status") != "completed" or run.get("conclusion") != "success":
                  raise SystemExit(f"{label} is not green")
              if run.get("head_sha") != "3a803616d916454f958e2202a95d9e8175789f4b":
                  raise SystemExit(f"{label} head mismatch")

          if stale.get("head_sha") != "7efee17e4117d9adae1543337de8e5ea05d6fd2f":
              raise SystemExit("stale run head mismatch")
          status = stale.get("status")
          print("STALE_PR402_BEFORE", json.dumps({
              "id": stale.get("id"), "status": status, "conclusion": stale.get("conclusion")
          }, sort_keys=True))
          if status != "completed":
              subprocess.check_call([
                  "gh","api","--method","POST",
                  "repos/Zennay/Ftmo/actions/runs/36979437315/cancel"
              ])
              print("STALE_PR402_CANCEL_REQUESTED=1")
          else:
              print("STALE_PR402_ALREADY_COMPLETED=1")
          PY
