name: FTMO PR405 exact hour-cache proof

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-pr405-hour-cache-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  FTMO_AUTONOMOUS_CLOUD_BUDGET_USD: '0.00'
  FTMO_ALLOW_PAID_AWS: ''

jobs:
  proof:
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Zennay/Ftmo
          ref: 6146e1369b84da8aece11210e7ba29d57c931218
          persist-credentials: false
      - name: Verify exact FTMO head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "6146e1369b84da8aece11210e7ba29d57c931218"
          echo "FTMO_PR405_EXACT_HEAD=6146e1369b84da8aece11210e7ba29d57c931218"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install exact test environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements-ci.txt
          python -m pip install -e .
      - name: Compile changed runtime modules
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q \
            src/prop_trading_ai/data/market/dukascopy_resume_cache.py \
            src/prop_trading_ai/data/market/dukascopy_tick_resume_cache.py \
            src/prop_trading_ai/data/market/dukascopy_public_ingest.py
      - name: Prove hour resume, existing cache integrity and zero-cost boundary
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_dukascopy_tick_resume_cache.py \
            tests/test_dukascopy_jetta_m1.py \
            tests/test_autonomous_provider_retry.py \
            tests/test_zero_cost_workflow_boundary.py
