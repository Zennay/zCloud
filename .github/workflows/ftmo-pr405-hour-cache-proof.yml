name: FTMO PR405 exact hour-cache proof

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-pr405-hour-cache-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  FTMO_AUTONOMOUS_CLOUD_BUDGET_USD: '0.00'
  FTMO_ALLOW_PAID_AWS: ''
  FTMO_EXACT_SHA: '6146e1369b84da8aece11210e7ba29d57c931218'

jobs:
  proof:
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 12
    steps:
      - name: Fetch exact public FTMO source without repo-scoped token
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ftmo-src ftmo.tar.gz
          curl --fail --location --silent --show-error \
            "https://codeload.github.com/Zennay/Ftmo/tar.gz/$FTMO_EXACT_SHA" \
            -o ftmo.tar.gz
          mkdir ftmo-src
          tar -xzf ftmo.tar.gz --strip-components=1 -C ftmo-src
          test -f ftmo-src/pyproject.toml
          echo "FTMO_PR405_EXACT_SOURCE=$FTMO_EXACT_SHA"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install exact test environment
        working-directory: ftmo-src
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements-ci.txt
          python -m pip install -e .
      - name: Compile changed runtime modules
        working-directory: ftmo-src
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q \
            src/prop_trading_ai/data/market/dukascopy_resume_cache.py \
            src/prop_trading_ai/data/market/dukascopy_tick_resume_cache.py \
            src/prop_trading_ai/data/market/dukascopy_public_ingest.py
      - name: Prove hour resume, existing cache integrity and zero-cost boundary
        working-directory: ftmo-src
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_dukascopy_tick_resume_cache.py \
            tests/test_dukascopy_jetta_m1.py \
            tests/test_autonomous_provider_retry.py \
            tests/test_zero_cost_workflow_boundary.py
