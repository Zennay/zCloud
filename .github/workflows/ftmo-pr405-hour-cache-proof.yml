name: Cancel superseded FTMO PR405 CI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-pr405-hour-cache-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cancel-stale:
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 5
    steps:
      - name: Verify merge proof and cancel only stale PR405 runs
        shell: bash
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN || true
          gh auth status >/dev/null 2>&1
          python3 - <<'PY'
          import json, subprocess

          def gh_json(path):
              return json.loads(subprocess.check_output(
                  ["gh","api","-H","X-GitHub-Api-Version: 2022-11-28",path],
                  text=True,
              ))

          pr = gh_json("repos/Zennay/Ftmo/pulls/405")
          proof = gh_json("repos/Zennay/zCloud/actions/runs/36980515735")
          merge = gh_json("repos/Zennay/Ftmo/commits/a470a6654baba4a6b7b82a7be17b776dcb26415b")

          if pr.get("merged_at") is None:
              raise SystemExit("PR405 is not merged; refusing cancellation")
          if pr.get("head",{}).get("sha") != "7018683029f7ab21ed10a77d11250708416237c3":
              raise SystemExit("PR405 exact head mismatch")
          if pr.get("merge_commit_sha") != "a470a6654baba4a6b7b82a7be17b776dcb26415b":
              # Squash PR REST metadata can report the squash SHA through this field.
              raise SystemExit(f"PR405 merge SHA mismatch: {pr.get('merge_commit_sha')}")
          if proof.get("status") != "completed" or proof.get("conclusion") != "success":
              raise SystemExit("exact-head VPS proof is not green")
          if merge.get("sha") != "a470a6654baba4a6b7b82a7be17b776dcb26415b":
              raise SystemExit("merge commit missing")

          for run_id in (36980508317, 36980508313):
              run = gh_json(f"repos/Zennay/Ftmo/actions/runs/{run_id}")
              if run.get("head_sha") != "7018683029f7ab21ed10a77d11250708416237c3":
                  raise SystemExit(f"stale run {run_id} head mismatch")
              print("STALE_PR405_BEFORE", json.dumps({
                  "id": run_id,
                  "status": run.get("status"),
                  "conclusion": run.get("conclusion"),
              }, sort_keys=True))
              if run.get("status") != "completed":
                  subprocess.check_call([
                      "gh","api","--method","POST",
                      f"repos/Zennay/Ftmo/actions/runs/{run_id}/cancel"
                  ])
                  print(f"STALE_PR405_CANCEL_REQUESTED={run_id}")
              else:
                  print(f"STALE_PR405_ALREADY_COMPLETED={run_id}")
          PY
