name: zCloud un-PR branch overlap audit

on:
  pull_request:
    paths:
      - "scripts/zcloud_unpr_branch_overlap_audit.py"
      - "tests/test_zcloud_unpr_branch_overlap_audit.py"
      - ".github/workflows/zcloud-unpr-branch-overlap-audit.yml"

permissions:
  contents: read

concurrency:
  group: zcloud-unpr-branch-overlap-audit-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prove:
    if: github.actor == 'Zennay' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 6
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Prove exact permanent VPS identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(hostname)" = "vps-bb300bba"
          test "$(id -un)" = "ubuntu"
          python3 scripts/zcloud_vps_runner_guard.py --json

      - name: Run focused overlap regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest tests.test_zcloud_unpr_branch_overlap_audit -v
