name: zGuard PR26 VPS proof

on:
  pull_request:
    paths:
      - .github/workflows/zguard-pr26-vps-proof.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify zGuard PR26 exact head
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 15
    steps:
      - name: Check out zCloud runner guard
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Verify permanent zCloud VPS runner
        run: python3 scripts/zcloud_vps_runner_guard.py --json

      - name: Check out zGuard exact head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: Zennay/zGuard
          ref: 1280d9a13b237bfdf8fb8bc49f0acf30ceb8249e
          path: zguard-source
          persist-credentials: false

      - name: Verify exact ref and dedicated workflow contracts
        shell: bash
        run: |
          set -euo pipefail
          cd zguard-source
          test "$(git rev-parse HEAD)" = "1280d9a13b237bfdf8fb8bc49f0acf30ceb8249e"
          node tests/dedicated-workflow-checkout-integrity.test.mjs
          node tests/smoke.test.js
          bash zbrowse/scripts/validate.sh
          node tests/zbrowse.repository-hygiene.test.js
          node tests/zbrowse.install-preflight.test.mjs
          cd zbrowse/gateway
          npm ci --omit=dev --ignore-scripts --no-audit
          npm audit --omit=dev --audit-level=high
