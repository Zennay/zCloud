name: Refresh verified zCloud LKG

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/zcloud-lkg-refresh.yml
      - tests/test_zcloud_lkg_refresh_workflow.py
  push:
    branches: [main]
    paths:
      - .github/workflows/zcloud-lkg-refresh.yml
      - tests/test_zcloud_lkg_refresh_workflow.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zcloud-lkg-refresh-${{ github.event_name == 'pull_request' && github.ref || 'live' }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPECTED_ZCLOUD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact zCloud candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.EXPECTED_ZCLOUD_SHA }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact zCloud candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_ZCLOUD_SHA"

      - name: Validate LKG refresh trust contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v tests.test_zcloud_lkg_refresh_workflow

  refresh:
    if: github.event_name != 'pull_request' && github.repository == 'Zennay/zCloud' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 8
    env:
      EXPECTED_ZCLOUD_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact recovery tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.EXPECTED_ZCLOUD_SHA }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify permanent VPS runner and exact revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_ZCLOUD_SHA"
          test "$(id -un)" = "ubuntu"
          python3 scripts/zcloud_vps_runner_guard.py --json

      - name: Verify live production and refresh LKG
        shell: bash
        run: |
          set -euo pipefail
          LIVE=/home/ubuntu/zennay-cloud
          STATE="$HOME/.local/state/zcloud/recovery"
          CANARY="$RUNNER_TEMP/zcloud-live-canary.json"
          PRECHANGE="$RUNNER_TEMP/zcloud-prechange-after-lkg.json"

          python3 "$GITHUB_WORKSPACE/scripts/zcloud_postdeploy_canary.py" \
            --root "$LIVE" \
            --db "$LIVE/history.db" \
            --base-url http://127.0.0.1:8765 \
            --json > "$CANARY"

          python3 - "$CANARY" <<'PY'
          import json, sys
          data=json.load(open(sys.argv[1]))
          failed=[x for x in data.get("checks",[]) if not x.get("ok")]
          print("LIVE_CANARY",json.dumps({
              "ok":data.get("ok"),
              "failed":failed,
              "transport_errors":data.get("transport_errors") or [],
          },sort_keys=True))
          if not data.get("ok"):
              raise SystemExit("live canary is not green; refusing LKG refresh")
          PY
          echo "ZCLOUD_LKG_REFRESH_GREEN=1"

          live_head="$(git -C "$LIVE" rev-parse HEAD 2>/dev/null || echo working-tree)"
          evidence="POSTDEPLOY_GREEN verified before LKG refresh; live_head=$live_head; queue/API/browser/runtime canary green"
          python3 "$GITHUB_WORKSPACE/scripts/zcloud_recovery.py" \
            --root "$LIVE" \
            --state-dir "$STATE" \
            capture --evidence "$evidence" > "$RUNNER_TEMP/zcloud-lkg-capture.json"

          python3 "$GITHUB_WORKSPACE/scripts/zcloud_prechange_guard.py" \
            --root "$LIVE" \
            --state "$STATE" \
            --json > "$PRECHANGE"

          python3 - "$RUNNER_TEMP/zcloud-lkg-capture.json" "$PRECHANGE" <<'PY'
          import json, sys
          capture=json.load(open(sys.argv[1]))
          guard=json.load(open(sys.argv[2]))
          print("LKG_REFRESHED",json.dumps({
              "snapshot_id":capture.get("snapshot_id"),
              "created_at":capture.get("created_at"),
              "evidence":capture.get("evidence"),
              "git":capture.get("git"),
          },sort_keys=True))
          failed=[x for x in guard.get("checks",[]) if not x.get("ok")]
          print("PRECHANGE_AFTER_LKG",json.dumps({
              "ok":guard.get("ok"),
              "failed":failed,
          },sort_keys=True))
          if not guard.get("ok"):
              raise SystemExit("new LKG did not produce a green pre-change guard")
          PY
