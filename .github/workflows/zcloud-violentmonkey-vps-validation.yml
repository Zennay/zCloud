name: zCloud Violentmonkey VPS validation

on:
  pull_request:
    paths:
      - "firefox-extension/background.js"
      - "public/zcloud-worker.user.js"
      - "tests/test_violentmonkey_runner.py"
      - ".github/workflows/zcloud-violentmonkey-vps-validation.yml"

permissions:
  contents: read

concurrency:
  group: zcloud-violentmonkey-vps-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Guard permanent zCloud runner
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          python3 scripts/zcloud_vps_runner_guard.py --json
      - name: Regress Violentmonkey dispatch ownership
        run: |
          set -euo pipefail
          python3 -m unittest tests.test_violentmonkey_runner
          node --check public/zcloud-worker.user.js
          node --check firefox-extension/background.js
