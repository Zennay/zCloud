name: zCloud Violentmonkey VPS validation

on:
  pull_request:
    paths:
      - "firefox-extension/background.js"
      - "public/zcloud-worker.user.js"
      - "tests/test_violentmonkey_runner.py"
      - ".github/workflows/zcloud-violentmonkey-vps-validation.yml"

permissions:
  contents: read

concurrency:
  group: zcloud-violentmonkey-vps-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor == 'Zennay' && github.triggering_actor == 'Zennay' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 6
    steps:
      - name: Checkout exact same-repo PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact candidate revision
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Guard permanent zCloud runner
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          python3 scripts/zcloud_vps_runner_guard.py --json
      - name: Regress Violentmonkey dispatch ownership
        run: |
          set -euo pipefail
          python3 -m unittest tests.test_violentmonkey_runner
          node --check public/zcloud-worker.user.js
          node --check firefox-extension/background.js
