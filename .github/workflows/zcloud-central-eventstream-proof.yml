name: zCloud central eventstream proof

on:
  pull_request:
    paths:
      - "scripts/zcloud_central_eventstream.py"
      - "tests/test_central_eventstream.py"
      - "tests/test_central_eventstream_workflow.py"
      - ".github/workflows/zcloud-central-eventstream-proof.yml"
  push:
    branches: [main]
    paths:
      - "scripts/zcloud_central_eventstream.py"
      - "tests/test_central_eventstream.py"
      - "tests/test_central_eventstream_workflow.py"
      - ".github/workflows/zcloud-central-eventstream-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zcloud-central-eventstream-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 1
      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
      - name: Run central eventstream contract
        run: python3 -m unittest -v tests.test_central_eventstream tests.test_central_eventstream_workflow

  permanent-vps-proof:
    if: >-
      github.repository == 'Zennay/zCloud' &&
      github.actor == 'Zennay' &&
      github.triggering_actor == 'Zennay' &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.repo.owner.login == 'Zennay'))
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 1
      - name: Verify exact checkout and permanent runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          test "$(id -un)" = "ubuntu"
          python3 scripts/zcloud_vps_runner_guard.py --json
      - name: Prove read-only eventstream projection
        run: python3 -m unittest -v tests.test_central_eventstream tests.test_central_eventstream_workflow
