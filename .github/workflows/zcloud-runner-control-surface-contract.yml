name: zCloud runner control surface contract

on:
  pull_request:
    paths:
      - public/app.js
      - tests/test_runner_control_surface_contract.py
      - .github/workflows/zcloud-runner-control-surface-contract.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zcloud-runner-control-surface-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Lock project and worker control surfaces
        run: python3 -m unittest -v tests.test_runner_control_surface_contract

  permanent-vps-proof:
    if: ${{ github.event_name != 'pull_request' || (github.actor == 'Zennay' && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 8
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact head and permanent runner
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
          test "$(hostname)" = "vps-bb300bba"
          test "$(id -un)" = "ubuntu"
          python3 scripts/zcloud_vps_runner_guard.py --json

      - name: Prove existing control UI contract read-only
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v tests.test_runner_control_surface_contract
          echo ZCLOUD_RUNNER_CONTROL_SURFACE_VPS_GREEN=1
