name: LightUp Target input expected-RED VPS proof

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/lightup-scope-target-input-expected-red-vps-proof.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lightup-scope-target-input-expected-red-vps-proof
  cancel-in-progress: true

env:
  LIGHTUP_REPO: /home/ubuntu/zennay-cloud/repos/lightup
  LIGHTUP_BRANCH: chatgpt/scope-authorization-exact-target-object-red-20261007
  LIGHTUP_EXPECTED_SHA: 534a0ab42461a7f778664cb4293668d24eab15be

jobs:
  prove-red:
    name: Exact #494 + #496 expected-RED contract on vps-bb300bba
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Guard permanent VPS runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          python3 scripts/zcloud_vps_runner_guard.py --json

      - name: Snapshot exact LightUp candidate
        shell: bash
        run: |
          set -euo pipefail
          test -d "${LIGHTUP_REPO}/.git"
          git -C "${LIGHTUP_REPO}" fetch --prune origin             "+refs/heads/${LIGHTUP_BRANCH}:refs/remotes/origin/lightup-scope-target-input-red"
          ACTUAL_SHA="$(git -C "${LIGHTUP_REPO}" rev-parse refs/remotes/origin/lightup-scope-target-input-red^{commit})"
          test "${ACTUAL_SHA}" = "${LIGHTUP_EXPECTED_SHA}"
          SNAPSHOT="${RUNNER_TEMP}/lightup-scope-target-input-${GITHUB_RUN_ID}"
          rm -rf "${SNAPSHOT}"
          mkdir -p "${SNAPSHOT}"
          git -C "${LIGHTUP_REPO}" archive "${ACTUAL_SHA}" | tar -x -C "${SNAPSHOT}"
          echo "LIGHTUP_SNAPSHOT=${SNAPSHOT}" >> "${GITHUB_ENV}"
          echo "LIGHTUP_ACTUAL_SHA=${ACTUAL_SHA}" >> "${GITHUB_ENV}"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python 3.11 scope smoke + exact expected RED
        shell: bash
        run: |
          set -euo pipefail
          cd "${LIGHTUP_SNAPSHOT}"
          PYTHONPATH=src:tests python -m compileall -q src tests
          PYTHONPATH=src:tests python -m unittest -v test_scope
          LOG="${RUNNER_TEMP}/lightup-scope-target-input-red-py311.log"
          set +e
          PYTHONPATH=src:tests python -m unittest -v             test_scope_target_value_type_contract             test_scope_exact_target_object_contract >"${LOG}" 2>&1
          RC=$?
          set -e
          cat "${LOG}"
          test "${RC}" -ne 0
          grep -Fq "Ran 8 tests" "${LOG}"
          grep -Fq "FAILED (failures=4, errors=11)" "${LOG}"
          grep -Fq "test_string_subclass_cannot_spoof_a_different_scope_identity" "${LOG}"
          grep -Fq "test_target_subclass_cannot_override_scope_identity" "${LOG}"
          grep -Fq "test_target_subclass_cannot_inject_authorization" "${LOG}"
          grep -Fq "AttributeError: 'NoneType' object has no attribute 'strip'" "${LOG}"
          grep -Fq "TypeError: a bytes-like object is required, not 'str'" "${LOG}"
          PYTHONPATH=src python scripts/check_safety_canaries.py

      - name: Setup Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Python 3.14 scope smoke + exact expected RED
        shell: bash
        run: |
          set -euo pipefail
          cd "${LIGHTUP_SNAPSHOT}"
          PYTHONPATH=src:tests python -m compileall -q src tests
          PYTHONPATH=src:tests python -m unittest -v test_scope
          LOG="${RUNNER_TEMP}/lightup-scope-target-input-red-py314.log"
          set +e
          PYTHONPATH=src:tests python -m unittest -v             test_scope_target_value_type_contract             test_scope_exact_target_object_contract >"${LOG}" 2>&1
          RC=$?
          set -e
          cat "${LOG}"
          test "${RC}" -ne 0
          grep -Fq "Ran 8 tests" "${LOG}"
          grep -Fq "FAILED (failures=4, errors=11)" "${LOG}"
          grep -Fq "test_string_subclass_cannot_spoof_a_different_scope_identity" "${LOG}"
          grep -Fq "test_target_subclass_cannot_override_scope_identity" "${LOG}"
          grep -Fq "test_target_subclass_cannot_inject_authorization" "${LOG}"
          grep -Fq "AttributeError: 'NoneType' object has no attribute 'strip'" "${LOG}"
          grep -Fq "TypeError: a bytes-like object is required, not 'str'" "${LOG}"
          PYTHONPATH=src python scripts/check_safety_canaries.py

      - name: Write exact-head expected-RED receipt
        shell: bash
        run: |
          set -euo pipefail
          RECEIPT_DIR="${RUNNER_TEMP}/lightup-scope-target-input-expected-red-receipt"
          mkdir -p "${RECEIPT_DIR}"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "project": "LightUp",
              "issues": [494, 496],
              "branch": os.environ["LIGHTUP_BRANCH"],
              "target_sha": os.environ["LIGHTUP_ACTUAL_SHA"],
              "expected_sha": os.environ["LIGHTUP_EXPECTED_SHA"],
              "host": os.uname().nodename,
              "github_run_id": os.environ["GITHUB_RUN_ID"],
              "python": ["3.11", "3.14"],
              "scope_smoke": "green",
              "acceptance_contract": "expected_red",
              "expected_test_methods_per_python": 8,
              "expected_failures_per_python": 4,
              "expected_errors_per_python": 11,
              "production_source_changes": 0,
              "safety_canaries": "green",
          }
          path = Path(os.environ["RUNNER_TEMP"]) / "lightup-scope-target-input-expected-red-receipt" / "receipt.json"
          path.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n")
          print(json.dumps(payload, sort_keys=True))
          PY

      - name: Upload exact-head expected-RED receipt
        uses: actions/upload-artifact@v4
        with:
          name: lightup-scope-target-input-expected-red-vps-proof
          path: ${{ runner.temp }}/lightup-scope-target-input-expected-red-receipt/receipt.json
          if-no-files-found: error

      - name: Cleanup snapshot
        if: always()
        shell: bash
        run: rm -rf "${LIGHTUP_SNAPSHOT:-}"
