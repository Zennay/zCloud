name: zCloud FTMO PR408 historical proof retirement (hosted)

# Removal of obsolete on-demand VPS proof; never exercises a permanent runner.
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-pr408-provider-boundary-proof.yml"
      - ".github/workflows/zcloud-ftmo-pr408-retirement-hosted-20261014-w2.yml"
      - "tests/test_zcloud_ftmo_pr408_retirement_20261014_w2.py"
      - "docs/deployops-ftmo-pr408-proof-retirement-20261014-w2.md"

permissions:
  contents: read

concurrency:
  group: ftmo-pr408-retirement-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.event_name == 'pull_request' &&
      github.repository == 'Zennay/zCloud' &&
      github.event.pull_request.head.repo.full_name == github.repository
      && ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || (github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'Zennay'))
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 6
    steps:
      - name: Checkout exact immutable PR source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 1
      - name: Verify exact head and retired source contract
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Zennay/zCloud"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 -m unittest -v tests.test_zcloud_ftmo_pr408_retirement_20261014_w2
          echo "FTMO_PR408_RETIRED_HOSTED_GREEN=1"
