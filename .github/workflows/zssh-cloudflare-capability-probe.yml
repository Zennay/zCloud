name: zSSH Cloudflare capability probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/zssh-cloudflare-capability-probe.yml"
      - ".github/zssh-cloudflare-capability-trigger"
  pull_request:
    paths:
      - ".github/workflows/zssh-cloudflare-capability-probe.yml"
      - "tests/test_zssh_cloudflare_capability_probe.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zssh-cloudflare-capability-probe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Probe persistent VPS Cloudflare auth for zSSH
    if: >-
      github.event_name != 'pull_request' ||
      (github.actor == 'Zennay' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 5
    env:
      ZCLOUD_EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact zCloud control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.ZCLOUD_EXPECTED_SHA }}
          persist-credentials: false
          clean: true
          fetch-depth: 1

      - name: Enforce permanent VPS runner identity and exact revision
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$ZCLOUD_EXPECTED_SHA"
          python3 scripts/zcloud_vps_runner_guard.py --json \
            | tee "$RUNNER_TEMP/zssh-cloudflare-runner-guard.json"
          test "$(hostname)" = "vps-bb300bba"
          test "$(id -un)" = "ubuntu"

      - name: Probe persistent Cloudflare authorization without mutation
        id: capability
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/zssh_cloudflare_capability_probe.py \
            --output "$RUNNER_TEMP/zssh-cloudflare-capability.json"

      - name: Upload non-secret capability evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zssh-cloudflare-capability-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/zssh-cloudflare-capability.json
            ${{ runner.temp }}/zssh-cloudflare-runner-guard.json
          if-no-files-found: error
          retention-days: 30
