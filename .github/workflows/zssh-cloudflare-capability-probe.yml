name: zSSH Cloudflare capability probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/zssh-cloudflare-capability-probe.yml"
      - ".github/zssh-cloudflare-capability-trigger"
      - "scripts/zssh_cloudflare_capability_probe.py"
      - "tests/test_zssh_cloudflare_capability_probe_trust.py"
  pull_request:
    paths:
      - ".github/workflows/zssh-cloudflare-capability-probe.yml"
      - "scripts/zssh_cloudflare_capability_probe.py"
      - "tests/test_zssh_cloudflare_capability_probe_trust.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zssh-cloudflare-capability-probe-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'live' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate capability-probe trust contract
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 1

      - name: Run focused trust regression
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m unittest tests/test_zssh_cloudflare_capability_probe_trust.py

  prove:
    name: Prove trust contract on permanent VPS
    if: >-
      github.event_name == 'pull_request' &&
      github.actor == 'Zennay' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 5
    env:
      ZCLOUD_EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.ZCLOUD_EXPECTED_SHA }}
          persist-credentials: false
          clean: true
          fetch-depth: 1

      - name: Enforce exact head and permanent runner
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "Zennay/zCloud"
          test "$(git rev-parse HEAD)" = "$ZCLOUD_EXPECTED_SHA"
          python3 scripts/zcloud_vps_runner_guard.py --json >/dev/null
          test "$(hostname)" = "vps-bb300bba"
          test "$(id -un)" = "ubuntu"
          test "$(id -u)" -ne 0

      - name: Run focused capability-probe regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m unittest \
            tests/test_zssh_cloudflare_capability_probe.py \
            tests/test_zssh_cloudflare_capability_probe_trust.py

  probe:
    name: Probe persistent VPS Cloudflare auth for zSSH
    if: >-
      github.event_name != 'pull_request' &&
      github.repository == 'Zennay/zCloud' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_dispatch' || github.actor == 'Zennay')
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 5
    env:
      ZCLOUD_EXPECTED_SHA: ${{ github.sha }}
    steps:
      - name: Check out exact zCloud control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.ZCLOUD_EXPECTED_SHA }}
          persist-credentials: false
          clean: true
          fetch-depth: 1

      - name: Enforce permanent VPS runner identity and exact revision
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "Zennay/zCloud"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_REF_NAME" = "main"
          test "$(git rev-parse HEAD)" = "$ZCLOUD_EXPECTED_SHA"
          python3 scripts/zcloud_vps_runner_guard.py --json \
            | tee "$RUNNER_TEMP/zssh-cloudflare-runner-guard.json"
          test "$(hostname)" = "vps-bb300bba"
          test "$(id -un)" = "ubuntu"
          test "$(id -u)" -ne 0

      - name: Probe persistent Cloudflare authorization without mutation
        id: capability
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/zssh_cloudflare_capability_probe.py \
            --output "$RUNNER_TEMP/zssh-cloudflare-capability.json"

      - name: Upload non-secret capability evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zssh-cloudflare-capability-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/zssh-cloudflare-capability.json
            ${{ runner.temp }}/zssh-cloudflare-runner-guard.json
          if-no-files-found: error
          retention-days: 30
