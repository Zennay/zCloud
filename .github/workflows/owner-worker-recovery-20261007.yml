# trigger owner recovery sequence 2026-10-07T02:20Z
name: Owner requested zCloud worker recovery 2026-10-07

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/owner-worker-recovery-20261007.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: owner-worker-recovery-20261007
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Diagnose, restart, push, and re-diagnose workers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          repo="$GITHUB_REPOSITORY"

          run_one() {
            local workflow="$1"
            local label="$2"
            local allow_failure="$3"
            local since run_id
            since="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            gh workflow run "$workflow" --repo "$repo" --ref main
            run_id=""
            for _ in $(seq 1 30); do
              sleep 2
              run_id="$(
                gh run list --repo "$repo" --workflow "$workflow" --event workflow_dispatch --limit 10 \
                  --json databaseId,createdAt,status \
                  --jq 'map(select(.createdAt >= "'"$since"'")) | sort_by(.createdAt) | reverse | .[0].databaseId // empty'
              )"
              [[ -n "$run_id" ]] && break
            done
            if [[ -z "$run_id" ]]; then
              echo "${label}_RUN_ID=missing"
              [[ "$allow_failure" == "1" ]] && return 0
              return 1
            fi
            echo "${label}_RUN_ID=${run_id}"
            if gh run watch "$run_id" --repo "$repo" --exit-status; then
              echo "${label}_RESULT=success"
              return 0
            fi
            echo "${label}_RESULT=failure"
            [[ "$allow_failure" == "1" ]]
          }

          run_one zcloud-live-debug.yml PRE_DIAGNOSTIC 1
          run_one zcloud-restart-workers.yml RESTART 1
          run_one push-all-workers-now.yml PUSH_ALL 0
          run_one zcloud-live-debug.yml POST_DIAGNOSTIC 1
          echo "OWNER_WORKER_RECOVERY_SEQUENCE_COMPLETE=1"
