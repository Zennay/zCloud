name: LightUp evidence-remediation atomicity pack VPS proof

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/lightup-evidence-remediation-atomicity-pack-vps-proof.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lightup-evidence-remediation-atomicity-pack-vps-proof
  cancel-in-progress: true

env:
  LIGHTUP_REPO: /home/ubuntu/zennay-cloud/repos/lightup
  BUILDER_BRANCH: chatgpt/st5-remediation-plan-builder-input-atomicity-20261006
  BUILDER_SHA: ee891ab7e4779f540afc4bb7d7423dc28d805e29
  VALIDATOR_BRANCH: chatgpt/st5-remediation-retest-handoff-live-validation-atomicity-20261006
  VALIDATOR_SHA: 9471d206b0a4c945cec3dfe5b4c71f8758414044
  PARSER_BRANCH: chatgpt/st5-remediation-retest-parser-input-purity-20261006
  PARSER_SHA: 193696208623da92c9d93c115cfde9fc6992e5d9

jobs:
  prove:
    name: Exact-head atomicity pack on vps-bb300bba
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == github.repository_owner)
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 60

    steps:
      - name: Checkout exact zCloud proof harness
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          clean: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Guard permanent VPS runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          python3 scripts/zcloud_vps_runner_guard.py --json

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prove all exact heads on Python 3.11
        shell: bash
        run: |
          set -euo pipefail

          prove_head() {
            label="$1"
            branch="$2"
            expected="$3"
            module="$4"
            remote_ref="refs/remotes/origin/lightup-${label}-proof-${GITHUB_RUN_ID}"
            snapshot="${RUNNER_TEMP}/lightup-${label}-py311-${GITHUB_RUN_ID}"

            git -C "${LIGHTUP_REPO}" fetch --prune origin               "+refs/heads/${branch}:${remote_ref}"
            actual="$(git -C "${LIGHTUP_REPO}" rev-parse "${remote_ref}^{commit}")"
            test "${actual}" = "${expected}"

            rm -rf "${snapshot}"
            mkdir -p "${snapshot}"
            git -C "${LIGHTUP_REPO}" archive "${actual}" | tar -x -C "${snapshot}"

            (
              cd "${snapshot}"
              export PYTHONPATH=src:tests
              python -m compileall -q src tests
              python -m unittest -v "${module}"
              python -m unittest discover -s tests -v
              python -m unittest discover -s tests/integration -v
              PYTHONPATH=src python scripts/check_safety_canaries.py
            )
            rm -rf "${snapshot}"
          }

          prove_head builder "${BUILDER_BRANCH}" "${BUILDER_SHA}"             test_future_security_remediation_retest_plan_builder_input_atomicity
          prove_head validator "${VALIDATOR_BRANCH}" "${VALIDATOR_SHA}"             test_future_security_remediation_retest_plan_live_validation_atomicity
          prove_head parser "${PARSER_BRANCH}" "${PARSER_SHA}"             test_future_security_remediation_retest_plan_parser_input_purity

      - name: Setup Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Prove all exact heads on Python 3.14
        shell: bash
        run: |
          set -euo pipefail

          prove_head() {
            label="$1"
            branch="$2"
            expected="$3"
            module="$4"
            remote_ref="refs/remotes/origin/lightup-${label}-proof-${GITHUB_RUN_ID}"
            snapshot="${RUNNER_TEMP}/lightup-${label}-py314-${GITHUB_RUN_ID}"

            git -C "${LIGHTUP_REPO}" fetch --prune origin               "+refs/heads/${branch}:${remote_ref}"
            actual="$(git -C "${LIGHTUP_REPO}" rev-parse "${remote_ref}^{commit}")"
            test "${actual}" = "${expected}"

            rm -rf "${snapshot}"
            mkdir -p "${snapshot}"
            git -C "${LIGHTUP_REPO}" archive "${actual}" | tar -x -C "${snapshot}"

            (
              cd "${snapshot}"
              export PYTHONPATH=src:tests
              python -m compileall -q src tests
              python -m unittest -v "${module}"
              python -m unittest discover -s tests -v
              python -m unittest discover -s tests/integration -v
              PYTHONPATH=src python scripts/check_safety_canaries.py
            )
            rm -rf "${snapshot}"
          }

          prove_head builder "${BUILDER_BRANCH}" "${BUILDER_SHA}"             test_future_security_remediation_retest_plan_builder_input_atomicity
          prove_head validator "${VALIDATOR_BRANCH}" "${VALIDATOR_SHA}"             test_future_security_remediation_retest_plan_live_validation_atomicity
          prove_head parser "${PARSER_BRANCH}" "${PARSER_SHA}"             test_future_security_remediation_retest_plan_parser_input_purity

      - name: Write exact-head receipt
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/lightup-evidence-remediation-atomicity-pack-receipt"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "schema_version": 1,
              "project": "LightUp",
              "result": "success",
              "host": os.uname().nodename,
              "github_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "python": ["3.11", "3.14"],
              "heads": {
                  "builder_input_atomicity": {
                      "branch": os.environ["BUILDER_BRANCH"],
                      "sha": os.environ["BUILDER_SHA"],
                      "issue": 350,
                      "pr": 351,
                  },
                  "handoff_live_validation_atomicity": {
                      "branch": os.environ["VALIDATOR_BRANCH"],
                      "sha": os.environ["VALIDATOR_SHA"],
                      "issue": 352,
                      "pr": 353,
                  },
                  "strict_parser_input_purity": {
                      "branch": os.environ["PARSER_BRANCH"],
                      "sha": os.environ["PARSER_SHA"],
                      "issue": 354,
                      "pr": None,
                  },
              },
              "proof": [
                  "exact-sha-binding",
                  "dedicated-regressions-py311-py314",
                  "compile-py311-py314",
                  "full-unit-suite-py311-py314",
                  "real-producer-integration-py311-py314",
                  "safety-canaries-py311-py314",
              ],
          }
          path = Path(os.environ["RUNNER_TEMP"]) / "lightup-evidence-remediation-atomicity-pack-receipt" / "receipt.json"
          path.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n")
          print(json.dumps(payload, sort_keys=True))
          PY

      - name: Upload exact-head receipt
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lightup-evidence-remediation-atomicity-pack-vps-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/lightup-evidence-remediation-atomicity-pack-receipt/receipt.json
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup residual snapshots
        if: always()
        shell: bash
        run: rm -rf "${RUNNER_TEMP}"/lightup-{builder,validator,parser}-py{311,314}-${GITHUB_RUN_ID}
