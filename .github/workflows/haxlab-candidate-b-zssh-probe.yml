name: Queue zSSH HaxLab Candidate-B runtime probe
# trigger: candidate-b-runtime-probe-priority-v4

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/haxlab-candidate-b-zssh-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enqueue:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Prioritize delegated probe and verify live allocation
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import urllib.request

          base = "http://127.0.0.1:8765"
          queue_id = "zssh-haxlab-candidate-b-runtime-probe-20261001"
          payload = {
              "action": "enqueue",
              "queue_id": queue_id,
              "project_id": "zssh",
              "title": "Inspect active HaxLab Candidate-B training progress",
              "priority": "P0",
              "completion_criteria": (
                  "Read-only VPS evidence is recorded for Candidate-B workflow_run_id 36259774109 "
                  "job 110291358917: verify whether the training process is alive, elapsed/runtime "
                  "progress and recent non-secret /tmp/haxlab-candidate-b.log progress; identify a "
                  "concrete process/runtime blocker if stalled. Do not kill, restart, deploy or "
                  "modify HaxLab runtime."
              ),
              "source_url": "https://github.com/Zennay/Haxlab/issues/15",
              "parent_queue_id": "haxlab-candidate-b-champion-evidence-gate",
          }
          req = urllib.request.Request(
              base + "/api/portfolio-queue",
              data=json.dumps(payload).encode(),
              method="POST",
              headers={"Content-Type": "application/json"},
          )
          with urllib.request.urlopen(req, timeout=10) as response:
              result = json.load(response)
          print("PROBE_PRIORITY_WRITE", json.dumps(result, sort_keys=True))

          # Trigger a normal local runner-target read and record current SQLite allocation.
          with urllib.request.urlopen(base + "/api/runner-targets", timeout=10) as response:
              targets = json.load(response)
          with urllib.request.urlopen(base + "/api/portfolio-queue?all=1", timeout=10) as response:
              queue = json.load(response)

          item = next((x for x in queue.get("items", []) if x.get("queue_id") == queue_id), None)
          if not item:
              raise RuntimeError("delegated probe missing from live SQLite")
          print("PROBE_LIVE_ITEM", json.dumps(item, sort_keys=True))
          print("GLOBAL_ALLOCATION", json.dumps(queue.get("allocation"), sort_keys=True))
          print("DYNAMIC_WORKERS", json.dumps(targets.get("dynamic_workers"), sort_keys=True))
          PY
