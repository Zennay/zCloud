name: Queue zSSH HaxLab Candidate-B runtime probe
# trigger: candidate-b-parallel-readonly-evidence-v5

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/haxlab-candidate-b-zssh-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Capture parallel read-only Candidate-B evidence
        shell: bash
        run: |
          set -euo pipefail
          echo "EVIDENCE_HOST=$(hostname)"
          echo "EVIDENCE_TIME=$(date -u +%FT%TZ)"

          echo "=== Candidate-B process ==="
          pgrep -af 'haxlab.learning.elite_pipeline.*elite-player-candidate-b' || true
          pids="$(pgrep -f 'haxlab.learning.elite_pipeline.*elite-player-candidate-b' | tr '\n' ' ' || true)"
          if [ -n "$pids" ]; then
            ps -o pid,ppid,etime,%cpu,%mem,stat,cmd -p $pids || true
          else
            echo "CANDIDATE_B_PROCESS_NOT_FOUND"
          fi

          echo "=== Candidate-B log ==="
          if [ -f /tmp/haxlab-candidate-b.log ]; then
            stat --printf='LOG_SIZE=%s LOG_MTIME=%y\n' /tmp/haxlab-candidate-b.log
            tail -n 100 /tmp/haxlab-candidate-b.log
          else
            echo "CANDIDATE_B_LOG_NOT_FOUND"
          fi

          echo "=== Champion registry ==="
          registry=/var/lib/haxlab/derived/training/elite-champions/registry.json
          if sudo -n test -f "$registry"; then
            sudo -n cat "$registry"
          else
            echo "CHAMPION_REGISTRY_NOT_FOUND_OR_UNREADABLE"
          fi

          echo "=== zSSH delegated queue item ==="
          python3 - <<'PY'
          import json, urllib.request
          qid="zssh-haxlab-candidate-b-runtime-probe-20261001"
          with urllib.request.urlopen("http://127.0.0.1:8765/api/portfolio-queue?all=1",timeout=10) as r:
              body=json.load(r)
          item=next((x for x in body.get("items",[]) if x.get("queue_id")==qid),None)
          print("ZSSH_PROBE_LIVE",json.dumps(item,sort_keys=True))
          PY
