name: Deploy zBrowse via VPS bridge

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-zbrowse-bridge.yml"
      - "tests/test_zbrowse_bridge_deploy_workflow.py"
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-zbrowse-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zbrowse-vps-bridge-${{ github.event_name == 'pull_request' && github.ref || 'live' }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      EXPECTED_ZCLOUD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.EXPECTED_ZCLOUD_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate zBrowse bridge deploy safety contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_ZCLOUD_SHA"
          python3 -m unittest -v tests.test_zbrowse_bridge_deploy_workflow

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 20
    env:
      EXPECTED_ZCLOUD_SHA: ${{ github.sha }}
      ZGUARD_REMOTE: https://github.com/Zennay/zGuard.git

    steps:
      - name: Check out exact zCloud deploy source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.EXPECTED_ZCLOUD_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact revision and permanent zCloud VPS runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_ZCLOUD_SHA"
          test "$(id -un)" = "ubuntu"
          python3 scripts/zcloud_vps_runner_guard.py --json

      - name: Resolve immutable zGuard main revision
        id: zguard
        shell: bash
        run: |
          set -euo pipefail
          zguard_sha="$(git ls-remote "$ZGUARD_REMOTE" refs/heads/main | awk 'NR == 1 {print $1}')"
          if [[ ! "$zguard_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Unable to resolve an immutable zGuard main revision" >&2
            exit 1
          fi
          echo "sha=$zguard_sha" >> "$GITHUB_OUTPUT"
          echo "Resolved zGuard source revision: ${zguard_sha:0:12}"

      - name: Deploy resolved zGuard zBrowse revision
        shell: bash
        env:
          ZGUARD_SHA: ${{ steps.zguard.outputs.sha }}
        run: |
          set -euo pipefail

          if [[ ! "$ZGUARD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid zGuard source revision" >&2
            exit 1
          fi

          sudo systemctl start docker
          sudo systemctl is-active --quiet docker

          if [ ! -d /opt/zbrowse-source/.git ]; then
            sudo mkdir -p /opt/zbrowse-source
            sudo chown -R "$USER":"$USER" /opt/zbrowse-source
            git -C /opt/zbrowse-source init
            git -C /opt/zbrowse-source remote add origin "$ZGUARD_REMOTE"
          else
            sudo chown -R "$USER":"$USER" /opt/zbrowse-source
            git -C /opt/zbrowse-source remote set-url origin "$ZGUARD_REMOTE"
          fi

          git -C /opt/zbrowse-source fetch --depth=1 origin "$ZGUARD_SHA"
          git -C /opt/zbrowse-source reset --hard "$ZGUARD_SHA"
          test "$(git -C /opt/zbrowse-source rev-parse HEAD)" = "$ZGUARD_SHA"

          cd /opt/zbrowse-source/zbrowse

          if [ ! -f .env ]; then
            cp .env.example .env
          fi

          docker_gid="$(stat -c '%g' /var/run/docker.sock)"
          if grep -q '^DOCKER_GID=' .env; then
            sed -i "s/^DOCKER_GID=.*/DOCKER_GID=$docker_gid/" .env
          else
            printf '\nDOCKER_GID=%s\n' "$docker_gid" >> .env
          fi

          bash scripts/validate.sh

          browser_image="$(sed -n 's/^BROWSER_IMAGE=//p' .env | tail -n 1)"
          if [ -z "$browser_image" ]; then
            browser_image="zbrowse-browser:1.0.0"
          fi

          sudo docker build -t "$browser_image" ./browser
          sudo docker compose up -d --build gateway

          if command -v ufw >/dev/null 2>&1; then
            sudo ufw allow 8090/tcp || true
          fi

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8090/api/health; then
              echo
              echo "zBrowse health check passed"
              sudo docker compose ps
              sudo ss -ltnp | grep ':8090' || true
              exit 0
            fi
            sleep 2
          done

          sudo docker compose logs --tail=120 gateway
          exit 1
