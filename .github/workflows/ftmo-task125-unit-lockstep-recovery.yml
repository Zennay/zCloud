name: FTMO TASK-125 unit lockstep recovery

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-task125-unit-lockstep-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ftmo-task125-unit-lockstep-recovery-v4
  cancel-in-progress: false

jobs:
  repair:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Check out exact zCloud recovery source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1

      - name: Repair exact FTMO main unit drift
        shell: bash
        run: |
          set -euo pipefail

          test "${RUNNER_NAME:-}" = "zcloud-vps-1"
          test "$(hostname)" = "vps-bb300bba"
          test "$(id -un)" = "ubuntu"
          echo "FTMO_TASK125_RECOVERY_RUNNER=verified"

          TARGET_SHA="0505a6b051dd63d828fd38cca54987fdf885c343"
          SERVICE="ftmo-autonomous-marathon.service"
          RUNNER_SERVICE="actions.runner.Zennay-Ftmo.vps-bb300bba-ftmo.service"
          REPO_ROOT="/opt/ftmo-autonomous"
          ZCLOUD_CONTROL_ROOT="${ZCLOUD_CONTROL_ROOT:-/home/ubuntu/zennay-cloud}"
          ZCLOUD_RESOURCE_DB="${ZCLOUD_RESOURCE_DB:-$ZCLOUD_CONTROL_ROOT/history.db}"

          test -d "$REPO_ROOT"
          test -d "$ZCLOUD_CONTROL_ROOT"

          # The governor is the only new runtime dependency introduced by the
          # proven FTMO main. Repair missing deployment files from this exact
          # zCloud checkout, but do not overwrite an existing live copy here.
          for relative in scripts/zcloud_governed_exec.py project-contracts.json project_runtime.py; do
            test -f "$GITHUB_WORKSPACE/$relative"
            if [[ ! -f "$ZCLOUD_CONTROL_ROOT/$relative" ]]; then
              install -D -m 0644 "$GITHUB_WORKSPACE/$relative" "$ZCLOUD_CONTROL_ROOT/$relative"
              echo "FTMO_TASK125_DEPENDENCY_INSTALLED=$relative"
            fi
            test -f "$ZCLOUD_CONTROL_ROOT/$relative"
          done
          test -f "$ZCLOUD_RESOURCE_DB"

          # The dedicated FTMO runtime and runner are intentionally isolated
          # under the ftmo-runner account; do not depend on listener health to
          # repair the marathon unit itself.
          RUN_USER="ftmo-runner"
          id "$RUN_USER" >/dev/null
          echo "FTMO_TASK125_EXPECTED_RUN_USER=$RUN_USER"
          echo "FTMO_TASK125_RESOURCE_DB_PRESENT=$([[ -f "$ZCLOUD_RESOURCE_DB" ]] && echo yes || echo no)"

          PYTHON_BIN="${FTMO_SYSTEM_PYTHON:-}"
          if [[ -z "$PYTHON_BIN" ]]; then
            if command -v python3.12 >/dev/null 2>&1; then
              PYTHON_BIN="$(command -v python3.12)"
            else
              PYTHON_BIN="$(command -v python3)"
            fi
          fi
          test -x "$PYTHON_BIN"
          "$PYTHON_BIN" - <<'PY'
          import sys
          if sys.version_info < (3, 12):
              raise SystemExit("FTMO autonomous runtime requires Python 3.12+")
          PY
          echo "FTMO_TASK125_EXPECTED_PYTHON=$PYTHON_BIN"

          diagnose_failure() {
            rc=$?
            echo "::group::FTMO TASK-125 runtime failure diagnostics"
            echo "FTMO_TASK125_FAILURE_RC=$rc"
            echo "FTMO_TASK125_FAILURE_STATE=$(systemctl is-active "$SERVICE" || true)"
            echo "FTMO_TASK125_FAILURE_MAINPID=$(systemctl show "$SERVICE" -p MainPID --value || true)"
            echo "FTMO_TASK125_ZCLOUD_ROOT=$ZCLOUD_CONTROL_ROOT"
            echo "FTMO_TASK125_RESOURCE_DB=$ZCLOUD_RESOURCE_DB"
            namei -l "$ZCLOUD_CONTROL_ROOT" || true
            namei -l "$ZCLOUD_RESOURCE_DB" || true
            for relative in scripts/zcloud_governed_exec.py project-contracts.json project_runtime.py; do
              candidate="$ZCLOUD_CONTROL_ROOT/$relative"
              stat -c 'FTMO_TASK125_DEPENDENCY_STAT=%A %U:%G %n' "$candidate" || true
              if sudo -n -u "$RUN_USER" test -r "$candidate"; then
                echo "FTMO_TASK125_RUN_USER_READABLE=$relative"
              else
                echo "FTMO_TASK125_RUN_USER_UNREADABLE=$relative"
              fi
            done
            stat -c 'FTMO_TASK125_DB_STAT=%A %U:%G %n' "$ZCLOUD_RESOURCE_DB" || true
            if sudo -n -u "$RUN_USER" test -r "$ZCLOUD_RESOURCE_DB"; then
              echo "FTMO_TASK125_DB_READABLE=yes"
            else
              echo "FTMO_TASK125_DB_READABLE=no"
            fi
            if sudo -n -u "$RUN_USER" test -w "$ZCLOUD_RESOURCE_DB"; then
              echo "FTMO_TASK125_DB_WRITABLE=yes"
            else
              echo "FTMO_TASK125_DB_WRITABLE=no"
            fi
            if sudo -n -u "$RUN_USER" test -w "$(dirname "$ZCLOUD_RESOURCE_DB")"; then
              echo "FTMO_TASK125_DB_PARENT_WRITABLE=yes"
            else
              echo "FTMO_TASK125_DB_PARENT_WRITABLE=no"
            fi
            sudo -n systemctl --no-pager --full status "$SERVICE" || true
            sudo -n journalctl -u "$SERVICE" -n 120 --no-pager || true
            echo "::endgroup::"
            exit "$rc"
          }
          trap diagnose_failure ERR

          rendered="$(mktemp)"
          backup="/etc/systemd/system/$SERVICE.task125-pre-repair"
          trap 'rm -f "$rendered"' EXIT

          cat >"$rendered" <<UNIT
          [Unit]
          Description=FTMO continuous autonomous research marathon
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=$RUN_USER
          WorkingDirectory=$REPO_ROOT
          Environment=PYTHONUNBUFFERED=1
          Environment=FTMO_PYTHON=$REPO_ROOT/.venv/bin/python
          Environment=FTMO_AUTONOMOUS_CLOUD_BUDGET_USD=0.00
          Environment=FTMO_ALLOW_PAID_AWS=
          Environment=FTMO_RESEARCH_MAX_WORKERS=5
          Environment=FTMO_RESEARCH_RESERVE_CPUS=1
          Environment=ZCLOUD_CONTROL_ROOT=$ZCLOUD_CONTROL_ROOT
          Environment=ZCLOUD_RESOURCE_DB=$ZCLOUD_RESOURCE_DB
          ExecStart=$PYTHON_BIN $ZCLOUD_CONTROL_ROOT/scripts/zcloud_governed_exec.py --db $ZCLOUD_RESOURCE_DB --project ftmo --owner ftmo-autonomous-marathon --lease-seconds 300 --renew-seconds 60 -- /bin/bash $REPO_ROOT/scripts/run-autonomous-marathon.sh $REPO_ROOT
          Restart=always
          RestartSec=30s
          Nice=0
          CPUWeight=10000
          CPUQuota=500%
          NoNewPrivileges=true
          PrivateTmp=true
          ProtectSystem=full

          [Install]
          WantedBy=multi-user.target
          UNIT

          ! grep -Eq '__[A-Z0-9_]+__' "$rendered"
          echo "FTMO_TASK125_RENDER_SHA256=$(sha256sum "$rendered" | awk '{print $1}')"

          if ! sudo -n cmp -s "$rendered" "/etc/systemd/system/$SERVICE"; then
            if [[ -f "/etc/systemd/system/$SERVICE" ]]; then
              sudo -n cp -f "/etc/systemd/system/$SERVICE" "$backup"
            fi
            sudo -n install -m 0644 "$rendered" "/etc/systemd/system/$SERVICE"
            sudo -n systemctl daemon-reload
            sudo -n systemctl restart "$SERVICE"
          fi

          sudo -n cmp "$rendered" "/etc/systemd/system/$SERVICE"

          state=""
          pid=""
          for _ in $(seq 1 30); do
            state="$(systemctl is-active "$SERVICE" || true)"
            pid="$(systemctl show "$SERVICE" -p MainPID --value || true)"
            if [[ "$state" == "active" && "$pid" =~ ^[1-9][0-9]*$ ]] && kill -0 "$pid" 2>/dev/null; then
              break
            fi
            sleep 2
          done
          test "$state" = "active"
          [[ "$pid" =~ ^[1-9][0-9]*$ ]]
          kill -0 "$pid"

          cmdline="$(tr '\0' ' ' < "/proc/$pid/cmdline")"
          [[ "$cmdline" == *"zcloud_governed_exec.py"* ]]
          [[ "$cmdline" == *"run-autonomous-marathon.sh"* ]]

          echo "FTMO_TASK125_UNIT_LOCKSTEP=verified"
          echo "FTMO_TASK125_TARGET_SHA=$TARGET_SHA"
          echo "FTMO_TASK125_SERVICE_PID=$pid"
