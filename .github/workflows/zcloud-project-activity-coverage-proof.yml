name: zCloud project activity coverage proof

on:
  pull_request:
    paths:
      - "scripts/zcloud_project_activity_coverage.py"
      - "tests/test_project_activity_coverage.py"
      - "tests/test_project_activity_coverage_workflow.py"
      - ".github/workflows/zcloud-project-activity-coverage-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zcloud-project-activity-coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-head-vps-readonly:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'Zennay')
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Prove permanent zCloud VPS runner
        run: python3 scripts/zcloud_vps_runner_guard.py --json

      - name: Run focused regressions
        run: python3 -m unittest -v tests.test_project_activity_coverage tests.test_project_activity_coverage_workflow

      - name: Inventory live activity coverage without mutation
        shell: bash
        run: |
          set -euo pipefail
          LIVE_DB=/home/ubuntu/zennay-cloud/history.db
          test -f "$LIVE_DB"
          before_size="$(stat -c %s "$LIVE_DB")"
          before_mtime="$(stat -c %Y "$LIVE_DB")"
          python3 scripts/zcloud_project_activity_coverage.py             --db "$LIVE_DB"             --contracts project-contracts.json             --stale-hours 168             > /tmp/zcloud-project-activity-coverage.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          payload=json.loads(Path("/tmp/zcloud-project-activity-coverage.json").read_text())
          assert payload["schema_version"] == 1
          rows=payload["projects"]
          assert rows
          assert len({row["project_id"] for row in rows}) == len(rows)
          assert all(row["state"] in {"recent","inactive_or_stale","never_seen","timestamp_invalid"} for row in rows)
          forbidden={"title","detail","error","result","target"}
          for row in rows:
              assert not (forbidden & set(row)), row
              for source in row["sources"]:
                  assert set(source) <= {"source","event_count","latest_at"}, source
          print(json.dumps({
              "summary": payload["summary"],
              "never_seen": [row["project_id"] for row in rows if row["state"] == "never_seen"],
              "inactive_or_stale": [row["project_id"] for row in rows if row["state"] == "inactive_or_stale"],
              "generated_at": payload["generated_at"],
          }, sort_keys=True))
          PY
          after_size="$(stat -c %s "$LIVE_DB")"
          after_mtime="$(stat -c %Y "$LIVE_DB")"
          test "$before_size" = "$after_size"
          test "$before_mtime" = "$after_mtime"
          echo "ZCLOUD_PROJECT_ACTIVITY_COVERAGE_READONLY_GREEN"
