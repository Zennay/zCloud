name: Cancel unavailable Fuckball release runner
on:
  push:
    branches: [codex/fuckball-release-cfb9836]
    paths: ['.github/workflows/fuckball-release-cfb9836.yml']
permissions:
  contents: read
  actions: write
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale run before using the repository-scoped VPS runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/Zennay/zCloud/actions/runs/38473771079/cancel
