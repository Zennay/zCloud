name: Snapshot FTMO Worker2 queue item

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-worker2-queue-snapshot.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ftmo-worker2-queue-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 5
    env:
      QUEUE_ID: ftmo-2e49bff2460feac8
    steps:
      - name: Read exact SQLite queue assignment
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          python3 - <<'PY'
          import json, os, sqlite3
          from pathlib import Path
          db=Path("/home/ubuntu/zennay-cloud/history.db")
          if not db.is_file():
              raise SystemExit("live zCloud history.db missing")
          with sqlite3.connect(db) as c:
              c.row_factory=sqlite3.Row
              row=c.execute(
                  "SELECT queue_id,project_id,title,status,eligible,worker_slot,evidence,updated_at "
                  "FROM portfolio_queue WHERE queue_id=?",
                  (os.environ["QUEUE_ID"],),
              ).fetchone()
          if row is None:
              raise SystemExit("queue item missing")
          item=dict(row)
          if item["project_id"] != "ftmo":
              raise SystemExit("queue project mismatch")
          print("QUEUE_SNAPSHOT="+json.dumps(item,sort_keys=True))
          Path("/tmp/ftmo-worker2-queue-snapshot.json").write_text(
              json.dumps({
                  "schema_version":1,
                  "queue":item,
                  "workflow_run_id":os.environ["GITHUB_RUN_ID"],
                  "runner_host":"vps-bb300bba",
              },sort_keys=True,indent=2)+"\n",
              encoding="utf-8",
          )
          PY

      - name: Persist sanitized snapshot
        shell: bash
        run: |
          set -euo pipefail
          encoded="$(base64 -w0 /tmp/ftmo-worker2-queue-snapshot.json)"
          path="runtime-evidence/ftmo-${QUEUE_ID}-queue-snapshot-${GITHUB_RUN_ID}.json"
          gh api --method PUT "repos/Zennay/zCloud/contents/$path"             -f message="Record FTMO Worker2 queue snapshot ${GITHUB_RUN_ID}"             -f content="$encoded" >/dev/null
          echo "QUEUE_SNAPSHOT_RECEIPT=$path"
