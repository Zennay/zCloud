name: FTMO stale CI queue cleanup

on:
  pull_request:
    paths:
      - ".github/workflows/ftmo-stale-ci-cleanup.yml"
      - "tests/test_ftmo_stale_ci_cleanup_workflow.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-stale-ci-cleanup.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ftmo-stale-ci-cleanup-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'live' }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 1

      - name: Validate stale-CI cleanup trust contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest tests.test_ftmo_stale_ci_cleanup_workflow

  cleanup:
    if: github.event_name != 'pull_request' && github.repository == 'Zennay/zCloud' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 1

      - name: Guard canonical permanent VPS before cancellation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(id -un)" = "ubuntu"
          test "$(hostname)" = "vps-bb300bba"
          test "${RUNNER_NAME:-}" = "zcloud-vps-1"
          python3 scripts/zcloud_vps_runner_guard.py --json

      - name: Cancel only superseded FTMO branch runs
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          main_sha="$(gh api repos/Zennay/Ftmo/branches/main --jq .commit.sha)"
          printf 'protected_main_sha=%s\n' "$main_sha"

          branches=(
            "fix/live-autonomous-project-telemetry-20261003"
            "worker-chatgpt/gen30-future-window-gate-v2-20261003"
            "worker-chatgpt/gen30-state-sync-deploy-lockstep-v2-20261003"
            "worker-chatgpt/gen30-state-sync-deploy-lockstep-20261003"
            "worker5/day-cache-evidence-integrity-v3-20261002"
            "worker5/day-cache-evidence-integrity-v2-20261002"
            "worker5/day-cache-temporal-provenance-20261002"
            "worker3/provider-publication-atomicity-20261002"
            "worker1/gen29-day-cache-write-validation-20261002"
            "worker1/jetta-tick-chronology-v3-20261002"
            "worker1/jetta-tick-chronology-v2-20261002"
            "worker3/foundation-readiness-path-integrity-20261002"
            "proof/worker3-pr390-targeted-20261002"
            "proof/worker3-pr386-targeted-20261002"
          )

          cancelled=0
          for branch in "${branches[@]}"; do
            while IFS=$'\t' read -r run_id status head_sha; do
              [[ -n "$run_id" ]] || continue
              if [[ "$head_sha" == "$main_sha" ]]; then
                echo "refusing current-main run=$run_id branch=$branch" >&2
                exit 1
              fi
              case "$status" in
                queued|in_progress|pending)
                  gh run cancel "$run_id" --repo Zennay/Ftmo
                  echo "cancelled=$run_id branch=$branch status=$status head=$head_sha"
                  cancelled=$((cancelled + 1))
                  ;;
                *)
                  echo "left=$run_id branch=$branch status=$status head=$head_sha"
                  ;;
              esac
            done < <(
              gh api --paginate "repos/Zennay/Ftmo/actions/runs?branch=$branch&per_page=100" \
                --jq '.workflow_runs[] | [.id,.status,.head_sha] | @tsv'
            )
          done

          echo "cancelled_count=$cancelled"
          for run_id in 36995115879 36995115888; do
            status="$(gh api "repos/Zennay/Ftmo/actions/runs/$run_id" --jq .status 2>/dev/null || true)"
            [[ -n "$status" ]] && echo "protected_current_main_run=$run_id status=$status"
          done
