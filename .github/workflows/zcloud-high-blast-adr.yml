name: zCloud high-blast ADR guard

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: zcloud-high-blast-adr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  adr-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Require ADR for high-blast architecture changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 scripts/zcloud_adr_guard.py \
            --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA"
