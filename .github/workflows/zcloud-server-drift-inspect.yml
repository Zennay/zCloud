name: Inspect zCloud managed server drift

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/zcloud-server-drift-inspect.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Inspect live server source drift
        shell: bash
        run: |
          set -euo pipefail
          live="/home/ubuntu/zennay-cloud/server.py"
          candidate="$GITHUB_WORKSPACE/server.py"
          test -f "$live"
          test -f "$candidate"
          echo "LIVE_SERVER_SHA256=$(sha256sum "$live" | awk '{print $1}')"
          echo "CANDIDATE_SERVER_SHA256=$(sha256sum "$candidate" | awk '{print $1}')"
          echo "CANDIDATE_COMMIT=$GITHUB_SHA"
          live_sha="$(sha256sum "$live" | awk '{print $1}')"
          match=""
          while read -r commit; do
            test -n "$commit" || continue
            blob_sha="$(git show "$commit:server.py" 2>/dev/null | sha256sum | awk '{print $1}' || true)"
            if [[ "$blob_sha" == "$live_sha" ]]; then
              match="$commit"
              break
            fi
          done < <(git log --first-parent --format=%H -- server.py)
          echo "LIVE_SERVER_MATCHING_FIRST_PARENT_COMMIT=${match:-NONE}"
          any_match=""
          while read -r commit; do
            test -n "$commit" || continue
            blob_sha="$(git show "$commit:server.py" 2>/dev/null | sha256sum | awk '{print $1}' || true)"
            if [[ "$blob_sha" == "$live_sha" ]]; then
              any_match="$commit"
              break
            fi
          done < <(git rev-list --all -- server.py)
          echo "LIVE_SERVER_MATCHING_ANY_COMMIT=${any_match:-NONE}"
          echo "DIFF_BEGIN"
          diff -u --label live/server.py --label candidate/server.py "$live" "$candidate" || true
          echo "DIFF_END"
          echo "PROJECTS_LIVE_SHA256=$(sha256sum /home/ubuntu/zennay-cloud/projects.json | awk '{print $1}')"
          echo "PROJECTS_CANDIDATE_SHA256=$(sha256sum "$GITHUB_WORKSPACE/projects.json" | awk '{print $1}')"
      - name: Queue fail-closed drift reconciliation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import urllib.request

          base="http://127.0.0.1:8765"
          qid="zssh-zcloud-server-drift-catalog-recovery-20261002"
          payload={
              "action":"enqueue",
              "queue_id":qid,
              "project_id":"zssh",
              "priority":"P1",
              "title":"Reconcile unknown zCloud server drift and deploy corrected FTMO catalog",
              "completion_criteria":(
                  "On vps-bb300bba reconcile the unknown live /home/ubuntu/zennay-cloud/server.py drift "
                  "without blind overwrite. Current reviewed live sha256 is "
                  "fb3af74f2b1f77127f2fbbda0f29efab0f65308e6a98f6b357d30a8acd26dbe0; "
                  "it matched no commit in the full Zennay/zCloud Git history in workflow 36973681472. "
                  "Preserve/fail closed until the drift source is identified or explicitly reviewed. "
                  "Then use the guarded transactional/rollback path to reconcile server.py if safe and deploy "
                  "projects.json from main, which contains FTMO Generation-29 persistent-runtime guidance from "
                  "commit 81b16fc3d753612a7f2feb2405379cde5825301c. Prove zennay-cloud.service and HTTP health green, "
                  "prove live projects.json matches tested main, and prove no eligible queue item reopens terminal "
                  "Generation-10 validation. Record workflow_run_id plus before/after hashes. Do not touch FTMO "
                  "provider outcomes, preregistration, walk-forward, final holdout, live trading or broker permissions."
              ),
              "source_url":"https://app.notion.com/p/3db9e19ac9558151bb4debd3d9057322",
          }
          req=urllib.request.Request(
              base+"/api/portfolio-queue",
              data=json.dumps(payload).encode(),
              method="POST",
              headers={"Content-Type":"application/json","X-ZCloud-Actor":"ftmo-worker2-drift-handoff"},
          )
          with urllib.request.urlopen(req,timeout=10) as r:
              result=json.load(r)
          print("DRIFT_RECOVERY_QUEUE",json.dumps(result,sort_keys=True))
          if not result.get("ok"):
              raise SystemExit("queue enqueue failed")
          item=(result.get("item") or {})
          if item.get("queue_id")!=qid or item.get("project_id")!="zssh" or item.get("priority")!="P1":
              raise SystemExit("unexpected queued recovery item")
          PY
