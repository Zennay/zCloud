name: Inspect live worker prompts
# retrigger: live worker count 2026-10-06T22:17+02:00

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-live-worker-prompts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 4
    steps:
      - name: Print live runner prompts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request
          with urllib.request.urlopen("http://127.0.0.1:8765/api/runner-targets", timeout=8) as r:
              payload=json.load(r)
          rows=[]
          for key,cfg in (payload.get("projects") or {}).items():
              rows.append({
                  "key": key,
                  "base": cfg.get("base_project_id"),
                  "active": cfg.get("active"),
                  "reviewer": cfg.get("reviewer_mode"),
                  "assignment_ready": cfg.get("assignment_ready"),
                  "global_slot": cfg.get("global_worker_slot"),
                  "global_count": cfg.get("global_worker_count"),
                  "desired_state": cfg.get("desired_state"),
                  "queue_id": (cfg.get("queue_item") or {}).get("queue_id"),
                  "queue_slot": (cfg.get("queue_item") or {}).get("worker_slot"),
                  "prompt": cfg.get("prompt"),
              })
          print("LIVE_PROMPTS_JSON="+json.dumps(rows,ensure_ascii=False))
          PY

      - name: Prove live server drift is only the known prompt function
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast, hashlib
          from pathlib import Path

          live_path=Path("/home/ubuntu/zennay-cloud/server.py")
          candidate_path=Path("server.py")
          live=live_path.read_text()
          candidate=candidate_path.read_text()

          def function_span(source, name):
              tree=ast.parse(source)
              node=next((n for n in tree.body if isinstance(n, ast.FunctionDef) and n.name==name), None)
              if node is None:
                  raise SystemExit(f"{name} missing")
              lines=source.splitlines(keepends=True)
              return lines, node.lineno-1, node.end_lineno

          def normalize(source):
              tree=ast.parse(source)
              lines=source.splitlines(keepends=True)
              spans=[]
              for name in ("project_runner_prompt","project_worker_prompt"):
                  node=next((n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name==name),None)
                  if node is None:
                      raise SystemExit(f"{name} missing")
                  spans.append((node.lineno-1,node.end_lineno,name))
              for start,end,name in sorted(spans,reverse=True):
                  lines[start:end]=[f"def {name}(*args, **kwargs):
    pass
"]
              return "".join(lines)

          def body(source,name):
              lines,start,end=function_span(source,name)
              return "".join(lines[start:end])

          live_hash=hashlib.sha256(live.encode()).hexdigest()
          candidate_hash=hashlib.sha256(candidate.encode()).hexdigest()
          prompt_functions_equal=all(
              body(live,name)==body(candidate,name)
              for name in ("project_runner_prompt","project_worker_prompt")
          )
          remainder_equal=(normalize(live)==normalize(candidate))
          print(f"LIVE_SERVER_SHA256={live_hash}")
          print(f"CANDIDATE_SERVER_SHA256={candidate_hash}")
          print(f"PROMPT_FUNCTIONS_EQUAL={int(prompt_functions_equal)}")
          print(f"SERVER_REMAINDER_EQUAL={int(remainder_equal)}")
          if not remainder_equal:
              raise SystemExit("live server drift is broader than the two worker prompt functions")
          PY
