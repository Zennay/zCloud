name: Inspect live worker prompts
# retrigger: inspect live assignment metadata after canary 2026-10-04

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/inspect-live-worker-prompts.yml"
      - "tests/test_inspect_live_worker_prompts_workflow.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-live-worker-prompts.yml"
      - "tests/test_inspect_live_worker_prompts_workflow.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inspect-live-worker-prompts-${{ github.event_name == 'pull_request' && github.ref || 'live' }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPECTED_ZCLOUD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact zCloud candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.EXPECTED_ZCLOUD_SHA }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact zCloud candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_ZCLOUD_SHA"

      - name: Validate live-prompt diagnostic trust contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v tests.test_inspect_live_worker_prompts_workflow

  inspect:
    if: github.event_name != 'pull_request' && github.repository == 'Zennay/zCloud'
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 4
    env:
      EXPECTED_ZCLOUD_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact zCloud revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.EXPECTED_ZCLOUD_SHA }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify permanent VPS runner and exact revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_ZCLOUD_SHA"
          test "$(id -un)" = "ubuntu"
          python3 scripts/zcloud_vps_runner_guard.py --json

      - name: Print sanitized live runner prompt metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import urllib.request

          with urllib.request.urlopen("http://127.0.0.1:8765/api/runner-targets", timeout=8) as r:
              payload=json.load(r)
          rows=[]
          for key,cfg in (payload.get("projects") or {}).items():
              prompt=cfg.get("prompt")
              prompt_text=prompt if isinstance(prompt,str) else ""
              rows.append({
                  "key": key,
                  "base": cfg.get("base_project_id"),
                  "active": cfg.get("active"),
                  "reviewer": cfg.get("reviewer_mode"),
                  "assignment_ready": cfg.get("assignment_ready"),
                  "global_slot": cfg.get("global_worker_slot"),
                  "global_count": cfg.get("global_worker_count"),
                  "desired_state": cfg.get("desired_state"),
                  "queue_id": (cfg.get("queue_item") or {}).get("queue_id"),
                  "queue_slot": (cfg.get("queue_item") or {}).get("worker_slot"),
                  "prompt_present": bool(prompt_text),
                  "prompt_length": len(prompt_text),
                  "prompt_sha256": hashlib.sha256(prompt_text.encode("utf-8")).hexdigest() if prompt_text else None,
              })
          print("LIVE_PROMPT_METADATA_JSON="+json.dumps(rows,ensure_ascii=False,sort_keys=True))
          PY

      - name: Prove live server drift is only the known prompt function
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast, hashlib
          from pathlib import Path

          live_path=Path("/home/ubuntu/zennay-cloud/server.py")
          candidate_path=Path("server.py")
          live=live_path.read_text()
          candidate=candidate_path.read_text()

          def function_span(source, name):
              tree=ast.parse(source)
              node=next((n for n in tree.body if isinstance(n, ast.FunctionDef) and n.name==name), None)
              if node is None:
                  raise SystemExit(f"{name} missing")
              lines=source.splitlines(keepends=True)
              return lines, node.lineno-1, node.end_lineno

          def normalize(source):
              tree=ast.parse(source)
              lines=source.splitlines(keepends=True)
              spans=[]
              for name in ("project_runner_prompt","project_worker_prompt"):
                  node=next((n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name==name),None)
                  if node is None:
                      raise SystemExit(f"{name} missing")
                  spans.append((node.lineno-1,node.end_lineno,name))
              for start,end,name in sorted(spans,reverse=True):
                  lines[start:end]=[f"def {name}(*args, **kwargs):\n    pass\n"]
              return "".join(lines)

          def body(source,name):
              lines,start,end=function_span(source,name)
              return "".join(lines[start:end])

          live_hash=hashlib.sha256(live.encode()).hexdigest()
          candidate_hash=hashlib.sha256(candidate.encode()).hexdigest()
          prompt_functions_equal=all(
              body(live,name)==body(candidate,name)
              for name in ("project_runner_prompt","project_worker_prompt")
          )
          remainder_equal=(normalize(live)==normalize(candidate))
          print(f"LIVE_SERVER_SHA256={live_hash}")
          print(f"CANDIDATE_SERVER_SHA256={candidate_hash}")
          print(f"PROMPT_FUNCTIONS_EQUAL={int(prompt_functions_equal)}")
          print(f"SERVER_REMAINDER_EQUAL={int(remainder_equal)}")
          if not remainder_equal:
              raise SystemExit("live server drift is broader than the two worker prompt functions")
          PY
          echo "ZCLOUD_LIVE_PROMPT_DIAGNOSTIC_GREEN=1"
