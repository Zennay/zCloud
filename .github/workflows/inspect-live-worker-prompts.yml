name: Live worker count probe
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/inspect-live-worker-prompts.yml"
permissions:
  contents: read
jobs:
  probe:
    runs-on:
      - self-hosted
      - zcloud
      - vps
    timeout-minutes: 2
    steps:
      - name: Capture worker state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request
          def get(path):
              with urllib.request.urlopen("http://127.0.0.1:8765"+path, timeout=8) as r:
                  return json.load(r)
          targets=get("/api/runner-targets")
          debug=get("/api/worker-debug")
          status=get("/api/status")
          print("GLOBAL_ALLOCATION="+json.dumps((targets.get("global_allocation") or {}).get("workers") or [], sort_keys=True))
          print("WORKER_DEBUG="+json.dumps(debug, sort_keys=True))
          print("DYNAMIC_WORKERS="+json.dumps(status.get("dynamic_workers"), sort_keys=True))
          print("CHATGPT_RUNNERS="+json.dumps(status.get("chatgpt_runners"), sort_keys=True))
          PY
