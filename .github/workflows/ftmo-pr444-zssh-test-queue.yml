name: Enqueue FTMO PR444 exact-head proof on zSSH

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ftmo-pr444-zssh-test-queue.yml

permissions:
  contents: write

jobs:
  enqueue:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Check out exact main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Enqueue exact-head FTMO proof on live SQLite queue
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import urllib.request

          base = "http://127.0.0.1:8765"
          queue_id = "zssh-ftmo-pr444-exact-head-proof-20261002-worker5"
          payload = {
              "action": "enqueue",
              "queue_id": queue_id,
              "project_id": "zssh",
              "title": "Prove FTMO PR444 exact head on VPS",
              "priority": "P0",
              "completion_criteria": (
                  "On vps-bb300bba perform a read-only exact-head proof for Zennay/Ftmo PR #444 "
                  "at commit a156246682bd836c071b461f66009e7d620c00b4. Use a fresh temporary clone and "
                  "isolated Python venv. Verify HEAD equals that exact SHA, compile "
                  "src/prop_trading_ai/data/market/providers/dukascopy_public.py, then run "
                  "python -m pytest -q tests/test_dukascopy_public.py "
                  "tests/test_dukascopy_timeout_transport.py tests/test_autonomous_provider_retry.py "
                  "tests/test_zero_cost_workflow_boundary.py, followed by python -m pytest --collect-only -q. "
                  "FTMO_AUTONOMOUS_CLOUD_BUDGET_USD must remain 0.00 and paid AWS must remain disabled. "
                  "Do not modify the FTMO repository, application runtime, marathon service, provider evidence, "
                  "preregistration, development, walk-forward, final holdout, broker/live permissions, queue item "
                  "ftmo-f81305d51f3aba3b, or secrets. Return host, exact SHA, compile result, pytest result, "
                  "collection result/count, and any failing assertion verbatim if a test fails."
              ),
              "source_url": "https://github.com/Zennay/Ftmo/pull/444",
          }

          def post(path, body):
              request = urllib.request.Request(
                  base + path,
                  data=json.dumps(body).encode(),
                  method="POST",
                  headers={"Content-Type": "application/json"},
              )
              with urllib.request.urlopen(request, timeout=10) as response:
                  result = json.load(response)
                  if response.status >= 300:
                      raise RuntimeError(f"{path} failed: HTTP {response.status}")
              return result

          enqueue = post("/api/portfolio-queue", payload)
          start = post("/api/runner-control", {"project_id": "zssh", "action": "start"})
          push = post("/api/runner-control", {"project_id": "zssh", "action": "push"})
          print("FTMO_PR444_ZSSH_ENQUEUE", json.dumps(enqueue, sort_keys=True))
          print("ZSSH_START", json.dumps(start, sort_keys=True))
          print("ZSSH_PUSH", json.dumps(push, sort_keys=True))
          PY

          git fetch origin main
          git reset --hard origin/main

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import urllib.request

          queue_id = "zssh-ftmo-pr444-exact-head-proof-20261002-worker5"
          with urllib.request.urlopen(
              "http://127.0.0.1:8765/api/portfolio-queue?all=1", timeout=10
          ) as response:
              live = json.load(response)

          def find(value):
              if isinstance(value, dict):
                  if value.get("queue_id") == queue_id:
                      return value
                  for child in value.values():
                      found = find(child)
                      if found:
                          return found
              elif isinstance(value, list):
                  for child in value:
                      found = find(child)
                      if found:
                          return found
              return None

          item = find(live)
          if not item:
              raise SystemExit(f"{queue_id} not found in live SQLite queue")
          if str(item.get("project_id") or "").lower() != "zssh":
              raise SystemExit(f"{queue_id} attached to wrong project")
          if str(item.get("priority") or "").upper() != "P0":
              raise SystemExit(f"{queue_id} is not P0")

          receipt = {
              "schema_version": 1,
              "scope": "ftmo-pr444-zssh-exact-head-proof-queue",
              "workflow_run_id": os.environ.get("GITHUB_RUN_ID"),
              "workflow_run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "workflow_source_sha": os.environ.get("GITHUB_SHA"),
              "receipt_base_sha": subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], text=True
              ).strip(),
              "queue": {
                  "queue_id": item.get("queue_id"),
                  "project_id": item.get("project_id"),
                  "priority": item.get("priority"),
                  "status": item.get("status"),
                  "eligible": item.get("eligible"),
                  "worker_slot": item.get("worker_slot"),
                  "updated_at": item.get("updated_at"),
              },
              "target_exact_head_sha": "a156246682bd836c071b461f66009e7d620c00b4",
          }
          target = Path("artifacts/ops/ftmo-pr444-zssh-proof-queue.json")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(
              json.dumps(receipt, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          print("FTMO_PR444_ZSSH_QUEUE_RECEIPT", json.dumps(receipt, sort_keys=True))
          PY

          git config user.name "zcloud-automation"
          git config user.email "zcloud-automation@users.noreply.github.com"
          git add artifacts/ops/ftmo-pr444-zssh-proof-queue.json
          if git diff --cached --quiet; then
            echo "Queue receipt unchanged"
          else
            git commit -m "Record FTMO PR444 zSSH proof queue receipt"
            git push origin HEAD:main
          fi
