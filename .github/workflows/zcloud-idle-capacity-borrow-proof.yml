name: zCloud idle capacity borrow admission proof

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/zcloud_idle_capacity_borrow_admission.py
      - tests/test_idle_capacity_borrow_admission.py
      - tests/test_idle_capacity_borrow_admission_workflow.py
      - docs/idle-capacity-borrow-admission.md
      - .github/workflows/zcloud-idle-capacity-borrow-proof.yml
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zcloud-idle-capacity-borrow-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.actor == 'Zennay' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact candidate and permanent VPS runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          test "$(id -un)" = "ubuntu"
          python3 scripts/zcloud_vps_runner_guard.py --json
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          fi

      - name: Prove bounded idle-capacity borrowing
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/zcloud_idle_capacity_borrow_admission.py \
            tests/test_idle_capacity_borrow_admission.py \
            tests/test_idle_capacity_borrow_admission_workflow.py
          python3 -m unittest -v \
            tests.test_idle_capacity_borrow_admission \
            tests.test_idle_capacity_borrow_admission_workflow

          cat > "$RUNNER_TEMP/idle-borrow.json" <<'JSON'
          {
            "schema_version": 1,
            "host": {
              "capacity_cpu_cores": 6,
              "protected_reserve_cpu_cores": 1.5,
              "admitted_non_protected_cpu_cores": 2,
              "pressure_state": "compute_busy",
              "backpressure_required": false
            },
            "projects": [
              {
                "project_id": "ftmo",
                "scheduler_rank": 0,
                "runnable": true,
                "safety_admitted": true,
                "allow_idle_capacity_borrow": true,
                "protected": false,
                "requested_extra_cpu_cores": 2
              },
              {
                "project_id": "cloud",
                "scheduler_rank": 1,
                "runnable": true,
                "safety_admitted": true,
                "allow_idle_capacity_borrow": true,
                "protected": true,
                "requested_extra_cpu_cores": 1
              },
              {
                "project_id": "haxlab",
                "scheduler_rank": 2,
                "runnable": true,
                "safety_admitted": true,
                "allow_idle_capacity_borrow": true,
                "protected": false,
                "requested_extra_cpu_cores": 1
              }
            ]
          }
          JSON

          python3 scripts/zcloud_idle_capacity_borrow_admission.py \
            --evidence "$RUNNER_TEMP/idle-borrow.json" \
            --json > "$RUNNER_TEMP/result.json"

          python3 - "$RUNNER_TEMP/result.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          result = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))["result"]
          assert result["host"]["idle_borrowable_cpu_cores"] == 2.5, result
          assert result["totals"]["borrowed_cpu_cores"] == 2.5, result
          assert result["host"]["remaining_idle_cpu_cores"] == 0.0, result
          assert [row["project_id"] for row in result["admitted"]] == ["ftmo", "haxlab"], result
          denied = {row["project_id"]: row for row in result["denied"]}
          assert denied["cloud"]["reason"] == "protected_project_not_borrower", result
          assert result["guardrails"]["protected_reserve_spendable_by_borrowers"] is False, result
          assert result["guardrails"]["compute_busy_alone_blocks_borrowing"] is False, result
          assert result["guardrails"]["mutation_performed"] is False, result
          print("ZCLOUD_IDLE_BORROW_VPS_GREEN=1")
          PY
