name: FTMO PR418 exact-head foundation readiness proof

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-pr418-exact-head-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ftmo-pr418-exact-head-foundation-readiness-proof
  cancel-in-progress: false

jobs:
  proof:
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 18
    env:
      TARGET_SHA: 68ef4ad4714babf10c195420773bb8e8a72288ac
    steps:
      - name: Checkout zCloud proof workspace
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main

      - name: Fetch exact FTMO PR418 head
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          src="$RUNNER_TEMP/ftmo-pr418-proof"
          rm -rf "$src"
          gh repo clone Zennay/Ftmo "$src" -- --filter=blob:none --no-checkout >/dev/null
          git -C "$src" checkout --detach "$TARGET_SHA" >/dev/null
          test "$(git -C "$src" rev-parse HEAD)" = "$TARGET_SHA"
          echo "FTMO_PR418_EXACT_SHA=$TARGET_SHA"

      - name: Install isolated test environment
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr418-proof"
          venv="$RUNNER_TEMP/ftmo-pr418-proof-venv"
          rm -rf "$venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install -q -r "$src/requirements-ci.txt"
          "$venv/bin/python" -m pip install -q -e "$src"

      - name: Compile provider readiness boundary
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr418-proof"
          venv="$RUNNER_TEMP/ftmo-pr418-proof-venv"
          cd "$src"
          "$venv/bin/python" -m compileall -q src/prop_trading_ai/ops/autonomous_rollover.py
          echo "FTMO_PR418_COMPILE_GREEN=1"

      - name: Prove canonical readiness regressions
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr418-proof"
          venv="$RUNNER_TEMP/ftmo-pr418-proof-venv"
          cd "$src"
          "$venv/bin/python" -m pytest -q tests/test_provider_foundation_publication.py
          echo "FTMO_PR418_READINESS_TESTS_GREEN=1"

      - name: Prove retry, zero-cost and deploy-lockstep compatibility
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr418-proof"
          venv="$RUNNER_TEMP/ftmo-pr418-proof-venv"
          cd "$src"
          "$venv/bin/python" -m pytest -q \
            tests/test_autonomous_provider_retry.py \
            tests/test_zero_cost_workflow_boundary.py \
            tests/test_autonomous_deploy_lockstep.py
          echo "FTMO_PR418_RELEVANT_SUITE_GREEN=1"

      - name: Record proof identity
        shell: bash
        run: |
          set -euo pipefail
          echo "FTMO_PR418_PROOF_RUN_ID=$GITHUB_RUN_ID"
          echo "FTMO_PR418_PROOF_RESULT=success"
          echo "FTMO_PR418_TARGET_SHA=$TARGET_SHA"
