name: zCloud intensity policy proof

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/zcloud_intensity_policy.py
      - tests/test_intensity_policy.py
      - tests/test_intensity_policy_workflow.py
      - docs/intensity-slider-policy.md
      - .github/workflows/zcloud-intensity-policy-proof.yml
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zcloud-intensity-policy-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.actor == 'Zennay' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact candidate and permanent VPS runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          test "$(id -un)" = "ubuntu"
          python3 scripts/zcloud_vps_runner_guard.py --json
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          fi

      - name: Prove bounded intensity policy
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/zcloud_intensity_policy.py tests/test_intensity_policy.py tests/test_intensity_policy_workflow.py
          python3 -m unittest -v tests.test_intensity_policy tests.test_intensity_policy_workflow
          python3 scripts/zcloud_intensity_policy.py --project cloud --intensity 100 --json > "$RUNNER_TEMP/cloud-intensity.json"
          python3 scripts/zcloud_intensity_policy.py --project ftmo --intensity 75 --json > "$RUNNER_TEMP/ftmo-intensity.json"
          python3 scripts/zcloud_intensity_policy.py --project ulab --intensity 100 --json > "$RUNNER_TEMP/ulab-intensity.json"
          python3 - "$RUNNER_TEMP/cloud-intensity.json" "$RUNNER_TEMP/ftmo-intensity.json" "$RUNNER_TEMP/ulab-intensity.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          cloud, ftmo, ulab = [
              json.loads(Path(path).read_text(encoding="utf-8"))["policy"]
              for path in sys.argv[1:]
          ]
          assert cloud["scheduler"]["burst_eligible"] is False, cloud
          assert cloud["guardrails"]["protected"] is True, cloud
          assert ftmo["scheduler"]["cpu_target_cores"] <= ftmo["guardrails"]["cpu_soft_cores_max"], ftmo
          assert ulab["scheduler"]["cpu_target_cores"] == 0.0, ulab
          assert ulab["scheduler"]["allow_idle_capacity_borrow"] is False, ulab
          for payload in (cloud, ftmo, ulab):
              assert payload["guardrails"]["slider_may_override_worker_cap"] is False, payload
              assert payload["guardrails"]["slider_may_override_pool_admission"] is False, payload
              assert payload["guardrails"]["slider_may_override_memory_guard"] is False, payload
              assert payload["guardrails"]["slider_may_preempt_protected_capacity"] is False, payload
          print("ZCLOUD_INTENSITY_POLICY_VPS_GREEN=1")
          PY
