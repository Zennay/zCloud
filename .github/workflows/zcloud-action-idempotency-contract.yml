name: Control-plane action identity contract

on:
  pull_request:
    paths:
      - 'scripts/zcloud_action_idempotency_key.py'
      - 'tests/test_zcloud_action_idempotency_key.py'
      - '.github/workflows/zcloud-action-idempotency-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: action-identity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate action identity contract
        run: python -m unittest discover -s tests -p 'test_zcloud_action_idempotency_key.py' -v
