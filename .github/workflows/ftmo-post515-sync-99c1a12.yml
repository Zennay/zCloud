name: FTMO post515 current-main research-state sync

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-post515-sync-99c1a12.yml"

permissions:
  contents: write

concurrency:
  group: ftmo-post515-sync-99c1a12
  cancel-in-progress: true

jobs:
  sync:
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 20
    env:
      EXPECTED_FTMO_MAIN: 99c1a12cd38d38662f1cb7c82039ed2872d5d9c7
    steps:
      - name: Dispatch exact-current-main FTMO research-state sync
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          gh auth status >/dev/null 2>&1

          current_main() {
            gh api repos/Zennay/Ftmo/branches/main --jq .commit.sha
          }
          test "$(current_main)" = "$EXPECTED_FTMO_MAIN"

          latest_exact_run() {
            gh api "repos/Zennay/Ftmo/actions/workflows/sync-autonomous-research-state.yml/runs?event=workflow_dispatch&per_page=50" \
              --jq --arg sha "$EXPECTED_FTMO_MAIN" \
              '[.workflow_runs[] | select(.head_sha==$sha)] | sort_by(.created_at) | last // {}'
          }

          row="$(latest_exact_run)"
          run_id="$(printf '%s' "$row" | jq -r '.id // empty')"
          if [[ -z "$run_id" ]]; then
            gh workflow run sync-autonomous-research-state.yml --repo Zennay/Ftmo --ref main
            for _ in $(seq 1 30); do
              sleep 2
              test "$(current_main)" = "$EXPECTED_FTMO_MAIN"
              row="$(latest_exact_run)"
              run_id="$(printf '%s' "$row" | jq -r '.id // empty')"
              [[ -n "$run_id" ]] && break
            done
          fi
          test -n "$run_id"

          terminal=""
          for _ in $(seq 1 180); do
            test "$(current_main)" = "$EXPECTED_FTMO_MAIN"
            row="$(gh api "repos/Zennay/Ftmo/actions/runs/$run_id")"
            status="$(printf '%s' "$row" | jq -r .status)"
            if [[ "$status" == "completed" ]]; then
              terminal="$row"
              break
            fi
            sleep 5
          done
          test -n "$terminal"
          test "$(printf '%s' "$terminal" | jq -r .head_sha)" = "$EXPECTED_FTMO_MAIN"
          test "$(printf '%s' "$terminal" | jq -r .conclusion)" = "success"
          test "$(current_main)" = "$EXPECTED_FTMO_MAIN"

          receipt="$RUNNER_TEMP/ftmo-post515-sync-99c1a12.json"
          python3 - "$EXPECTED_FTMO_MAIN" "$terminal" "$GITHUB_RUN_ID" >"$receipt" <<'PY'
import json, sys
sha, raw, carrier = sys.argv[1:]
run = json.loads(raw)
print(json.dumps({
    "schema_version": 1,
    "scope": "ftmo-post515-current-main-research-state-sync",
    "expected_main_sha": sha,
    "carrier_run_id": carrier,
    "research_state_sync": {
        "run_id": run.get("id"),
        "status": run.get("status"),
        "conclusion": run.get("conclusion"),
        "head_sha": run.get("head_sha"),
        "event": run.get("event"),
        "created_at": run.get("created_at"),
        "updated_at": run.get("updated_at"),
    },
}, sort_keys=True, indent=2))
PY
          encoded="$(base64 -w0 "$receipt")"
          existing_sha="$(gh api repos/Zennay/zCloud/contents/runtime-evidence/ftmo-post515-sync-99c1a12.json?ref=main --jq .sha 2>/dev/null || true)"
          args=(--method PUT repos/Zennay/zCloud/contents/runtime-evidence/ftmo-post515-sync-99c1a12.json
                -f message="Record FTMO post515 current-main research-state sync"
                -f content="$encoded"
                -f branch=main)
          if [[ -n "$existing_sha" ]]; then
            args+=(-f sha="$existing_sha")
          fi
          gh api "${args[@]}" >/dev/null
