name: zCloud emergency addon-only tab preservation activation

# Explicit owner authorization only; merging this source never reloads a live addon.
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/zcloud-emergency-addon-hot-reload.yml
      - scripts/zcloud_emergency_addon_idle_guard_20261013_w1.py
      - tests/test_zcloud_emergency_addon_idle_guard_20261013_w1.py
      - tests/test_zcloud_addon_reload_manual_20261014.py
  workflow_dispatch:
    inputs:
      confirm_sha:
        description: "Exact 40-character current main commit approved for addon-only reload"
        required: true
        type: string
      approve_addon_reload:
        description: "I explicitly authorize a live addon reload after idle and SHA checks"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: zcloud-manual-emergency-addon-reload
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      github.event_name == 'pull_request' &&
      github.repository == 'Zennay/zCloud' &&
      github.event.pull_request.head.repo.full_name == github.repository
      && ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || (github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'Zennay'))
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 5
    steps:
      - name: Checkout untrusted candidate only on GitHub-hosted CI
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Check exact candidate and negative trust regression
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m unittest -v tests.test_zcloud_emergency_addon_idle_guard_20261013_w1 tests.test_zcloud_addon_reload_manual_20261014
          python3 -m py_compile scripts/zcloud_emergency_addon_idle_guard_20261013_w1.py

  activate:
    name: Explicit approved current-main addon-only reload on permanent VPS
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'Zennay/zCloud' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'Zennay' &&
      github.triggering_actor == 'Zennay' &&
      github.run_attempt == 1 &&
      inputs.approve_addon_reload == true &&
      inputs.confirm_sha == github.sha
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 5
    steps:
      - name: Checkout immutable exact approved main revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true

      - name: Verify manually approved exact current main and permanent runner before live reads
        shell: bash
        env:
          CONFIRMED_SHA: ${{ inputs.confirm_sha }}
          APPROVE_RELOAD: ${{ inputs.approve_addon_reload }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_TRIGGERING_ACTOR" = "Zennay"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$APPROVE_RELOAD" = "true"
          [[ "$CONFIRMED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REPOSITORY" = "Zennay/zCloud"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_ACTOR" = "Zennay"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$CONFIRMED_SHA" = "$GITHUB_SHA"
          current_main="$(timeout 15 git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          test "$current_main" = "$GITHUB_SHA"
          test "$(hostname)" = "vps-bb300bba"
          test "$(id -un)" = "ubuntu"
          python3 scripts/zcloud_vps_runner_guard.py --json

      - name: Deny reload during generation or unverifiable worker status
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/zcloud_emergency_addon_idle_guard_20261013_w1.py
          node --check firefox-extension/background.js
          source="firefox-extension/background.js"
          live="$HOME/snap/firefox/common/chatgpt-project-extension/background.js"
          test -f "$live"
          cmp -- "$source" "$live"
          # The live addon must already match reviewed canonical main source.
          ! grep -Fq 'browser.tabs.create(' "$live"
          ! grep -Fq 'browser.tabs.remove(' "$live"
          echo "MATCHING_TRUSTED_ADDON_ALREADY_ON_DISK=1"

      - name: Recheck exact main and idle workers, then reload addon without a Firefox restart
        shell: bash
        env:
          CONFIRMED_SHA: ${{ inputs.confirm_sha }}
          APPROVE_RELOAD: ${{ inputs.approve_addon_reload }}
        run: |
          set -euo pipefail
          # Recheck authorization immediately before the live operation.
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REPOSITORY" = "Zennay/zCloud"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_ACTOR" = "Zennay"
          test "$GITHUB_TRIGGERING_ACTOR" = "Zennay"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$APPROVE_RELOAD" = "true"
          [[ "$CONFIRMED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$CONFIRMED_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          current_main="$(timeout 15 git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          test "$current_main" = "$GITHUB_SHA"
          test "$(hostname)" = "vps-bb300bba"
          test "$(id -un)" = "ubuntu"
          python3 scripts/zcloud_vps_runner_guard.py --json
          python3 scripts/zcloud_emergency_addon_idle_guard_20261013_w1.py
          main_pid="$(ps -eo pid=,args= | awk '$0 ~ /[/]firefox/ && $0 ~ /-start-debugger-server/ {print $1;exit}')"
          test -n "$main_pid"
          kill -0 "$main_pid"
          echo "FIREFOX_MAIN_PID_BEFORE=$main_pid"
          node scripts/zcloud_reload_extension.mjs
          sleep 3
          kill -0 "$main_pid"
          new_pid="$(ps -eo pid=,args= | awk '$0 ~ /[/]firefox/ && $0 ~ /-start-debugger-server/ {print $1;exit}')"
          test "$main_pid" = "$new_pid"
          echo "FIREFOX_MAIN_PID_AFTER=$new_pid"
          echo "NO_FIREFOX_RESTART_OR_TAB_TERMINATION_ISSUED=1"
