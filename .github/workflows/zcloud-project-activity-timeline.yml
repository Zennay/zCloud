name: zCloud project activity timeline proof

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/zcloud_project_activity_timeline.py"
      - "tests/test_project_activity_timeline.py"
      - "tests/test_project_activity_timeline_workflow.py"
      - ".github/workflows/zcloud-project-activity-timeline.yml"

permissions:
  contents: read

concurrency:
  group: zcloud-project-activity-timeline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-head-vps-readonly:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'Zennay')
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Prove permanent zCloud VPS runner
        run: python3 scripts/zcloud_vps_runner_guard.py --json

      - name: Run focused regressions
        run: python3 -m unittest -v tests.test_project_activity_timeline tests.test_project_activity_timeline_workflow

      - name: Read-only live timeline proof
        shell: bash
        run: |
          set -euo pipefail
          LIVE_DB=/home/ubuntu/zennay-cloud/history.db
          test -f "$LIVE_DB"
          before_size="$(stat -c %s "$LIVE_DB")"
          before_mtime="$(stat -c %Y "$LIVE_DB")"
          python3 scripts/zcloud_project_activity_timeline.py             --db "$LIVE_DB" --project cloud --hours 24 --limit 25 > /tmp/zcloud-project-activity-timeline.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          payload=json.loads(Path("/tmp/zcloud-project-activity-timeline.json").read_text())
          assert payload["schema_version"] == 1
          assert payload["project_id"] == "cloud"
          assert len(payload["timeline"]) <= 25
          assert all(item["project_id"] == "cloud" for item in payload["timeline"])
          forbidden=("target","title","detail","result","error")
          for item in payload["timeline"]:
              assert not any(key in item for key in forbidden), item
          print(json.dumps({
              "entries": len(payload["timeline"]),
              "counts": payload["counts"],
              "generated_at": payload["generated_at"],
          }, sort_keys=True))
          PY
          after_size="$(stat -c %s "$LIVE_DB")"
          after_mtime="$(stat -c %Y "$LIVE_DB")"
          test "$before_size" = "$after_size"
          test "$before_mtime" = "$after_mtime"
          echo "ZCLOUD_PROJECT_ACTIVITY_TIMELINE_READONLY_GREEN"
