name: zCloud Worker-v2 manual service audit source safety (hosted)

on:
  push:
    branches:
      - main
      - fix/deployops-v2-legacy-manual-replay-gate-20261014-w1
    paths:
      - .github/workflows/zcloud-v2-legacy-service-audit.yml
      - .github/workflows/zcloud-v2-legacy-consent-hosted-20261014-w1.yml
      - tests/test_zcloud_v2_legacy_service_audit_trust_20261013_w1.py
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/zcloud-v2-legacy-service-audit.yml
      - .github/workflows/zcloud-v2-legacy-consent-hosted-20261014-w1.yml
      - tests/test_zcloud_v2_legacy_service_audit_trust_20261013_w1.py

permissions:
  contents: read

concurrency:
  group: v2-legacy-consent-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  hosted-source:
    if: >-
      github.repository == 'Zennay/zCloud' &&
      ((github.event_name == 'push' && github.ref_type == 'branch') ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout immutable source without retaining credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 1
      - name: Test manual consent, replay prevention and fresh-main revalidation
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'Zennay/zCloud'
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python3 -m py_compile tests/test_zcloud_v2_legacy_service_audit_trust_20261013_w1.py
          python3 -m unittest -v tests.test_zcloud_v2_legacy_service_audit_trust_20261013_w1
          echo "ZCLOUD_V2_LEGACY_CONSENT_SOURCE_VERIFIED=1"
