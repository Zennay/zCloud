name: zCloud workflow_run recursion source admission (w34)

# One isolated branch-push proof: no PR event, VPS, queue or recovery authority.
on:
  push:
    branches:
      - deployops/workflow-run-dispatch-ratchet-20261016-w34

permissions:
  contents: read

jobs:
  hosted-source-only:
    if: >-
      github.repository == 'Zennay/zCloud' &&
      github.actor == 'Zennay' &&
      github.ref == 'refs/heads/deployops/workflow-run-dispatch-ratchet-20261016-w34'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout immutable source with full base lineage
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - name: Prove exact branch head and unchanged canonical main
        shell: bash
        env:
          EXACT_HEAD: ${{ github.sha }}
          EXACT_BASE: d813cbe70ae5291246bc8f4977cba18bc066519a
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXACT_BASE"
          python3 -m py_compile scripts/zcloud_workflow_run_dispatch_gate_20261016_w34.py tests/test_zcloud_workflow_run_dispatch_gate_20261016_w34.py
          python3 -m unittest -v tests.test_zcloud_workflow_run_dispatch_gate_20261016_w34
          python3 scripts/zcloud_workflow_run_dispatch_gate_20261016_w34.py --base "$EXACT_BASE" --head "$EXACT_HEAD"
