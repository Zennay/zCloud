name: zSSH Cloudflare credential metadata probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/zssh-cloudflare-credential-probe.yml"
      - "tests/test_zssh_release_workflows.py"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: zssh-cloudflare-credential-metadata-probe
  cancel-in-progress: true

jobs:
  probe:
    name: Find reusable Cloudflare credential metadata without reading values
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 6
    steps:
      - name: Check out zCloud control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enforce permanent VPS runner identity
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/zcloud_vps_runner_guard.py --json \
            | tee "$RUNNER_TEMP/zssh-cloudflare-credential-runner.json"
          test "$(hostname)" = "vps-bb300bba"
          test "$(id -un)" = "ubuntu"

      - name: Inventory only Cloudflare-like GitHub secret and variable names
        shell: bash
        run: |
          set -Eeuo pipefail
          unset GH_TOKEN GITHUB_TOKEN GH_ENTERPRISE_TOKEN GITHUB_ENTERPRISE_TOKEN || true
          gh auth status --hostname github.com >/dev/null 2>&1

          OUT="$RUNNER_TEMP/zssh-cloudflare-credential-metadata.json" python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          pattern = re.compile(r"(CLOUDFLARE|^CF_|DNS.*TOKEN|ZONE.*ID)", re.I)

          def gh_json(path):
              proc = subprocess.run(
                  ["gh", "api", path],
                  check=False,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
              )
              if proc.returncode != 0:
                  return {"_unreadable": True}
              try:
                  return json.loads(proc.stdout)
              except json.JSONDecodeError:
                  return {"_unreadable": True}

          def matching_names(payload, key):
              if payload.get("_unreadable"):
                  return []
              return sorted(
                  item.get("name", "")
                  for item in payload.get(key, [])
                  if item.get("name") and pattern.search(item.get("name", ""))
              )

          result = {
              "schema_version": 1,
              "project": "zssh",
              "probe": "cloudflare-github-credential-metadata",
              "secret_values_read": False,
              "locations": {},
          }

          for repo in ("Zennay/zCloud", "Zennay/zSSH"):
              repo_key = repo.split("/", 1)[1].lower()
              secrets = gh_json(f"repos/{repo}/actions/secrets?per_page=100")
              variables = gh_json(f"repos/{repo}/actions/variables?per_page=100")
              result["locations"][f"{repo_key}:repository"] = {
                  "secret_candidates": matching_names(secrets, "secrets"),
                  "variable_candidates": matching_names(variables, "variables"),
                  "secret_metadata_readable": not secrets.get("_unreadable", False),
                  "variable_metadata_readable": not variables.get("_unreadable", False),
              }

              environments = gh_json(f"repos/{repo}/environments?per_page=100")
              if not environments.get("_unreadable"):
                  for env in environments.get("environments", []):
                      name = env.get("name")
                      if not name:
                          continue
                      from urllib.parse import quote
                      encoded = quote(name, safe="")
                      env_secrets = gh_json(f"repos/{repo}/environments/{encoded}/secrets?per_page=100")
                      env_variables = gh_json(f"repos/{repo}/environments/{encoded}/variables?per_page=100")
                      secret_candidates = matching_names(env_secrets, "secrets")
                      variable_candidates = matching_names(env_variables, "variables")
                      if secret_candidates or variable_candidates or (repo == "Zennay/zSSH" and name == "openai-production"):
                          result["locations"][f"{repo_key}:environment:{name}"] = {
                              "secret_candidates": secret_candidates,
                              "variable_candidates": variable_candidates,
                              "secret_metadata_readable": not env_secrets.get("_unreadable", False),
                              "variable_metadata_readable": not env_variables.get("_unreadable", False),
                          }

          exact_secret_locations = []
          exact_account_locations = []
          exact_zone_locations = []
          for location, data in result["locations"].items():
              if "CLOUDFLARE_API_TOKEN" in data["secret_candidates"]:
                  exact_secret_locations.append(location)
              if "CLOUDFLARE_ACCOUNT_ID" in data["variable_candidates"]:
                  exact_account_locations.append(location)
              if "CLOUDFLARE_ZONE_ID" in data["variable_candidates"]:
                  exact_zone_locations.append(location)

          account_owned_pairs = sorted(
              loc for loc in exact_secret_locations if loc in exact_account_locations
          )
          legacy_zone_pairs = sorted(
              loc for loc in exact_secret_locations if loc in exact_zone_locations
          )

          result["exact_cloudflare_api_token_locations"] = exact_secret_locations
          result["exact_cloudflare_account_id_locations"] = exact_account_locations
          result["exact_cloudflare_zone_id_locations"] = exact_zone_locations
          result["reusable_account_owned_pair_locations"] = account_owned_pairs
          result["reusable_legacy_zone_pair_locations"] = legacy_zone_pairs
          result["user_owned_token_candidate_locations"] = sorted(exact_secret_locations)
          result["reusable_account_owned_pair_present"] = bool(account_owned_pairs)
          result["reusable_legacy_zone_pair_present"] = bool(legacy_zone_pairs)
          result["user_owned_token_candidate_present"] = bool(exact_secret_locations)
          result["reusable_exact_pair_present"] = bool(account_owned_pairs or legacy_zone_pairs)
          Path(os.environ["OUT"]).write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

      - name: Publish non-secret credential metadata status
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          REPORT="$RUNNER_TEMP/zssh-cloudflare-credential-metadata.json" python3 - <<'PY'
          import json
          import os
          import urllib.request

          report = json.load(open(os.environ["REPORT"], encoding="utf-8"))
          account_pair = bool(report.get("reusable_account_owned_pair_present"))
          legacy_pair = bool(report.get("reusable_legacy_zone_pair_present"))
          token_candidate = bool(report.get("user_owned_token_candidate_present"))
          description = (
              f"account_pair={'yes' if account_pair else 'no'}; "
              f"legacy_pair={'yes' if legacy_pair else 'no'}; "
              f"token_candidate={'yes' if token_candidate else 'no'}"
          )
          payload = json.dumps({
              "state": "success",
              "context": "zssh/cloudflare-credential-metadata",
              "description": description,
              "target_url": (
                  f"https://github.com/{os.environ['GITHUB_REPOSITORY']}"
                  f"/actions/runs/{os.environ['GITHUB_RUN_ID']}"
              ),
          }).encode("utf-8")
          request = urllib.request.Request(
              (
                  f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}"
                  f"/statuses/{os.environ['GITHUB_SHA']}"
              ),
              data=payload,
              headers={
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "zcloud-zssh-cloudflare-metadata",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              if response.status != 201:
                  raise SystemExit(f"unexpected GitHub status response: {response.status}")
          print(
              "ZSSH_CLOUDFLARE_CREDENTIAL_METADATA_STATUS_PUBLISHED",
              json.dumps({
                  "account_owned_pair": account_pair,
                  "legacy_zone_pair": legacy_pair,
                  "user_owned_token_candidate": token_candidate,
              }, sort_keys=True),
          )
          PY

      - name: Upload non-secret credential metadata evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zssh-cloudflare-credential-metadata-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/zssh-cloudflare-credential-metadata.json
            ${{ runner.temp }}/zssh-cloudflare-credential-runner.json
          if-no-files-found: warn
          retention-days: 7
