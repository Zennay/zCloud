name: One-off Senior Team OS portfolio audit

on:
  pull_request:
    paths:
      - ".github/workflows/oneoff-senior-portfolio-audit.yml"

jobs:
  diagnose-senior-review:
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 5
    steps:
      - name: Inspect reviewer state and VPS pressure
        shell: bash
        run: |
          set -euo pipefail
          DB=/home/ubuntu/zennay-cloud/history.db
          echo "runner=$(hostname)"
          echo "== memory =="
          free -m
          echo "== load =="
          uptime
          echo "== recent OOM / killed-process kernel evidence =="
          journalctl -k --since "20 minutes ago" --no-pager 2>/dev/null | grep -Ei "out of memory|oom|killed process" | tail -n 80 || true
          echo "== latest bounded reviews =="
          sqlite3 -header -column "$DB"             "SELECT ts,status,projects FROM daily_review_runs ORDER BY ts DESC LIMIT 5;"
          echo "== portfolio-review commands =="
          sqlite3 -header -column "$DB"             "SELECT id,action,status,created_at,updated_at,substr(COALESCE(result,''),1,240) AS result FROM runner_commands WHERE project_id='portfolio-review' ORDER BY id DESC LIMIT 12;"
          echo "== portfolio-review events =="
          sqlite3 -header -column "$DB"             "SELECT id,ts,event,generating,sending,substr(COALESCE(reason,''),1,200) AS reason,substr(COALESCE(error,''),1,200) AS error FROM runner_events WHERE project_id='portfolio-review' ORDER BY id DESC LIMIT 30;"
          echo "== runner live =="
          curl -fsS http://127.0.0.1:8765/api/runner-live || true
