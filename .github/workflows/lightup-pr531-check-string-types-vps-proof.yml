name: LightUp revision-request check string types VPS proof

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/lightup-pr531-check-string-types-vps-proof.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lightup-pr531-check-string-types-vps-proof
  cancel-in-progress: true

env:
  LIGHTUP_REPO: /home/ubuntu/zennay-cloud/repos/lightup
  LIGHTUP_BRANCH: chatgpt/st5-implementation-plan-revision-request-check-string-types-20261007
  LIGHTUP_EXPECTED_SHA: 35f49ab27aad9bff69eead848a5749f0bd11faaa

jobs:
  prove:
    name: LightUp #531 check-string contract on permanent vps-bb300bba
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Guard permanent VPS runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          python3 scripts/zcloud_vps_runner_guard.py --json

      - name: Snapshot exact LightUp candidate
        shell: bash
        run: |
          set -euo pipefail
          test -d "${LIGHTUP_REPO}/.git"
          remote_ref="refs/remotes/origin/lightup-pr531-proof"
          git -C "${LIGHTUP_REPO}" fetch --prune origin             "+refs/heads/${LIGHTUP_BRANCH}:${remote_ref}"
          LIGHTUP_ACTUAL_SHA="$(git -C "${LIGHTUP_REPO}" rev-parse "${remote_ref}^{commit}")"
          test "${LIGHTUP_ACTUAL_SHA}" = "${LIGHTUP_EXPECTED_SHA}"
          SNAPSHOT="${RUNNER_TEMP}/lightup-pr531-${GITHUB_RUN_ID}"
          rm -rf "${SNAPSHOT}"
          mkdir -p "${SNAPSHOT}"
          git -C "${LIGHTUP_REPO}" archive "${LIGHTUP_ACTUAL_SHA}" | tar -x -C "${SNAPSHOT}"
          echo "LIGHTUP_SNAPSHOT=${SNAPSHOT}" >> "${GITHUB_ENV}"
          echo "LIGHTUP_ACTUAL_SHA=${LIGHTUP_ACTUAL_SHA}" >> "${GITHUB_ENV}"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python 3.11 expected-RED contract
        shell: bash
        run: |
          set -euo pipefail
          cd "${LIGHTUP_SNAPSHOT}"
          PYTHONPATH=src:tests python -m compileall -q src tests
          LOG="${RUNNER_TEMP}/lightup-pr531-py311.log"
          set +e
          PYTHONPATH=src:tests python -m unittest -v             test_future_remediation_implementation_plan_revision_request_check_string_types >"${LOG}" 2>&1
          RC=$?
          set -e
          cat "${LOG}"
          test "${RC}" -ne 0
          grep -Fq "Ran 2 tests" "${LOG}"
          grep -Fq "FAILED (failures=1)" "${LOG}"
          grep -Fq "test_canonical_required_revision_items_are_exact_strings" "${LOG}"
          grep -Fq "test_required_revision_string_subclass_fails_closed" "${LOG}"
          COUNT="$(grep -Fc "AssertionError: ValueError not raised" "${LOG}")"
          test "${COUNT}" -eq 1
          PYTHONPATH=src python scripts/check_safety_canaries.py

      - name: Setup Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Python 3.14 expected-RED contract
        shell: bash
        run: |
          set -euo pipefail
          cd "${LIGHTUP_SNAPSHOT}"
          PYTHONPATH=src:tests python -m compileall -q src tests
          LOG="${RUNNER_TEMP}/lightup-pr531-py314.log"
          set +e
          PYTHONPATH=src:tests python -m unittest -v             test_future_remediation_implementation_plan_revision_request_check_string_types >"${LOG}" 2>&1
          RC=$?
          set -e
          cat "${LOG}"
          test "${RC}" -ne 0
          grep -Fq "Ran 2 tests" "${LOG}"
          grep -Fq "FAILED (failures=1)" "${LOG}"
          COUNT="$(grep -Fc "AssertionError: ValueError not raised" "${LOG}")"
          test "${COUNT}" -eq 1
          PYTHONPATH=src python scripts/check_safety_canaries.py

      - name: Write exact-head receipt
        shell: bash
        run: |
          set -euo pipefail
          RECEIPT_DIR="${RUNNER_TEMP}/lightup-pr531-check-string-types-receipt"
          mkdir -p "${RECEIPT_DIR}"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "project": "LightUp",
              "focus": "evidence-remediation",
              "host": os.uname().nodename,
              "github_run_id": os.environ["GITHUB_RUN_ID"],
              "python": ["3.11", "3.14"],
              "lightup_issue": 530,
              "lightup_pr": 531,
              "lightup_sha": os.environ["LIGHTUP_ACTUAL_SHA"],
              "contract": "implementation_plan_revision_request_exact_check_strings",
              "targeted_tests": 2,
              "expected_failures": 1,
              "result": "expected_red_targeted_both",
              "safety_canaries": "green_both_pythons",
              "lightup_production_source_changes": 0,
              "authority_widening": False,
          }
          path = Path(os.environ["RUNNER_TEMP"]) / "lightup-pr531-check-string-types-receipt" / "receipt.json"
          path.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n")
          print(json.dumps(payload, sort_keys=True))
          PY

      - name: Upload exact-head receipt
        uses: actions/upload-artifact@v4
        with:
          name: lightup-pr531-check-string-types-vps-proof
          path: ${{ runner.temp }}/lightup-pr531-check-string-types-receipt/receipt.json
          if-no-files-found: error

      - name: Cleanup snapshot
        if: always()
        shell: bash
        run: rm -rf "${LIGHTUP_SNAPSHOT:-}"
