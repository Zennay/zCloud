name: zCloud self-improvement scope policy

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: zcloud-self-improvement-scope-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Verify exact candidate
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$HEAD_SHA"

      - name: Run focused scope-policy regressions
        run: python3 -m unittest -v tests.test_self_improvement_scope_policy tests.test_self_improvement_scope_policy_workflow

  permanent-vps-proof:
    if: github.actor == 'Zennay' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, zcloud, vps]
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Verify exact candidate and permanent runner
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(id -un)" = "ubuntu"
          python3 scripts/zcloud_vps_runner_guard.py --json

      - name: Prove self-improvement scope policy
        run: |
          set -euo pipefail
          python3 -m unittest -v tests.test_self_improvement_scope_policy tests.test_self_improvement_scope_policy_workflow
          echo "ZCLOUD_SELF_IMPROVEMENT_SCOPE_VPS_GREEN=1"
