name: Debug zCloud Firefox generation-start race

on:
  push:
    branches:
      - ops/firefox-generation-start-race-debug-20261007-w1
    paths:
      - .github/workflows/zcloud-generation-start-race-debug.yml

permissions:
  contents: read

concurrency:
  group: zcloud-firefox-generation-start-race-debug
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 4
    steps:
      - name: Capture Firefox worker generation transitions
        shell: bash
        run: |
          set -euo pipefail
          echo "=== FIREFOX PROCESS ==="
          pgrep -af 'firefox|web-ext' || true
          echo "=== FIREFOX SERVICE ==="
          export XDG_RUNTIME_DIR=/run/user/1000
          export DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1000/bus
          systemctl --user show chatgpt-firefox.service \
            -p LoadState -p ActiveState -p SubState -p Result \
            -p MainPID -p NRestarts -p ExecMainStartTimestamp -p ActiveEnterTimestamp || true
          echo "=== FIREFOX JOURNAL LAST 25 MIN ==="
          journalctl --user -u chatgpt-firefox.service --since "-25 min" --no-pager -o short-iso 2>/dev/null | tail -n 160 || true
          echo "=== ZCLOUD HEAL/WATCHDOG JOURNAL LAST 25 MIN ==="
          journalctl --since "-25 min" --no-pager -o short-iso 2>/dev/null \
            | grep -E 'zcloud-self-heal|zcloud-runner-heal|zcloud-worker-watchdog|worker-progress-watchdog|restart_firefox|chatgpt-firefox' \
            | tail -n 260 || true
          echo "=== INCIDENT WINDOW 21:34:30-21:36:30 UTC ==="
          sudo -n journalctl --since "2026-10-07 21:34:30 UTC" --until "2026-10-07 21:36:30 UTC" \
            --no-pager -o cat 2>/dev/null \
            | grep -E 'zcloud-self-heal|restart_firefox|global_action|reason|memory|worker_count|generating|progress_age|runtime_state|chatgpt-firefox' \
            | tail -n 500 || true
          echo "=== INSTALLED WATCHDOG IDENTITY ==="
          sha256sum /usr/local/sbin/zcloud-worker-watchdog /home/ubuntu/zennay-cloud/scripts/zcloud_worker_watchdog.py 2>/dev/null || true
          echo "=== WATCHDOG STATE ==="
          if sudo -n test -r /home/ubuntu/.local/state/zcloud/worker-progress-watchdog.json 2>/dev/null; then
            sudo -n cat /home/ubuntu/.local/state/zcloud/worker-progress-watchdog.json \
              | python3 -c 'import json,sys; d=json.load(sys.stdin); w=d.get("workers") or {}; print("WATCHDOG_STATE="+json.dumps({"updated_at":d.get("updated_at"),"global":d.get("global"),"workers":{k:{"last_action":v.get("last_action"),"last_action_at":v.get("last_action_at"),"last_new_chat_at":v.get("last_new_chat_at"),"last_progress_at":v.get("last_progress_at"),"stalled_since":v.get("stalled_since")} for k,v in w.items()}},sort_keys=True))'
          else
            echo "WATCHDOG_STATE=unreadable"
          fi
          echo "=== LOCAL WORKER WATCHDOG QUARANTINE ==="
          sudo -n systemctl show zcloud-self-heal.service -p Environment -p LoadState || true
          python3 - <<'PY_PENDING'
import sqlite3
db="file:/home/ubuntu/zennay-cloud/history.db?mode=ro"
with sqlite3.connect(db,uri=True,timeout=5) as conn:
    pending=conn.execute("SELECT COUNT(*) FROM runner_commands WHERE status='pending' AND action='new_chat'").fetchone()[0]
    recent=conn.execute(
        "SELECT COUNT(*) FROM runner_commands WHERE action='new_chat' AND created_at >= ?",
        ("2026-10-07T22:04:23+00:00",),
    ).fetchone()[0]
print(f"PENDING_NEW_CHAT_COUNT={pending}")
print(f"NEW_CHAT_AFTER_LOCAL_QUARANTINE={recent}")
PY_PENDING
          echo "=== WORKER RACE ANALYSIS ==="
          python3 - <<'PY'
          import json, sqlite3, urllib.request
          from collections import defaultdict
          from datetime import datetime, timezone

          BASE="http://127.0.0.1:8765"
          DB="file:/home/ubuntu/zennay-cloud/history.db?mode=ro"

          def get(path):
              try:
                  with urllib.request.urlopen(BASE+path, timeout=8) as r:
                      return json.load(r)
              except Exception as exc:
                  return {"error": type(exc).__name__ + ":" + str(exc)[:160]}

          def parse_ts(value):
              text=str(value or "").strip().replace("Z","+00:00")
              try:
                  dt=datetime.fromisoformat(text)
                  if dt.tzinfo is None:
                      dt=dt.replace(tzinfo=timezone.utc)
                  return dt
              except Exception:
                  return None

          debug=get("/api/worker-debug")
          status=get("/api/status")
          targets=get("/api/runner-targets")
          workers=debug.get("workers") if isinstance(debug,dict) else None
          print("WORKER_DEBUG_SUMMARY="+json.dumps({
              "worker_count": len(workers or []),
              "workers": [
                  {
                      "worker": w.get("worker"),
                      "provider": w.get("provider"),
                      "verdict": w.get("verdict"),
                      "desired_state": w.get("desired_state"),
                      "last_event": w.get("last_event"),
                      "last_event_age_s": w.get("last_event_age_s"),
                      "last_prompt_age_s": w.get("last_prompt_age_s"),
                      "last_heartbeat_age_s": w.get("last_heartbeat_age_s"),
                  }
                  for w in (workers or [])
              ],
              "event_counts": debug.get("event_counts") or debug.get("events"),
              "failed_commands": debug.get("failed_commands"),
          }, sort_keys=True))
          print("STATUS_SUMMARY="+json.dumps({
              "dynamic_workers": status.get("dynamic_workers") if isinstance(status,dict) else None,
              "chatgpt_firefox": status.get("chatgpt_firefox") if isinstance(status,dict) else None,
              "errors": status.get("errors") if isinstance(status,dict) else None,
              "allocated_workers": ((targets.get("global_allocation") or {}).get("workers") if isinstance(targets,dict) else None),
          }, sort_keys=True))

          with sqlite3.connect(DB, uri=True, timeout=5) as conn:
              conn.row_factory=sqlite3.Row
              conn.execute("PRAGMA query_only=ON")
              rows=[dict(r) for r in conn.execute(
                  "SELECT id,ts,event,project_id,worker_slot,reason,generating,sending,assistant_chars,progress_at "
                  "FROM runner_events "
                  "WHERE unixepoch(ts) >= unixepoch('now','-60 minutes') "
                  "ORDER BY id ASC"
              ).fetchall()]

          interesting={
              "runner-started","prompt-sent","generation-started","generation-progress",
              "generation-finished","generation-not-started","awaiting-vps-dispatch",
              "conversation-adopted","conversation-reset-requested","runner-draining",
              "runner-drained","send-blocked","quality-retry-scheduled",
              "assignment-refresh-failed","userscript-config-unavailable"
          }
          by_worker=defaultdict(list)
          for row in rows:
              if row.get("event") not in interesting:
                  continue
              key=(str(row.get("project_id") or ""), int(row.get("worker_slot") or 1))
              by_worker[key].append(row)

          suspicious=[]
          chains=[]
          now=datetime.now(timezone.utc)
          for key, events in sorted(by_worker.items()):
              active_prompt=None
              start_count=0
              progress_count=0
              start_ts=None
              base_chars=0
              max_chars=0
              chain=[]
              for row in events:
                  ev=row.get("event")
                  ts=parse_ts(row.get("ts"))
                  if ev=="prompt-sent":
                      if active_prompt is not None:
                          suspicious.append({
                              "project_id":key[0],"worker_slot":key[1],
                              "prompt_ts":active_prompt.get("ts"),
                              "reason":"new-prompt-before-finish",
                              "events":[x["event"] for x in chain[-12:]],
                          })
                      active_prompt=row
                      start_count=0
                      progress_count=0
                      start_ts=None
                      base_chars=int(row.get("assistant_chars") or 0)
                      max_chars=base_chars
                      chain=[{"event":ev,"ts":row.get("ts"),"reason":row.get("reason"),"chars":row.get("assistant_chars")}]
                      continue
                  if active_prompt is None:
                      continue
                  max_chars=max(max_chars,int(row.get("assistant_chars") or 0))
                  chain.append({"event":ev,"ts":row.get("ts"),"reason":row.get("reason"),"chars":row.get("assistant_chars")})
                  if ev=="generation-started":
                      start_count+=1
                      if start_ts is None:
                          start_ts=ts
                      if start_count>1:
                          suspicious.append({
                              "project_id":key[0],"worker_slot":key[1],
                              "prompt_ts":active_prompt.get("ts"),
                              "reason":"duplicate-generation-start-before-finish",
                              "events":[x["event"] for x in chain[-12:]],
                          })
                  elif ev=="generation-progress":
                      progress_count+=1
                  elif ev=="runner-started" and start_count>0:
                      suspicious.append({
                          "project_id":key[0],"worker_slot":key[1],
                          "prompt_ts":active_prompt.get("ts"),
                          "reason":"userscript-restarted-during-generation",
                          "events":[x["event"] for x in chain[-12:]],
                      })
                  elif ev in {"generation-finished","generation-not-started"}:
                      chains.append({
                          "project_id":key[0],"worker_slot":key[1],
                          "prompt_ts":active_prompt.get("ts"),
                          "terminal_event":ev,
                          "start_count":start_count,
                          "progress_count":progress_count,
                          "assistant_chars_delta":max_chars-base_chars,
                          "events":[x["event"] for x in chain[-16:]],
                      })
                      active_prompt=None
                      chain=[]
              if active_prompt is not None:
                  sent=parse_ts(active_prompt.get("ts"))
                  age=(now-sent).total_seconds() if sent else None
                  chains.append({
                      "project_id":key[0],"worker_slot":key[1],
                      "prompt_ts":active_prompt.get("ts"),
                      "terminal_event":None,
                      "age_seconds":age,
                      "start_count":start_count,
                      "progress_count":progress_count,
                      "assistant_chars_delta":max_chars-base_chars,
                      "events":[x["event"] for x in chain[-16:]],
                  })
                  if age is not None and age>=30 and start_count>0 and progress_count==0 and max_chars-base_chars<=0:
                      suspicious.append({
                          "project_id":key[0],"worker_slot":key[1],
                          "prompt_ts":active_prompt.get("ts"),
                          "reason":"generation-started-but-no-response-progress-30s",
                          "age_seconds":round(age,1),
                          "events":[x["event"] for x in chain[-16:]],
                      })

          cutoff=parse_ts("2026-10-07T22:04:23Z")
          post_rows=[
              row for row in rows
              if (parse_ts(row.get("ts")) and cutoff and parse_ts(row.get("ts")) >= cutoff)
          ]
          post_counts={}
          for row in post_rows:
              ev=str(row.get("event") or "")
              post_counts[ev]=post_counts.get(ev,0)+1
          post_workers={}
          for row in post_rows:
              key=f"{row.get('project_id') or ''}::w{int(row.get('worker_slot') or 1)}"
              item=post_workers.setdefault(key,{
                  "events":[],"max_assistant_chars":0,"generation_progress":0,
                  "generation_started":0,"generation_finished":0,"prompt_sent":0,
              })
              item["events"].append(row.get("event"))
              item["max_assistant_chars"]=max(item["max_assistant_chars"],int(row.get("assistant_chars") or 0))
              if row.get("event")=="generation-progress": item["generation_progress"]+=1
              if row.get("event")=="generation-started": item["generation_started"]+=1
              if row.get("event")=="generation-finished": item["generation_finished"]+=1
              if row.get("event")=="prompt-sent": item["prompt_sent"]+=1
              item["events"]=item["events"][-20:]

          print("ACTIVE_AND_TERMINAL_CHAINS="+json.dumps(chains[-50:],sort_keys=True))
          print("SUSPICIOUS_WINDOWS="+json.dumps(suspicious[-50:],sort_keys=True))
          print("FINAL_STABILITY_COUNTS="+json.dumps(post_counts,sort_keys=True))
          print("FINAL_STABILITY_WORKERS="+json.dumps(post_workers,sort_keys=True))
          print("FIREFOX_GENERATION_STATE_BUG="+("1" if suspicious else "0"))
          PY
