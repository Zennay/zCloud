name: FTMO PR521 exact-head provider bundle integration proof

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-pr521-provider-bundle-integration-proof.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ftmo-pr521-exact-head-provider-bundle-integration
  cancel-in-progress: true

jobs:
  proof:
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 25
    env:
      TARGET_SHA: 6b9f6b8b2db903de313643abe95ae4f267bc6000
      RECEIPT_PATH: runtime-evidence/ftmo-pr521-provider-bundle-integration-proof.json
      FTMO_AUTONOMOUS_CLOUD_BUDGET_USD: '0.00'
      FTMO_ALLOW_PAID_AWS: ''
    steps:
      - name: Verify VPS and fetch exact FTMO PR521 head
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          src="$RUNNER_TEMP/ftmo-pr521-exact"
          rm -rf "$src"
          gh repo clone Zennay/Ftmo "$src" -- --filter=blob:none --no-checkout >/dev/null
          git -C "$src" checkout --detach "$TARGET_SHA" >/dev/null
          test "$(git -C "$src" rev-parse HEAD)" = "$TARGET_SHA"
          echo "FTMO_PR521_EXACT_SHA=$TARGET_SHA"

      - name: Install isolated test environment
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr521-exact"
          venv="$RUNNER_TEMP/ftmo-pr521-exact-venv"
          rm -rf "$venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install -q -r "$src/requirements-ci.txt"
          "$venv/bin/python" -m pip install -q -e "$src"

      - name: Prove provider bundle integration and verified-snapshot promotion
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr521-exact"
          venv="$RUNNER_TEMP/ftmo-pr521-exact-venv"
          cd "$src"
          test "$FTMO_AUTONOMOUS_CLOUD_BUDGET_USD" = '0.00'
          test -z "${FTMO_ALLOW_PAID_AWS:-}"
          "$venv/bin/python" -m compileall -q src/prop_trading_ai/data/market/provider_evidence_bundle.py
          "$venv/bin/python" -m pytest -q             tests/test_provider_evidence_bundle.py             tests/test_provider_validation.py             tests/test_provider_validation_json_integrity.py             tests/test_atomic_preresearch_evidence.py

      - name: Persist sanitized proof receipt
        if: always()
        shell: bash
        env:
          PROOF_RESULT: ${{ job.status }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/zcloud-pr521-provider-bundle-receipt"
          rm -rf "$work"
          gh repo clone Zennay/zCloud "$work" -- --filter=blob:none >/dev/null
          cd "$work"
          git checkout main >/dev/null
          git pull --rebase origin main
          mkdir -p "$(dirname "$RECEIPT_PATH")"
          python3 - <<'PY'
          import json, os, socket
          from pathlib import Path

          payload = {
              "schema_version": 1,
              "project": "ftmo",
              "task": "TASK-78",
              "pull_request": 521,
              "target_sha": os.environ["TARGET_SHA"],
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "workflow_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "result": os.environ["PROOF_RESULT"],
              "runner_host": socket.gethostname(),
              "scope": "restart-safe provider bundle integration exact-head proof",
              "verified_snapshot_promotion": True,
              "research_stage": "provider_foundation",
              "provider_thresholds_changed": False,
              "reserve_chronology_changed": False,
              "walk_forward_access_relaxed": False,
              "final_holdout_access_relaxed": False,
              "live_or_broker_access_relaxed": False,
              "paid_cloud_enabled": False,
          }
          Path(os.environ["RECEIPT_PATH"]).write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          git config user.name "zcloud-automation"
          git config user.email "zcloud-automation@users.noreply.github.com"
          git add "$RECEIPT_PATH"
          if ! git diff --cached --quiet; then
            git commit -m "Record FTMO PR521 provider bundle integration proof"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                exit 0
              fi
              git fetch origin main
              git rebase origin/main
            done
            exit 1
          fi
