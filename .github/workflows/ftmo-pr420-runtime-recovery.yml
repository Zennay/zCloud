name: Recover FTMO PR420 exact runtime

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-pr420-runtime-recovery.yml"

permissions:
  contents: read

concurrency:
  group: ftmo-pr420-exact-runtime-recovery
  cancel-in-progress: true

jobs:
  recover:
    if: false
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 12
    env:
      TARGET_SHA: fd409196cb6a4d83c258343a3799d27d916c07d6
      FTMO_STABLE_ROOT: /opt/ftmo-autonomous
      EXACT_PROOF_RUN: "36995756456"
      NORMAL_VERIFY_RUN: "36996363566"
    steps:
      - name: Verify proof and mutation lane
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          gh auth status >/dev/null 2>&1
          proof="$(gh api "repos/Zennay/zCloud/actions/runs/$EXACT_PROOF_RUN")"
          python3 -c 'import json,sys; d=json.load(sys.stdin); (d.get("status"),d.get("conclusion"))==("completed","success") or (_ for _ in ()).throw(SystemExit("exact proof is not green"))' <<<"$proof"
          verify="$(gh api "repos/Zennay/Ftmo/actions/runs/$NORMAL_VERIFY_RUN")"
          status="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])' <<<"$verify")"
          test "$status" != "in_progress"
          echo "FTMO_PR420_MUTATION_LANE_GREEN=1"

      - name: Fetch exact audited FTMO revision
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr420-runtime"
          rm -rf "$src"
          gh repo clone Zennay/Ftmo "$src" -- --filter=blob:none --no-checkout >/dev/null
          git -C "$src" checkout --detach "$TARGET_SHA" >/dev/null
          test "$(git -C "$src" rev-parse HEAD)" = "$TARGET_SHA"
          echo "FTMO_PR420_EXACT_SOURCE_SHA=$TARGET_SHA"

      - name: Guard baseline ancestry and exact changed surface
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          root=Path(os.environ["FTMO_STABLE_ROOT"])
          status_path=root/".scratch/autonomy/status.json"
          if not status_path.is_file() or status_path.is_symlink():
              raise SystemExit("live FTMO status missing or unsafe")
          status=json.loads(status_path.read_text(encoding="utf-8"))
          baseline=str(status.get("runtime_revision") or "")
          target=os.environ["TARGET_SHA"]
          if len(baseline)!=40:
              raise SystemExit(f"invalid baseline runtime revision {baseline!r}")
          raw=subprocess.check_output(["gh","api",f"repos/Zennay/Ftmo/compare/{baseline}...{target}"],text=True)
          cmp=json.loads(raw)
          if cmp.get("status") not in {"ahead","identical"}:
              raise SystemExit(f"target is not a descendant of live runtime: {cmp.get('status')}")
          allowed={
              ".github/workflows/dukascopy-resume-cache-integrity.yml",
              "src/prop_trading_ai/data/market/dukascopy_tick_resume_cache.py",
              "tests/test_dukascopy_tick_resume_cache.py",
          }
          changed={item.get("filename") for item in cmp.get("files",[]) if item.get("filename")}
          unexpected=changed-allowed
          if unexpected:
              raise SystemExit("unexpected target-vs-live changed files: "+",".join(sorted(unexpected)))
          required="src/prop_trading_ai/data/market/dukascopy_tick_resume_cache.py"
          if baseline != target and required not in changed:
              raise SystemExit("expected PR420 runtime file absent from diff")
          evidence={"baseline":baseline,"target":target,"changed":sorted(changed)}
          Path(os.environ["RUNNER_TEMP"]+"/ftmo-pr420-baseline.json").write_text(json.dumps(evidence))
          print("FTMO_PR420_BASELINE_GREEN="+json.dumps(evidence,sort_keys=True))
          PY

      - name: Promote only PR420 runtime file
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr420-runtime"
          root="$FTMO_STABLE_ROOT"
          test -d "$root"
          test ! -L "$root"
          run_user="$(stat -c %U "$root")"
          relative="src/prop_trading_ai/data/market/dukascopy_tick_resume_cache.py"
          target="$root/$relative"
          tmp="$target.pr420.tmp"
          sudo -n cp "$src/$relative" "$tmp"
          sudo -n chmod "$(stat -c %a "$src/$relative")" "$tmp"
          sudo -n chown "$run_user:$run_user" "$tmp"
          sudo -n mv "$tmp" "$target"
          cmp "$src/$relative" "$target"
          sudo -n -u "$run_user" mkdir -p "$root/.scratch/autonomy"
          printf '%s\n' "$TARGET_SHA" | sudo -n -u "$run_user" tee "$root/.scratch/autonomy/deployed-main-sha" >/dev/null
          printf '%s\n' "$GITHUB_RUN_ID" | sudo -n -u "$run_user" tee "$root/.scratch/autonomy/deployed-workflow-run-id" >/dev/null
          echo "FTMO_PR420_RUNTIME_PROMOTED=$TARGET_SHA"

      - name: Restart persistent marathon
        shell: bash
        run: |
          set -euo pipefail
          before="$(systemctl show ftmo-autonomous-marathon.service -p MainPID --value || true)"
          sudo -n systemctl restart ftmo-autonomous-marathon.service
          state=""
          after=""
          for _ in $(seq 1 60); do
            state="$(systemctl is-active ftmo-autonomous-marathon.service || true)"
            after="$(systemctl show ftmo-autonomous-marathon.service -p MainPID --value || true)"
            if [[ "$state" == "active" && "$after" =~ ^[1-9][0-9]*$ && "$after" != "$before" ]]; then break; fi
            sleep 2
          done
          test "$state" = "active"
          [[ "$after" =~ ^[1-9][0-9]*$ ]]
          test "$after" != "$before"
          echo "FTMO_PR420_MARATHON_PID_HANDOFF=$before->$after"

      - name: Prove fresh sealed Gen29 heartbeat
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, time
          from pathlib import Path
          root=Path(os.environ["FTMO_STABLE_ROOT"])
          target=os.environ["TARGET_SHA"]
          run_id=os.environ["GITHUB_RUN_ID"]
          status_path=root/".scratch/autonomy/status.json"
          deadline=time.monotonic()+420
          last=None
          while time.monotonic()<deadline:
              if status_path.is_file() and not status_path.is_symlink():
                  try: status=json.loads(status_path.read_text(encoding="utf-8"))
                  except Exception:
                      time.sleep(5); continue
                  research=status.get("research") or {}
                  controller=status.get("research_controller") or {}
                  loop=controller.get("generation_loop") or {}
                  outcome=controller.get("outcome_execution") or {}
                  compute=controller.get("compute") or {}
                  last={
                      "runtime_revision":status.get("runtime_revision"),
                      "deployment_workflow_run_id":status.get("deployment_workflow_run_id"),
                      "research_cycle_ok":status.get("research_cycle_ok"),
                      "generation_number":research.get("generation_number"),
                      "next_stage":research.get("next_stage"),
                      "controller_action":controller.get("action"),
                      "outcomes_executed":loop.get("outcomes_executed"),
                      "walk_forward_accessed":loop.get("walk_forward_accessed"),
                      "final_holdout_accessed":loop.get("final_holdout_accessed"),
                      "live_trading_allowed":status.get("live_trading_allowed"),
                      "broker_order_submission_allowed":status.get("broker_order_submission_allowed"),
                  }
                  exact=status.get("runtime_revision")==target and str(status.get("deployment_workflow_run_id"))==run_id
                  if exact and status.get("research_cycle_ok") is True:
                      required={
                          "g29":research.get("generation_number")==29,
                          "provider_foundation":research.get("next_stage")=="provider_foundation",
                          "development_sealed":research.get("development_access_allowed") is False,
                          "wf_sealed":research.get("walk_forward_access_allowed") is False,
                          "holdout_sealed":research.get("final_holdout_access_allowed") is False,
                          "no_outcomes":loop.get("outcomes_executed") is False,
                          "wf_not_accessed":loop.get("walk_forward_accessed") is False,
                          "holdout_not_accessed":loop.get("final_holdout_accessed") is False,
                          "live_false":status.get("live_trading_allowed") is False,
                          "broker_false":status.get("broker_order_submission_allowed") is False,
                          "controller_wf_false":outcome.get("walk_forward_accessed") is False,
                          "controller_holdout_false":outcome.get("final_holdout_accessed") is False,
                          "compute_ok":compute.get("ok") is True,
                          "zero_cloud":str(status.get("autonomous_cloud_budget_usd"))=="0.00",
                      }
                      failed=[k for k,v in required.items() if not v]
                      if failed: raise SystemExit("sealed runtime failed: "+",".join(failed))
                      state=subprocess.check_output(["systemctl","is-active","ftmo-autonomous-marathon.service"],text=True).strip()
                      if state!="active": raise SystemExit("marathon not active")
                      print("FTMO_PR420_EXACT_RUNTIME_GREEN="+json.dumps(last,sort_keys=True))
                      raise SystemExit(0)
              time.sleep(5)
          raise SystemExit("fresh exact PR420 heartbeat not observed: "+json.dumps(last,sort_keys=True))
          PY
