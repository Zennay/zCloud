name: LightUp VPS verification

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/lightup-vps-verification.yml
      - tests/test_lightup_vps_verification_workflow.py
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
    paths:
      - .github/workflows/lightup-vps-verification.yml
  workflow_dispatch:
    inputs:
      ref:
        description: LightUp git ref to verify
        required: false
        default: origin/main
        type: string

permissions:
  contents: read

concurrency:
  group: lightup-vps-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.event_name != 'pull_request' ||
      (github.actor == 'Zennay' &&
       github.triggering_actor == 'Zennay' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 10
    env:
      EXPECTED_ZCLOUD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact zCloud workflow revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 1

      - name: Verify exact zCloud checkout
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_ZCLOUD_SHA"
          printf 'ZCLOUD_EXACT_CHECKOUT_GREEN sha=%s\n' "$actual"

      - name: Verify permanent zCloud VPS runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -un)" = ubuntu
          python3 scripts/zcloud_vps_runner_guard.py --json

      - name: Test isolated LightUp snapshot
        shell: bash
        env:
          LIGHTUP_REPO: /home/ubuntu/zennay-cloud/repos/lightup
          REQUESTED_REF: ${{ inputs.ref || 'origin/main' }}
        run: |
          set -euo pipefail
          test -d "${LIGHTUP_REPO}/.git"

          git -C "${LIGHTUP_REPO}" fetch --prune origin main
          TARGET_REF="${REQUESTED_REF:-origin/main}"
          TARGET_SHA="$(git -C "${LIGHTUP_REPO}" rev-parse "${TARGET_REF}^{commit}")"

          TMP_ROOT="$(mktemp -d)"
          trap 'rm -rf "${TMP_ROOT}"' EXIT
          SNAPSHOT="${TMP_ROOT}/lightup"
          mkdir -p "${SNAPSHOT}"
          git -C "${LIGHTUP_REPO}" archive "${TARGET_SHA}" | tar -x -C "${SNAPSHOT}"

          cd "${SNAPSHOT}"
          export PYTHONPATH=src

          python3 -m compileall -q src tests
          python3 -m unittest discover -s tests -v

          printf 'LIGHTUP_VPS_PROOF target_sha=%s host=%s\n' "${TARGET_SHA}" "$(hostname)"
