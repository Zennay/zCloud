# emergency restore trigger 2026-10-06T06:04Z: recover stalled self-hosted queue, zCloud runner, and seven-worker push
name: zCloud self-hosted queue watchdog

on:
  # Disabled 5-minute polling while the dedicated runner is offline.
  push:
    branches: [main]
    paths:
      - ".github/workflows/zcloud-self-hosted-queue-watchdog.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  observe:
    # PR/worker-head regression runs cannot authorize queue cancellation or
    # actions on the VPS. Reject stale main SHAs, forks and manual non-owners.
    if: >-
      github.repository == 'Zennay/zCloud' &&
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push') ||
       (github.event_name == 'workflow_dispatch' &&
        github.actor == 'Zennay' &&
        github.triggering_actor == 'Zennay' &&
        github.run_attempt == 1))
    # No GitHub-hosted compute: observe can run only on the dedicated VPS runner.
    # This watchdog cannot bootstrap a stopped listener; recovery is owner-controlled.
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 3
    concurrency:
      group: zcloud-self-hosted-queue-watchdog-observe
      cancel-in-progress: false
    outputs:
      stale_detected: ${{ steps.inspect.outputs.stale_detected }}
      evidence: ${{ steps.inspect.outputs.evidence }}
    steps:
      - id: inspect
        name: Detect stale queued zCloud jobs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, urllib.request
          from datetime import datetime, timezone

          repo=os.environ["REPO"]
          token=os.environ["GH_TOKEN"]
          headers={
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "zcloud-self-hosted-queue-watchdog/1",
          }

          def get(path):
              req=urllib.request.Request("https://api.github.com"+path,headers=headers)
              with urllib.request.urlopen(req,timeout=20) as r:
                  return json.load(r)

          now=datetime.now(timezone.utc)
          queued=get(f"/repos/{repo}/actions/runs?status=queued&per_page=100").get("workflow_runs") or []
          # Provider windows may be truncated. Never report an empty sample
          # as proof the entire GitHub queue is empty.
          observed=queued[:16]
          complete=len(queued)<100 and len(queued)<=16
          candidates=[]
          partial_jobs=False
          for run in observed:
              created=datetime.fromisoformat(str(run["created_at"]).replace("Z","+00:00"))
              age=(now-created).total_seconds()
              jobs=get(f"/repos/{repo}/actions/runs/{run['id']}/jobs?filter=latest&per_page=100").get("jobs") or []
              if len(jobs)>=100:
                  partial_jobs=True
              for job in jobs:
                  if job.get("status") != "queued":
                      continue
                  labels={str(x).lower() for x in (job.get("labels") or [])}
                  if "self-hosted" not in labels:
                      continue
                  candidates.append({
                      "run_id":run["id"],
                      "job_id":job.get("id"),
                      "age_s":max(0,int(age)),
                  })

          # Read-only observation: never cancel a queued run or replay an
          # Actions workflow without explicit owner authorization.
          remaining=[x for x in candidates if x["age_s"] >= 180]
          evidence={
              "queued_self_hosted_jobs_in_sample":len(candidates),
              "stale_self_hosted_jobs_in_sample":len(remaining),
              "runs_inspected":len(observed),
              "runs_not_inspected_lower_bound":len(queued)-len(observed),
              "coverage_complete":bool(complete and not partial_jobs),
              "max_stale_age_s":max((item["age_s"] for item in remaining),default=None),
              "cancel_performed":False,
              "restart_performed":False,
              "recovery_authorized":False,
          }
          print("stale_detected=" + ("true" if remaining else "false"))
          print("evidence=" + json.dumps(evidence,separators=(",",":")))
          summary=os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary,"a",encoding="utf-8") as output:
                  output.write("## zCloud queued self-hosted work (observation only)\n\n")
                  output.write(f"- Inspected queued runs: {len(observed)}; provider window complete: {str(evidence['coverage_complete']).lower()}\n")
                  output.write(f"- Queued self-hosted jobs in sampled runs: {len(candidates)}\n")
                  output.write(f"- Older than 3 minutes: {len(remaining)}\n")
                  output.write(f"- Uninspected queued runs (at least): {len(queued)-len(observed)}\n")
                  output.write("- No cancel, restart, dispatch or new claim authorized or performed.\n")
                  output.write("- Recovery requires the existing resource/owner and release gates.\n")
          PY

