# emergency restore trigger 2026-10-06T06:04Z: recover stalled self-hosted queue, zCloud runner, and seven-worker push
name: zCloud self-hosted queue watchdog

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_run:
    workflows: ["zCloud regression smoke"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - ".github/workflows/zcloud-self-hosted-queue-watchdog.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe:
    if: >-
      github.event_name != 'workflow_run' ||
      (
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == 'main' &&
        (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
      contents: read
    concurrency:
      group: zcloud-self-hosted-queue-watchdog-observe
      cancel-in-progress: false
    outputs:
      recover: ${{ steps.inspect.outputs.recover }}
      evidence: ${{ steps.inspect.outputs.evidence }}
    steps:
      - id: inspect
        name: Detect stale queued zCloud jobs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, urllib.request
          from datetime import datetime, timezone

          repo=os.environ["REPO"]
          token=os.environ["GH_TOKEN"]
          headers={
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "zcloud-self-hosted-queue-watchdog/1",
          }

          def get(path):
              req=urllib.request.Request("https://api.github.com"+path,headers=headers)
              with urllib.request.urlopen(req,timeout=20) as r:
                  return json.load(r)

          now=datetime.now(timezone.utc)
          queued=get(f"/repos/{repo}/actions/runs?status=queued&per_page=100").get("workflow_runs") or []
          candidates=[]
          for run in queued:
              created=datetime.fromisoformat(str(run["created_at"]).replace("Z","+00:00"))
              age=(now-created).total_seconds()
              jobs=get(f"/repos/{repo}/actions/runs/{run['id']}/jobs?filter=latest&per_page=100").get("jobs") or []
              for job in jobs:
                  if job.get("status") != "queued":
                      continue
                  labels={str(x).lower() for x in (job.get("labels") or [])}
                  if "self-hosted" not in labels:
                      continue
                  candidates.append({
                      "run_id":run["id"],
                      "job_id":job.get("id"),
                      "name":run.get("name"),
                      "path":run.get("path"),
                      "job":job.get("name"),
                      "age_s":int(age),
                      "labels":sorted(labels),
                  })

          # Remove superseded duplicate queue entries immediately so the
          # surviving run never waits behind obsolete copies.
          by_path={}
          for item in candidates:
              by_path.setdefault(item["path"] or item["name"] or str(item["run_id"]),[]).append(item)
          cancelled=[]
          for _, items in by_path.items():
              items.sort(key=lambda x:(x["age_s"],x["run_id"]))
              # Lowest age is newest: keep it; cancel older queued duplicates.
              for item in items[1:]:
                  req=urllib.request.Request(
                      f"https://api.github.com/repos/{repo}/actions/runs/{item['run_id']}/cancel",
                      headers=headers, method="POST",
                  )
                  try:
                      with urllib.request.urlopen(req,timeout=20) as r:
                          r.read()
                      cancelled.append(item["run_id"])
                  except Exception:
                      pass

          surviving=[x for x in candidates if x["run_id"] not in set(cancelled)]
          remaining=[x for x in surviving if x["age_s"] >= 180]
          evidence={
              "queued_self_hosted_jobs":surviving,
              "stale_self_hosted_jobs":remaining,
              "cancelled_superseded_runs":cancelled,
              "count":len(remaining),
          }
          print("recover=" + ("true" if remaining else "false"))
          print("evidence=" + json.dumps(evidence,separators=(",",":")))
          PY

  recover:
    needs: observe
    if: needs.observe.outputs.recover == 'true'
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 5
    permissions:
      contents: read
    concurrency:
      group: zcloud-self-hosted-queue-watchdog-recover
      cancel-in-progress: false
    env:
      QUEUE_EVIDENCE: ${{ needs.observe.outputs.evidence }}
      EXPECTED_ZCLOUD_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Checkout exact watchdog revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.EXPECTED_ZCLOUD_SHA }}
          persist-credentials: false

      - name: Verify permanent VPS runner before recovery
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_ZCLOUD_SHA"
          test "$(id -un)" = "ubuntu"
          test "${RUNNER_NAME:-}" = "zcloud-vps-1"
          test "$(hostname)" = "vps-bb300bba"
          python3 scripts/zcloud_vps_runner_guard.py --json > "$RUNNER_TEMP/zcloud-queue-watchdog-runner-guard.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(
              Path(os.environ["RUNNER_TEMP"], "zcloud-queue-watchdog-runner-guard.json").read_text()
          )
          if payload.get("ok") is not True:
              raise SystemExit("permanent VPS runner guard rejected recovery")
          print("ZCLOUD_QUEUE_WATCHDOG_RUNNER_GUARD_GREEN=1")
          PY

      - name: Recover idle zCloud listener and push work
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = "vps-bb300bba"

          service="actions.runner.Zennay-zCloud.zcloud-vps-1.service"
          runner_root="/home/ubuntu/actions-runner-zcloud"

          listener_pids() {
            for proc in /proc/[0-9]*; do
              pid="${proc##*/}"
              cmd="$(tr '\0' ' ' < "$proc/cmdline" 2>/dev/null || true)"
              [[ "$cmd" == *"$runner_root/bin/Runner.Listener"* ]] && echo "$pid"
            done
          }

          worker_pids() {
            for proc in /proc/[0-9]*; do
              pid="${proc##*/}"
              cmd="$(tr '\0' ' ' < "$proc/cmdline" 2>/dev/null || true)"
              [[ "$cmd" == *"$runner_root/bin/Runner.Worker"* ]] && echo "$pid"
            done
          }

          state="$(systemctl is-active "$service" || true)"
          mapfile -t listeners < <(listener_pids)
          mapfile -t workers < <(worker_pids)
          python3 - <<'PY'
          import json
          import os

          evidence = json.loads(os.environ["QUEUE_EVIDENCE"])
          print(
              "ZCLOUD_QUEUE_EVIDENCE "
              f"queued_count={len(evidence.get('queued_self_hosted_jobs') or [])} "
              f"stale_count={len(evidence.get('stale_self_hosted_jobs') or [])} "
              f"cancelled_superseded_count={len(evidence.get('cancelled_superseded_runs') or [])}"
          )
          PY
          echo "ZCLOUD_RUNNER_PRE state=$state listeners=${#listeners[@]} workers=${#workers[@]} listener_pids=${listeners[*]:-none} worker_pids=${workers[*]:-none}"

          if [[ "${#workers[@]}" -eq 0 ]]; then
            echo "ZCLOUD_QUEUE_RECOVERY=restart_idle_listener"
            sudo -n systemctl reset-failed "$service" || true
            sudo -n systemctl restart "$service"
            for _ in $(seq 1 25); do
              state="$(systemctl is-active "$service" || true)"
              mapfile -t listeners < <(listener_pids)
              [[ "$state" == "active" && "${#listeners[@]}" -eq 1 ]] && break
              sleep 1
            done
          else
            echo "ZCLOUD_QUEUE_RECOVERY=preserve_active_worker"
          fi

          state="$(systemctl is-active "$service" || true)"
          mapfile -t listeners < <(listener_pids)
          mapfile -t workers < <(worker_pids)
          echo "ZCLOUD_RUNNER_POST state=$state listeners=${#listeners[@]} workers=${#workers[@]} listener_pids=${listeners[*]:-none} worker_pids=${workers[*]:-none}"

          test "$state" = "active"
          test "${#listeners[@]}" -eq 1

          python3 - <<'PY'
          import json, urllib.error, urllib.request

          base="http://127.0.0.1:8765"

          def call(method,path,payload=None):
              data=None
              headers={"User-Agent":"zcloud-self-hosted-queue-watchdog/1"}
              if payload is not None:
                  data=json.dumps(payload).encode()
                  headers["Content-Type"]="application/json"
              req=urllib.request.Request(base+path,data=data,headers=headers,method=method)
              with urllib.request.urlopen(req,timeout=20) as r:
                  return json.load(r)

          current=call("GET","/api/dynamic-workers").get("dynamic_workers") or {}
          desired={
              key:current.get(key)
              for key in (
                  "chatgpt_count","claude_count",
                  "chatgpt_cooldown_seconds","claude_cooldown_seconds",
                  "check_interval_ms","tick_interval_ms","heartbeat_interval_ms",
                  "generation_start_timeout_ms","scheduler_interval_seconds",
              )
              if current.get(key) is not None
          }
          desired["chatgpt_count"]=7
          reconciled=call("POST","/api/dynamic-workers",desired)
          pushed=call("POST","/api/dynamic-workers/force-push",{})
          print(
              "WORKER_CAPACITY_RECONCILED "
              f"ok={bool(reconciled.get('ok'))} "
              f"chatgpt_count={desired.get('chatgpt_count')}"
          )
          print("WORKERS_FORCE_PUSHED ok=" + str(bool(pushed.get("ok"))))
          if not reconciled.get("ok"):
              raise SystemExit("dynamic worker reconcile returned ok=false")
          if not pushed.get("ok"):
              raise SystemExit("force-push returned ok=false")
          PY
