name: Cancel one verified stale FTMO CI run

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-cancel-one-verified-stale-run.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cancel:
    runs-on: self-hosted
    timeout-minutes: 3
    steps:
      - name: Cancel merged PR 423 stale test run only if identity still matches
        shell: bash
        env:
          TARGET_RUN: "36998295127"
          TARGET_SHA: "d79ede0190ff06fb8927b27b369d9363f706cef0"
          TARGET_PR: "423"
        run: |
          set -euo pipefail
          gh auth status >/dev/null 2>&1

          python3 - <<'PY'
          import json
          import os
          import subprocess

          def gh_json(path):
              raw = subprocess.check_output(
                  ["gh", "api", "-H", "X-GitHub-Api-Version: 2022-11-28", path],
                  text=True,
                  stderr=subprocess.DEVNULL,
              )
              return json.loads(raw)

          run_id = os.environ["TARGET_RUN"]
          expected_sha = os.environ["TARGET_SHA"]
          pr_number = os.environ["TARGET_PR"]

          run = gh_json(f"repos/Zennay/Ftmo/actions/runs/{run_id}")
          pr = gh_json(f"repos/Zennay/Ftmo/pulls/{pr_number}")

          identity = {
              "run_id": run.get("id"),
              "status": run.get("status"),
              "head_sha": run.get("head_sha"),
              "head_branch": run.get("head_branch"),
              "pr_number": pr.get("number"),
              "pr_state": pr.get("state"),
              "pr_merged": bool(pr.get("merged")),
          }
          print("FTMO_STALE_RUN_IDENTITY", json.dumps(identity, sort_keys=True))

          if str(run.get("id")) != run_id:
              raise SystemExit("run id mismatch")
          if run.get("head_sha") != expected_sha:
              raise SystemExit("run SHA mismatch")
          if int(pr.get("number") or 0) != int(pr_number):
              raise SystemExit("PR identity mismatch")
          if pr.get("state") != "closed" or not pr.get("merged"):
              raise SystemExit("PR 423 is not closed-merged")
          if run.get("status") not in {"queued", "pending", "in_progress"}:
              print("FTMO_STALE_RUN_ALREADY_TERMINAL")
              raise SystemExit(0)

          subprocess.check_call(
              [
                  "gh", "api",
                  "--method", "POST",
                  "-H", "X-GitHub-Api-Version: 2022-11-28",
                  f"repos/Zennay/Ftmo/actions/runs/{run_id}/cancel",
              ],
              stdout=subprocess.DEVNULL,
              stderr=subprocess.DEVNULL,
          )
          print("FTMO_STALE_RUN_CANCEL_REQUESTED", run_id)
          PY
