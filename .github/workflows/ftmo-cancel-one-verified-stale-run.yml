name: Cancel verified stale FTMO Worker5 CI runs

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-cancel-one-verified-stale-run.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ftmo-cancel-verified-stale-worker5
  cancel-in-progress: true

jobs:
  cancel:
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 3
    steps:
      - name: Cancel only verified superseded Worker5 PR runs
        shell: bash
        env:
          REQUIRED_PROOF_RUN: "37001495182"
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          gh auth status >/dev/null 2>&1

          python3 - <<'PY'
          import json
          import os
          import subprocess

          TARGETS = (
              {
                  "pr": 432,
                  "sha": "f0a372ee08a8e7e6c3af2467604ac3e21495a9d6",
                  "merged": False,
                  "requires_proof": False,
              },
              {
                  "pr": 435,
                  "sha": "0c3b81e7afe641ddd78084c4321cd3b4d590b2cb",
                  "merged": True,
                  "requires_proof": True,
              },
          )

          def gh_json(path):
              raw = subprocess.check_output(
                  ["gh", "api", "-H", "X-GitHub-Api-Version: 2022-11-28", path],
                  text=True,
                  stderr=subprocess.DEVNULL,
              )
              return json.loads(raw)

          proof_run_id = os.environ["REQUIRED_PROOF_RUN"]
          proof = gh_json(f"repos/Zennay/zCloud/actions/runs/{proof_run_id}")
          if (proof.get("status"), proof.get("conclusion")) != ("completed", "success"):
              raise SystemExit("required PR435 exact-head zCloud proof is not green")

          candidates = []
          for target in TARGETS:
              pr = gh_json(f"repos/Zennay/Ftmo/pulls/{target['pr']}")
              if int(pr.get("number") or 0) != target["pr"]:
                  raise SystemExit(f"PR identity mismatch: {target['pr']}")
              if pr.get("state") != "closed":
                  raise SystemExit(f"PR{target['pr']} is not closed")
              if bool(pr.get("merged")) != target["merged"]:
                  raise SystemExit(f"PR{target['pr']} merged-state mismatch")
              if (pr.get("head") or {}).get("sha") != target["sha"]:
                  raise SystemExit(f"PR{target['pr']} head SHA mismatch")

              payload = gh_json(
                  f"repos/Zennay/Ftmo/actions/runs?head_sha={target['sha']}&per_page=100"
              )
              for run in payload.get("workflow_runs") or []:
                  if run.get("head_sha") != target["sha"]:
                      continue
                  if run.get("status") not in {"queued", "pending", "in_progress"}:
                      continue
                  candidates.append({
                      "id": int(run["id"]),
                      "name": run.get("name"),
                      "status": run.get("status"),
                      "pr": target["pr"],
                  })

          print("FTMO_WORKER5_STALE_CANDIDATES=" + json.dumps(candidates, sort_keys=True))
          for run in candidates:
              subprocess.check_call(
                  [
                      "gh", "api",
                      "--method", "POST",
                      "-H", "X-GitHub-Api-Version: 2022-11-28",
                      f"repos/Zennay/Ftmo/actions/runs/{run['id']}/cancel",
                  ],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              )
              print(f"FTMO_WORKER5_STALE_CANCEL_REQUESTED={run['id']}")

          print(f"FTMO_WORKER5_STALE_CANCEL_COUNT={len(candidates)}")
          PY
