name: Cancel verified stale FTMO PR435 CI runs

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-cancel-one-verified-stale-run.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ftmo-cancel-verified-stale-pr435
  cancel-in-progress: true

jobs:
  cancel:
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 3
    steps:
      - name: Cancel only nonterminal runs for merged PR435 exact head
        shell: bash
        env:
          TARGET_SHA: "0c3b81e7afe641ddd78084c4321cd3b4d590b2cb"
          TARGET_PR: "435"
          REQUIRED_PROOF_RUN: "37001495182"
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          gh auth status >/dev/null 2>&1

          python3 - <<'PY'
          import json
          import os
          import subprocess

          def gh_json(path):
              raw = subprocess.check_output(
                  ["gh", "api", "-H", "X-GitHub-Api-Version: 2022-11-28", path],
                  text=True,
                  stderr=subprocess.DEVNULL,
              )
              return json.loads(raw)

          target_sha = os.environ["TARGET_SHA"]
          pr_number = os.environ["TARGET_PR"]
          proof_run_id = os.environ["REQUIRED_PROOF_RUN"]

          pr = gh_json(f"repos/Zennay/Ftmo/pulls/{pr_number}")
          if int(pr.get("number") or 0) != int(pr_number):
              raise SystemExit("PR identity mismatch")
          if pr.get("state") != "closed" or not pr.get("merged"):
              raise SystemExit("PR435 is not closed+merged")
          if (pr.get("head") or {}).get("sha") != target_sha:
              raise SystemExit("PR435 head SHA mismatch")

          proof = gh_json(f"repos/Zennay/zCloud/actions/runs/{proof_run_id}")
          if (proof.get("status"), proof.get("conclusion")) != ("completed", "success"):
              raise SystemExit("required exact-head zCloud proof is not green")

          payload = gh_json(f"repos/Zennay/Ftmo/actions/runs?head_sha={target_sha}&per_page=100")
          candidates = []
          for run in payload.get("workflow_runs") or []:
              if run.get("head_sha") != target_sha:
                  continue
              if run.get("status") not in {"queued", "pending", "in_progress"}:
                  continue
              candidates.append({
                  "id": int(run["id"]),
                  "name": run.get("name"),
                  "status": run.get("status"),
              })

          print("FTMO_PR435_STALE_CANDIDATES=" + json.dumps(candidates, sort_keys=True))
          for run in candidates:
              subprocess.check_call(
                  [
                      "gh", "api",
                      "--method", "POST",
                      "-H", "X-GitHub-Api-Version: 2022-11-28",
                      f"repos/Zennay/Ftmo/actions/runs/{run['id']}/cancel",
                  ],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              )
              print(f"FTMO_PR435_STALE_CANCEL_REQUESTED={run['id']}")

          print(f"FTMO_PR435_STALE_CANCEL_COUNT={len(candidates)}")
          PY
