name: zCloud reusable secret inheritance source ratchet

on:
  pull_request:
    branches: [main]
    # Run for every PR; a skipped source gate is not a green safety result.

permissions:
  contents: read

concurrency:
  group: zcloud-reusable-secret-ratchet-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  source-only-ratchet:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Deny untrusted request before checking out PR code
        shell: bash
        env:
          REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$EVENT" = pull_request
          test "$REPO" = Zennay/zCloud
          test "$HEAD_REPO" = "$REPO"
          test "$BASE_REPO" = "$REPO"
          test "$BASE_REF" = main
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reject main drift and prove exact immutable PR HEAD
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git remote get-url origin)" = "https://github.com/Zennay/zCloud"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test -n "$HEAD_REF"
          test "${#HEAD_REF}" -le 200
          git check-ref-format --branch "$HEAD_REF" >/dev/null
          test "$(timeout 15 git ls-remote --exit-code origin refs/heads/main)" = "$BASE_SHA"$'\t'"refs/heads/main"
          test "$(timeout 15 git ls-remote --exit-code origin "refs/heads/$HEAD_REF")" = "$HEAD_SHA"$'\t'"refs/heads/$HEAD_REF"
          git cat-file -e "$BASE_SHA^{commit}"
          python3 -m unittest -v tests.test_zcloud_reusable_secrets_guard_20261015_w3
          python3 scripts/zcloud_reusable_secrets_guard_20261015_w3.py --base "$BASE_SHA" --head "$HEAD_SHA"
          test "$(git remote get-url origin)" = "https://github.com/Zennay/zCloud"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(timeout 15 git ls-remote --exit-code origin refs/heads/main)" = "$BASE_SHA"$'\t'"refs/heads/main"
          test "$(timeout 15 git ls-remote --exit-code origin "refs/heads/$HEAD_REF")" = "$HEAD_SHA"$'\t'"refs/heads/$HEAD_REF"
