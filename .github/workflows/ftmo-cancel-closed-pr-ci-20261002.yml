name: Cancel FTMO closed-PR CI backlog

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-cancel-closed-pr-ci-20261002.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ftmo-cancel-closed-pr-ci-20261002
  cancel-in-progress: false

jobs:
  cancel:
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 5
    steps:
      - name: Cancel only runs bound to closed or merged PRs
        shell: bash
        env:
          RUN_IDS: "36992787393 36992787409 36993490199 36993979548"
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          for run_id in $RUN_IDS; do
            run_json="$(gh api "repos/Zennay/Ftmo/actions/runs/$run_id")"
            status="$(jq -r '.status' <<<"$run_json")"
            pr_number="$(jq -r '.pull_requests[0].number // empty' <<<"$run_json")"
            if [[ -z "$pr_number" ]]; then
              echo "refusing run=$run_id without linked PR"
              exit 1
            fi
            pr_json="$(gh api "repos/Zennay/Ftmo/pulls/$pr_number")"
            pr_state="$(jq -r '.state' <<<"$pr_json")"
            merged_at="$(jq -r '.merged_at // empty' <<<"$pr_json")"
            if [[ "$pr_state" != "closed" ]]; then
              echo "refusing run=$run_id pr=$pr_number state=$pr_state"
              exit 1
            fi
            if [[ "$status" == "queued" || "$status" == "in_progress" || "$status" == "waiting" || "$status" == "pending" ]]; then
              gh api --method POST "repos/Zennay/Ftmo/actions/runs/$run_id/cancel" >/dev/null
              echo "cancel_requested run=$run_id pr=$pr_number merged_at=$merged_at"
            else
              echo "already_terminal run=$run_id pr=$pr_number status=$status"
            fi
          done
          echo "FTMO_CLOSED_PR_CI_CLEANUP=verified"
