name: zCloud OOM guard VPS validation

on:
  pull_request:
    branches: [main]
    paths:
      - "server.py"
      - "scripts/zcloud_worker_watchdog.py"
      - "scripts/zcloud_healthcheck.py"
      - "scripts/zcloud_vps_runner_guard.py"
      - "tests/test_worker_memory_guard.py"
      - "tests/test_worker_progress_watchdog.py"
      - "tests/test_portfolio_queue_backend.py"
      - "tests/test_runner_smoke.py"
      - "tests/test_zcloud_healthcheck.py"
      - "scripts/zcloud-self-heal.sh"
      - "tests/test_self_heal_assets.py"
      - "tests/test_zcloud_oom_guard_vps_validation_workflow.py"
      - ".github/workflows/zcloud-oom-guard-vps-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zcloud-oom-guard-vps-validation-${{ github.event_name == 'pull_request' && github.ref || 'live' }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_ZCLOUD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact zCloud candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.EXPECTED_ZCLOUD_SHA }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact zCloud candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_ZCLOUD_SHA"

      - name: Validate OOM workflow trust contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v tests.test_zcloud_oom_guard_vps_validation_workflow

      - name: Compile OOM recovery paths
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile server.py scripts/zcloud_worker_watchdog.py scripts/zcloud_healthcheck.py

      - name: Run focused worker recovery regression suite
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v \
            tests.test_worker_memory_guard \
            tests.test_worker_progress_watchdog \
            tests.test_zcloud_healthcheck \
            tests.test_self_heal_assets \
            tests.test_portfolio_queue_backend \
            tests.test_runner_smoke

  probe:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'Zennay/zCloud' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 10
    env:
      EXPECTED_ZCLOUD_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact trusted zCloud revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.EXPECTED_ZCLOUD_SHA }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify permanent VPS runner and exact revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_ZCLOUD_SHA"
          test "$(id -un)" = "ubuntu"
          python3 scripts/zcloud_vps_runner_guard.py --json

      - name: Compile OOM recovery paths
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile server.py scripts/zcloud_worker_watchdog.py scripts/zcloud_healthcheck.py

      - name: Run focused worker recovery regression suite
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v \
            tests.test_worker_memory_guard \
            tests.test_worker_progress_watchdog \
            tests.test_zcloud_healthcheck \
            tests.test_self_heal_assets \
            tests.test_portfolio_queue_backend \
            tests.test_runner_smoke

      - name: Probe live VPS memory and swap without changing runtime
        shell: bash
        run: |
          set -euo pipefail
          echo "HOST=$(hostname)"
          free -h
          swapon --show || true
          python3 - <<'PY'
          import json
          import server
          status = server.worker_memory_status()
          print("WORKER_MEMORY_GUARD=" + json.dumps(status, sort_keys=True))
          if not status.get("total_mb"):
              raise SystemExit("MemTotal unavailable")
          PY
          echo "RECENT_OOM_EVENTS"
          journalctl -k --since "-6 hours" --no-pager 2>/dev/null \
            | grep -Ei "oom-kill|out of memory|killed process" \
            | tail -n 80 || true
          echo "ZCLOUD_OOM_GUARD_VPS_GREEN=1"
