name: zCloud restart pending reconcile proof

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/zcloud-restart-workers.yml
      - .github/workflows/zcloud-restart-workers-pending-reconcile-proof.yml
      - tests/test_restart_workers_pending_reconcile.py
      - tests/test_restart_workers_firefox_timeout.py
      - tests/test_restart_workers_allocation_churn.py
  push:
    branches: [main]
    paths:
      - .github/workflows/zcloud-restart-workers.yml
      - .github/workflows/zcloud-restart-workers-pending-reconcile-proof.yml
      - tests/test_restart_workers_pending_reconcile.py
      - tests/test_restart_workers_firefox_timeout.py
      - tests/test_restart_workers_allocation_churn.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zcloud-restart-pending-reconcile-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    if: github.event_name != 'pull_request' || (github.actor == 'Zennay' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 5
    env:
      EXPECTED_ZCLOUD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact zCloud proof revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 1

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_ZCLOUD_SHA"
          printf 'ZCLOUD_RESTART_RECONCILE_EXACT_CHECKOUT_GREEN sha=%s\n' "$actual"

      - name: Enforce permanent zCloud VPS runner identity
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/zcloud_vps_runner_guard.py --json

      - name: Run restart reconciliation contract tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v \
            tests.test_restart_workers_firefox_timeout \
            tests.test_restart_workers_allocation_churn \
            tests.test_restart_workers_pending_reconcile

      - name: Mark restart reconciliation proof green
        run: echo "ZCLOUD_RESTART_PENDING_RECONCILE_PROOF_GREEN=1"
