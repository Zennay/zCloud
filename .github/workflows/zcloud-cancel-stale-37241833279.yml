name: Cancel one verified stale zCloud deploy

on:
  push:
    branches: ["worker/zcloud-generic-stale-deploy-cleanup-20261004"]
    paths:
      - ".github/workflows/zcloud-cancel-stale-37241833279.yml"

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      TARGET_RUN: "37241833279"
      TARGET_SHA: "5d44680836e7ccf4bef1bc109e0cbeab21e9b72a"
      EXPECTED_MAIN: "a7f8673a21d8afafe5b7ec96032db36d5f358379"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Cancel only the verified superseded deploy
        shell: bash
        run: |
          set -euo pipefail

          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          test "$current_main" = "$EXPECTED_MAIN"

          raw="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$TARGET_RUN")"
          name="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["name"])' <<<"$raw")"
          path="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["path"])' <<<"$raw")"
          head_sha="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["head_sha"])' <<<"$raw")"
          status="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])' <<<"$raw")"

          test "$name" = "zCloud VPS deploy"
          test "$path" = ".github/workflows/zcloud-vps-deploy.yml"
          test "$head_sha" = "$TARGET_SHA"
          test "$head_sha" != "$current_main"

          case "$status" in
            queued|in_progress|pending|waiting|requested)
              gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/$TARGET_RUN/cancel" >/dev/null
              echo "ZCLOUD_VERIFIED_STALE_DEPLOY_CANCEL_REQUESTED run_id=$TARGET_RUN sha=$head_sha status=$status"
              ;;
            completed)
              echo "ZCLOUD_VERIFIED_STALE_DEPLOY_ALREADY_TERMINAL run_id=$TARGET_RUN"
              ;;
            *)
              echo "Unexpected target status: $status" >&2
              exit 1
              ;;
          esac
