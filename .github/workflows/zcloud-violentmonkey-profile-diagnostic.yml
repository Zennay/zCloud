# worker-restart diagnostic 2026-10-06T06:03Z
name: zCloud Violentmonkey profile diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/zcloud-violentmonkey-profile-diagnostic.yml"
      - "tests/test_violentmonkey_profile_diagnostic_workflow.py"
    types: [opened, synchronize, reopened]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/zcloud-violentmonkey-profile-diagnostic.yml"

permissions:
  contents: read

concurrency:
  group: zcloud-violentmonkey-profile-diagnostic-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'live' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      EXPECTED_ZCLOUD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.EXPECTED_ZCLOUD_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate diagnostic trust contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_ZCLOUD_SHA"
          python3 -m unittest -v tests.test_violentmonkey_profile_diagnostic_workflow

  inspect:
    if: github.event_name != 'pull_request' && github.repository == 'Zennay/zCloud' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 5
    env:
      EXPECTED_ZCLOUD_SHA: ${{ github.sha }}
    steps:
      - name: Check out exact diagnostic source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.EXPECTED_ZCLOUD_SHA }}
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact candidate and permanent runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_ZCLOUD_SHA"
          test "$(id -un)" = ubuntu
          python3 scripts/zcloud_vps_runner_guard.py --json

      - name: Inspect Firefox profile and userscript runtime
        shell: bash
        env:
          XDG_RUNTIME_DIR: /run/user/1000
          DBUS_SESSION_BUS_ADDRESS: unix:path=/run/user/1000/bus
        run: |
          set -euo pipefail
          # Stop the managed browser before snapshotting its Violentmonkey IDB.
          # Restart only through systemd afterwards; spawning /usr/bin/firefox
          # directly here creates a second orphan browser tree beside web-ext.
          restore_managed_firefox() {
            systemctl --user reset-failed chatgpt-firefox.service || true
            systemctl --user start chatgpt-firefox.service || true
          }
          trap restore_managed_firefox EXIT
          systemctl --user stop chatgpt-firefox.service || true
          python3 - <<'PY'
          import configparser
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          home = Path.home()
          roots = [
              home / "snap/firefox/common/.mozilla/firefox",
              home / ".mozilla/firefox",
          ]

          proc = subprocess.run(
              ["pgrep", "-u", str(os.getuid()), "-f", r"/snap/firefox/.*/usr/lib/firefox/firefox"],
              text=True, capture_output=True, check=False,
          )
          pids = [int(x) for x in proc.stdout.split() if x.isdigit()]
          main_pids = []
          for pid in pids:
              try:
                  cmd = Path(f"/proc/{pid}/cmdline").read_bytes().replace(b"\0", b" ").decode("utf-8", "replace").strip()
              except OSError:
                  continue
              if " -contentproc " not in f" {cmd} " and "/usr/lib/firefox/firefox" in cmd:
                  main_pids.append(pid)

          profiles = []
          for root in roots:
              ini = root / "profiles.ini"
              configured = {}
              if ini.exists():
                  parser = configparser.ConfigParser()
                  parser.read(ini, encoding="utf-8")
                  for section in parser.sections():
                      if not section.lower().startswith("profile"):
                          continue
                      path = parser.get(section, "Path", fallback="")
                      is_relative = parser.getboolean(section, "IsRelative", fallback=True)
                      profile_path = (root / path) if is_relative else Path(path)
                      configured[str(profile_path.resolve())] = {
                          "section": section,
                          "name": parser.get(section, "Name", fallback=""),
                          "default": parser.get(section, "Default", fallback="0") == "1",
                      }

              if not root.exists():
                  continue
              for profile in sorted(p for p in root.iterdir() if p.is_dir()):
                  resolved = str(profile.resolve())
                  extensions = []
                  ext_json = profile / "extensions.json"
                  if ext_json.exists():
                      try:
                          data = json.loads(ext_json.read_text(encoding="utf-8"))
                          for addon in data.get("addons") or []:
                              text = " ".join(str(addon.get(k) or "") for k in ("id","name","path","sourceURI")).lower()
                              if "violentmonkey" in text or "violent" in text:
                                  extensions.append({
                                      "id": addon.get("id"),
                                      "name": addon.get("name"),
                                      "active": addon.get("active"),
                                      "userDisabled": addon.get("userDisabled"),
                                      "appDisabled": addon.get("appDisabled"),
                                      "path": addon.get("path"),
                                  })
                      except Exception as exc:
                          extensions.append({"extensions_json_error": str(exc)[:300]})

                  vm_files = []
                  for pattern in (
                      "**/*violentmonkey*",
                      "**/*Violentmonkey*",
                      "**/storage.js",
                  ):
                      for match in profile.glob(pattern):
                          try:
                              if match.is_file():
                                  vm_files.append(str(match.relative_to(profile)))
                          except OSError:
                              pass
                          if len(vm_files) >= 30:
                              break
                      if len(vm_files) >= 30:
                          break

                  lock = any((profile / name).exists() for name in ("parent.lock", ".parentlock", "lock"))
                  profiles.append({
                      "path": resolved,
                      "configured": configured.get(resolved),
                      "locked_or_active_hint": lock,
                      "violentmonkey_addons": extensions,
                      "violentmonkey_related_files": sorted(set(vm_files))[:30],
                      "prefs_exists": (profile / "prefs.js").exists(),
                      "times_json_exists": (profile / "times.json").exists(),
                  })

          # Identify profile paths actually held open by the main Firefox process.
          open_profile_paths = set()
          for pid in main_pids:
              found = set()
              fd_root = Path(f"/proc/{pid}/fd")
              try:
                  fds = list(fd_root.iterdir())
              except OSError:
                  fds = []
              for fd in fds[:2048]:
                  try:
                      target = Path(os.readlink(fd))
                  except OSError:
                      continue
                  for profile in profiles:
                      p = profile["path"]
                      if str(target).startswith(p + "/") or str(target) == p:
                          found.add(p)
              open_profile_paths.update(found)

          runtime_storage = []
          for profile in profiles:
              profile_path = Path(profile["path"])
              if not profile.get("prefs_exists"):
                  continue

              uuid_map = {}
              prefs = profile_path / "prefs.js"
              try:
                  prefs_text = prefs.read_text(encoding="utf-8", errors="replace")
                  match = re.search(
                      r'user_pref\("extensions\\.webextensions\\.uuids",\s*"(.*)"\);',
                      prefs_text,
                  )
                  if match:
                      encoded = bytes(match.group(1), "utf-8").decode("unicode_escape")
                      uuid_map = json.loads(encoded)
              except Exception:
                  uuid_map = {}

              vm_uuid = str(uuid_map.get("{aecec67f-0d10-4fa7-b7c7-609a2db280cf}") or "")
              candidates = []
              storage = profile_path / "storage" / "default"
              if storage.exists():
                  if vm_uuid:
                      compact = vm_uuid.strip("{}")
                      candidates.extend(sorted(storage.glob(f"moz-extension+++{compact}*")))
                  # Firefox may keep the internal UUID only in startup caches.
                  # Scan extension origins when the prefs mapping is unavailable.
                  candidates.extend(sorted(storage.glob("moz-extension+++*")))
              bed_root = profile_path / "browser-extension-data"
              if bed_root.exists():
                  candidates.extend(sorted(p for p in bed_root.iterdir() if p.is_dir()))
              candidates = list(dict.fromkeys(candidates))

              hits = []
              inventory = []
              scanned = 0
              for root in candidates:
                  if not root.exists():
                      continue
                  for path in root.rglob("*"):
                      if not path.is_file():
                          continue
                      try:
                          size = path.stat().st_size
                      except OSError:
                          continue
                      if size > 32 * 1024 * 1024:
                          continue
                      scanned += 1
                      if len(inventory) < 80:
                          inventory.append({
                              "path": str(path.relative_to(profile_path)),
                              "size": size,
                          })
                      try:
                          data = path.read_bytes()
                      except OSError:
                          continue
                      markers = (
                          "zcloud dynamic worker",
                          "zcloud-worker",
                          "zcloud_worker",
                          "violentmonkey-primary-runner",
                          "zcloud.local",
                      )
                      matched_encodings = []
                      for encoding in ("utf-8", "utf-16le", "utf-16be"):
                          haystack = data.lower()
                          for marker in markers:
                              encoded = marker.encode(encoding).lower()
                              if encoded in haystack:
                                  matched_encodings.append(encoding + ":" + marker)
                      if matched_encodings:
                          hits.append({
                              "path": str(path.relative_to(profile_path)),
                              "size": size,
                              "matches": sorted(set(matched_encodings)),
                          })
                      if len(hits) >= 30:
                          break
                  if len(hits) >= 30:
                      break

              runtime_storage.append({
                  "profile": str(profile_path),
                  "violentmonkey_internal_uuid": vm_uuid,
                  "candidate_roots": [str(x.relative_to(profile_path)) for x in candidates],
                  "scanned_files": scanned,
                  "inventory": inventory,
                  "zcloud_hits": hits,
              })

          result = {
              "main_firefox_count": len(main_pids),
              "open_profile_paths": sorted(open_profile_paths),
              "profiles": profiles,
              "violentmonkey_runtime_storage": runtime_storage,
          }
          print(json.dumps(result, ensure_ascii=False, indent=2, sort_keys=True))
          PY

# push-test diagnostic 2026-10-04

      - name: Snapshot installed zCloud userscript safely
        shell: bash
        env:
          XDG_RUNTIME_DIR: /run/user/1000
          DBUS_SESSION_BUS_ADDRESS: unix:path=/run/user/1000/bus
        run: |
          set -euo pipefail
          restore_managed_firefox() {
            systemctl --user reset-failed chatgpt-firefox.service || true
            systemctl --user start chatgpt-firefox.service || true
          }
          trap restore_managed_firefox EXIT
          systemctl --user stop chatgpt-firefox.service || true
          python3 - <<'PY'
          import json, os, shutil, signal, sqlite3, subprocess, time
          from pathlib import Path

          home=Path.home()
          profile=home/"snap/firefox/common/.mozilla/firefox/vn6i5j5p.default"
          db=profile/"storage/default/moz-extension+++1e84f8a6-6cfe-433a-91a0-8d757fdc30bb^userContextId=4294967295/idb/3647222921wleabcEoxlt-eengsairo.sqlite"
          if not db.exists():
              raise SystemExit("Violentmonkey IDB not found")

          proc=subprocess.run(["pgrep","-u",str(os.getuid()),"-f",r"/snap/firefox/.*/usr/lib/firefox/firefox"],text=True,capture_output=True,check=False)
          pids=[]
          for raw in proc.stdout.split():
              if not raw.isdigit(): continue
              pid=int(raw)
              try:
                  cmd=Path(f"/proc/{pid}/cmdline").read_bytes().replace(b"\0",b" ").decode("utf-8","replace").strip()
              except OSError:
                  continue
              if " -contentproc " not in f" {cmd} " and "/usr/lib/firefox/firefox" in cmd:
                  pids.append(pid)

          for p in pids:
              try: os.kill(p,signal.SIGTERM)
              except ProcessLookupError: pass
          deadline=time.time()+15
          while time.time()<deadline:
              alive=[]
              for p in pids:
                  try: os.kill(p,0); alive.append(p)
                  except ProcessLookupError: pass
              if not alive: break
              time.sleep(.5)
          for p in alive if 'alive' in locals() else []:
              try: os.kill(p,signal.SIGKILL)
              except ProcessLookupError: pass
          time.sleep(2)

          snap=Path(os.environ["RUNNER_TEMP"])/"violentmonkey-idb"
          snap.mkdir(parents=True,exist_ok=True)
          for suffix in ("","-wal","-shm"):
              src=Path(str(db)+suffix)
              if src.exists(): shutil.copy2(src,snap/src.name)

          markers=[
              "zCloud Dynamic Worker","@version","prompt-missing-worker-line",
              "VPS_QUEUE_ASSIGNMENT","Jij bent Worker",
              "prompt-missing-project-instruction",
              "Kijk in Notion in welke fase het project zit"
          ]
          con=sqlite3.connect(f"{db.resolve().as_uri()}?mode=ro", uri=True, timeout=5)
          tables=[r[0] for r in con.execute("SELECT name FROM sqlite_master WHERE type='table' ORDER BY name")]
          result={"tables":[],"records":[]}
          for table in tables:
              try:
                  cols=[r[1] for r in con.execute(f'PRAGMA table_info("{table}")')]
                  rows=con.execute(f'SELECT rowid,* FROM "{table}"').fetchall()
              except Exception:
                  continue
              result["tables"].append({"name":table,"columns":cols,"rows":len(rows)})
              for row in rows:
                  hits=[]
                  for pos,val in enumerate(row):
                      if isinstance(val,bytes):
                          variants=[]
                          for enc in ("utf-8","utf-16le","utf-16be"):
                              try: variants.append((enc,val.decode(enc,errors="ignore")))
                              except Exception: pass
                      elif isinstance(val,str):
                          variants=[("text",val)]
                      else: continue
                      for enc,s in variants:
                          low=s.lower()
                          found=[m for m in markers if m.lower() in low]
                          if found:
                              hits.append({
                                  "position": pos,
                                  "column": cols[pos-1] if pos>0 and pos-1<len(cols) else "rowid",
                                  "encoding": enc,
                                  "markers": found,
                              })
                  if hits:
                      result["records"].append({"table":table,"rowid":row[0],"hits":hits})
          print("VM_DB_INSPECT="+json.dumps(result,ensure_ascii=False))
          con.close()

          PY

          restore_managed_firefox
          trap - EXIT
          for _ in $(seq 1 30); do
            if systemctl --user is-active --quiet chatgpt-firefox.service; then
              break
            fi
            sleep 1
          done
          systemctl --user is-active chatgpt-firefox.service
          main_pid="$(systemctl --user show -p MainPID --value chatgpt-firefox.service)"
          echo "VM_DIAGNOSTIC_MANAGED_RESTART_GREEN main_pid=$main_pid"
          echo "ZCLOUD_VIOLENTMONKEY_PROFILE_DIAGNOSTIC_GREEN=1"

# push-test diagnostic rerun after prompt-contract repair 2026-10-04
