name: Recover zCloud listener after PWQ-24 r12

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/zcloud-listener-recovery-pwq24-r12.yml"

permissions:
  contents: read

concurrency:
  group: zcloud-listener-recovery-pwq24-r12
  cancel-in-progress: false

jobs:
  recover:
    runs-on: [self-hosted, ftmo-research]
    timeout-minutes: 4
    steps:
      - name: Recover only idle or unhealthy zCloud Actions listener
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = "vps-bb300bba"

          service="actions.runner.Zennay-zCloud.zcloud-vps-1.service"
          runner_root="/home/ubuntu/actions-runner-zcloud"

          pre_state="$(systemctl is-active "$service" || true)"
          pre_pid="$(systemctl show "$service" -p MainPID --value || true)"
          cgroup="$(systemctl show "$service" -p ControlGroup --value || true)"
          echo "ZCLOUD_LISTENER_PRE state=$pre_state pid=$pre_pid cgroup=$cgroup"

          worker_count=0
          listener_count=0
          for proc in /proc/[0-9]*; do
            pid="${proc##*/}"
            cmd="$(tr '\0' ' ' < "$proc/cmdline" 2>/dev/null || true)"
            [[ "$cmd" == *"$runner_root/bin/Runner.Worker"* ]] && worker_count=$((worker_count+1))
            [[ "$cmd" == *"$runner_root/bin/Runner.Listener"* ]] && listener_count=$((listener_count+1))
          done
          echo "ZCLOUD_LISTENER_PROCESSES listeners=$listener_count workers=$worker_count"

          action=none
          if [[ "$worker_count" -gt 0 ]]; then
            action=preserve-active-worker
          elif [[ "$pre_state" != "active" ]]; then
            sudo -n systemctl reset-failed "$service" || true
            sudo -n systemctl start "$service"
            action=start-inactive-listener
          elif [[ "$listener_count" -eq 1 ]]; then
            action=preserve-healthy-listener
          else
            sudo -n systemctl restart "$service"
            action=restart-unhealthy-listener
          fi

          post_state=""
          for _ in $(seq 1 30); do
            post_state="$(systemctl is-active "$service" || true)"
            [[ "$post_state" == "active" ]] && break
            sleep 2
          done
          test "$post_state" = "active"

          mapfile -t listeners < <(
            for proc in /proc/[0-9]*; do
              pid="${proc##*/}"
              cmd="$(tr '\0' ' ' < "$proc/cmdline" 2>/dev/null || true)"
              [[ "$cmd" == *"$runner_root/bin/Runner.Listener"* ]] && echo "$pid"
            done
          )
          test "${#listeners[@]}" -eq 1
          post_pid="$(systemctl show "$service" -p MainPID --value)"
          [[ "$post_pid" =~ ^[1-9][0-9]*$ ]]

          echo "ZCLOUD_LISTENER_RECOVERY action=$action state=$post_state pid=$post_pid listener=${listeners[0]}"
          systemctl show "$service" -p ActiveState -p SubState -p MainPID -p NRestarts -p Result -p ExecMainStatus --no-pager
          journalctl -u "$service" --since "-30 min" --no-pager 2>/dev/null | tail -80 || true
