name: Control-plane receipt contract W4

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'tests/test_runner_command_*_w4.py'
      - 'docs/control-plane-runner-command-terminal-receipt-handoff-w4.md'
      - '.github/workflows/control-plane-receipt-contract-w4.yml'

# Do not spend runner slots on superseded revisions of this draft PR.
# Concurrency is scoped to this workflow and PR/ref, not other zCloud jobs.
concurrency:
  group: receipt-contract-w4-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  receipt-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated control-plane receipt contracts
        shell: bash
        run: |
          set -o pipefail
          python3 -m unittest discover -s tests -p 'test_runner_command_*_w4.py' -v 2>&1 | tee receipt-test-results.log
          # unittest exits 0 even when discovery finds zero tests. Require
          # the reviewed suite's minimum size so path/rename regressions
          # cannot yield a misleading green result.
          # A missing summary must reach our explicit error rather than
          # aborting the shell early through errexit/pipefail.
          total="$(grep -oE '^Ran [0-9]+ tests?' receipt-test-results.log | tail -1 | awk '{print $2}' || true)"
          if [[ ! "$total" =~ ^[0-9]+$ ]] || (( total < 67 )); then
            echo "::error title=Receipt test discovery gap::Expected at least 67 tests, found ${total:-none}."
            exit 1
          fi
          echo '## Control-plane receipt contract' >> "$GITHUB_STEP_SUMMARY"
          grep -E '^Ran [0-9]+ tests|^OK' receipt-test-results.log >> "$GITHUB_STEP_SUMMARY" || true
          # An unexpected success means a known defect may have been fixed;
          # unittest still reports it as a failure, forcing its xfail marker
          # to be removed and its passing assertion reviewed explicitly.
          # Even a green unittest exit can hide a newly added xfail that
          # replaces an older known issue. Pin the baseline names, not just
          # the total, in an independently reviewed follow-up before merge.
          if grep -q '^OK (expected failures=' receipt-test-results.log; then
            count="$(grep -oE 'expected failures=[0-9]+' receipt-test-results.log | tail -1 | cut -d= -f2)"
            echo "::warning title=Known production contract gaps::Receipt contract suite passed with ${count} expected failures; green CI does not establish remediation."
            echo "**Known production defects remain:** ${count} expected-failure probes. Do not treat this job as a production remediation gate." >> "$GITHUB_STEP_SUMMARY"
            # Keep the known gap budget from silently growing. Decreasing
            # this count is allowed only when production defects are fixed.
            if (( count > 13 )); then
              echo "::error title=New masked regressions::Expected failures increased above the reviewed baseline of 13."
              exit 1
            fi
          else
            echo "**Expected-failure probes:** none reported. Review whether all known production gates are now fixed before treating this as remediation evidence." >> "$GITHUB_STEP_SUMMARY"
          fi
          # Include the names of every remaining expected failure for reviewer
          # visibility; counts alone can conceal changes in the set of defects.
          echo '### Known-defect probes' >> "$GITHUB_STEP_SUMMARY"
          if grep -F '... expected failure' receipt-test-results.log |
               sed -E 's/ \(test_runner_command_/ (test_runner_command_/' |
               sed 's/^/- `/;s/$/`/' >> "$GITHUB_STEP_SUMMARY"; then
            :
          else
            echo 'No expected-failure probes were reported.' >> "$GITHUB_STEP_SUMMARY"
          fi
