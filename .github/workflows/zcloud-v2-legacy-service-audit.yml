name: zCloud v2 legacy worker service audit

# Pull requests must never execute diagnostic commands on the permanent VPS.
# A trusted manual main dispatch can read a bounded legacy-service snapshot.
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/zcloud-v2-legacy-service-audit.yml
      - tests/test_zcloud_v2_legacy_service_audit_trust_20261013_w1.py
      - scripts/zcloud_v2_legacy_service_inventory_20261014.py
      - tests/test_zcloud_v2_legacy_service_inventory_20261014.py
  workflow_dispatch:
    inputs:
      confirm_sha:
        description: "Explicit exact current main SHA for read-only VPS inventory"
        type: string
        required: true
      approve_readonly_probe:
        description: "I explicitly authorize a metadata-only VPS service inventory at the confirmed main SHA"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: zcloud-v2-legacy-service-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout immutable PR head revision without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          clean: true
      - name: Validate isolated workflow trust contracts (hosted only)
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python3 -m unittest -v tests.test_zcloud_v2_legacy_service_audit_trust_20261013_w1 tests.test_zcloud_v2_legacy_service_inventory_20261014

  inspect:
    name: Explicit trusted-main VPS legacy worker service inventory
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'Zennay/zCloud' &&
      github.actor == 'Zennay' &&
      github.triggering_actor == 'Zennay' &&
      github.run_attempt == 1 &&
      inputs.approve_readonly_probe == true &&
      inputs.confirm_sha == github.sha
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 5
    steps:
      - name: Checkout exact trusted main commit without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Enforce exact commit and permanent VPS identity before any live reads
        shell: bash
        env:
          CONFIRMED_SHA: ${{ inputs.confirm_sha }}
          APPROVE_READONLY: ${{ inputs.approve_readonly_probe }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = 'workflow_dispatch'
          test "$GITHUB_REPOSITORY" = 'Zennay/zCloud'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$GITHUB_ACTOR" = 'Zennay'
          test "$GITHUB_TRIGGERING_ACTOR" = 'Zennay'
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$APPROVE_READONLY" = 'true'
          [[ "$CONFIRMED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$CONFIRMED_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$CONFIRMED_SHA"
          # Reject stale manual dispatch if main advanced before runner execution.
          current_main="$(timeout 15 git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          test -n "$current_main"
          test "$current_main" = "$CONFIRMED_SHA"
          test "$(hostname)" = 'vps-bb300bba'
          test "$(id -un)" = 'ubuntu'
          # Runner identity guard returns trusted status only. Its JSON also
          # includes machine and runner names; never leak those to Actions.
          if ! python3 scripts/zcloud_vps_runner_guard.py --json >/dev/null 2>&1; then
            echo 'ZCLOUD_V2_LEGACY_RUNNER_IDENTITY_DENIED=1'
            exit 2
          fi
      - name: Read-only bounded worker service inventory
        shell: bash
        env:
          XDG_RUNTIME_DIR: /run/user/1000
          DBUS_SESSION_BUS_ADDRESS: unix:path=/run/user/1000/bus
          CONFIRMED_SHA: ${{ inputs.confirm_sha }}
          APPROVE_READONLY: ${{ inputs.approve_readonly_probe }}
        run: |
          set -euo pipefail
          # Admission is time-sensitive. Recheck immediately before any VPS
          # process/systemd probe, not only in the preceding validation step.
          test "$GITHUB_EVENT_NAME" = 'workflow_dispatch'
          test "$GITHUB_REPOSITORY" = 'Zennay/zCloud'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$GITHUB_ACTOR" = 'Zennay'
          test "$GITHUB_TRIGGERING_ACTOR" = 'Zennay'
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$APPROVE_READONLY" = 'true'
          test "$(git rev-parse HEAD)" = "$CONFIRMED_SHA"
          current_main="$(timeout 15 git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          test -n "$current_main"
          test "$current_main" = "$CONFIRMED_SHA"
          # Private process IDs, unit descriptions, user paths and browser
          # metadata must never be printed to public Actions output.
          # This module emits a bounded allowlisted JSON summary only.
          python3 scripts/zcloud_v2_legacy_service_inventory_20261014.py
