name: VPS CPU diagnostic snapshot

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  cpu-snapshot:
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 8
    steps:
      - name: Rebalance VPS toward FTMO
        shell: bash
        run: |
          set -euo pipefail

          echo "=== BEFORE ==="
          uptime
          free -h
          systemctl is-active actions.runner.Zennay-RaiseAI.vps-bb300bba.service || true
          systemctl is-active haxlab-analyzer.service || true
          systemctl is-active ftmo-autonomous-marathon.service || true

          echo "=== STOP RAISEAI RUNNER + BUILD ==="
          sudo -n systemctl stop actions.runner.Zennay-RaiseAI.vps-bb300bba.service || true
          pkill -TERM -f '/home/ubuntu/actions-runner-raiseai/_work/RaiseAI/RaiseAI' || true
          sleep 3
          if pgrep -af '/home/ubuntu/actions-runner-raiseai/_work/RaiseAI/RaiseAI'; then
            pkill -KILL -f '/home/ubuntu/actions-runner-raiseai/_work/RaiseAI/RaiseAI' || true
          fi

          echo "=== STOP HAXLAB ANALYZER ==="
          sudo -n systemctl stop haxlab-analyzer.service

          echo "=== START / KEEP FTMO MARATHON ==="
          sudo -n systemctl reset-failed ftmo-autonomous-marathon.service || true
          sudo -n systemctl start ftmo-autonomous-marathon.service
          sleep 5

          echo "=== VERIFY ==="
          raise_state="$(systemctl is-active actions.runner.Zennay-RaiseAI.vps-bb300bba.service || true)"
          hax_analyzer_state="$(systemctl is-active haxlab-analyzer.service || true)"
          ftmo_state="$(systemctl is-active ftmo-autonomous-marathon.service || true)"
          echo "raiseai_runner=$raise_state"
          echo "haxlab_analyzer=$hax_analyzer_state"
          echo "ftmo_marathon=$ftmo_state"

          test "$raise_state" != "active"
          test "$hax_analyzer_state" != "active"
          test "$ftmo_state" = "active"

          echo "=== FTMO SERVICE ==="
          systemctl show ftmo-autonomous-marathon.service \
            -p ActiveState -p SubState -p MainPID -p CPUWeight -p CPUQuotaPerSecUSec -p MemoryCurrent \
            --no-pager
          sudo -n journalctl -u ftmo-autonomous-marathon.service -n 30 --no-pager || true

          echo "=== REMAINING HEAVY PROCESSES ==="
          ps -eo pid,ppid,user,psr,%cpu,%mem,etime,stat,cmd --sort=-%cpu | head -n 35
          echo "=== LOAD AFTER ==="
          uptime
          free -h

      - name: Host overview
        shell: bash
        run: |
          set -u
          echo "=== TIME/HOST ==="
          date -Is
          hostname
          uname -a
          echo
          echo "=== LOAD/CPU/MEM ==="
          uptime
          nproc
          cat /proc/loadavg
          free -h
          echo
          echo "=== TOP CPU PROCESSES (ps lifetime avg) ==="
          ps -eo pid,ppid,user,psr,%cpu,%mem,etime,stat,cmd --sort=-%cpu | head -n 80
          echo
          echo "=== INSTANTANEOUS TOP SAMPLE 1 ==="
          COLUMNS=260 top -b -n1 -o %CPU | head -n 80 || true
          sleep 2
          echo
          echo "=== INSTANTANEOUS TOP SAMPLE 2 ==="
          COLUMNS=260 top -b -n1 -o %CPU | head -n 80 || true
          sleep 2
          echo
          echo "=== INSTANTANEOUS TOP SAMPLE 3 ==="
          COLUMNS=260 top -b -n1 -o %CPU | head -n 80 || true
          echo
          echo "=== PROJECT/WORKER MATCHES ==="
          ps -ef | grep -Ei 'zcloud|ftmo|haxlab|lightup|raise|supa|firefox|chrom|python|node|runner|actions-runner|playwright|xvfb|openbox' | grep -v grep || true
          echo
          echo "=== RUNNING SYSTEMD SERVICES (selected) ==="
          systemctl --no-pager --type=service --state=running 2>/dev/null | grep -Ei 'runner|zcloud|ftmo|hax|raise|firefox|xvfb|openbox|docker|containerd' || true
          echo
          echo "=== CGROUP CPU SNAPSHOT ==="
          systemd-cgtop -b -n1 -d1 2>/dev/null | head -n 100 || true
