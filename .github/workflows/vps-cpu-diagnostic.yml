name: VPS CPU diagnostic snapshot

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  cpu-snapshot:
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 8
    steps:
      - name: Rebalance VPS toward FTMO
        shell: bash
        run: |
          set -u

          echo "=== KEEP RAISEAI + HAXLAB ANALYZER STOPPED ==="
          sudo -n systemctl stop actions.runner.Zennay-RaiseAI.vps-bb300bba.service || true
          pkill -TERM -f '/home/ubuntu/actions-runner-raiseai/_work/RaiseAI/RaiseAI' || true
          sudo -n systemctl stop haxlab-analyzer.service || true

          echo "=== FTMO INSTALLED UNIT / PRE-STATE ==="
          sudo -n systemctl cat ftmo-autonomous-marathon.service || true
          sudo -n systemctl status ftmo-autonomous-marathon.service --no-pager -n 40 || true
          sudo -n systemctl list-jobs --no-pager | grep -i ftmo || true

          state="$(systemctl is-active ftmo-autonomous-marathon.service || true)"
          echo "ftmo_initial_state=$state"

          if [[ "$state" != "active" ]]; then
            sudo -n systemctl reset-failed ftmo-autonomous-marathon.service || true
            sudo -n systemctl start --no-block ftmo-autonomous-marathon.service || true
          fi

          echo "=== WAIT FOR FTMO ACTIVE ==="
          for i in $(seq 1 30); do
            state="$(systemctl is-active ftmo-autonomous-marathon.service || true)"
            echo "attempt=$i state=$state"
            [[ "$state" == "active" ]] && break
            [[ "$state" == "failed" ]] && break
            sleep 2
          done

          state="$(systemctl is-active ftmo-autonomous-marathon.service || true)"
          if [[ "$state" != "active" ]]; then
            echo "=== FTMO FIRST START DID NOT REACH ACTIVE; DIAGNOSE + ONE BOUNDED RESTART ==="
            sudo -n systemctl status ftmo-autonomous-marathon.service --no-pager -n 80 || true
            sudo -n journalctl -u ftmo-autonomous-marathon.service -n 100 --no-pager || true
            sudo -n systemctl stop ftmo-autonomous-marathon.service || true
            sudo -n systemctl reset-failed ftmo-autonomous-marathon.service || true
            sudo -n systemctl start --no-block ftmo-autonomous-marathon.service || true
            for i in $(seq 1 30); do
              state="$(systemctl is-active ftmo-autonomous-marathon.service || true)"
              echo "restart_attempt=$i state=$state"
              [[ "$state" == "active" ]] && break
              [[ "$state" == "failed" ]] && break
              sleep 2
            done
          fi

          echo "=== FINAL STATES ==="
          raise_state="$(systemctl is-active actions.runner.Zennay-RaiseAI.vps-bb300bba.service || true)"
          hax_state="$(systemctl is-active haxlab-analyzer.service || true)"
          ftmo_state="$(systemctl is-active ftmo-autonomous-marathon.service || true)"
          echo "raiseai_runner=$raise_state"
          echo "haxlab_analyzer=$hax_state"
          echo "ftmo_marathon=$ftmo_state"
          systemctl show ftmo-autonomous-marathon.service -p ActiveState -p SubState -p MainPID -p CPUWeight -p CPUQuotaPerSecUSec -p MemoryCurrent --no-pager || true
          sudo -n journalctl -u ftmo-autonomous-marathon.service -n 60 --no-pager || true
          echo "=== CPU AFTER REBALANCE ==="
          uptime
          free -h
          ps -eo pid,ppid,user,psr,%cpu,%mem,etime,stat,cmd --sort=-%cpu | head -n 35

          test "$raise_state" != "active"
          test "$hax_state" != "active"
          test "$ftmo_state" = "active"

      - name: Host overview
        shell: bash
        run: |
          set -u
          echo "=== TIME/HOST ==="
          date -Is
          hostname
          uname -a
          echo
          echo "=== LOAD/CPU/MEM ==="
          uptime
          nproc
          cat /proc/loadavg
          free -h
          echo
          echo "=== TOP CPU PROCESSES (ps lifetime avg) ==="
          ps -eo pid,ppid,user,psr,%cpu,%mem,etime,stat,cmd --sort=-%cpu | head -n 80
          echo
          echo "=== INSTANTANEOUS TOP SAMPLE 1 ==="
          COLUMNS=260 top -b -n1 -o %CPU | head -n 80 || true
          sleep 2
          echo
          echo "=== INSTANTANEOUS TOP SAMPLE 2 ==="
          COLUMNS=260 top -b -n1 -o %CPU | head -n 80 || true
          sleep 2
          echo
          echo "=== INSTANTANEOUS TOP SAMPLE 3 ==="
          COLUMNS=260 top -b -n1 -o %CPU | head -n 80 || true
          echo
          echo "=== PROJECT/WORKER MATCHES ==="
          ps -ef | grep -Ei 'zcloud|ftmo|haxlab|lightup|raise|supa|firefox|chrom|python|node|runner|actions-runner|playwright|xvfb|openbox' | grep -v grep || true
          echo
          echo "=== RUNNING SYSTEMD SERVICES (selected) ==="
          systemctl --no-pager --type=service --state=running 2>/dev/null | grep -Ei 'runner|zcloud|ftmo|hax|raise|firefox|xvfb|openbox|docker|containerd' || true
          echo
          echo "=== CGROUP CPU SNAPSHOT ==="
          systemd-cgtop -b -n1 -d1 2>/dev/null | head -n 100 || true
