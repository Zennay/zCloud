name: Dispatch FTMO post514 research-state sync

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dispatch-ftmo-post514-state-sync.yml"

permissions:
  contents: write

concurrency:
  group: dispatch-ftmo-post514-state-sync
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 5
    env:
      EXPECTED_MAIN: ac2a2563283c286b66aa409280339286bc05b366
    steps:
      - name: Ensure exact-main research-state sync
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          gh auth status >/dev/null 2>&1
          test "$(gh api repos/Zennay/Ftmo/branches/main --jq .commit.sha)" = "$EXPECTED_MAIN"
          test "$(gh api repos/Zennay/Ftmo/pulls/514 --jq .merged)" = "true"

          list_runs() {
            gh run list               --repo Zennay/Ftmo               --workflow sync-autonomous-research-state.yml               --event workflow_dispatch               --branch main               --limit 20               --json databaseId,headSha,status,conclusion,createdAt
          }

          find_row() {
            list_runs | python3 -c '
import json, os, sys
sha = os.environ["EXPECTED_MAIN"]
runs = [r for r in json.load(sys.stdin) if r.get("headSha") == sha]
runs.sort(key=lambda r: r.get("createdAt") or "")
if runs:
    r = runs[-1]
    print("%s\t%s\t%s" % (
        r.get("databaseId"),
        r.get("status") or "",
        r.get("conclusion") or "",
    ))
'
          }

          row="$(find_row)"
          if [[ -z "$row" ]]; then
            gh workflow run sync-autonomous-research-state.yml --repo Zennay/Ftmo --ref main
            action=dispatched
            for _ in $(seq 1 30); do
              row="$(find_row)"
              [[ -n "$row" ]] && break
              sleep 2
            done
          else
            action=reused-existing
          fi
          test -n "$row"

          IFS=$'\t' read -r run_id status conclusion <<<"$row"
          test -n "$run_id"
          echo "FTMO_POST514_SYNC_RUN=$run_id status=$status conclusion=$conclusion action=$action"

          receipt="$RUNNER_TEMP/ftmo-post514-state-sync-current-main.json"
          cat >"$receipt" <<EOF
{
  "schema_version": 1,
  "scope": "ftmo-post514-state-sync-current-main",
  "expected_main_sha": "$EXPECTED_MAIN",
  "action": "$action",
  "run_id": "$run_id",
  "status": "$status",
  "conclusion": "$conclusion",
  "carrier_run_id": "$GITHUB_RUN_ID"
}
EOF
          encoded="$(base64 -w0 "$receipt")"
          gh api --method PUT repos/Zennay/zCloud/contents/runtime-evidence/ftmo-post514-state-sync-current-main.json             -f message="Record FTMO post514 state-sync dispatch"             -f content="$encoded"             -f branch=main >/dev/null
