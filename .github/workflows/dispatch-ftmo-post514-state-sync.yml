name: Dispatch FTMO post514 state sync

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/dispatch-ftmo-post514-state-sync.yml

permissions:
  contents: read

jobs:
  dispatch:
    runs-on:
      - self-hosted
      - zcloud
      - vps
    timeout-minutes: 3
    steps:
      - name: Dispatch exact-main sync
        shell: bash
        env:
          EXPECTED_MAIN: 2c161be49331bd20e7dc9a2e35d9916b81200776
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          gh auth status >/dev/null 2>&1
          test "$(gh api repos/Zennay/Ftmo/branches/main --jq .commit.sha)" = "$EXPECTED_MAIN"
          test "$(gh api repos/Zennay/Ftmo/pulls/514 --jq .merged)" = "true"
          gh workflow run sync-autonomous-research-state.yml --repo Zennay/Ftmo --ref main
          echo "FTMO_POST514_SYNC_DISPATCH_REQUESTED=1"
