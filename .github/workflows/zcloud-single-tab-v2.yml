name: zCloud one-tab-per-worker v2

on:
  pull_request:
    branches: [main]
    paths:
      - public/zcloud-worker.user.js
      - public/zcloud-worker-v2-engine.js
      - firefox-extension/background.js
      - firefox-extension/worker-controller-v2.js
      - firefox-extension/manifest.json
      - tests/test_single_tab_v2_crash_recovery.js
      - tests/test_single_tab_v2_auto_heal.js
      - tests/test_v2_auto_open_missing_worker_ids_20261013_w4.js
      - tests/test_single_tab_worker_v2.js
      - tests/test_single_tab_v2_thinking_high.js
      - tests/test_v2_workmode_high_controls.js
      - tests/test_single_tab_v2_cycle.js
      - tests/test_v2_dispatch_recovery_20261013_w3.js
      - scripts/zcloud_retire_legacy_worker_services.sh
      - .github/workflows/zcloud-single-tab-v2.yml
      - tests/test_zcloud_single_tab_v2_ci_quarantine_20261014.py
  push:
    branches: [main]
    paths:
      - public/zcloud-worker.user.js
      - public/zcloud-worker-v2-engine.js
      - firefox-extension/background.js
      - firefox-extension/worker-controller-v2.js
      - firefox-extension/manifest.json
      - tests/test_single_tab_v2_crash_recovery.js
      - tests/test_single_tab_v2_auto_heal.js
      - tests/test_v2_auto_open_missing_worker_ids_20261013_w4.js
      - tests/test_single_tab_worker_v2.js
      - tests/test_single_tab_v2_thinking_high.js
      - tests/test_v2_workmode_high_controls.js
      - tests/test_single_tab_v2_cycle.js
      - tests/test_v2_dispatch_recovery_20261013_w3.js
      - scripts/zcloud_retire_legacy_worker_services.sh
      - .github/workflows/zcloud-single-tab-v2.yml
      - tests/test_zcloud_single_tab_v2_ci_quarantine_20261014.py

permissions:
  contents: read

concurrency:
  group: zcloud-one-tab-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    if: >-
      github.repository == 'Zennay/zCloud' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
      && ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || (github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'Zennay'))
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 8
    steps:
      - name: Checkout exact immutable source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 1
      - name: Prove exact canonical source before executing one-tab code
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$EXPECTED_REPOSITORY" = "Zennay/zCloud"
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install pinned Node 24 for hosted regressions
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Validate v2 one-tab ownership and High-thinking gate
        run: |
          set -euo pipefail
          node --check firefox-extension/background.js
          node --check firefox-extension/worker-controller-v2.js
          node --check public/zcloud-worker-v2-engine.js
          node --check public/zcloud-worker.user.js
          node tests/test_single_tab_v2_crash_recovery.js
          node tests/test_single_tab_v2_auto_heal.js
          node tests/test_v2_auto_open_missing_worker_ids_20261013_w4.js
          node tests/test_single_tab_worker_v2.js
          node tests/test_single_tab_v2_thinking_high.js
          node tests/test_v2_workmode_high_controls.js
          node tests/test_single_tab_v2_cycle.js
          node tests/test_v2_dispatch_recovery_20261013_w3.js
          node tests/test_worker_tab_identity_guard.js
          node tests/test_worker_tab_reuse.js
          node tests/test_firefox_recovery_contract.js
          python3 -m unittest tests.test_violentmonkey_runner tests.test_zcloud_single_tab_v2_ci_quarantine_20261014
          echo 'ONE_TAB_PER_WORKER_V2_TESTS_GREEN=1'

