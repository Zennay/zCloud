name: zCloud config round-trip regression

on:
  pull_request:
    branches: [main]
    paths:
      - tests/test_config_roundtrip.py
      - tests/test_config_roundtrip_workflow.py
      - .github/workflows/zcloud-config-roundtrip-regression.yml
      - server.py
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zcloud-config-roundtrip-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.actor == 'Zennay' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact candidate and runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          test "$(id -un)" = "ubuntu"
          python3 scripts/zcloud_vps_runner_guard.py --json
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          fi
      - name: Run config round-trip regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tests/test_config_roundtrip.py tests/test_config_roundtrip_workflow.py
          python3 -m unittest -v tests.test_config_roundtrip tests.test_config_roundtrip_workflow
