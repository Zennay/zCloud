name: Recover RaiseAI PR71 runner

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/raiseai-main-v153-runner-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: raiseai-main-v153-runner-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 7
    env:
      RAISE_REPO: Zennay/RaiseAI
      WATCH_RUN_ID: '37339709015'
      EXPECTED_SHA: 3cf92caaea27bdd3134c27990fc19665aac99e59
      RAISE_SERVICE: actions.runner.Zennay-RaiseAI.vps-bb300bba.service

    steps:
      - name: Verify exact RaiseAI main build
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          gh auth status >/dev/null 2>&1
          test "$(gh api repos/$RAISE_REPO/actions/runs/$WATCH_RUN_ID --jq .head_sha)" = "$EXPECTED_SHA"
          test "$(gh api repos/$RAISE_REPO/actions/runs/$WATCH_RUN_ID --jq .name)" = "Raise Watch app CI"

      - name: Recover only idle RaiseAI listener
        shell: bash
        run: |
          set -euo pipefail
          status="$(gh api repos/$RAISE_REPO/actions/runs/$WATCH_RUN_ID --jq .status)"
          control_group="$(systemctl show "$RAISE_SERVICE" -p ControlGroup --value || true)"
          worker=0
          if [[ -n "$control_group" && "$control_group" != "/" ]]; then
            for proc in /proc/[0-9]*; do
              test -r "$proc/cgroup" || continue
              grep -Fq "$control_group" "$proc/cgroup" || continue
              test -r "$proc/cmdline" || continue
              cmdline="$(tr '\0' ' ' < "$proc/cmdline" 2>/dev/null || true)"
              [[ "$cmdline" == *"Runner.Worker"* ]] && worker=1 && break
            done
          fi
          echo "RAISEAI_PRE status=$status worker=$worker service=$(systemctl is-active "$RAISE_SERVICE" || true)"
          if [[ "$status" == "queued" && "$worker" -eq 0 ]]; then
            sudo -n systemctl reset-failed "$RAISE_SERVICE" || true
            sudo -n systemctl restart "$RAISE_SERVICE"
          fi
          for _ in $(seq 1 30); do
            test "$(systemctl is-active "$RAISE_SERVICE" || true)" = "active" && break
            sleep 2
          done
          test "$(systemctl is-active "$RAISE_SERVICE" || true)" = "active"

      - name: Prove PR71 build leaves queue
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 48); do
            status="$(gh api repos/$RAISE_REPO/actions/runs/$WATCH_RUN_ID --jq .status)"
            echo "RAISEAI_PR71 status=$status"
            [[ "$status" == "in_progress" || "$status" == "completed" ]] && exit 0
            sleep 5
          done
          exit 1
