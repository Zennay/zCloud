name: FTMO PR452 exact-head provider validation proof

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-pr452-exact-head-proof.yml"

permissions:
  contents: read

concurrency:
  group: ftmo-pr452-exact-head-proof
  cancel-in-progress: true

jobs:
  prove:
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 15
    env:
      TARGET_SHA: 20ebf6f3b1a2e899ac8613385456247d1db69ff1
      FTMO_AUTONOMOUS_CLOUD_BUDGET_USD: "0.00"
      FTMO_ALLOW_PAID_AWS: ""
    steps:
      - name: Fetch exact FTMO PR452 head
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          src="$RUNNER_TEMP/ftmo-pr452-zcloud-proof"
          rm -rf "$src"
          gh repo clone Zennay/Ftmo "$src" -- --filter=blob:none --no-checkout >/dev/null
          git -C "$src" checkout --detach "$TARGET_SHA" >/dev/null
          test "$(git -C "$src" rev-parse HEAD)" = "$TARGET_SHA"
          echo "FTMO_PR452_EXACT_SHA=$TARGET_SHA"
      - name: Install isolated environment
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr452-zcloud-proof"
          venv="$RUNNER_TEMP/ftmo-pr452-zcloud-venv"
          rm -rf "$venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install -q -r "$src/requirements-ci.txt"
          "$venv/bin/python" -m pip install -q -e "$src"
      - name: Compile provider validation boundary
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr452-zcloud-proof"
          venv="$RUNNER_TEMP/ftmo-pr452-zcloud-venv"
          cd "$src"
          "$venv/bin/python" -m compileall -q src/prop_trading_ai/research/provider_validation.py
          echo "FTMO_PR452_COMPILE_GREEN=1"
      - name: Prove strict provider-validation envelope and V1 scope
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr452-zcloud-proof"
          venv="$RUNNER_TEMP/ftmo-pr452-zcloud-venv"
          cd "$src"
          "$venv/bin/python" -m pytest -q tests/test_provider_validation_json_integrity.py tests/test_provider_validation.py
          echo "FTMO_PR452_PROVIDER_VALIDATION_GREEN=1"
      - name: Prove adjacent provider-foundation boundaries
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr452-zcloud-proof"
          venv="$RUNNER_TEMP/ftmo-pr452-zcloud-venv"
          cd "$src"
          "$venv/bin/python" -m pytest -q tests/test_provider_foundation_publication.py tests/test_autonomous_provider_retry.py tests/test_zero_cost_workflow_boundary.py
          echo "FTMO_PR452_ADJACENT_GREEN=1"
      - name: Collect full suite
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr452-zcloud-proof"
          venv="$RUNNER_TEMP/ftmo-pr452-zcloud-venv"
          cd "$src"
          "$venv/bin/python" -m pytest --collect-only -q >"$RUNNER_TEMP/ftmo-pr452-zcloud-collect.txt"
          tail -n 2 "$RUNNER_TEMP/ftmo-pr452-zcloud-collect.txt"
          echo "FTMO_PR452_COLLECTION_GREEN=1"
