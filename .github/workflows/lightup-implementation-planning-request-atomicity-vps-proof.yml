name: LightUp implementation-planning request atomicity VPS proof

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/lightup-implementation-planning-request-atomicity-vps-proof.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lightup-implementation-planning-request-atomicity-vps-proof
  cancel-in-progress: true

env:
  LIGHTUP_REPO: /home/ubuntu/zennay-cloud/repos/lightup
  LIGHTUP_BRANCH: chatgpt/st5-implementation-planning-request-live-validation-atomicity-20261007
  LIGHTUP_EXPECTED_SHA: d97433445308efd272637770bada431465dbd978

jobs:
  prove:
    if: github.event_name == 'pull_request'
    name: Exact LightUp #482 head on vps-bb300bba
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 35
    steps:
      - name: Checkout zCloud proof harness
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Guard permanent VPS runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          python3 scripts/zcloud_vps_runner_guard.py --json

      - name: Snapshot exact LightUp head
        shell: bash
        run: |
          set -euo pipefail
          test -d "${LIGHTUP_REPO}/.git"
          remote_ref="refs/remotes/origin/lightup-pr482-proof"
          snapshot="${RUNNER_TEMP}/lightup-pr482-${GITHUB_RUN_ID}"
          git -C "${LIGHTUP_REPO}" fetch --prune origin "+refs/heads/${LIGHTUP_BRANCH}:${remote_ref}"
          actual="$(git -C "${LIGHTUP_REPO}" rev-parse "${remote_ref}^{commit}")"
          test "${actual}" = "${LIGHTUP_EXPECTED_SHA}"
          rm -rf "${snapshot}"
          mkdir -p "${snapshot}"
          git -C "${LIGHTUP_REPO}" archive "${actual}" | tar -x -C "${snapshot}"
          echo "LIGHTUP_SNAPSHOT=${snapshot}" >> "${GITHUB_ENV}"
          echo "LIGHTUP_ACTUAL_SHA=${actual}" >> "${GITHUB_ENV}"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prove exact head on Python 3.11
        shell: bash
        run: |
          set -euo pipefail
          cd "${LIGHTUP_SNAPSHOT}"
          PYTHONPATH=src:tests python -m compileall -q src tests
          PYTHONPATH=src:tests python -m unittest -v             test_future_remediation_implementation_plan_request_live_validation_atomicity             test_future_remediation_implementation_plan_request_handoff             test_future_remediation_implementation_plan_request
          PYTHONPATH=src python scripts/check_safety_canaries.py

      - name: Setup Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Prove exact head on Python 3.14
        shell: bash
        run: |
          set -euo pipefail
          cd "${LIGHTUP_SNAPSHOT}"
          PYTHONPATH=src:tests python -m compileall -q src tests
          PYTHONPATH=src:tests python -m unittest -v             test_future_remediation_implementation_plan_request_live_validation_atomicity             test_future_remediation_implementation_plan_request_handoff             test_future_remediation_implementation_plan_request
          PYTHONPATH=src python scripts/check_safety_canaries.py

      - name: Write exact-head proof receipt
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          receipt_dir="${RUNNER_TEMP}/lightup-pr482-receipt"
          mkdir -p "${receipt_dir}"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "project": "LightUp",
              "focus": "evidence-remediation",
              "issue": 478,
              "pull_request": 482,
              "branch": os.environ["LIGHTUP_BRANCH"],
              "head_sha": os.environ["LIGHTUP_ACTUAL_SHA"],
              "expected_head_sha": os.environ["LIGHTUP_EXPECTED_SHA"],
              "host": os.uname().nodename,
              "python": ["3.11", "3.14"],
              "github_run_id": os.environ["GITHUB_RUN_ID"],
              "proof": "dedicated-live-validation-atomicity+handoff+producer+safety-canaries",
              "production_source_changes": 0,
              "authority_widening": False,
          }
          path = Path(os.environ["RUNNER_TEMP"]) / "lightup-pr482-receipt" / "receipt.json"
          path.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n")
          print(json.dumps(payload, sort_keys=True))
          PY

      - name: Upload exact-head proof receipt
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lightup-pr482-implementation-planning-request-atomicity-vps-proof
          path: ${{ runner.temp }}/lightup-pr482-receipt/receipt.json
          if-no-files-found: error

      - name: Cleanup snapshot
        if: always()
        shell: bash
        run: |
          rm -rf "${LIGHTUP_SNAPSHOT:-}"
