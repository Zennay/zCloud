name: Temporary VPS ops bridge

on:
  push:
    branches: [main]
    paths:
      - ".github/vps-ops-request.json"
      - ".github/workflows/vps-ops-once.yml"

permissions:
  contents: write

concurrency:
  group: zcloud-vps-ops-once
  cancel-in-progress: false

jobs:
  ops:
    runs-on: self-hosted
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0

      - name: Execute fixed VPS operation
        shell: bash
        run: |
          set -euo pipefail
          REQUEST=".github/vps-ops-request.json"
          RESULT=".github/vps-ops-result.json"
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT

          if [ ! -f "$REQUEST" ]; then
            echo "No request file yet; nothing to do."
            exit 0
          fi

          PHASE="$(python3 - "$REQUEST" <<'PY'
import json, sys
raw=json.load(open(sys.argv[1], encoding="utf-8"))
phase=str(raw.get("phase") or "")
if phase not in {"inspect_prepare","install_token"}:
    raise SystemExit("unsupported phase")
print(phase)
PY
)"
          BURST_TICKS="$(python3 - "$REQUEST" <<'PY'
import json, sys
raw=json.load(open(sys.argv[1], encoding="utf-8"))
n=int(raw.get("burst_ticks") or 0)
if n < 0 or n > 24:
    raise SystemExit("burst_ticks out of range")
print(n)
PY
)"

          snapshot_cpu() {
            ps -eo pid,user,comm,%cpu,%mem,etime --sort=-%cpu | head -n 30
          }

          service_state() {
            for u in               haxlab-ingest.service               haxlab-worker.service               haxlab-analyzer.service               haxlab-live-bot.service               haxlab-autonomy.timer               ftmo-autonomous.service               ftmo-autonomous.timer; do
              printf '%s=' "$u"
              systemctl is-active "$u" 2>/dev/null || true
            done
          }

          ftmo_status() {
            python3 - <<'PY'
import json
from pathlib import Path
p=Path("/opt/ftmo-autonomous/.scratch/autonomy/status.json")
if not p.is_file():
    print(json.dumps({"present":False}))
    raise SystemExit
raw=json.loads(p.read_text(encoding="utf-8"))
research=raw.get("research") if isinstance(raw.get("research"),dict) else {}
controller=raw.get("research_controller") if isinstance(raw.get("research_controller"),dict) else {}
generation=controller.get("generation_loop") if isinstance(controller.get("generation_loop"),dict) else {}
print(json.dumps({
  "present": True,
  "ok": raw.get("ok"),
  "completed_at_utc": raw.get("completed_at_utc"),
  "research": research,
  "controller_compute_ok": (controller.get("compute") or {}).get("ok") if isinstance(controller.get("compute"),dict) else None,
  "generation_loop": generation,
  "live_trading_allowed": raw.get("live_trading_allowed"),
  "broker_order_submission_allowed": raw.get("broker_order_submission_allowed"),
}, sort_keys=True))
PY
          }

          snapshot_cpu >"$TMP/cpu_before.txt"
          service_state >"$TMP/services_before.txt"
          ftmo_status >"$TMP/ftmo_before.json" || true

          if [ "$PHASE" = "inspect_prepare" ]; then
            {
              echo "Pausing HaxLab compute services; live room service is left separate."
              sudo -n systemctl stop haxlab-analyzer.service 2>/dev/null || true
              sudo -n systemctl stop haxlab-worker.service 2>/dev/null || true
              sudo -n systemctl stop haxlab-autonomy.timer 2>/dev/null || true
              echo "Ensuring FTMO autonomous timer is enabled and active."
              sudo -n systemctl enable --now ftmo-autonomous.timer
            } >"$TMP/actions.txt" 2>&1

            sudo -n /usr/local/sbin/haxlab-actions-control live-host-keygen >"$TMP/public_key.txt" 2>&1

            : >"$TMP/ftmo_burst.txt"
            if [ "$BURST_TICKS" -gt 0 ]; then
              for i in $(seq 1 "$BURST_TICKS"); do
                echo "=== FTMO autonomous tick $i/$BURST_TICKS ===" >>"$TMP/ftmo_burst.txt"
                set +e
                sudo -n systemctl start ftmo-autonomous.service >>"$TMP/ftmo_burst.txt" 2>&1
                rc=$?
                set -e
                echo "rc=$rc" >>"$TMP/ftmo_burst.txt"
                ftmo_status >>"$TMP/ftmo_burst.txt" 2>&1 || true
                if [ "$rc" -ne 0 ]; then
                  break
                fi
              done
            fi
          else
            CIPHERTEXT="$(python3 - "$REQUEST" <<'PY'
import json, re, sys
raw=json.load(open(sys.argv[1], encoding="utf-8"))
value=str(raw.get("ciphertext") or "").strip()
if not (100 <= len(value) <= 1000) or re.fullmatch(r"[A-Za-z0-9+/=]+", value) is None:
    raise SystemExit("invalid encrypted token payload")
print(value)
PY
)"
            sudo -n /usr/local/sbin/haxlab-actions-control live-host-install-token "$CIPHERTEXT" >"$TMP/token_install.txt" 2>&1
            sudo -n /usr/local/sbin/haxlab-actions-control live-host-status >"$TMP/live_host_status.txt" 2>&1 || true
          fi

          snapshot_cpu >"$TMP/cpu_after.txt"
          service_state >"$TMP/services_after.txt"
          ftmo_status >"$TMP/ftmo_after.json" || true
          systemctl list-timers --all --no-pager | grep -E 'ftmo-autonomous|haxlab-autonomy' >"$TMP/timers.txt" || true

          python3 - "$PHASE" "$TMP" "$RESULT" <<'PY'
import json, sys
from datetime import datetime, timezone
from pathlib import Path

phase=sys.argv[1]
tmp=Path(sys.argv[2])
result=Path(sys.argv[3])

def text(name):
    p=tmp/name
    return p.read_text(encoding="utf-8", errors="replace") if p.exists() else None

def json_file(name):
    p=tmp/name
    if not p.exists():
        return None
    try:
        return json.loads(p.read_text(encoding="utf-8"))
    except Exception:
        return {"raw": p.read_text(encoding="utf-8", errors="replace")}

payload={
  "schema_version":1,
  "phase":phase,
  "completed_at_utc":datetime.now(timezone.utc).isoformat(),
  "cpu_before":text("cpu_before.txt"),
  "services_before":text("services_before.txt"),
  "actions":text("actions.txt"),
  "public_key":text("public_key.txt"),
  "ftmo_burst":text("ftmo_burst.txt"),
  "token_install":text("token_install.txt"),
  "live_host_status":text("live_host_status.txt"),
  "cpu_after":text("cpu_after.txt"),
  "services_after":text("services_after.txt"),
  "ftmo_before":json_file("ftmo_before.json"),
  "ftmo_after":json_file("ftmo_after.json"),
  "timers":text("timers.txt"),
}
result.write_text(json.dumps(payload, indent=2, sort_keys=True)+"\n", encoding="utf-8")
PY

      - name: Persist sanitized operation result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "zcloud-ops-bot"
          git config user.email "zcloud-ops-bot@users.noreply.github.com"
          git add .github/vps-ops-result.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record temporary VPS ops result [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
