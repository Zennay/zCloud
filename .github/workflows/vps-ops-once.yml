name: Temporary VPS ops bridge

on:
  push:
    branches: [main]
    paths:
      - ".github/vps-ops-request.json"
      - ".github/workflows/vps-ops-once.yml"

permissions:
  contents: write

concurrency:
  group: zcloud-vps-ops-once
  cancel-in-progress: false

jobs:
  ops:
    runs-on: self-hosted
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0

      - name: Execute fixed VPS operation
        shell: bash
        run: |
          set -euo pipefail
          REQUEST=".github/vps-ops-request.json"
          RESULT=".github/vps-ops-result.txt"
          PHASE="$(python3 -c 'import json; print(json.load(open(".github/vps-ops-request.json", encoding="utf-8")).get("phase",""))')"
          BURST_TICKS="$(python3 -c 'import json; print(int(json.load(open(".github/vps-ops-request.json", encoding="utf-8")).get("burst_ticks",0)))')"
          case "$PHASE" in inspect_prepare|install_token) ;; *) echo "unsupported phase"; exit 2 ;; esac
          test "$BURST_TICKS" -ge 0
          test "$BURST_TICKS" -le 24

          {
            echo "phase=$PHASE"
            echo "=== CPU BEFORE ==="
            ps -eo pid,user,comm,%cpu,%mem,etime --sort=-%cpu | head -n 30
            echo "=== SERVICES BEFORE ==="
            for u in haxlab-ingest.service haxlab-worker.service haxlab-analyzer.service haxlab-live-bot.service haxlab-autonomy.timer ftmo-autonomous.service ftmo-autonomous.timer; do
              printf '%s=' "$u"; systemctl is-active "$u" 2>/dev/null || true
            done
            echo "=== FTMO STATUS BEFORE ==="
            cat /opt/ftmo-autonomous/.scratch/autonomy/status.json 2>/dev/null || true

            if [ "$PHASE" = "inspect_prepare" ]; then
              echo "=== ACTIONS ==="
              python3 - <<'PY'
import json, urllib.request
body=json.dumps({"project_id":"haxlab","action":"pause"}).encode("utf-8")
req=urllib.request.Request("http://127.0.0.1:8765/api/runner-control", data=body, headers={"Content-Type":"application/json"}, method="POST")
with urllib.request.urlopen(req, timeout=10) as r:
    print("zcloud_haxlab_pause="+r.read().decode("utf-8","replace"))
PY
              sudo -n pkill -TERM -f '[h]axlab-train-bc' 2>/dev/null || true
              sudo -n systemctl stop haxlab-autonomy.service 2>/dev/null || true
              sudo -n systemctl stop haxlab-analyzer.service 2>/dev/null || true
              sudo -n systemctl stop haxlab-worker.service 2>/dev/null || true
              sudo -n systemctl stop haxlab-autonomy.timer 2>/dev/null || true
              sudo -n systemctl enable --now ftmo-autonomous.timer
              echo "HaxLab compute paused; FTMO timer enabled."
              echo "=== HAXBALL TOKEN PUBLIC KEY ==="
              sudo -n /usr/local/sbin/haxlab-actions-control live-host-keygen

              echo "=== FTMO BURST ==="
              i=1
              while [ "$i" -le "$BURST_TICKS" ]; do
                echo "--- tick $i/$BURST_TICKS ---"
                sudo -n systemctl start ftmo-autonomous.service || true
                python3 -c 'import json; from pathlib import Path; p=Path("/opt/ftmo-autonomous/.scratch/autonomy/status.json"); d=json.loads(p.read_text()) if p.exists() else {}; c=d.get("research_controller") or {}; g=c.get("generation_loop") or {}; print(json.dumps({"ok":d.get("ok"),"completed_at_utc":d.get("completed_at_utc"),"research":d.get("research"),"generation_loop":g,"live_trading_allowed":d.get("live_trading_allowed"),"broker_order_submission_allowed":d.get("broker_order_submission_allowed")},sort_keys=True))'
                i=$((i+1))
              done
            else
              CIPHERTEXT="$(python3 -c 'import json; print(str(json.load(open(".github/vps-ops-request.json", encoding="utf-8")).get("ciphertext","")).strip())')"
              echo "=== TOKEN INSTALL / ROOM START ==="
              sudo -n /usr/local/sbin/haxlab-actions-control live-host-install-token "$CIPHERTEXT"
              echo "=== LIVE HOST STATUS ==="
              sudo -n /usr/local/sbin/haxlab-actions-control live-host-status || true
            fi

            echo "=== CPU AFTER ==="
            ps -eo pid,user,comm,%cpu,%mem,etime --sort=-%cpu | head -n 30
            echo "=== SERVICES AFTER ==="
            for u in haxlab-ingest.service haxlab-worker.service haxlab-analyzer.service haxlab-live-bot.service haxlab-autonomy.timer ftmo-autonomous.service ftmo-autonomous.timer; do
              printf '%s=' "$u"; systemctl is-active "$u" 2>/dev/null || true
            done
            echo "=== FTMO STATUS AFTER ==="
            cat /opt/ftmo-autonomous/.scratch/autonomy/status.json 2>/dev/null || true
            echo "=== TIMERS ==="
            systemctl list-timers --all --no-pager | grep -E 'ftmo-autonomous|haxlab-autonomy' || true
          } >"$RESULT" 2>&1

      - name: Persist sanitized operation result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "zcloud-ops-bot"
          git config user.email "zcloud-ops-bot@users.noreply.github.com"
          git add .github/vps-ops-result.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record temporary VPS ops result [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
