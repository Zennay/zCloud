name: zSSH GitHub admin capability probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/zssh-gh-admin-capability-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zssh-gh-admin-capability-probe
  cancel-in-progress: true

jobs:
  probe:
    name: Probe persistent VPS GitHub auth for zSSH administration
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 5
    steps:
      - name: Check out zCloud control plane
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Enforce permanent VPS runner identity
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/zcloud_vps_runner_guard.py --json \
            | tee "$RUNNER_TEMP/zssh-gh-admin-runner-guard.json"
          test "$(hostname)" = "vps-bb300bba"
          test "$(id -un)" = "ubuntu"

      - name: Probe persistent gh authorization without mutation
        id: capability
        shell: bash
        run: |
          set -Eeuo pipefail
          unset GH_TOKEN GITHUB_TOKEN GH_ENTERPRISE_TOKEN GITHUB_ENTERPRISE_TOKEN || true
          gh auth status --hostname github.com >/dev/null 2>&1

          admin="$(gh api repos/Zennay/zSSH --jq '.permissions.admin // false')"
          main_sha="$(gh api repos/Zennay/zSSH/branches/main --jq '.commit.sha')"
          protected="$(gh api repos/Zennay/zSSH/branches/main --jq '.protected // false')"

          set +e
          gh api repos/Zennay/zSSH/branches/main/protection \
            >"$RUNNER_TEMP/zssh-main-protection-read.json" \
            2>"$RUNNER_TEMP/zssh-main-protection-read.err"
          protection_rc="$?"
          set -e

          protection_http="$(
            grep -Eo 'HTTP [0-9]{3}' "$RUNNER_TEMP/zssh-main-protection-read.err" \
              | tail -n1 \
              | awk '{print $2}' || true
          )"
          if [ "$protection_rc" -eq 0 ]; then
            protection_http="200"
          elif [ -z "$protection_http" ]; then
            protection_http="unknown"
          fi

          ADMIN="$admin" MAIN_SHA="$main_sha" PROTECTED="$protected" \
          PROTECTION_HTTP="$protection_http" python3 - <<'PY' \
            | tee "$RUNNER_TEMP/zssh-gh-admin-capability.json"
          import json
          import os
          import socket

          admin = os.environ["ADMIN"].lower() == "true"
          protected = os.environ["PROTECTED"].lower() == "true"
          result = {
              "schema_version": 1,
              "project": "zssh",
              "probe": "persistent-vps-gh-admin-capability",
              "runner_name": os.environ.get("RUNNER_NAME", ""),
              "hostname": socket.gethostname().split(".", 1)[0],
              "repository": "Zennay/zSSH",
              "main_sha": os.environ["MAIN_SHA"],
              "repository_admin": admin,
              "branch_reported_protected": protected,
              "protection_endpoint_http": os.environ["PROTECTION_HTTP"],
              "mutation_attempted": False,
              "capable_of_admin_route": admin,
          }
          print(json.dumps(result, sort_keys=True, indent=2))
          PY

          if [ "$admin" = "true" ]; then
            echo "ZSSH_VPS_GH_ADMIN_CAPABILITY_PRESENT main_sha=$main_sha protected=$protected protection_http=$protection_http"
          else
            echo "ZSSH_VPS_GH_ADMIN_CAPABILITY_ABSENT main_sha=$main_sha protected=$protected protection_http=$protection_http"
          fi

      - name: Upload non-secret capability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zssh-gh-admin-capability-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/zssh-gh-admin-capability.json
            ${{ runner.temp }}/zssh-gh-admin-runner-guard.json
          if-no-files-found: error
          retention-days: 30
