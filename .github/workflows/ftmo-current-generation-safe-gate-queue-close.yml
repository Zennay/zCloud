name: Close FTMO current-generation safe-gate queue item

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ftmo-current-generation-safe-gate-queue-close.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  close:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Atomically close proven FTMO safe-gate assignment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import urllib.request
          import urllib.error

          base = "http://127.0.0.1:8765"
          qid = "ftmo-current-generation-safe-gate"
          slot = 2
          evidence = (
              "Persistent FTMO runtime safe progression independently re-proved: "
              "Verify autonomous VPS runtime workflow_run_id=36968146164 attempt=2 "
              "job_id=110729134646 conclusion=success; all deploy/compile/service/self-advance/"
              "receipt verification steps green. Fresh research heartbeat completed "
              "2026-10-02T06:14:22.523864Z on runtime/source revision "
              "e5797910302be5742ab2b9bf3a0fabbe39cd3cb5 and was persisted to main as "
              "receipt commit 3e770b0f765414b4b948a1ddd43ba7659339c48d. "
              "Receipt proves persistent_self_advance=true, persistent_research_self_advance=true, "
              "research_cycle_ok=true, Generation 29 provider_foundation retry-later, "
              "walk_forward_accessed=false, final_holdout_accessed=false, "
              "research_outcomes_executed=false, live trading disabled, broker submission disabled, "
              "cloud budget 0.00. Normal generation loop was not manually driven."
          )

          def get(path):
              with urllib.request.urlopen(base + path, timeout=10) as r:
                  return json.load(r)

          def post(path, payload):
              req = urllib.request.Request(
                  base + path,
                  data=json.dumps(payload).encode(),
                  method="POST",
                  headers={
                      "Content-Type": "application/json",
                      "X-ZCloud-Actor": "ftmo-safe-gate-queue-close",
                  },
              )
              with urllib.request.urlopen(req, timeout=10) as r:
                  return json.load(r)

          all_items = get("/api/portfolio-queue?all=1")
          item = next((x for x in all_items.get("items", []) if x.get("queue_id") == qid), None)
          if item is None:
              raise SystemExit("queue item missing")
          print("QUEUE_BEFORE", json.dumps({
              k: item.get(k) for k in ("queue_id","project_id","status","eligible","worker_slot","evidence")
          }, sort_keys=True))

          if item.get("status") == "done" and not item.get("eligible"):
              print("QUEUE_ALREADY_DONE", json.dumps(item, sort_keys=True))
          else:
              if item.get("project_id") != "ftmo":
                  raise SystemExit("project mismatch")
              if item.get("status") not in {"claimed","running","verifying"}:
                  raise SystemExit("refusing to close non-active queue state: " + str(item.get("status")))
              if int(item.get("worker_slot") or -1) != slot:
                  raise SystemExit("worker-slot mismatch: " + str(item.get("worker_slot")))
              result = post("/api/portfolio-queue", {
                  "action": "result",
                  "worker_slot": slot,
                  "queue_id": qid,
                  "result": "DONE",
                  "evidence": evidence,
              })
              print("QUEUE_RESULT", json.dumps(result, sort_keys=True))
              if not result.get("ok"):
                  raise SystemExit("queue result endpoint did not confirm update")

          final = get("/api/portfolio-queue?all=1")
          item = next((x for x in final.get("items", []) if x.get("queue_id") == qid), None)
          print("QUEUE_AFTER", json.dumps(item, sort_keys=True))
          if not item or item.get("status") != "done" or item.get("eligible") or item.get("worker_slot") is not None:
              raise SystemExit("DONE state did not persist")
          if "36968146164" not in str(item.get("evidence") or "") or "3e770b0f765414b4b948a1ddd43ba7659339c48d" not in str(item.get("evidence") or ""):
              raise SystemExit("expected proof evidence missing from persisted queue row")
          PY
