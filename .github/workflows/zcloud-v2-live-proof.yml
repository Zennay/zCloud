name: zCloud v2 verified live worker proof

# Never read permanent VPS state from a PR or an automatic push.
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/zcloud-v2-live-proof.yml
      - scripts/zcloud_v2_live_proof_freshness_20261013_w1.py
      - tests/test_zcloud_v2_live_proof_freshness_20261013_w1.py
      - tests/test_zcloud_v2_liveproof_trigger_guard_20261014.py
      - tests/test_zcloud_v2_liveproof_explicit_approval_20261014.py
  workflow_dispatch:
    inputs:
      confirm_sha:
        description: "Exact current main SHA approved for this read-only proof"
        required: true
        type: string
      approve_readonly_proof:
        description: "Explicit approval to read live worker heartbeat and source metadata"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: zcloud-v2-liveproof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: (github.event_name == 'pull_request') && ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || (github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'Zennay'))
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR revision hosted without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify immutable checkout and offline proof regressions
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python3 -m unittest -v tests.test_zcloud_v2_live_proof_freshness_20261013_w1 tests.test_zcloud_v2_liveproof_trigger_guard_20261014 tests.test_zcloud_v2_liveproof_explicit_approval_20261014
          python3 -m py_compile scripts/zcloud_v2_live_proof_freshness_20261013_w1.py

  prove:
    name: Manual current-main exact-SHA read-only VPS worker-v2 proof
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'Zennay/zCloud' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'Zennay' &&
      github.triggering_actor == 'Zennay' &&
      github.run_attempt == 1 &&
      inputs.approve_readonly_proof == true &&
      inputs.confirm_sha == github.sha
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 5
    steps:
      - name: Checkout immutable current-main revision without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true
      - name: Trust preflight before reading live worker/SQLite state
        shell: bash
        env:
          CONFIRMED_SHA: ${{ inputs.confirm_sha }}
          READONLY_APPROVAL: ${{ inputs.approve_readonly_proof }}
        run: |
          set -euo pipefail
          [[ "$CONFIRMED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$READONLY_APPROVAL" = "true"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REPOSITORY" = "Zennay/zCloud"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_ACTOR" = "Zennay"
          test "$GITHUB_TRIGGERING_ACTOR" = "Zennay"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$CONFIRMED_SHA" = "$GITHUB_SHA"
          test "$(timeout 15 git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')" = "$GITHUB_SHA"
          test "$(id -un)" = "ubuntu"
          test "$(hostname)" = "vps-bb300bba"
          python3 scripts/zcloud_vps_runner_guard.py --json
      - name: Check live worker heartbeats on read-only SQLite and localhost
        shell: bash
        env:
          XDG_RUNTIME_DIR: /run/user/1000
          DBUS_SESSION_BUS_ADDRESS: unix:path=/run/user/1000/bus
          READONLY_APPROVAL: ${{ inputs.approve_readonly_proof }}
          CONFIRMED_SHA: ${{ inputs.confirm_sha }}
        run: |
          set -euo pipefail
          # Recheck the immutable main admission immediately before live observation.
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$GITHUB_TRIGGERING_ACTOR" = "Zennay"
          test "$GITHUB_ACTOR" = "Zennay"
          test "$READONLY_APPROVAL" = "true"
          test "$CONFIRMED_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(timeout 15 git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')" = "$GITHUB_SHA"
          python3 scripts/zcloud_v2_live_proof_freshness_20261013_w1.py
          test "$(timeout 15 git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')" = "$GITHUB_SHA"
          # Existing timer and process observations are read-only, names only.
          for unit in chatgpt-runner-watchdog.timer zcloud-watchdog.timer; do
            systemctl --user is-active "$unit" || true
          done
          for unit in zcloud-self-heal.timer zcloud-firefox-supervisor.timer; do
            systemctl is-active "$unit" || true
          done
          # Report aggregate browser presence only, never PIDs or process args.
          browser_count="$(ps -eo comm= | grep -Eic '^(firefox|firefox-bin|web-ext)$' || true)"
          [[ "$browser_count" =~ ^[0-9]{1,6}$ ]]
          echo "BROWSER_PROCESS_COUNT=$browser_count"
          echo 'LIVE_V2_PROOF_NO_BROWSER_QUEUE_SQLITE_OR_SERVICE_MUTATION=1'
