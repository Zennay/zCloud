name: Control-plane offline evidence redaction tests

on:
  pull_request:
    paths:
      - 'scripts/control_plane_evidence_redaction_offline_20261009.py'
      - 'tests/test_control_plane_evidence_redaction_offline_20261009.py'
      - '.github/workflows/control-plane-offline-redaction-20261009.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-redaction:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run isolated offline tests
        run: python3 -m unittest discover -s tests -p 'test_control_plane_evidence_redaction_offline_20261009.py' -v
