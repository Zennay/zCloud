name: Enqueue superseded FTMO CI cancellation on zSSH

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ftmo-cancel-superseded-ci-zssh-queue.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enqueue:
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 5
    steps:
      - name: Check out exact main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Enqueue exact superseded FTMO CI cancellations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import urllib.request

          base = "http://127.0.0.1:8765"
          queue_id = "zssh-ftmo-cancel-superseded-ci-v2-20261002"
          stale = [
              36941119482,  # PR #380 closed/superseded
              36941462749,  # PR #383 closed/superseded
              36945491297,  # PR #387 closed/superseded
              36946253651,  # PR #388 closed/superseded
              36947322610,  # PR #389 closed/superseded
              36947457589,  # PR #390 closed/superseded
          ]
          protected = 36947540556
          payload = {
              "action": "enqueue",
              "queue_id": queue_id,
              "project_id": "zssh",
              "title": "Cancel superseded FTMO CI backlog",
              "priority": "P0",
              "completion_criteria": (
                  "On vps-bb300bba cancel only GitHub Actions runs "
                  + ", ".join(str(item) for item in stale)
                  + " in Zennay/Ftmo, and only while each run is still queued, pending, or in_progress. "
                  "These exact runs belong to closed/superseded PRs #380, #383, #387, #388, #389, and #390. "
                  f"Never cancel protected current exact-head PR386 run {protected}, any run newer than it, "
                  "or any run whose identity/status no longer matches this instruction. Use existing authorized "
                  "GitHub credentials available to the zSSH lane; never print credentials. Verify each requested "
                  "run is completed/cancelled or already terminal, then report protected run status. Do not modify "
                  "repository files, provider evidence, research artifacts, preregistration, development, "
                  "walk-forward, final holdout, broker, or live-trading state."
              ),
              "source_url": "https://github.com/Zennay/Ftmo/pull/386",
          }

          def post(path, body):
              request = urllib.request.Request(
                  base + path,
                  data=json.dumps(body).encode(),
                  method="POST",
                  headers={"Content-Type": "application/json"},
              )
              with urllib.request.urlopen(request, timeout=10) as response:
                  result = json.load(response)
                  if response.status >= 300:
                      raise RuntimeError(f"{path} failed: HTTP {response.status}")
                  return result

          queued = post("/api/portfolio-queue", payload)
          start = post("/api/runner-control", {"project_id": "zssh", "action": "start"})
          push = post("/api/runner-control", {"project_id": "zssh", "action": "push"})
          print("FTMO_SUPERSEDED_CI_CANCEL_QUEUE", json.dumps({
              "queue_id": queue_id,
              "backend": queued.get("backend"),
              "queue_status": (queued.get("item") or {}).get("status"),
              "worker_slot": (queued.get("item") or {}).get("worker_slot"),
              "protected_run_id": protected,
              "stale_run_ids": stale,
              "start_ok": start.get("ok"),
              "push_ok": push.get("ok"),
          }, sort_keys=True))
          PY


  finalize:
    needs: enqueue
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 7
    steps:
      - name: Verify and cancel only exact superseded FTMO runs if still active
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          gh auth status >/dev/null 2>&1

          protected=36947540556
          protected_sha="88793e868e02164770e554133e4ea85d07c1b985"
          protected_branch="worker3/bound-research-provider-timeout-20261002"

          test "$(gh api repos/Zennay/Ftmo/pulls/386 --jq '.state')" = "closed"
          test "$(gh api repos/Zennay/Ftmo/pulls/386 --jq '.merged')" = "true"
          test "$(gh api repos/Zennay/Ftmo/pulls/386 --jq '.head.sha')" = "$protected_sha"

          declare -A run_pr=(
            [36941119482]=380
            [36941462749]=383
            [36945491297]=387
            [36946253651]=388
            [36947322610]=389
            [36947457589]=390
          )
          declare -A run_branch=(
            [36941119482]="worker2/research-heartbeat-main2-20261001"
            [36941462749]="worker/ftmo-research-checkpoint-v4-20261001"
            [36945491297]="worker2/provider-timeout-recovery-20261002"
            [36946253651]="worker1/register-cpu-proof-zero-cost-workflow-20261002"
            [36947322610]="worker3/yield-actions-marathon-provider-backoff-20261002"
            [36947457589]="worker3/release-ftmo-runner-starvation-20261002"
          )

          for id in 36941119482 36941462749 36945491297 36946253651 36947322610 36947457589; do
            pr="${run_pr[$id]}"
            expected_branch="${run_branch[$id]}"
            actual_id="$(gh api "repos/Zennay/Ftmo/actions/runs/$id" --jq '.id')"
            status="$(gh api "repos/Zennay/Ftmo/actions/runs/$id" --jq '.status')"
            conclusion="$(gh api "repos/Zennay/Ftmo/actions/runs/$id" --jq '.conclusion // "null"')"
            sha="$(gh api "repos/Zennay/Ftmo/actions/runs/$id" --jq '.head_sha')"
            branch="$(gh api "repos/Zennay/Ftmo/actions/runs/$id" --jq '.head_branch')"
            event="$(gh api "repos/Zennay/Ftmo/actions/runs/$id" --jq '.event')"
            pr_state="$(gh api "repos/Zennay/Ftmo/pulls/$pr" --jq '.state')"
            pr_head="$(gh api "repos/Zennay/Ftmo/pulls/$pr" --jq '.head.sha')"

            test "$actual_id" = "$id"
            test "$branch" = "$expected_branch"
            test "$branch" != "main"
            test "$event" = "pull_request"
            test "$pr_state" = "closed"

            if [ "$sha" != "$pr_head" ]; then
              cmp_status="$(gh api "repos/Zennay/Ftmo/compare/$sha...$pr_head" --jq '.status')"
              cmp_behind="$(gh api "repos/Zennay/Ftmo/compare/$sha...$pr_head" --jq '.behind_by')"
              test "$cmp_status" = "ahead"
              test "$cmp_behind" = "0"
            fi

            echo "TARGET_PRE id=$id pr=$pr status=$status conclusion=$conclusion sha=$sha branch=$branch"
            case "$status" in
              queued|pending|in_progress)
                gh api --method POST "repos/Zennay/Ftmo/actions/runs/$id/cancel" >/dev/null
                echo "TARGET_ACTION id=$id action=requested_cancel"
                ;;
              completed)
                echo "TARGET_ACTION id=$id action=already_terminal"
                ;;
              *)
                echo "Refusing unexpected status for $id: $status" >&2
                exit 1
                ;;
            esac
          done

          for id in 36941119482 36941462749 36945491297 36946253651 36947322610 36947457589; do
            final_status=""
            for _ in $(seq 1 30); do
              final_status="$(gh api "repos/Zennay/Ftmo/actions/runs/$id" --jq '.status')"
              if [ "$final_status" = "completed" ]; then
                break
              fi
              sleep 2
            done
            test "$final_status" = "completed"
            final_conclusion="$(gh api "repos/Zennay/Ftmo/actions/runs/$id" --jq '.conclusion // "null"')"
            final_branch="$(gh api "repos/Zennay/Ftmo/actions/runs/$id" --jq '.head_branch')"
            test "$final_branch" != "main"
            echo "TARGET_FINAL id=$id status=$final_status conclusion=$final_conclusion branch=$final_branch"
          done

          p_status="$(gh api "repos/Zennay/Ftmo/actions/runs/$protected" --jq '.status')"
          p_conclusion="$(gh api "repos/Zennay/Ftmo/actions/runs/$protected" --jq '.conclusion // "null"')"
          p_sha="$(gh api "repos/Zennay/Ftmo/actions/runs/$protected" --jq '.head_sha')"
          p_branch="$(gh api "repos/Zennay/Ftmo/actions/runs/$protected" --jq '.head_branch')"
          test "$p_sha" = "$protected_sha"
          test "$p_branch" = "$protected_branch"
          echo "PROTECTED_RUN id=$protected status=$p_status conclusion=$p_conclusion sha=$p_sha branch=$p_branch"
          echo "FTMO_SUPERSEDED_CI_VERIFY_GREEN=1"

      - name: Finalize exact SQLite queue assignment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import importlib.util
          import json
          import sqlite3
          import sys
          from pathlib import Path

          queue_id = "zssh-ftmo-cancel-superseded-ci-v2-20261002"
          live_root = Path("/home/ubuntu/zennay-cloud")
          server_path = live_root / "server.py"
          db_path = live_root / "history.db"
          if not server_path.is_file() or not db_path.is_file():
              raise SystemExit("live zCloud server/history.db missing")

          sys.path.insert(0, str(live_root))
          spec = importlib.util.spec_from_file_location("zcloud_live_server", server_path)
          if spec is None or spec.loader is None:
              raise SystemExit("cannot load live zCloud server module")
          server = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(server)
          server.DB = db_path

          with sqlite3.connect(db_path) as c:
              c.row_factory = sqlite3.Row
              row = c.execute(
                  "SELECT queue_id,project_id,title,status,eligible,worker_slot,evidence,updated_at "
                  "FROM portfolio_queue WHERE queue_id=?",
                  (queue_id,),
              ).fetchone()
          if row is None:
              raise SystemExit("queue item missing")
          item = dict(row)
          print("QUEUE_BEFORE=" + json.dumps(item, sort_keys=True))
          if item["project_id"] != "zssh":
              raise SystemExit(f"project mismatch: {item['project_id']}")

          evidence = (
              "On vps-bb300bba exact runs 36941119482, 36941462749, 36945491297, "
              "36946253651, 36947322610, and 36947457589 were identity-checked against "
              "closed/superseded PRs #380, #383, #387, #388, #389, and #390. All six "
              "were already terminal, so no cancellation request was sent. Final conclusions: "
              "36941119482 success; 36941462749 success; 36945491297 cancelled; "
              "36946253651 cancelled; 36947322610 cancelled; 36947457589 failure. "
              "Protected PR386 exact-head run 36947540556 was inspected only and remained "
              "completed/success on 88793e868e02164770e554133e4ea85d07c1b985. "
              "No FTMO repository, provider, research, preregistration, walk-forward, "
              "final-holdout, broker, or live-trading state was modified."
          )

          if item["status"] == "done":
              print("QUEUE_ALREADY_DONE=1")
          elif item["status"] in {"claimed", "running", "verifying", "in_progress"} and item["worker_slot"] is not None:
              result = server.portfolio_queue_finish(
                  int(item["worker_slot"]),
                  queue_id,
                  "DONE",
                  evidence,
              )
              print("QUEUE_FINISH_RESULT=" + json.dumps(result, sort_keys=True, default=str))
              if not result.get("updated"):
                  raise SystemExit("portfolio_queue_finish refused active assignment")
          else:
              raise SystemExit(
                  "refusing nonstandard queue mutation; "
                  f"status={item['status']} worker_slot={item['worker_slot']}"
              )

          with sqlite3.connect(db_path) as c:
              c.row_factory = sqlite3.Row
              after = c.execute(
                  "SELECT queue_id,project_id,status,eligible,worker_slot,evidence,updated_at "
                  "FROM portfolio_queue WHERE queue_id=?",
                  (queue_id,),
              ).fetchone()
          final = dict(after) if after else None
          print("QUEUE_AFTER=" + json.dumps(final, sort_keys=True))
          if not final or final["status"] != "done" or int(final["eligible"] or 0) != 0:
              raise SystemExit("queue final state is not done/eligible=0")
          print("ZCLOUD_SQLITE_QUEUE_FINALIZE_GREEN=1")
          PY
