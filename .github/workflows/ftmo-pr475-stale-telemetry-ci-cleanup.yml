name: Clear superseded FTMO telemetry CI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-pr475-stale-telemetry-ci-cleanup.yml"

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 5
    env:
      CURRENT_HEAD: 29237726faf21e6ff6a809c6a1386f2ba1c52634
    steps:
      - name: Cancel only superseded telemetry PR runs
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          python3 - <<'PY'
          import json, os, subprocess

          targets = {
              37162440132: "e17d084955e5b8cf49a1f057441760db3cf7afda",
              37162452829: "11012541925842d657fd2fee574a4a6100a79efc",
          }
          current = os.environ["CURRENT_HEAD"]
          for run_id, expected_sha in targets.items():
              raw = subprocess.check_output(
                  ["gh", "api", f"repos/Zennay/Ftmo/actions/runs/{run_id}"],
                  text=True,
              )
              run = json.loads(raw)
              actual = run.get("head_sha")
              status = run.get("status")
              if actual != expected_sha:
                  raise SystemExit(f"refuse run {run_id}: head moved to {actual}")
              if actual == current:
                  raise SystemExit(f"refuse run {run_id}: points at protected current head")
              if status in {"completed"}:
                  print(f"FTMO_STALE_RUN_ALREADY_TERMINAL id={run_id} conclusion={run.get('conclusion')}")
                  continue
              subprocess.check_call(
                  ["gh", "api", "--method", "POST", f"repos/Zennay/Ftmo/actions/runs/{run_id}/cancel"]
              )
              print(f"FTMO_STALE_RUN_CANCELLED id={run_id} sha={actual}")
          PY
