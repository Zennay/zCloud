name: zSSH d346 target-agent exact-head proof

on:
  push:
    paths:
      - ".github/workflows/zssh-d346-target-agent-proof.yml"

permissions:
  contents: read

jobs:
  prove:
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 15
    steps:
      - name: Checkout exact canonical zSSH head
        uses: actions/checkout@v4
        with:
          repository: Zennay/zSSH
          ref: d346051d64953dcf260cfeb78214249026e17dc1
          path: zssh
          fetch-depth: 1

      - name: Verify exact head and host
        shell: bash
        run: |
          set -Eeuo pipefail
          cd zssh
          test "$(git rev-parse HEAD)" = "d346051d64953dcf260cfeb78214249026e17dc1"
          echo "runner=$RUNNER_NAME"
          echo "hostname=$(hostname)"
          echo "sha=$(git rev-parse HEAD)"

      - name: Install dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          cd zssh
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Run full and deployment-security tests
        shell: bash
        run: |
          set -Eeuo pipefail
          cd zssh
          npm test
          node --test test/agent-pairing-control.test.mjs test/agent-client.test.mjs test/agent-identity.test.mjs test/deploy.test.mjs
          bash -n deploy/install-target-agent.sh
          node --check scripts/create-agent-identity.mjs

      - name: Prove target-local identity permissions
        shell: bash
        run: |
          set -Eeuo pipefail
          cd zssh
          proof_home="$RUNNER_TEMP/zssh-d346-identity"
          rm -rf "$proof_home"
          mkdir -p "$proof_home"
          output="$(HOME="$proof_home" npm run --silent agent:init -- zt_vpsproof1234 "$proof_home/.config/zssh/agent-ed25519.pem")"
          printf '%s\n' "$output" | grep -F '"private_key_printed": false'
          ! printf '%s\n' "$output" | grep -F 'BEGIN PRIVATE KEY'
          test "$(stat -c '%a' "$proof_home/.config/zssh")" = "700"
          test "$(stat -c '%a' "$proof_home/.config/zssh/agent-ed25519.pem")" = "600"
          rm -rf "$proof_home"

      - name: Prove tracked-only release export excludes local secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          cd zssh
          printf 'SHOULD_NOT_SHIP=secret\n' > .env
          stage="$RUNNER_TEMP/zssh-d346-archive"
          rm -rf "$stage"
          mkdir -p "$stage"
          git archive --format=tar d346051d64953dcf260cfeb78214249026e17dc1 | tar -x -C "$stage"
          test ! -e "$stage/.env"
          test -f "$stage/deploy/install-target-agent.sh"
          rm -rf "$stage" .env
          echo "ZSSH_D346_VPS_PROOF_GREEN"
