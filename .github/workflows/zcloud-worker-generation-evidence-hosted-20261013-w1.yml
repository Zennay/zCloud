name: zCloud worker generation evidence (hosted)
on:
  pull_request:
    branches: [main]
    paths:
      - "server.py"
      - "public/zcloud-worker.user.js"
      - "tests/_worker_env.py"
      - "scripts/zcloud_worker_generation_evidence_20261013_w1.py"
      - "tests/test_zcloud_worker_generation_evidence_20261013_w1.py"
      - "tests/test_zcloud_worker_generation_http_integration_20261013_w1.py"
      - "ops/zssh-runner-recipes/zcloud-generation-check.py"
      - "docs/control-plane-generation-evidence-20261013-w1.md"
      - ".github/workflows/zcloud-worker-generation-evidence-hosted-20261013-w1.yml"
      - "tests/test_zcloud_worker_generation_hosted_ci_trust_20261014.py"
  push:
    branches: [main]
    paths:
      - "server.py"
      - "public/zcloud-worker.user.js"
      - "tests/_worker_env.py"
      - "scripts/zcloud_worker_generation_evidence_20261013_w1.py"
      - "tests/test_zcloud_worker_generation_evidence_20261013_w1.py"
      - "tests/test_zcloud_worker_generation_http_integration_20261013_w1.py"
      - "ops/zssh-runner-recipes/zcloud-generation-check.py"
      - "docs/control-plane-generation-evidence-20261013-w1.md"
      - ".github/workflows/zcloud-worker-generation-evidence-hosted-20261013-w1.yml"
      - "tests/test_zcloud_worker_generation_hosted_ci_trust_20261014.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zcloud-worker-generation-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  offline-acceptance:
    if: >-
      github.repository == 'Zennay/zCloud' &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main' &&
        github.actor == 'Zennay' &&
        github.triggering_actor == 'Zennay' &&
        github.run_attempt == 1))
      && ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || (github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'Zennay'))
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 5
    steps:
      - name: Checkout immutable candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 1
      - name: Verify immutable source before running worker-evidence code
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$EXPECTED_REPO" = "Zennay/zCloud"
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Verify interpreter and test real module
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/zcloud_worker_generation_evidence_20261013_w1.py tests/test_zcloud_worker_generation_evidence_20261013_w1.py ops/zssh-runner-recipes/zcloud-generation-check.py tests/test_zcloud_worker_generation_http_integration_20261013_w1.py
          python3 -m unittest -v tests.test_zcloud_worker_generation_evidence_20261013_w1 tests.test_zcloud_worker_generation_http_integration_20261013_w1 tests.test_zcloud_worker_generation_hosted_ci_trust_20261014
      - name: Record non-production proof boundary
        run: |
          echo "This checks offline worker telemetry classification only." >> "$GITHUB_STEP_SUMMARY"
          echo "Not proof of VPS generation, an open browser tab, or live deployment." >> "$GITHUB_STEP_SUMMARY"
