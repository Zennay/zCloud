name: Recover HaxLab runner for RaiseAI PR23

on:
  push:
    branches:
      - ops/recover-haxlab-for-raiseai-pr23-20261004
    paths:
      - ".github/workflows/raiseai-pr23-haxlab-runner-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: raiseai-pr23-haxlab-runner-recovery
  cancel-in-progress: true

jobs:
  recover:
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 6
    env:
      HAXLAB_SERVICE: actions.runner.Zennay-Haxlab.vps-bb300bba-haxlab.service
      HAXLAB_RUN_USER: haxlab-runner
      TARGET_RUN: "37167797726"
    steps:
      - name: Recover idle HaxLab listener
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"

          service="$HAXLAB_SERVICE"
          pre_state="$(systemctl is-active "$service" || true)"
          pre_pid="$(systemctl show "$service" -p MainPID --value || true)"
          worker=0
          pgrep -u "$HAXLAB_RUN_USER" -f 'Runner\.Worker' >/dev/null 2>&1 && worker=1 || true

          if [ "$worker" -eq 1 ]; then
            action=preserve-active-worker
          elif [ "$pre_state" = "active" ]; then
            sudo -n systemctl restart "$service"
            action=restart-idle-listener
          else
            sudo -n systemctl reset-failed "$service" || true
            sudo -n systemctl start "$service"
            action=start-inactive-listener
          fi

          for _ in $(seq 1 20); do
            state="$(systemctl is-active "$service" || true)"
            pid="$(systemctl show "$service" -p MainPID --value || true)"
            if [ "$state" = "active" ] && [[ "$pid" =~ ^[1-9][0-9]*$ ]] && [ -r "/proc/$pid/cmdline" ]; then
              cmdline="$(tr '\0' ' ' < "/proc/$pid/cmdline")"
              if [[ "$cmdline" == *"Runner.Listener"* || "$cmdline" == *"runsvc.sh"* ]]; then
                echo "HAXLAB_RUNNER_RECOVERY action=$action pre_state=$pre_state pre_pid=$pre_pid post_state=$state post_pid=$pid"
                exit 0
              fi
            fi
            sleep 2
          done

          systemctl --no-pager --full status "$service" || true
          exit 1

      - name: Prove RaiseAI PR23 proof leaves queue
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 36); do
            payload="$(curl -fsSL --max-time 10               -H 'Accept: application/vnd.github+json'               -H 'X-GitHub-Api-Version: 2022-11-28'               "https://api.github.com/repos/Zennay/HaxLab/actions/runs/$TARGET_RUN")"
            status="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])' <<<"$payload")"
            conclusion="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("conclusion") or "")' <<<"$payload")"
            echo "RAISEAI_PR23_PROOF run=$TARGET_RUN status=$status conclusion=$conclusion"
            if [ "$status" = "in_progress" ] || [ "$status" = "completed" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "RaiseAI PR23 proof remained queued after HaxLab listener recovery" >&2
          exit 1
