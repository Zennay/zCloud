name: zCloud GitHub artifact retention audit

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/zcloud_artifact_retention_audit.py"
      - "tests/test_zcloud_artifact_retention_audit.py"
      - "tests/test_artifact_retention_hosted_proof_20261014.py"
      - ".github/workflows/zcloud-artifact-retention-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zcloud-artifact-retention-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || (github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'Zennay'))
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 4
    steps:
      - name: Check out exact candidate revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 1

      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Run hosted artifact-retention regressions
        run: |
          set -euo pipefail
          python3 -m unittest -v tests.test_zcloud_artifact_retention_audit tests.test_artifact_retention_hosted_proof_20261014
          python3 -m py_compile scripts/zcloud_artifact_retention_audit.py

  audit:
    name: Repository source-retention audit (hosted; no VPS)
    needs: validate
    if: >-
      (github.event_name == 'pull_request' &&
       github.actor == 'Zennay' &&
       github.triggering_actor == 'Zennay' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' &&
       github.repository == 'Zennay/zCloud' &&
       github.ref == 'refs/heads/main' &&
       github.actor == 'Zennay' &&
       github.triggering_actor == 'Zennay')
      && ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || (github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'Zennay'))
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 5
    steps:
      - name: Check out exact candidate revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 1

      - name: Confirm immutable source audit without VPS authority
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$GITHUB_REPOSITORY" = "Zennay/zCloud"
          test "$RUNNER_OS" = "Linux"

      - name: Re-run focused regressions on GitHub-hosted CI
        run: |
          set -euo pipefail
          python3 -m unittest -v tests.test_zcloud_artifact_retention_audit tests.test_artifact_retention_hosted_proof_20261014
          python3 -m py_compile scripts/zcloud_artifact_retention_audit.py

      - name: Audit repository artifact retention read only
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/zcloud-artifact-retention-audit.json"
          python3 scripts/zcloud_artifact_retention_audit.py --repo-root . --max-days 30 | tee "$report"
          REPORT="$report" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path(os.environ["REPORT"]).read_text(encoding="utf-8"))
          assert payload["policy"] == "github-actions-artifact-retention-audit-v1"
          assert payload["mutation_performed"] is False
          assert payload["upload_count"] >= 1
          assert payload["finding_count"] >= 0
          print(
              "ZCLOUD_ARTIFACT_RETENTION_AUDIT_GREEN="
              f"uploads:{payload['upload_count']}:findings:{payload['finding_count']}"
          )
          PY

      - name: Upload bounded audit evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zcloud-artifact-retention-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/zcloud-artifact-retention-audit.json
          if-no-files-found: error
          retention-days: 14


  prove:
    name: Optional owner-only current-main source audit on permanent VPS
    needs: validate
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'Zennay/zCloud' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'Zennay' &&
      github.triggering_actor == 'Zennay'
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 5
    steps:
      - name: Checkout current main without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 1

      - name: Check exact current main and permanent runner before source audit
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REPOSITORY" = "Zennay/zCloud"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_ACTOR" = "Zennay"
          test "$GITHUB_TRIGGERING_ACTOR" = "Zennay"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          current_main="$(timeout 15 git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          test -n "$current_main"
          test "$current_main" = "$GITHUB_SHA"
          test "$(id -un)" = "ubuntu"
          test "$(hostname)" = "vps-bb300bba"
          python3 scripts/zcloud_vps_runner_guard.py --json

      - name: Verify source-only retention scanner on VPS (not a live deploy)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v tests.test_zcloud_artifact_retention_audit tests.test_artifact_retention_hosted_proof_20261014
          python3 scripts/zcloud_artifact_retention_audit.py --repo-root . --max-days 30 > "$RUNNER_TEMP/zcloud-artifact-retention-manual-proof.json"
          python3 - "$RUNNER_TEMP/zcloud-artifact-retention-manual-proof.json" <<'PY'
          import json, sys
          from pathlib import Path
          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert payload["policy"] == "github-actions-artifact-retention-audit-v1"
          assert payload["mutation_performed"] is False
          assert payload["upload_count"] >= 1
          print("ZCLOUD_RETENTION_MANUAL_READONLY_PROOF_GREEN=1")
          PY
