name: zCloud read-only live tab version probe

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/zcloud-live-tab-version-probe.yml
      - tests/test_zcloud_live_tab_probe_trust.py
  push:
    branches: [main]
    paths:
      - .github/workflows/zcloud-live-tab-version-probe.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zcloud-live-tab-version-probe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  hosted-policy-regression:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read exact PR revision without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          clean: true
      - name: Check exact PR revision and run trust regressions
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python3 -m unittest -v tests.test_zcloud_live_tab_probe_trust

  inspect:
    # A PR may only execute the hosted source checks above. Never grant an
    # unreviewed revision access to Firefox or the permanent self-hosted runner.
    if: >-
      github.repository == 'Zennay/zCloud' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && github.actor == 'Zennay'))
    runs-on: [self-hosted, ftmo-research]
    timeout-minutes: 4
    steps:
      - name: Inspect Firefox debugger version without changing tabs
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY:-}" = "Zennay/zCloud"
          test "${GITHUB_REF:-}" = "refs/heads/main"
          test "${RUNNER_OS:-}" = "Linux"
          test "$(id -un)" = "ubuntu"
          test "$(hostname)" = "vps-bb300bba"
          # Step-level defense in depth if a job-level condition is refactored.
          case "${GITHUB_EVENT_NAME:-}:${GITHUB_ACTOR:-}" in
            push:*) ;;
            workflow_dispatch:Zennay) ;;
            *) echo "Untrusted tab probe invocation refused" >&2; exit 1 ;;
          esac
          python3 - <<'PY'
          import json, os, re, socket, subprocess, time
          from pathlib import Path
          # Only read Firefox RDP actor data. Never navigate, close, reload
          # tabs or print private conversation titles, URLs or prompts.
          proc=subprocess.run(["ps","-eo","pid=,args="],text=True,capture_output=True,timeout=5)
          matches=[]
          for line in proc.stdout.splitlines():
              if "-start-debugger-server" not in line or "/firefox" not in line:continue
              found=re.search(r"-start-debugger-server\s+(\d+)",line)
              if found:matches.append((line.strip().split()[0],int(found.group(1))))
          print("FIREFOX_DEBUGGER_PROCESS_COUNT="+str(len(matches)))
          if not matches:raise SystemExit(0)
          pid,port=matches[0]
          print("FIREFOX_MAIN_PID="+pid)
          def msg(sock,timeout=8):
              sock.settimeout(timeout)
              prefix=bytearray()
              while True:
                  char=sock.recv(1)
                  if not char:raise EOFError("RDP closed")
                  if char==b":":break
                  if len(prefix)>9 or not char.isdigit():raise ValueError("Unexpected RDP frame")
                  prefix+=char
              remaining=int(prefix)
              if remaining>2_000_000:raise ValueError("RDP oversize")
              data=bytearray()
              while len(data)<remaining:
                  part=sock.recv(min(65536,remaining-len(data)))
                  if not part:raise EOFError("RDP incomplete")
                  data+=part
              return json.loads(data)
          def send(sock,payload):
              data=json.dumps(payload,separators=(",",":")).encode()
              sock.sendall(str(len(data)).encode()+b":"+data)
          try:
              with socket.create_connection(("127.0.0.1",port),timeout=4) as sock:
                  hello=msg(sock)
                  send(sock,{"to":str(hello.get("from") or "root"),"type":"listTabs"})
                  listing=msg(sock)
                  if "tabs" not in listing:
                      print("RDP_LIST_TABS_UNAVAILABLE=1")
                      print("RDP_RESPONSE_KIND="+str(listing.get("error") or listing.get("type") or "unknown")[:50])
                      raise SystemExit(0)
                  tabs=[tab for tab in listing.get("tabs",[]) if isinstance(tab,dict)]
                  chat=[tab for tab in tabs if str(tab.get("url","")).startswith("https://chatgpt.com/")]
                  print("RDP_ROOT_FIELD_NAMES="+json.dumps(sorted(listing.keys())))
                  if chat:
                      print("RDP_TAB_FIELD_NAMES="+json.dumps(sorted(chat[0].keys())))
                  print("RDP_TAB_COUNT="+str(len(tabs)))
                  print("RDP_CHATGPT_TABS="+str(len(chat)))
                  versions=[]
                  # Current Firefox listTabs returns TabDescriptor actors,
                  # which don't include consoleActor until getTarget().
                  # This is a read-only actor discovery; no tab is navigated,
                  # reloaded, selected, closed, or paused.
                  if chat:
                      send(sock,{"to":chat[0]["actor"],"type":"getTarget"})
                      target_form=None
                      deadline=time.monotonic()+4
                      while time.monotonic()<deadline:
                          resp=msg(sock,4)
                          if resp.get("from")!=chat[0]["actor"]:continue
                          print("RDP_TARGET_RESPONSE_FIELDS="+json.dumps(sorted(resp.keys())))
                          target_form=resp.get("target") or resp.get("form") or resp.get("frame") or {}
                          if isinstance(target_form,dict):
                              print("RDP_TARGET_FORM_FIELDS="+json.dumps(sorted(target_form.keys())))
                              if target_form.get("consoleActor"):
                                  chat[0]["consoleActor"]=target_form["consoleActor"]
                          break
                  for tab in chat[:20]:
                      actor=tab.get("consoleActor")
                      if not actor:continue
                      send(sock,{"to":actor,"type":"evaluateJS",
                         "text":"document.documentElement?.getAttribute('data-zcloud-violentmonkey-ready') || ''"})
                      deadline=time.monotonic()+3
                      while time.monotonic()<deadline:
                          response=msg(sock,3)
                          if response.get("from")!=actor:continue
                          value=response.get("result")
                          if isinstance(value,dict):value=value.get("value","")
                          text=str(value or "")
                          if re.fullmatch(r"1\.3\.\d{1,3}",text):
                              versions.append(text)
                          else:versions.append("unknown")
                          break
                  print("RDP_VERSION_PROBES="+str(len(versions)))
                  print("RDP_SCRIPT_VERSIONS="+json.dumps(sorted(set(versions))))
                  print("RDP_IS_TARGET_SCRIPT_LIVE="+str(bool(versions) and set(versions)=={"1.3.18"}).lower())
          except (OSError,ValueError,TimeoutError,EOFError) as exc:
              print("RDP_SAFE_PROBE_UNAVAILABLE="+type(exc).__name__)
          PY
          echo "READ_ONLY_PROBE_NO_TAB_OR_BROWSER_CHANGES=1"
