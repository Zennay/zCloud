name: zCloud HaxLab runner control-plane pressure cap

on:
  workflow_dispatch:
  push:
    branches:
      - debug/worker-continuity-20261006
    paths:
      - ".github/workflows/zcloud-haxlab-runner-pressure-cap.yml"
      - "tests/test_haxlab_runner_pressure_cap_workflow.py"

permissions:
  contents: read

concurrency:
  group: zcloud-haxlab-runner-pressure-cap
  cancel-in-progress: false

jobs:
  apply:
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Validate pressure-cap workflow contract
        run: |
          set -euo pipefail
          python3 -m unittest tests.test_haxlab_runner_pressure_cap_workflow

      - name: Guard permanent zCloud runner
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          python3 scripts/zcloud_vps_runner_guard.py --json

      - name: Bound HaxLab Actions runner to project CPU contract
        shell: bash
        run: |
          set -euo pipefail
          unit='actions.runner.Zennay-Haxlab.vps-bb300bba-haxlab.service'
          systemctl is-active --quiet "$unit"

          before="$RUNNER_TEMP/haxlab-runner-before.txt"
          after="$RUNNER_TEMP/haxlab-runner-after.txt"

          {
            date --iso-8601=seconds
            uptime
            systemctl show "$unit"               -p ActiveState -p SubState -p MainPID -p ControlGroup               -p CPUQuotaPerSecUSec -p CPUWeight
            ps -eo pid,ppid,user,ni,%cpu,%mem,etime,stat,cmd --sort=-%cpu               | grep -E 'elite_closed_loop_arena_v2|haxlab-train-bc|Runner.Worker'               | head -n 30 || true
          } | tee "$before"

          # project-contracts.json declares HaxLab background compute at one soft
          # CPU core. The long-running arena currently lives below the HaxLab
          # Actions runner, outside the previously capped haxlab-autonomy unit.
          # Apply a runtime-only cgroup bound: no process restart, no SIGSTOP,
          # and no persistent unit-file mutation.
          sudo -n systemctl set-property --runtime "$unit" CPUQuota=100% CPUWeight=100

          quota="$(systemctl show "$unit" -p CPUQuotaPerSecUSec --value)"
          weight="$(systemctl show "$unit" -p CPUWeight --value)"
          state="$(systemctl is-active "$unit")"
          printf 'state=%s quota=%s weight=%s\n' "$state" "$quota" "$weight"
          test "$state" = active
          test "$quota" = 1s
          test "$weight" = 100

          sleep 20

          {
            date --iso-8601=seconds
            uptime
            systemctl show "$unit"               -p ActiveState -p SubState -p MainPID -p ControlGroup               -p CPUQuotaPerSecUSec -p CPUWeight
            ps -eo pid,ppid,user,ni,%cpu,%mem,etime,stat,cmd --sort=-%cpu               | grep -E 'elite_closed_loop_arena_v2|haxlab-train-bc|Runner.Worker'               | head -n 30 || true
          } | tee "$after"

      - name: Verify zCloud and Firefox remain responsive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import time
          import urllib.request

          def get(path, timeout):
              with urllib.request.urlopen("http://127.0.0.1:8765" + path, timeout=timeout) as response:
                  return int(response.status), json.load(response)

          root_ok = False
          for _ in range(8):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8765/", timeout=4) as response:
                      root_ok = int(response.status) < 300
              except Exception:
                  root_ok = False
              if root_ok:
                  break
              time.sleep(2)
          if not root_ok:
              raise SystemExit("zCloud lightweight root endpoint did not recover after HaxLab cap")

          last = None
          for _ in range(8):
              try:
                  status, payload = get("/api/runner-live", 12)
                  last = payload
                  firefox = payload.get("chatgpt_firefox") or {}
                  if status < 300 and firefox.get("active"):
                      runners = payload.get("chatgpt_runners") or {}
                      live = sum(
                          1
                          for project in runners.values()
                          for worker in (project.get("workers") or [])
                          if worker.get("state") not in ("offline", "paused")
                      )
                      print("ZCLOUD_PRESSURE_CAP_LIVE=" + json.dumps({
                          "firefox_active": True,
                          "live_workers": live,
                          "runner_projects": len(runners),
                      }, sort_keys=True))
                      break
              except Exception as exc:
                  last = {"error": repr(exc)}
              time.sleep(3)
          else:
              raise SystemExit("runner-live did not recover: " + json.dumps(last, sort_keys=True))
          PY

      - name: Upload pressure-cap evidence
        uses: actions/upload-artifact@v4
        with:
          name: zcloud-haxlab-runner-pressure-cap-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/haxlab-runner-before.txt
            ${{ runner.temp }}/haxlab-runner-after.txt
