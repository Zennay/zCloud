name: zCloud backlog impact-risk selection proof

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/zcloud_backlog_selection.py
      - tests/test_backlog_selection.py
      - tests/test_backlog_selection_workflow.py
      - docs/backlog-selection-contract.md
      - .github/workflows/zcloud-backlog-selection-proof.yml
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zcloud-backlog-selection-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.actor == 'Zennay' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact candidate
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          fi
      - name: Run policy tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/zcloud_backlog_selection.py tests/test_backlog_selection.py tests/test_backlog_selection_workflow.py
          python3 -m unittest -v tests.test_backlog_selection tests.test_backlog_selection_workflow

  permanent-vps-proof:
    needs: validate
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact candidate and permanent VPS runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          test "$(id -un)" = "ubuntu"
          python3 scripts/zcloud_vps_runner_guard.py --json
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          fi
      - name: Prove deterministic selection policy
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v tests.test_backlog_selection tests.test_backlog_selection_workflow
          printf '%s\n' '{"schema_version":1,"candidates":[{"id":"high-safe","impact":5,"risk":1,"executable":true,"claimed":false,"human_gate":false,"conflict":false},{"id":"high-risk","impact":5,"risk":4,"executable":true,"claimed":false,"human_gate":false,"conflict":false},{"id":"claimed","impact":5,"risk":1,"executable":true,"claimed":true,"human_gate":false,"conflict":false}]}'             | python3 scripts/zcloud_backlog_selection.py --require-selected             > "$RUNNER_TEMP/backlog-selection.json"
          python3 - "$RUNNER_TEMP/backlog-selection.json" <<'PY'
          import json, sys
          from pathlib import Path
          payload=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert payload["schema_version"] == "backlog-selection-v1", payload
          assert payload["decision"] == "SELECTED", payload
          assert payload["selected_id"] == "high-safe", payload
          assert payload["excluded_counts"] == {"already_claimed": 1}, payload
          print("ZCLOUD_BACKLOG_SELECTION_VPS_GREEN=1")
          PY
