name: zCloud Actions queue pressure audit

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "scripts/zcloud_actions_queue_pressure.py"
      - "tests/test_zcloud_actions_queue_pressure.py"
      - "tests/test_zcloud_actions_queue_pressure_workflow.py"
      - ".github/workflows/zcloud-actions-queue-pressure.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: zcloud-actions-queue-pressure-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 1

      - name: Verify exact checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Run focused pressure regressions
        run: |
          python3 -m unittest -v             tests.test_zcloud_actions_queue_pressure             tests.test_zcloud_actions_queue_pressure_workflow

      - name: Capture bounded read-only Actions snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          import urllib.parse
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "zcloud-actions-queue-pressure",
          }

          def get(path):
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}{path}",
                  headers=headers,
              )
              with urllib.request.urlopen(req, timeout=20) as response:
                  return json.load(response)

          active_statuses = ("queued", "in_progress", "waiting", "pending", "requested")
          source_complete = True
          active_by_id = {}
          for status in active_statuses:
              payload = get(f"/actions/runs?status={status}&per_page=100")
              rows = payload.get("workflow_runs", [])
              if int(payload.get("total_count") or 0) > len(rows):
                  source_complete = False
              for run in rows:
                  active_by_id[int(run["id"])] = run

          active = sorted(
              active_by_id.values(),
              key=lambda run: str(run.get("created_at") or ""),
          )
          if len(active) > 30:
              source_complete = False
          active = active[:30]
          runs = []
          for run in active:
              jobs_payload = get(
                  f"/actions/runs/{int(run['id'])}/jobs?per_page=100"
              )
              jobs = jobs_payload.get("jobs", [])
              if int(jobs_payload.get("total_count") or 0) > len(jobs):
                  source_complete = False
              run_created = str(run.get("created_at") or "")
              runs.append({
                  "workflow_path": str(run.get("path") or ""),
                  "status": str(run.get("status") or ""),
                  "created_at": run_created,
                  "jobs": [
                      {
                          "status": str(job.get("status") or ""),
                          "created_at": str(job.get("created_at") or run_created),
                          "labels": [
                              str(label)
                              for label in (job.get("labels") or [])
                          ][:16],
                      }
                      for job in jobs[:100]
                  ],
              })

          out = {
              "schema_version": 1,
              "captured_at": datetime.now(timezone.utc).isoformat(),
              "capacity": 1,
              "source_complete": source_complete,
              "runs": runs,
          }
          path = Path(os.environ["RUNNER_TEMP"]) / "zcloud-actions-queue-pressure.json"
          path.write_text(json.dumps(out), encoding="utf-8")
          print(
              "ZCLOUD_ACTIONS_PRESSURE_SNAPSHOT "
              f"active_runs={len(runs)} source_complete={str(source_complete).lower()}"
          )
          PY

      - name: Classify zCloud VPS runner pressure
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/zcloud_actions_queue_pressure.py             --input "$RUNNER_TEMP/zcloud-actions-queue-pressure.json"
