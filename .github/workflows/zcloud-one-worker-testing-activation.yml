name: zCloud two-worker one-shot activation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/zcloud-one-worker-testing-activation.yml

permissions:
  contents: read

concurrency:
  group: zcloud-two-worker-one-shot-activation
  cancel-in-progress: true

jobs:
  activate:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Check out the activation revision
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Reload the installed Firefox runner add-on
        run: node scripts/zcloud_reload_extension.mjs

      - name: Enable exactly two queue-owned workers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request

          BASE = "http://127.0.0.1:8765"

          def call(method, path, payload=None):
              body = None
              headers = {"User-Agent": "zcloud-two-worker-one-shot-activation/1"}
              if payload is not None:
                  body = json.dumps(payload).encode("utf-8")
                  headers["Content-Type"] = "application/json"
              request = urllib.request.Request(BASE + path, data=body, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(request, timeout=15) as response:
                      return json.load(response)
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode("utf-8", "replace")
                  raise SystemExit(f"{method} {path} failed with HTTP {exc.code}: {detail[:1000]}") from exc

          before = call("GET", "/api/runner-targets")
          if int(before.get("max_workers") or 0) != 2:
              raise SystemExit(f"expected max_workers=2, got {before.get('max_workers')!r}")
          if int(before.get("global_worker_limit") or 0) != 2:
              raise SystemExit(f"expected global_worker_limit=2, got {before.get('global_worker_limit')!r}")

          allocation = before.get("global_allocation") or {}
          workers = allocation.get("workers") or []
          if len(workers) != 2:
              raise SystemExit(f"expected exactly two eligible VPS queue workers, got {len(workers)}: {workers}")

          projects = []
          for worker in workers:
              project_id = str(worker.get("project_id") or "").strip()
              worker_key = str(worker.get("worker_key") or "").strip()
              if not project_id or not worker_key:
                  raise SystemExit(f"invalid queue allocation: {worker}")
              if project_id not in projects:
                  projects.append(project_id)

          starts = []
          for project_id in projects:
              result = call("POST", "/api/runner-control", {
                  "project_id": project_id,
                  "action": "start",
              })
              if not result.get("ok"):
                  raise SystemExit(f"project start was not accepted for {project_id}: {result}")
              starts.append({"project_id": project_id, "result": result})

          final = None
          expected_keys = {str(worker["worker_key"]) for worker in workers}
          for _ in range(12):
              time.sleep(5)
              final = call("GET", "/api/runner-targets")
              live_workers = final.get("workers") or {}
              ready = {
                  key for key, value in live_workers.items()
                  if key in expected_keys
                  and bool(value.get("active"))
                  and str(value.get("desired_state") or "") == "running"
              }
              if ready == expected_keys:
                  break

          live_workers = (final or {}).get("workers") or {}
          ready = {
              key for key, value in live_workers.items()
              if key in expected_keys
              and bool(value.get("active"))
              and str(value.get("desired_state") or "") == "running"
          }
          if ready != expected_keys:
              raise SystemExit(f"two-worker activation not confirmed; expected={sorted(expected_keys)} ready={sorted(ready)}")

          print(json.dumps({
              "ok": True,
              "mode": "two-worker-guarded",
              "worker_limit": final.get("max_workers"),
              "global_worker_limit": final.get("global_worker_limit"),
              "worker_keys": sorted(expected_keys),
              "active_worker_keys": sorted(ready),
              "dispatch_cooldown_seconds": (final.get("global_allocation") or {}).get("dispatch_cooldown_seconds"),
              "starts": starts,
          }, ensure_ascii=False, sort_keys=True))
          PY
