name: zCloud dynamic worker pool activation

on:
  workflow_run:
    workflows: ["zCloud VPS deploy"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: zcloud-dynamic-worker-pool-activation
  cancel-in-progress: true

jobs:
  activate:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: self-hosted
    timeout-minutes: 8
    steps:
      - name: Check out the deployed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          clean: true
          fetch-depth: 1

      - name: Ensure the Firefox runner runtime is live
        shell: bash
        run: |
          set -euo pipefail
          export XDG_RUNTIME_DIR=/run/user/1000
          export DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1000/bus

          # Do not recycle a healthy standalone userscript browser on every
          # production deploy. That destroys active worker tabs and can also
          # fail intentionally when the legacy systemd Firefox unit is disabled.
          if pgrep -u "$(id -u)" -f '/snap/firefox/.*/usr/lib/firefox/firefox' >/dev/null; then
            echo "FIREFOX_RUNTIME=existing-standalone"
            pgrep -af 'firefox|web-ext' || true
            exit 0
          fi

          echo "FIREFOX_RUNTIME=missing; attempting user-service recovery"
          systemctl --user restart chatgpt-firefox.service
          systemctl --user is-active --quiet chatgpt-firefox.service
          systemctl --user --no-pager --full status chatgpt-firefox.service || true
          journalctl --user -u chatgpt-firefox.service -n 30 --no-pager || true
          pgrep -af 'firefox|web-ext' || true

      - name: Honor dashboard-owned dynamic worker pool
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import http.client
          import json
          import time
          import urllib.error
          import urllib.request

          BASE = "http://127.0.0.1:8765"

          def call(method, path, payload=None):
              body = None
              headers = {"User-Agent": "zcloud-dynamic-worker-pool-activation/1"}
              if payload is not None:
                  body = json.dumps(payload).encode("utf-8")
                  headers["Content-Type"] = "application/json"
              # /api/status can legitimately return 503 while its monitor starts.
              # Keep worker activation alive through that bounded warm-up instead
              # of abandoning already-allocated/queued workers.
              if method == "GET" and path.startswith("/api/runner-live"):
                  attempts = 10
              else:
                  attempts = 3 if method == "GET" else 1
              for attempt in range(attempts):
                  request = urllib.request.Request(BASE + path, data=body, headers=headers, method=method)
                  try:
                      with urllib.request.urlopen(request, timeout=15) as response:
                          return json.load(response)
                  except urllib.error.HTTPError as exc:
                      detail = exc.read().decode("utf-8", "replace")
                      if method == "GET" and exc.code == 503 and attempt + 1 < attempts:
                          time.sleep(2)
                          continue
                      raise SystemExit(f"{method} {path} failed with HTTP {exc.code}: {detail[:1000]}") from exc
                  except (urllib.error.URLError, http.client.RemoteDisconnected, TimeoutError) as exc:
                      if attempt + 1 >= attempts:
                          raise SystemExit(f"{method} {path} transport failed after {attempts} attempt(s): {exc}") from exc
                      time.sleep(1)
              raise AssertionError("unreachable")

          def worker_key(item):
              key = str(item.get("worker_key") or "").strip()
              if key:
                  return key
              project = str(item.get("project_id") or "").strip()
              slot = int(item.get("worker_slot") or 1)
              return f"{project}::w{slot}" if project else ""

          def live_worker(status, key):
              base = key.split("::w", 1)[0]
              workers = ((status.get("chatgpt_runners") or {}).get(base) or {}).get("workers") or []
              return next((
                  worker for worker in workers
                  if worker.get("worker_id") == key
                  and worker.get("state") == "live"
                  and int(worker.get("age_seconds") or 999999) <= 90
              ), None)

          DISPATCH_EVENTS = {
              "prompt-sent",
              "generation-started",
              "generation-progress",
              "generation-finished",
              "awaiting-vps-dispatch",
              "portfolio-queue-result",
          }

          def dispatched_worker(status, key, command_id):
              worker = live_worker(status, key)
              if not worker:
                  return None
              command = worker.get("command") or {}
              # The scheduler can legitimately supersede our start command with a
              # newer push/new-chat while the worker is coming alive. Treat the
              # activation command as an evidence floor, not as an immutable latest
              # command id; older evidence is still rejected.
              latest_command_id = int(command.get("id") or 0)
              if latest_command_id < int(command_id):
                  return None
              command_status = str(command.get("status") or "")
              event = str((worker.get("last_event") or {}).get("event") or "")
              # A browser-side send block is terminal for this dispatch even while
              # the API command is still pending. Fail immediately so a broken
              # selector cannot occupy the sole VPS runner for the full recovery loop.
              if event == "send-blocked":
                  raise SystemExit(
                      f"worker dispatch blocked for {key}: "
                      f"{(worker.get('last_event') or {}).get('reason') or 'unknown'}"
                  )
              if command_status == "failed":
                  raise SystemExit(f"worker command failed for {key}: {command}")
              if command_status != "completed":
                  return None
              if not worker.get("generating") and event not in DISPATCH_EVENTS:
                  return None
              return worker

          def allocation_state(targets):
              limit = int(targets.get("max_workers") or 0)
              allocation = targets.get("global_allocation") or {}
              selected = allocation.get("workers") or []
              if limit < 0 or limit > 8:
                  raise SystemExit(f"invalid dashboard dynamic worker limit: {limit}")
              if len(selected) > limit:
                  raise SystemExit(f"allocation exceeds dashboard limit: {len(selected)} > {limit}")
              keys = [worker_key(item) for item in selected]
              if any(not key for key in keys):
                  raise SystemExit(f"queue allocation contains worker without identity: {selected}")
              return limit, selected, keys

          before = call("GET", "/api/runner-targets")
          limit, selected, keys = allocation_state(before)

          if limit == 0:
              if selected:
                  raise SystemExit(f"dynamic workers are off but queue workers remain allocated: {selected}")
              print(json.dumps({
                  "ok": True,
                  "mode": "dashboard",
                  "worker_limit": 0,
                  "state": "disabled",
              }, ensure_ascii=False, sort_keys=True))
              raise SystemExit(0)

          if not selected:
              print(json.dumps({
                  "ok": True,
                  "mode": "dashboard",
                  "worker_limit": limit,
                  "state": "idle-no-eligible-queue-work",
              }, ensure_ascii=False, sort_keys=True))
              raise SystemExit(0)

          starts = {}
          command_ids = {}

          def start_keys(current_keys):
              for key in current_keys:
                  if key in command_ids:
                      continue
                  result = call("POST", "/api/runner-control", {
                      "project_id": key,
                      "action": "start",
                  })
                  if not result.get("ok"):
                      raise SystemExit(f"worker start was not accepted for {key}: {result}")
                  command_id = int(result.get("command_id") or 0)
                  if not command_id:
                      raise SystemExit(f"worker start did not return command id for {key}: {result}")
                  starts[key] = result
                  command_ids[key] = command_id

          start_keys(keys)

          final = before
          status = None
          live = {}
          current_limit = limit
          current_keys = keys
          for _ in range(12):
              time.sleep(5)
              final = call("GET", "/api/runner-targets")
              current_limit, _, current_keys = allocation_state(final)
              if current_limit == 0 or not current_keys:
                  live = {}
                  break
              start_keys(current_keys)
              status = call("GET", "/api/runner-live")
              live = {
                  key: dispatched_worker(status, key, command_ids[key])
                  for key in current_keys
              }
              if all(live.values()):
                  break

          missing = [key for key in current_keys if not live.get(key)]
          if missing:
              for key in missing:
                  recovered = call("POST", "/api/runner-control", {
                      "project_id": key,
                      "action": "new_chat",
                  })
                  if not recovered.get("ok"):
                      raise SystemExit(f"worker fresh-chat recovery was not accepted for {key}: {recovered}")
                  command_ids[key] = int(recovered.get("command_id") or 0)
                  if not command_ids[key]:
                      raise SystemExit(f"worker fresh-chat recovery did not return command id for {key}: {recovered}")
              for _ in range(12):
                  time.sleep(5)
                  final = call("GET", "/api/runner-targets")
                  current_limit, _, current_keys = allocation_state(final)
                  if current_limit == 0 or not current_keys:
                      live = {}
                      break
                  start_keys(current_keys)
                  status = call("GET", "/api/runner-live")
                  live = {
                      key: dispatched_worker(status, key, command_ids[key])
                      for key in current_keys
                  }
                  if all(live.values()):
                      break

          final_limit, _, final_keys = allocation_state(final)
          active = [
              key for key, value in (final.get("projects") or {}).items()
              if bool(value.get("active"))
          ]
          if len(active) > final_limit:
              raise SystemExit(f"more active workers than dashboard limit: {active}")
          missing = [key for key in final_keys if not live.get(key)]
          if missing:
              print("FINAL_RUNNER_TARGETS=" + json.dumps(final, ensure_ascii=False, sort_keys=True), flush=True)
              print("FINAL_STATUS=" + json.dumps(status, ensure_ascii=False, sort_keys=True), flush=True)
              raise SystemExit(f"no live Firefox heartbeat observed for current allocation: {missing}")

          print(json.dumps({
              "ok": True,
              "mode": "dashboard",
              "worker_limit": final_limit,
              "selected_workers": final_keys,
              "active_workers": active,
              "live_workers": {key: live.get(key) for key in final_keys},
              "dispatch_cooldown_seconds": (final.get("global_allocation") or {}).get("dispatch_cooldown_seconds"),
              "start_commands": starts,
          }, ensure_ascii=False, sort_keys=True))
          PY
