name: zCloud one-worker testing activation

on:
  workflow_run:
    workflows: ["zCloud VPS deploy"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: zcloud-one-worker-testing-activation
  cancel-in-progress: true

jobs:
  activate:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: self-hosted
    timeout-minutes: 8
    steps:
      - name: Check out the deployed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          clean: true
          fetch-depth: 1

      - name: Ensure the Firefox runner service is live
        shell: bash
        run: |
          set -euo pipefail
          export XDG_RUNTIME_DIR=/run/user/1000
          export DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1000/bus
          systemctl --user restart chatgpt-firefox.service
          systemctl --user is-active --quiet chatgpt-firefox.service
          systemctl --user --no-pager --full status chatgpt-firefox.service || true
          journalctl --user -u chatgpt-firefox.service -n 30 --no-pager || true
          pgrep -af 'firefox|web-ext' || true

      - name: Enable exactly one queue-owned worker
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request

          BASE = "http://127.0.0.1:8765"

          def call(method, path, payload=None):
              body = None
              headers = {"User-Agent": "zcloud-one-worker-testing-activation/1"}
              if payload is not None:
                  body = json.dumps(payload).encode("utf-8")
                  headers["Content-Type"] = "application/json"
              request = urllib.request.Request(BASE + path, data=body, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(request, timeout=15) as response:
                      return json.load(response)
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode("utf-8", "replace")
                  raise SystemExit(f"{method} {path} failed with HTTP {exc.code}: {detail[:1000]}") from exc

          before = call("GET", "/api/runner-targets")
          if int(before.get("max_workers") or 0) != 1:
              raise SystemExit(f"expected max_workers=1, got {before.get('max_workers')!r}")

          allocation = before.get("global_allocation") or {}
          workers = allocation.get("workers") or []
          if len(workers) != 1:
              raise SystemExit(f"expected exactly one eligible VPS queue worker, got {len(workers)}")

          project_id = str(workers[0].get("worker_key") or "").strip()
          if not project_id:
              base_project_id = str(workers[0].get("project_id") or "").strip()
              worker_slot = int(workers[0].get("worker_slot") or 1)
              project_id = f"{base_project_id}::w{worker_slot}"
          if not project_id:
              raise SystemExit("queue worker has no worker_key")

          started = call("POST", "/api/runner-control", {
              "project_id": project_id,
              "action": "start",
          })
          if not started.get("ok"):
              raise SystemExit(f"worker start was not accepted: {started}")

          final = None
          live_worker = None
          for _ in range(12):
              time.sleep(5)
              final = call("GET", "/api/runner-targets")
              status = call("GET", "/api/status?project=zcloud")
              active = [
                  key for key, value in (final.get("projects") or {}).items()
                  if bool(value.get("active"))
              ]
              workers = ((status.get("chatgpt_runners") or {}).get("raiseai") or {}).get("workers") or []
              live_worker = next(
                  (
                      worker for worker in workers
                      if worker.get("worker_id") == project_id
                      and worker.get("state") == "live"
                      and int(worker.get("age_seconds") or 999999) <= 90
                  ),
                  None,
              )
              print(json.dumps({
                  "poll_active_projects": active,
                  "poll_workers": workers,
                  "live_worker": live_worker,
              }, ensure_ascii=False, sort_keys=True), flush=True)
              if len(active) <= 1 and live_worker:
                  break

          def live_worker_for(worker_list):
              return next(
                  (
                      worker for worker in worker_list
                      if worker.get("worker_id") == project_id
                      and worker.get("state") == "live"
                      and int(worker.get("age_seconds") or 999999) <= 90
                  ),
                  None,
              )

          if not live_worker:
              recovered = call("POST", "/api/runner-control", {
                  "project_id": project_id,
                  "action": "new_chat",
              })
              if not recovered.get("ok"):
                  raise SystemExit(f"worker fresh-chat recovery was not accepted: {recovered}")
              print(json.dumps({
                  "recovery": "fresh-chat",
                  "project_id": project_id,
                  "command": recovered,
              }, ensure_ascii=False, sort_keys=True), flush=True)
              for _ in range(12):
                  time.sleep(5)
                  final = call("GET", "/api/runner-targets")
                  status = call("GET", "/api/status?project=zcloud")
                  active = [
                      key for key, value in (final.get("projects") or {}).items()
                      if bool(value.get("active"))
                  ]
                  workers = ((status.get("chatgpt_runners") or {}).get("raiseai") or {}).get("workers") or []
                  live_worker = live_worker_for(workers)
                  print(json.dumps({
                      "recovery_poll_active_projects": active,
                      "recovery_poll_workers": workers,
                      "live_worker": live_worker,
                  }, ensure_ascii=False, sort_keys=True), flush=True)
                  if len(active) <= 1 and live_worker:
                      break

          active = [
              key for key, value in (final.get("projects") or {}).items()
              if bool(value.get("active"))
          ]
          if int(final.get("max_workers") or 0) != 1:
              raise SystemExit(f"max_workers changed unexpectedly: {final.get('max_workers')!r}")
          if len(active) > 1:
              raise SystemExit(f"more than one project remains active: {active}")
          if not live_worker:
              print("FINAL_RUNNER_TARGETS=" + json.dumps(final, ensure_ascii=False, sort_keys=True), flush=True)
              print("FINAL_STATUS=" + json.dumps(status, ensure_ascii=False, sort_keys=True), flush=True)
              raise SystemExit("worker start was accepted, but no live Firefox heartbeat was observed")

          print(json.dumps({
              "ok": True,
              "mode": "testing",
              "worker_limit": final.get("max_workers"),
              "selected_project": project_id,
              "active_projects": active,
              "live_worker": live_worker,
              "dispatch_cooldown_seconds": (final.get("global_allocation") or {}).get("dispatch_cooldown_seconds"),
              "start_command": started,
          }, ensure_ascii=False, sort_keys=True))
          PY
