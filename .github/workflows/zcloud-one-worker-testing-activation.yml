name: zCloud dynamic worker pool activation

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/zcloud-one-worker-testing-activation.yml"
      - "tests/test_dynamic_worker_activation_workflow.py"
    types: [opened, synchronize, reopened]
  workflow_run:
    workflows: ["zCloud VPS deploy"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: zcloud-dynamic-worker-pool-activation-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      EXPECTED_ZCLOUD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.EXPECTED_ZCLOUD_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate activation trust contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_ZCLOUD_SHA"
          python3 -m unittest -v tests.test_dynamic_worker_activation_workflow

  activate:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 8
    env:
      EXPECTED_ZCLOUD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Check out exact deployed revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.EXPECTED_ZCLOUD_SHA }}
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact revision and permanent runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_ZCLOUD_SHA"
          test "$(id -un)" = ubuntu
          python3 scripts/zcloud_vps_runner_guard.py --json

      - name: Ensure the Firefox runner runtime is live
        shell: bash
        run: |
          set -euo pipefail
          export XDG_RUNTIME_DIR=/run/user/1000
          export DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1000/bus

          # Do not recycle a healthy standalone userscript browser on every
          # production deploy. That destroys active worker tabs and can also
          # fail intentionally when the legacy systemd Firefox unit is disabled.
          if pgrep -u "$(id -u)" -f '/snap/firefox/.*/usr/lib/firefox/firefox' >/dev/null; then
            echo "FIREFOX_RUNTIME=existing-standalone"
            pids="$(pgrep -u "$(id -u)" -f 'firefox|web-ext' || true)"
            count="$(printf '%s\n' "$pids" | sed '/^$/d' | wc -l | tr -d ' ')"
            echo "FIREFOX_PROCESS_COUNT=$count"
            exit 0
          fi

          echo "FIREFOX_RUNTIME=missing; attempting user-service recovery"
          systemctl --user restart chatgpt-firefox.service
          systemctl --user is-active --quiet chatgpt-firefox.service
          systemctl --user --no-pager --full status chatgpt-firefox.service || true
          journalctl --user -u chatgpt-firefox.service -n 30 --no-pager || true
          pids="$(pgrep -u "$(id -u)" -f 'firefox|web-ext' || true)"
          count="$(printf '%s\n' "$pids" | sed '/^$/d' | wc -l | tr -d ' ')"
          echo "FIREFOX_PROCESS_COUNT=$count"

      - name: Honor dashboard-owned dynamic worker pool
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import http.client
          import json
          import time
          import urllib.error
          import urllib.request

          BASE = "http://127.0.0.1:8765"

          class AllocationChurn(Exception):
              pass

          def call(method, path, payload=None):
              body = None
              headers = {"User-Agent": "zcloud-dynamic-worker-pool-activation/1"}
              if payload is not None:
                  body = json.dumps(payload).encode("utf-8")
                  headers["Content-Type"] = "application/json"
              # /api/runner-live is already polled by the bounded outer activation
              # loops. Do not add a second long retry loop inside each poll: when
              # Firefox/read-model is degraded that can monopolise the sole VPS
              # runner for minutes and starve acceptance/recovery jobs behind it.
              runner_live = method == "GET" and path.startswith("/api/runner-live")
              attempts = 1 if runner_live else (3 if method == "GET" else 1)
              request_timeout = 8 if runner_live else 15
              for attempt in range(attempts):
                  request = urllib.request.Request(BASE + path, data=body, headers=headers, method=method)
                  try:
                      with urllib.request.urlopen(request, timeout=request_timeout) as response:
                          return json.load(response)
                  except urllib.error.HTTPError as exc:
                      detail = exc.read().decode("utf-8", "replace")
                      if method == "GET" and exc.code == 503 and attempt + 1 < attempts:
                          time.sleep(2)
                          continue
                      # A queue-owned worker can disappear from runner_worker_targets
                      # between an allocation poll and the control POST. The server
                      # reports that scheduler race as the generic 400 below. Let the
                      # caller re-read allocation instead of turning churn into a
                      # false terminal activation failure.
                      if (
                          method == "POST"
                          and path == "/api/runner-control"
                          and exc.code == 400
                          and "Ongeldige runneractie" in detail
                      ):
                          raise AllocationChurn("runner-target-churn") from exc
                      raise SystemExit(f"{method} {path} failed with HTTP {exc.code}") from exc
                  except (urllib.error.URLError, http.client.RemoteDisconnected, TimeoutError) as exc:
                      if attempt + 1 >= attempts:
                          raise SystemExit(f"{method} {path} transport failed after {attempts} attempt(s): {exc}") from exc
                      time.sleep(1)
              raise AssertionError("unreachable")

          def worker_key(item):
              key = str(item.get("worker_key") or "").strip()
              if key:
                  return key
              project = str(item.get("project_id") or "").strip()
              slot = int(item.get("worker_slot") or 1)
              return f"{project}::w{slot}" if project else ""

          def raw_worker(status, key):
              base = key.split("::w", 1)[0]
              workers = ((status.get("chatgpt_runners") or {}).get(base) or {}).get("workers") or []
              return next((worker for worker in workers if worker.get("worker_id") == key), None)

          def live_worker(status, key):
              worker = raw_worker(status, key)
              if not worker:
                  return None
              if worker.get("state") != "live":
                  return None
              if int(worker.get("age_seconds") or 999999) > 90:
                  return None
              return worker

          def worker_summary(status, key):
              worker = raw_worker(status or {}, key)
              if not worker:
                  return {"present": False}
              command = worker.get("command") or {}
              last_event = worker.get("last_event") or {}
              return {
                  "present": True,
                  "state": str(worker.get("state") or "")[:40],
                  "age_seconds": int(worker.get("age_seconds") or 0),
                  "generating": bool(worker.get("generating")),
                  "last_event": str(last_event.get("event") or "")[:80],
                  "command_id": int(command.get("id") or 0),
                  "command_status": str(command.get("status") or "")[:40],
              }

          DISPATCH_EVENTS = {
              "prompt-sent",
              "generation-started",
              "generation-progress",
              "generation-finished",
              "awaiting-vps-dispatch",
              "portfolio-queue-result",
          }

          def dispatched_worker(status, key, command_id):
              worker = live_worker(status, key)
              if not worker:
                  return None
              command = worker.get("command") or {}
              # The scheduler can legitimately supersede our start command with a
              # newer push/new-chat while the worker is coming alive. Treat the
              # activation command as an evidence floor, not as an immutable latest
              # command id; older evidence is still rejected.
              latest_command_id = int(command.get("id") or 0)
              if latest_command_id < int(command_id):
                  return None
              command_status = str(command.get("status") or "")
              event = str((worker.get("last_event") or {}).get("event") or "")
              # A browser-side send block is terminal for this dispatch even while
              # the API command is still pending. Fail immediately so a broken
              # selector cannot occupy the sole VPS runner for the full recovery loop.
              if event == "send-blocked":
                  raise SystemExit(f"worker dispatch blocked for {key}")
              if command_status == "failed":
                  raise SystemExit(f"worker command failed for {key}")
              if command_status != "completed":
                  return None
              if not worker.get("generating") and event not in DISPATCH_EVENTS:
                  return None
              return worker

          def allocation_state(targets):
              limit = int(targets.get("max_workers") or 0)
              allocation = targets.get("global_allocation") or {}
              selected = allocation.get("workers") or []
              if limit < 0 or limit > 8:
                  raise SystemExit(f"invalid dashboard dynamic worker limit: {limit}")
              if len(selected) > limit:
                  raise SystemExit(f"allocation exceeds dashboard limit: {len(selected)} > {limit}")
              keys = [worker_key(item) for item in selected]
              if any(not key for key in keys):
                  raise SystemExit("queue allocation contains worker without identity")
              return limit, selected, keys

          before = call("GET", "/api/runner-targets")
          limit, selected, keys = allocation_state(before)

          if limit == 0:
              if selected:
                  raise SystemExit(
                      f"dynamic workers are off but {len(selected)} queue worker(s) remain allocated"
                  )
              print("ZCLOUD_DYNAMIC_WORKER_ACTIVATION_GREEN=disabled")
              print(json.dumps({
                  "ok": True,
                  "mode": "dashboard",
                  "worker_limit": 0,
                  "state": "disabled",
              }, ensure_ascii=False, sort_keys=True))
              raise SystemExit(0)

          if not selected:
              print("ZCLOUD_DYNAMIC_WORKER_ACTIVATION_GREEN=idle")
              print(json.dumps({
                  "ok": True,
                  "mode": "dashboard",
                  "worker_limit": limit,
                  "state": "idle-no-eligible-queue-work",
              }, ensure_ascii=False, sort_keys=True))
              raise SystemExit(0)

          starts = {}
          command_ids = {}

          def start_keys(current_keys):
              for key in current_keys:
                  if key in command_ids:
                      continue
                  try:
                      result = call("POST", "/api/runner-control", {
                          "project_id": key,
                          "action": "start",
                      })
                  except AllocationChurn as exc:
                      print(
                          f"WORKER_ALLOCATION_CHURN action=start key={key} detail={exc}",
                          flush=True,
                      )
                      continue
                  if not result.get("ok"):
                      raise SystemExit(f"worker start was not accepted for {key}")
                  command_id = int(result.get("command_id") or 0)
                  if not command_id:
                      raise SystemExit(f"worker start did not return command id for {key}")
                  starts[key] = command_id
                  command_ids[key] = command_id

          start_keys(keys)

          final = before
          status = None
          live = {}
          current_limit = limit
          current_keys = keys
          for _ in range(12):
              time.sleep(5)
              final = call("GET", "/api/runner-targets")
              current_limit, _, current_keys = allocation_state(final)
              if current_limit == 0 or not current_keys:
                  live = {}
                  break
              start_keys(current_keys)
              unstarted = [key for key in current_keys if key not in command_ids]
              if unstarted:
                  print(
                      "WORKER_ALLOCATION_RESYNC pending_start="
                      + json.dumps(unstarted, sort_keys=True),
                      flush=True,
                  )
                  live = {key: None for key in current_keys}
                  continue
              status = call("GET", "/api/runner-live")
              live = {
                  key: dispatched_worker(status, key, command_ids[key])
                  for key in current_keys
              }
              if all(live.values()):
                  break

          missing = [key for key in current_keys if not live.get(key)]
          if missing:
              # Re-read the scheduler immediately before recovery. Never recover
              # a worker that was removed from the live allocation after the last
              # heartbeat poll.
              recovery_targets = call("GET", "/api/runner-targets")
              current_limit, _, current_keys = allocation_state(recovery_targets)
              start_keys(current_keys)
              missing = [key for key in current_keys if not live.get(key)]
              for key in missing:
                  if key not in command_ids:
                      continue
                  try:
                      recovered = call("POST", "/api/runner-control", {
                          "project_id": key,
                          "action": "new_chat",
                      })
                  except AllocationChurn as exc:
                      print(
                          f"WORKER_ALLOCATION_CHURN action=new_chat key={key} detail={exc}",
                          flush=True,
                      )
                      # Force a fresh start admission if this key remains allocated
                      # on the next poll; otherwise it naturally disappears.
                      command_ids.pop(key, None)
                      continue
                  if not recovered.get("ok"):
                      raise SystemExit(f"worker fresh-chat recovery was not accepted for {key}")
                  command_ids[key] = int(recovered.get("command_id") or 0)
                  if not command_ids[key]:
                      raise SystemExit(f"worker fresh-chat recovery did not return command id for {key}")
              for _ in range(12):
                  time.sleep(5)
                  final = call("GET", "/api/runner-targets")
                  current_limit, _, current_keys = allocation_state(final)
                  if current_limit == 0 or not current_keys:
                      live = {}
                      break
                  start_keys(current_keys)
                  unstarted = [key for key in current_keys if key not in command_ids]
                  if unstarted:
                      print(
                          "WORKER_ALLOCATION_RESYNC pending_start="
                          + json.dumps(unstarted, sort_keys=True),
                          flush=True,
                      )
                      live = {key: None for key in current_keys}
                      continue
                  status = call("GET", "/api/runner-live")
                  live = {
                      key: dispatched_worker(status, key, command_ids[key])
                      for key in current_keys
                  }
                  if all(live.values()):
                      break

          final_limit, _, final_keys = allocation_state(final)
          active = [
              key for key, value in (final.get("projects") or {}).items()
              if bool(value.get("active"))
          ]
          if len(active) > final_limit:
              raise SystemExit(f"more active workers than dashboard limit: {active}")
          missing = [key for key in final_keys if not live.get(key)]
          if missing:
              print("FINAL_ALLOCATION=" + json.dumps({
                  "worker_limit": final_limit,
                  "selected_workers": final_keys,
                  "active_workers": active,
              }, ensure_ascii=False, sort_keys=True), flush=True)
              print("FINAL_LIVE_SUMMARY=" + json.dumps({
                  key: worker_summary(status, key) for key in final_keys
              }, ensure_ascii=False, sort_keys=True), flush=True)
              raise SystemExit(f"no live Firefox heartbeat observed for current allocation: {missing}")

          print("ZCLOUD_DYNAMIC_WORKER_ACTIVATION_GREEN=active")
          print(json.dumps({
              "ok": True,
              "mode": "dashboard",
              "worker_limit": final_limit,
              "selected_workers": final_keys,
              "active_workers": active,
              "live_workers": {key: worker_summary(status, key) for key in final_keys},
              "dispatch_cooldown_seconds": (final.get("global_allocation") or {}).get("dispatch_cooldown_seconds"),
              "start_command_ids": starts,
          }, ensure_ascii=False, sort_keys=True))
          PY
