name: zCloud iteration hypothesis coverage proof

on:
  pull_request:
    paths:
      - "scripts/zcloud_iteration_hypothesis_audit.py"
      - "tests/test_iteration_hypothesis_audit.py"
      - "tests/test_iteration_hypothesis_audit_workflow.py"
      - ".github/workflows/zcloud-iteration-hypothesis-audit.yml"

permissions:
  contents: read

concurrency:
  group: zcloud-iteration-hypothesis-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  hypothesis-coverage-proof:
    if: >-
      github.actor == 'Zennay' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact candidate revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "ZCLOUD_ITERATION_HYPOTHESIS_EXACT_HEAD=$EXPECTED_SHA"

      - name: Verify permanent VPS runner identity
        run: python3 scripts/zcloud_vps_runner_guard.py --json

      - name: Run focused hypothesis coverage regressions
        run: |
          python3 -m unittest -v \
            tests.test_iteration_hypothesis_audit \
            tests.test_iteration_hypothesis_audit_workflow

      - name: Audit live zCloud hypothesis coverage read-only
        run: |
          set -euo pipefail
          before="$(stat -c '%s:%Y:%y' /home/ubuntu/zennay-cloud/history.db)"
          python3 scripts/zcloud_iteration_hypothesis_audit.py \
            --db /home/ubuntu/zennay-cloud/history.db \
            --project cloud \
            --limit 50 \
            --json
          after="$(stat -c '%s:%Y:%y' /home/ubuntu/zennay-cloud/history.db)"
          test "$before" = "$after"
          echo "ZCLOUD_ITERATION_HYPOTHESIS_AUDIT_READONLY_GREEN=1"
