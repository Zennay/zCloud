name: FTMO TASK37 focused proof 278251fd clean

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-task37-proof-clean-278251fd.yml"

permissions:
  contents: read

concurrency:
  group: ftmo-task37-proof-clean-278251fd
  cancel-in-progress: true

jobs:
  proof:
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 10
    env:
      TARGET_SHA: 278251fdfcbf778b3b159da71f5be1e921de9443
      EXPECTED_MAIN_SHA: e5363979dd40097ede98234554ed49b262514fa1
      FTMO_AUTONOMOUS_CLOUD_BUDGET_USD: "0.00"
      FTMO_ALLOW_PAID_AWS: ""
    steps:
      - name: Verify immutable acceptance identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          gh auth status >/dev/null 2>&1
          test "$(gh api repos/Zennay/Ftmo/branches/main --jq .commit.sha)" = "$EXPECTED_MAIN_SHA"
          test "$(gh api repos/Zennay/Ftmo/pulls/509 --jq .state)" = "open"
          test "$(gh api repos/Zennay/Ftmo/pulls/509 --jq .head.sha)" = "$TARGET_SHA"
          test "$(gh api repos/Zennay/Ftmo/pulls/509 --jq .base.sha)" = "$EXPECTED_MAIN_SHA"
          test "$FTMO_AUTONOMOUS_CLOUD_BUDGET_USD" = "0.00"
          test -z "${FTMO_ALLOW_PAID_AWS:-}"

      - name: Checkout exact FTMO head
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/ftmo-task37-clean-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          rm -rf "$work"
          git init -q "$work"
          git -C "$work" remote add origin https://github.com/Zennay/Ftmo.git
          git -C "$work" -c protocol.version=2 fetch -q --depth=1 origin "$TARGET_SHA"
          git -C "$work" checkout -q --detach FETCH_HEAD
          test "$(git -C "$work" rev-parse HEAD)" = "$TARGET_SHA"
          echo "FTMO_WORK=$work" >> "$GITHUB_ENV"

      - name: Create isolated environment
        shell: bash
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/ftmo-task37-clean-venv-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          rm -rf "$venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install -q -r "$FTMO_WORK/requirements-ci.txt"
          "$venv/bin/python" -m pip install -q -e "$FTMO_WORK"
          echo "FTMO_VENV=$venv" >> "$GITHUB_ENV"

      - name: Prove TASK37 command integration
        shell: bash
        run: |
          set -euo pipefail
          cd "$FTMO_WORK"
          "$FTMO_VENV/bin/python" -m py_compile             src/prop_trading_ai/cli/v1_research_readiness.py             src/prop_trading_ai/cli/v1_research_status.py             tests/test_research_readiness_cli.py
          "$FTMO_VENV/bin/python" -m pytest -q tests/test_research_readiness_cli.py
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/ftmo-task37-clean-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"                  "$RUNNER_TEMP/ftmo-task37-clean-venv-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
