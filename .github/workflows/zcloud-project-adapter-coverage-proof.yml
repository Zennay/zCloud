name: zCloud project adapter coverage proof

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/zcloud_adapter_coverage_report.py"
      - "tests/test_adapter_coverage_report.py"
      - "docs/project-adapter-coverage-contract.md"
      - ".github/workflows/zcloud-project-adapter-coverage-proof.yml"
      - "projects.json"
      - "enhancements.py"

permissions:
  contents: read

concurrency:
  group: zcloud-project-adapter-coverage-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: >-
      github.actor == 'Zennay' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Validate coverage contract
        run: |
          python3 -m unittest -v tests.test_adapter_coverage_report
          python3 -m py_compile scripts/zcloud_adapter_coverage_report.py

  prove-read-only:
    if: >-
      github.actor == 'Zennay' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Require canonical permanent VPS runner
        run: python3 scripts/zcloud_vps_runner_guard.py --json
      - name: Prove report on current registry
        run: |
          set -euo pipefail
          python3 -m unittest -v tests.test_adapter_coverage_report
          python3 scripts/zcloud_adapter_coverage_report.py > /tmp/zcloud-adapter-coverage.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('/tmp/zcloud-adapter-coverage.json').read_text(encoding='utf-8'))
          assert payload['schema_version'] == 1
          assert payload['active_project_count'] >= 1
          assert payload['active_project_count'] == payload['adapter_backed_count'] + payload['generic_only_count']
          encoded = json.dumps(payload, sort_keys=True)
          for forbidden in ('/opt/', '/var/', 'notion_url', 'repo_url'):
              assert forbidden not in encoded
          print('ZCLOUD_PROJECT_ADAPTER_COVERAGE_READONLY_GREEN=1')
          PY
