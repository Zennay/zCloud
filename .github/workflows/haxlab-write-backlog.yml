name: Normalize live HaxLab write queue

# Historical queue-priority migration requires an intentional authorized operator.
# Never run on push, PR, schedule, workflow_run or as a retry.
on:
  workflow_dispatch:
    inputs:
      confirm_sha:
        description: Exact 40-character current zCloud main revision
        type: string
        required: true
      approve_queue_mutations:
        description: Explicitly approve bounded HaxLab-only queue normalization
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  normalize:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'Zennay/zCloud' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'Zennay' &&
      github.triggering_actor == 'Zennay' &&
      github.run_attempt == 1 &&
      inputs.approve_queue_mutations == true &&
      inputs.confirm_sha == github.sha
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 5
    steps:
      - name: Check out exact approved main source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true
      - name: Deny stale or foreign production queue mutations
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          CONFIRMED_SHA: ${{ inputs.confirm_sha }}
          EXPECTED_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$EXPECTED_REPO" = "Zennay/zCloud"
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$CONFIRMED_SHA" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_SHA"
          test "$(hostname)" = "vps-bb300bba"
          test "$(id -un)" = "ubuntu"
          python3 scripts/zcloud_vps_runner_guard.py --json

      - name: Remove stale generic/read-only HaxLab continuations and prioritize write work
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import urllib.request

          base="http://127.0.0.1:8765"
          canonical={
            "haxlab-closed-loop-arena-v2-implementation":("P1","Build the next Closed-Loop Evaluation Arena v2 implementation increment",
              "Make a material code/config/workflow change that advances Closed-Loop Evaluation Arena v2 on the current HaxLab implementation branch, with deterministic fixed-seed rollout behavior and green automated tests/workflow evidence. Read-only inspection, status, audit, checklist or documentation-only work does not complete this item."),
            "haxlab-multisource-evaluation-suite-v2":("P2","Implement the frozen multi-source evaluation suite v2",
              "Implement versioned tooling/config that selects and freezes multiple disjoint replay sources with deterministic seeds, provenance and regression coverage; produce a reproducible evaluation manifest/artifact and green tests. Merely inspecting or describing candidate sources is not completion."),
            "haxlab-guard-independence-promotion-gate-v2":("P2","Implement guard-independence as a mandatory Arena v2 promotion gate",
              "Add or complete executable guard-intervention/role-leash/recovery-dependency metrics and fail-closed promotion logic, with regression tests proving a guard-dependent challenger cannot pass. Requires code plus test/workflow evidence; audit-only work does not count."),
            "haxlab-rollout-recovery-dataset-v1":("P2","Implement versioned rollout/recovery dataset generation",
              "Implement a deterministic versioned pipeline that persists model-visited failures/recovery states separately from raw human evidence, with provenance, idempotent reruns and automated tests or bounded workflow evidence. Read-only analysis is insufficient."),
          }

          def get_queue():
              with urllib.request.urlopen(base+"/api/portfolio-queue?all=1",timeout=10) as r:
                  return json.load(r)

          def post(payload):
              req=urllib.request.Request(base+"/api/portfolio-queue",data=json.dumps(payload).encode(),method="POST",headers={"Content-Type":"application/json"})
              with urllib.request.urlopen(req,timeout=10) as r:
                  return json.load(r)

          live=get_queue()
          items=live.get("items",[])

          # Retire known generic/read-only leftovers only when they are currently
          # claimed/running; otherwise leave historical DONE rows untouched and
          # simply make canonical write lanes outrank them.
          stale_ids={
            "haxlab-4d184d6637268d07",
            "zssh-haxlab-candidate-b-runtime-probe-20261001",
          }
          for row in items:
              qid=row.get("queue_id")
              if qid not in stale_ids:
                  continue
              if row.get("project_id")!="haxlab":
                  # Never demote or complete a task belonging to another project.
                  print("FOREIGN_QUEUE_ITEM_UNTOUCHED")
                  continue
              status=str(row.get("status") or "").lower()
              slot=row.get("worker_slot")
              if status in {"claimed","running","verifying"}:
                  # Live task ownership is never revoked by a legacy queue normalizer.
                  print("ACTIVE_OWNERSHIP_PRESERVED",json.dumps({"status":status},sort_keys=True))
              elif status=="queued":
                  # Re-enqueue at P3 with an explicit superseded title; this keeps
                  # history intact but prevents it outranking implementation work.
                  project=str(row.get("project_id") or "haxlab")
                  result=post({
                    "action":"enqueue",
                    "queue_id":qid,
                    "project_id":project,
                    "title":"Superseded diagnostic/continuation; no longer primary work",
                    "priority":"P3",
                    "completion_criteria":"This item is superseded by canonical implementation work and must not be chosen while any HaxLab P1/P2 write lane is eligible.",
                    "source_url":str(row.get("source_url") or ""),
                    "parent_queue_id":row.get("parent_queue_id"),
                  })
                  print("STALE_QUEUE_DEPRIORITIZED",json.dumps({"response_object":isinstance(result,dict)},sort_keys=True))

          for qid,(priority,title,criteria) in canonical.items():
              result=post({
                "action":"enqueue",
                "queue_id":qid,
                "project_id":"haxlab",
                "title":title,
                "priority":priority,
                "completion_criteria":criteria,
                "source_url":"https://app.notion.com/p/3e59e19ac9558189853ffc41080c858b",
              })
              print("WRITE_QUEUE_NORMALIZED",json.dumps({"response_object":isinstance(result,dict)},sort_keys=True))

          # No cross-project or active-worker preemption. A queued HaxLab task
          # must be admitted by the normal serialized allocator, never by
          # forcing another worker's current assignment to CONTINUE.

          # Reconcile the existing worker pool without changing its settings so
          # the freshly freed slot is immediately allocated by global priority.
          with urllib.request.urlopen(base+"/api/dynamic-workers",timeout=10) as r:
              settings=json.load(r).get("dynamic_workers") or {}
          same_settings={
              key:settings.get(key)
              for key in (
                  "chatgpt_count","claude_count",
                  "chatgpt_cooldown_seconds","claude_cooldown_seconds",
                  "check_interval_ms","tick_interval_ms",
                  "heartbeat_interval_ms","generation_start_timeout_ms",
                  "scheduler_interval_seconds"
              )
              if settings.get(key) is not None
          }
          req=urllib.request.Request(
              base+"/api/dynamic-workers",
              data=json.dumps(same_settings).encode(),
              method="POST",
              headers={"Content-Type":"application/json","X-ZCloud-Actor":"haxlab-write-queue-normalizer"},
          )
          with urllib.request.urlopen(req,timeout=10) as r:
              reconciled=json.load(r)
          print("WORKER_POOL_RECONCILED",json.dumps({"response_object":isinstance(reconciled,dict)},sort_keys=True))

          final=get_queue()
          hax=[x for x in final.get("items",[]) if x.get("project_id")=="haxlab" and x.get("eligible")]
          # Bounded counters only; raw queue rows may contain user prompts.
          print("HAXLAB_ELIGIBLE_COUNT",len(hax))
          PY
