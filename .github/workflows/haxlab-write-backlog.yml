name: Normalize live FTMO-first write queue

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/haxlab-write-backlog.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  normalize:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Apply FTMO-first portfolio priorities without interrupting real work
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import urllib.request

          base="http://127.0.0.1:8765"

          haxlab={
            "haxlab-closed-loop-arena-v2-implementation":("P3","Build the next Closed-Loop Evaluation Arena v2 implementation increment",
              "Make a material code/config/workflow change that advances Closed-Loop Evaluation Arena v2 on the current HaxLab implementation branch, with deterministic fixed-seed rollout behavior and green automated tests/workflow evidence. Read-only inspection, status, audit, checklist or documentation-only work does not complete this item."),
            "haxlab-multisource-evaluation-suite-v2":("P3","Implement the frozen multi-source evaluation suite v2",
              "Implement versioned tooling/config that selects and freezes multiple disjoint replay sources with deterministic seeds, provenance and regression coverage; produce a reproducible evaluation manifest/artifact and green tests."),
            "haxlab-guard-independence-promotion-gate-v2":("P3","Implement guard-independence as a mandatory Arena v2 promotion gate",
              "Add or complete executable guard-intervention/role-leash/recovery-dependency metrics and fail-closed promotion logic, with regression tests."),
            "haxlab-rollout-recovery-dataset-v1":("P3","Implement versioned rollout/recovery dataset generation",
              "Implement a deterministic versioned rollout/recovery dataset pipeline with provenance, idempotent reruns and automated evidence.")
          }
          ftmo={
            "ftmo-gen20-next-safe-autonomous-stage":("P0","Advance FTMO Generation 20 through the next safe autonomous research stage",
              "Execute the next unblocked Generation-20 zero-cost research stage and persist reproducible controller evidence. Preserve provider/provenance, preregistration, anti-leakage, walk-forward/final-holdout, broker and live-trading gates; read-only status is not completion.",
              "https://app.notion.com/p/3db9e19ac9558135940bec5110a2157e"),
            "ftmo-useful-compute-cpu-attribution":("P1","Make FTMO the primary useful-compute consumer and prove CPU attribution",
              "Prove live CPU attribution. If FTMO is not receiving useful compute, make a safe runtime/config change that restores FTMO throughput and persist current cgroup/host-share plus advanced controller evidence; diagnosis alone is not completion.",
              "https://app.notion.com/p/3e49e19ac95581fcb8c7fd06a3d98fc7")
          }

          def get_queue():
              with urllib.request.urlopen(base+"/api/portfolio-queue?all=1",timeout=10) as r:
                  return json.load(r)

          def post(payload):
              req=urllib.request.Request(base+"/api/portfolio-queue",data=json.dumps(payload).encode(),method="POST",headers={"Content-Type":"application/json"})
              with urllib.request.urlopen(req,timeout=10) as r:
                  return json.load(r)

          for qid,(priority,title,criteria) in haxlab.items():
              result=post({
                  "action":"enqueue","queue_id":qid,"project_id":"haxlab",
                  "title":title,"priority":priority,"completion_criteria":criteria,
                  "source_url":"https://app.notion.com/p/3e59e19ac9558189853ffc41080c858b"
              })
              print("HAXLAB_BACKGROUND",json.dumps(result,sort_keys=True))

          for qid,(priority,title,criteria,source) in ftmo.items():
              result=post({
                  "action":"enqueue","queue_id":qid,"project_id":"ftmo",
                  "title":title,"priority":priority,"completion_criteria":criteria,
                  "source_url":source
              })
              print("FTMO_PRIORITY",json.dumps(result,sort_keys=True))

          mid=get_queue()
          waiting_ftmo_p0=any(
              x.get("queue_id")=="ftmo-gen20-next-safe-autonomous-stage"
              and x.get("eligible")
              and str(x.get("status") or "").lower()=="queued"
              for x in mid.get("items",[])
          )
          legacy_titles={
              "Continue project autonomously with the next concrete implementation step",
              "Superseded diagnostic/continuation; no longer primary work",
          }
          if waiting_ftmo_p0:
              for row in mid.get("items",[]):
                  if (
                      row.get("priority")=="P3"
                      and str(row.get("status") or "").lower() in {"claimed","running","verifying"}
                      and row.get("worker_slot")
                      and str(row.get("title") or "") in legacy_titles
                  ):
                      result=post({
                          "action":"result","worker_slot":row.get("worker_slot"),
                          "queue_id":row.get("queue_id"),"result":"CONTINUE",
                          "evidence":"Legacy synthetic P3 continuation yielded to queued FTMO P0 research work."
                      })
                      print("LEGACY_P3_YIELDED",json.dumps(result,sort_keys=True))

          final=get_queue()
          focused=[
              {k:x.get(k) for k in ("queue_id","project_id","priority","status","worker_slot","title")}
              for x in final.get("items",[])
              if x.get("eligible") and x.get("project_id") in {"ftmo","haxlab"}
          ]
          print("FTMO_HAXLAB_FINAL",json.dumps(focused,sort_keys=True))
          print("ALLOCATION_FINAL",json.dumps(final.get("allocation"),sort_keys=True))
          PY
