name: Apply HaxLab write-first backlog

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/haxlab-write-backlog.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Enqueue and verify HaxLab implementation backlog
        shell: bash
        env:
          HAXLAB_BACKLOG_JSON: '[{"queue_id":"haxlab-closed-loop-arena-v2-implementation","project_id":"haxlab","title":"Build the next Closed-Loop Evaluation Arena v2 implementation increment","priority":"P1","completion_criteria":"Make a material code/config/workflow change that advances Closed-Loop Evaluation Arena v2 on the current HaxLab implementation branch, with deterministic fixed-seed rollout behavior and green automated tests/workflow evidence. Read-only inspection, status, audit, checklist or documentation-only work does not complete this item.","source_url":"https://app.notion.com/p/3e59e19ac9558189853ffc41080c858b"},{"queue_id":"haxlab-multisource-evaluation-suite-v2","project_id":"haxlab","title":"Implement the frozen multi-source evaluation suite v2","priority":"P2","completion_criteria":"Implement versioned tooling/config that selects and freezes multiple disjoint replay sources with deterministic seeds, provenance and regression coverage; produce a reproducible evaluation manifest/artifact and green tests. Merely inspecting or describing candidate sources is not completion.","source_url":"https://app.notion.com/p/3e59e19ac9558189853ffc41080c858b"},{"queue_id":"haxlab-guard-independence-promotion-gate-v2","project_id":"haxlab","title":"Implement guard-independence as a mandatory Arena v2 promotion gate","priority":"P2","completion_criteria":"Add or complete executable guard-intervention/role-leash/recovery-dependency metrics and fail-closed promotion logic, with regression tests proving a guard-dependent challenger cannot pass. Requires code plus test/workflow evidence; audit-only work does not count.","source_url":"https://app.notion.com/p/3e59e19ac9558189853ffc41080c858b"},{"queue_id":"haxlab-rollout-recovery-dataset-v1","project_id":"haxlab","title":"Implement versioned rollout/recovery dataset generation","priority":"P2","completion_criteria":"Implement a deterministic versioned pipeline that persists model-visited failures/recovery states separately from raw human evidence, with provenance, idempotent reruns and automated tests or bounded workflow evidence. Read-only analysis is insufficient.","source_url":"https://app.notion.com/p/3e59e19ac9558189853ffc41080c858b"}]'
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          base="http://127.0.0.1:8765"
          items=json.loads(os.environ["HAXLAB_BACKLOG_JSON"])

          def post(payload):
              req=urllib.request.Request(
                  base+"/api/portfolio-queue",
                  data=json.dumps(payload).encode(),
                  method="POST",
                  headers={"Content-Type":"application/json"},
              )
              with urllib.request.urlopen(req,timeout=10) as r:
                  return json.load(r)

          for item in items:
              result=post({"action":"enqueue", **item})
              print("HAXLAB_WRITE_QUEUE_ENQUEUE", json.dumps(result, sort_keys=True))

          with urllib.request.urlopen(base+"/api/portfolio-queue?all=1",timeout=10) as r:
              live=json.load(r)
          by_id={x.get("queue_id"):x for x in live.get("items",[])}

          missing=[]
          for expected in items:
              row=by_id.get(expected["queue_id"])
              if not row:
                  missing.append(expected["queue_id"])
                  continue
              if row.get("project_id")!="haxlab" or not row.get("eligible"):
                  raise RuntimeError(f"bad live row for {expected['queue_id']}: {row}")
              print("HAXLAB_WRITE_QUEUE_VERIFIED", json.dumps({
                  "queue_id":row.get("queue_id"),
                  "priority":row.get("priority"),
                  "status":row.get("status"),
                  "worker_slot":row.get("worker_slot"),
                  "eligible":row.get("eligible"),
                  "title":row.get("title"),
              }, sort_keys=True))
          if missing:
              raise RuntimeError("missing live HaxLab queue items: "+",".join(missing))

          print("HAXLAB_WRITE_BACKLOG_GREEN", json.dumps({
              "count":len(items),
              "queue_ids":[x["queue_id"] for x in items],
              "allocation":live.get("allocation"),
          }, sort_keys=True))
          PY
