name: Recover RaiseAI runner for PR25 exact-head

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/raiseai-pr25-runner-recovery-20261004.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: raiseai-pr25-runner-recovery-20261004
  cancel-in-progress: false

jobs:
  recover:
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 7
    env:
      RAISE_REPO: Zennay/RaiseAI
      PR_NUMBER: '25'
      PR_HEAD_SHA: abd2f2c5cb67135c4cfb6d6d516a060ac98b2522
      WATCH_RUN_ID: '37236532119'
      RAISE_SERVICE: actions.runner.Zennay-RaiseAI.vps-bb300bba.service
      RECEIPT_PATH: runtime-evidence/raiseai-pr25-runner-recovery.json

    steps:
      - name: Verify exact RaiseAI gate identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          gh auth status >/dev/null 2>&1
          test "$(gh api repos/$RAISE_REPO/pulls/$PR_NUMBER --jq .state)" = "open"
          test "$(gh api repos/$RAISE_REPO/pulls/$PR_NUMBER --jq .head.sha)" = "$PR_HEAD_SHA"
          test "$(gh api repos/$RAISE_REPO/actions/runs/$WATCH_RUN_ID --jq .head_sha)" = "$PR_HEAD_SHA"
          test "$(gh api repos/$RAISE_REPO/actions/runs/$WATCH_RUN_ID --jq .name)" = "Raise Watch app CI"
          echo "RAISEAI_PR25_IDENTITY=verified"

      - name: Diagnose and recover only the RaiseAI Actions listener
        id: recover
        shell: bash
        run: |
          set -euo pipefail
          pre_state="$(systemctl is-active "$RAISE_SERVICE" || true)"
          pre_pid="$(systemctl show "$RAISE_SERVICE" -p MainPID --value || true)"
          control_group="$(systemctl show "$RAISE_SERVICE" -p ControlGroup --value || true)"
          worker_before=0
          listener_before=0

          if [[ "$pre_pid" =~ ^[1-9][0-9]*$ ]] && test -r "/proc/$pre_pid/cmdline"; then
            pre_cmdline="$(tr '\0' ' ' < "/proc/$pre_pid/cmdline")"
            [[ "$pre_cmdline" == *"Runner.Listener"* || "$pre_cmdline" == *"runsvc.sh"* ]] && listener_before=1 || true
          fi

          if [[ -n "$control_group" && "$control_group" != "/" ]]; then
            for proc in /proc/[0-9]*; do
              test -r "$proc/cgroup" || continue
              grep -Fq "$control_group" "$proc/cgroup" || continue
              test -r "$proc/cmdline" || continue
              cmdline="$(tr '\0' ' ' < "$proc/cmdline" 2>/dev/null || true)"
              if [[ "$cmdline" == *"Runner.Worker"* ]]; then
                worker_before=1
                break
              fi
            done
          fi

          run_status="$(gh api repos/$RAISE_REPO/actions/runs/$WATCH_RUN_ID --jq .status)"
          echo "RAISEAI_RUNNER_PRE state=$pre_state pid=$pre_pid listener=$listener_before worker=$worker_before run=$run_status"

          action=none
          if [[ "$worker_before" -eq 1 ]]; then
            action=preserve-active-worker
          elif [[ "$run_status" != "queued" ]]; then
            action=preserve-gate-already-scheduled
          else
            sudo -n systemctl reset-failed "$RAISE_SERVICE" || true
            sudo -n systemctl restart "$RAISE_SERVICE"
            action=restart-idle-or-unhealthy-listener
          fi

          post_state=""
          post_pid=""
          for _ in $(seq 1 30); do
            post_state="$(systemctl is-active "$RAISE_SERVICE" || true)"
            post_pid="$(systemctl show "$RAISE_SERVICE" -p MainPID --value || true)"
            if [[ "$post_state" == "active" && "$post_pid" =~ ^[1-9][0-9]*$ ]] && test -r "/proc/$post_pid/cmdline"; then
              post_cmdline="$(tr '\0' ' ' < "/proc/$post_pid/cmdline")"
              if [[ "$post_cmdline" == *"Runner.Listener"* || "$post_cmdline" == *"runsvc.sh"* ]]; then
                break
              fi
            fi
            sleep 2
          done
          test "$post_state" = "active"
          [[ "$post_pid" =~ ^[1-9][0-9]*$ ]]

          echo "RAISEAI_RUNNER_RECOVERY_ACTION=$action"
          echo "RAISEAI_RUNNER_POST state=$post_state pid=$post_pid"
          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "pre_state=$pre_state" >> "$GITHUB_OUTPUT"
          echo "pre_pid=$pre_pid" >> "$GITHUB_OUTPUT"
          echo "post_state=$post_state" >> "$GITHUB_OUTPUT"
          echo "post_pid=$post_pid" >> "$GITHUB_OUTPUT"

      - name: Prove PR25 exact-head run starts scheduling
        id: schedule
        shell: bash
        run: |
          set -euo pipefail
          status=""
          conclusion=""
          for _ in $(seq 1 48); do
            status="$(gh api repos/$RAISE_REPO/actions/runs/$WATCH_RUN_ID --jq .status)"
            conclusion="$(gh api repos/$RAISE_REPO/actions/runs/$WATCH_RUN_ID --jq '.conclusion // ""')"
            echo "RAISEAI_PR25_WATCH status=$status conclusion=$conclusion"
            if [[ "$status" == "in_progress" || "$status" == "completed" ]]; then
              break
            fi
            sleep 5
          done
          [[ "$status" == "in_progress" || "$status" == "completed" ]]
          echo "run_status=$status" >> "$GITHUB_OUTPUT"
          echo "run_conclusion=$conclusion" >> "$GITHUB_OUTPUT"

      - name: Persist sanitized recovery receipt
        if: always()
        shell: bash
        env:
          RECOVERY_ACTION: ${{ steps.recover.outputs.action }}
          PRE_STATE: ${{ steps.recover.outputs.pre_state }}
          PRE_PID: ${{ steps.recover.outputs.pre_pid }}
          POST_STATE: ${{ steps.recover.outputs.post_state }}
          POST_PID: ${{ steps.recover.outputs.post_pid }}
          WATCH_STATUS: ${{ steps.schedule.outputs.run_status }}
          WATCH_CONCLUSION: ${{ steps.schedule.outputs.run_conclusion }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/zcloud-raiseai-pr25-runner-recovery"
          rm -rf "$work"
          gh repo clone Zennay/zCloud "$work" -- --filter=blob:none >/dev/null
          cd "$work"
          git checkout main >/dev/null
          git pull --rebase origin main
          mkdir -p "$(dirname "$RECEIPT_PATH")"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          payload = {
              "schema_version": 1,
              "project": "raiseai",
              "pull_request": 25,
              "target_sha": os.environ["PR_HEAD_SHA"],
              "watch_run_id": int(os.environ["WATCH_RUN_ID"]),
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "workflow_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "runner_name": os.environ.get("RUNNER_NAME"),
              "runner_service": os.environ["RAISE_SERVICE"],
              "recovery_action": os.environ.get("RECOVERY_ACTION"),
              "pre_state": os.environ.get("PRE_STATE"),
              "pre_pid": os.environ.get("PRE_PID"),
              "post_state": os.environ.get("POST_STATE"),
              "post_pid": os.environ.get("POST_PID"),
              "watch_status_after_recovery": os.environ.get("WATCH_STATUS"),
              "watch_conclusion_after_recovery": os.environ.get("WATCH_CONCLUSION"),
          }
          Path(os.environ["RECEIPT_PATH"]).write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          git config user.name "zcloud-automation"
          git config user.email "zcloud-automation@users.noreply.github.com"
          git add "$RECEIPT_PATH"
          if ! git diff --cached --quiet; then
            git commit -m "Record RaiseAI PR25 runner recovery"
            for _ in 1 2 3; do
              if git push origin HEAD:main; then exit 0; fi
              git fetch origin main
              git rebase origin/main
            done
            exit 1
          fi
