name: FTMO PR430 exact-head BI5 transport proof

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-pr430-exact-head-proof.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ftmo-pr430-exact-head-proof
  cancel-in-progress: false

jobs:
  proof:
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      TARGET_SHA: f7d20fecf71f5ba2c04dc984a03a2c864ff0aba3
    steps:
      - name: Verify runner identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          echo "runner_host=$(hostname)"

      - name: Fetch exact FTMO PR430 head
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr430-exact"
          rm -rf "$src"
          gh repo clone Zennay/Ftmo "$src" -- --filter=blob:none --no-checkout >/dev/null
          git -C "$src" checkout --detach "$TARGET_SHA" >/dev/null
          test "$(git -C "$src" rev-parse HEAD)" = "$TARGET_SHA"
          echo "exact_head_sha=$TARGET_SHA"

      - name: Install isolated test environment
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr430-exact"
          venv="$RUNNER_TEMP/ftmo-pr430-exact-venv"
          rm -rf "$venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install -q -r "$src/requirements-ci.txt"
          "$venv/bin/python" -m pip install -q -e "$src"

      - name: Prove exact BI5 provider boundary
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr430-exact"
          venv="$RUNNER_TEMP/ftmo-pr430-exact-venv"
          cd "$src"
          "$venv/bin/python" -m compileall -q src/prop_trading_ai/data/market/providers/dukascopy_public.py
          "$venv/bin/python" -m pytest -q tests/test_dukascopy_public.py -k 'default_fetch'
          "$venv/bin/python" -m pytest -q tests/test_dukascopy_public.py tests/test_dukascopy_timeout_transport.py
          "$venv/bin/python" -m pytest -q tests/test_autonomous_provider_retry.py
          "$venv/bin/python" -m pytest -q \
            tests/test_zero_cost_workflow_boundary.py::test_every_repository_workflow_has_no_github_hosted_runner \
            tests/test_zero_cost_workflow_boundary.py::test_diagnostic_zero_cost_workflows_are_self_hosted_and_secret_free

      - name: Prove full exact-head test suite
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr430-exact"
          venv="$RUNNER_TEMP/ftmo-pr430-exact-venv"
          cd "$src"
          "$venv/bin/python" -m pytest -q

      - name: Persist sanitized success receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-evidence
          cat > runtime-evidence/ftmo-pr430-exact-head-proof.json <<EOF
          {
            "schema_version": 1,
            "scope": "ftmo-pr430-exact-head-proof",
            "target_sha": "$TARGET_SHA",
            "workflow_run_id": "$GITHUB_RUN_ID",
            "workflow_run_attempt": "$GITHUB_RUN_ATTEMPT",
            "result": "success",
            "runner_host": "$(hostname)",
            "research_stage": "provider_foundation",
            "generation_10_reopened": false,
            "development_access_relaxed": false,
            "walk_forward_access_relaxed": false,
            "final_holdout_access_relaxed": false,
            "live_or_broker_access_relaxed": false
          }
          EOF
          git config user.name "zcloud-automation"
          git config user.email "zcloud-automation@users.noreply.github.com"
          git add runtime-evidence/ftmo-pr430-exact-head-proof.json
          if git diff --cached --quiet; then
            echo "Receipt unchanged"
          else
            git commit -m "Record FTMO PR430 exact-head proof"
            git push origin HEAD:main
          fi
