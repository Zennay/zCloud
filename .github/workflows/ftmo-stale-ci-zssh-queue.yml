name: Enqueue FTMO stale CI cleanup on zSSH lane

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ftmo-stale-ci-zssh-queue.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enqueue:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Check out exact main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Enqueue bounded FTMO stale-CI cleanup and persist SQLite receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import urllib.request

          base = "http://127.0.0.1:8765"
          queue_id = "zssh-ftmo-cancel-superseded-pr-ci-20261002-worker5"
          payload = {
              "action": "enqueue",
              "queue_id": queue_id,
              "project_id": "zssh",
              "title": "Cancel superseded FTMO PR CI blocking current Gen29 gates",
              "priority": "P0",
              "completion_criteria": (
                  "On vps-bb300bba use authenticated GitHub tooling to inspect Zennay/Ftmo "
                  "Actions. First verify PR #421 is closed/superseded, run 36996247136 has "
                  "head 44c28172f2d6db168f0d3271bf859fb43b82e3d5, is not current main and "
                  "is not the latest head of an open PR; if all are true, cancel that run. "
                  "Then inspect queued/pending FTMO runs and cancel only runs whose associated "
                  "PR is closed/merged or whose head SHA is no longer the latest head of its "
                  "still-open PR. Never cancel current main runs and never cancel any run tied "
                  "to the latest head of an open PR, including the current Worker-5 PR #436 "
                  "head ee3b66b10b2d470409e9c4f652d2e57b6d2cb701. Record exact cancelled "
                  "run IDs, deliberately kept run IDs, before/after queue counts and GitHub "
                  "API results. This is CI queue cleanup only: do not change FTMO code, data, "
                  "preregistration, provider acceptance, walk-forward, holdout, live/broker "
                  "permissions or runtime services."
              ),
              "source_url": "https://github.com/Zennay/Ftmo/pull/436",
          }
          request = urllib.request.Request(
              base + "/api/portfolio-queue",
              data=json.dumps(payload).encode(),
              method="POST",
              headers={"Content-Type": "application/json"},
          )
          with urllib.request.urlopen(request, timeout=10) as response:
              body = json.load(response)
              if response.status != 200 or not body.get("ok"):
                  raise RuntimeError(f"queue enqueue failed: HTTP {response.status} {body}")
          print("QUEUE_ENQUEUE_RESPONSE", json.dumps(body, sort_keys=True))
          PY

          git fetch origin main
          git reset --hard origin/main

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import urllib.request

          queue_id = "zssh-ftmo-cancel-superseded-pr-ci-20261002-worker5"
          with urllib.request.urlopen("http://127.0.0.1:8765/api/portfolio-queue?all=1", timeout=10) as response:
              live = json.load(response)

          def find(value):
              if isinstance(value, dict):
                  if value.get("queue_id") == queue_id:
                      return value
                  for child in value.values():
                      found = find(child)
                      if found:
                          return found
              elif isinstance(value, list):
                  for child in value:
                      found = find(child)
                      if found:
                          return found
              return None

          item = find(live)
          if not item:
              raise SystemExit(f"{queue_id} not found in live SQLite queue")
          if str(item.get("priority") or "").upper() != "P0":
              raise SystemExit(f"{queue_id} priority is not P0: {item.get('priority')}")
          if str(item.get("project_id") or "").lower() != "zssh":
              raise SystemExit(f"{queue_id} is attached to wrong project: {item.get('project_id')}")

          receipt = {
              "schema_version": 1,
              "scope": "ftmo-stale-ci-zssh-queue",
              "workflow_run_id": os.environ.get("GITHUB_RUN_ID"),
              "workflow_run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "workflow_source_sha": os.environ.get("GITHUB_SHA"),
              "receipt_base_sha": subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], text=True
              ).strip(),
              "queue": {
                  "queue_id": item.get("queue_id"),
                  "project_id": item.get("project_id"),
                  "priority": item.get("priority"),
                  "status": item.get("status"),
                  "eligible": item.get("eligible"),
                  "worker_slot": item.get("worker_slot"),
                  "updated_at": item.get("updated_at"),
              },
          }
          print("FTMO_STALE_CI_ZSSH_QUEUE_GREEN", json.dumps(receipt, sort_keys=True))
          target = Path("artifacts/ops/ftmo-stale-ci-zssh-queue-receipt.json")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps(receipt, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          PY

          git config user.name "zcloud-automation"
          git config user.email "zcloud-automation@users.noreply.github.com"
          git add artifacts/ops/ftmo-stale-ci-zssh-queue-receipt.json
          if git diff --cached --quiet; then
            echo "Queue receipt unchanged"
          else
            git commit -m "Record FTMO stale CI zSSH queue receipt"
            git push origin HEAD:main
          fi
