# retrigger 2026-10-06T06:18Z after workflow registration
name: zCloud hosted emergency queue sweep

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/zcloud-hosted-emergency-queue-sweep.yml"
      - "scripts/zcloud_hosted_queue_sweep_policy.py"
      - "tests/test_hosted_queue_sweep_policy.py"
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
    paths:
      - ".github/workflows/zcloud-hosted-emergency-queue-sweep.yml"
      - "scripts/zcloud_hosted_queue_sweep_policy.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zcloud-hosted-emergency-queue-sweep-${{ github.event_name == 'pull_request' && github.ref || 'live' }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      EXPECTED_ZCLOUD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.EXPECTED_ZCLOUD_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate fail-closed sweep policy
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_ZCLOUD_SHA"
          python3 -m unittest -v tests.test_hosted_queue_sweep_policy

  sweep:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      statuses: write
    steps:
      - name: Check out exact sweep policy
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Sweep stale self-hosted blockers and publish evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone

          from scripts.zcloud_hosted_queue_sweep_policy import classify_run

          repo = os.environ["REPO"]
          token = os.environ["GH_TOKEN"]
          current_run = int(os.environ["RUN_ID"])
          now = datetime.now(timezone.utc)
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "zcloud-hosted-emergency-queue-sweep/2",
          }

          def request(path, method="GET", payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(
                  "https://api.github.com" + path,
                  data=data,
                  method=method,
                  headers=headers,
              )
              with urllib.request.urlopen(req, timeout=25) as response:
                  raw = response.read()
                  return json.loads(raw) if raw else {}

          def list_runs(status):
              return (
                  request(f"/repos/{repo}/actions/runs?status={status}&per_page=100")
                  .get("workflow_runs")
                  or []
              )

          cancelled = []
          protected = []
          retained = []
          candidates = []

          for status in ("in_progress", "queued"):
              for run in list_runs(status):
                  run_id = int(run["id"])
                  if run_id == current_run:
                      continue
                  path = str(run.get("path") or "")
                  name = str(run.get("name") or "")
                  created = datetime.fromisoformat(str(run["created_at"]).replace("Z", "+00:00"))
                  age_s = int((now - created).total_seconds())
                  decision = classify_run(
                      path=path,
                      name=name,
                      status=status,
                      age_seconds=age_s,
                  )
                  summary = {
                      "id": run_id,
                      "status": status,
                      "age_s": age_s,
                      "name": name,
                      "path": path,
                      "reason": decision.reason,
                  }
                  if not decision.cancel:
                      if decision.reason == "protected_mutation":
                          protected.append(summary)
                      else:
                          retained.append(summary)
                      continue

                  jobs = (
                      request(f"/repos/{repo}/actions/runs/{run_id}/jobs?filter=latest&per_page=100")
                      .get("jobs")
                      or []
                  )
                  self_hosted = [
                      job for job in jobs
                      if "self-hosted" in {str(x).lower() for x in (job.get("labels") or [])}
                      and str(job.get("status") or "") in {"queued", "in_progress"}
                  ]
                  if not self_hosted:
                      summary["reason"] = "no_active_self_hosted_job"
                      retained.append(summary)
                      continue
                  summary["jobs"] = [
                      {
                          "id": j.get("id"),
                          "name": j.get("name"),
                          "status": j.get("status"),
                          "labels": j.get("labels"),
                      }
                      for j in self_hosted
                  ]
                  candidates.append(summary)

          for item in candidates:
              try:
                  request(f"/repos/{repo}/actions/runs/{item['id']}/cancel", method="POST")
                  cancelled.append(item)
              except urllib.error.HTTPError as exc:
                  if exc.code not in (409, 422):
                      raise
                  item = dict(item)
                  item["cancel_http"] = exc.code
                  item["reason"] = "cancel_race"
                  retained.append(item)

          runner_probe = {"available": False}
          try:
              runners = request(f"/repos/{repo}/actions/runners?per_page=100").get("runners") or []
              runner_probe = {
                  "available": True,
                  "runners": [
                      {
                          "id": r.get("id"),
                          "name": r.get("name"),
                          "status": r.get("status"),
                          "busy": r.get("busy"),
                          "labels": [x.get("name") for x in (r.get("labels") or [])],
                      }
                      for r in runners
                  ],
              }
          except urllib.error.HTTPError as exc:
              runner_probe = {"available": False, "http": exc.code}

          evidence = {
              "ok": True,
              "policy": "fail_closed_allowlist_v1",
              "cancelled_count": len(cancelled),
              "cancelled": cancelled,
              "protected_mutation_runs": protected,
              "retained_runs": retained,
              "runner_probe": runner_probe,
          }
          print("ZCLOUD_HOSTED_QUEUE_SWEEP=" + json.dumps(evidence, sort_keys=True))

          description = (
              f"sweep green; cancelled={len(cancelled)} protected={len(protected)} retained={len(retained)}"
          )[:140]
          payload = {
              "state": "success",
              "context": "zcloud/hosted-queue-sweep",
              "description": description,
              "target_url": f"{os.environ['SERVER_URL']}/{repo}/actions/runs/{current_run}",
          }
          request(f"/repos/{repo}/statuses/{os.environ['SHA']}", method="POST", payload=payload)
          PY
