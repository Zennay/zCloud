name: zCloud hosted emergency queue observation (read-only)

# The former queue sweep could automatically cancel unrelated in-flight jobs
# and post an unearned green commit status. This replacement never mutates
# Actions, statuses, runners or live workers.
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/zcloud-hosted-emergency-queue-sweep.yml
      - tests/test_zcloud_emergency_queue_quarantine_20261014.py
      - tests/test_zcloud_queue_observation_semantics_20261014.py
      - scripts/zcloud_emergency_entrypoint_ratchet_20261014.py
      - tests/test_zcloud_emergency_entrypoint_ratchet_20261014.py
  workflow_dispatch:
    inputs:
      confirm_sha:
        description: "Confirm the exact current main SHA for a read-only observation"
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: zcloud-hosted-queue-observation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  source-proof:
    if: >-
      github.event_name == 'pull_request' &&
      github.repository == 'Zennay/zCloud' &&
      github.event.pull_request.head.repo.full_name == github.repository
      && ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || (github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'Zennay'))
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 5
    steps:
      - name: Check out exact candidate without retained credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 1
      - name: Verify checked-out revision and quarantine contracts
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python3 -m unittest -v tests.test_zcloud_emergency_queue_quarantine_20261014 tests.test_zcloud_queue_observation_semantics_20261014

  observe:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'Zennay/zCloud' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'Zennay' &&
      github.triggering_actor == 'Zennay' &&
      github.run_attempt == 1 &&
      inputs.confirm_sha == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out immutable current main without retained credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 1
      - name: Verify exact owner dispatch, current main and hosted execution
        shell: bash
        env:
          CONFIRM_SHA: ${{ inputs.confirm_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = Zennay/zCloud
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_ACTOR" = Zennay
          test "$GITHUB_TRIGGERING_ACTOR" = Zennay
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$RUNNER_ENVIRONMENT" = github-hosted
          [[ "$CONFIRM_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$CONFIRM_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          actual_main="$(timeout 15 git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          test -n "$actual_main"
          test "$actual_main" = "$GITHUB_SHA"
      - name: Summarize sampled Actions queue with GET only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIRM_SHA: ${{ inputs.confirm_sha }}
        run: |
          set -euo pipefail
          # A prior step's admission may become stale while the hosted job runs.
          # Check authorization and current canonical main immediately before GET.
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REPOSITORY" = "Zennay/zCloud"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_ACTOR" = "Zennay"
          test "$GITHUB_TRIGGERING_ACTOR" = "Zennay"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          [[ "$CONFIRM_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$CONFIRM_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          current_main="$(timeout 15 git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          test -n "$current_main"
          test "$current_main" = "$GITHUB_SHA"
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ.get("GH_TOKEN", "")
          if repo != "Zennay/zCloud" or not re.fullmatch(r"[A-Za-z0-9_.-]{1,4096}", token):
              raise SystemExit("Queue observation denied: invalid identity or bearer token")
          headers = {
              "Authorization": "Bearer " + token,
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "zcloud-queue-readonly-observer/1",
          }
          def get_json(path):
              url = "https://api.github.com" + path
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers, method="GET"), timeout=12) as response:
                  result = json.load(response)
              if not isinstance(result, dict):
                  raise ValueError("unexpected Actions response shape")
              return result

          summary = {
              "policy": "zcloud-queue-readonly-observation-v1",
              "mutation_performed": False,
              "sample_complete": True,
              "sampled_runs": 0,
              "sampled_jobs": 0,
              "queued_jobs": 0,
              "in_progress_jobs": 0,
              "stale_queued_jobs": 0,
              "stale_unassigned_jobs": 0,
              "queued_with_assigned_runner": 0,
              "queue_age_unknown_jobs": 0,
              "runs_with_no_job_records": 0,
              "indeterminate_job_rows": 0,
          }
          now = datetime.now(timezone.utc)
          for status in ("queued", "in_progress"):
              params = urllib.parse.urlencode({"status": status, "per_page": 100})
              payload = get_json(f"/repos/{repo}/actions/runs?{params}")
              runs = payload.get("workflow_runs")
              if not isinstance(runs, list):
                  raise ValueError("workflow_runs missing")
              total = payload.get("total_count")
              if type(total) is not int or total < len(runs):
                  raise ValueError("invalid workflow run count")
              # Bound external reads and never call a partial sample exhaustive.
              if total > 20 or len(runs) > 20:
                  summary["sample_complete"] = False
              for run in runs[:20]:
                  if not isinstance(run, dict) or type(run.get("id")) is not int or run["id"] <= 0:
                      raise ValueError("invalid workflow run identity")
                  jobs_response = get_json(f"/repos/{repo}/actions/runs/{run['id']}/jobs?filter=latest&per_page=100")
                  jobs = jobs_response.get("jobs")
                  count = jobs_response.get("total_count")
                  if not isinstance(jobs, list) or type(count) is not int or count < len(jobs):
                      raise ValueError("invalid workflow job snapshot")
                  if count > len(jobs):
                      summary["sample_complete"] = False
                  summary["sampled_runs"] += 1
                  if not jobs:
                      summary["runs_with_no_job_records"] += 1
                      summary["sample_complete"] = False
                  for job in jobs:
                      if not isinstance(job, dict):
                          summary["indeterminate_job_rows"] += 1
                          summary["sample_complete"] = False
                          continue
                      labels = job.get("labels")
                      if not isinstance(labels, list) or not all(isinstance(x, str) for x in labels):
                          summary["indeterminate_job_rows"] += 1
                          summary["sample_complete"] = False
                          continue
                      if "self-hosted" not in {x.lower() for x in labels}:
                          continue
                      phase = job.get("status")
                      if phase not in ("queued", "in_progress"):
                          summary["indeterminate_job_rows"] += 1
                          summary["sample_complete"] = False
                          continue
                      summary["sampled_jobs"] += 1
                      summary[phase + "_jobs"] += 1
                      if phase == "queued":
                          # A workflow run can be old while its individual job
                          # was only just queued. Never attribute run age to a job.
                          timestamp = job.get("created_at")
                          if not isinstance(timestamp, str):
                              summary["indeterminate_job_rows"] += 1
                              summary["queue_age_unknown_jobs"] += 1
                              summary["sample_complete"] = False
                              continue
                          try:
                              created = datetime.fromisoformat(timestamp.replace("Z", "+00:00"))
                              seconds = (now - created).total_seconds()
                          except (ValueError, TypeError, OverflowError):
                              summary["indeterminate_job_rows"] += 1
                              summary["queue_age_unknown_jobs"] += 1
                              summary["sample_complete"] = False
                              continue
                          if created.tzinfo is None or seconds < 0:
                              summary["indeterminate_job_rows"] += 1
                              summary["queue_age_unknown_jobs"] += 1
                              summary["sample_complete"] = False
                              continue
                          runner_id = job.get("runner_id")
                          if runner_id is not None and (
                              type(runner_id) is not int or runner_id < 0
                          ):
                              summary["indeterminate_job_rows"] += 1
                              summary["sample_complete"] = False
                              continue
                          if isinstance(runner_id, int) and runner_id > 0:
                              summary["queued_with_assigned_runner"] += 1
                          if seconds > 480:
                              summary["stale_queued_jobs"] += 1
                              if runner_id in (None, 0):
                                  summary["stale_unassigned_jobs"] += 1
          # Counts are sampled, not proof of runner failure or permission to cancel.
          print("ZCLOUD_QUEUE_READONLY=" + json.dumps(summary, sort_keys=True, separators=(",", ":")))
          PY
