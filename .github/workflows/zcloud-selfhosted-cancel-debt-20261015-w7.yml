name: zCloud self-hosted noninterrupting cancellation guard
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "scripts/zcloud_selfhosted_cancel_ratchet_20261015_w7.py"
      - "tests/test_selfhosted_cancel_ratchet_20261015_w7.py"

permissions:
  contents: read

concurrency:
  group: zcloud-selfhosted-cancel-debt-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  deny-new-vps-cancellation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Admit same-repo owner before executing candidate code
        env:
          SOURCE_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_REPOSITORY" = Zennay/zCloud
          test "$GITHUB_ACTOR" = Zennay
          test "$SOURCE_REPO" = Zennay/zCloud
          [[ "$PR_HEAD" =~ ^[a-f0-9]{40}$ ]]
      - name: Check out immutable source with credential persistence disabled
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Bind HEAD and canonical remote main before checks
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(timeout 15 git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')" = "$BASE_SHA"
          git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA"
      - name: Run adversarial synthetic Git regressions
        run: |
          set -euo pipefail
          python3 -m unittest -v tests.test_selfhosted_cancel_ratchet_20261015_w7
          python3 -m py_compile scripts/zcloud_selfhosted_cancel_ratchet_20261015_w7.py
      - name: Deny newly introduced self-hosted cancellation debt
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python3 scripts/zcloud_selfhosted_cancel_ratchet_20261015_w7.py --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Reverify immutable source and main after checks
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(timeout 15 git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')" = "$BASE_SHA"
