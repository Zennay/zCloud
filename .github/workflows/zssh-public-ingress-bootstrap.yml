name: zSSH public ingress bootstrap (zCloud lane)

on:
  workflow_dispatch:
    inputs:
      expected_zssh_sha:
        description: Exact canonical Zennay/zSSH main SHA to deploy
        required: true
        type: string
      activation_phrase:
        description: Type INSTALL_ZSSH_PUBLIC_INGRESS
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: zssh-public-ingress-bootstrap-zcloud
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Install Caddy and promote zSSH public ingress
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 20
    env:
      XDG_RUNTIME_DIR: /run/user/1000
      DBUS_SESSION_BUS_ADDRESS: unix:path=/run/user/1000/bus
      ZSSH_PRODUCTION_ORIGIN: https://zssh.cheapgpt.shop
      ZSSH_PRODUCTION_HOST: zssh.cheapgpt.shop
      ZSSH_EXPECTED_IPV4: 198.244.191.182
      ZSSH_PUBLIC_GATEWAY_PORT: "8789"
    steps:
      - name: Check out zCloud coordination
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enforce explicit activation and canonical runner
        env:
          ACTIVATION_PHRASE: "${{ inputs.activation_phrase }}"
          EXPECTED_ZSSH_SHA: "${{ inputs.expected_zssh_sha }}"
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_REF_NAME" = "main"
          test "$ACTIVATION_PHRASE" = "INSTALL_ZSSH_PUBLIC_INGRESS"
          [[ "$EXPECTED_ZSSH_SHA" =~ ^[0-9a-f]{40}$ ]]
          python3 scripts/zcloud_vps_runner_guard.py --json             | tee "$RUNNER_TEMP/zssh-public-ingress-runner-guard.json"
          test "$(hostname)" = "vps-bb300bba"
          test "$(id -un)" = "ubuntu"
          test "$(id -u)" -ne 0
          sudo -n true

      - name: Require production DNS to point directly at this VPS
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import os
          import socket

          host = os.environ["ZSSH_PRODUCTION_HOST"]
          expected = os.environ["ZSSH_EXPECTED_IPV4"]
          found = {
              row[4][0]
              for row in socket.getaddrinfo(host, 443, socket.AF_INET, socket.SOCK_STREAM)
          }
          if found != {expected}:
              raise SystemExit(
                  f"production DNS is not exact: {host} resolved to {sorted(found)!r}, expected only {expected}"
              )
          print(f"ZSSH_PUBLIC_INGRESS_DNS_GREEN host={host} ipv4={expected}")
          PY

      - name: Require healthy isolated zSSH public gateway first
        shell: bash
        run: |
          set -Eeuo pipefail
          systemctl --user is-active --quiet zssh-public.service
          systemctl --user is-enabled --quiet zssh-public.service
          curl --fail --silent --show-error             "http://127.0.0.1:$ZSSH_PUBLIC_GATEWAY_PORT/health"             > "$RUNNER_TEMP/zssh-public-gateway-health.json"
          echo "ZSSH_PUBLIC_GATEWAY_LOCAL_GREEN port=$ZSSH_PUBLIC_GATEWAY_PORT"

      - name: Bind ingress promotion to exact canonical zSSH main
        id: zssh_target
        env:
          EXPECTED_ZSSH_SHA: "${{ inputs.expected_zssh_sha }}"
        shell: bash
        run: |
          set -Eeuo pipefail
          live_main="$(git ls-remote https://github.com/Zennay/zSSH.git refs/heads/main | awk '{print $1}')"
          test "$live_main" = "$EXPECTED_ZSSH_SHA"
          echo "sha=$live_main" >> "$GITHUB_OUTPUT"
          echo "ZSSH_SHA=$live_main" >> "$GITHUB_ENV"
          echo "ZSSH_PUBLIC_INGRESS_SHA_BOUND sha=$live_main"

      - name: Check out exact canonical zSSH revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Zennay/zSSH
          ref: ${{ steps.zssh_target.outputs.sha }}
          path: zssh-source
          persist-credentials: false

      - name: Verify release source and Caddy transaction tests
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C zssh-source rev-parse HEAD)" = "$ZSSH_SHA"
          npm --prefix zssh-source install --ignore-scripts --no-audit --no-fund
          (
            cd zssh-source
            node --test test/public-caddy-renderer.test.mjs test/public-caddy-installer.test.mjs test/deploy.test.mjs test/runtime-dependency-policy.test.mjs
            bash -n deploy/install-public-caddy.sh
            bash -n deploy/install-target-agent.sh
          )
          echo "ZSSH_PUBLIC_CADDY_TRANSACTION_TESTS_GREEN sha=$ZSSH_SHA"

      - name: Require public web ports to be unclaimed before first Caddy install
        shell: bash
        run: |
          set -Eeuo pipefail
          if command -v caddy >/dev/null 2>&1; then
            echo "ZSSH_CADDY_ALREADY_PRESENT_SKIP_PORT_OWNERSHIP_CHECK"
            exit 0
          fi
          listeners="$(sudo -n ss -H -ltnp 2>/dev/null | awk '$4 ~ /:80$|:443$/ {print}')"
          if [[ -n "$listeners" ]]; then
            echo "Ports 80/443 already have listeners; refusing first Caddy installation." >&2
            exit 2
          fi
          echo "ZSSH_PUBLIC_WEB_PORTS_FREE_GREEN"

      - name: Install official stable Caddy package when absent
        shell: bash
        run: |
          set -Eeuo pipefail
          if command -v caddy >/dev/null 2>&1; then
            echo "ZSSH_CADDY_PACKAGE_ALREADY_PRESENT version=$(caddy version)"
            exit 0
          fi

          sudo -n env DEBIAN_FRONTEND=noninteractive apt-get update
          sudo -n env DEBIAN_FRONTEND=noninteractive apt-get install --yes             debian-keyring debian-archive-keyring apt-transport-https curl gnupg

          key_src="$RUNNER_TEMP/caddy-stable.gpg.key"
          keyring="$RUNNER_TEMP/caddy-stable-archive-keyring.gpg"
          list_src="$RUNNER_TEMP/caddy-stable.list"

          curl --fail --silent --show-error --location             "https://dl.cloudsmith.io/public/caddy/stable/gpg.key"             --output "$key_src"
          gpg --batch --yes --dearmor --output "$keyring" "$key_src"

          curl --fail --silent --show-error --location             "https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt"             --output "$list_src"

          test -s "$keyring"
          test -s "$list_src"
          sudo -n install -m 0644 "$keyring" /usr/share/keyrings/caddy-stable-archive-keyring.gpg
          sudo -n install -m 0644 "$list_src" /etc/apt/sources.list.d/caddy-stable.list

          sudo -n env DEBIAN_FRONTEND=noninteractive apt-get update
          sudo -n env DEBIAN_FRONTEND=noninteractive apt-get install --yes caddy

          command -v caddy
          caddy version
          sudo -n systemctl is-active --quiet caddy
          sudo -n systemctl is-enabled --quiet caddy
          sudo -n test -f /etc/caddy/Caddyfile
          echo "ZSSH_CADDY_PACKAGE_INSTALL_GREEN version=$(caddy version)"

      - name: Promote canonical zSSH Caddy ingress transaction
        shell: bash
        run: |
          set -Eeuo pipefail
          source_root="$GITHUB_WORKSPACE/zssh-source"
          export ZSSH_PUBLIC_BASE_URL="$ZSSH_PRODUCTION_ORIGIN"
          export ZSSH_PUBLIC_GATEWAY_PORT
          bash "$source_root/deploy/install-public-caddy.sh" "$source_root"             | tee "$RUNNER_TEMP/zssh-public-caddy-install.txt"
          grep -F "ZSSH_PUBLIC_CADDY_INSTALL_GREEN host=$ZSSH_PRODUCTION_HOST port=$ZSSH_PUBLIC_GATEWAY_PORT"             "$RUNNER_TEMP/zssh-public-caddy-install.txt"
          sudo -n systemctl is-active --quiet caddy
          echo "ZSSH_PUBLIC_CADDY_PROMOTION_GREEN sha=$ZSSH_SHA"

      - name: Prove local TLS ingress reaches exact zSSH health surface
        shell: bash
        run: |
          set -Eeuo pipefail
          health_url="https://$ZSSH_PRODUCTION_HOST/health"
          success=0
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error               --resolve "$ZSSH_PRODUCTION_HOST:443:127.0.0.1"               "$health_url"               > "$RUNNER_TEMP/zssh-public-tls-health.json"; then
              success=1
              break
            fi
            sleep 2
          done
          test "$success" = "1"
          node - "$RUNNER_TEMP/zssh-public-tls-health.json" <<'NODE'
          const fs = require("fs");
          const value = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (value?.ok !== true || value?.service !== "zssh") {
            throw new Error("public TLS /health did not return healthy zSSH");
          }
          NODE
          echo "ZSSH_PUBLIC_TLS_LOCAL_GREEN origin=$ZSSH_PRODUCTION_ORIGIN"

      - name: Install and prove outbound reviewer target agent
        shell: bash
        run: |
          set -Eeuo pipefail
          source_root="$GITHUB_WORKSPACE/zssh-source"
          public_keys="$HOME/.config/zssh/reviewer-agent-public.json"
          private_key="$HOME/.config/zssh/agent-ed25519.pem"
          review_root="/srv/zssh-review"
          agent_env="$HOME/.config/zssh/agent.env"

          test -f "$public_keys"
          test -f "$private_key"
          test -d "$review_root"

          target_id="$(node --input-type=module - "$public_keys" <<'NODE'
          import { readFileSync } from "node:fs";
          const config = JSON.parse(readFileSync(process.argv[2], "utf8"));
          const ids = Object.keys(config?.targets || {});
          if (config?.version !== 1 || ids.length !== 1 || !/^zt_[A-Za-z0-9_-]{8,96}$/.test(ids[0])) {
            throw new Error("reviewer target public-key config must contain exactly one opaque target");
          }
          process.stdout.write(ids[0]);
          NODE
          )"

          export ZSSH_GATEWAY_URL="$ZSSH_PRODUCTION_ORIGIN"
          export ZSSH_TARGET_ID="$target_id"
          export ZSSH_AGENT_PRIVATE_KEY_FILE="$private_key"
          export ZSSH_PUBLIC_ALLOWED_ROOTS="$review_root"
          export ZSSH_EXPECTED_SHA="$ZSSH_SHA"

          install_output="$RUNNER_TEMP/zssh-target-agent-install.txt"
          bash "$source_root/deploy/install-target-agent.sh" "$source_root" | tee "$install_output"
          grep -F "ZSSH_AGENT_INSTALL_GREEN sha=$ZSSH_SHA target=$target_id service=zssh-agent.service" "$install_output"

          node --input-type=module - "$agent_env" "$target_id" "$ZSSH_PRODUCTION_ORIGIN" "$private_key" "$review_root" <<'NODE'
          import { readFileSync } from "node:fs";
          const [file, targetId, gatewayUrl, privateKey, reviewRoot] = process.argv.slice(2);
          const entries = new Map();
          for (const raw of readFileSync(file, "utf8").split(/\r?\n/)) {
            if (!raw) continue;
            const index = raw.indexOf("=");
            if (index <= 0) throw new Error("invalid agent.env line");
            const key = raw.slice(0, index);
            const value = raw.slice(index + 1);
            if (entries.has(key)) throw new Error("duplicate agent.env key: " + key);
            entries.set(key, value);
          }
          const expected = new Map([
            ["NODE_ENV", "production"],
            ["ZSSH_PLUGIN_PROFILE", "public"],
            ["ZSSH_TARGET_ID", targetId],
            ["ZSSH_GATEWAY_URL", gatewayUrl],
            ["ZSSH_AGENT_PRIVATE_KEY_FILE", privateKey],
            ["ZSSH_PUBLIC_ALLOWED_ROOTS", reviewRoot],
            ["ZSSH_ALLOWED_ROOTS", reviewRoot],
            ["ZSSH_EXEC_MODE", "disabled"],
          ]);
          for (const [key, value] of expected) {
            if (entries.get(key) !== value) throw new Error("agent.env " + key + " does not match the release fixture");
          }
          NODE

          systemctl --user is-active --quiet zssh-agent.service
          systemctl --user is-enabled --quiet zssh-agent.service
          restarts_before="$(systemctl --user show zssh-agent.service --property=NRestarts --value)"

          raw_pairings="$RUNNER_TEMP/zssh-target-agent-pairings.raw.json"
          control_proof="$RUNNER_TEMP/zssh-target-agent-control-proof.json"
          node "$source_root/agent.mjs" pairings > "$raw_pairings"
          node --input-type=module - "$raw_pairings" "$control_proof" "$target_id" <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const [input, output, targetId] = process.argv.slice(2);
          const value = JSON.parse(readFileSync(input, "utf8"));
          if (!Array.isArray(value.pairings) || !Array.isArray(value.requests)) {
            throw new Error("signed target pairing control returned an invalid response");
          }
          for (const item of [...value.pairings, ...value.requests]) {
            if (item?.target_id !== targetId) throw new Error("pairing control leaked cross-target state");
          }
          writeFileSync(output, JSON.stringify({
            ok: true,
            target_id: targetId,
            signed_pairing_control_green: true,
            target_scoped: true,
            pairing_count: value.pairings.length,
            request_count: value.requests.length,
          }, null, 2) + "\n");
          NODE
          rm -f "$raw_pairings"

          sleep 4
          systemctl --user is-active --quiet zssh-agent.service
          restarts_after="$(systemctl --user show zssh-agent.service --property=NRestarts --value)"
          test "$restarts_after" = "$restarts_before"

          echo "ZSSH_REVIEW_TARGET_ID=$target_id" >> "$GITHUB_ENV"
          echo "ZSSH_TARGET_AGENT_CONTROL_GREEN target=$target_id restarts=$restarts_after"

      - name: Reconfirm canonical zSSH main and record runtime receipt
        shell: bash
        run: |
          set -Eeuo pipefail
          live_main_after="$(git ls-remote https://github.com/Zennay/zSSH.git refs/heads/main | awk '{print $1}')"
          test "$live_main_after" = "$ZSSH_SHA"

          caddy_version="$(caddy version)"
          root_sha="$(sudo -n sha256sum /etc/caddy/Caddyfile | awk '{print $1}')"
          snippet_sha="$(sudo -n sha256sum /etc/caddy/zssh-public.caddy | awk '{print $1}')"

          evidence_json="$(python3 - "$caddy_version" "$root_sha" "$snippet_sha" <<'PY'
          import json
          import os
          import sys
          print(json.dumps({
              "proof": "public-ingress-bootstrap",
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "runner_name": os.environ["RUNNER_NAME"],
              "hostname": "vps-bb300bba",
              "zssh_commit_sha": os.environ["ZSSH_SHA"],
              "production_origin": os.environ["ZSSH_PRODUCTION_ORIGIN"],
              "production_ipv4": os.environ["ZSSH_EXPECTED_IPV4"],
              "gateway_port": int(os.environ["ZSSH_PUBLIC_GATEWAY_PORT"]),
              "gateway_service_active": True,
              "target_agent_service_active": True,
              "target_agent_signed_pairing_control_green": True,
              "target_agent_target_id": os.environ["ZSSH_REVIEW_TARGET_ID"],
              "caddy_service_active": True,
              "caddy_version": sys.argv[1],
              "caddy_root_sha256": sys.argv[2],
              "caddy_snippet_sha256": sys.argv[3],
              "local_tls_health_green": True,
              "canonical_main_reconfirmed": True,
          }, sort_keys=True, separators=(",", ":")))
          PY
          )"

          python3 scripts/zcloud_runtime.py             --db /home/ubuntu/zennay-cloud/history.db             receipt             --project zssh             --phase "Public plugin · production submission hardening"             --action "Installed Caddy, promoted transactional zSSH public TLS ingress, and proved the outbound reviewer target agent"             --commit "$ZSSH_SHA"             --ci-status success             --next-gate "Run GitHub-hosted zSSH external public-ingress preflight against https://zssh.cheapgpt.shop/mcp, then continue Auth0 and reviewer pairing/login gates"             --source "github-actions:zssh-public-ingress-bootstrap"             --evidence-json "$evidence_json"

          echo "$evidence_json" > "$RUNNER_TEMP/zssh-public-ingress-bootstrap.json"
          echo "ZSSH_PUBLIC_INGRESS_BOOTSTRAP_GREEN sha=$ZSSH_SHA"

      - name: Upload non-secret ingress evidence
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zssh-public-ingress-bootstrap-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/zssh-public-ingress-bootstrap.json
            ${{ runner.temp }}/zssh-public-ingress-runner-guard.json
            ${{ runner.temp }}/zssh-public-gateway-health.json
            ${{ runner.temp }}/zssh-public-tls-health.json
            ${{ runner.temp }}/zssh-target-agent-control-proof.json
          if-no-files-found: error
          retention-days: 30
