name: uLab zCloud dogfood

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "ulab/zcloud-state/**"
      - ".github/workflows/ulab-zcloud-dogfood.yml"
      - "tests/test_ulab_zcloud_dogfood_workflow.py"

permissions:
  contents: read

concurrency:
  group: ulab-zcloud-dogfood-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  real-project-upgrade:
    if: >-
      github.event_name != 'pull_request' ||
      (github.actor == 'Zennay' &&
       github.triggering_actor == 'Zennay' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 20
    env:
      EXPECTED_ZCLOUD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact zCloud revision with history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact zCloud checkout and permanent runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_ZCLOUD_SHA"
          test "$(id -un)" = ubuntu
          python3 scripts/zcloud_vps_runner_guard.py --json

      - name: Resolve exact uLab main revision
        id: ulab_ref
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git ls-remote https://github.com/Zennay/uLab.git refs/heads/main | awk '{print $1}')"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          printf 'ULAB_MAIN_RESOLVED sha=%s\n' "$sha"

      - name: Check out exact uLab revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Zennay/uLab
          ref: ${{ steps.ulab_ref.outputs.sha }}
          path: .ulab-tool
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact uLab checkout
        shell: bash
        env:
          EXPECTED_ULAB_SHA: ${{ steps.ulab_ref.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git -C .ulab-tool rev-parse HEAD)" = "$EXPECTED_ULAB_SHA"

      - name: Build uLab on VPS
        shell: bash
        run: |
          set -euo pipefail
          command -v go
          (
            cd .ulab-tool
            go build -trimpath -buildvcs=false -o ../.ulab-bin ./cmd/ulab
          )

      - name: Run real zCloud upgrade matrix
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .ulab/zcloud-dogfood-evidence .ulab/zcloud-dogfood-result.json
          ./.ulab-bin test             --jobs 1             --config ulab/zcloud-state/ulab.json             --json-out .ulab/zcloud-dogfood-result.json             --evidence-root .ulab/zcloud-dogfood-evidence
          cat .ulab/zcloud-dogfood-result.json

      - name: Prove persisted evidence
        shell: bash
        run: |
          set -euo pipefail
          test -s .ulab/zcloud-dogfood-result.json
          bundles=$(find .ulab/zcloud-dogfood-evidence -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')
          test "$bundles" -eq 1
          bundle=$(find .ulab/zcloud-dogfood-evidence -mindepth 1 -maxdepth 1 -type d | head -n1)
          test -s "$bundle/result.json"
          test -s "$bundle/metadata.json"
          echo "evidence_bundle=$bundle"
          cat "$bundle/metadata.json"
