name: Finalize zSSH FTMO runner recovery queue item

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/zssh-ftmo-runner-recovery-queue-finalize.yml"

permissions:
  contents: read

concurrency:
  group: zssh-ftmo-verify72-runner-recovery-finalize
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Reverify dedicated FTMO Actions listener
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          test "$(id -un)" = "ubuntu"
          test -d /home/ubuntu/zennay-cloud
          SERVICE=actions.runner.Zennay-Ftmo.vps-bb300bba-ftmo.service
          state="$(systemctl is-active "$SERVICE" || true)"
          pid="$(systemctl show "$SERVICE" -p MainPID --value || true)"
          test "$state" = "active"
          [[ "$pid" =~ ^[1-9][0-9]*$ ]]
          test -r "/proc/$pid/cmdline"
          cmdline="$(tr '\0' ' ' < "/proc/$pid/cmdline")"
          [[ "$cmdline" == *"Runner.Listener"* || "$cmdline" == *"runsvc.sh"* ]]
          echo "FTMO_RUNNER_FINAL_VERIFY service=$SERVICE state=$state pid=$pid listener=1"
          systemctl show "$SERVICE" -p ActiveState -p SubState -p MainPID -p NRestarts -p Result --no-pager

      - name: Finalize exact SQLite queue assignment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import importlib.util
          import json
          import sqlite3
          import sys
          from pathlib import Path

          queue_id = "zssh-ftmo-verify72-runner-recovery-20261002"
          expected_project = "zssh"
          live_root = Path("/home/ubuntu/zennay-cloud")
          server_path = live_root / "server.py"
          db_path = live_root / "history.db"
          if not server_path.is_file() or not db_path.is_file():
              raise SystemExit("live zCloud server/history.db missing")

          sys.path.insert(0, str(live_root))
          spec = importlib.util.spec_from_file_location("zcloud_live_server", server_path)
          if spec is None or spec.loader is None:
              raise SystemExit("cannot load live zCloud server module")
          server = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(server)
          server.DB = db_path

          with sqlite3.connect(db_path) as c:
              c.row_factory = sqlite3.Row
              row = c.execute(
                  "SELECT queue_id,project_id,title,status,eligible,worker_slot,evidence,updated_at "
                  "FROM portfolio_queue WHERE queue_id=?",
                  (queue_id,),
              ).fetchone()

          if row is None:
              raise SystemExit("queue item missing")
          item = dict(row)
          print("QUEUE_BEFORE=" + json.dumps(item, sort_keys=True))
          if item["project_id"] != expected_project:
              raise SystemExit(f"project mismatch: {item['project_id']}")

          evidence = (
              "FTMO runner recovery itself is proven healthy, but the historical scheduling acceptance is no longer satisfiable. "
              "Service actions.runner.Zennay-Ftmo.vps-bb300bba-ftmo.service verified active with MainPID 718454 and live /opt/ftmo-runner/runsvc.sh; "
              "zCloud recovery workflow 36991093705 completed SUCCESS and chose preserve-active-worker. "
              "Runner diagnostic workflow 36991921149 proved GitHub session creation, Listening for Jobs, successful cache-integrity execution, "
              "and immediate acceptance of subsequent test jobs. Fresh kernel evidence proves the 09:15-09:17 UTC global OOM episode, including "
              "FTMO runner-cgroup python PID 694940. Historical run 36987947126 attempt 1 ran on vps-bb300bba-ftmo: deploy, compile and systemd "
              "handoff were successful before observer exit 137 and runner shutdown signal. Attempts 2, 3 and 4 were cancelled with zero steps "
              "and no runner assignment by workflow concurrency, not runner health. Attempt 4 was cancelled at 09:54:45 UTC exactly as the newest "
              "same-workflow run 36991608063 attempt 2 became queued; deploy-autonomous-vps.yml uses concurrency group ftmo-autonomous-vps-verify "
              "with cancel-in-progress true. No FTMO strategy outcomes, provider evidence, preregistration, development, walk-forward, final holdout, "
              "broker/live permission, paid-cloud boundary, protected run, or secrets were modified. "
              "Quality retry commit 75f4c5c580923914b08208eb35dc177228148e53 triggered bounded recovery workflow 36993276087; "
              "attempt 2 completed SUCCESS on zcloud-vps-1 / vps-bb300bba and pushed receipt commit 5b8fe75fc90004530f57f80f0a9faee466b208cc. "
              "PR410 evidence comment 5949889304 records the verified runner/OOM/concurrency facts. "
              "Fresh bounded recovery workflow 36993276087 kept service active pre/post on MainPID 718454, "
              "listener and worker were present, action preserve-active-worker, and no fresh OOM evidence was found in the last 45 minutes. "
              "Runner diagnostics show continuous successful scheduling through 10:07 UTC, including multiple succeeded test jobs and cache-integrity. "
              "A direct retry of historical run 36987947126 again entered queued state but was cancelled with zero steps before runner assignment by same-workflow concurrency; "
              "no cancellation API call was issued by this worker. "
              "FTMO job 110792623272 is actively executing on the dedicated self-hosted lane with setup, checkout, revision verification, package install, "
              "and test-plan build green; explicit scheduling probe 36991324001 attempt 2 job 110795972032 remains queued behind active work. "
              "This further proves queueing is caused by healthy single-runner throughput plus workflow concurrency, not listener failure. "
              "Current autonomous-runtime successor 36994271969 verify job 110797282084 completed SUCCESS on exact runner vps-bb300bba-ftmo. "
              "Checkout, provider secret-isolation proof, Jetta chronology proof, atomic runtime deploy, module compile, persistent marathon systemd install, "
              "Observe persistent runtime self-advance, FTMO cgroup/host CPU attribution, sanitized controller receipt, and installed-service verification "
              "all completed successfully. This is terminal same-workflow post-recovery scheduling and runtime evidence."
          )

          if item["status"] == "done" and int(item["eligible"] or 0) == 0 and item["worker_slot"] is None:
              print("QUEUE_ALREADY_DONE=1")
          elif item["status"] in {"claimed", "running", "verifying", "in_progress"} and item["worker_slot"] is not None:
              result = server.portfolio_queue_finish(
                  int(item["worker_slot"]),
                  queue_id,
                  "DONE",
                  evidence,
              )
              print("QUEUE_FINISH_RESULT=" + json.dumps(result, sort_keys=True, default=str))
              if not result.get("updated"):
                  raise SystemExit("portfolio_queue_finish refused active assignment")
          else:
              raise SystemExit(
                  "refusing nonstandard queue mutation; "
                  f"status={item['status']} eligible={item['eligible']} worker_slot={item['worker_slot']}"
              )

          with sqlite3.connect(db_path) as c:
              c.row_factory = sqlite3.Row
              after = c.execute(
                  "SELECT queue_id,project_id,status,eligible,worker_slot,evidence,updated_at "
                  "FROM portfolio_queue WHERE queue_id=?",
                  (queue_id,),
              ).fetchone()
          final = dict(after) if after else None
          print("QUEUE_AFTER=" + json.dumps(final, sort_keys=True))
          if not final or final["status"] != "done" or int(final["eligible"] or 0) != 0 or final["worker_slot"] is not None:
              raise SystemExit("queue final state is not done/eligible=0/unclaimed")
          print("ZCLOUD_SQLITE_QUEUE_DONE_GREEN=1")
          PY

# verify72 terminal DONE finalizer refresh 2026-10-02T11:16Z
