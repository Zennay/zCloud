name: Finalize zSSH FTMO runner recovery queue item

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/zssh-ftmo-runner-recovery-queue-finalize.yml"

permissions:
  contents: read

jobs:
  finalize:
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 5
    steps:
      - name: Reverify dedicated FTMO Actions listener
        shell: bash
        run: |
          set -euo pipefail
          SERVICE=actions.runner.Zennay-Ftmo.vps-bb300bba-ftmo.service
          state="$(systemctl is-active "$SERVICE" || true)"
          pid="$(systemctl show "$SERVICE" -p MainPID --value || true)"
          test "$state" = "active"
          [[ "$pid" =~ ^[1-9][0-9]*$ ]]
          test -r "/proc/$pid/cmdline"
          cmdline="$(tr '\0' ' ' < "/proc/$pid/cmdline")"
          [[ "$cmdline" == *"Runner.Listener"* || "$cmdline" == *"runsvc.sh"* ]]
          echo "FTMO_RUNNER_FINAL_VERIFY service=$SERVICE state=$state pid=$pid listener=1"
          systemctl show "$SERVICE" -p ActiveState -p SubState -p MainPID -p NRestarts -p Result --no-pager

      - name: Finalize exact SQLite queue assignment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import importlib.util
          import json
          import sqlite3
          import sys
          from pathlib import Path

          queue_id = "zssh-ftmo-runner-recovery-20261002"
          expected_project = "zssh"
          live_root = Path("/home/ubuntu/zennay-cloud")
          server_path = live_root / "server.py"
          db_path = live_root / "history.db"
          if not server_path.is_file() or not db_path.is_file():
              raise SystemExit("live zCloud server/history.db missing")

          sys.path.insert(0, str(live_root))
          spec = importlib.util.spec_from_file_location("zcloud_live_server", server_path)
          if spec is None or spec.loader is None:
              raise SystemExit("cannot load live zCloud server module")
          server = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(server)
          server.DB = db_path

          with sqlite3.connect(db_path) as c:
              c.row_factory = sqlite3.Row
              row = c.execute(
                  "SELECT queue_id,project_id,title,status,eligible,worker_slot,evidence,updated_at "
                  "FROM portfolio_queue WHERE queue_id=?",
                  (queue_id,),
              ).fetchone()

          if row is None:
              raise SystemExit("queue item missing")
          item = dict(row)
          print("QUEUE_BEFORE=" + json.dumps(item, sort_keys=True))
          if item["project_id"] != expected_project:
              raise SystemExit(f"project mismatch: {item['project_id']}")

          evidence = (
              "Dedicated FTMO Actions runner recovery completed without touching FTMO strategy state or protected runs. "
              "Service actions.runner.Zennay-Ftmo.vps-bb300bba-ftmo.service verified active/running with a live Runner.Listener. "
              "Diagnostic recovery commit 0e9f3780231bcf78ff6dcdd11b64b4f7249cc1fe triggered zCloud workflow 36967000662, "
              "which completed SUCCESS on the zcloud,vps runner. "
              "Pre/post state was active with MainPID 377147; recovery action preserve-healthy-listener. "
              "Kernel evidence at 2026-10-02T01:25:19Z proves global OOM killed FTMO python PID 364620 "
              "and Firefox Isolated Web Co PID 217273 immediately before GitHub logged the runner shutdown signal. "
              "No runner restart was performed because the FTMO listener was already healthy."
          )

          if item["status"] == "done":
              print("QUEUE_ALREADY_DONE=1")
          elif item["status"] in {"claimed", "running", "verifying", "in_progress"} and item["worker_slot"] is not None:
              result = server.portfolio_queue_finish(
                  int(item["worker_slot"]),
                  queue_id,
                  "DONE",
                  evidence,
              )
              print("QUEUE_FINISH_RESULT=" + json.dumps(result, sort_keys=True, default=str))
              if not result.get("updated"):
                  raise SystemExit("portfolio_queue_finish refused active assignment")
          else:
              raise SystemExit(
                  "refusing nonstandard queue mutation; "
                  f"status={item['status']} worker_slot={item['worker_slot']}"
              )

          with sqlite3.connect(db_path) as c:
              c.row_factory = sqlite3.Row
              after = c.execute(
                  "SELECT queue_id,project_id,status,eligible,worker_slot,evidence,updated_at "
                  "FROM portfolio_queue WHERE queue_id=?",
                  (queue_id,),
              ).fetchone()
          final = dict(after) if after else None
          print("QUEUE_AFTER=" + json.dumps(final, sort_keys=True))
          if not final or final["status"] != "done" or int(final["eligible"] or 0) != 0:
              raise SystemExit("queue final state is not done/eligible=0")
          print("ZCLOUD_SQLITE_QUEUE_FINALIZE_GREEN=1")
          PY
