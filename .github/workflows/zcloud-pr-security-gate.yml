name: zCloud PR security gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  security-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Run security gate regressions
        run: >-
          python3 -m unittest -v
          tests.test_pr_security_scan
          tests.test_pr_security_workflow

      - name: Scan newly added secrets and action dependencies
        run: >-
          python3 scripts/zcloud_pr_security_scan.py
          --base-ref "${{ github.event.pull_request.base.sha }}"
