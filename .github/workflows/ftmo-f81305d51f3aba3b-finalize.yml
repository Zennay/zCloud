name: Finalize FTMO f813 Worker5 queue item

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-f81305d51f3aba3b-finalize.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ftmo-f81305d51f3aba3b-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 8
    env:
      QUEUE_ID: ftmo-f81305d51f3aba3b
      MERGE_SHA: f028eea5f0b6cd3c11ea821cdc92096facde8c8f
      PROVEN_HEAD: a156246682bd836c071b461f66009e7d620c00b4
      EXACT_PROOF_RUN: "37005946247"
      EXACT_PROOF_RECEIPT: runtime-evidence/ftmo-pr444-haxlab-proof-37005946247.json
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Reverify merged FTMO package and exact-head proof
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          gh auth status >/dev/null 2>&1

          python3 - <<'PY'
          import base64
          import json
          import os
          import subprocess

          merge_sha = os.environ["MERGE_SHA"]
          proven_head = os.environ["PROVEN_HEAD"]
          proof_run = int(os.environ["EXACT_PROOF_RUN"])
          receipt_path = os.environ["EXACT_PROOF_RECEIPT"]

          def gh_json(path):
              return json.loads(subprocess.check_output(
                  ["gh", "api", "-H", "X-GitHub-Api-Version: 2022-11-28", path],
                  text=True,
              ))

          current_main = gh_json("repos/Zennay/Ftmo/commits/main")["sha"]
          ancestry = gh_json(f"repos/Zennay/Ftmo/compare/{merge_sha}...{current_main}")
          if ancestry.get("status") not in {"ahead", "identical"}:
              raise SystemExit(
                  f"FTMO main no longer contains merge {merge_sha}: {ancestry.get('status')}"
              )

          payload = gh_json(f"repos/Zennay/Haxlab/contents/{receipt_path}")
          encoded = str(payload.get("content") or "").replace("\n", "")
          receipt = json.loads(base64.b64decode(encoded).decode("utf-8"))
          required = {
              "project": receipt.get("project") == "ftmo",
              "pr": receipt.get("pr") == 444,
              "target_sha": receipt.get("target_sha") == proven_head,
              "run_id": str(receipt.get("workflow_run_id")) == str(proof_run),
              "result": receipt.get("result") == "success",
              "host": receipt.get("runner_host") == "vps-bb300bba",
              "zero_cloud": str(receipt.get("paid_cloud_budget_usd")) == "0.00",
          }
          failed = [name for name, ok in required.items() if not ok]
          if failed:
              raise SystemExit("exact-head receipt verification failed: " + ",".join(failed))

          expected_proof = {
              "exact-sha-checkout",
              "isolated-install",
              "compile",
              "dukascopy-public-provider-tests",
              "timeout-retry-tests",
              "autonomous-provider-retry-tests",
              "zero-cost-boundary-tests",
              "full-suite-collection",
          }
          actual_proof = set(receipt.get("proof") or [])
          missing = sorted(expected_proof - actual_proof)
          if missing:
              raise SystemExit("exact-head receipt missing proof: " + ",".join(missing))

          print("FTMO_F813_PACKAGE_GREEN=" + json.dumps({
              "current_main": current_main,
              "merge_sha": merge_sha,
              "proven_head": proven_head,
              "proof_run": proof_run,
              "proof_result": receipt.get("result"),
              "runner_host": receipt.get("runner_host"),
              "proof": sorted(actual_proof),
          }, sort_keys=True))
          PY

      - name: Finalize exact live SQLite assignment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import importlib.util
          import json
          import os
          import sqlite3
          import sys
          from pathlib import Path

          queue_id = os.environ["QUEUE_ID"]
          merge_sha = os.environ["MERGE_SHA"]
          proven_head = os.environ["PROVEN_HEAD"]
          proof_run = os.environ["EXACT_PROOF_RUN"]
          expected_project = "ftmo"
          live_root = Path("/home/ubuntu/zennay-cloud")
          server_path = live_root / "server.py"
          db_path = live_root / "history.db"
          if not server_path.is_file() or not db_path.is_file():
              raise SystemExit("live zCloud server/history.db missing")

          sys.path.insert(0, str(live_root))
          spec = importlib.util.spec_from_file_location("zcloud_live_server", server_path)
          if spec is None or spec.loader is None:
              raise SystemExit("cannot load live zCloud server module")
          server = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(server)
          server.DB = db_path

          def get_item():
              with sqlite3.connect(db_path) as c:
                  c.row_factory = sqlite3.Row
                  row = c.execute(
                      "SELECT queue_id,project_id,title,status,eligible,worker_slot,evidence,"
                      "parent_queue_id,updated_at FROM portfolio_queue WHERE queue_id=?",
                      (queue_id,),
                  ).fetchone()
              return dict(row) if row else None

          before = get_item()
          print("QUEUE_BEFORE=" + json.dumps(before, sort_keys=True, default=str))
          if not before:
              raise SystemExit("queue item missing")
          if before["project_id"] != expected_project:
              raise SystemExit(f"project mismatch: {before['project_id']}")

          evidence = (
              "Worker5 Gen29 BI5 transfer-framing package completed: PR #444 merged as "
              f"{merge_sha} from proven exact head {proven_head}. HaxLab self-hosted exact-head "
              f"proof run {proof_run} SUCCESS on vps-bb300bba: isolated install, compile, full "
              "Dukascopy public provider tests, timeout/retry tests, autonomous-provider-retry "
              "tests, zero-cost boundaries and full-suite collection. Transfer-Encoding plus "
              "Content-Length ambiguity now fails closed; unsupported transfer codings fail "
              "closed; bounded single chunked framing remains supported. Generation 29 remains "
              "provider_foundation and no preregistration/development/walk-forward/final-holdout/"
              "live/broker/paid-cloud permission was relaxed."
          )

          finish_result = None
          if (
              before["status"] == "done"
              and int(before["eligible"] or 0) == 0
              and before["worker_slot"] is None
          ):
              print("QUEUE_ALREADY_DONE=1")
          elif (
              before["status"] in {"claimed", "running", "verifying", "in_progress"}
              and before["worker_slot"] is not None
          ):
              finish_result = server.portfolio_queue_finish(
                  int(before["worker_slot"]), queue_id, "DONE", evidence
              )
              print(
                  "QUEUE_FINISH_RESULT="
                  + json.dumps(finish_result, sort_keys=True, default=str)
              )
              if not finish_result.get("updated"):
                  raise SystemExit("portfolio_queue_finish refused active assignment")
          else:
              raise SystemExit(
                  "refusing nonstandard queue mutation; "
                  f"status={before['status']} worker_slot={before['worker_slot']}"
              )

          after = get_item()
          print("QUEUE_AFTER=" + json.dumps(after, sort_keys=True, default=str))
          if (
              not after
              or after["status"] != "done"
              or int(after["eligible"] or 0) != 0
              or after["worker_slot"] is not None
          ):
              raise SystemExit("queue final state is not done/eligible=0/slot=null")

          successors = []
          with sqlite3.connect(db_path) as c:
              c.row_factory = sqlite3.Row
              rows = c.execute(
                  "SELECT queue_id,project_id,status,priority,eligible,worker_slot,parent_queue_id,"
                  "updated_at FROM portfolio_queue WHERE parent_queue_id=? ORDER BY created_at",
                  (queue_id,),
              ).fetchall()
              successors = [dict(row) for row in rows]

          receipt = {
              "schema_version": 1,
              "project": "ftmo",
              "queue_id": queue_id,
              "merge_sha": merge_sha,
              "proven_head": proven_head,
              "exact_proof_run": int(proof_run),
              "finalizer_workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "job_status": "success",
              "queue_before": before,
              "queue_readback": after,
              "finish_result": finish_result,
              "successors": successors,
          }
          Path("/tmp/ftmo-f813-finalizer.json").write_text(
              json.dumps(receipt, sort_keys=True, indent=2, default=str) + "\n",
              encoding="utf-8",
          )
          print("ZCLOUD_SQLITE_QUEUE_FINALIZE_GREEN=1")
          print("QUEUE_SUCCESSORS=" + json.dumps(successors, sort_keys=True, default=str))
          PY

      - name: Persist finalizer receipt
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          mkdir -p runtime-evidence
          cp /tmp/ftmo-f813-finalizer.json             runtime-evidence/ftmo-f81305d51f3aba3b-finalizer.json
          git config user.name "zcloud-automation"
          git config user.email "zcloud-automation@users.noreply.github.com"
          git add runtime-evidence/ftmo-f81305d51f3aba3b-finalizer.json
          if git diff --cached --quiet; then
            echo "Finalizer receipt unchanged"
          else
            git commit -m "Record FTMO f813 Worker5 queue finalizer"
            git push origin HEAD:main
          fi
