[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whitelab"
version = "0.1.0"
description = "Authorization-first defensive security lab orchestration"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
whitelab = "whitelab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
