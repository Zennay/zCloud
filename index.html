<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09090b"><title>zCloud</title><style>
*{box-sizing:border-box}body{margin:0;background:#09090b;color:#fafafa;font:15px system-ui,-apple-system,sans-serif}main{max-width:1050px;margin:auto;padding:28px 18px 70px}.top,.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.muted{color:#a1a1aa}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}.card{background:#141416;border:1px solid #27272a;border-radius:20px;padding:18px}.hero{margin:22px 0}.big{font-size:34px;font-weight:750}.pill{padding:6px 10px;border-radius:999px;background:#202024;font-size:12px}.bar{height:7px;background:#27272a;border-radius:8px;overflow:hidden;margin-top:10px}.fill{height:100%;background:#fafafa;border-radius:8px}.dot{width:8px;height:8px;border-radius:50%;background:#22c55e;display:inline-block;margin-right:7px}.project{position:relative;overflow:hidden;cursor:pointer}.project:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}h1,h2,h3,p{margin:0}h1{font-size:25px}h2{font-size:17px;margin:0 0 12px}h3{font-size:21px}.meta{margin-top:14px;display:grid;gap:7px}.services{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.svc{font-size:11px;padding:5px 8px;background:#202024;border-radius:8px}.detail{display:none;margin-top:18px}.detail.open{display:block}.chart{height:220px;width:100%;margin-top:15px}.timeline{display:grid;gap:8px;margin-top:14px}.event{border-left:2px solid #3f3f46;padding:4px 0 4px 12px}.back{cursor:pointer}.bad .dot{background:#ef4444}@media(max-width:500px){main{padding-top:18px}.big{font-size:28px}.card{border-radius:17px}}
</style></head><body><main><div class="top"><div><h1>zCloud</h1><p class="muted">Project Command Center</p></div><span class="pill" id="live">● LIVE</span></div><div id="home"><div class="grid hero"><div class="card"><div class="muted">VPS health</div><div class="big" id="health">—</div><div class="muted" id="load">Loading…</div></div><div class="card"><div class="row"><span>Disk</span><b id="disk">—</b></div><div class="bar"><div class="fill" id="diskbar"></div></div><div class="row" style="margin-top:18px"><span>Memory</span><b id="mem">—</b></div><div class="bar"><div class="fill" id="membar"></div></div></div></div><h2>Projects</h2><div class="grid" id="projects"></div></div><div class="detail" id="detail"><span class="muted back" onclick="closeDetail()">← All projects</span><div class="card" style="margin-top:14px"><div class="row"><div><h1 id="dname"></h1><p class="muted" id="dgoal"></p></div><div class="big" id="dprogress"></div></div><div class="bar"><div class="fill" id="dbar"></div></div><h2 style="margin-top:24px">Progress over time</h2><svg class="chart" id="chart" viewBox="0 0 800 220" preserveAspectRatio="none"></svg><div class="row muted"><span id="firstdate"></span><span id="lastdate"></span></div><h2 style="margin-top:25px">Milestones</h2><div id="milestones"></div><h2 style="margin-top:25px">Recent changes</h2><div class="timeline" id="timeline"></div></div></div><p class="muted" style="margin-top:20px">Auto-refreshes every 15 seconds · history snapshot every 6 hours · API ready for Wear OS</p>
<script>
let DATA;const gb=n=>(n/1073741824).toFixed(1)+' GB',pct=(a,b)=>Math.round(a/b*100);
async function refresh(){try{DATA=await fetch('/api/status').then(r=>r.json());let d=DATA,dp=pct(d.host.disk.used,d.host.disk.total),mp=pct(d.host.memory.used,d.host.memory.total);health.textContent=dp<85&&mp<90?'Healthy':'Attention';load.textContent='Load '+d.host.load.toFixed(2);disk.textContent=gb(d.host.disk.free)+' free';diskbar.style.width=dp+'%';mem.textContent=mp+'%';membar.style.width=mp+'%';projects.innerHTML=d.projects.map(p=>`<div class="card project" style="--accent:${p.accent}" onclick="openDetail('${p.id}')"><div class="row"><h3>${p.name}</h3><span class="pill ${p.runner?'':'bad'}"><i class="dot"></i>${p.runner?'Online':'Offline'}</span></div><p class="muted" style="margin-top:5px">${p.goal}</p><div class="row" style="margin-top:16px"><b>${p.progress}%</b><span class="muted">overall progress</span></div><div class="bar"><div class="fill" style="width:${p.progress}%;background:${p.accent}"></div></div><div class="meta"><div>${p.message||'No commit data'}</div><div class="row"><span class="muted">Repository</span><span>${p.commits} commits · ${p.size}</span></div></div></div>`).join('');live.textContent='● LIVE'}catch(e){live.textContent='● OFFLINE'}}
function graph(h,accent){let s=chart,w=800,hh=220,pad=18;if(!h.length){s.innerHTML='';return}let min=0,max=100,pts=h.map((x,i)=>[(i/(Math.max(1,h.length-1)))*(w-pad*2)+pad,hh-pad-(x.progress-min)/(max-min)*(hh-pad*2)]);let path=pts.map((p,i)=>(i?'L':'M')+p[0]+','+p[1]).join(' ');s.innerHTML=`<line x1="18" y1="202" x2="782" y2="202" stroke="#3f3f46"/><line x1="18" y1="18" x2="18" y2="202" stroke="#3f3f46"/><path d="${path}" fill="none" stroke="${accent}" stroke-width="5" vector-effect="non-scaling-stroke"/>`+pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="${accent}"/>`).join('')}
async function openDetail(id){let p=DATA.projects.find(x=>x.id==id),h=await fetch('/api/history?project='+id).then(r=>r.json());home.style.display='none';detail.classList.add('open');dname.textContent=p.name;dgoal.textContent=p.goal;dprogress.textContent=p.progress+'%';dbar.style.width=p.progress+'%';dbar.style.background=p.accent;milestones.innerHTML=p.milestones.map(m=>`<div class="row" style="padding:8px 0;border-bottom:1px solid #27272a"><span>${m[0]}</span><b>${m[1]?'✓ Done':'○ Next'}</b></div>`).join('');graph(h,p.accent);firstdate.textContent=h[0]?.date||'History starts now';lastdate.textContent=h.at(-1)?.date||'';timeline.innerHTML=h.slice(-8).reverse().map(x=>`<div class="event"><b>${x.progress}% · ${x.date}</b><div class="muted">${x.message||x.hash}</div></div>`).join('')}
function closeDetail(){detail.classList.remove('open');home.style.display='block'}refresh();setInterval(refresh,15000)
</script></main></body></html>
